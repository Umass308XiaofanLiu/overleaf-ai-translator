    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

body { font-family: 'Inter', sans-serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }

/* Custom Scrollbar */
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

/* KaTeX Display Math */
.katex-display {
    margin: 0.75em 0;
    padding: 0.75em;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    overflow-x: auto;
    text-align: center;
}

/* Prose code style fix */
.prose :where(code):not(:where([class~="not-prose"], [class~="not-prose"] *))::before,
.prose :where(code):not(:where([class~="not-prose"], [class~="not-prose"] *))::after {
    content: "";
}

/* Settings 弹窗拖拽调宽手柄：常态半透明一条细线，hover/拖拽时高亮 */
.settings-resize-handle {
    background: transparent;
    transition: background-color 0.15s ease;
}
.settings-resize-handle::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 2px;
    width: 2px;
    height: 32px;
    transform: translateY(-50%);
    border-radius: 2px;
    background: #cbd5e1;
}
.settings-resize-handle:hover,
.settings-resize-handle:active {
    background: rgba(99, 102, 241, 0.12);
}
.settings-resize-handle:hover::after,
.settings-resize-handle:active::after {
    background: #6366f1;
}
/* 拖拽过程中禁止选中文字，光标全局保持左右拖拽箭头 */
body.is-resizing-settings-modal {
    cursor: ew-resize !important;
    user-select: none !important;
}
body.is-resizing-settings-modal * {
    user-select: none !important;
}

</style>

<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script>
// ==================== STATE.JS ====================
// ========================================
// state.js - 全局状态管理
// ========================================

// ============= 在线模型目录：单一事实源 =============
// 内置种子目录。它是「离线 / 未填 Key / 刷新失败」时的唯一兜底，永久保留，不要删。
// 以后手动加模型只需改这一处；想跟上厂商更新，直接点 Settings 里的「更新」按钮从各家 API 拉取。
// tier 只影响图标与配色（lite=Rocket / fast=Zap / pro=Cpu），不影响调用。
// short 是顶栏按钮上的短标签，保留原来手写的字面量，保证重构后显示逐字不变。
const DEFAULT_MODEL_CATALOG = [
    { id: 'gemini-2.5-flash-lite',      name: 'Gemini 2.5 Flash Lite', sub: 'Fast & Cheap',         short: '2.5 Lite',   provider: 'gemini', tier: 'lite' },
    { id: 'gemini-3-flash-preview',     name: 'Gemini 3 Flash',        sub: 'Speed + Intelligence', short: '3 Flash',    provider: 'gemini', tier: 'fast' },
    // gemini-3-pro-preview 已被官方列入 Previous models「(Shut down)」（ai.google.dev/gemini-api/docs/models，
    // 2026-08-14 核对），调用会失败且定价页已无对应行；当前在售的 Pro 档 preview 是 gemini-3.1-pro-preview。
    { id: 'gemini-3.1-pro-preview',     name: 'Gemini 3.1 Pro',        sub: 'Best Quality',         short: '3.1 Pro',    provider: 'gemini', tier: 'pro'  },
    { id: 'gpt-5-nano',                 name: 'GPT-5 Nano',            sub: 'Ultra Fast & Light',   short: 'GPT-5 Nano', provider: 'openai', tier: 'lite' },
    { id: 'gpt-5-mini',                 name: 'GPT-5 Mini',            sub: 'Fast & Balanced',      short: 'GPT-5 Mini', provider: 'openai', tier: 'fast' },
    { id: 'gpt-5.2',                    name: 'GPT-5.2',               sub: 'Best Quality',         short: 'GPT-5.2',    provider: 'openai', tier: 'pro'  },
    { id: 'claude-haiku-4-5-20251001',  name: 'Claude Haiku 4.5',      sub: 'Fast & Efficient',     short: 'Haiku',      provider: 'claude', tier: 'lite' },
    { id: 'claude-sonnet-4-5-20250929', name: 'Claude Sonnet 4.5',     sub: 'Balanced Performance', short: 'Sonnet 4.5', provider: 'claude', tier: 'fast' },
    { id: 'claude-opus-4-5-20251101',   name: 'Claude Opus 4.5',       sub: 'Best Quality',         short: 'Opus 4.5',   provider: 'claude', tier: 'pro'  }
];

const MODEL_PROVIDERS = ['gemini', 'openai', 'claude'];
const MODEL_PROVIDER_LABEL = { gemini: 'Google Gemini', openai: 'OpenAI', claude: 'Anthropic Claude' };

// 缓存超过 7 天只改文案（提示「已过期」），绝不清空数据
const MODEL_CATALOG_TTL = 7 * 24 * 60 * 60 * 1000;
const MODEL_CATALOG_LS_KEY = 'onlineModelCatalog';
const MODEL_CATALOG_SCHEMA_VERSION = 1;

// 安全闸：只有匹配这个白名单的 id 才允许进入目录。
// 原因：escapeHtml() 走 textContent→innerHTML，**不转义单引号**，而模型 id 会被插进
// onclick="selectModel('openai','${id}')" 这种内联属性上下文。入口白名单 + 渲染处 escapeHtml 双保险。
const SAFE_MODEL_ID = /^[A-Za-z0-9][A-Za-z0-9._:\/-]{0,119}$/;

// 模型 id 过白名单，非法直接丢弃（返回 null）
// ⚠️ 阶段二（计划 步骤 8-15，计划书 843-846 行）里同名函数已在此提前落地，届时请勿重复插入。
function sanitizeModelId(id) {
    const s = String(id || '').trim();
    return SAFE_MODEL_ID.test(s) ? s : null;
}

// Gemini：generateContent 不等于「能聊天」—— 图像生成 / TTS / live 也声明它，必须再按 id 做「白名单 + 黑名单」双重过滤。
// 白名单：只收 gemini-<版本数字>-... 和官方 -latest 别名（gemini-flash-latest / gemini-pro-latest /
//        gemini-flash-lite-latest）；这一条已经把 gemma-* / imagen-* / veo-* / lyria-* / learnlm-* /
//        embedding-* 等非 gemini 前缀家族全部挡在外面，不必再单独列。
// 黑名单：在白名单基础上，命中下列关键词的连字符分段一律排除（image/imagen/tts/audio/live/…），
//        涵盖 nano banana 图像家族、TTS、live/realtime、embedding、robotics、computer-use 等。
//        (?:^|-)...(?:-|$) 是分段匹配，避免误伤未来某个合法模型名里恰好包含这些词根的子串。
const GEMINI_TEXT_ALLOW = /^gemini-\d/;
const GEMINI_TEXT_ALLOW_ALIAS = /^gemini-(?:pro|flash)(?:-lite)?-latest$/;
const GEMINI_NON_TEXT_DENY = /(?:^|-)(?:image|imagen|tts|audio|speech|voice|live|realtime|bidi|dialog|embedding|embed|gecko|robotics|robot|omni|veo|video|vision|computer|cua|lyria|music|rerank|ranker|guard|safety|aqa)(?:-|$)/i;

// Gemini 专用：id 是否是「纯文本对话」模型。fetchGeminiModelList（实时拉取）和 loadOnlineCatalog
// （localStorage 缓存回放）必须共用同一个判定，否则旧缓存里的图像模型 id 会在刷新前一直显示。
function isGeminiTextChatModelId(id) {
    const s = String(id || '');
    if (!(GEMINI_TEXT_ALLOW.test(s) || GEMINI_TEXT_ALLOW_ALIAS.test(s))) return false;
    return !GEMINI_NON_TEXT_DENY.test(s);
}

// OpenAI：/v1/models 响应零能力元数据，只能按 id 做「拒 → 允 → 隔离」三段。
// -pro$ 是最不直觉的一条：gpt-5.2-pro / o1-pro 只走 Responses API，打 chat/completions 会 400/404。
// deep-research：o3-deep-research / o4-mini-deep-research 只走 Responses API 且强制要求
//                web_search 等工具，打 chat/completions 会 400（GEMINI_NON_TEXT_DENY 已经排过同类）。
const OPENAI_DENY = /(^ft:|:ft-|embedding|^text-(similarity|search)|^code-search|whisper|transcrib|(^|[-_])tts([-_]|$)|audio|voice|speech|realtime|live-|dall-e|image|sora|video|moderation|guard|codex|computer-use|deep-research|^(ada|babbage|curie|davinci)(-|$)|-instruct$|search-preview|-pro$|-pro-\d{4}-\d{2}-\d{2}$)/i;
const OPENAI_ALLOW = /^(gpt-[0-9]|chatgpt-|o[1-9]($|[-.]))/i;
const OPENAI_DATED_SNAPSHOT = /-\d{4}-\d{2}-\d{2}$/;

// ============= 模型价格表（内置，非实时拉取）=============
// 单位：美元 / 每 1,000,000 tokens，付费层 Standard 档（非 Batch/Flex/Priority），来自
// ai.google.dev/gemini-api/docs/pricing。目前只有 gemini 桶有数据；openai / claude 先留空对象，
// 以后补价格只需往对应桶里加条目，getModelPrice() / 两处渲染点都不用改。
// 限时促销价**不写死**：promoUntil（含当日的最后一天）+ after（恢复价）是可求值的数据，
// getModelPrice() 到期后会自动改用 after 的数字，避免 2027-01-01 起界面显示的价格只有真实账单一半。
const MODEL_PRICING_AS_OF = '2026-08-14';
const MODEL_PRICING = {
    gemini: {
        'gemini-3.7-flash':       { in: 0.75, out: 3.75,  promoUntil: '2026-12-31', after: { in: 1.50, out: 7.50 } },
        'gemini-3.6-flash':       { in: 0.75, out: 3.75,  promoUntil: '2026-12-31', after: { in: 1.50, out: 7.50 } },
        'gemini-3.5-flash':       { in: 1.50, out: 9.00 },
        'gemini-3.5-flash-lite':  { in: 0.30, out: 2.50 },
        'gemini-3.1-flash-lite':  { in: 0.25, out: 1.50,  note: '音频输入另计 $0.50 / 1M（文本翻译不受影响）' },
        'gemini-3.1-pro-preview': { in: 2.00, out: 12.00, longContext: { over: 200000, in: 4.00, out: 18.00 }, note: '无免费层；preview 模型，转 GA 时价格可能调整' },
        'gemini-3-flash-preview': { in: 0.50, out: 3.00,  note: '音频输入另计 $1.00 / 1M（文本翻译不受影响）；preview 模型' },
        'gemini-2.5-pro':         { in: 1.25, out: 10.00, longContext: { over: 200000, in: 2.50, out: 15.00 } },
        'gemini-2.5-flash':       { in: 0.30, out: 2.50,  note: '音频输入另计 $1.00 / 1M（文本翻译不受影响）' },
        'gemini-2.5-flash-lite':  { in: 0.10, out: 0.40,  note: '音频输入另计 $0.30 / 1M（文本翻译不受影响）' }
    },
    openai: {},   // 预留：结构与 gemini 桶一致，届时直接加 { 'gpt-5.2': { in, out } } 即可
    claude: {}    // 预留：同上
};

// 前缀继承的**尾巴白名单**。规则：宁可少显示一个价，也绝不能显示一个错价。
// 只有「同价变体」后缀才允许继承母模型价格 —— preview/exp/latest/thinking 这类标记、
// 以及纯日期快照（-2026-09-01 / -09-2026 / -001）。其余一律视为不同档位，返回 null。
// 反例（必须拦住）：gemini-3.7-flash-lite 不能继承 gemini-3.7-flash —— Google 每代 flash 都会
// 补一个 -lite，而 lite 价常只有 flash 的 1/3~1/6（3.5-flash $1.50/$9.00 vs 3.5-flash-lite $0.30/$2.50）。
const PRICE_KEY_TAIL_OK = /^(?:-(?:preview|exp|latest|thinking|customtools|\d{4}-\d{2}-\d{2}|\d{2}-\d{4}|\d{3}))+$/;

// 促销价求值：promoUntil 当天结束前用促销价，之后自动切到 after 的恢复价。
// 无 promoUntil 的条目原样返回。note 由这里合成，保证 UI 文案与实际取用的数字永远一致。
function resolvePromoPrice(price) {
    if (!price || !price.promoUntil || !price.after) return price;
    const expired = Date.now() > new Date(price.promoUntil + 'T23:59:59').getTime();
    const base = expired ? price.after : price;
    const promoNote = expired
        ? `限时价已于 ${price.promoUntil} 到期，此处显示的是恢复后的正常价`
        : `限时价，${price.promoUntil} 之后恢复为 输入 ${formatPriceUsd(price.after.in)} / 输出 ${formatPriceUsd(price.after.out)}`;
    return Object.assign({}, price, {
        in: base.in,
        out: base.out,
        promoExpired: expired,
        note: price.note ? `${promoNote}；${price.note}` : promoNote
    });
}

// 按 id 找价格，最长前缀匹配 + 尾巴白名单校验：id 必须以某个表内 key 开头，多个匹配取最长的那个，
// 且 key 之后剩下的那一段必须命中 PRICE_KEY_TAIL_OK（或完全相等）才认。
// 找不到 / 尾巴不合法都返回 null —— 调用方必须把 null 当成「未知」处理，绝不能编造价格。
function getModelPrice(id) {
    const s = String(id || '');
    let best = null; // { provider, key, price }
    MODEL_PROVIDERS.forEach(function (p) {
        const bucket = MODEL_PRICING[p];
        if (!bucket) return;
        Object.keys(bucket).forEach(function (key) {
            if (s.indexOf(key) !== 0) return;   // s 必须以 key 开头
            const tail = s.slice(key.length);
            if (tail !== '' && !PRICE_KEY_TAIL_OK.test(tail)) return;
            if (!best || key.length > best.key.length) best = { provider: p, key: key, price: bucket[key] };
        });
    });
    if (!best) return null;
    return resolvePromoPrice(Object.assign({ id: best.key, provider: best.provider }, best.price));
}

// 统一价格数字的显示形式：固定两位小数（$0.1 → $0.10），JS 数字字面量会吞掉末尾 0
function formatPriceUsd(n) {
    return `$${Number(n).toFixed(2)}`;
}

// 顶栏下拉 / 设置勾选框共用的紧凑价格文案，如 "入$0.10 出$0.40 /1M"。
// 单位与口径必须写在**可见文字**里：title 属性在手机 / 平板上根本不触发，只靠悬停会让用户
// 把 "$0.10/$0.40" 误读成「每次请求」或「每 1K tokens」，量级差 1000 倍。
// 结尾的 * 表示这是限时促销价（含义写在下拉图例和设置区脚注里）。
function formatPriceCompact(price) {
    if (!price) return '价格未知';
    const promo = (price.promoUntil && !price.promoExpired) ? '*' : '';
    return `入${formatPriceUsd(price.in)} 出${formatPriceUsd(price.out)} /1M${promo}`;
}

// 悬浮提示用的完整价格说明，含长上下文分档、备注、数据口径
function formatPriceTitle(price) {
    if (!price) return '价格未知（不在内置价格表中，多为 OpenAI/Claude 或尚未收录的新模型）';
    let s = `美元 / 每 1,000,000 tokens：输入 ${formatPriceUsd(price.in)} / 输出 ${formatPriceUsd(price.out)}（付费层标准档，非 Batch/Flex/Priority）`;
    if (price.longContext) {
        s += `；prompt 超过 ${price.longContext.over / 1000}k tokens 时：输入 ${formatPriceUsd(price.longContext.in)} / 输出 ${formatPriceUsd(price.longContext.out)}（整个 prompt 按高档计价，非仅超出部分）`;
    }
    if (price.note) s += `；${price.note}`;
    s += `。价格为内置表（非 API 实时返回），截至 ${MODEL_PRICING_AS_OF}；推理/思考 token 按输出价计费，实际成本可能高于可见译文估算。`;
    return s;
}

// 刷新失败的中文短语（芯片正文用；API 原文放在 title 属性里）
const MODEL_ERROR_TEXT = {
    NO_KEY: '未配置 API Key',
    AUTH: 'Key 无效或无权限',
    RATE: '限流 · 额度不足',
    CORS: '被浏览器拦截或断网',
    TIMEOUT: '请求超时',
    PROXY_SHAPE: '代理不支持列表接口',
    EMPTY: '返回 0 个，已保留原列表',
    HTTP: '请求失败'
};

// Settings 弹窗默认宽度（px）。拖拽调整后的值持久化在 AppState.settingsModalWidth /
// localStorage['settingsModalWidth']，双击拖拽手柄可回到这个默认值。
const SETTINGS_MODAL_DEFAULT_WIDTH = 780;
const SETTINGS_MODAL_MIN_WIDTH = 480;
const SETTINGS_MODAL_MAX_WIDTH = 1400;
// 把任意数字夹到合法范围内；越界或非数字一律回退到默认宽度，避免脏 localStorage 值
// 把弹窗渲染成 5px 宽或 90000px 宽。视口过窄时由渲染时的 CSS min(...vw) 兜底，这里不依赖 window。
function clampSettingsModalWidth(w) {
    const n = Math.round(Number(w));
    if (!Number.isFinite(n)) return SETTINGS_MODAL_DEFAULT_WIDTH;
    return Math.max(SETTINGS_MODAL_MIN_WIDTH, Math.min(SETTINGS_MODAL_MAX_WIDTH, n));
}
// 拖拽过程中的“正在进行时”宽度（未提交进 AppState/localStorage）。渲染函数会优先读这个值，
// 这样即使拖拽中途因为 toast/刷新等原因触发了一次 setState 全量重渲染，宽度也不会跳回上一次
// 已提交的值——mouseup 才会把这里的值落盘进 AppState + localStorage，然后清回 null。
let settingsModalDragWidth = null;

const AppState = {
    // 输入输出状态
    inputText: "",
    originalInputText: "",  // 保存原始粘贴的内容
    translationPairs: [],
    sourceLang: "zh",
    targetLang: "en",

    // 功能开关
    isAutoDetect: true,
    isAutoTranslate: true,
    isLoading: false,
    isEditingMode: true,
    viewMode: 'edit',  // 'edit' | 'preview' | 'original'
    error: null,

    // API配置
    apiProvider: 'gemini', // 'gemini' | 'openai' | 'claude' | 'local'
    selectedModel: DEFAULT_MODEL_CATALOG[0].id,
    geminiApiKey: "", // Gemini API Key
    openaiApiKey: "", // OpenAI API Key
    claudeApiKey: "", // Claude API Key
    claudeProxyUrl: "", // Claude Proxy URL (Cloudflare Worker)
    localBaseUrl: "http://localhost:1234",
    localModels: [],
    // 在线模型目录的 API 拉取结果，按 provider 分桶。
    // 空数组 = 从未成功拉取过，getModelCatalog() 自动落回 DEFAULT_MODEL_CATALOG。
    fetchedModels: { gemini: [], openai: [], claude: [] },

    // 编辑状态
    activeIndex: null,
    editValues: { src: "", tgt: "" },
    refinePrompt: "",
    isRefining: false,
    customPrompts: { grammar: "", simplify: "" },

    // Toast 提示
    toast: null, // { message: string, type: 'info' | 'success' | 'warning' }

    // AI Insight
    aiInsight: null,
    isInsightLoading: false,

    // 同义词状态
    synonymState: {
        show: false,
        loading: false,
        originalText: "",
        history: [],
        pageIndex: 0,
        position: { x: 0, y: 0 },
        selectionRange: { start: 0, end: 0 },
        field: null,
        contextSentence: ""
    },

    // 历史记录
    globalHistory: [],
    sessionId: Date.now().toString(),
    autoSaveInterval: 5 * 60 * 1000,
    historyLimit: 5,

    // UI菜单状态
    showModelMenu: false,
    showHistoryMenu: false,
    showSaveMenu: false,
    showLocalSettings: false,
    showSettings: false, // 新增：设置弹窗状态
    isConnectingLocal: false,

    // 在线模型刷新状态：每家独立结算，互不影响
    // status: 'idle'(从未拉过) | 'loading' | 'ok' | 'error'
    // source: 'builtin'(内置列表) | 'cache'(localStorage) | 'live'(本次刚拉到)
    modelRefresh: {
        gemini: { status: 'idle', at: 0, count: 0, errCode: null, errMsg: '', source: 'builtin' },
        openai: { status: 'idle', at: 0, count: 0, errCode: null, errMsg: '', source: 'builtin' },
        claude: { status: 'idle', at: 0, count: 0, errCode: null, errMsg: '', source: 'builtin' }
    },
    settingsModelQuery: '',   // 设置弹窗里的模型搜索关键词
    showDatedSnapshots: false, // 是否保留 OpenAI 的 -YYYY-MM-DD 固定快照（下次更新生效）
    newlyFoundIds: [],         // 本次刷新新发现的 id，用于 NEW 徽标和「全部显示」
    settingsModalWidth: SETTINGS_MODAL_DEFAULT_WIDTH, // Settings 弹窗宽度（px），拖拽手柄调整后持久化

// 默认Prompt常量
const DEFAULT_GRAMMAR_PROMPT = "Check the grammar of the following text and correct it if necessary. Keep the academic tone.";
const DEFAULT_SIMPLIFY_PROMPT = "Rewrite the following sentence to be MORE DIRECT, CONCISE, and SIMPLE to read. Keep the original meaning. STRICTLY PRESERVE all LaTeX math and citations.";

// 语言检测
function detectLanguage(text) {
    const zhMatch = text.match(/[\u4e00-\u9fa5]/g);
    const enMatch = text.match(/[a-zA-Z]/g);
    return (zhMatch?.length || 0) >= (enMatch?.length || 0)
        ? { src: 'zh', tgt: 'en' }
        : { src: 'en', tgt: 'zh' };
}

// LaTeX清理辅助函数
function stripCommand(str, cmd) {
    let result = str;
    while (true) {
        const pattern = new RegExp(`\\\\${cmd}(?:\\*)?\\s*\\{`);
        const match = pattern.exec(result);
        if (!match) break;
        const startIndex = match.index;
        const openBraceIndex = startIndex + match[0].length - 1;
        let depth = 1;
        let endIndex = -1;
        for (let i = openBraceIndex + 1; i < result.length; i++) {
            if (result[i] === '{') depth++;
            else if (result[i] === '}') depth--;
            if (depth === 0) { endIndex = i; break; }
        }
        if (endIndex !== -1) {
            result = result.substring(0, startIndex) + result.substring(endIndex + 1);
        } else { break; }
    }
    return result;
}

function cleanLatex(formula) {
    let clean = formula;
    clean = clean.replace(/(^|[^\\])%.*$/gm, '$1');
    clean = clean.replace(/\\\[\s*(\d+(?:\.\d+)?(?:pt|em|ex|cm|mm|in|pc|px))\s*\]/g, '\\\\[$1]');
    return clean;
}

// 渲染格式化文本（支持Markdown和LaTeX）
function renderFormattedText(text) {
    if (!text || !window.marked || !window.katex) return text || '';
    
    let content = text.replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, ' ');
    const placeholders = [];
    
    const pushPlaceholder = (regex, type, getFormula) => {
        content = content.replace(regex, (...args) => {
            const match = args[0];
            const id = `%%LATEX_${placeholders.length}%%`;
            let formula = getFormula(...args);
            formula = cleanLatex(formula);
            formula = stripCommand(formula, 'label');
            formula = stripCommand(formula, 'tag');
            try {
                const rendered = window.katex.renderToString(formula, {
                    displayMode: type === 'display',
                    throwOnError: false,
                    trust: true,
                    strict: false,
                    fleqn: false
                });
                placeholders.push({ id, html: rendered });
            } catch (e) {
                placeholders.push({ id, html: match });
            }
            return id;
        });
    };
    
    pushPlaceholder(/\\begin\{([\w\*]+)\}([\s\S]*?)\\end\{\1\}/g, 'display', (match, env, body) => {
        // 将带编号的环境转换为不带编号的版本
        const envMap = {
            'equation': 'equation*',
            'align': 'align*',
            'gather': 'gather*',
            'multline': 'multline*',
            'eqnarray': 'eqnarray*'
        };
        const noNumberEnv = envMap[env] || env;
        return `\\begin{${noNumberEnv}}${body}\\end{${noNumberEnv}}`;
    });
    pushPlaceholder(/\\\[([\s\S]*?)\\\]/g, 'display', (match, p1) => p1);
    pushPlaceholder(/\$\$([\s\S]*?)\$\$/g, 'display', (match, p1) => p1);
    pushPlaceholder(/\\\(([\s\S]*?)\\\)/g, 'inline', (match, p1) => p1);
    pushPlaceholder(/\$([^\$]+?)\$/g, 'inline', (match, p1) => p1);
    
    let html = window.marked.parse(content);
    placeholders.forEach(p => { html = html.replace(p.id, p.html); });
    return html;
}

// Gemini API端点
const GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta/models";

// OpenAI API端点
const OPENAI_API_BASE = "https://api.openai.com/v1/chat/completions";

// Claude API端点
const CLAUDE_API_BASE = "https://api.anthropic.com/v1/messages";

// ============= 本地LLM调用（OpenAI兼容）=============
async function callLocalLLM(baseUrl, model, messages, jsonMode = false, signal = null) {
    const body = {
        model: model || "local-model",
        messages: messages,
        temperature: 0.3,
        max_tokens: 4096
    };

    // LM Studio的JSON模式
    if (jsonMode) {
        body.response_format = { type: "json_object" };
    }

    // 构建endpoint - 直接使用/v1/chat/completions
    const endpoint = `${baseUrl.replace(/\/$/, "")}/v1/chat/completions`;

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal
        });

        if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        return data.choices?.[0]?.message?.content || "";
    } catch (error) {
        if (error.name === 'AbortError') throw error;
        throw error;
    }
}

// 获取本地模型列表
async function fetchLocalModels(baseUrl) {
    // 直接使用/v1/models端点，不设置Content-Type（GET请求不需要）
    const endpoint = `${baseUrl.replace(/\/$/, "")}/v1/models`;

    try {
        const response = await fetch(endpoint);

        if (!response.ok) {
            throw new Error(`Failed to fetch models: ${response.status}`);
        }

        const data = await response.json();
        return data.data || [];
    } catch (error) {
        console.error("Fetch models error:", error);
        throw new Error(`无法连接到 ${baseUrl}。请确保 LM Studio 服务器正在运行。`);
    }
}

// ============= 在线模型列表拉取（三家各自的 /models 端点）=============
// 三家都实测可以从浏览器直连（含 file:// 打开，Origin: null），不需要任何代理。
// 三条铁律，改代码时不要违反：
//   1) Gemini 这个 GET 不许加任何自定义头 —— 该域 Access-Control-Allow-Headers 只放行
//      x-goog-api-key，多加 Content-Type / Api-Revision 会 preflight 403 且不带 ACAO。
//   2) 三家都不许设 credentials:'include' —— 服务端回 ACAO:*，规范禁止该组合，浏览器会硬失败，
//      报错长得和「服务挂了」一模一样。
//   3) Claude 必须带 anthropic-dangerous-direct-browser-access: true —— 这个头就是 CORS 开关本身：
//      带它响应有 ACAO:*，不带它响应完全没有 ACAO，浏览器只抛无状态码的 TypeError。
//      它没写进 Anthropic REST 官方参考（只通过官方 TS SDK 的 dangerouslyAllowBrowser 间接暴露），
//      自 2024-08 稳定至今。**别当脏代码删掉。**

const OPENAI_MODELS_API = "https://api.openai.com/v1/models";
const CLAUDE_MODELS_API = "https://api.anthropic.com/v1/models";
const MODEL_FETCH_TIMEOUT = 15000;

// 带 15 秒超时的 fetch（三家共用）
// ⚠️ 刻意**不**在响应头到达时 clearTimeout：fetch 的 promise 在拿到响应头那一刻就 settle，
// 若那时清掉计时器，后面 `await response.json()` 读 body 就完全裸奔 —— 服务端回了 200 头
// 却挂住 body（代理超时 / Worker 半死 / 网络挂起）时 json() 永不 resolve，
// Promise.allSettled 永不 settle，三家状态会永远停在 loading、刷新按钮永久 disabled。
// 保留计时器让 abort 覆盖「发请求 + 读 body」整个窗口：超时会中断 body 流，json() 抛
// AbortError → classifyModelFetchError 归类成 TIMEOUT。请求已完成后再 abort() 是无害的空操作。
function fetchWithTimeout(url, options = {}, ms = MODEL_FETCH_TIMEOUT) {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return fetch(url, { ...options, signal: controller.signal });
}

// 带错误码的 Error（错误码 → MODEL_ERROR_TEXT 里的中文人话）
function modelFetchError(errCode, errMsg) {
    const e = new Error(errMsg);
    e.code = errCode;
    return e;
}

// 注：sanitizeModelId(id) 已在文件靠前处定义（SAFE_MODEL_ID 之后），此处复用，不重复定义。

// OpenAI 的 /v1/models 不返回 display_name，只能从 id 合成人类可读名字。
// 规则刻意保守：只做首段大写 + 后续连字符转空格，其余原样保留。
function prettifyModelId(id) {
    const raw = String(id);
    const parts = raw.split('-');
    let head = parts.shift() || raw;
    if (/^gpt$/i.test(head)) head = 'GPT';
    else if (/^chatgpt$/i.test(head)) head = 'ChatGPT';
    else if (/^o\d+$/i.test(head)) head = head.toLowerCase();
    else head = head.charAt(0).toUpperCase() + head.slice(1);
    if (parts.length === 0) return head;
    const rest = parts.map(p => /^[a-z]+$/.test(p) ? p.charAt(0).toUpperCase() + p.slice(1) : p);
    return head + '-' + rest.join(' ');
}

// HTTP 响应 → 错误码 + 中文短语（json 已解析成对象或 null）
function classifyModelHttpError(status, json) {
    // 截断：厂商/代理可能回一整页 HTML 错误页，原文会被塞进芯片的 title 属性
    const apiMsg = String((json && ((json.error && (json.error.message || json.error.type)) || json.message)) || '').slice(0, 200);
    if (status === 401 || status === 403) {
        return { errCode: 'AUTH', errMsg: apiMsg || 'API Key 无效或无权限' };
    }
    if (status === 429) {
        return { errCode: 'RATE', errMsg: apiMsg || '触发限流或额度不足，请稍后重试' };
    }
    if (status === 400 && /API_KEY_INVALID|API key not valid/i.test(apiMsg)) {
        return { errCode: 'AUTH', errMsg: apiMsg };
    }
    // 极简 Cloudflare Worker 常把 GET 改写成 POST /v1/messages，Anthropic 就会回这个 400。
    // 不识别它的话，用户会把「代理形状不对」误诊成「我的 Key 有问题」。
    if (status === 400 && /messages/i.test(apiMsg) && /required/i.test(apiMsg)) {
        return { errCode: 'PROXY_SHAPE', errMsg: '你的 Worker 只转发 POST /v1/messages，无法用于获取模型列表' };
    }
    return { errCode: 'HTTP', errMsg: apiMsg ? `HTTP ${status} - ${apiMsg}` : `HTTP ${status}` };
}

// 各种异常 → 统一错误码 + 中文人话
function classifyModelFetchError(err) {
    if (err && err.code) return { errCode: err.code, errMsg: err.message || '' };
    if (err && err.name === 'AbortError') return { errCode: 'TIMEOUT', errMsg: '请求超时（15 秒）' };
    const raw = String((err && err.message) || err || '');
    if (err instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(raw)) {
        return { errCode: 'CORS', errMsg: '浏览器被拦截（CORS 或断网），未拿到任何响应' };
    }
    return { errCode: 'HTTP', errMsg: raw || '未知错误' };
}

// —— Google Gemini ——
// GET ${GEMINI_API_BASE}?key=...&pageSize=1000
// 必须显式传 pageSize：默认只有 50 条，而当前目录超过 50 条，不传会**静默截断**、漏掉最新模型。
// 纯 GET + query 参数 = simple request，零 preflight。
async function fetchGeminiModelList(apiKey) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 Gemini API Key');

    const raw = [];
    let pageToken = '';
    for (let page = 0; page < 5; page++) {   // 上限 5 页，防跑飞
        const url = `${GEMINI_API_BASE}?key=${encodeURIComponent(apiKey)}&pageSize=1000`
                  + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
        const response = await fetchWithTimeout(url);   // 不加任何自定义头
        if (!response.ok) {
            const errJson = await response.json().catch(() => null);
            const info = classifyModelHttpError(response.status, errJson);
            throw modelFetchError(info.errCode, info.errMsg);
        }
        const data = await response.json();
        raw.push(...(data.models || []));
        pageToken = data.nextPageToken || '';
        if (!pageToken) break;
    }

    return raw
        // 线上字段名是 supportedGenerationMethods；supportedActions 只存在于 SDK 对象里，
        // 读错会导致全部被过滤掉、列表为空，所以两个都兜一手
        .filter(m => (m.supportedGenerationMethods || m.supportedActions || []).includes('generateContent'))
        .map(m => {
            // 不剥 "models/" 前缀会拼出 /v1beta/models/models/xxx:generateContent → 404
            const id = sanitizeModelId(String(m.name || '').replace(/^models\//, ''));
            if (!id) return null;
            return { id, name: m.displayName || id, provider: 'gemini', group: 'chat', created: '' };
        })
        // 图像生成 / TTS / live 也声明 generateContent，只靠上面那级会让用户选到图像模型来翻译
        .filter(m => m && isGeminiTextChatModelId(m.id))
        .sort((a, b) => a.id.localeCompare(b.id));
}

// —— OpenAI ——
// GET https://api.openai.com/v1/models，唯一必需头 Authorization: Bearer。
// 无分页（listModels 在 OpenAPI 规格里零参数，响应体只有 {object,data}），一次拿全。
async function fetchOpenaiModelList(apiKey, hideSnapshots) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 OpenAI API Key');

    const response = await fetchWithTimeout(OPENAI_MODELS_API, {
        method: "GET",
        headers: { "Authorization": `Bearer ${apiKey}` }
        // 不要加 credentials:'include'，服务端回 ACAO:* 会硬失败
    });
    if (!response.ok) {
        const errJson = await response.json().catch(() => null);
        const info = classifyModelHttpError(response.status, errJson);
        throw modelFetchError(info.errCode, info.errMsg);
    }

    const json = await response.json();
    const all = Array.isArray(json.data) ? json.data : [];

    return all
        .filter(m => m && typeof m.id === 'string')
        .filter(m => !OPENAI_DENY.test(m.id))
        .filter(m => !(hideSnapshots && OPENAI_DATED_SNAPSHOT.test(m.id)))
        .map(m => {
            const id = sanitizeModelId(m.id);
            if (!id) return null;
            return {
                id,
                name: prettifyModelId(id),
                provider: 'openai',
                created: m.created || 0,
                // 过了硬拒但没过 ALLOW 的新家族（如 daybreak-*）进隔离区：渲染但默认不勾选。
                // 这是抗陈旧的逃生口 —— 纯白名单对每个新发布家族都是零日盲区。
                group: OPENAI_ALLOW.test(id) ? 'chat' : 'other'
            };
        })
        .filter(Boolean)
        .sort((a, b) => (b.created || 0) - (a.created || 0));
}

// —— Anthropic Claude ——
// 主路直连 GET https://api.anthropic.com/v1/models?limit=1000
// limit 默认 20 而目录就在 15-25 条这个量级，必须传 1000 并跟 has_more/last_id。
// 直连失败且用户配了 proxyUrl 时才降级走代理 —— 极简 Worker 通常硬编码 POST /v1/messages，
// 大概率失败，所以只作二选路，且对非 JSON 响应容错。
async function fetchClaudeModelList(apiKey, proxyUrl) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 Claude API Key');

    const collected = [];
    let afterId = '';
    try {
        for (let page = 0; page < 10; page++) {
            const url = `${CLAUDE_MODELS_API}?limit=1000` + (afterId ? `&after_id=${encodeURIComponent(afterId)}` : '');
            const response = await fetchWithTimeout(url, {
                method: "GET",
                headers: {
                    "x-api-key": apiKey,
                    "anthropic-version": "2023-06-01",
                    // ↓ 这个头就是 CORS 开关本身，删掉它浏览器会直接抛无状态码的 Failed to fetch
                    "anthropic-dangerous-direct-browser-access": "true"
                }
            });
            if (!response.ok) {
                const errJson = await response.json().catch(() => null);
                const info = classifyModelHttpError(response.status, errJson);
                throw modelFetchError(info.errCode, info.errMsg);
            }
            const json = await response.json();
            collected.push(...(json.data || []));
            if (!json.has_more || !json.last_id) break;
            afterId = json.last_id;
        }
    } catch (directErr) {
        const direct = classifyModelFetchError(directErr);
        // Key 本身不对，或者根本没配代理 —— 没必要再试代理
        if (direct.errCode === 'AUTH' || direct.errCode === 'NO_KEY' || !proxyUrl) throw directErr;

        const base = String(proxyUrl).replace(/\/+$/, "").replace(/\/v1\/messages$/, "");
        let proxyJson = null;
        try {
            const res = await fetchWithTimeout(`${base}/v1/models?limit=1000`, {
                method: "GET",
                headers: { "x-api-key": apiKey, "anthropic-version": "2023-06-01" }
            });
            proxyJson = await res.json().catch(() => null);   // Worker 可能返回 HTML 错误页
            if (!res.ok) {
                const info = classifyModelHttpError(res.status, proxyJson);
                throw modelFetchError(info.errCode === 'HTTP' ? 'PROXY_SHAPE' : info.errCode, info.errMsg);
            }
        } catch (proxyErr) {
            if (proxyErr && proxyErr.code) throw proxyErr;
            throw modelFetchError('PROXY_SHAPE', '代理不支持模型列表请求（它可能只转发 POST /v1/messages），建议直连');
        }
        if (!proxyJson || !Array.isArray(proxyJson.data)) {
            throw modelFetchError('PROXY_SHAPE', '代理返回的不是模型列表格式，建议直连');
        }
        collected.push(...proxyJson.data);
    }

    return collected
        // Anthropic 公开 API 没有 embedding/TTS/图像/审核模型，只做形状校验。
        // 绝不按 capabilities 过滤 —— 它在 schema 里可为 null，老模型会被误杀。
        .filter(m => m && m.type === 'model' && typeof m.id === 'string')
        .map(m => {
            const id = sanitizeModelId(m.id);
            if (!id) return null;
            return { id, name: m.display_name || id, provider: 'claude', group: 'chat', created: m.created_at || '' };
        })
        .filter(Boolean);
}

// 解析JSON响应（处理可能的markdown包裹）
function parseJsonResponse(text) {
    // 检查空响应
    if (!text || text.trim() === '') {
        console.error('parseJsonResponse: Empty response received');
        throw new Error('无法解析 JSON 响应: 收到空响应');
    }

    let clean = text.trim();

    // 移除 markdown 代码块
    if (clean.startsWith('```json')) clean = clean.slice(7);
    else if (clean.startsWith('```')) clean = clean.slice(3);
    if (clean.endsWith('```')) clean = clean.slice(0, -3);
    clean = clean.trim();

    try {
        return JSON.parse(clean);
    } catch (e) {
        // 尝试提取JSON对象
        const match = clean.match(/\{[\s\S]*\}/);
        if (match) {
            try { return JSON.parse(match[0]); } catch (e2) {}
        }
        // 尝试提取JSON数组
        const arrayMatch = clean.match(/\[[\s\S]*\]/);
        if (arrayMatch) {
            try {
                const arr = JSON.parse(arrayMatch[0]);
                return { translations: arr };
            } catch (e3) {}
        }
        console.error('parseJsonResponse failed. Raw response:', text.substring(0, 500));
        throw new Error('无法解析 JSON 响应');
    }
}

// ============= Gemini API调用 =============
async function callGeminiAPI(model, contents, config = {}, apiKey = null, signal = null) {
    if (!apiKey) {
        throw new Error("Gemini API Key not configured. Please add your API key in Settings.");
    }

    const url = `${GEMINI_API_BASE}/${model}:generateContent?key=${apiKey}`;

    const body = {
        contents: [{ parts: [{ text: contents }] }],
        generationConfig: {
            temperature: config.temperature || 0.3
        }
    };

    if (config.systemInstruction) {
        body.systemInstruction = { parts: [{ text: config.systemInstruction }] };
    }

    if (config.responseMimeType) {
        body.generationConfig.responseMimeType = config.responseMimeType;
    }

    if (config.responseSchema) {
        body.generationConfig.responseSchema = config.responseSchema;
    }

    const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Gemini API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

// ============= OpenAI API调用 =============
// 需要特殊参数处理的新模型（不支持自定义 temperature，且用 max_completion_tokens 而非 max_tokens）
// 原数组降级为补充白名单，主判定改成规则匹配 —— 否则「更新」按钮拉回来的任何新模型
// （gpt-5.4 / gpt-6 / o5 …）都会走旧分支被塞 temperature + max_tokens 而 400。
const OPENAI_NEW_MODELS = ['gpt-5-nano', 'gpt-5-mini', 'gpt-5.2', 'o1', 'o1-mini', 'o1-preview', 'o3', 'o3-mini'];
const OPENAI_NEW_MODEL_PATTERN = /^(gpt-[5-9]|gpt-\d{2}|o[1-9])/i;

function isNewOpenAIModel(model) {
    const id = String(model || '');
    return OPENAI_NEW_MODEL_PATTERN.test(id) || OPENAI_NEW_MODELS.some(m => id.startsWith(m));
}

// 根据模型获取合适的 max tokens 限制
function getMaxTokensForModel(model, configMax) {
    if (configMax) return configMax;
    const id = String(model || '');
    // Nano 模型使用较小的 token 限制
    if (id.includes('nano')) return 2048;
    // Mini 模型使用中等限制
    if (id.includes('mini')) return 4096;
    // 其他模型使用默认值
    return 4096;
}

async function callOpenAIAPI(model, messages, config = {}, apiKey = null, signal = null) {
    if (!apiKey) {
        throw new Error("OpenAI API Key not configured. Please add your API key in Settings.");
    }

    const body = {
        model: model,
        messages: messages
    };

    // 新模型不支持自定义 temperature，只支持默认值 1
    if (!isNewOpenAIModel(model)) {
        body.temperature = config.temperature || 0.3;
    }

    // 新模型使用 max_completion_tokens，旧模型使用 max_tokens
    const maxTokens = getMaxTokensForModel(model, config.max_tokens);
    if (isNewOpenAIModel(model)) {
        body.max_completion_tokens = maxTokens;
    } else {
        body.max_tokens = maxTokens;
    }

    // 如果需要JSON响应（新模型不支持 response_format，通过 prompt 指示返回 JSON）
    if (config.jsonMode && !isNewOpenAIModel(model)) {
        body.response_format = { type: "json_object" };
    }

    const response = await fetch(OPENAI_API_BASE, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`OpenAI API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    return data.choices?.[0]?.message?.content || "";
}

// ============= Claude API调用 =============
// Claude 模型 token 限制
function getMaxTokensForClaudeModel(model, configMax) {
    if (configMax) return configMax;
    // Haiku 模型使用较小的 token 限制
    if (model.includes('haiku')) return 4096;
    // Sonnet 和 Opus 使用较大限制
    return 8192;
}

async function callClaudeAPI(model, messages, config = {}, apiKey = null, signal = null, proxyUrl = null) {
    if (!apiKey) {
        throw new Error("Claude API Key not configured. Please add your API key in Settings.");
    }

    if (!proxyUrl) {
        throw new Error("Claude Proxy URL not configured. Please add your Cloudflare Worker proxy URL in Settings.");
    }

    // 提取 system message（Claude 使用单独的 system 参数）
    let systemPrompt = null;
    const userMessages = [];

    for (const msg of messages) {
        if (msg.role === 'system') {
            systemPrompt = msg.content;
        } else {
            userMessages.push({
                role: msg.role,
                content: msg.content
            });
        }
    }

    const body = {
        model: model,
        max_tokens: getMaxTokensForClaudeModel(model, config.max_tokens),
        messages: userMessages
    };

    // 添加 system prompt（如果有）
    if (systemPrompt) {
        body.system = systemPrompt;
    }

    // Claude 支持 temperature 参数
    if (config.temperature !== undefined) {
        body.temperature = config.temperature;
    } else {
        body.temperature = 0.3;
    }

    // 使用代理 URL 而不是直接调用 Claude API
    const endpoint = proxyUrl.replace(/\/$/, "");

    const response = await fetch(endpoint, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Claude API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    // Claude 返回格式: { content: [{ type: "text", text: "..." }] }
    return data.content?.[0]?.text || "";
}

// ============= 批量翻译 =============
async function translateBulk(text, srcLang, tgtLang, config, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    const srcName = srcLang === 'zh' ? 'Chinese' : 'English';
    const tgtName = tgtLang === 'zh' ? 'Chinese' : 'English';

    const systemPrompt = `You are a professional academic translator. 
1. Split input into logical sentences/segments.
2. Translate ${srcName} to ${tgtName}.
3. Keep LaTeX math/citations intact.
4. You MUST return ONLY valid JSON: {"translations": [{"src": "Original 1", "tgt": "Translated 1"}]}
5. Do NOT include any text before or after the JSON.`;

    if (config.provider === 'local') {
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            false, // 不使用json_mode，让模型自由返回
            signal
        );
        return parseJsonResponse(response);
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { jsonMode: true },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            translations: {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        src: { type: "STRING" },
                        tgt: { type: "STRING" }
                    },
                    required: ["src", "tgt"]
                }
            }
        },
        required: ["translations"]
    };

    const response = await callGeminiAPI(config.model, text, {
        systemInstruction: systemPrompt,
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey, signal);

    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    return JSON.parse(response || "{}");
}

// ============= 句子精炼 =============
async function refineSentence(text, lang, type, config, instruction = null, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    let prompt = "";

    if (type === "grammar") {
        const baseInst = instruction || `${DEFAULT_GRAMMAR_PROMPT} (Language: ${lang === 'zh' ? 'Chinese' : 'English'})`;
        prompt = `${baseInst}

IMPORTANT RULES:
1. If there are grammar errors, return ONLY the corrected sentence.
2. If the text is already grammatically correct, return exactly: [NO_CHANGES]
3. Do NOT explain or describe what you did. Return ONLY the corrected text or [NO_CHANGES].

Text: "${text}"`;
    } else if (type === "simplify") {
        const baseInst = instruction || `${DEFAULT_SIMPLIFY_PROMPT} (Language: ${lang === 'zh' ? 'Chinese' : 'English'})
CRITICAL RULES:
1. Use common vocabulary.
2. STRICTLY PRESERVE all LaTeX math (e.g., $x_i$, \\xi_k), citations (e.g., [1]), and serial numbers (e.g., 1., (a)) exactly as they are.`;
        prompt = `${baseInst}\n3. Return ONLY the rewritten sentence.\nOriginal Text: "${text}"`;
    } else if (type === "custom") {
        prompt = `Rewrite the following ${lang === 'zh' ? 'Chinese' : 'English'} sentence based on this instruction: "${instruction}". Return ONLY the rewritten sentence.\n\nText: "${text}"`;
    }

    if (config.provider === 'local') {
        return await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false,
            signal
        );
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return response?.trim() || text;
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return response?.trim() || text;
    }

    // Gemini Path
    const response = await callGeminiAPI(config.model, prompt, { temperature: 0.3 }, config.geminiApiKey, signal);
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    return response?.trim() || text;
}

async function getSynonyms(sentence, selectedText, lang, config, avoidList = []) {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT include any of the following words/phrases in your output: ${JSON.stringify(avoidList)}. Find DIFFERENT alternatives.`
        : "";

    const prompt = `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 distinct, academic-style alternatives for the "Selected Text".
1. If "Selected Text" is a single word, provide synonyms.
2. If "Selected Text" is a phrase or clause, provide rephrased versions that convey the SAME meaning and function within the context.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by Semantic Proximity (closest meaning first, then slightly more varied).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }`;

    if (config.provider === 'local') {
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false // 不使用json_mode
        );
        try {
            const data = parseJsonResponse(response);
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            const data = parseJsonResponse(response);
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            const data = parseJsonResponse(response);
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",

// ========================================
// translate.js - 翻译核心逻辑
// ========================================

// ============= 翻译相关函数 =============

// 执行翻译
async function handleTranslate() {
    // 停止功能
    if (AppState.isLoading && AppState.mainAbortController) {
        AppState.mainAbortController.abort();
        setState({ isLoading: false });
        return;
    }

    if (!AppState.inputText.trim()) return;

    // 检查输入是否变化：如果已有翻译结果且输入未改变，则不执行翻译
    // 用户应使用重新生成按钮来重新翻译
    if (AppState.translationPairs.length > 0 && AppState.inputText === AppState.lastTranslatedText) {
        return;
    }

    // 保存原始输入内容（首次翻译时）
    if (!AppState.originalInputText || AppState.translationPairs.length === 0) {
        AppState.originalInputText = AppState.inputText;
    }

    // 同步基线以防止重复自动翻译
    AppState.lastTranslatedText = AppState.inputText;

    let srcLang, tgtLang;
    if (AppState.isAutoDetect) {
        const detected = detectLanguage(AppState.inputText);
        srcLang = detected.src;
        tgtLang = detected.tgt;
        setState({ sourceLang: srcLang, targetLang: tgtLang }, true);
    } else {
        srcLang = AppState.sourceLang;
        tgtLang = AppState.targetLang;
    }

    setState({ isLoading: true, error: null, aiInsight: null });

    // 初始化AbortController
    const controller = new AbortController();
    AppState.mainAbortController = controller;

    try {
        const config = getApiConfig();
        const result = await translateBulk(AppState.inputText, srcLang, tgtLang, config, controller.signal);

        if (result?.translations) {
            const pairs = result.translations.map(t => ({
                src: t.src,
                tgt: t.tgt,
                history: [{ src: t.src, tgt: t.tgt }],
                historyIndex: 0,
                isUpdating: false,
                isRegenerating: false
            }));
            setState({ translationPairs: pairs, isEditingMode: false, viewMode: 'preview', isLoading: false });
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "AI Translation failed. Please try again." });
            console.error(err);
        }
    } finally {
        // 确保 isLoading 状态被正确设置并触发重新渲染
        AppState.mainAbortController = null;
        if (AppState.isLoading) {
            setState({ isLoading: false });
        }
    }
}

// 保存行更新
async function saveRowUpdate(index, manualValues = null) {
    const original = AppState.translationPairs[index];
    const currentSrc = manualValues ? manualValues.src : AppState.editValues.src;
    const currentTgt = manualValues ? manualValues.tgt : AppState.editValues.tgt;

    // 检查是否需要取消现有更新
    if (original.isUpdating) {
        const controller = AppState.rowAbortControllers.get(index);
        if (controller) {
            controller.abort();
            AppState.rowAbortControllers.delete(index);
            updateTranslationPair(index, { isUpdating: false });
            return;
        }
    }

    // 严格检查：如果完全没有变化，立即退出
    if (currentSrc === original.src && currentTgt === original.tgt) {
        return;
    }

    const srcChanged = currentSrc !== original.src;
    const tgtChanged = currentTgt !== original.tgt;
    const needsAiUpdate = (srcChanged && !tgtChanged) || (tgtChanged && !srcChanged);

    updateTranslationPair(index, {
        src: currentSrc,
        tgt: currentTgt,
        isUpdating: needsAiUpdate
    });

    let prompt = "";
    let updateField = null;

    if (srcChanged && !tgtChanged) {
        prompt = `You are updating a translation. Original Source: "${original.src}". Current Translation: "${original.tgt}". New Source: "${currentSrc}". Task: Translate the "New Source" to ${AppState.targetLang === 'zh' ? 'Chinese' : 'English'}. Constraint: Keep the style and vocabulary of the "Current Translation" where possible. Return JSON: {"text": "..."}`;
        updateField = "tgt";
    } else if (tgtChanged && !srcChanged) {
        prompt = `You are aligning a source text to match a modified translation. Original Source: "${original.src}". Original Translation: "${original.tgt}". New Translation: "${currentTgt}". Task: Update the "Original Source" in ${AppState.sourceLang === 'zh' ? 'Chinese' : 'English'} so that it matches the meaning AND TONE of the "New Translation". Return JSON: {"text": "..."}`;
        updateField = "src";
    }

    if (!updateField) {
        addHistory(index, currentSrc, currentTgt);
        return;
    }

    // AI更新（支持中止）
    const controller = new AbortController();
    AppState.rowAbortControllers.set(index, controller);

    try {
        const config = getApiConfig();
        const resultText = await getSmartUpdate(prompt, config, controller.signal);
        const finalSrc = updateField === 'src' ? resultText : currentSrc;
        const finalTgt = updateField === 'tgt' ? resultText : currentTgt;
        addHistory(index, finalSrc, finalTgt);
        // editValues 已在 addHistory 中同步更新
    } catch (e) {
        if (e.name !== 'AbortError') {
            console.error("Smart update failed", e);
            addHistory(index, currentSrc, currentTgt);
            setState({ error: e.message || "Smart update failed" });
        }
    } finally {
        AppState.rowAbortControllers.delete(index);
    }
}

// 添加历史记录
function addHistory(index, s, t) {
    const pairs = [...AppState.translationPairs];
    const newHistory = [...pairs[index].history, { src: s, tgt: t }];
    pairs[index] = {
        ...pairs[index],
        src: s,
        tgt: t,
        history: newHistory,
        historyIndex: newHistory.length - 1,
        isUpdating: false
    };
    
    // 同时更新 editValues 以保持同步，避免状态不一致
    if (AppState.activeIndex === index) {
        AppState.editValues = { src: s, tgt: t };
    }
    
    setState({ translationPairs: pairs });
}

// 历史导航
function handleHistoryNav(index, delta) {
    const item = AppState.translationPairs[index];
    const newIdx = item.historyIndex + delta;
    if (newIdx >= 0 && newIdx < item.history.length) {
        const historic = item.history[newIdx];
        const pairs = [...AppState.translationPairs];
        pairs[index] = { ...item, src: historic.src, tgt: historic.tgt, historyIndex: newIdx };
        
        // 同时更新 editValues 以保持同步
        if (AppState.activeIndex === index) {
            AppState.editValues = { src: historic.src, tgt: historic.tgt };
        }
        
        setState({ translationPairs: pairs });
    }
}

// AI精炼
async function handleAiRefine(index, field, type) {
    if (AppState.isRefining) return;
    setState({ isRefining: true });

    const text = field === 'src' ? AppState.editValues.src : AppState.editValues.tgt;
    const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;

    let instruction = undefined;
    if (type === 'grammar') instruction = AppState.customPrompts.grammar;
    if (type === 'simplify') instruction = AppState.customPrompts.simplify;

    try {
        const config = getApiConfig();
        const customInst = type === 'custom' ? AppState.refinePrompt : instruction;
        const refined = await refineSentence(text, lang, type, config, customInst);

        if (refined) {
            // 检测 AI 返回的 "无需修改" 标记或常见的无修改响应
            const noChangePatterns = [
                '[NO_CHANGES]',
                'already grammatically correct',
                'no grammar errors',
                'no changes needed',
                'text is correct',
                '没有语法错误',
                '语法正确',
                '无需修改'
            ];

            const isNoChange = noChangePatterns.some(pattern =>
                refined.toLowerCase().includes(pattern.toLowerCase())
            ) || refined.trim() === text.trim();

            if (isNoChange) {
                // 显示提示框而不是替换文本
                showToast(type === 'grammar' ? '✓ No grammar errors found' : '✓ Text is already simple enough', 'success');
            } else {
                const newVals = { ...AppState.editValues, [field]: refined };
                setState({ editValues: newVals }, true);
                await saveRowUpdate(index, newVals);
            }
        }
    } catch (e) {
        setState({ error: e.message || "Refinement failed" });
    } finally {
        setState({ isRefining: false });
        if (type === 'custom') setState({ refinePrompt: "" }, true);
    }
}

// 显示 Toast 提示
function showToast(message, type = 'info') {

}

// 处理文本选择（同义词）
async function handleTextSelect(event, field, index) {
    const target = event.target;
    let start = target.selectionStart;
    let end = target.selectionEnd;

    if (start === end) return;

    const text = target.value;
    let selectedText = text.substring(start, end);

    // 去除尾随空格（浏览器双击选词常常会包含尾随空格）
    const trimmedEnd = selectedText.replace(/\s+$/, '');
    if (trimmedEnd.length < selectedText.length) {
        end = start + trimmedEnd.length;
        selectedText = trimmedEnd;
        // 更新浏览器的选中范围
        target.setSelectionRange(start, end);
    }
    
    // 去除前导空格
    const trimmedStart = selectedText.replace(/^\s+/, '');
    if (trimmedStart.length < selectedText.length) {
        start = end - trimmedStart.length;
        selectedText = trimmedStart;
        target.setSelectionRange(start, end);
    }

    if (!selectedText || selectedText.length < 1 || /^\s*$/.test(selectedText)) return;

    updateSynonymState({
        show: true,
        loading: true,
        originalText: selectedText,
        history: [],
        pageIndex: 0,
        position: { x: event.clientX, y: event.clientY },
        selectionRange: { start, end },
        field,
        contextSentence: text
    });

    try {
        const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;
        const config = getApiConfig();
        const alternatives = await getSynonyms(text, selectedText, lang, config, []);

        updateSynonymState({
            loading: false,
            history: [alternatives]
        });
    } catch (err) {
        console.error(err);
        updateSynonymState({ show: false });
    }
}

// 同义词翻页
async function handleSynonymPageChange(direction) {
    const { pageIndex, history, contextSentence, originalText, field } = AppState.synonymState;

    if (direction === -1) {
        if (pageIndex > 0) {
            updateSynonymState({ pageIndex: pageIndex - 1 });
        }
    } else {
        if (pageIndex < history.length - 1) {
            updateSynonymState({ pageIndex: pageIndex + 1 });
        } else {
            if (!field) return;
            const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;

            updateSynonymState({ loading: true });

            try {
                const avoidList = history.flat();
                const config = getApiConfig();
                const newAlternatives = await getSynonyms(contextSentence, originalText, lang, config, avoidList);

                updateSynonymState({
                    loading: false,
                    history: [...history, newAlternatives],
                    pageIndex: pageIndex + 1
                });
            } catch (e) {
                updateSynonymState({ loading: false });
            }
        }
    }
}

// 应用同义词
function applySynonym(synonym) {
    if (!AppState.synonymState.field || AppState.activeIndex === null) return;

    const field = AppState.synonymState.field;
    const currentText = AppState.editValues[field];
    const { start, end } = AppState.synonymState.selectionRange;

    const newText = currentText.substring(0, start) + synonym + currentText.substring(end);

    // 更新状态
    AppState.editValues[field] = newText;
    
    // 直接更新 textarea 的值（避免重新渲染）
    const textarea = document.getElementById(`editTextarea_${field}_${AppState.activeIndex}`);
    if (textarea) {
        textarea.value = newText;
        // 设置光标位置到替换文本末尾
        const newCursorPos = start + synonym.length;
        textarea.setSelectionRange(newCursorPos, newCursorPos);
        textarea.focus();
    }
    
    // 关闭弹窗
    updateSynonymState({ show: false });
}

// ============= 在线模型列表刷新（只由用户显式点击触发）=============
// 刻意不做启动自动刷新 / 打开 Settings 自动刷新：/v1/models 有限流，且首屏不该依赖网络。
// 【不变量，改代码时请守住】任何失败路径只写 AppState.modelRefresh，绝不写 fetchedModels、
// 绝不触碰 DEFAULT_MODEL_CATALOG —— 可用列表永远只增不减，不会出现「点了更新，模型没了」。

// 把 Settings 里还没点保存的输入框内容同步进 AppState 再落盘。
// 必须先做：setState(L167) 会通过 root.innerHTML 全量重渲染，不同步的话刚粘贴的 Key 会被冲掉，
// 而且刷新会拿旧 Key 去请求、误报 NO_KEY。沿用 handleConnectLocalClick(L2951) 的既有模式。
function syncSettingsInputsToState() {
    [
        ['geminiApiKeyInput', 'geminiApiKey'],
        ['openaiApiKeyInput', 'openaiApiKey'],
        ['claudeApiKeyInput', 'claudeApiKey'],
        ['claudeProxyUrlInput', 'claudeProxyUrl']
    ].forEach(function (pair) {
        const input = document.getElementById(pair[0]);
        if (input) {
            AppState[pair[1]] = input.value.trim();
            try {
                localStorage.setItem(pair[1], AppState[pair[1]]);
            } catch (e) {}
        }
    });
}

function persistOnlineCatalog() {
    try {
        const payload = { v: MODEL_CATALOG_SCHEMA_VERSION };
        MODEL_PROVIDERS.forEach(function (p) {
            payload[p] = {
                at: AppState.modelRefresh[p].at || 0,
                models: (AppState.fetchedModels[p] || []).map(m => ({
                    id: m.id, name: m.name, group: m.group || 'chat', created: m.created || ''
                }))
            };
        });
        localStorage.setItem(MODEL_CATALOG_LS_KEY, JSON.stringify(payload));
    } catch (e) {}
}

function loadOnlineCatalog() {
    try {
        const saved = localStorage.getItem(MODEL_CATALOG_LS_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (!parsed || parsed.v !== MODEL_CATALOG_SCHEMA_VERSION) return;   // 版本不匹配 → 当作没有缓存
        let visibilityPatched = false;
        MODEL_PROVIDERS.forEach(function (p) {
            const bucket = parsed[p];
            if (!bucket || !Array.isArray(bucket.models)) return;
            let models = bucket.models.map(function (m) {
                // 白名单对 localStorage 里的数据同样生效：即使有人手工篡改也注入不进来。
                // id 走 SAFE_MODEL_ID，name 走去标签 + 截断（它会被渲染进顶栏标签/下拉/勾选框）。
                const id = sanitizeModelId(m && m.id);
                return id ? {
                    id: id,
                    name: String((m && m.name) || id).replace(/[<>]/g, '').slice(0, 120) || id,
                    group: m.group === 'other' ? 'other' : 'chat',
                    created: m.created || '',
                    provider: p
                } : null;
            }).filter(Boolean);
            // Gemini 的文本/非文本过滤规则可能在这份缓存写入之后变严过（比如新增了黑名单词）。
            // 缓存是纯回放，不会重新走 fetchGeminiModelList，所以这里必须重新套一遍同一个判定，
            // 否则老版本缓存过的图像/TTS/live 模型会在「点更新之前」一直显示在下拉里。
            if (p === 'gemini') {
                models = models.filter(m => isGeminiTextChatModelId(m.id));
            }
            if (models.length === 0) return;

            // 兜底补齐可见性键。缓存（onlineModelCatalog）和可见性表（modelVisibility）是两次
            // 互相独立、各自吞异常的写入，只要有一份没落盘（配额爆掉 / 用户清了单个键 / 隐私模式 /
            // 跨设备手搬），这里几十个 id 在 modelVisibility 里就全都不存在 → 全代码库的
            // `!== false` 判定一律放行 → 顶栏下拉一次性灌进上百个模型。
            // 规则与 mergeVisibilityForProvider 一致：内置目录里的默认可见，其余默认隐藏。
            // 只补缺失的键，不改已有值，所以是幂等的；这里是纯读缓存路径，刻意不做剪枝。
            const builtinIds = new Set(DEFAULT_MODEL_CATALOG.filter(x => x.provider === p).map(x => x.id));
            models.forEach(function (m) {
                if (!(m.id in AppState.modelVisibility)) {
                    AppState.modelVisibility[m.id] = builtinIds.has(m.id);
                    visibilityPatched = true;
                }
            });

            AppState.fetchedModels[p] = models;
            AppState.modelRefresh[p] = {
                status: 'ok', at: bucket.at || 0, count: models.length,
                errCode: null, errMsg: '', source: 'cache'
            };
        });
        if (visibilityPatched) {
            try {
                localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
            } catch (e) {}
        }
    } catch (e) {}
}

// 合并可见性。新 id 必须**显式写入布尔值**：全代码库用 `!== false` 判定可见，
// 留空等于默认打开，一次刷新会把 50-90 个 id 一股脑灌进顶栏下拉。
// 新发现的模型默认隐藏，用户到「本次新发现」横幅一键放行。
// ⚠️ 必须在覆盖 AppState.fetchedModels[provider] **之前**调用（剪枝要用到旧值）。
function mergeVisibilityForProvider(provider, models) {
    const builtinIds = new Set(DEFAULT_MODEL_CATALOG.filter(m => m.provider === provider).map(m => m.id));
    const newIds = [];
    models.forEach(function (m) {
        if (!(m.id in AppState.modelVisibility)) {
            AppState.modelVisibility[m.id] = builtinIds.has(m.id);
            if (!builtinIds.has(m.id)) newIds.push(m.id);
        }
    });

    // 剪枝：只清理「上次从这家 API 拉到、这次没再返回」的孤儿键，且要过四重保护
    // （本次结果 / 内置目录 / 本地模型 / 当前选中项）。不剪枝的话 loadSavedSettings 的
    // 浅合并会让这个 map 随每次模型换代无限膨胀。
    const keepIds = new Set(models.map(m => m.id));
    DEFAULT_MODEL_CATALOG.forEach(m => keepIds.add(m.id));
    (AppState.localModels || []).forEach(lm => keepIds.add(lm.id));
    if (AppState.selectedModel) keepIds.add(AppState.selectedModel);
    (AppState.fetchedModels[provider] || []).forEach(function (old) {
        if (!keepIds.has(old.id)) delete AppState.modelVisibility[old.id];
    });

    return newIds;
}

async function refreshOnlineModels(providers) {
    const targets = (providers && providers.length ? providers : MODEL_PROVIDERS)
        .filter(p => MODEL_PROVIDERS.indexOf(p) >= 0);
    if (targets.length === 0) return;

    syncSettingsInputsToState();

    const keyOf = {
        gemini: AppState.geminiApiKey,
        openai: AppState.openaiApiKey,
        claude: AppState.claudeApiKey
    };
    if (targets.every(p => !keyOf[p])) {
        showToast('请先在下方填写至少一个 API Key', 'warning');
        return;
    }

    targets.forEach(function (p) {
        AppState.modelRefresh[p] = { ...AppState.modelRefresh[p], status: 'loading', errCode: null, errMsg: '' };
    });
    AppState.newlyFoundIds = [];
    setState({});   // 让按钮和芯片先进入 loading 态

    // 'loading' 同时充当 UI 状态和并发锁（芯片 disabled / anyRefreshing / refreshOnlineModelsClick
    // 的守卫都读它），所以下面整段必须包在 try/finally 里 —— 漏一次解锁就是永久死锁，
    // 用户只能刷新整个页面才能再点「更新」。
    try {
    const tasks = targets.map(function (p) {
        if (p === 'gemini') return fetchGeminiModelList(AppState.geminiApiKey);
        if (p === 'openai') return fetchOpenaiModelList(AppState.openaiApiKey, !AppState.showDatedSnapshots);
        return fetchClaudeModelList(AppState.claudeApiKey, AppState.claudeProxyUrl);
    });

    // 必须是 allSettled：用 all 的话一家没填 Key 会把另外两家已成功的结果一起拖垮
    const results = await Promise.allSettled(tasks);

    const summary = [];
    const allNew = [];
    results.forEach(function (r, i) {
        const p = targets[i];
        if (r.status === 'fulfilled' && Array.isArray(r.value) && r.value.length > 0) {
            const models = r.value;
            allNew.push(...mergeVisibilityForProvider(p, models));   // 先合并（用得到旧值）
            AppState.fetchedModels[p] = models;                      // 再覆盖
            AppState.modelRefresh[p] = {
                status: 'ok', at: Date.now(), count: models.length,
                errCode: null, errMsg: '', source: 'live'
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} ${models.length} 个`);
        } else if (r.status === 'fulfilled') {
            // 返回 0 条：**不覆盖**旧列表。project-scoped key 的模型白名单会真实导致空列表，
            // 当成成功覆盖会把用户的列表清空。
            AppState.modelRefresh[p] = {
                ...AppState.modelRefresh[p], status: 'error',
                errCode: 'EMPTY', errMsg: '返回 0 个可用模型，已保留原列表'
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} 返回空`);
        } else {
            const info = classifyModelFetchError(r.reason);
            AppState.modelRefresh[p] = {
                ...AppState.modelRefresh[p], status: 'error',
                errCode: info.errCode, errMsg: info.errMsg
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} 失败`);
        }
    });

    AppState.newlyFoundIds = allNew;

    try {
        localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
    } catch (e) {}
    persistOnlineCatalog();

    const okCount = targets.filter(p => AppState.modelRefresh[p].status === 'ok').length;
    if (okCount === targets.length) {
        showToast(`已更新：${summary.join(' · ')}${allNew.length ? `（新增 ${allNew.length} 个，默认隐藏）` : ''}`, 'success');
    } else if (okCount > 0) {
        showToast(`部分更新：${summary.join(' · ')}`, 'warning');
    } else {
        showToast('更新失败，仍在使用上次的列表', 'error');
    }
    } finally {
        // 任何抛错路径都必须解锁。不变量照旧：只写 modelRefresh，绝不碰 fetchedModels。
        let stuck = false;
        MODEL_PROVIDERS.forEach(function (p) {
            if (AppState.modelRefresh[p].status === 'loading') {
                AppState.modelRefresh[p] = {
                    ...AppState.modelRefresh[p], status: 'error',
                    errCode: 'HTTP', errMsg: '刷新意外中断，已保留原列表'
                };
                stuck = true;
            }
        });
        if (stuck) renderApp();
    }
}

// ============= 全局历史管理 =============

function addToGlobalHistory(pairs, sid) {
    if (pairs.length === 0) return;

    let history = [...AppState.globalHistory];
    const existingIndex = history.findIndex(item => item.id === sid);
    const updatedPairs = JSON.parse(JSON.stringify(pairs));

    if (existingIndex !== -1) {
        history[existingIndex] = {
            ...history[existingIndex],
            timestamp: Date.now(),
            pairs: updatedPairs
        };
        const item = history.splice(existingIndex, 1)[0];
        history.unshift(item);
    } else {
        const newItem = {
            id: sid,
            timestamp: Date.now(),
            pairs: updatedPairs
        };
        history = [newItem, ...history];
    }

    setState({ globalHistory: history.slice(0, AppState.historyLimit) });
}

function restoreGlobalHistory(item) {
    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }

    AppState.isRestoringHistory = true;

    setState({
        sessionId: item.id,
        translationPairs: item.pairs,
        inputText: item.pairs.map(p => p.src).join('\n'),
        isEditingMode: false,
        showHistoryMenu: false
    });

    setTimeout(() => {
        AppState.isRestoringHistory = false;
    }, 500);
}

// ============= 事件处理 =============

function handleInputChange(value) {
    // 如果正在恢复历史，跳过
    if (AppState.isRestoringHistory) {
        return;
    }

    // 如果从空变为有内容，创建新会话
    if (AppState.inputText === "" && value !== "") {
        if (AppState.translationPairs.length === 0) {
            AppState.sessionId = Date.now().toString();
        }
    }

    AppState.inputText = value;
    AppState.isEditingMode = true;
    AppState.isRestoringHistory = false;

    // 如果输入为空，清空状态并重新渲染（需要隐藏翻译结果）
    if (!value.trim()) {
        AppState.translationPairs = [];
        renderApp();
        return;
    }

    // 自动翻译防抖
    if (AppState.isAutoTranslate) {
        if (AppState.debounceTimer) {
            clearTimeout(AppState.debounceTimer);
        }
        AppState.debounceTimer = setTimeout(() => {
            if (AppState.isEditingMode && AppState.inputText !== AppState.lastTranslatedText) {
                handleTranslate();
            }
        }, 1500);
    }

    // 不再调用 renderApp()，避免焦点丢失
    // 输入时 textarea 的值已经被浏览器更新，无需重新渲染
}

function handleRowClick(index, clickedSide = null) {
    if (AppState.activeIndex !== null && AppState.activeIndex !== index) {
        saveRowUpdate(AppState.activeIndex);
    }

    // 在 setState 之前保存滚动位置和点击行的位置信息
    const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
    const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');

    let savedScrollInfo = null;
    if (sourceContainer && targetContainer && clickedSide) {
        const clickedContainer = clickedSide === 'src' ? sourceContainer : targetContainer;
        const clickedRow = clickedContainer.querySelector(`[data-idx="${index}"]`);

        if (clickedRow) {
            const containerRect = clickedContainer.getBoundingClientRect();
            const rowRect = clickedRow.getBoundingClientRect();
            savedScrollInfo = {
                clickedSide: clickedSide,
                clickedScrollTop: clickedContainer.scrollTop,
                rowRelativeTop: rowRect.top - containerRect.top, // 行相对于容器顶部的位置
                index: index
            };
        }
    }

    // 使用 preserveScroll: false，因为我们有自己的滚动同步逻辑
    setState({
        activeIndex: index,
        editValues: {
            src: AppState.translationPairs[index].src,
            tgt: AppState.translationPairs[index].tgt
        },
        isEditingMode: false
    }, { preserveScroll: false });

    // 滚动同步：恢复点击侧的滚动位置，并同步另一侧
    if (savedScrollInfo) {
        requestAnimationFrame(() => {
            syncScrollAfterRender(savedScrollInfo);
        });
    }
}

// 渲染后恢复滚动位置并同步
function syncScrollAfterRender(scrollInfo) {
    const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
    const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');

    if (!sourceContainer || !targetContainer) return;

    const { clickedSide, clickedScrollTop, rowRelativeTop, index } = scrollInfo;

    const clickedContainer = clickedSide === 'src' ? sourceContainer : targetContainer;
    const otherContainer = clickedSide === 'src' ? targetContainer : sourceContainer;

    // 1. 恢复点击侧的滚动位置
    clickedContainer.scrollTop = clickedScrollTop;

    // 2. 找到另一侧对应的行，并滚动到相同的相对位置
    const otherRow = otherContainer.querySelector(`[data-idx="${index}"]`);
    if (otherRow) {
        // 计算另一侧需要滚动到的位置，使对应行在相同的相对位置
        const otherRowOffsetTop = otherRow.offsetTop;
        otherContainer.scrollTop = otherRowOffsetTop - rowRelativeTop;
    }
}

// 全局点击处理 - 点击空白区域退出编辑模式
function handleGlobalClick(event) {
    // 如果没有正在编辑的句子，直接返回
    if (AppState.activeIndex === null) return;

    // 检查点击的目标是否在句子行内
    const clickedRow = event.target.closest('[data-idx]');
    if (clickedRow) return;

    // 检查是否点击了模态框、菜单、按钮等交互元素
    const clickedModal = event.target.closest('.fixed.inset-0'); // 模态框
    const clickedButton = event.target.closest('button');
    const clickedInput = event.target.closest('input, textarea, select');
    const clickedDropdown = event.target.closest('[onclick*="toggle"], [onclick*="Menu"], [onclick*="Settings"]');

    // 如果点击了这些元素，不退出编辑模式
    if (clickedModal || clickedButton || clickedInput || clickedDropdown) return;

    // 点击了空白区域，保存当前编辑并退出编辑模式
    saveRowUpdate(AppState.activeIndex);
    setState({
        activeIndex: null,
        editValues: { src: '', tgt: '' }
    });
}

// 向后兼容的局部处理函数
function handleBlankAreaClick(event) {
    handleGlobalClick(event);
}

function handleManualSave() {
    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }
}

function handleClear() {
    if (AppState.mainAbortController) {
        AppState.mainAbortController.abort();
    }

    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }

    AppState.isRestoringHistory = true;

    setState({
        inputText: "",
        originalInputText: "",
        translationPairs: [],
        activeIndex: null,
        isEditingMode: true,
        viewMode: 'edit',
        isLoading: false,
        sessionId: Date.now().toString(),
        error: null
    });

    updateSynonymState({ show: false });

    setTimeout(() => {
        AppState.isRestoringHistory = false;
    }, 100);

    AppState.lastTranslatedText = "";
}

function toggleEditMode() {
    if (AppState.isEditingMode) {
        setState({ isEditingMode: false });
    } else {
        const reconstructed = AppState.translationPairs.map(p => p.src).join('\n');
        setState({ inputText: reconstructed, isEditingMode: true });
        AppState.lastTranslatedText = reconstructed;
    }
}

// ============= 重新生成所有翻译 =============
async function handleRegenerateAll() {
    // 如果没有翻译对，直接返回
    if (AppState.translationPairs.length === 0) return;

    // 如果正在重新生成，则取消
    if (AppState.isRegeneratingAll) {
        if (AppState.regenerateAllAbortController) {
            AppState.regenerateAllAbortController.abort();
            AppState.regenerateAllAbortController = null;
        }
        setState({ isRegeneratingAll: false });
        return;
    }

    // 初始化 AbortController
    const controller = new AbortController();
    AppState.regenerateAllAbortController = controller;

    setState({ isRegeneratingAll: true, error: null });

    try {
        const config = getApiConfig();
        // 使用原始输入内容重新翻译（不是按句拼接的）
        const originalText = AppState.originalInputText || AppState.inputText;

        // 重新翻译所有内容
        const result = await translateBulk(originalText, AppState.sourceLang, AppState.targetLang, config, controller.signal);

        if (result?.translations) {
            // 重新生成时，每个翻译对重置历史记录（不累加每句的历史）
            const pairs = result.translations.map((t) => ({
                src: t.src,
                tgt: t.tgt,
                history: [{ src: t.src, tgt: t.tgt }],
                historyIndex: 0,
                isUpdating: false,
                isRegenerating: false
            }));
            setState({ translationPairs: pairs, viewMode: 'preview', activeIndex: null });
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "重新生成翻译失败，请重试。" });
            console.error(err);
        }
    } finally {
        AppState.regenerateAllAbortController = null;
        setState({ isRegeneratingAll: false });
    }
}

// ============= 重新生成单条翻译 =============
async function handleRegenerateTranslation(index) {
    const pair = AppState.translationPairs[index];
    if (!pair) return;

    // 如果正在重新生成，则取消
    if (pair.isRegenerating) {
        const controller = AppState.regenerateAbortControllers?.get(index);
        if (controller) {
            controller.abort();
            AppState.regenerateAbortControllers.delete(index);
            updateTranslationPair(index, { isRegenerating: false });
        }
        return;
    }

    // 初始化 AbortController Map (如果不存在)
    if (!AppState.regenerateAbortControllers) {
        AppState.regenerateAbortControllers = new Map();
    }

    const controller = new AbortController();
    AppState.regenerateAbortControllers.set(index, controller);

    // 标记正在重新生成
    updateTranslationPair(index, { isRegenerating: true });

    try {
        const config = getApiConfig();
        const srcText = pair.src;
        const oldTgt = pair.tgt;

        // 使用当前语言设置重新翻译
        const result = await translateBulk(srcText, AppState.sourceLang, AppState.targetLang, config, controller.signal);

        if (result?.translations && result.translations.length > 0) {
            const newTgt = result.translations[0].tgt;

            // 只有当新翻译与旧翻译不同时，才添加到历史记录
            if (newTgt !== oldTgt) {
                addHistory(index, srcText, newTgt);

                // 如果当前正在编辑这一行，同时更新 editValues
                if (AppState.activeIndex === index) {
                    AppState.editValues.tgt = newTgt;
                }
            }
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "重新生成翻译失败，请重试。" });
            console.error(err);
        }
    } finally {
        AppState.regenerateAbortControllers?.delete(index);
        updateTranslationPair(index, { isRegenerating: false });
    }
}
