    if (direction === -1) {
        if (pageIndex > 0) {
            pb[mode] = pageIndex - 1;
            updateSynonymState({ pageIndexByMode: pb, errorMessage: "" });
        }
    } else {
        if (pageIndex < history.length - 1) {
            pb[mode] = pageIndex + 1;
            updateSynonymState({ pageIndexByMode: pb, errorMessage: "" });
        } else {
            if (!field) return;
            const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;

            const req = beginSynonymRequest();
            updateSynonymState({ loading: true, errorMessage: "", reqId: req.id });

            try {
                const avoidList = history.flat();
                const config = getApiConfig();
                const result = await fetchSynonymOptions(
                    mode, contextSentence, originalText, lang, config, avoidList,
                    getGrammarScopeContext(s), req.signal
                );

                if (synonymReqStale(req.id)) return;

                const cur = AppState.synonymState;
                const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
                curHb[mode] = [...history, result.alternatives];
                const curPb = (cur.pageIndexByMode && typeof cur.pageIndexByMode === 'object') ? cur.pageIndexByMode : emptySynonymPageIndex();
                curPb[mode] = pageIndex + 1;
                // 语法模式的逐页判定结果要和 historyByMode.grammar 的下标对齐
                const curNotes = Array.isArray(cur.grammarNotes) ? cur.grammarNotes.slice(0, history.length) : [];
                if (result.note) curNotes[pageIndex + 1] = result.note;
                updateSynonymState({
                    historyByMode: curHb,
                    pageIndexByMode: curPb,
                    ...(result.note ? { grammarNotes: curNotes } : {}),
                    ...(normalizeSynonymMode(cur.mode) === mode ? { loading: false } : {})
                });
            } catch (e) {
                if (isSynonymAbort(e)) return;
                if (synonymReqStale(req.id)) return;
                console.error(e);
                updateSynonymState({ loading: false, errorMessage: describeSynonymError(e) });
            }
        }
    }
}

// 「重试」：同一模式、同一选区，**空的 avoid 列表**再问一次，结果覆盖当前这一页。
// 为什么是空 avoid：这类失败（BAD_ESCAPE / empty）是随机的，同一句话两次请求一次成一次败；
// 把上一次的候选写进 avoid 反而是在逼模型换一个更差的说法。
// 复用 beginSynonymRequest 的令牌/取消，和另外三个取数入口同一套规则。
async function handleSynonymRetry() {
    const s = AppState.synonymState || {};
    const mode = normalizeSynonymMode(s.mode);
    if (!s.field) return;
    const pageIndex = getSynonymPageIndex(s, mode);

    const req = beginSynonymRequest();
    updateSynonymState({ loading: true, errorMessage: "", reqId: req.id });

    try {
        const lang = s.field === 'src' ? AppState.sourceLang : AppState.targetLang;
        const config = getApiConfig();
        const result = await fetchSynonymOptions(
            mode, s.contextSentence, s.originalText, lang, config, [],
            getGrammarScopeContext(s), req.signal
        );

        if (synonymReqStale(req.id)) return;

        const cur = AppState.synonymState;
        const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
        const pages = Array.isArray(curHb[mode]) ? curHb[mode].slice() : [];
        pages[pageIndex] = result.alternatives;
        curHb[mode] = pages;
        const curNotes = Array.isArray(cur.grammarNotes) ? cur.grammarNotes.slice() : [];
        if (result.note) curNotes[pageIndex] = result.note;
        updateSynonymState({
            historyByMode: curHb,
            ...(result.note ? { grammarNotes: curNotes } : {}),
            ...(normalizeSynonymMode(cur.mode) === mode ? { loading: false } : {})
        });
    } catch (e) {
        if (isSynonymAbort(e)) return;
        if (synonymReqStale(req.id)) return;
        console.error(e);
        updateSynonymState({ loading: false, errorMessage: describeSynonymError(e) });
    }
}

// 「看整句改写」：把附带提议（sentence_issue + sentence_alternatives）翻成这一页的正式答案。
// **纯本地状态改写，不发任何请求** —— 候选早就在 note 里了，只是默认不摆出来。
// 翻完之后这一页的 scope 变成 'sentence'，琥珀色整句高亮、整句徽标、applySynonym 的替换范围
// 全都跟着走既有那条路，isSentenceScopedPage / syncSelectionHighlightLayers / applySynonym
// 一行都不用改。
function handleGrammarOfferAccept(pageIndex) {
    try {
        const s = AppState.synonymState;
        if (!s || normalizeSynonymMode(s.mode) !== 'grammar') return;
        const idx = (typeof pageIndex === 'number' && isFinite(pageIndex) && pageIndex >= 0) ? Math.floor(pageIndex) : -1;
        if (idx < 0) return;
        const note = getGrammarNote(s, idx);
        const offer = note.sentenceOffer;
        if (!offer.length) return;
        // 没有可核对的整句范围就不许切 —— 整句改写没地方落，applySynonym 会原地中止
        if (getValidSentenceRange(s) === null) return;

        const hb = (s.historyByMode && typeof s.historyByMode === 'object') ? s.historyByMode : emptySynonymHistory();
        const pages = Array.isArray(hb.grammar) ? hb.grammar.slice() : [];
        pages[idx] = offer.slice();
        hb.grammar = pages;

        const notes = Array.isArray(s.grammarNotes) ? s.grammarNotes.slice() : [];
        notes[idx] = {
            status: 'issues',
            issue: note.sentenceIssue || note.issue,
            scope: 'sentence',
            code: '',
            sentenceIssue: '',
            sentenceOffer: []
        };
        updateSynonymState({ historyByMode: hb, grammarNotes: notes });
    } catch (e) {
        console.error(e);
    }
}

// 应用同义词
// scope: 'selection'（默认；替换 / 简化 / 词级语法都走这条，行为一个字节都没变）
//        'sentence'（语法模式的整句改写：替换范围必须是 sentenceRange）
// 作用域是跟着建议一起传进来的，不在这里重新猜。范围核对不上就中止 ——
// 把一整句改写塞进一个词的位置会直接搅烂正文，宁可什么都不做。
function applySynonym(synonym, scope) {
    // 【改动前这里是一个光秃秃的 `return`】没有提示、不关弹窗、什么状态都不动。
    // 结果就是一个「悬空的弹窗」：候选项还在，鼠标划过去还变蓝、还出 ⇄ 图标，
    // 点下去**一个字都不会变，而且永远不会变**，用户完全无从知道发生了什么
    //（实测：点建议项后 srcHasElucidates=false、error=null、toast=null、弹窗照旧开着）。
    // 这个函数下面二十行的整句范围守卫本来就会把失效原因说出来
    //（「整句范围已失效（正文被改动过）…」），同一个函数里两条守卫两种态度，这一条只是被漏了。
    // 现在：把死掉的弹窗**关掉**（留着只会继续骗人），并用 toast 说清楚为什么和怎么办。
    if (!AppState.synonymState.field || AppState.activeIndex === null) {
        updateSynonymState({ show: false, loading: false, errorMessage: '' });
        try {
            showToast('这一行已经退出编辑状态，替换没有执行（正文一个字都没改）。请重新点开那一行、重新选中后再试。', 'warning');
        } catch (e) {}
        return;
    }

    const field = AppState.synonymState.field;
    const currentText = AppState.editValues[field];
    let start, end;

    if (scope === 'sentence') {
        const sr = getValidSentenceRange(AppState.synonymState);
        // 逐字核对：当前正文在该范围上必须仍然等于当初记下来的那一句
        if (!sr || typeof currentText !== 'string'
            || sr.end > currentText.length
            || currentText.substring(sr.start, sr.end) !== sr.text) {
            updateSynonymState({
                loading: false,
                errorMessage: '整句范围已失效（正文被改动过），未做任何替换。请重新选中后再试。'
            });
            return;
        }
        start = sr.start;
        end = sr.end;
    } else {
        // ============= 选区范围也要逐字核对（F3）=============
        // 【实测的原始故障】这里原来是光秃秃的三行：拿下来 selectionRange 就直接 substring 拼接，
        // 没有任何「这段范围现在还是不是当初那段文字」的核对。而 editValues 会在弹窗还开着的时候
        // 被换掉 —— handleHistoryNav（行首的 ↺/↻）和 addHistory 都不关弹窗。实测：
        //   · 选中译文里的「存在性」[11,14] → 点 ↻ 切到另一版 → [11,14] 现在盖住的是「跳无人」
        //     → 点候选词，「…多跳无人机网络中…」变成「…多存在机网络中…」，toast=null、error=null，
        //     按 Update 之后落进 pair.tgt 并随 xportPersistSoon 落盘；
        //   · 反方向（撤销到更短的一版）则把候选词追加到句尾，要替换的词一个字没动。
        // 同一个函数上面那条 sentence 分支**有**逐字核对，两条守卫两种态度，这一条被漏了。
        // 【修法与 chatApplyProposal 的闸门 3 同一把尺子】原位对得上就用原位；对不上就在正文里
        // 找当初选中的那段文字，恰好一处才重定位，零处或多处一律中止并说明原因。
        const range = AppState.synonymState.selectionRange;
        const orig = AppState.synonymState.originalText;
        const bad = () => {
            updateSynonymState({
                loading: false,
                errorMessage: '选中范围已失效（正文被改动过），未做任何替换。请重新选中后再试。'
            });
        };
        if (!range || typeof currentText !== 'string'
            || typeof range.start !== 'number' || typeof range.end !== 'number'
            || typeof orig !== 'string' || orig === '') { bad(); return; }
        if (range.start >= 0 && range.end <= currentText.length
            && currentText.substring(range.start, range.end) === orig) {
            start = range.start;
            end = range.end;
        } else {
            let n = 0, at = currentText.indexOf(orig), first = at;
            while (at !== -1) { n++; if (n > 1) break; at = currentText.indexOf(orig, at + 1); }
            if (n !== 1) { bad(); return; }   // 0 处 = 没了；≥2 处 = 有歧义。两种都中止。
            start = first;
            end = first + orig.length;
        }
    }

    const newText = currentText.substring(0, start) + synonym + currentText.substring(end);

    // 更新状态
    AppState.editValues[field] = newText;
    
    // 直接更新 textarea 的值（避免重新渲染）
    const textarea = document.getElementById(`editTextarea_${field}_${AppState.activeIndex}`);
    if (textarea) {
        textarea.value = newText;
        // 设置光标位置到替换文本末尾
        const newCursorPos = start + synonym.length;
        textarea.setSelectionRange(newCursorPos, newCursorPos);
        textarea.focus();
    }

    // 关闭弹窗
    updateSynonymState({ show: false });
}

// 语法模式的选项按「页码 + 下标」回查，不把文本内联进 onclick 字符串。
// 原因有二：
//   1) 整句改写里会出现 \cite{...}、$x_i$、引号，内联进 JS 字符串字面量会被吃掉反斜杠；
//   2) 作用域必须和这一页的判定结果绑死，不能在应用时再猜一次。
function applySynonymOption(pageIndex, optionIndex) {
    try {
        const s = AppState.synonymState;
        const mode = normalizeSynonymMode(s.mode);
        const page = getSynonymHistory(s, mode)[pageIndex];
        if (!Array.isArray(page)) return;
        const text = page[optionIndex];
        if (typeof text !== 'string' || !text) return;
        const scope = isSentenceScopedPage(s, mode, pageIndex) ? 'sentence' : 'selection';
        applySynonym(text, scope);
    } catch (e) {
        console.error(e);
    }
}

// （原 handleSummary 已删除。它是「把全文拼起来发给模型要一段摘要」的一次性动作，
//   没有系统提示、没有长度约束、也没法引导，出来的东西固定塞进右栏的抽屉里。
//   顶栏那颗按钮现在改成 chatToggle()，开的是可自由拖动的浮动对话窗。）

// 连接本地服务器
async function handleConnectLocal() {
    setState({ isConnectingLocal: true, error: null });
    
    try {
        const models = await fetchLocalModels(AppState.localBaseUrl);
        setState({ localModels: models });
        
        let selectedModelId;
        if (models.length > 0) {
            selectedModelId = models[0].id;
            setState({ apiProvider: 'local', selectedModel: selectedModelId });
        } else {
            selectedModelId = 'local-model';
            setState({ apiProvider: 'local', selectedModel: selectedModelId });
        }
        
        // 保存到 localStorage
        try {
            localStorage.setItem('apiProvider', 'local');
            localStorage.setItem('selectedModel', selectedModelId);
            localStorage.setItem('localBaseUrl', AppState.localBaseUrl);
        } catch (e) {}
        
        setState({ showLocalSettings: false });
        // B1：刚换过地址/刚连上，之前那份按 origin 的能力缓存要么不存在要么属于旧地址。
        // 顺手预热一次，用户随后打开设置就能立刻看到能力信息，而不是先看几秒「读取中」。
        xportCapsWarm();
    } catch (e) {
        setState({ error: e.message });
    } finally {
        setState({ isConnectingLocal: false });
    }
}

// ============= 在线模型列表刷新（只由用户显式点击触发）=============
// 刻意不做启动自动刷新 / 打开 Settings 自动刷新：/v1/models 有限流，且首屏不该依赖网络。
// 【不变量，改代码时请守住】任何失败路径只写 AppState.modelRefresh，绝不写 fetchedModels、
// 绝不触碰 DEFAULT_MODEL_CATALOG —— 可用列表永远只增不减，不会出现「点了更新，模型没了」。

// 把 Settings 里还没点保存的输入框内容同步进 AppState 再落盘。
// 必须先做：setState(L167) 会通过 root.innerHTML 全量重渲染，不同步的话刚粘贴的 Key 会被冲掉，
// 而且刷新会拿旧 Key 去请求、误报 NO_KEY。沿用 handleConnectLocalClick(L2951) 的既有模式。
function syncSettingsInputsToState() {
    [
        ['geminiApiKeyInput', 'geminiApiKey'],
        ['openaiApiKeyInput', 'openaiApiKey'],
        ['claudeApiKeyInput', 'claudeApiKey'],
        ['claudeProxyUrlInput', 'claudeProxyUrl']
    ].forEach(function (pair) {
        const input = document.getElementById(pair[0]);
        if (input) {
            AppState[pair[1]] = input.value.trim();
            try {
                localStorage.setItem(pair[1], AppState[pair[1]]);
            } catch (e) {}
        }
    });
}

function persistOnlineCatalog() {
    try {
        const payload = { v: MODEL_CATALOG_SCHEMA_VERSION };
        MODEL_PROVIDERS.forEach(function (p) {
            payload[p] = {
                at: AppState.modelRefresh[p].at || 0,
                models: (AppState.fetchedModels[p] || []).map(m => ({
                    id: m.id, name: m.name, group: m.group || 'chat', created: m.created || ''
                }))
            };
        });
        localStorage.setItem(MODEL_CATALOG_LS_KEY, JSON.stringify(payload));
    } catch (e) {}
}

function loadOnlineCatalog() {
    try {
        const saved = localStorage.getItem(MODEL_CATALOG_LS_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (!parsed || parsed.v !== MODEL_CATALOG_SCHEMA_VERSION) return;   // 版本不匹配 → 当作没有缓存
        let visibilityPatched = false;
        MODEL_PROVIDERS.forEach(function (p) {
            const bucket = parsed[p];
            if (!bucket || !Array.isArray(bucket.models)) return;
            let models = bucket.models.map(function (m) {
                // 白名单对 localStorage 里的数据同样生效：即使有人手工篡改也注入不进来。
                // id 走 SAFE_MODEL_ID，name 走去标签 + 截断（它会被渲染进顶栏标签/下拉/勾选框）。
                const id = sanitizeModelId(m && m.id);
                return id ? {
                    id: id,
                    name: String((m && m.name) || id).replace(/[<>]/g, '').slice(0, 120) || id,
                    group: m.group === 'other' ? 'other' : 'chat',
                    created: m.created || '',
                    provider: p
                } : null;
            }).filter(Boolean);
            // Gemini 的文本/非文本过滤规则可能在这份缓存写入之后变严过（比如新增了黑名单词）。
            // 缓存是纯回放，不会重新走 fetchGeminiModelList，所以这里必须重新套一遍同一个判定，
            // 否则老版本缓存过的图像/TTS/live 模型会在「点更新之前」一直显示在下拉里。
            if (p === 'gemini') {
                models = models.filter(m => isGeminiTextChatModelId(m.id));
            }
            if (models.length === 0) return;

            // 兜底补齐可见性键。缓存（onlineModelCatalog）和可见性表（modelVisibility）是两次
            // 互相独立、各自吞异常的写入，只要有一份没落盘（配额爆掉 / 用户清了单个键 / 隐私模式 /
            // 跨设备手搬），这里几十个 id 在 modelVisibility 里就全都不存在 → 全代码库的
            // `!== false` 判定一律放行 → 顶栏下拉一次性灌进上百个模型。
            // 规则与 mergeVisibilityForProvider 一致：内置目录里的默认可见，其余默认隐藏。
            // 只补缺失的键，不改已有值，所以是幂等的；这里是纯读缓存路径，刻意不做剪枝。
            const builtinIds = new Set(DEFAULT_MODEL_CATALOG.filter(x => x.provider === p).map(x => x.id));
            models.forEach(function (m) {
                if (!(m.id in AppState.modelVisibility)) {
                    AppState.modelVisibility[m.id] = builtinIds.has(m.id);
                    visibilityPatched = true;
                }
            });

            AppState.fetchedModels[p] = models;
            AppState.modelRefresh[p] = {
                status: 'ok', at: bucket.at || 0, count: models.length,
                errCode: null, errMsg: '', source: 'cache'
            };
        });
        if (visibilityPatched) {
            try {
                localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
            } catch (e) {}
        }
    } catch (e) {}
}

// 合并可见性。新 id 必须**显式写入布尔值**：全代码库用 `!== false` 判定可见，
// 留空等于默认打开，一次刷新会把 50-90 个 id 一股脑灌进顶栏下拉。
// 新发现的模型默认隐藏，用户到「本次新发现」横幅一键放行。
// ⚠️ 必须在覆盖 AppState.fetchedModels[provider] **之前**调用（剪枝要用到旧值）。
function mergeVisibilityForProvider(provider, models) {
    const builtinIds = new Set(DEFAULT_MODEL_CATALOG.filter(m => m.provider === provider).map(m => m.id));
    const newIds = [];
    models.forEach(function (m) {
        if (!(m.id in AppState.modelVisibility)) {
            AppState.modelVisibility[m.id] = builtinIds.has(m.id);
            if (!builtinIds.has(m.id)) newIds.push(m.id);
        }
    });

    // 剪枝：只清理「上次从这家 API 拉到、这次没再返回」的孤儿键，且要过四重保护
    // （本次结果 / 内置目录 / 本地模型 / 当前选中项）。不剪枝的话 loadSavedSettings 的
    // 浅合并会让这个 map 随每次模型换代无限膨胀。
    const keepIds = new Set(models.map(m => m.id));
    DEFAULT_MODEL_CATALOG.forEach(m => keepIds.add(m.id));
    (AppState.localModels || []).forEach(lm => keepIds.add(lm.id));
    if (AppState.selectedModel) keepIds.add(AppState.selectedModel);
    (AppState.fetchedModels[provider] || []).forEach(function (old) {
        if (!keepIds.has(old.id)) delete AppState.modelVisibility[old.id];
    });

    return newIds;
}

async function refreshOnlineModels(providers) {
    const targets = (providers && providers.length ? providers : MODEL_PROVIDERS)
        .filter(p => MODEL_PROVIDERS.indexOf(p) >= 0);
    if (targets.length === 0) return;

    syncSettingsInputsToState();

    const keyOf = {
        gemini: AppState.geminiApiKey,
        openai: AppState.openaiApiKey,
        claude: AppState.claudeApiKey
    };
    if (targets.every(p => !keyOf[p])) {
        showToast('请先在下方填写至少一个 API Key', 'warning');
        return;
    }

    targets.forEach(function (p) {
        AppState.modelRefresh[p] = { ...AppState.modelRefresh[p], status: 'loading', errCode: null, errMsg: '' };
    });
    AppState.newlyFoundIds = [];
    setState({});   // 让按钮和芯片先进入 loading 态

    // 'loading' 同时充当 UI 状态和并发锁（芯片 disabled / anyRefreshing / refreshOnlineModelsClick
    // 的守卫都读它），所以下面整段必须包在 try/finally 里 —— 漏一次解锁就是永久死锁，
    // 用户只能刷新整个页面才能再点「更新」。
    try {
    const tasks = targets.map(function (p) {
        if (p === 'gemini') return fetchGeminiModelList(AppState.geminiApiKey);
        if (p === 'openai') return fetchOpenaiModelList(AppState.openaiApiKey, !AppState.showDatedSnapshots);
        return fetchClaudeModelList(AppState.claudeApiKey, AppState.claudeProxyUrl);
    });

    // 必须是 allSettled：用 all 的话一家没填 Key 会把另外两家已成功的结果一起拖垮
    const results = await Promise.allSettled(tasks);

    const summary = [];
    const allNew = [];
    results.forEach(function (r, i) {
        const p = targets[i];
        if (r.status === 'fulfilled' && Array.isArray(r.value) && r.value.length > 0) {
            const models = r.value;
            allNew.push(...mergeVisibilityForProvider(p, models));   // 先合并（用得到旧值）
            AppState.fetchedModels[p] = models;                      // 再覆盖
            AppState.modelRefresh[p] = {
                status: 'ok', at: Date.now(), count: models.length,
                errCode: null, errMsg: '', source: 'live'
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} ${models.length} 个`);
        } else if (r.status === 'fulfilled') {
            // 返回 0 条：**不覆盖**旧列表。project-scoped key 的模型白名单会真实导致空列表，
            // 当成成功覆盖会把用户的列表清空。
            AppState.modelRefresh[p] = {
                ...AppState.modelRefresh[p], status: 'error',
                errCode: 'EMPTY', errMsg: '返回 0 个可用模型，已保留原列表'
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} 返回空`);
        } else {
            const info = classifyModelFetchError(r.reason);
            AppState.modelRefresh[p] = {
                ...AppState.modelRefresh[p], status: 'error',
                errCode: info.errCode, errMsg: info.errMsg
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} 失败`);
        }
    });

    AppState.newlyFoundIds = allNew;

    try {
        localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
    } catch (e) {}
    persistOnlineCatalog();

    const okCount = targets.filter(p => AppState.modelRefresh[p].status === 'ok').length;
    if (okCount === targets.length) {
        showToast(`已更新：${summary.join(' · ')}${allNew.length ? `（新增 ${allNew.length} 个，默认隐藏）` : ''}`, 'success');
    } else if (okCount > 0) {
        showToast(`部分更新：${summary.join(' · ')}`, 'warning');
    } else {
        showToast('更新失败，仍在使用上次的列表', 'error');
    }
    } finally {
        // 任何抛错路径都必须解锁。不变量照旧：只写 modelRefresh，绝不碰 fetchedModels。
        let stuck = false;
        MODEL_PROVIDERS.forEach(function (p) {
            if (AppState.modelRefresh[p].status === 'loading') {
                AppState.modelRefresh[p] = {
                    ...AppState.modelRefresh[p], status: 'error',
                    errCode: 'HTTP', errMsg: '刷新意外中断，已保留原列表'
                };
                stuck = true;
            }
        });
        if (stuck) renderApp();
    }
}

// ============= 全局历史管理 =============

// 这一段译文里有几行是「本段翻译失败」的占位标记。0 = 完好。
// 只做字符串比对，不抛。
function countFailMarks(pairs) {
    let n = 0;
    try {
        if (!Array.isArray(pairs)) return 0;
        for (let i = 0; i < pairs.length; i++) {
            const t = pairs[i] && pairs[i].tgt;
            if (typeof t === 'string' && t.indexOf(XPORT_FAIL_MARK) !== -1) n++;
        }
    } catch (e) { return n; }
    return n;
}

// opts.auto = true 表示这是**定时器**发起的自动存档（不是用户点的保存）。
// 上一版第 6 条最狠的一半就在这里：某一批失败后，自动存档会把一份带缺口的文档
// 写回同一个 id，把归档里那份完好的覆盖掉，用户连找回的机会都没有。
// 规则：自动存档绝不用「更破」的版本覆盖归档里「更完好」的版本。手动保存不受限制
// （用户明确要求保存时，他自己知道自己在存什么）。
function addToGlobalHistory(pairs, sid, opts) {
    if (pairs.length === 0) return;

    let history = [...AppState.globalHistory];
    const existingIndex = history.findIndex(item => item.id === sid);
    // 自动存档去重：内容与归档里**任何**一份逐字相同就什么都不做。
    // 【为什么需要】从历史恢复出来的文档现在会拿到一个新的会话 id（见 restoreGlobalHistory
    // 里那段注释），不去重的话「恢复一下、什么都没干」也会在一个存档周期后凭空多出一条
    // 近乎重复的快照，Keep-Last 5 很快就把真正的旧版本挤出去了。手动保存不受限制。
    if (opts && opts.auto) {
        let incomingJson = null;
        try { incomingJson = JSON.stringify(pairs.map(p => [p && p.src, p && p.tgt])); } catch (e) { incomingJson = null; }
        if (incomingJson !== null) {
            for (let i = 0; i < history.length; i++) {
                let hj = null;
                try { hj = JSON.stringify((history[i].pairs || []).map(p => [p && p.src, p && p.tgt])); } catch (e) { hj = null; }
                if (hj !== null && hj === incomingJson) return;
            }
        }
    }
    if (opts && opts.auto && existingIndex !== -1) {
        const incoming = countFailMarks(pairs);
        const archived = countFailMarks(history[existingIndex].pairs);
        if (incoming > archived) {
            console.warn('[history] 自动存档已跳过：当前文档有 ' + incoming +
                ' 段失败标记，归档里那份只有 ' + archived + ' 段，不覆盖。');
            return;
        }
    }
    const updatedPairs = JSON.parse(JSON.stringify(pairs));

    // ============= 归档条目必须带着**这份文档的方向** =============
    // 【实测的原始故障（F1）】归档条目原来只有 {id, timestamp, pairs}，一个语言字段都没有。
    // 于是「翻一份英文稿 → 存档 → 翻一份中文稿（方向变成 zh→en）→ 从 RECENT SESSIONS
    // 恢复那份英文稿」之后，AppState.sourceLang 还停在 'zh'，而屏幕上的原文栏是英文：
    //   · 顶栏芯片实测渲染成 ZH 高亮（`setLanguage('zh','en')`），说的和屏幕上的对不上；
    //   · 在英文原文里双击 "existence" 开替换弹窗，wire text 实测是 `Language: Chinese`，
    //     回来的候选是 ["存在","存续","显现","踪迹"]，点一下就把中文塞进英文原文
    //     （实测 pair.src = "…hide the very 存在 of a transmission…"，toast/error 全 null）；
    //   · 智能更新的 wire text 实测是 `Task: Translate the "New Source" to English.`
    //     —— 对着一份英文原文说要译成英文。
    // 方向是这份文档的属性，不是会话的属性，所以它必须跟着文档一起进归档。
    // （旧版本写进 IndexedDB 的条目没有这两个字段，restoreGlobalHistory 那边对缺字段的
    //   条目退回 detectLanguage，见那里的注释。）
    const stamp = {
        sourceLang: AppState.sourceLang,
        targetLang: AppState.targetLang,
        isAutoDetect: AppState.isAutoDetect === true
    };

    if (existingIndex !== -1) {
        history[existingIndex] = {
            ...history[existingIndex],
            timestamp: Date.now(),
            pairs: updatedPairs,
            ...stamp
        };
        const item = history.splice(existingIndex, 1)[0];
        history.unshift(item);
    } else {
        const newItem = {
            id: sid,
            timestamp: Date.now(),
            pairs: updatedPairs,
            ...stamp
        };
        history = [newItem, ...history];
    }

    // opts.skipRender = true：只写状态、不重画。给 handleInputChange 那条路用 ——
    // 它挂在每一次击键上，一次 renderApp 会把 <textarea> 整个换掉、焦点掉到 body，
    // 之后的击键全部落空（文件里已经因为这个失败模式修过两次，见 handleRowClick 上方注释）。
    setState({ globalHistory: history.slice(0, AppState.historyLimit) },
        { skipRender: !!(opts && opts.skipRender) });
    xportPersistSoon();
}

// ============= 归档槽位的钥匙：会话 id =============
// addToGlobalHistory 用 sessionId 去 findIndex 归档里的槽位，**对上就整份替换 pairs**。
// 所以 sessionId 的含义只能有一个：「屏幕上这一份文档」。换了一份文档就必须换一把钥匙。
//
// 【实测的原始故障（B3）】上一版只有 handleClear 和 restoreGlobalHistory 换钥匙，
// handleTranslate 从来不换：保存文档 A → 粘贴文档 B → 翻译 → 保存，
// A 的归档槽位里躺的就是 B 了，A 在任何地方都不存在。翻译一次 = 换了一份文档，
// 这是这个应用里最常见的一个动作，也是最容易毁掉旧存档的那一个。
//
// 每一处「整份文档被替换」都从这里取钥匙，一处都不许自己拼 Date.now()：
// 同一毫秒内连按两次会拿到同一把钥匙，第二份文档又会盖掉第一份。
function xportNewSessionId() {
    let nid = String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
    try {
        const used = {};
        used[String(AppState.sessionId)] = 1;
        const gh = AppState.globalHistory || [];
        for (let i = 0; i < gh.length; i++) used[String(gh[i] && gh[i].id)] = 1;
        let guard = 0;
        while (used[nid] && guard++ < 50) nid = String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
    } catch (e) {}
    return nid;
}

// 从归档里恢复一份文档。**恢复必须是非破坏性的**：既不能被在途请求顶掉，也绝不能让
// 它来的那个归档槽位被覆盖。
//
// 【实测的原始故障，两个都是「内容哪儿都不剩了」】
//   ① 慢翻译在飞的时候恢复 A：A 上屏 → B 的响应落地把 pairs 换成 B 的 8 行（sessionId /
//      inputText 还是 A 的）→ 一个自动存档周期后，B 的内容被写进 A 的归档槽位。
//      终态实测 alphaTextExistsAnywhere: false —— 文档 A 屏幕上没有、归档里也没有了。
//   ② 某一行处于编辑态时恢复：activeIndex / editValues 还指着**上一份文档**，随后
//      随便点一下空白就把上一份的草稿 saveRowUpdate 到恢复出来这份的同一行号上，
//      并且「只有一侧变了」还会顺手发一次 AI 请求把另一栏改写掉。
//
// 【三道修法，都是「让它不可能发生」而不是「事后提示」】
//   · docGeneration 加一 + abort：在途请求既拦得住（abort），落地那一刻也认不出自己的
//     文档（代号比对），两条路都堵死。
//   · **换一个新的会话 id**（xportNewSessionId）：恢复出来的这份是一个新的工作副本，
//     item.id 那个归档槽位从此不会再被这个会话写到。为了不让「恢复一下就多一条重复快照」，
//     自动存档那边加了逐字去重（见 addToGlobalHistory）。
//     ⚠️ 这条只保证**恢复**这条路：归档槽位被覆盖这件事本身并没有从根上消失，它的另一半
//     在 handleTranslate —— 翻译一份新文档同样必须换钥匙，否则旧存档照样被顶掉（B3）。
//     上一版这里写着「这是从根上不可能发生的唯一写法」，那句话当时就不成立：
//     验证的人正是在这段注释的作用域里，用「保存 A → 粘 B → 翻译 → 保存」把 A 的槽位覆盖掉的。
//     换钥匙这件事的完整性由 xportNewSessionId 的**每一个**调用点共同保证，不由这一处。
//   · 把整份会话级的临时状态全部归零，一条不落。
function restoreGlobalHistory(item) {
    if (!item || !Array.isArray(item.pairs)) return;

    // 在途的东西一律先掐掉：整篇翻译、逐行智能更新、逐行重新生成、整篇重新生成、
    // 自动翻译防抖、选词弹窗请求。任何一个漏掉，它落地时都会写到**别的文档**上。
    AppState.docGeneration++;
    try { if (AppState.mainAbortController) AppState.mainAbortController.abort(); } catch (e) {}
    AppState.mainAbortController = null;
    try { if (AppState.regenerateAllAbortController) AppState.regenerateAllAbortController.abort(); } catch (e) {}
    AppState.regenerateAllAbortController = null;
    try { AppState.rowAbortControllers.forEach(function (c) { try { c.abort(); } catch (e) {} }); AppState.rowAbortControllers.clear(); } catch (e) {}
    try { AppState.regenerateAbortControllers.forEach(function (c) { try { c.abort(); } catch (e) {} }); AppState.regenerateAbortControllers.clear(); } catch (e) {}
    try { if (AppState.debounceTimer) clearTimeout(AppState.debounceTimer); } catch (e) {}
    AppState.debounceTimer = null;
    try { if (AppState.synonymAbort) AppState.synonymAbort.abort(); } catch (e) {}
    AppState.synonymAbort = null;

    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }

    AppState.isRestoringHistory = true;

    // 归档里存的 pairs 直接引用进来会让后续编辑就地改到归档那份对象上。深拷贝。
    let pairs;
    try { pairs = JSON.parse(JSON.stringify(item.pairs)); } catch (e) { pairs = item.pairs; }
    const restoredText = joinPairsAsDocument('src', pairs);

    // ============= 恢复出来的这份文档，方向必须当场确定 =============
    // 【实测的原始故障（F1）】这个函数原来全文不含 sourceLang / targetLang / detectLanguage，
    // 于是恢复完之后 AppState 的方向还是**上一份文档**的。屏幕上是英文原文、芯片写着 ZH，
    // 替换弹窗按 sourceLang='zh' 发 `Language: Chinese` 并把中文候选塞进英文原文，
    // 智能更新则说 `Task: Translate the "New Source" to English`。全程 toast=null / error=null。
    // 【三段优先级】
    //   ① 归档条目自带方向（addToGlobalHistory 从现在起一律写进去）—— 它就是这份文档
    //      当初真正跑的那个方向，是唯一的事实来源，手动锁定与否都以它为准。
    //   ② 旧条目没有这两个字段：只在 AUTO（isAutoDetect）时重新检测，与 handleTranslate /
    //      handleRegenerateAll 逐字同一条规则 —— 手动锁定的意思就是「别猜」。
    //   ③ 旧条目 + 手动锁定：一个字节都不动（保持用户自己锁的方向）。
    // 检测的输入必须先剥掉颜色宏：restoredText 优先用 srcRaw，`\textcolor{purple}{` 里的
    // 拉丁字母会被 detectLanguage 算进 en 那一边（它只数汉字和 a-zA-Z）。
    let restSrcLang = AppState.sourceLang, restTgtLang = AppState.targetLang;
    if ((item.sourceLang === 'zh' || item.sourceLang === 'en')
        && (item.targetLang === 'zh' || item.targetLang === 'en')) {
        restSrcLang = item.sourceLang;
        restTgtLang = item.targetLang;
    } else if (AppState.isAutoDetect) {
        let basis = restoredText;
        try { basis = stripTextColorForModel(restoredText); } catch (e) { basis = restoredText; }
        const detected = detectLanguage(basis);
        restSrcLang = detected.src;
        restTgtLang = detected.tgt;
    }

    setState({
        // 新会话 id：归档里 item.id 那一条从此不会再被这个会话写到。
        sessionId: xportNewSessionId(),
        translationPairs: pairs,
        inputText: restoredText,
        // 顶栏芯片、替换/简化/语法弹窗、智能更新全都从这两个字段取方向 —— 它们必须
        // 和屏幕上这份文档一致，而不是和上一份文档一致。
        sourceLang: restSrcLang,
        targetLang: restTgtLang,
        // ⚠️ originalInputText 必须跟着一起换。它是「重新生成所有翻译」的输入源，
        //    不换的话恢复完历史再点重新生成，会拿**上一份文档**去覆盖刚恢复出来的这份，
        //    并且随后自动存档会把归档也一起覆盖掉（上一版第 7 条）。
        originalInputText: restoredText,
        lastTransportFailures: 0,
        isEditingMode: false,
        showHistoryMenu: false,
        // ---- 会话级临时状态，一条不落地归零 ----
        isLoading: false,
        isRegeneratingAll: false,
        isRefining: false,
        activeIndex: null,
        editValues: { src: '', tgt: '' },
        refinePrompt: '',
        error: null,
        toast: null,
        activeSettingsPopup: null,
        activeSettingsIndex: null,
        activeSettingsSide: null,
        crossHighlight: { seq: 0, idx: null, fromSide: null, toSide: null, fragments: [], status: 'idle', via: '' }
    });
    AppState.lastTranslatedText = restoredText;
    AppState.lastEquationLoss = 0;
    AppState.srcEditedSinceTranslate = false;
    updateSynonymState({ show: false });

    // 恢复一份翻译 ⇒ 把属于这份翻译的那段对话也接回来（换文档则归档旧的、绝不带过去）。
    // 【放在 setState 之后】chatSyncSession 读的是 AppState.sessionId，必须先换成新的那一份。
    // 【为什么可以放在这里】整个聊天窗挂在 #root 外面、状态在 ChatState 里、自己做定点重绘，
    // 从不调用 setState —— 所以这一行不可能把 renderApp 拖进递归，也不可能让它抛。
    try { chatSyncSession(); } catch (e) { console.error('[chat] syncSession on restore failed', e); }

    setTimeout(() => {
        AppState.isRestoringHistory = false;
    }, 500);
    xportPersistSoon();
}

// ============================================================================
// ============= 会话内容的落盘（IndexedDB）与可再武装的自动存档定时器 =============
// ============================================================================
//
// 【改动前的实测事实】翻译内容、逐行撤销栈、globalHistory **全部只活在内存里**：
// 刷新一次页面 `{pairs:10, ghLen:1}` 变成 `{pairs:0, inputLen:0, ghLen:0}`，历史面板空白。
// 全文件 grep 不到一处 indexedDB / sessionStorage，localStorage 里那 11 个键 273 个字符
// **全是设置**。每一个设置都持久化，没有任何一份内容持久化。
// 而界面同时摆着「自动保存」间隔、「Keep Last: 5/10/20」和一列 RECENT SESSIONS ——
// 它承诺了一件它根本没做的事。文件里第二位作者甚至已经**依赖**了这个承诺：对话窗那段
// 注释说不落盘聊天记录的理由是「globalHistory 已经存着最多 5 份全文」。它存着 0 份。
//
// 【为什么是 IndexedDB 而不是 localStorage】localStorage 每个源大约 5 MB（实测这台机器
// 5,242,880 个 UTF-16 单元），而且是**同步**的、跟 37 处设置写共用同一个配额。
// 用户的 main.tex 单文件就 318 KB，切成句对（src + tgt + 每行撤销栈）序列化之后一份就
// 超过 1 MB；界面承诺的「保留最近 20 份」在 localStorage 里连一半都放不下，而一旦撞上限，
// 那 37 处 `try{...}catch(e){}` 空体会把每一次设置写都静默吞掉（实测：配额满时
// setRowGap / saveGeminiApiKey 全部失败，AppState 更新了、localStorage 是 null、
// 弹窗照常关闭，用户的 API key 下次打开就没了）。所以内容一律走 IndexedDB：异步、
// 不阻塞渲染、配额是磁盘可用空间的量级、存结构化克隆不用 JSON 字符串化。
// 设置继续留在 localStorage —— 它们只有几百字节，且需要在首帧之前同步读到。
//
// 【不可协商的两条】
//   1. 写失败必须**看得见**。配额、隐私模式、IDB 被禁用，任何一种都会弹一条 toast、
//      在历史菜单里留一行常驻提示、并写 console.error。绝不静默。
//   2. **绝不**为了腾地方悄悄丢内容。淘汰只由用户自己设的 Keep-Last 决定；
//      写不下就报错，而不是偷偷少存一份。
const XPORT_DB_NAME = 'ai-translator';
const XPORT_DB_STORE = 'session';
const XPORT_DB_KEY = 'live';
const XPORT_PERSIST_DEBOUNCE = 1200;

let xportPersistTimer = null;      // 防抖句柄
let xportPersistInFlight = false;  // 正在写
let xportPersistAgain = false;     // 写的过程中又有新变化
let xportPersistDb = null;         // 已打开的连接
let xportPersistBooted = false;    // 启动恢复跑过了没有（跑之前不许写，否则空状态会盖掉盘上那份）

// 失败必须留下痕迹：toast 会自己消失，这两个字段是常驻的（历史菜单里渲染成一行红字）。
function xportPersistFail(where, err) {
    const msg = (err && (err.name === 'QuotaExceededError' || (err.message || '').indexOf('quota') !== -1))
        ? '浏览器存储配额已满，本次会话没能存到本地。请在历史菜单里把 Keep Last 调小，或导出后清理。'
        : '本地存档失败（' + where + '）：' + ((err && (err.message || err.name)) || '未知错误')
          + '。这次会话刷新后可能找不回来。';
    AppState.persistError = msg;
    AppState.persistOkAt = 0;
    try { console.error('[persist] ' + where, err); } catch (e) {}
    // toast 只在错误内容变化时弹一次，免得每次自动存档都糊一屏
    if (AppState.persistErrorShown !== msg) {
        AppState.persistErrorShown = msg;
        try { showToast(msg, 'warning'); } catch (e) {}
    }
}

// ============= open 可能**一个回调都不给** =============
// 【实测（真 Chrome 150.0.7871.182，headless=new，直接打开一个 file:// 页面）】
// README 第 4 行说的用法就是「直接用浏览器打开 AI-Translator.html」。那种打开方式下：
//   location.protocol='file:'、location.origin='file://'、typeof indexedDB==='object'
//   （所以下面那道 undefined 闸门放行），而 indexedDB.open() 的
//   onsuccess / onerror / onblocked **一个都不触发** —— 实测 5 秒内零回调（虚拟时间 12 秒）。
// 于是这个 Promise 永远不 settle，连锁后果全是静默的：
//   · xportPersistRestore 的 then 和 catch 都不跑 → xportPersistBooted 永远是 false
//     → xportPersistNow 第一行就 return false，**一个字节都不会写**；
//   · armAutoSaveTimer() 挂在那个 then 里 → 自动存档定时器从来没被装上；
//   · persistError 永远是 null → 顶栏角标不亮、历史面板一直写着
//     「本地存档已就绪，还没写过；内容变化 1.2 秒后自动写入」。
// 也就是说，本轮修掉的那条「写失败时界面还在承诺自动写入」，在**默认打开方式**下换了个
// 机制原样存在：那边是 reject 之后角标不亮，这里是根本不 reject。
// 挂住不是「还没轮到自己」，超时就当失败：报出来，并把 booted 放行 —— xportPersistNow 里
// 那道 foreign 比对（cur.savedAt > xportPersistSeenAt 且 owner 不是我）会挡住
// 「没恢复成功却拿空状态覆盖盘上那条」，所以放行写是安全的。
// 迟到的 onsuccess 仍然会把连接填进 xportPersistDb，下一次写就会成功并自动清掉这条错误。
const XPORT_DB_OPEN_TIMEOUT = 8000;

function xportPersistOpen() {
    if (xportPersistDb) return Promise.resolve(xportPersistDb);
    return new Promise(function (resolve, reject) {
        let req, settled = false;
        const done = function (fn, arg) { if (settled) return; settled = true; fn(arg); };
        try {
            if (typeof indexedDB === 'undefined' || !indexedDB) { reject(new Error('这个浏览器/隐私模式下没有 IndexedDB')); return; }
            req = indexedDB.open(XPORT_DB_NAME, 1);
        } catch (e) { reject(e); return; }
        req.onupgradeneeded = function () {
            try {
                const db = req.result;
                if (!db.objectStoreNames.contains(XPORT_DB_STORE)) db.createObjectStore(XPORT_DB_STORE, { keyPath: 'id' });
            } catch (e) {}
        };
        // 赋值放在 done 之外：就算是超时之后才迟到的那次成功，也要把连接留下来给下一次写用。
        req.onsuccess = function () { xportPersistDb = req.result; done(resolve, xportPersistDb); };
        req.onerror = function () { done(reject, req.error || new Error('indexedDB.open 失败')); };
        req.onblocked = function () { done(reject, new Error('另一个标签页占住了数据库升级')); };
        try {
            setTimeout(function () {
                done(reject, new Error('indexedDB.open 等了 ' + XPORT_DB_OPEN_TIMEOUT
                    + ' 毫秒没有任何回应（用 file:// 直接打开这个页面时 Chrome 实测就是这样）。'
                    + '这种打开方式下本地存档不可用 —— 请改用一个本地 http 服务打开页面'
                    + '（任意静态服务器，然后访问 http://127.0.0.1:<端口>/AI-Translator.html）。'
                    + '在那之前，内容只活在这个标签页里，关掉就没了'));
            }, XPORT_DB_OPEN_TIMEOUT);
        } catch (e) {}
    });
}

// 一份快照（或者盘上那条记录）里到底有没有东西。空 = 没有句对、没有原文、没有归档。
function xportPersistHasContent(rec) {
    if (!rec || typeof rec !== 'object') return false;
    if (Array.isArray(rec.translationPairs) && rec.translationPairs.length > 0) return true;
    if (typeof rec.inputText === 'string' && rec.inputText.trim() !== '') return true;
    if (Array.isArray(rec.globalHistory) && rec.globalHistory.length > 0) return true;
    return false;
}

// 存什么：整份会话内容。设置一概不进来（它们在 localStorage，且要在首帧之前同步读到）。
function xportPersistSnapshot() {
    return {
        id: XPORT_DB_KEY,
        savedAt: Date.now(),
        owner: XPORT_TAB_ID,
        version: 1,
        sessionId: AppState.sessionId,
        inputText: AppState.inputText,
        originalInputText: AppState.originalInputText,
        lastTranslatedText: AppState.lastTranslatedText,
        viewMode: AppState.viewMode,
        sourceLang: AppState.sourceLang,
        targetLang: AppState.targetLang,
        isAutoDetect: AppState.isAutoDetect,
        srcEditedSinceTranslate: AppState.srcEditedSinceTranslate === true,
        // 结构化克隆存不了函数/DOM，但 pairs 和 history 都是纯数据。深拷贝一次，
        // 免得写的过程中用户继续编辑导致克隆到半路的状态。
        translationPairs: JSON.parse(JSON.stringify(AppState.translationPairs || [])),
        globalHistory: JSON.parse(JSON.stringify(AppState.globalHistory || []))
    };
}

// ============= 「另一个标签页」这件事 =============
// 【实测的原始故障 —— 这是整轮里最狠的一条】xportPersistNow 挂在 pagehide 和
// visibilitychange→hidden 上，而 visibilitychange 在**每一次切换标签页**时都会触发。
// 它又是无条件 put 整份内存状态到唯一那条 id:'live' 记录上，跨标签页零协调。
// 于是：开着一个空白的第二个标签页，用户每从它切走一次，盘上那条记录就被一份空状态
// 整个覆盖一次。端到端复现：磁盘 {pairs:2, hasWork:true} → {pairs:0, gh:0}，
// 重开一无所有，persistError=null、toast=null —— 而历史面板同时还写着
// 「已存到本地（IndexedDB），刷新页面可恢复」。内容正在消失的那一刻它在撒谎。
//
// 【两条规则，都在同一个 readwrite 事务里比对，中间没有别人插得进来的缝】
//   ① 判据只有一条：这条记录是不是**别的标签页**在我上次看过之后写的
//      （cur.savedAt > 我启动/上次写成功时看到的那个值，且 owner 不是我）。是就不许覆盖。
//      注意判据**不是**「空的不覆盖有内容的」—— 那条更直觉，但会连自己的清空一起挡掉：
//      单标签页刷新之后 owner 是上一次页面加载的 id，用户按「清空」时盘上那条正是他自己
//      刚恢复出来的内容，挡下来就等于清空按钮对本地存档无效，刷新一下东西又回来了。
//      「比我看过的更新 + 不是我写的」精确地只圈住真正的第二个标签页。
//   ② 撞上之后怎么办分两种：本页**有内容** = 让位并常驻说明（最后写的人赢是不可接受的，
//      两个标签页都有真内容时谁也没资格替对方决定哪份该留下）；本页**是空的** = 安静跳过
//      （它没有东西可丢，不必弹一条红字吓人）。两种都绝不写。
// 「不写了」是刻意的：这个标签页屏幕上的内容一个字都不会少，只是不再往盘上写；
// 想让它接管，关掉别的标签页再刷新即可。这比悄悄覆盖诚实，也比装作存上了诚实。
const XPORT_TAB_ID = 'tab-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
let xportPersistSeenAt = 0;        // 我最后一次看到/写下的那条记录的 savedAt
let xportPersistYielded = false;   // 已经让位给另一个标签页，本页不再写

function xportPersistYield() {
    if (xportPersistYielded) return;
    xportPersistYielded = true;
    // 这条字符串会被 escapeHtml 之后直接渲染成纯文本，别用任何标记语法。
    // 更要紧的是原来那句「关掉其它标签页后刷新本页」：刷新会用**盘上那一份**（另一个
    // 标签页写的）恢复本页，而本页正是没写成盘的那个，照着做就等于亲手把这里的内容删掉。
    // 所以先说导出，再说接管。
    const msg = '另一个标签页正在写同一份本地存档。为了不互相覆盖，这个标签页已经停止写入本地：'
        + '屏幕上的内容一个字都不会少，但它不会被存到本地，刷新之后以另一个标签页的版本为准。'
        + '⚠️ 刷新之前请先用复制按钮把这里的原文和译文导出 —— 刷新会用另一个标签页的那一份'
        + '替换本页内容。导出之后再关掉其它标签页刷新，本页就能重新接管本地存档。';
    AppState.persistError = msg;
    AppState.persistOkAt = 0;
    try { console.warn('[persist] ' + msg); } catch (e) {}
    if (AppState.persistErrorShown !== msg) {
        AppState.persistErrorShown = msg;
        try { showToast(msg, 'warning'); } catch (e) {}
    }
}

function xportPersistNow() {
    if (!xportPersistBooted) return Promise.resolve(false);
    if (xportPersistYielded) return Promise.resolve(false);
    if (xportPersistInFlight) { xportPersistAgain = true; return Promise.resolve(false); }
    xportPersistInFlight = true;
    let rec;
    try { rec = xportPersistSnapshot(); }
    catch (e) { xportPersistInFlight = false; xportPersistFail('快照', e); return Promise.resolve(false); }
    const mine = xportPersistHasContent(rec);
    return xportPersistOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
            let tx, store;
            try { tx = db.transaction(XPORT_DB_STORE, 'readwrite'); store = tx.objectStore(XPORT_DB_STORE); }
            catch (e) { reject(e); return; }
            let verdict = 'wrote';
            tx.oncomplete = function () { resolve(verdict); };
            tx.onerror = function () { reject(tx.error || new Error('写事务失败')); };
            tx.onabort = function () { reject(tx.error || new Error('写事务被中止')); };
            let getReq;
            try { getReq = store.get(XPORT_DB_KEY); } catch (e) { reject(e); return; }
            getReq.onerror = function () { reject(getReq.error || new Error('读事务失败')); };
            getReq.onsuccess = function () {
                try {
                    const cur = getReq.result || null;
                    // 别的标签页在我上次看过之后写过这条记录
                    const foreign = !!cur && Number(cur.savedAt) > xportPersistSeenAt
                                    && cur.owner !== XPORT_TAB_ID;
                    if (foreign) { verdict = mine ? 'yield' : 'skip-empty'; return; }
                    store.put(rec);
                } catch (e) { reject(e); }
            };
        });
    }).then(function (verdict) {
        if (verdict === 'yield') { xportPersistYield(); return false; }
        if (verdict === 'skip-empty') return false;   // 什么都没写，也什么都没坏
        AppState.persistError = null;
        AppState.persistErrorShown = null;
        AppState.persistOkAt = rec.savedAt;
        xportPersistSeenAt = rec.savedAt;
        return true;
    }).catch(function (err) {
        xportPersistFail('写入', err);
        return false;
    }).then(function (ok) {
        xportPersistInFlight = false;
        if (xportPersistAgain) { xportPersistAgain = false; if (!xportPersistYielded) xportPersistSoon(); }
        xportPersistBadgeSync();
        return ok;
    });
}

// 内容变了就叫一声。防抖 1.2 秒，连续打字只写一次。**绝不抛**：调用点全在事件链上。
function xportPersistSoon() {
    try {
        if (xportPersistTimer) clearTimeout(xportPersistTimer);
        xportPersistTimer = setTimeout(function () {
            xportPersistTimer = null;
            try { xportPersistNow(); } catch (e) { xportPersistFail('写入', e); }
            xportPersistBadgeSync();
        }, XPORT_PERSIST_DEBOUNCE);
        xportPersistBadgeSync();
    } catch (e) {}
}

// ============= 「还没写进本地」这件事必须一直看得见 =============
// 【为什么有这一节】防抖窗口（1.2 秒，后台标签页里定时器被节流后还更宽）里关标签 / 刷新，
// 那一次改动**真的会丢**，而且没有任何提示 —— 见 DOMContentLoaded 里 pagehide 那段注释，
// 那条敞口是本轮明知而未修的。既然修不动，界面就不许在这一刻继续说「已存到本地，
// 刷新页面可恢复」。实测（真 Chrome，本地 http 服务）：屏幕上是
// "ZZCLAIMCHECK2 a brand new edit, definitely not on disk yet."，盘上还是上一句
// "ZZCLAIMCHECK typed inside the debounce window."，而历史面板同时写着
// 「已存到本地（IndexedDB），刷新页面可恢复 · 5:52:56 PM」。那句话在那一刻是假的。
// 【为什么不能只改历史面板里那一行】那行字藏在一个要用户主动点开的菜单里。用户根本
// 不会为了「我这一秒钟的输入存住了没有」去点开菜单，所以顶栏的历史按钮上还要有一个
// 始终可见的「未存」角标。两处读的是同一个函数，不可能各说各话。
// 【为什么不能靠重渲染】handleInputChange 故意不 renderApp（会丢焦点，见它下面那行注释），
// 所以这里照抄 syncTranslateButtonState 的做法：只改那两个节点，不重渲染。
function xportPersistUnsaved() {
    // 让位给别的标签页 = 从此一个字都不会再写，屏幕上的内容永远不在盘上 —— 也算未存。
    if (xportPersistYielded) return true;
    // ============= 上一次写**失败**同样是「未存」，而且是最该亮的那一次 =============
    // 【实测的原始故障（本轮）】屏幕上 3 行真译文、盘上同一份，然后让每一次 put 抛
    // QuotaExceededError（隐私模式 / IDB 被拒走的是同一条 reject → xportPersistFail 路径）。
    // 点行内 Update 触发一次写：persistError=「浏览器存储配额已满…」、toast 弹了一次、
    // 盘上 savedAt 一个数没动（1787266699092 → 1787266699092）—— 而顶栏那个**始终可见**的
    // 角标 persistPendingDot.style.display === 'none'、xportPersistUnsaved() === false、
    // xportPersistStatusText() 返回「本地存档已就绪，还没写过；内容变化 1.2 秒后自动写入」，
    // 一句在此刻永远不会兑现的承诺。3.5 秒后 toast 消失，角标仍 none。**第二次失败完全静默**：
    // 新 toast 0 条（persistErrorShown 去重把它吃掉了）、角标仍 none、文案不变。
    // 也就是说：在最需要这个角标的场景 —— 写入**永久**失败 —— 它反而不亮，
    // 这恰好推翻了本轮加角标时自己写的那条理由（见上面「那行字藏在菜单里」）。
    // 去重继续压 toast 的频率（那是刻意的，免得糊一屏），但顶栏从此不许无声。
    if (AppState.persistError) return true;
    return !!xportPersistTimer || xportPersistInFlight === true || xportPersistAgain === true;
}

// 历史面板里那一行落盘状态的**唯一**文案来源（模板首帧和后续 DOM 直更都读它）。
function xportPersistStatusText() {
    // 写失败 / 让位给别的标签页：说失败本身。绝不许再返回「…1.2 秒后自动写入」——
    // persistError 非空时那句话是假的（persistOkAt 已被 xportPersistFail 归零，
    // 连「盘上目前是几点那一版」都没得说）。
    if (AppState.persistError) return AppState.persistError;
    if (xportPersistUnsaved()) {
        return '有改动还没写进本地：这一刻关标签页或刷新，这一次改动会丢（约 1 秒后自动写入）。'
            + (AppState.persistOkAt ? ' 盘上目前是 ' + new Date(AppState.persistOkAt).toLocaleTimeString() + ' 那一版。' : '');
    }
    if (AppState.persistOkAt) {
        return '已存到本地（IndexedDB），刷新页面可恢复 · ' + new Date(AppState.persistOkAt).toLocaleTimeString();
    }
    return '本地存档已就绪，还没写过；内容变化 1.2 秒后自动写入';
}

function xportPersistBadgeSync() {
    try {
        const unsaved = xportPersistUnsaved();
        const dot = document.getElementById('persistPendingDot');
        if (dot) dot.style.display = unsaved ? '' : 'none';
        // ============= 菜单开着的时候出错，这行字也必须当场改口 =============
        // 【实测的原始故障（本轮）】上一版这里是 `if (line && !AppState.persistError)`：
        // 红字那一块只有**重渲染**才画得出来，而第二次及以后的写失败被 persistErrorShown
        // 去重压掉了 toast、也就没有那次 setState 带来的重渲染 —— 于是历史面板里这行字
        // 原地停在「已存到本地（IndexedDB），刷新页面可恢复 · <某个时刻>」，
        // 而此刻每一次写都在失败。改成：出错时就地把这行字换成错误本身并染红。
        const line = document.getElementById('persistStatusLine');
        if (line) {
            const err = AppState.persistError;
            line.textContent = err ? ('⚠️ ' + err) : xportPersistStatusText();
            // 颜色也要跟着走，否则会出现「橙色警告写着已经存好了」这种自相矛盾的一帧。
            line.classList.toggle('text-rose-600', !!err);
            line.classList.toggle('text-amber-600', !err && unsaved);
            line.classList.toggle('font-medium', !!err || unsaved);
            line.classList.toggle('text-slate-400', !err && !unsaved);
        }
    } catch (e) {}
}

// 启动时把盘上那份读回来。异步，落在首帧之后，所以拿到之后要自己 renderApp。
function xportPersistRestore() {
    return xportPersistOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
            let req;
            try { req = db.transaction(XPORT_DB_STORE, 'readonly').objectStore(XPORT_DB_STORE).get(XPORT_DB_KEY); }
            catch (e) { reject(e); return; }
            req.onsuccess = function () { resolve(req.result || null); };
            req.onerror = function () { reject(req.error || new Error('读取失败')); };
        });
    }).then(function (rec) {
        xportPersistBooted = true;
        // 启动这一刻盘上是什么样，就是这个标签页的「我上次看到的」基准。跨标签页的冲突
        // 判据全靠它：之后 savedAt 再往前走，就一定是**别人**写的（见 xportPersistNow）。
        xportPersistSeenAt = (rec && Number(rec.savedAt)) || 0;
        if (!rec) return false;
        // 恢复期间用户可能已经开始打字/粘贴了 —— 那份是新的，绝不拿盘上的旧内容盖掉它。
        if ((AppState.translationPairs && AppState.translationPairs.length > 0) || (AppState.inputText || '').trim()) return false;
        const pairs = normalizeTranslationPairs(Array.isArray(rec.translationPairs) ? rec.translationPairs : []);
        const gh = Array.isArray(rec.globalHistory) ? rec.globalHistory.filter(function (it) {
            return it && Array.isArray(it.pairs) && it.pairs.length > 0;
        }) : [];
        if (pairs.length === 0 && !(rec.inputText || '').trim() && gh.length === 0) return false;
        if (typeof rec.sessionId === 'string' && rec.sessionId) AppState.sessionId = rec.sessionId;
        AppState.lastTranslatedText = typeof rec.lastTranslatedText === 'string' ? rec.lastTranslatedText : '';
        AppState.srcEditedSinceTranslate = rec.srcEditedSinceTranslate === true;
        // ============= 语言方向必须跟着内容一起回来 =============
        // 【实测的原始故障】快照**存了** sourceLang / targetLang / isAutoDetect，恢复时却一个
        // 都不用，于是刷新之后方向永远停在写死的默认值 zh→en。TRANSLATE 按钮自己会重新
        // 检测语言，所以它把这个洞盖住了；但「重新生成所有翻译」「智能更新」「选词/语法弹窗」
        // 全都直接读 AppState.sourceLang / targetLang —— 一份英文文档刷新之后按重新生成，
        // 跑的是 zh→en，结果是把英文原文换成英文改写；点「替换」给出的是中文候选词。
        // 全程 failedCount=0、error=null、没有 toast。存了不用，比不存更坏。
        if (rec.sourceLang === 'zh' || rec.sourceLang === 'en') AppState.sourceLang = rec.sourceLang;
        if (rec.targetLang === 'zh' || rec.targetLang === 'en') AppState.targetLang = rec.targetLang;
        if (typeof rec.isAutoDetect === 'boolean') AppState.isAutoDetect = rec.isAutoDetect;
        setState({
            translationPairs: pairs,
            globalHistory: gh.slice(0, AppState.historyLimit),
            inputText: typeof rec.inputText === 'string' ? rec.inputText : '',
            originalInputText: typeof rec.originalInputText === 'string' ? rec.originalInputText : '',
            viewMode: (rec.viewMode === 'preview' || rec.viewMode === 'original' || rec.viewMode === 'edit')
                ? rec.viewMode : (pairs.length ? 'preview' : 'edit'),
            isEditingMode: !(pairs.length > 0)
        });
        return true;
    }).catch(function (err) {
        xportPersistBooted = true;   // 读不出来也要放行写，否则连「以后能存」都没了
        xportPersistFail('读取', err);
        return false;
    });
}

// ============= 可再武装的自动存档定时器 =============
// 【改动前】定时器在 DOMContentLoaded 里用**启动时**的 AppState.autoSaveInterval 注册一次，
// 全文件没有一处 clearInterval，AppState.autoSaveTimer 声明了从未被赋值。
// setAutoSaveInterval 改 AppState、改 localStorage、renderApp，就是不碰活着的那个定时器。
// 实测：设置面板显示 1 分钟、localStorage 也是 60000，实际节拍稳稳的 300 秒 ± 1 秒，
// 25 分钟 5 次 —— 正是启动时的默认值。改完只有刷新页面才生效。
// 那个用户之所以把间隔调短，恰恰是因为他担心丢东西。
//
// 【这里怎么修】句柄存进本来就声明好的 AppState.autoSaveTimer，setAutoSaveInterval 先
// clearInterval 再重新注册。DOMContentLoaded 里那一处**没有改动**（那段属于另一条分支），
// 所以启动后会有它注册的一个按启动值走的定时器同时存在；它的效果被 addToGlobalHistory
// 的逐字去重完全吸收（内容没变就什么都不做），用户能观察到的只有他设定的那个节拍。
function armAutoSaveTimer() {
    try {
        if (AppState.autoSaveTimer) clearInterval(AppState.autoSaveTimer);
        AppState.autoSaveTimer = null;
        const ms = Number(AppState.autoSaveInterval);
        if (!(ms > 0)) return;
        AppState.autoSaveTimer = setInterval(function () {
            try {
                if (AppState.autoSaveInterval > 0 && AppState.translationPairs.length > 0) {
                    addToGlobalHistory(AppState.translationPairs, AppState.sessionId, { auto: true });
                }
                xportPersistNow();
            } catch (e) { console.error('[autosave]', e); }
        }, ms);
    } catch (e) {}
}

// 自带的启动钩子。刻意**不**写进文件末尾那个 DOMContentLoaded（那段属于另一条分支）：
// 多个监听器互不影响，函数声明有提升，谁先谁后都成立。
document.addEventListener('DOMContentLoaded', function () {
    try {
        xportPersistRestore().then(function () { armAutoSaveTimer(); });
    } catch (e) { xportPersistBooted = true; armAutoSaveTimer(); }
    // ============= 这两个监听器各自到底兑现了什么（别再写「抢存一次」）=============
    // 上一版这里写的是「关标签 / 切到后台时抢存一次：防抖窗口里的最后一次编辑不能就这么
    // 没了」。**pagehide 那一半是假的**，实测（真 Chrome，127.0.0.1:8765）：
    //   · 往 #mainInput 里敲一段字（handleInputChange → xportPersistSoon，防抖 1.2 秒），
    //     200 毫秒后刷新 → 刷新回来 survived:false、盘上 savedAt 一个数没动、persistError=null。
    //   · 把防抖定时器 clearTimeout 掉、只留 pagehide 这条路，结果一样：那条记录压根没被碰过。
    // 【为什么修不动】xportPersistNow 为了跨标签页那条不可协商的规则，必须在**同一个事务里**
    // 先 get 再 put（见它上面那段）。put 是写在 getReq.onsuccess 里的，而文档正在拆的时候
    // IndexedDB 的请求回调不再派发 —— get 的回调不来，put 就从来没被发出去过。
    // 能让它提交的两种办法都比现在这条更糟，所以**一条都没做**：
    //   ① pagehide 上跳过 get 直接 put：那正好是「另一个标签页刚写过的整份文档被我覆盖掉」，
    //      也就是这一轮里最狠的那条故障（见 xportPersistYield 上面「另一个标签页」那段），
    //      拿 ≤1.2 秒的击键去换整篇文档，不换。
    //   ② 再加一层同步的 localStorage 镜像：多一套存储层、多一套恢复期合并语义、还有配额
    //      会在 pagehide 里抛 —— 为了 1.2 秒的窗口新造一套会自己坏的机制，不做。
    // 【所以现在的真话是】visibilitychange→hidden 这一条**是**真的会提交（切标签页时页面还活着，
    // 双标签页实测已验证），它覆盖「切走就不回来了」这类用法；pagehide 那行留着只当尽力而为，
    // 不承诺任何事。**残留敞口**：关标签 / 刷新恰好落在最后一次改动后的 1.2 秒内，那一次改动
    // 会丢（后台标签页里定时器被节流到 ~1 秒粒度，窗口还会更宽一点）。
    // 这一条是**明知而未修**的，不许再有注释宣称它已经被兜住了。
    // 【本轮补上的那一半 —— 敞口修不动，就不许界面继续假装它不存在】
    // 复测（真 Chrome，本地 http 服务，改动后的这份代码）：敲
    // "ZZLOSTBYPAGEHIDE this edit is inside the 1.2s debounce window." 后 200 毫秒刷新
    // → survived:false、盘上 savedAt 停在 1787262734382 一个数没动、persistError=null。
    // **数据仍然会丢，这一条没修**。修掉的是那句假话：从这一版起，只要有一次改动还没写进
    // 本地，顶栏历史按钮上就常驻一个「未存」角标，历史面板里那行字也改说
    // 「有改动还没写进本地：这一刻关标签页或刷新，这一次改动会丢」（见 xportPersistUnsaved /
    // xportPersistStatusText / xportPersistBadgeSync）。一个用户看得见的老失败，
    // 胜过一个他看不见的静默丢失。
    try {
        window.addEventListener('pagehide', function () { try { xportPersistNow(); } catch (e) {} });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') { try { xportPersistNow(); } catch (e) {} }
        });
    } catch (e) {}
});

// ============= 事件处理 =============

// ============= TRANSLATE 按钮的「说的和实际一致」=============
// 【改动前的实测故障】renderHeader 把 `${!AppState.inputText && !AppState.isLoading ? 'disabled' : ''}`
// 烤进 HTML 字符串里，而 handleInputChange 为了不丢焦点**故意不重渲染**（见它下面那行注释）。
// 于是按钮的 disabled 永久停在「输入框还是空的」那一帧算出来的 true：
//     AUTO SYNC 关掉 → 粘 1006 个字符进原文框 → 真鼠标点 TRANSLATE 两次
//     → btnDisabled=true、发出去 0 个请求、pairs=0、error=null、toast=null
// 也就是说，把自动翻译关掉的用户，这个应用的核心功能对他**完全不可达**，
// 直到他碰巧点了别的什么控件触发一次重渲染为止。AUTO SYNC 开着时 1.5 秒的防抖会自己
// 调 handleTranslate() 绕开按钮，所以这个 bug 一直被盖着。
// 【修法】按钮状态直接按当下的真值改到 DOM 上，不重渲染 —— 那条「避免焦点丢失」的理由原封不动。
function syncTranslateButtonState() {
    try {
        const btn = document.getElementById('translateBtn');
        if (!btn) return;
        const shouldDisable = !AppState.inputText && !AppState.isLoading;
        if (btn.disabled === shouldDisable) return;
        btn.disabled = shouldDisable;
        // 灰底/禁用手势也要跟着走，否则会出现「看着能点其实不能」或者反过来 —— 同样是骗人。
        btn.classList.toggle('bg-slate-200', shouldDisable);
        btn.classList.toggle('text-slate-400', shouldDisable);
        btn.classList.toggle('cursor-not-allowed', shouldDisable);
        const live = !shouldDisable && !AppState.isLoading;   // 翻译中是红色 STOP 态，别去动它
        btn.classList.toggle('bg-indigo-600', live);
        btn.classList.toggle('text-white', live);
        btn.classList.toggle('hover:bg-indigo-700', live);
        btn.classList.toggle('shadow-indigo-200', live);
    } catch (e) {}
}

function handleInputChange(value) {
    // 如果正在恢复历史，跳过
    if (AppState.isRestoringHistory) {
        return;
    }

    // 如果从空变为有内容，创建新会话
    if (AppState.inputText === "" && value !== "") {
        if (AppState.translationPairs.length === 0) {
            AppState.sessionId = xportNewSessionId();
        }
    }

    const prevInput = AppState.inputText;   // 这一次击键**之前**大输入框里那份

    AppState.inputText = value;
    AppState.isEditingMode = true;
    AppState.isRestoringHistory = false;
    // 用户正在**大输入框**里重写整篇原文 —— 从这一刻起它就是这份文档的准绳。
    // 标志留着的话，下一次 syncInputFromPairs 会拿 pairs 重建一遍，把刚敲进去的字覆盖掉。
    //
    // ============= 清掉这面旗之前，先看一眼原文栏里有没有还没收回来的改动 =============
    // 【实测的原始故障（本轮 F1/F2）】这一行原来是无条件的。而 pairs 那边可以在**用户已经
    // 待在 Edit 视图里**的时候被改：浮动对话窗的「应用」（chatApplyProposal 情形 B，它挂在
    // <body> 上、不看 viewMode）、右栏 Target Panel 那一行的 ↺/↻（handleHistoryNav，
    // renderTargetPanel 同样不看 viewMode）。两条路都会把 srcEditedSinceTranslate 置成 true、
    // 只改 pairs 不改 inputText，接着用户在大输入框里敲一个词，这一行就把旗抹掉 ——
    // 下一次 TRANSLATE / ⟳ / AUTO SYNC 必然用大输入框那份旧文本赢。逐字实测（node vm 跑真
    // handler）：CHATMARK99 从原文栏原地消失，confirms=[]、toasts=[]、error=null，
    // 逐行撤销栈被整份换掉（history 2 → 1），recoverableAnywhere=false。
    // 对照组（同样步骤但不敲那个词）markSurvives=true —— 证明那面旗本身是对的。
    //
    // 【为什么最终仍然「以大输入框这份为准」】两份都是用户亲手改的，谁也没资格替他决定；
    // 但大输入框是他眼睛正看着、手正在改的那一份，拿 pairs 重建会把刚敲的字顶掉（那是
    // 另一种静默丢失，而且更刺眼）。所以旗照清，但**不许静默**：
    //   ① 主路在旗被**打上**的那一刻就把改动收进大输入框（见 xportFoldPairsIntoLiveInput），
    //      这三条路上根本不会走到这里；
    //   ② 走到这里的只剩「大输入框里已经是另一份文本」那种被收编闸门挡住的情形 ——
    //      那就把要被作废的这份 pairs（含每一行的撤销栈）整份存进归档，用户可以从「历史」
    //      菜单整体取回。skipRender：这里挂在每一次击键上，重画会把 textarea 换掉、焦点掉到
    //      body、之后的击键全部落空。
    // 【诚实说明】②这条路**不出提示**：任何 toast 都会走 setState → renderApp（还有 3 秒后
    // 自动消失时的第二次），在用户正打字的这一刻抢走焦点、吞掉后续击键 —— 那比它要修的
    // 问题更坏。所以这里只保证「找得回来」，不保证「当场看得见」；看得见那一半由 ① 兜住。
    if (AppState.srcEditedSinceTranslate && AppState.translationPairs.length > 0) {
        try {
            if (joinPairsAsDocument('src') !== prevInput) {
                addToGlobalHistory(AppState.translationPairs, AppState.sessionId, { skipRender: true });
            }
        } catch (e) {}
    }
    AppState.srcEditedSinceTranslate = false;

    // 如果输入为空，清空状态并重新渲染（需要隐藏翻译结果）
    if (!value.trim()) {
        // ============= 这一支同时清掉 translationPairs 和 inputText，必须落盘 =============
        // 【实测的原始故障（本轮）】上一版这里 `return` 在下面那个 xportPersistSoon() **之前**，
        // 于是「在大输入框里全选删除」这个最狠的改内容动作一次都不写盘。逐字复现：屏幕上 4 行
        // 真译文、盘上同步（savedAt=1787266734450、pairs=4、inputText 48 字节）→ 切 Edit 视图 →
        // el.value=''; dispatchEvent('input')（等价 Ctrl+A、Delete）→ 等 4 秒（远超 1.2 秒防抖）：
        // 内存 pairs=0/inputLen=0，盘上 savedAt **一个数都没动**、pairs 仍是 4、inputText 仍是 48，
        // 而界面写着「已存到本地（IndexedDB），刷新页面可恢复 · 6:58:56 PM」，
        // xportPersistUnsaved()=false、角标不亮。刷新之后被删掉的整份文档原样回到屏幕上，零提示。
        // 另一半更糟：删空之后再敲一个字，就会落盘一份 {pairs:[], inputText:新内容}，
        // 原来那 4 行译文当场从盘上消失，而它从没进过 globalHistory。
        // 【所以这里和 handleClear 一样先归档】清空输入框 = 整份文档被替换，走同一条规矩。
        // 这一支本来就 renderApp()，多一次归档带来的重画不改变终态（焦点在这条路上早就没了）。
        if (AppState.translationPairs.length > 0) {
            addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
        }
        AppState.translationPairs = [];
        renderApp();
        xportPersistSoon();
        return;
    }

    // 自动翻译防抖
    if (AppState.isAutoTranslate) {
        if (AppState.debounceTimer) {
            clearTimeout(AppState.debounceTimer);
        }
        // 【为什么要在这里等一等 —— 实测的静默失效】改动前防抖到点就直接调 handleTranslate()。
        // 如果上一次翻译还在飞，handleTranslate 的第一条分支是**停止**：它把在途请求 abort 掉、
        // isLoading 归零就 return 了。AbortError 在 catch 里被吞掉，没有 toast、没有 error，
        // 也**没有任何人再排一次**。于是「开着 AUTO SYNC 打字」这个立身工作流的结果是：
        // 已经跑了一半的翻译被悄悄取消，新的一次从来没开始，屏幕停在原地。
        // 【修法】在途就不动它，把这一次重排到 1.5 秒后再看 —— 不打断已经花掉的算力，
        // 也不丢掉这次意图。翻完（isLoading 归零）之后的第一次到点就会真的翻。
        // 判据用 mainAbortController：它就是「整篇翻译在途」的那个句柄，
        // isRegeneratingAll 同理（整篇重新生成期间开翻译同样会互相顶掉）。
        // 【为什么不再看 isEditingMode】这个定时器**只**由 handleInputChange 起武，而它上面
        // 三行刚把 isEditingMode 置成 true —— 起武那一刻这个条件恒真，它在这里唯一能做的事
        // 就是在**等待期间**被别人置成 false 之后把这次意图吞掉：handleTranslate 成功落地时
        // 会 setState({isEditingMode:false, viewMode:'preview'})，于是「翻译在飞的时候又打了
        // 一句」这个最常见的情形正好命中 —— 重排到的那一次醒来一看 isEditingMode 已经是 false，
        // 一声不吭地什么也不做，用户新打的那句永远等不到翻译。删掉它，判据只剩「文本确实
        // 和上次翻译的不一样」。不会成环：handleTranslate 成功后 lastTranslatedText 就等于
        // 送出去的那份，而 fire 只在**真的有东西在飞**时才重排自己。
        const fire = () => {
            AppState.debounceTimer = null;
            if (AppState.mainAbortController || AppState.isLoading || AppState.isRegeneratingAll) {
                AppState.debounceTimer = setTimeout(fire, 1500);
                return;
            }
            if (AppState.inputText !== AppState.lastTranslatedText) {
                // auto:true —— 未提交草稿闸门在这条路上只出 toast，不弹模态框（见 handleTranslate 顶上）
                handleTranslate({ auto: true });
            }
        };
        AppState.debounceTimer = setTimeout(fire, 1500);
    }

    // 粘进来的原文也要活过一次刷新（防抖 1.2 秒，连续打字只写一次）
    xportPersistSoon();

    // 按钮的可点状态跟着实际内容走（只改这一个属性，不重渲染 —— 焦点不受影响）
    syncTranslateButtonState();

    // 不再调用 renderApp()，避免焦点丢失
    // 输入时 textarea 的值已经被浏览器更新，无需重新渲染
}

// ============= 整篇操作进行时，逐句编辑必须是**看得出来的**不可用 =============
// 【实测的原始故障】开着一行的编辑框、点下「重新生成所有翻译」：
//   · 框还在、没有禁用样式、没有转圈，disabled=false / readOnly=false —— 看上去完全能用；
//   · 真键盘敲 9 个字符，editValues 一个字都没收到，document.activeElement 全程是 BODY；
//   · 扫描开始那一下的整页重渲染换掉了 textarea 节点，焦点掉到 body（文件自己在第 64 行和
//     选中高亮那段注释里写过这个失败模式），点回去只会再触发一次重渲染、再掉一次焦点；
//   · 扫完之后 translationPairs 被整份替换，框里原来那句没提交的 CONTROL 也一起没了。
// 一个「看着能编、其实吞掉每一次击键、最后还把已有草稿丢掉」的输入框，是这次要根除的
// 那类问题里最直接的一个。
//
// 【为什么是「锁住」而不是「让它真的能编」】整篇翻译 / 整篇重新生成结束时都会把
// translationPairs **整份换掉**（handleTranslate、handleRegenerateAll 各一处 setState）。
// 就算把焦点救回来、让每一个字都落进 editValues，扫完照样被整份覆盖 —— 那只是把
// 「吞掉击键」换成「让你白打五分钟字」。所以这几分钟里唯一诚实的表现是：说明白不能编，
// 并且不让人进去。扫描一结束锁自动解除（isRegeneratingAll / isLoading 归零）。
function handleRowClick(index, clickedSide = null) {
    if (AppState.isRegeneratingAll || AppState.isLoading) {
        try {
            showToast(AppState.isRegeneratingAll
                ? '正在整篇重新生成，这期间不能逐句编辑：跑完会把整篇译文换成新的一版，现在改的会被覆盖。再点一次那颗按钮可以停下来。'
                : '正在翻译整篇原文，这期间不能逐句编辑：翻完会把整篇译文换成新的一版，现在改的会被覆盖。点 STOP 可以停下来。', 'info');
        } catch (e) {}
        return;
    }
    if (AppState.activeIndex !== null && AppState.activeIndex !== index) {
        saveRowUpdate(AppState.activeIndex);
    }

    // 在 setState 之前保存滚动位置和点击行的位置信息
    const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
    const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');

    let savedScrollInfo = null;
    if (sourceContainer && targetContainer && clickedSide) {
        const clickedContainer = clickedSide === 'src' ? sourceContainer : targetContainer;
        const clickedRow = clickedContainer.querySelector(`[data-idx="${index}"]`);

        if (clickedRow) {
            const containerRect = clickedContainer.getBoundingClientRect();
            const rowRect = clickedRow.getBoundingClientRect();
            savedScrollInfo = {
                clickedSide: clickedSide,
                clickedScrollTop: clickedContainer.scrollTop,
                rowRelativeTop: rowRect.top - containerRect.top, // 行相对于容器顶部的位置
                index: index
            };
        }
    }

    // 使用 preserveScroll: false，因为我们有自己的滚动同步逻辑
    setState({
        activeIndex: index,
        editValues: {
            src: AppState.translationPairs[index].src,
            tgt: AppState.translationPairs[index].tgt
        },
        isEditingMode: false
    }, { preserveScroll: false });

    // 滚动同步：恢复点击侧的滚动位置，并同步另一侧
    if (savedScrollInfo) {
        requestAnimationFrame(() => {
            syncScrollAfterRender(savedScrollInfo);
        });
    }
}

// 渲染后恢复滚动位置并同步
function syncScrollAfterRender(scrollInfo) {
    const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
    const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');

    if (!sourceContainer || !targetContainer) return;

    const { clickedSide, clickedScrollTop, rowRelativeTop, index } = scrollInfo;

    const clickedContainer = clickedSide === 'src' ? sourceContainer : targetContainer;
    const otherContainer = clickedSide === 'src' ? targetContainer : sourceContainer;

    // 1. 恢复点击侧的滚动位置
    clickedContainer.scrollTop = clickedScrollTop;

    // 2. 找到另一侧对应的行，并滚动到相同的相对位置
    const otherRow = otherContainer.querySelector(`[data-idx="${index}"]`);
    if (otherRow) {
        // 计算另一侧需要滚动到的位置，使对应行在相同的相对位置
        const otherRowOffsetTop = otherRow.offsetTop;
        otherContainer.scrollTop = otherRowOffsetTop - rowRelativeTop;
    }
}

// 全局点击处理 - 点击空白区域退出编辑模式
function handleGlobalClick(event) {
    // 如果没有正在编辑的句子，直接返回
    if (AppState.activeIndex === null) return;

    // 对话窗正在被拖拽/缩放时，松手瞬间的 click 一律不算「点了空白区域」。
    // 【为什么不能只靠 pointer capture】chatBeginDrag 建立 capture 的那句包在一个静默吞异常
    // 的 try/catch 里（pid 为空、capture 被提前释放等情况下会悄悄失败、没有后备）。capture
    // 一旦没生效，拖拽结束的 click 就会正常冒泡，如果这次松手点恰好落在 #root 外的空白处，
    // 就会走到下面的 saveRowUpdate —— 实测复现过：正在编辑的行被静默提交、退出编辑态，
    // 且因为「只有一侧变了」触发一次重译，产出的译文里 LaTeX 被搞坏（\ref 嵌套大括号）。
    // data-aichat-drag 在整个拖拽期间（chatBeginDrag 设置、onUp 清除）都在，不依赖 capture
    // 是否生效，是这条路径唯一不会静默失效的判据。
    if (document.body.hasAttribute('data-aichat-drag')) return;

    // —— 浮层通用豁免：按语义写，不再按 id 写 ——
    // 任何挂在 <body> 上、**不属于 #root** 的浮层（渲染错误边界面板、浮动对话窗、
    // 同义词弹窗、推理模式横幅……以及将来还会有的第 N 个），它内部的点击都不该被
    // 当成「点了空白区域」。#root 是 renderApp 唯一写入的容器，所以「在不在 #root 里」
    // 正好就是「是不是应用正文」这个判据本身。
    //
    // 【为什么非要有这一条】下面那条 #aiChatRoot 豁免就是硬编码换来的：对话窗踩过一次坑、
    // 补了一条按 id 写的豁免；错误边界面板挂上来之后原样又踩了一次 —— 实测：第 2 行处于
    // 行内编辑态、textarea 里是未提交文本时，在边界面板的**说明文字**（一个 <div>，
    // 不是 button 也不是 input）上点一次真实冒泡 click，会一路走到下面的
    // saveRowUpdate(AppState.activeIndex)：activeIndex 从 1 变成 null、那段未提交文本被
    // 静默写进 translationPairs[1].tgt，而且因为「只有一侧变了」还会发一次重译另一栏的
    // 网络请求（实测 getSmartUpdate 被调 1 次）。面板里的 <button>/<textarea> 因为下面
    // 那两条 closest 恰好被放行，出事的是标题、说明段落和堆栈 <pre>。
    // 再按 id 补第三条，只是在等下一个浮层。
    //
    // 【边界条件：绝不能扩得过宽】<body> 和 <html> 本身也不在 #root 里，而点它们
    // **就是**点了空白区域，必须照旧提交并退出编辑 —— 这是既有行为，有对照实测把着。
    // 所以判据是「在 #root 之外**且**不是 body/html 本身」，不是光一句「不在 #root 里」。
    const clickTarget = event.target;
    if (clickTarget && typeof clickTarget.closest === 'function'
        && clickTarget !== document.body && clickTarget !== document.documentElement
        && !clickTarget.closest('#root')) return;

    // 浮动对话窗挂在 <body> 上（不在 #root 里），它内部的点击一律不算「点了空白区域」。
    // 这是 C1 唯一一处改到聊天代码之外的生产代码，必须留着：
    // 实测（chat-window.md §2.6）—— 行 3 处于编辑态时，点对话窗的**标题栏**或**消息气泡**
    // 会一路走到下面的 saveRowUpdate(AppState.activeIndex)：用户这一行被静默提交、退出编辑，
    // 而且因为「只有一侧变了」还会顺手发一次把另一栏重写掉的网络请求。
    // 按钮和 textarea 本来就被下面那几个 closest 放行了，标题栏和气泡不是 —— 所以要这一行。
    // 第一道防线是对话窗根节点上的 stopPropagation（见 chatBindShell），这里是第二道：
    // 两道都便宜，而这个失败模式一旦漏掉就是直接吞掉用户的编辑。
    if (event.target && event.target.closest && event.target.closest('#aiChatRoot')) return;
    // 选词弹窗同样挂在 <body> 上，同样的失败模式：点它自己的标题栏/内边距会一路走到下面的
    // saveRowUpdate + activeIndex=null，弹窗还开着却已经废了（实测点建议项 0 变化、无提示），
    // 而且「只有一侧变了」时会顺手发一次把另一栏重写掉的请求。#aiChatRoot 那行修过一次，这里被漏了。
    if (event.target && event.target.closest && event.target.closest('#synonymPopup')) return;

    // 「关注」复选框（句对行上那颗、AI 工具栏里那颗、选词弹窗里那颗）同理，**永远不算点了空白区域**。
    // 这是 chat-focus-selection.md 的 C2：勾一个复选框绝不许把用户正在编辑的那一行静默提交掉。
    // 现实里已经有三道防线（复选框自带 stopPropagation、行上的 [data-idx]、下面那条 clickedInput），
    // 但这条豁免是**唯一一条按语义写的**：前三道任何一道将来因为别的原因被改掉，
    // 失败模式都是「用户的编辑被吞掉」——  这类失败在这个文件里真实发生过（见上面那段关于标题栏的注释）。
    if (event.target && event.target.closest && event.target.closest('[data-focus-cb]')) return;

    // 检查点击的目标是否在句子行内
    const clickedRow = event.target.closest('[data-idx]');
    if (clickedRow) return;

    // 检查是否点击了模态框、菜单、按钮等交互元素
    const clickedModal = event.target.closest('.fixed.inset-0'); // 模态框
    const clickedButton = event.target.closest('button');
    const clickedInput = event.target.closest('input, textarea, select');
    const clickedDropdown = event.target.closest('[onclick*="toggle"], [onclick*="Menu"], [onclick*="Settings"]');

    // 如果点击了这些元素，不退出编辑模式
    if (clickedModal || clickedButton || clickedInput || clickedDropdown) return;

    // 点击了空白区域，保存当前编辑并退出编辑模式
    saveRowUpdate(AppState.activeIndex);
    setState({
        activeIndex: null,
        editValues: { src: '', tgt: '' }
    });
}

// 向后兼容的局部处理函数
function handleBlankAreaClick(event) {
    handleGlobalClick(event);
}

function handleManualSave() {
    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }
}

function handleClear() {
    // 与 restoreGlobalHistory 同一条理由：在途请求落地时必须认不出自己的文档，
    // 否则「清空之后那次翻译回来了」会把已经清掉的内容原地放回来。
    AppState.docGeneration++;
    AppState.srcEditedSinceTranslate = false;
    if (AppState.mainAbortController) {
        AppState.mainAbortController.abort();
    }

    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }

    AppState.isRestoringHistory = true;

    setState({
        inputText: "",
        originalInputText: "",
        translationPairs: [],
        activeIndex: null,
        isEditingMode: true,
        viewMode: 'edit',
        isLoading: false,
        sessionId: xportNewSessionId(),
        error: null
    });

    updateSynonymState({ show: false });

    setTimeout(() => {
        AppState.isRestoringHistory = false;
    }, 100);

    AppState.lastTranslatedText = "";
    xportPersistSoon();
}

// ============= 逐句的行 → 一整篇可以直接贴回 .tex 的文本 =============
// 【为什么不是 join('\n')】复制按钮原来就是 `pairs.map(p => p.tgt).join('\n')`，而
// xportSegments 交出来的每一句都 .trim() 过、也从不产出空行，所以 LaTeX 的分段符（空行）
// 在导出时**全部消失**：实测 main.tex 的 370 个空行拼回来只剩 4 个。贴回 .tex 之后整节
// 正文并成一坨连续散文，LaTeX 一声不吭，只有编出 PDF 才看得见。这是全篇 100% 命中、
// 与模型无关的一类损坏，而复制按钮是这个应用**唯一**的导出口（全文件没有任何
// Blob / download 路径）。
// 分段信息不靠猜：切分本来就是「先按空行分段、再按句号分句」，pair.brk 就是切分当场
// 记下来的「这一句后面原文里是空行」（见 xportSegmentsEx）。缺 brk 的行（旧协议链路、
// 从更早版本恢复出来的归档）退回原来的单个 '\n'，逐字等于改动前的行为。
//
// 【原文侧：优先用 srcRaw】pair.src 是剥离颜色宏之后的文本。有 srcRaw（见 xportAttachRawSrc）
// 就用它 —— 它是这一行**剥离之前**的原文，把 `\textcolor{...}{...}` 一并带回来，
// 而且它自带这一行前面的那段分隔空白，所以用它的时候不能再补 '\n'。
// srcRaw 一旦过期（用户改过这一行的原文）就自动失效，退回 src。
//
// 【失效判据为什么是 history[0]】pair 建立的那一刻，srcRaw 和 history[0].src 取自**同一次
// 切分的同一段**，一个是剥离前、一个是剥离后。所以「这一行的原文还是不是当初那一版」
// 只要比 p.src === p.history[0].src 就够了 —— 精确、零成本，撤销回第 0 版时还会自动重新生效。
// （试过「把 srcRaw 再剥一次看还等不等于 src」：不行。剥离是上下文相关的，单独剥一个切片
// 会把跨行 `\textcolor{...}{` 留下的那个收尾 `}` 多删一个，785 行里有 2 行会被误判成「改过」。）
// ============= 改过的那一行也要把颜色宏带回来（F4）=============
// 【实测的原始故障】上一版对「用户改过原文的行」直接 return null，整行退回剥离后的 p.src。
// main.tex 实测：785 行里 275 行（35%）的 srcRaw 带 \textcolor，最狠的一行 19 处、中位数 1 处，
// 566 处标记合计。用户在原文栏改两个字符（改错别字），那一行的标记当场没了 ——
// 实测 566 → 565，第一处分歧是 `\textcolor{purple}{facing intelligent adversaries…}` 的
// 宏头宏尾被删、只剩里面的字；全程 toast=null / error=null，而这份被削过的文本会同时写进
// inputText / originalInputText 并随 xportPersistSoon 落盘变成永久的。校对原文正是这个应用
// 的立身工作流，所以「改一行 = 删掉那一行的修订标记」是不能接受的。
//
// 【怎么缝】只用两条已经成立的事实，不猜：
//   · stripTextColorForModel 只**删**字符，从不插入、不重排 → 剥离后的文本是 raw 的子序列；
//   · h0.src 是这一行**建立那一刻**的剥离结果，用户的改动是 h0.src → src 的一次编辑。
// 于是：把 raw 单独再剥一次得到 re（实测 main.tex 275 个带宏的行 275/275 都能对上，
// re 里 h0.src 恰好出现一次、两侧只有空白）；在 re 空间里取最长公共前缀/后缀定位出用户
// 真正改动的那一小段；把它映射回 raw 的下标；**只有当 raw 里那一段完全不含 \textcolor、
// 也不含任何花括号**时才允许替换 —— 这一条保证被替换掉的那段里没有任何宏语法，
// 区域之外的宏一个字节都不动，也不可能缝出半个宏或者多余的右括号。
// 最后再剥一次验算：strip(merged) 必须逐字等于「原来的空白 + 用户改后的文本 + 原来的空白」，
// 不等就当没缝成。任何一步不成立都返回 null，调用方退回 p.src（= 上一版行为），
// 并由 xportRowDropsColorMacros / xportWarnColorMacroLoss 把这件事**说出来**。
function xportRawEditMerge(raw, h0src, curSrc) {
    try {
        if (typeof raw !== 'string' || typeof h0src !== 'string' || typeof curSrc !== 'string') return null;
        if (raw === '' || h0src === '') return null;
        const re = stripTextColorForModel(raw);
        if (typeof re !== 'string') return null;
        if (re === raw) return null;                       // 这一行本来就没有宏可缝
        const at = re.indexOf(h0src);
        if (at === -1 || re.indexOf(h0src, at + 1) !== -1) return null;   // 找不到 / 有歧义
        const lead = re.slice(0, at);
        const tail = re.slice(at + h0src.length);
        if (!/^\s*$/.test(lead) || !/^\s*$/.test(tail)) return null;      // 两侧必须只有空白
        const target = lead + curSrc + tail;

        // re 在 raw 里的一个合法嵌入（贪心最左）。未必就是 strip 当初走的那一条，
        // 所以下面既有「区域必须干净」的硬条件，也有最后的验算。
        const map = new Array(re.length + 1);
        let q = 0;
        for (let k = 0; k < re.length; k++) {
            while (q < raw.length && raw[q] !== re[k]) q++;
            if (q >= raw.length) return null;
            map[k] = q++;
        }
        map[re.length] = raw.length;

        // 用户到底改了哪一小段：re 空间的最长公共前缀 / 后缀
        let pre = 0;
        const lim = Math.min(re.length, target.length);
        while (pre < lim && re[pre] === target[pre]) pre++;
        let suf = 0;
        while (suf < (lim - pre) && re[re.length - 1 - suf] === target[target.length - 1 - suf]) suf++;
        const reEnd = re.length - suf;
        if (reEnd < pre) return null;

        const rawStart = map[pre];
        const rawEnd = map[reEnd];
        if (typeof rawStart !== 'number' || typeof rawEnd !== 'number' || rawEnd < rawStart) return null;

        // 被替换掉的那一段 raw 必须是**纯正文**：没有宏、没有花括号、没有反斜杠。
        // 有任何一样就说明用户的改动压到了宏语法上，这时候缝出来的东西不可信 —— 不缝。
        const region = raw.slice(rawStart, rawEnd);
        if (/[{}\\]/.test(region)) return null;

        const merged = raw.slice(0, rawStart) + target.slice(pre, target.length - suf) + raw.slice(rawEnd);

        // 验算：剥一次必须逐字等于目标。不等 = 上面的嵌入选错了，当没缝成。
        if (stripTextColorForModel(merged) !== target) return null;
        return merged;
    } catch (e) { return null; }
}

function xportRowSource(p) {
    const src = (typeof p.src === 'string') ? p.src : '';
    const raw = p.srcRaw;
    if (typeof raw !== 'string' || raw === '') return null;
    const h = Array.isArray(p.history) ? p.history : null;
    const h0 = (h && h.length > 0) ? h[0] : null;
    if (!h0 || typeof h0.src !== 'string') return null;
    if (h0.src === src) return raw;          // 没改过：原样（撤销回第 0 版时自动重新生效）
    return xportRawEditMerge(raw, h0.src, src);   // 改过：把宏缝回来；缝不上返回 null
}

// 这一行重建整篇时会**丢掉** \textcolor 修订标记吗。
// 只在「srcRaw 里有宏、但缝不回来、而且用户自己也没把宏写回正文」时为真。
function xportRowDropsColorMacros(p) {
    try {
        if (!p || typeof p.srcRaw !== 'string' || p.srcRaw === '') return false;
        if (p.srcRaw.indexOf('\\textcolor') === -1) return false;
        if (xportRowSource(p) !== null) return false;              // 缝上了 / 没改过：什么都不丢
        const cur = (typeof p.src === 'string') ? p.src : '';
        return cur.indexOf('\\textcolor') === -1;                  // 用户自己写回来了就不算丢
    } catch (e) { return false; }
}

function xportColorMacroLossRows(pairsArg) {
    const src = (pairsArg === undefined) ? AppState.translationPairs : pairsArg;
    const pairs = Array.isArray(src) ? src : [];
    const rows = [];
    try {
        for (let i = 0; i < pairs.length; i++) if (xportRowDropsColorMacros(pairs[i])) rows.push(i + 1);
    } catch (e) {}
    return rows;
}

// 硬约束第 7 条：一个用户认得出的失败，胜过一个他看不见的静默删除。
// 缝不回来的那几行必须在**文本真正离开这一屏**的那一刻说出来（复制、进大输入框、
// 拿 pairs 去重新生成），而不是等用户贴回 .tex 编出 PDF 才发现标记没了。
function xportWarnColorMacroLoss(where) {
    try {
        const rows = xportColorMacroLossRows();
        if (rows.length === 0) return 0;
        const list = rows.slice(0, 8).join('、') + (rows.length > 8 ? ' 等 ' + rows.length + ' 行' : '');
        showToast('第 ' + list + ' 行的 \\textcolor 修订标记没能带回来：你改过这几行的原文，'
            + '改动压在了颜色宏上，' + where + '里这几行是不带宏的纯文本（其余行原样保留）。'
            + '需要那几处标记就到「历史」里取回改动前的那一版。', 'warning');
        return rows.length;
    } catch (e) { return 0; }
}

function joinPairsAsDocument(field, pairsArg) {
    const src = (pairsArg === undefined) ? AppState.translationPairs : pairsArg;
    const pairs = Array.isArray(src) ? src : [];
    let out = '';
    for (let i = 0; i < pairs.length; i++) {
        const p = pairs[i] || {};
        const raw = (field === 'src') ? xportRowSource(p) : null;
        if (raw !== null) { out += raw; continue; }              // srcRaw 自带前导分隔
        if (i > 0) {
            const prev = pairs[i - 1] || {};
            out += (prev.brk === true ? '\n\n' : '\n');
        }
        out += (typeof p[field] === 'string') ? p[field] : '';
    }
    return out;
}

// ============= 「大输入框」与「逐句原文栏」之间那条分歧的唯一出口 =============
// 【实测的原始故障】用户在**原文栏**逐句改稿（这是本应用的立身工作流：粘贴 → 翻译 →
// 校对改稿 → 粘下一段 → 再翻译），改动只落进 translationPairs[i].src，从来不回写
// AppState.inputText。切到 Edit 视图时大输入框仍然是**没有那些修改的旧文本**（实测：
// 复制原文按钮读 pairs、含修改；Edit 框读 inputText、不含），随后 AUTO SYNC 在 1.5 秒后
// 自己触发 handleTranslate()，handleTranslate 又是整份从 inputText 重建 pairs ——
// 一整篇的原文修改被无声抹掉，没有提示、没有确认、没有撤销（逐行的历史分页也一起重建了）。
//
// 【为什么是「消灭分歧」而不是「加一层同步机制」】原本已经写好了一个做这件事的函数
// （toggleEditMode），但它是**死代码**：三个视图按钮全都调 setViewMode。这里不再新增
// 第二套机制，而是把那段逻辑挪到唯一真正会被调用的入口上，并把死函数删掉 ——
// 分歧从此只有一个出口。
//
// 【为什么加了 srcEdited 这个前提】没改过原文的常见情形下，大输入框逐字保持用户粘进来的
// 原样，一个字节都不动。翻译期间（isLoading / isRegeneratingAll）一律不重建：那时候
// pairs 是上一份文档，而 inputText 正是用户刚粘进去、正在翻的那一份，重建等于把它顶掉。
//
// 【颜色宏怎么活下来的】重建走 joinPairsAsDocument('src')，它对每一行优先用 srcRaw ——
// 也就是这一行**剥离颜色宏之前**的原文（见 xportAttachRawSrc）。没改过的行原样带回；
// 改过的行由 xportRawEditMerge 把宏缝回改后的文本上（main.tex 实测：275 个带宏的行，
// 「句尾追加一句」「句首加词」两种改法 275/275 缝上、566/566 处宏全部保留；
// 「句中改一个字」274/275；「句中删三个字」233/275 —— 缝不上的那些退回剥离后的 p.src，
// 并由 xportWarnColorMacroLoss / 行首的 ⚠ 把哪几行受影响**说出来**，绝不静默）。
// 上一版这里直接拼 pair.src（剥离后的文本），一进 Edit 视图就把全篇 566 处修订标记删光；
// 上上一版对改过的行整行退回 p.src，改两个字符就丢掉那一行的宏（实测 566 → 565）。
//
// 【这三个字段必须一起换 —— 少换一个就是另一条静默丢失】
//   · inputText：大输入框里显示的那份。
//   · originalInputText：「重新生成所有翻译」的输入源。不换它，重新生成就会拿最初粘进来
//     的那一版覆盖掉用户的逐句改稿（这正是上一版把 srcEdited 标志清掉之后留下的洞）。
//   · srcEditedSinceTranslate：改稿已经收回到上面两个字段里了，标志到此为止。
// 基线 lastTranslatedText **不**动：动了的话，切进 Edit 视图之后按 TRANSLATE 会被
// 「原文和上次翻译的一模一样」挡回去 —— 而屏幕上的原文明明已经不一样了。
// （不动它也不会引发自动重译：防抖只在 handleInputChange 里起武，视图切换不经过那里。）
function syncInputFromPairs() {
    if (!Array.isArray(AppState.translationPairs) || AppState.translationPairs.length === 0) return false;
    if (!AppState.srcEditedSinceTranslate) return false;
    if (AppState.isLoading || AppState.isRegeneratingAll) return false;
    const reconstructed = joinPairsAsDocument('src');
    AppState.srcEditedSinceTranslate = false;
    if (reconstructed === AppState.inputText) return false;
    AppState.inputText = reconstructed;
    AppState.originalInputText = reconstructed;
    // 这三个字段刚被整份换掉，屏幕上的内容也跟着变了 —— 那就必须落盘。
    // （调用点有三个：setViewMode('edit')、handleTranslate 的第一行、
    //   以及下面的 xportFoldPairsIntoLiveInput。头一个之外的两个都不落盘：
    //   handleTranslate 只在**翻译成功**之后才落，翻译失败/被「和上次一模一样」挡回去的
    //   那两条路上一次都不会落。放在这里而不是放在调用点上：出口只有一个，将来多一个
    //   调用点也不会漏。）
    xportPersistSoon();
    return true;
}

// ============= 原文栏的逐句改动落下时，大输入框正开着就当场一起更新 =============
// 【它修的是什么】srcEditedSinceTranslate 这面旗的含义是「pairs 才是这份文档的准绳，
// 大输入框那份已经过时」。旗被打上的入口全文件只有三处：saveRowUpdate、handleHistoryNav、
// chatApplyProposal。原来的设计假定「旗打上之后，用户下一次进 Edit 视图时
// setViewMode('edit') 会来对账」—— 但后两个入口在**用户已经待在 Edit 视图里**时同样可达：
// 浮动对话窗挂在 <body> 上、不看 viewMode；右栏 Target Panel 的行也不看 viewMode，
// 实测 `handleHistoryNav(1,-1)` 按钮和 `id="mainInput"` 大输入框同帧共存
//（domHasUndoButton:true, domHasBigTextarea:true）。这时候没有任何一次 setViewMode('edit')，
// 而用户在大输入框里敲的第一个字就会把旗抹掉（见 handleInputChange 里那段实测记录），
// 那几处改动从此没人来收 —— 下一次 TRANSLATE / ⟳ / AUTO SYNC 用旧文本赢，零提示、
// 逐行撤销栈也被整份换掉，recoverableAnywhere=false。
//
// 【为什么在这里做而不是等到击键时做】等到 handleInputChange 就晚了：那时 value 已经是
// 用户**在旧文本上**改出来的结果，两份没法合并，只能二选一丢一份。旗刚打上的这一刻，
// 大输入框里的内容逐字等于 AppState.inputText（每一次 input 事件都同步过），把 pairs 收进去
// 一个字都不会丢 —— 分歧从此不存在，而不是被事后仲裁。
//
// 【三道闸门，缺一条就是新的静默损坏】
//   · viewMode !== 'edit'：大输入框根本没开着，交给 setViewMode('edit') 那条老路（原样不动）。
//   · inputText !== originalInputText：框里已经是**另一份文本**了（最典型：AUTO SYNC 关掉、
//     粘了下一段还没翻）。这时候拿 pairs 重建会把那段新文本原地抹掉 —— 正是
//     handleRegenerateAll 里那段注释记下的实测故障。宁可不收，由 handleInputChange 那条
//     归档兜底。
//   · AppState.error 非空：最常见的一种是「粘了 B、TRANSLATE 失败」—— handleTranslate 在
//     发请求**之前**就把 originalInputText 设成了 B，于是上一条闸门此刻恰好不成立。
//     ⚠️ 诚实交代：这道闸门只挡住「报错横幅还在」的时段，用户手动关掉横幅之后这个洞还在。
//     它**不是本轮引入的**：现行 handleTranslate 第一行的 syncInputFromPairs() 一道闸门都
//     没有，实测同一场景下 B 已经被静默销毁（inputText hasB=false、B recoverable
//     anywhere=false）。这里没有把它修好，也没有把它变得更宽。
//
// 不重画：调用点自己已经 setState 过一次（画的是收编**之前**的 inputText），
// 所以这里把新文本直接写回 #mainInput.value —— 和 syncTranslateButtonState、
// xportPersistBadgeSync 同一条「只改这一个节点、不重渲染」的路子。
function xportFoldPairsIntoLiveInput() {
    try {
        if (AppState.viewMode !== 'edit') return false;
        if (AppState.inputText !== AppState.originalInputText) return false;
        if (AppState.error) return false;
        if (!syncInputFromPairs()) return false;
        const el = document.getElementById('mainInput');
        if (el) el.value = AppState.inputText;
        // 收编真的发生了才提示：这一刻才是「被削过的文本写进 inputText / originalInputText」
        // 的时刻，和 setViewMode('edit') / handleTranslate 那两个调用点逐字同一条规矩。
        xportWarnColorMacroLoss('大输入框');
        return true;
    } catch (e) { return false; }
}

// ============= 重新生成所有翻译 =============
async function handleRegenerateAll() {
    // 如果没有翻译对，直接返回
    if (AppState.translationPairs.length === 0) return;

    // 如果正在重新生成，则取消
    if (AppState.isRegeneratingAll) {
        if (AppState.regenerateAllAbortController) {
            AppState.regenerateAllAbortController.abort();
            AppState.regenerateAllAbortController = null;
        }
        setState({ isRegeneratingAll: false });
        return;
    }

    // ---- 未提交草稿闸门 ----
    // 下面那次扫描结束时会把 translationPairs **整份换掉**，此刻编辑框里没按 Update 的字
    // 一个都不会留下（实测：框里的 CONTROL 在扫到那一行时被丢掉，全程没有任何提示）。
    // 先说一声、给一次反悔的机会；继续则当场退出编辑态 —— 留着一个整篇扫描期间根本编不了
    // 的输入框只会继续骗人（扫描期间 handleRowClick 也不再放人进去，见那里的注释）。
    if (AppState.activeIndex !== null) {
        const cur = AppState.translationPairs[AppState.activeIndex];
