            at: Date.now(),
            reason: String(reason || ''),
            title: chatArchiveTitle(msgs),
            // 只留 wire 需要的字段：content / prose / reasoning 全带上会把配额烧光。
            messages: msgs.map(function (m) {
                return { role: m.role, content: String(m.content == null ? '' : m.content),
                         prose: String(m.prose == null ? '' : m.prose),
                         editBody: m.editBody ? String(m.editBody) : null,
                         compacted: !!m.compacted };
            })
        };
        const prior = chatArchiveLoad();
        // upsert：同 id 的旧条目被这一份替换掉（并挪到最前面 = 最新）。
        // 用户改过的名字要**留住** —— 自动标题会把它盖回第一句提问，那等于重命名功能不存在。
        const rest = [];
        for (let i = 0; i < prior.length; i++) {
            if (!snapshot && prior[i] && prior[i].id === item.id) {
                if (prior[i].renamed) { item.title = String(prior[i].title || item.title); item.renamed = true; }
                continue;
            }
            rest.push(prior[i]);
        }
        const t = chatArchiveTrim(item);
        item.messages = t.messages;
        item.dropped = t.dropped;
        const list = [item].concat(rest);
        const r = chatArchiveWrite(list);
        // 【r.ok 是这两句话的前提，不是可选的】chatArchiveWrite 在失败那条路上照样把
        // 「**试过**要丢掉的那些」填进 r.evicted，但它一次 setItem 都没成功 —— 存储里
        // 一条都没少。不看 r.ok 就报「按最老优先删掉了 11 份对话：「…」、「…」」，
        // 是在点名 11 份根本还在会话面板里、取回/改名/删除都还能用的对话说它们没了。
        // 归档没写成 ⇒ 什么都没变 ⇒ 一句变更都不许播报（失败本身由调用方如实报告）。
        if (r.ok && r.evicted && r.evicted.length) {
            chatAppendRow('system', '会话存储已满，按最老优先删掉了 ' + r.evicted.length + ' 份对话：'
                + r.evicted.map(function (x) { return '「' + String(x && x.title || '?') + '」'; }).join('、')
                + '。（只删了聊天记录，翻译历史一条都没动。）');
        }
        if (r.ok && t.dropped) {
            chatAppendRow('system', '这份对话超过了单份 ' + Math.round(CHAT_ARCHIVE_ITEM_BYTES / 1024)
                + ' KB 的上限，归档时丢掉了最早的 ' + t.dropped + ' 条消息。');
        }
        return r;
    } catch (e) {
        console.error('[chat] archivePush failed', e);
        return { ok: false, evicted: [], why: (e && e.message) || String(e) };
    }
}

function chatArchiveDelete(id) {
    try {
        const list = chatArchiveLoad().filter(function (x) { return x.id !== id; });
        const r = chatArchiveWrite(list);
        if (!r.ok) chatAppendRow('error', '删除失败：' + r.why);
        chatUpdateBar();
    } catch (e) { console.error('[chat] archiveDelete failed', e); }
}

function chatArchiveRename(id, title) {
    try {
        const list = chatArchiveLoad();
        for (let i = 0; i < list.length; i++) {
            if (list[i].id !== id) continue;
            list[i].title = String(title || '').slice(0, 60);
            // 打上标记：以后这段对话再归档时，自动标题不许把用户起的名字盖回去。
            list[i].renamed = true;
        }
        const r = chatArchiveWrite(list);
        if (!r.ok) chatAppendRow('error', '重命名失败：' + r.why);
        chatUpdateBar();
    } catch (e) { console.error('[chat] archiveRename failed', e); }
}

// 归档里属于某一份翻译（sessionId）的、最近的那一段对话。
// 「恢复一份翻译，它的对话跟着回来」全靠这一条查询。snapshot（压缩前备份）也在同一个表里，
// 但它们同样带着 sessionId，取回最新的那一份就是对的。
function chatArchiveLatestFor(sessionId) {
    try {
        const sid = String(sessionId || '');
        if (!sid) return null;
        const list = chatArchiveLoad();
        let best = null;
        for (let i = 0; i < list.length; i++) {
            const it = list[i];
            if (!it || String(it.sessionId || '') !== sid) continue;
            if (!it.messages || !it.messages.length) continue;
            if (!best || Number(it.at || 0) > Number(best.at || 0)) best = it;
        }
        return best;
    } catch (e) { return null; }
}

// 把一份归档装回窗口。silent=true 时不打「已取回」那一条（换文档时另有一句更贴切的说明）。
function chatArchiveLoadInto(item) {
    for (let i = 0; i < item.messages.length; i++) {
        const m = item.messages[i];
        // reasoning 一律空：归档里刻意不存推理正文（那会把配额烧光）。
        // 于是「回传思考」在取回的对话上这一轮不会有东西可回传 —— 下面的提示里说清楚了。
        const rec = { role: m.role, content: String(m.content || ''), prose: String(m.prose || ''),
                      reasoning: '', reasoningTokens: 0,
                      editBody: m.editBody || null, proposalId: null, compacted: !!m.compacted };
        ChatState.messages.push(rec);
        const row = chatAppendRow(m.role === 'assistant' ? 'assistant' : 'user',
                                  m.role === 'assistant' ? (rec.prose || rec.content) : rec.content);
        if (m.role === 'assistant' && row) {
            const b = chatBubbleOf(row);
            if (b) chatRenderProse(b, rec.prose || rec.content);
            chatAppendCopyAnswer(row, rec.prose || rec.content);
        }
    }
    // 认领身份：这段对话现在**就是**归档里那一条，之后再归档是更新它，不是又生一份副本。
    ChatState.convId = String(item.id || '');
    ChatState.sessionId = String(item.sessionId || ChatState.sessionId || '');
}

// 打开一份归档：先把当前这段也归档（绝不覆盖），再把消息装回窗口。
function chatArchiveOpen(id) {
    try {
        const list = chatArchiveLoad();
        let item = null;
        for (let i = 0; i < list.length; i++) if (list[i].id === id) item = list[i];
        if (!item) { chatAppendRow('error', '这份对话已经不在了。'); return; }
        if (ChatState.messages.length) chatArchivePush('切换到另一份会话前');
        chatResetConversation();
        ChatState.panel = '';
        const foreign = String(item.sessionId || '') !== String(AppState.sessionId || '');
        chatArchiveLoadInto(item);
        // 取回一段属于别的文档的对话时，**不能**把 ChatState.sessionId 也改成那一份 ——
        // 否则下一次 chatSyncSession 会认为「文档换了」，转手把用户刚取回来的这段又归档掉。
        // 窗口跟着的永远是当前打开的那份文档；行号对不上这件事，用下面那句警告说清楚。
        if (foreign) ChatState.sessionId = String(AppState.sessionId || '');
        chatAppendRow('system', '已取回归档对话「' + item.title + '」（' + item.messages.length + ' 条）。'
            + '注意：模型提案的「应用」按钮**不会**跟着回来 —— 一份旧提案对着可能已经改过的文档，'
            + '让它长出一颗写文档的按钮是不安全的。归档里也不保存思考正文（那会把存储配额烧光），'
            + '所以「回传思考」对这些旧轮次没有东西可回传。'
            + (foreign ? '⚠ 这段对话属于**另一份文档**，里面的行号和现在这篇对不上。' : ''));
        chatUpdateBar();
        chatScrollToBottom();
    } catch (e) {
        console.error('[chat] archiveOpen failed', e);
        try { chatErrorRow('取回会话', e); } catch (e2) {}
    }
}

function chatHistoryPanelNode() {
    const box = document.createElement('div');
    box.className = 'aichat-panel';
    const h = document.createElement('div');
    h.className = 'aichat-panel-h';
    h.textContent = '会话历史';
    box.appendChild(h);

    const list = chatArchiveLoad();
    const note = document.createElement('div');
    note.className = 'aichat-panel-note';
    note.textContent = '共 ' + list.length + ' / ' + CHAT_ARCHIVE_MAX + ' 份，上限 '
        + Math.round(CHAT_ARCHIVE_BYTES / 1024) + ' KB；超了从最老的删并当场告诉你。'
        + '这份存储和翻译历史各用各的 key，聊天再多也挤不掉你的文档。';
    box.appendChild(note);

    if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'aichat-panel-note';
        empty.textContent = '还没有归档的对话。清理、压缩、或者切换文档时，走掉的那份会自动存到这里。';
        box.appendChild(empty);
        return box;
    }

    for (let i = 0; i < list.length; i++) {
        (function (item) {
            const row = document.createElement('div');
            row.className = 'aichat-arcitem';
            const t = document.createElement('span');
            t.className = 'aichat-arctitle';
            t.textContent = item.title;                 // textContent：标题来自用户输入
            const meta = document.createElement('span');
            meta.className = 'aichat-arcmeta';
            meta.textContent = new Date(item.at).toLocaleString() + ' · ' + item.messages.length + ' 条'
                + (String(item.sessionId || '') === String(AppState.sessionId || '') ? '' : ' · 别的文档');
            const open = document.createElement('button');
            open.type = 'button';
            open.className = 'aichat-minibtn';
            open.textContent = '取回';
            open.addEventListener('click', function () { chatArchiveOpen(item.id); });
            const ren = document.createElement('button');
            ren.type = 'button';
            ren.className = 'aichat-minibtn';
            ren.textContent = '改名';
            ren.addEventListener('click', function () {
                try {
                    const v = window.prompt('这份对话的新名字：', item.title);
                    if (v !== null && String(v).trim()) chatArchiveRename(item.id, String(v).trim());
                } catch (e) {}
            });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'aichat-minibtn is-danger';
            del.textContent = '删除';
            del.addEventListener('click', function () {
                try {
                    if (window.confirm('删除对话「' + item.title + '」？这一步不可撤销。')) chatArchiveDelete(item.id);
                } catch (e) {}
            });
            row.appendChild(t); row.appendChild(meta);
            row.appendChild(open); row.appendChild(ren); row.appendChild(del);
            box.appendChild(row);
        })(list[i]);
    }
    return box;
}

// —— 换文档不许把上一份文档的对话静默带过去 ——
// 一段上下文指向已经不存在的行号的对话，比没有对话更误导人。
// 检测点放在用户每一次和窗口打交道的时刻（打开 / 发送 / 重画环），不轮询、不碰 renderApp。
function chatSyncSession() {
    try {
        const sid = String(AppState.sessionId || '');
        if (!ChatState.sessionId) {
            ChatState.sessionId = sid;
            // 第一次对齐：如果**这一份** sessionId 以前聊过，把那一段接回来。
            // ⚠️ 注意这条路在「刚刷新页面」时基本上接不到东西，而且那是对的：
            //    AppState.sessionId 每次刷新都是新生成的（见它的初始化 Date.now()），不从存储恢复。
            //    所以刷新之后是一份全新的翻译会话，没有旧对话属于它。
            //    对话真正回来的时机是**从 History 恢复那份翻译**的时候 —— 那时 sessionId 变回归档里的那个 id，
            //    restoreGlobalHistory 末尾的这次调用就会把配套的对话接回来。这正是设计要的语义。
            if (!ChatState.messages.length) chatRestoreForSession(sid, '这份文档的');
            return false;
        }
        if (ChatState.sessionId === sid) return false;
        const had = ChatState.messages.length;
        let arch = null;
        if (had) arch = chatArchivePush('文档切换');
        chatResetConversation();
        ChatState.sessionId = sid;
        // 【这一段是「恢复一份翻译，它的对话跟着回来」的落点】
        // 上一份文档的对话已经归档；现在看看**新**这份文档自己有没有一段旧对话。
        const back = chatRestoreForSession(sid, '这份文档的');
        if (had) {
            chatAppendRow('system', '文档已切换。上一份文档的 ' + had + ' 条对话'
                + (arch && arch.ok ? '已存进「会话」' : '**归档失败**（' + ((arch && arch.why) || '存储写入失败') + '）')
                + '，绝不会被带进新文档 —— 旧对话里的行号对不上新文档，继续沿用只会误导。'
                + (back ? '' : '这里从空白开始。'));
        }
        if (!back) chatAdoptDefaults();     // 空白起步 = 新对话 ⇒ 采用设置里的默认
        chatRenderParamBar();
        return true;
    } catch (e) {
        console.error('[chat] syncSession failed', e);
        return false;
    }
}

// 把属于 sid 这份文档的那段旧对话接回来。接不到就什么都不做（返回 false）。
// **只在 messages 已经是空的时候调用** —— 它只负责「装回来」，归档是调用方的责任。
function chatRestoreForSession(sid, label) {
    try {
        if (ChatState.messages.length) return false;
        const item = chatArchiveLatestFor(sid);
        if (!item) return false;
        chatArchiveLoadInto(item);
        chatAppendRow('system', '已接回' + String(label || '') + '上一段对话「' + item.title + '」（'
            + item.messages.length + ' 条）—— 它属于当前这份文档，行号对得上。'
            + '模型提案的「应用」按钮不会跟着回来（旧提案对着可能已经改过的文档，不安全）；'
            + '归档里不保存思考正文，所以这些旧轮次没有思考可回传。'
            + '不想接着聊就点「清理」，这一段会原样留在「会话」里。');
        chatUpdateBar();
        chatScrollToBottom();
        return true;
    } catch (e) {
        console.error('[chat] restoreForSession failed', e);
        return false;
    }
}

// —— 挂载 ——
// 幂等：已经建过就直接返回那个节点，绝不重建（重建 = 用户没发出去的草稿和滚动位置全没）。
// 整个函数不允许把异常抛出去：它在 DOMContentLoaded 里被调，抛出去会顺手废掉后面的初始化。
function ensureChatRoot() {
    try {
        let rootEl = document.getElementById('aiChatRoot');
        if (rootEl) return rootEl;
        if (!document.body) return null;

        rootEl = document.createElement('div');
        rootEl.id = 'aiChatRoot';
        rootEl.innerHTML = chatShellHtml();
        // ★ 关键的一行：body，不是 #root。文件里已有先例 —— renderSynonymPopupOnly 也是插到 body。
        document.body.appendChild(rootEl);
        chatBindShell(rootEl);
        ChatState.mounted = true;

        // 恢复几何：存过就按严格档拉回视口内，没存过就按当前视口自动排一份。
        const stored = chatLoadGeom();
        ChatState.geom = stored ? chatClampGeomForRestore(stored) : chatClampGeom(chatAutoGeom());
        chatApplyGeom();
        chatSyncMinUI();          // 把最小化按钮的图标/提示和未读徽标刷成初始状态
        chatRenderParamBar();

        chatAppendRow('system', '对话窗已就绪。拖标题栏移动；四条边和四个角都能拖着改大小（和 Windows 的窗口一样，'
            + '拖左边或上边时对面那条边钉住不动），手动调过的尺寸之后一直作数。'
            + '标题栏右上角从左到右是「+ 新建对话」「− 最小化到后台」「× 关闭」。'
            + '左栏（原文）的内容每一轮都会自动带给我；想让我额外留意某一行或某一段，'
            + '勾左栏行上、或选词弹窗里的「关注」复选框即可。直接说「第 N 行……」告诉我要改哪里，'
            + '我会给出前后对照，改动只有你点「应用」才会写进文档 —— 这个工具现在只能改左栏的原文，不会碰右栏的译文。');
        return rootEl;
    } catch (e) {
        console.error('[chat] ensureChatRoot failed', e);
        return null;
    }
}

// 顶栏那颗开关按钮的「开着」状态：直接改 DOM，不走 setState。
// renderHeader 里也读 chatIsOpen()，所以下一次任何原因触发的重渲染会自然带上正确状态。
function chatSyncToggleButton() {
    try {
        const btn = document.getElementById('chatToggleBtn');
        if (!btn) return;
        btn.setAttribute('aria-pressed', ChatState.open ? 'true' : 'false');
        if (ChatState.open) btn.classList.add('is-chat-open');
        else btn.classList.remove('is-chat-open');
    } catch (e) {}
}

// ============================================================================
// 最小化到后台
// ============================================================================
//
// 【合约】最小化 ≠ 关闭。关闭把窗口收走；最小化只是把它折叠成一条标题栏停在原地，
// **一个字节都不许丢**：未发送的草稿及其光标选区、消息区滚动位置、全部消息、关注标记、
// 用量圆环的读数、以及用户手动调过的窗口尺寸，展开后逐项还原。
//
// 【为什么要显式存草稿/选区/滚动位置，明明 display:none 不会清掉它们】
// 浏览器确实不会清 —— 但**我们自己的代码**会：chatAppendRow → chatScrollToBottom 在折叠期间
// 照常跑，而对一个 display:none 的容器写 scrollTop 的结果是 0（clientHeight/scrollHeight 都是 0）。
// 同理 chatAutoGrowInput 在隐藏期间量出来的 scrollHeight 是 0，会把输入框高度写成 0px。
// 所以这三样在折叠瞬间抄下来，展开时按抄下来的值写回去，不去赌中间没人碰过它们。
const CHAT_UNREAD_CAP = 99;      // 徽标上最多显示到这个数，再多就写 99+

// 标题栏上会随折叠状态变化的那几处：最小化按钮的图标与提示、未读徽标。
// 只改 DOM 属性，不走任何渲染路径；被 renderApp 抹掉是不可能的（窗口不在 #root 里）。
function chatSyncMinUI() {
    try {
        const rootEl = document.getElementById('aiChatRoot');
        if (!rootEl) return;
        if (ChatState.minimized) rootEl.classList.add('is-min');
        else rootEl.classList.remove('is-min');

        const btn = document.getElementById('aiChatMinBtn');
        if (btn) {
            btn.innerHTML = ChatState.minimized ? Icons.RestoreSmall : Icons.MinusSmall;
            btn.setAttribute('data-tip', ChatState.minimized
                ? '还原窗口：展开回折叠前的尺寸，草稿（连同光标选区）、滚动位置、消息、关注标记、圆环读数逐项回来。点标题栏空白处也一样。'
                : '最小化到后台：折叠成一条标题栏停在原地，仍然可以拖。和「关闭」不一样 —— 草稿（连同光标选区）、滚动位置、全部消息、关注标记、用量圆环、窗口尺寸全都留着，展开后逐项还原。折叠期间模型回完了，这里会亮出未读数。点这颗按钮或点标题栏都能展开。');
        }

        const badge = document.getElementById('aiChatUnread');
        if (badge) {
            const n = Math.max(0, Number(ChatState.unread) || 0);
            badge.setAttribute('data-n', String(n));
            badge.textContent = n > CHAT_UNREAD_CAP ? (CHAT_UNREAD_CAP + '+') : String(n);
            badge.setAttribute('title', n ? ('折叠期间新到 ' + n + ' 条回复') : '');
        }
    } catch (e) {
        console.error('[chat] syncMinUI failed', e);
    }
}

// 折叠期间来了新回复（或错误行）就记一笔。由 chatAppendRow 调用，只认 assistant / error 两种。
function chatNoteUnread(kind) {
    try {
        if (!ChatState.minimized) return;
        if (kind !== 'assistant' && kind !== 'error') return;
        ChatState.unread = (Number(ChatState.unread) || 0) + 1;
        chatSyncMinUI();
    } catch (e) {}
}

function chatMinimize() {
    try {
        if (ChatState.minimized) return;
        const ta = document.getElementById('aiChatInput');
        const log = document.getElementById('aiChatLog');
        ChatState.minSaved = {
            draft: ta ? String(ta.value == null ? '' : ta.value) : '',
            // selectionStart/End 在 display:none 之后仍然读得到，但这里抄的是**折叠那一刻**的值，
            // 免得折叠期间任何一次 value 写入（会把选区重置到末尾）把它冲掉。
            selStart: ta ? chatNum(ta.selectionStart, 0) : 0,
            selEnd: ta ? chatNum(ta.selectionEnd, 0) : 0,
            hadFocus: !!(ta && document.activeElement === ta),
            logScroll: log ? chatNum(log.scrollTop, 0) : 0,
            // 折叠前本来就贴着底 ⇒ 展开时继续贴底（否则新到的回复藏在下面看不见）。
            // 折叠前停在中间 ⇒ 精确还原那个位置，一像素都不动。
            atBottom: log ? (chatNum(log.scrollHeight, 0) - chatNum(log.scrollTop, 0)
                             - chatNum(log.clientHeight, 0) < 4) : true
        };
        ChatState.minimized = true;
        ChatState.unread = 0;
        // geom 一个字段都不改 —— 折叠只是渲染态，展开后内联的 width/height 原样生效。
        chatSyncMinUI();
        chatSyncToggleButton();
    } catch (e) {
        console.error('[chat] minimize failed', e);
    }
}

function chatExpand() {
    try {
        if (!ChatState.minimized) return;
        ChatState.minimized = false;
        ChatState.unread = 0;
        chatSyncMinUI();                 // 先摘 class：下面要量高度，必须先让内容重新参与布局
        chatApplyGeom();                 // 内联几何原样重写一遍（含用户手动调过的尺寸）
        const s = ChatState.minSaved;
        ChatState.minSaved = null;
        const ta = document.getElementById('aiChatInput');
        const log = document.getElementById('aiChatLog');
        if (ta && s) {
            // 只有真的不一样才写 value —— 写 value 会把选区重置到末尾，
            // 而绝大多数情况下浏览器压根没动过它，白写一次反而把选区弄丢。
            if (String(ta.value == null ? '' : ta.value) !== s.draft) ta.value = s.draft;
        }
        // 隐藏期间量出来的 scrollHeight 是 0，输入框高度可能已经被写成 0px；这里按可见状态重量一次。
        chatAutoGrowInput();
        if (ta && s) {
            try { if (ta.setSelectionRange) ta.setSelectionRange(s.selStart, s.selEnd); } catch (e2) {}
            if (s.hadFocus && ta.focus) { try { ta.focus(); } catch (e3) {} }
        }
        if (log && s) {
            if (s.atBottom) chatScrollToBottom();
            else log.scrollTop = s.logScroll;
        }
        chatSyncToggleButton();
    } catch (e) {
        console.error('[chat] expand failed', e);
    }
}

function chatToggleMinimize() {
    try {
        if (ChatState.minimized) chatExpand();
        else chatMinimize();
    } catch (e) {
        console.error('[chat] toggleMinimize failed', e);
    }
}

function chatOpen() {
    try {
        const rootEl = ensureChatRoot();
        if (!rootEl) return;
        // 已经开着但折叠着 ⇒ 这次「打开」的意思是**还原**，不是再开一个。
        // 顶栏那颗 Chat 按钮走的就是这条路（chatToggle）。
        if (ChatState.open && ChatState.minimized) { chatExpand(); return; }
        // 关掉之后再打开：不许还带着上一次的折叠态开出来一条空壳窄条。
        if (ChatState.minimized) { ChatState.minimized = false; ChatState.minSaved = null; ChatState.unread = 0; chatSyncMinUI(); }
        if (!ChatState.open) {
            // 记住是谁把窗口打开的，关的时候把焦点还回去。不还 = 键盘用户被丢在 <body> 上。
            const active = document.activeElement;
            ChatState.lastFocus = (active && active !== document.body) ? active : null;
        }
        ChatState.open = true;
        // 用户还没碰过尺寸/位置（mode 'auto'）时，每次打开都按当前视口重新自动排一次；
        // 碰过了就尊重存下来的几何，只把它拉回视口内。
        ChatState.geom = (ChatState.geom.mode === 'free')
            ? chatClampGeomForRestore(ChatState.geom)
            : chatClampGeom(chatAutoGeom());
        chatApplyGeom();
        rootEl.classList.add('is-open');
        chatSaveOpen(true);
        chatSyncToggleButton();
        // 打开的这一刻先对一次会话：上次关窗之后用户可能已经换了文档，
        // 那段对话里的行号对不上新文档，继续摆在这里只会误导。
        chatSyncSession();
        chatRenderTargetChip();
        chatRenderBatchBar();
        chatRenderParamBar();
        // 参数条要显示这个模型支持哪些推理档位，而那份数据是异步发现来的。
        // 打开窗口时补一次（60 秒缓存内不会真的再发请求），回来后只重画参数条。
        if (chatModelChoice().provider === 'local') chatCapsWarmForBar();
        chatUpdateBar();
        chatAutoGrowInput();
        chatScrollToBottom();
        const ta = document.getElementById('aiChatInput');
        if (ta && ta.focus) { try { ta.focus(); } catch (e) {} }
    } catch (e) {
        console.error('[chat] open failed', e);
    }
}

function chatClose() {
    try {
        // 关闭必须是拖拽状态的确定性终点。不这样做的话：Esc 在拖拽途中把窗口关掉，
        // chatBeginDrag 挂在 document/window 上的监听器和 data-aichat-drag 都不会被清 ——
        // 拖拽会在窗口已经视觉消失之后继续在后台跑，真正松手时算出的尺寸会被当成
        // 「用户特意调的」写进 localStorage，下次打开就静默出现在这个从没主动选过的
        // 尺寸/位置上（实测复现：Esc 中途打断后最终落盘 {"x":350,"y":250,"w":563,"h":500}）。
        if (typeof chatActiveDragEnd === 'function') { try { chatActiveDragEnd(); } catch (e) {} }
        ChatState.open = false;
        const rootEl = document.getElementById('aiChatRoot');
        if (rootEl) rootEl.classList.remove('is-open');
        chatSaveOpen(false);
        chatSyncToggleButton();
        // 焦点交还：优先还给当初打开它的那个元素（renderApp 之后那个节点可能已经不在文档里，
        // 所以要 contains 一下），否则给顶栏开关按钮。绝不留在一个已经 display:none 的节点上。
        const prev = ChatState.lastFocus;
        ChatState.lastFocus = null;
        let back = (prev && document.contains && document.contains(prev)) ? prev : null;
        if (!back) back = document.getElementById('chatToggleBtn');
        if (back && back.focus) { try { back.focus(); } catch (e) {} }
    } catch (e) {
        console.error('[chat] close failed', e);
    }
}

function chatToggle() {
    try {
        // 【折叠态下这颗按钮的语义是「还原」，不是「关闭」】折叠成一条窄条之后，用户去点
        // 顶栏那颗 Chat 按钮，想要的一定是把窗口拿回来 —— 让它去执行关闭，等于把用户
        // 唯一一个「我要看它」的动作解释成「我不要看它」。也绝不去开第二个窗口：
        // ensureChatRoot 是幂等的，这个应用里从头到尾只有一个对话窗。
        if (ChatState.open && ChatState.minimized) { chatExpand(); return; }
        if (ChatState.open) chatClose();
        else chatOpen();
    } catch (e) {
        console.error('[chat] toggle failed', e);
    }
}

// 启动：把节点建出来（隐藏态），并按上次关页面时的状态决定要不要直接打开。
function chatBoot() {
    try {
        // 参数（对话模型 / 推理档位 / 温度 …）必须在建节点**之前**恢复，
        // 否则参数条会先画一遍默认值再跳成用户设定值 —— 而且那一瞬间显示的档位是错的。
        chatParamsLoad();
        chatDefaultsLoad();
        // 【刷新 = 一段新对话】ChatState.messages 不跨刷新保存，所以页面一起来本来就是新对话，
        // 采用「设置 → 模型 → 默认模型」里对话那一行正是它的定义。用户从没设过默认时这是空操作，
        // 参数条上原来钉住的模型照旧生效 —— 老用户的行为逐字不变。
        // 紧接着 chatSyncSession 若接回了这份文档的旧对话，那是**同一段**对话的延续，
        // 模型/档位跟着设置走仍然是对的：对话内容和请求参数本来就是两件事。
        chatAdoptDefaults();
        if (!ensureChatRoot()) return;
        // 关注集属于文档，要活过刷新。**恢复之后不立刻复核** —— 此刻 translationPairs
        // 多半还是空的（页面刚起、历史还没恢复），那时候「解不出来」说明的是文档没加载，
        // 不是用户的标记失效了。focusRevalidate 自己带这条守卫。
        focusLoad();
        focusRenderChip();
        if (chatLoadOpen()) chatOpen();
        else chatSyncToggleButton();
    } catch (e) {
        console.error('[chat] boot failed', e);
    }
}

// ============= 初始化 =============
document.addEventListener('DOMContentLoaded', function() {
    // 加载保存的设置
    loadSavedSettings();

    // 初始渲染不需要保留滚动位置
    renderApp(false);

    // 全局点击事件 - 点击空白区域退出编辑模式
    document.addEventListener('click', handleGlobalClick);

    // 窗口尺寸变化会让文本重新折行，行高全变 —— 必须重测，不能只在启动时对一次
    window.addEventListener('resize', scheduleAlignSync);

    // 自动保存定时器
    setInterval(function() {
        if (AppState.autoSaveInterval > 0 && AppState.translationPairs.length > 0) {
            // { auto: true }：定时存档不许用带缺口的版本覆盖归档里完好的那份
            addToGlobalHistory(AppState.translationPairs, AppState.sessionId, { auto: true });
        }
    }, AppState.autoSaveInterval);

    // 浮动 AI 对话窗：把窗口挂到 <body> 上（默认隐藏），并按上次关页面时的开关状态决定是否打开。
    // 刻意放在整段初始化的**最后**，而且自带 try/catch —— 走到这里时初始渲染、全局点击、
    // 窗口 resize、自动存档定时器都已经装好了，这一段无论怎么炸都带不走它们。
    // renderApp 本身一行都没动，这是这个功能的全部要点。
    try { chatBoot(); } catch (e) { console.error('[chat] boot threw', e); }

    // v2 Overleaf 风格外壳：同样刻意放在最后、自带 try/catch。ovlBoot 内部把
    // body.ovl-shell-active 的挂载放在成功路径的最后一步，这里的 catch 兜的是
    // ovlBoot 之前那几步（理论上不会走到，但和 chatBoot 保持同一纪律）。
    try { ovlBoot(); } catch (e) { console.error('[ovl] boot threw', e); }

    // 自动翻译防抖（在handleInputChange中处理）
});

// 加载所有保存的设置
function loadSavedSettings() {
    try {
        // 加载 Gemini API Key
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) {
            AppState.geminiApiKey = savedKey;
        }

        // 加载 OpenAI API Key
        const savedOpenaiKey = localStorage.getItem('openaiApiKey');
        if (savedOpenaiKey) {
            AppState.openaiApiKey = savedOpenaiKey;
        }

        // 加载 Claude API Key
        const savedClaudeKey = localStorage.getItem('claudeApiKey');
        if (savedClaudeKey) {
            AppState.claudeApiKey = savedClaudeKey;
        }

        // 加载 Claude Proxy URL
        const savedClaudeProxyUrl = localStorage.getItem('claudeProxyUrl');
        if (savedClaudeProxyUrl) {
            AppState.claudeProxyUrl = savedClaudeProxyUrl;
        }

        // 加载 Local Base URL
        const savedLocalUrl = localStorage.getItem('localBaseUrl');
        if (savedLocalUrl) {
            AppState.localBaseUrl = savedLocalUrl;
        }
        
        // 加载 History Limit
        const savedHistoryLimit = localStorage.getItem('historyLimit');
        if (savedHistoryLimit) {
            AppState.historyLimit = parseInt(savedHistoryLimit) || 5;
        }
        
        // 加载 Auto-Save Interval
        const savedAutoSaveInterval = localStorage.getItem('autoSaveInterval');
        if (savedAutoSaveInterval) {
            AppState.autoSaveInterval = parseInt(savedAutoSaveInterval) || 5 * 60 * 1000;
        }
        
        // 加载 Custom Prompts
        const savedCustomPrompts = localStorage.getItem('customPrompts');
        if (savedCustomPrompts) {
            try {
                const parsed = JSON.parse(savedCustomPrompts);
                AppState.customPrompts = { ...AppState.customPrompts, ...parsed };
            } catch (e) {}
        }
        
        // 加载上次使用的 API Provider 和模型
        const savedApiProvider = localStorage.getItem('apiProvider');
        const savedSelectedModel = localStorage.getItem('selectedModel');
        if (savedApiProvider) {
            AppState.apiProvider = savedApiProvider;
        }
        if (savedSelectedModel) {
            // localStorage 里的 selectedModel 是过滤器的一条绕过旁路：修复前点过 nano-banana 图像模型
            // （gemini-2.5-flash-image-preview 等）的用户，刷新后该 id 会被原样恢复，再被 getModelCatalog
            // 的「钉住」分支塞回 Gemini 下拉，callGeminiAPI 继续拿它去翻译。这里补上同一套判定。
            // 只校验 gemini（openai/claude/local 走各自逻辑，不在本次范围内）。
            const okId = sanitizeModelId(savedSelectedModel)
                && (AppState.apiProvider !== 'gemini' || isGeminiTextChatModelId(savedSelectedModel));
            AppState.selectedModel = okId ? savedSelectedModel : DEFAULT_MODEL_CATALOG[0].id;
        }

        // 加载 Model Visibility 设置
        const savedModelVisibility = localStorage.getItem('modelVisibility');
        if (savedModelVisibility) {
            try {
                const parsed = JSON.parse(savedModelVisibility);
                AppState.modelVisibility = { ...AppState.modelVisibility, ...parsed };
            } catch (e) {}
        }

        // B2：加载每模型的推理档位。**必须在首次 renderApp 之前**恢复，否则设置面板会先
        // 画一遍「关」再跳成用户设定值；更糟的是首次翻译可能用错档位发出去。
        // 逐键校验：只认 XPORT_EFFORT_WIRE 里存在的 UI 值，脏值直接丢弃（不是回落，是不收）。
        const savedReasoning = localStorage.getItem(XPORT_REASONING_LS_KEY);
        if (savedReasoning) {
            try {
                const parsed = JSON.parse(savedReasoning);
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                    const clean = {};
                    Object.keys(parsed).forEach(function (k) {
                        const id = sanitizeModelId(k);
                        const v = parsed[k];
                        if (id && typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v)) {
                            clean[id] = v;
                        }
                    });
                    AppState.reasoningByModel = clean;
                }
            } catch (e) {}
        }

        // 加载「显示 OpenAI 日期快照」开关
        const savedShowSnapshots = localStorage.getItem('showDatedSnapshots');
        if (savedShowSnapshots === '1') {
            AppState.showDatedSnapshots = true;
        }

        // 加载选词弹窗默认功能（'replace' | 'simplify' | 'grammar'，脏值一律回退默认 'replace'）
        const savedSynonymDefaultMode = localStorage.getItem('synonymDefaultMode');
        if (SYNONYM_MODES.indexOf(savedSynonymDefaultMode) !== -1) {
            AppState.synonymDefaultMode = savedSynonymDefaultMode;
        }

        // 加载 Settings 弹窗宽度（拖拽调整后持久化）；clamp 一下防止脏值把弹窗渲染成极端宽/窄
        const savedSettingsModalWidth = localStorage.getItem('settingsModalWidth');
        if (savedSettingsModalWidth) {
            AppState.settingsModalWidth = clampSettingsModalWidth(parseInt(savedSettingsModalWidth, 10));
        }

        // 加载 Settings 弹窗上次停在哪一页（脏值/老版本残留一律回落第一页）
        const savedSettingsTab = localStorage.getItem('settingsTab');
        if (savedSettingsTab) {
            AppState.settingsTab = normalizeSettingsTab(savedSettingsTab);
        }

        // 加载句对行距。⚠️ 必须**在首次 renderApp 之前**把 CSS 变量写进 :root，
        // 否则首屏会先用默认 8px 排一次版、行高对齐也按 8px 算完，再跳成用户设定值 —— 肉眼可见地闪一下。
        const savedRowGap = localStorage.getItem('rowGap');
        if (savedRowGap !== null) {
            AppState.rowGap = clampRowGap(savedRowGap);
        }
        applyRowGapToDom(AppState.rowGap);

        // 加载跨栏对应高亮开关。默认开（缺键 = 从没动过 = 开），只有显式存过 '0' 才算关。
        const savedCrossHl = localStorage.getItem('crossHighlightEnabled');
        if (savedCrossHl !== null) {
            AppState.crossHighlightEnabled = savedCrossHl !== '0';
        }

        // 加载哨兵传输协议开关。默认开；只有显式存过 'false' 才回到旧的 JSON 协议。
        const savedXport = localStorage.getItem('sentinelTransport');
        if (savedXport !== null) {
            AppState.sentinelTransport = savedXport !== 'false';
        }

        // 加载上次从各家 API 拉到的在线模型目录（纯读缓存，不发任何网络请求）
        // 刻意不做启动自动刷新：/v1/models 有限流，且首屏不该依赖网络
        loadOnlineCatalog();

        // 只要有保存的本地地址，就自动尝试连接（获取模型列表）
        if (savedLocalUrl) {
            autoConnectLocal();
        }
    } catch (e) {
        console.warn('Failed to load saved settings:', e);
    }
}

// 自动连接本地 LM Studio（获取模型列表，失败时显示错误提示）
async function autoConnectLocal() {
    try {
        const models = await fetchLocalModels(AppState.localBaseUrl);
        AppState.localModels = models;
        
        // 如果上次使用的是本地模型，检查是否仍然可用
        if (AppState.apiProvider === 'local') {
            const savedModel = localStorage.getItem('selectedModel');
            if (savedModel && models.some(m => m.id === savedModel)) {
                AppState.selectedModel = savedModel;
            } else if (models.length > 0) {
                AppState.selectedModel = models[0].id;
            }
        }
        
        console.log('Auto-connected to local LM Studio:', AppState.localBaseUrl, 'Models:', models.length);
        renderApp();
        // B1：连上了就顺手预热能力表（60 秒缓存，不会和 openSettings 的那次重复发请求）
        xportCapsWarm();
    } catch (e) {
        // 显示错误提示
        console.warn('Auto-connect to local LM Studio failed:', e.message);
        AppState.localModels = [];
        
        // 如果上次使用的是本地模型但现在连接失败，回退到目录里的第一个在线模型
        if (AppState.apiProvider === 'local') {
            AppState.apiProvider = DEFAULT_MODEL_CATALOG[0].provider;
            AppState.selectedModel = DEFAULT_MODEL_CATALOG[0].id;
        }
        
        // 显示顶部错误提示
        setState({ error: `无法连接到本地服务器 ${AppState.localBaseUrl}。请确保 LM Studio 正在运行。` });
    }
}

    return ''
        + '<button type="button" id="ovlTranslatorCloseBtn" class="ovl-translator-close-btn" title="关闭翻译器，返回 Overleaf 外壳视图">&times; 返回外壳</button>'
        + '<div class="ovl-layout-menu" id="ovlLayoutMenu" hidden>'
        +   '<div class="ovl-layout-menu-title">Layout options</div>'
        +   '<div class="ovl-layout-menu-item" data-view="split">Split view</div>'
        +   '<div class="ovl-layout-menu-item" data-view="editor">Editor only</div>'
        +   '<div class="ovl-layout-menu-item" data-view="pdf">PDF only</div>'
        + '</div>'
        + '<input type="file" id="ovlWebkitDirInput" webkitdirectory multiple hidden>';
}

function ovlEnsureShell() {
    try {
        let shell = document.getElementById('ovlShell');
        if (shell) return shell;
        if (!document.body) return null;

        shell = document.createElement('div');
        shell.id = 'ovlShell';
        shell.innerHTML = ovlShellHtml();
        document.body.appendChild(shell);

        let portal = document.getElementById('ovlPortal');
        if (!portal) {
            portal = document.createElement('div');
            portal.id = 'ovlPortal';
            document.body.appendChild(portal);
        }
        portal.innerHTML = ovlPortalHtml();

        return shell;
    } catch (e) {
        console.error('[ovl] ensureShell failed', e);
        return null;
    }
}

function ovlCloseLayoutMenu() {
    const menu = document.getElementById('ovlLayoutMenu');
    if (menu) menu.setAttribute('hidden', '');
}

function ovlToggleLayoutMenu() {
    const menu = document.getElementById('ovlLayoutMenu');
    const btn = document.getElementById('ovlLayoutBtn');
    if (!menu || !btn) return;
    const willOpen = menu.hasAttribute('hidden');
    if (!willOpen) { ovlCloseLayoutMenu(); return; }
    const r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.right = (window.innerWidth - r.right) + 'px';
    menu.removeAttribute('hidden');
}

function ovlSetViewMode(mode, opts) {
    try {
        if (mode !== 'split' && mode !== 'editor' && mode !== 'pdf') return;
        OvlState.viewMode = mode;
        const body = document.getElementById('ovlBody');
        if (body) body.setAttribute('data-view', mode);
        const menu = document.getElementById('ovlLayoutMenu');
        if (menu) {
            const items = menu.querySelectorAll('.ovl-layout-menu-item');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.toggle('ovl-active', items[i].getAttribute('data-view') === mode);
            }
        }
        if (!opts || !opts.skipSave) {
            try { localStorage.setItem('ovl.viewMode', mode); } catch (e) {}
        }
        ovlCloseLayoutMenu();
    } catch (e) {
        console.error('[ovl] setViewMode failed', e);
    }
}

function ovlToggleTree() {
    try {
        OvlState.treeOpen = !OvlState.treeOpen;
        const body = document.getElementById('ovlBody');
        if (body) body.setAttribute('data-tree', OvlState.treeOpen ? 'open' : 'collapsed');
        try { localStorage.setItem('ovl.treeOpen', OvlState.treeOpen ? '1' : '0'); } catch (e) {}
    } catch (e) {
        console.error('[ovl] toggleTree failed', e);
    }
}

// 打开 v1 翻译器浮层：只加 class，不动 DOM 树（§3.3）。
function ovlOpenTranslator() {
    try {
        document.body.classList.add('ovl-translator-open');
        // 显示后必须补一次 renderApp：display:none 期间量出来的双栏对齐高度全是 0。
        try { renderApp(false); } catch (e2) { console.error('[ovl] renderApp after open failed', e2); }
    } catch (e) {
        console.error('[ovl] openTranslator failed', e);
    }
}

function ovlCloseTranslator() {
    try {
        document.body.classList.remove('ovl-translator-open');
    } catch (e) {
        console.error('[ovl] closeTranslator failed', e);
    }
}

function ovlSetEditorMode(mode) {
    try {
        if (mode !== 'code' && mode !== 'visual') return;
        OvlState.editorMode = mode;
        const ta = document.getElementById('ovlCodeArea');
        const gutter = document.getElementById('ovlGutter');
        const visual = document.getElementById('ovlVisualPane');
        const toggle = document.getElementById('ovlModeToggle');
        if (toggle) {
            const labels = toggle.querySelectorAll('label');
            for (let i = 0; i < labels.length; i++) {
                labels[i].classList.toggle('ovl-mode-active', labels[i].getAttribute('data-mode') === mode);
            }
        }
        if (mode === 'visual') {
            if (ta) ta.style.display = 'none';
            if (gutter) gutter.style.display = 'none';
            if (visual) visual.style.display = 'flex';
        } else {
            if (ta) ta.style.display = '';
            if (gutter) gutter.style.display = '';
            if (visual) visual.style.display = 'none';
        }
    } catch (e) {
        console.error('[ovl] setEditorMode failed', e);
    }
}

// 行号槽：只在行数变化时整体重建（换行/删行才重建），普通敲字不触发重建 —— 避免
// 对 4,132 行文档每次按键都重刷整块 DOM（§3.4 第 2 条同一条纪律的延伸）。
function ovlRenderGutter(force) {
    try {
        const ta = document.getElementById('ovlCodeArea');
        const gutter = document.getElementById('ovlGutter');
        if (!ta || !gutter) return;
        const n = ta.value.length ? ta.value.split('\n').length : 1;
        if (!force && n === OvlState.gutterLineCount) return;
        OvlState.gutterLineCount = n;
        const frag = document.createDocumentFragment();
        for (let i = 1; i <= n; i++) {
            const d = document.createElement('div');
            d.className = 'ovl-ln';
            d.textContent = String(i);
            frag.appendChild(d);
        }
        gutter.textContent = '';
        gutter.appendChild(frag);
    } catch (e) {
        console.error('[ovl] renderGutter failed', e);
    }
}

function ovlShowTreeError(msg) {
    const body = document.getElementById('ovlTreeBody');
    if (!body) return;
    body.textContent = '';
    const d = document.createElement('div');
    d.className = 'ovl-tree-error';
    d.textContent = msg;
    body.appendChild(d);
}

// ---- File System Access API 路径 ----

// 递归建目录树的 DOM（懒加载子目录：点开才递归读下一层）。
// 跳过点开头的条目（.git 等）—— 纯性能/可用性考虑，不是安全加固。
async function ovlBuildTreeDom(dirHandle) {
    const ul = document.createElement('ul');
    ul.className = 'ovl-tree-ul';
    const entries = [];
    for await (const pair of dirHandle.entries()) {
        const name = pair[0], h = pair[1];
        if (name.charAt(0) === '.') continue;
        entries.push([name, h]);
    }
    entries.sort(function (a, b) {
        const ak = a[1].kind === 'directory' ? 0 : 1;
        const bk = b[1].kind === 'directory' ? 0 : 1;
        if (ak !== bk) return ak - bk;
        return a[0].localeCompare(b[0]);
    });
    for (let i = 0; i < entries.length; i++) {
        const name = entries[i][0], h = entries[i][1];
        const isDir = h.kind === 'directory';
        const li = document.createElement('li');
        li.className = 'ovl-tree-node';
        const row = document.createElement('div');
        row.className = 'ovl-tree-row ' + (isDir ? 'ovl-tree-row-dir' : 'ovl-tree-row-file');
        row.textContent = (isDir ? '▸ ' : '') + name;
        li.appendChild(row);
        if (isDir) {
            const childUl = document.createElement('ul');
            childUl.className = 'ovl-tree-ul ovl-tree-children';
            li.appendChild(childUl);
            row.addEventListener('click', function () {
                const opening = !li.classList.contains('ovl-tree-open');
                li.classList.toggle('ovl-tree-open', opening);
                row.textContent = (opening ? '▾ ' : '▸ ') + name;
                if (opening && childUl.childElementCount === 0) {
                    ovlBuildTreeDom(h).then(function (built) {
                        while (built.firstChild) childUl.appendChild(built.firstChild);
                    }).catch(function (e) {
                        console.error('[ovl] list dir failed', e);
                        const errLi = document.createElement('li');
                        errLi.className = 'ovl-tree-error';
                        errLi.textContent = '（读取失败）';
                        childUl.appendChild(errLi);
                    });
                }
            });
        } else {
            row.addEventListener('click', function () { ovlOpenFile(h, name); });
        }
        ul.appendChild(li);
    }
    return ul;
}

async function ovlRenderTree(dirHandle) {
    const body = document.getElementById('ovlTreeBody');
    if (!body) return;
    body.textContent = '';
    const loading = document.createElement('div');
    loading.className = 'ovl-tree-loading';
    loading.textContent = '正在读取…';
    body.appendChild(loading);
    try {
        const ul = await ovlBuildTreeDom(dirHandle);
        body.textContent = '';
        body.appendChild(ul);
    } catch (e) {
        console.error('[ovl] render tree failed', e);
        ovlShowTreeError('读取文件夹失败：' + (e && e.message ? e.message : String(e)));
    }
}

async function ovlOpenFile(fileHandle, name) {
    try {
        const file = await fileHandle.getFile();
        const text = await file.text();
        OvlState.currentFile = { name: name, handle: fileHandle };
        const ta = document.getElementById('ovlCodeArea');
        if (ta) { ta.disabled = false; ta.value = text; }
        const tabName = document.getElementById('ovlEditorTabName');
        if (tabName) tabName.textContent = name;
        ovlRenderGutter(true);
    } catch (e) {
        console.error('[ovl] open file failed', e);
    }
}

// ---- webkitdirectory 降级路径（FSA 不可用时）----

function ovlBuildTreeFromFileList(fileList) {
    const root = { dirs: new Map(), files: new Map() };
    for (let i = 0; i < fileList.length; i++) {
        const f = fileList[i];
        const relPath = f.webkitRelativePath || f.name;
        const parts = String(relPath).split('/').filter(function (p) { return p.length > 0; });
        if (parts.some(function (p) { return p.charAt(0) === '.'; })) continue;
        let node = root;
        for (let j = 0; j < parts.length - 1; j++) {
            const seg = parts[j];
            if (!node.dirs.has(seg)) node.dirs.set(seg, { dirs: new Map(), files: new Map() });
            node = node.dirs.get(seg);
        }
        if (parts.length > 0) node.files.set(parts[parts.length - 1], f);
    }
    return root;
}

function ovlDomFromFsNode(node) {
    const ul = document.createElement('ul');
    ul.className = 'ovl-tree-ul';
    const dirNames = Array.from(node.dirs.keys()).sort();
    const fileNames = Array.from(node.files.keys()).sort();
    dirNames.forEach(function (name) {
        const li = document.createElement('li');
        li.className = 'ovl-tree-node';
        const row = document.createElement('div');
        row.className = 'ovl-tree-row ovl-tree-row-dir';
        row.textContent = '▸ ' + name;
        li.appendChild(row);
        const childUl = ovlDomFromFsNode(node.dirs.get(name));
        childUl.className += ' ovl-tree-children';
        li.appendChild(childUl);
        row.addEventListener('click', function () {
            const opening = !li.classList.contains('ovl-tree-open');
            li.classList.toggle('ovl-tree-open', opening);
            row.textContent = (opening ? '▾ ' : '▸ ') + name;
        });
        ul.appendChild(li);
    });
    fileNames.forEach(function (name) {
        const li = document.createElement('li');
        li.className = 'ovl-tree-node';
        const row = document.createElement('div');
        row.className = 'ovl-tree-row ovl-tree-row-file';
        row.textContent = name;
        row.addEventListener('click', function () { ovlOpenFileFromBlob(node.files.get(name), name); });
        li.appendChild(row);
        ul.appendChild(li);
    });
    return ul;
}

async function ovlOpenFileFromBlob(file, name) {
    try {
        const text = await file.text();
        OvlState.currentFile = { name: name, handle: null };
        const ta = document.getElementById('ovlCodeArea');
        // webkitdirectory 只读、无持久化 —— 明确禁用编辑，避免用户以为改了会存下去。
        if (ta) { ta.disabled = true; ta.value = text; }
        const tabName = document.getElementById('ovlEditorTabName');
        if (tabName) tabName.textContent = name + '（只读降级模式）';
        ovlRenderGutter(true);
    } catch (e) {
        console.error('[ovl] open fallback file failed', e);
    }
}

async function ovlPickFolder() {
    try {
        if (window.showDirectoryPicker) {
            let handle;
            try {
                handle = await window.showDirectoryPicker();
            } catch (e) {
                // AbortError = 用户在选择器里点了取消，这是正常流程，不是错误。
                if (e && e.name === 'AbortError') return;
                throw e;
            }
            OvlState.usingWebkitFallback = false;
            OvlState.dirHandle = handle;
            await ovlRenderTree(handle);
        } else {
            OvlState.usingWebkitFallback = true;
            const input = document.getElementById('ovlWebkitDirInput');
            if (input) input.click();
        }
    } catch (e) {
        console.error('[ovl] pick folder failed', e);
        ovlShowTreeError('打开文件夹失败：' + (e && e.message ? e.message : String(e)));
    }
}

function ovlBindShell() {
    try {
        const treeBtn = document.getElementById('ovlTreeToggleBtn');
        if (treeBtn) treeBtn.addEventListener('click', ovlToggleTree);

        const openTBtn = document.getElementById('ovlOpenTranslatorBtn');
        if (openTBtn) openTBtn.addEventListener('click', ovlOpenTranslator);

        const chatBtn = document.getElementById('ovlChatBtn');
        // 直接调既有的 chatToggle —— 不复制、不重写聊天窗（§4 M1 范围第 3 条）。
        if (chatBtn) chatBtn.addEventListener('click', function () {
            try { chatToggle(); } catch (e) { console.error('[ovl] chatToggle failed', e); }
        });

        const pickBtn = document.getElementById('ovlPickFolderBtn');
        if (pickBtn) pickBtn.addEventListener('click', ovlPickFolder);

        const closeBtn = document.getElementById('ovlTranslatorCloseBtn');
        if (closeBtn) closeBtn.addEventListener('click', ovlCloseTranslator);

        const layoutBtn = document.getElementById('ovlLayoutBtn');
        if (layoutBtn) layoutBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            ovlToggleLayoutMenu();
        });

        const layoutMenu = document.getElementById('ovlLayoutMenu');
        if (layoutMenu) {
            layoutMenu.addEventListener('click', function (e) {
                const item = e.target.closest('.ovl-layout-menu-item');
                if (!item) return;
                ovlSetViewMode(item.getAttribute('data-view'));
            });
        }

        // 点菜单外部关闭菜单（捕获阶段挂一次，跟聊天窗的既有做法一样是全局单例监听）。
        document.addEventListener('click', function (e) {
            const menu = document.getElementById('ovlLayoutMenu');
            const btn = document.getElementById('ovlLayoutBtn');
            if (!menu || menu.hasAttribute('hidden')) return;
            if (menu.contains(e.target) || (btn && btn.contains(e.target))) return;
            ovlCloseLayoutMenu();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') ovlCloseLayoutMenu();
        });

        const modeToggle = document.getElementById('ovlModeToggle');
        if (modeToggle) {
            modeToggle.addEventListener('click', function (e) {
                const label = e.target.closest('label[data-mode]');
                if (!label) return;
                ovlSetEditorMode(label.getAttribute('data-mode'));
            });
        }

        const ta = document.getElementById('ovlCodeArea');
        const gutter = document.getElementById('ovlGutter');
        if (ta) {
            ta.addEventListener('input', function () { ovlRenderGutter(false); });
            ta.addEventListener('scroll', function () {
                if (gutter) gutter.scrollTop = ta.scrollTop;
            });
        }

        const dirInput = document.getElementById('ovlWebkitDirInput');
        if (dirInput) {
            dirInput.addEventListener('change', function (e) {
                const files = e.target.files;
                if (!files || !files.length) return;
                OvlState.dirHandle = null;
                const tree = ovlBuildTreeFromFileList(files);
                const body = document.getElementById('ovlTreeBody');
                if (body) {
                    body.textContent = '';
                    body.appendChild(ovlDomFromFsNode(tree));
                }
            });
        }
    } catch (e) {
        console.error('[ovl] bindShell failed', e);
    }
}

// 启动入口：DOMContentLoaded 末尾、chatBoot() 之后调用（§4 M1 改动位置②）。
// 自带 try/catch，且激活 class 只在全部初始化成功之后作为最后一步加上 ——
// 任何一步炸了，body 都不会带上 ovl-shell-active，页面照旧是纯 v1，不会白屏。
function ovlBoot() {
    if (OvlState.booted) return;
    const shell = ovlEnsureShell();
    if (!shell) throw new Error('ovlEnsureShell returned null');
    ovlBindShell();

    let savedView = null;
    try { savedView = localStorage.getItem('ovl.viewMode'); } catch (e) {}
    if (savedView === 'split' || savedView === 'editor' || savedView === 'pdf') {
        OvlState.viewMode = savedView;
    }
    ovlSetViewMode(OvlState.viewMode, { skipSave: true });

    let savedTree = null;
    try { savedTree = localStorage.getItem('ovl.treeOpen'); } catch (e) {}
    if (savedTree === '0') {
        OvlState.treeOpen = false;
        const body = document.getElementById('ovlBody');
        if (body) body.setAttribute('data-tree', 'collapsed');
    }

    OvlState.booted = true;
    // 最后一步：只有走到这里才让外壳生效。
    document.body.classList.add('ovl-shell-active');
}

</script>
