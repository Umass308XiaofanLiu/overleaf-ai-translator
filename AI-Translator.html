function persistOnlineCatalog() {
    try {
        const payload = { v: MODEL_CATALOG_SCHEMA_VERSION };
        MODEL_PROVIDERS.forEach(function (p) {
            payload[p] = {
                at: AppState.modelRefresh[p].at || 0,
                models: (AppState.fetchedModels[p] || []).map(m => ({
                    id: m.id, name: m.name, group: m.group || 'chat', created: m.created || ''
                }))
            };
        });
        localStorage.setItem(MODEL_CATALOG_LS_KEY, JSON.stringify(payload));
    } catch (e) {}
}

function loadOnlineCatalog() {
    try {
        const saved = localStorage.getItem(MODEL_CATALOG_LS_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (!parsed || parsed.v !== MODEL_CATALOG_SCHEMA_VERSION) return;   // 版本不匹配 → 当作没有缓存
        let visibilityPatched = false;
        MODEL_PROVIDERS.forEach(function (p) {
            const bucket = parsed[p];
            if (!bucket || !Array.isArray(bucket.models)) return;
            let models = bucket.models.map(function (m) {
                // 白名单对 localStorage 里的数据同样生效：即使有人手工篡改也注入不进来。
                // id 走 SAFE_MODEL_ID，name 走去标签 + 截断（它会被渲染进顶栏标签/下拉/勾选框）。
                const id = sanitizeModelId(m && m.id);
                return id ? {
                    id: id,
                    name: String((m && m.name) || id).replace(/[<>]/g, '').slice(0, 120) || id,
                    group: m.group === 'other' ? 'other' : 'chat',
                    created: m.created || '',
                    provider: p
                } : null;
            }).filter(Boolean);
            // Gemini 的文本/非文本过滤规则可能在这份缓存写入之后变严过（比如新增了黑名单词）。
            // 缓存是纯回放，不会重新走 fetchGeminiModelList，所以这里必须重新套一遍同一个判定，
            // 否则老版本缓存过的图像/TTS/live 模型会在「点更新之前」一直显示在下拉里。
            if (p === 'gemini') {
                models = models.filter(m => isGeminiTextChatModelId(m.id));
            }
            if (models.length === 0) return;

            // 兜底补齐可见性键。缓存（onlineModelCatalog）和可见性表（modelVisibility）是两次
            // 互相独立、各自吞异常的写入，只要有一份没落盘（配额爆掉 / 用户清了单个键 / 隐私模式 /
            // 跨设备手搬），这里几十个 id 在 modelVisibility 里就全都不存在 → 全代码库的
            // `!== false` 判定一律放行 → 顶栏下拉一次性灌进上百个模型。
            // 规则与 mergeVisibilityForProvider 一致：内置目录里的默认可见，其余默认隐藏。
            // 只补缺失的键，不改已有值，所以是幂等的；这里是纯读缓存路径，刻意不做剪枝。
            const builtinIds = new Set(DEFAULT_MODEL_CATALOG.filter(x => x.provider === p).map(x => x.id));
            models.forEach(function (m) {
                if (!(m.id in AppState.modelVisibility)) {
                    AppState.modelVisibility[m.id] = builtinIds.has(m.id);
                    visibilityPatched = true;
                }
            });

            AppState.fetchedModels[p] = models;
            AppState.modelRefresh[p] = {
                status: 'ok', at: bucket.at || 0, count: models.length,
                errCode: null, errMsg: '', source: 'cache'
            };
        });
        if (visibilityPatched) {
            try {
                localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
            } catch (e) {}
        }
    } catch (e) {}
}

// 合并可见性。新 id 必须**显式写入布尔值**：全代码库用 `!== false` 判定可见，
// 留空等于默认打开，一次刷新会把 50-90 个 id 一股脑灌进顶栏下拉。
// 新发现的模型默认隐藏，用户到「本次新发现」横幅一键放行。
// ⚠️ 必须在覆盖 AppState.fetchedModels[provider] **之前**调用（剪枝要用到旧值）。
function mergeVisibilityForProvider(provider, models) {
    const builtinIds = new Set(DEFAULT_MODEL_CATALOG.filter(m => m.provider === provider).map(m => m.id));
    const newIds = [];
    models.forEach(function (m) {
        if (!(m.id in AppState.modelVisibility)) {
            AppState.modelVisibility[m.id] = builtinIds.has(m.id);
            if (!builtinIds.has(m.id)) newIds.push(m.id);
        }
    });

    // 剪枝：只清理「上次从这家 API 拉到、这次没再返回」的孤儿键，且要过四重保护
    // （本次结果 / 内置目录 / 本地模型 / 当前选中项）。不剪枝的话 loadSavedSettings 的
    // 浅合并会让这个 map 随每次模型换代无限膨胀。
    const keepIds = new Set(models.map(m => m.id));
    DEFAULT_MODEL_CATALOG.forEach(m => keepIds.add(m.id));
    (AppState.localModels || []).forEach(lm => keepIds.add(lm.id));
    if (AppState.selectedModel) keepIds.add(AppState.selectedModel);
    (AppState.fetchedModels[provider] || []).forEach(function (old) {
        if (!keepIds.has(old.id)) delete AppState.modelVisibility[old.id];
    });

    return newIds;
}

async function refreshOnlineModels(providers) {
    const targets = (providers && providers.length ? providers : MODEL_PROVIDERS)
        .filter(p => MODEL_PROVIDERS.indexOf(p) >= 0);
    if (targets.length === 0) return;

    syncSettingsInputsToState();

    const keyOf = {
        gemini: AppState.geminiApiKey,
        openai: AppState.openaiApiKey,
        claude: AppState.claudeApiKey
    };
    if (targets.every(p => !keyOf[p])) {
        showToast('请先在下方填写至少一个 API Key', 'warning');
        return;
    }

    targets.forEach(function (p) {
        AppState.modelRefresh[p] = { ...AppState.modelRefresh[p], status: 'loading', errCode: null, errMsg: '' };
    });
    AppState.newlyFoundIds = [];
    setState({});   // 让按钮和芯片先进入 loading 态

    // 'loading' 同时充当 UI 状态和并发锁（芯片 disabled / anyRefreshing / refreshOnlineModelsClick
    // 的守卫都读它），所以下面整段必须包在 try/finally 里 —— 漏一次解锁就是永久死锁，
    // 用户只能刷新整个页面才能再点「更新」。
    try {
    const tasks = targets.map(function (p) {
        if (p === 'gemini') return fetchGeminiModelList(AppState.geminiApiKey);
        if (p === 'openai') return fetchOpenaiModelList(AppState.openaiApiKey, !AppState.showDatedSnapshots);
        return fetchClaudeModelList(AppState.claudeApiKey, AppState.claudeProxyUrl);
    });

    // 必须是 allSettled：用 all 的话一家没填 Key 会把另外两家已成功的结果一起拖垮
    const results = await Promise.allSettled(tasks);

    const summary = [];
    const allNew = [];
    results.forEach(function (r, i) {
        const p = targets[i];
        if (r.status === 'fulfilled' && Array.isArray(r.value) && r.value.length > 0) {
            const models = r.value;
            allNew.push(...mergeVisibilityForProvider(p, models));   // 先合并（用得到旧值）
            AppState.fetchedModels[p] = models;                      // 再覆盖
            AppState.modelRefresh[p] = {
                status: 'ok', at: Date.now(), count: models.length,
                errCode: null, errMsg: '', source: 'live'
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} ${models.length} 个`);
        } else if (r.status === 'fulfilled') {
            // 返回 0 条：**不覆盖**旧列表。project-scoped key 的模型白名单会真实导致空列表，
            // 当成成功覆盖会把用户的列表清空。
            AppState.modelRefresh[p] = {
                ...AppState.modelRefresh[p], status: 'error',
                errCode: 'EMPTY', errMsg: '返回 0 个可用模型，已保留原列表'
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} 返回空`);
        } else {
            const info = classifyModelFetchError(r.reason);
            AppState.modelRefresh[p] = {
                ...AppState.modelRefresh[p], status: 'error',
                errCode: info.errCode, errMsg: info.errMsg
            };
            summary.push(`${MODEL_PROVIDER_LABEL[p]} 失败`);
        }
    });

    AppState.newlyFoundIds = allNew;

    try {
        localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
    } catch (e) {}
    persistOnlineCatalog();

    const okCount = targets.filter(p => AppState.modelRefresh[p].status === 'ok').length;
    if (okCount === targets.length) {
        showToast(`已更新：${summary.join(' · ')}${allNew.length ? `（新增 ${allNew.length} 个，默认隐藏）` : ''}`, 'success');
    } else if (okCount > 0) {
        showToast(`部分更新：${summary.join(' · ')}`, 'warning');
    } else {
        showToast('更新失败，仍在使用上次的列表', 'error');
    }
    } finally {
        // 任何抛错路径都必须解锁。不变量照旧：只写 modelRefresh，绝不碰 fetchedModels。
        let stuck = false;
        MODEL_PROVIDERS.forEach(function (p) {
            if (AppState.modelRefresh[p].status === 'loading') {
                AppState.modelRefresh[p] = {
                    ...AppState.modelRefresh[p], status: 'error',
                    errCode: 'HTTP', errMsg: '刷新意外中断，已保留原列表'
                };
                stuck = true;
            }
        });
        if (stuck) renderApp();
    }
}

// ============= 全局历史管理 =============

function addToGlobalHistory(pairs, sid) {
    if (pairs.length === 0) return;

    let history = [...AppState.globalHistory];
    const existingIndex = history.findIndex(item => item.id === sid);
    const updatedPairs = JSON.parse(JSON.stringify(pairs));

    if (existingIndex !== -1) {
        history[existingIndex] = {
            ...history[existingIndex],
            timestamp: Date.now(),
            pairs: updatedPairs
        };
        const item = history.splice(existingIndex, 1)[0];
        history.unshift(item);
    } else {
        const newItem = {
            id: sid,
            timestamp: Date.now(),
            pairs: updatedPairs
        };
        history = [newItem, ...history];
    }

    setState({ globalHistory: history.slice(0, AppState.historyLimit) });
}

function restoreGlobalHistory(item) {
    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }

    AppState.isRestoringHistory = true;

    setState({
        sessionId: item.id,
        translationPairs: item.pairs,
        inputText: item.pairs.map(p => p.src).join('\n'),
        isEditingMode: false,
        showHistoryMenu: false
    });

    setTimeout(() => {
        AppState.isRestoringHistory = false;
    }, 500);
}

// ============= 事件处理 =============

function handleInputChange(value) {
    // 如果正在恢复历史，跳过
    if (AppState.isRestoringHistory) {
        return;
    }

    // 如果从空变为有内容，创建新会话
    if (AppState.inputText === "" && value !== "") {
        if (AppState.translationPairs.length === 0) {
            AppState.sessionId = Date.now().toString();
        }
    }

    AppState.inputText = value;
    AppState.isEditingMode = true;
    AppState.isRestoringHistory = false;

    // 如果输入为空，清空状态并重新渲染（需要隐藏翻译结果）
    if (!value.trim()) {
        AppState.translationPairs = [];
        renderApp();
        return;
    }

    // 自动翻译防抖
    if (AppState.isAutoTranslate) {
        if (AppState.debounceTimer) {
            clearTimeout(AppState.debounceTimer);
        }
        AppState.debounceTimer = setTimeout(() => {
            if (AppState.isEditingMode && AppState.inputText !== AppState.lastTranslatedText) {
                handleTranslate();
            }
        }, 1500);
    }

    // 不再调用 renderApp()，避免焦点丢失
    // 输入时 textarea 的值已经被浏览器更新，无需重新渲染
}

function handleRowClick(index, clickedSide = null) {
    if (AppState.activeIndex !== null && AppState.activeIndex !== index) {
        saveRowUpdate(AppState.activeIndex);
    }

    // 在 setState 之前保存滚动位置和点击行的位置信息
    const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
    const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');

    let savedScrollInfo = null;
    if (sourceContainer && targetContainer && clickedSide) {
        const clickedContainer = clickedSide === 'src' ? sourceContainer : targetContainer;
        const clickedRow = clickedContainer.querySelector(`[data-idx="${index}"]`);

        if (clickedRow) {
            const containerRect = clickedContainer.getBoundingClientRect();
            const rowRect = clickedRow.getBoundingClientRect();
            savedScrollInfo = {
                clickedSide: clickedSide,
                clickedScrollTop: clickedContainer.scrollTop,
                rowRelativeTop: rowRect.top - containerRect.top, // 行相对于容器顶部的位置
                index: index
            };
        }
    }

    // 使用 preserveScroll: false，因为我们有自己的滚动同步逻辑
    setState({
        activeIndex: index,
        editValues: {
            src: AppState.translationPairs[index].src,
            tgt: AppState.translationPairs[index].tgt
        },
        isEditingMode: false
    }, { preserveScroll: false });

    // 滚动同步：恢复点击侧的滚动位置，并同步另一侧
    if (savedScrollInfo) {
        requestAnimationFrame(() => {
            syncScrollAfterRender(savedScrollInfo);
        });
    }
}

// 渲染后恢复滚动位置并同步
function syncScrollAfterRender(scrollInfo) {
    const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
    const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');

    if (!sourceContainer || !targetContainer) return;

    const { clickedSide, clickedScrollTop, rowRelativeTop, index } = scrollInfo;

    const clickedContainer = clickedSide === 'src' ? sourceContainer : targetContainer;
    const otherContainer = clickedSide === 'src' ? targetContainer : sourceContainer;

    // 1. 恢复点击侧的滚动位置
    clickedContainer.scrollTop = clickedScrollTop;

    // 2. 找到另一侧对应的行，并滚动到相同的相对位置
    const otherRow = otherContainer.querySelector(`[data-idx="${index}"]`);
    if (otherRow) {
        // 计算另一侧需要滚动到的位置，使对应行在相同的相对位置
        const otherRowOffsetTop = otherRow.offsetTop;
        otherContainer.scrollTop = otherRowOffsetTop - rowRelativeTop;
    }
}

// 全局点击处理 - 点击空白区域退出编辑模式
function handleGlobalClick(event) {
    // 如果没有正在编辑的句子，直接返回
    if (AppState.activeIndex === null) return;

    // 检查点击的目标是否在句子行内
    const clickedRow = event.target.closest('[data-idx]');
    if (clickedRow) return;

    // 检查是否点击了模态框、菜单、按钮等交互元素
    const clickedModal = event.target.closest('.fixed.inset-0'); // 模态框
    const clickedButton = event.target.closest('button');
    const clickedInput = event.target.closest('input, textarea, select');
    const clickedDropdown = event.target.closest('[onclick*="toggle"], [onclick*="Menu"], [onclick*="Settings"]');

    // 如果点击了这些元素，不退出编辑模式
    if (clickedModal || clickedButton || clickedInput || clickedDropdown) return;

    // 点击了空白区域，保存当前编辑并退出编辑模式
    saveRowUpdate(AppState.activeIndex);
    setState({
        activeIndex: null,
        editValues: { src: '', tgt: '' }
    });
}

// 向后兼容的局部处理函数
function handleBlankAreaClick(event) {
    handleGlobalClick(event);
}

function handleManualSave() {
    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }
}

function handleClear() {
    if (AppState.mainAbortController) {
        AppState.mainAbortController.abort();
    }

    if (AppState.translationPairs.length > 0) {
        addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
    }

    AppState.isRestoringHistory = true;

    setState({
        inputText: "",
        originalInputText: "",
        translationPairs: [],
        activeIndex: null,
        isEditingMode: true,
        viewMode: 'edit',
        isLoading: false,
        sessionId: Date.now().toString(),
        error: null
    });

    updateSynonymState({ show: false });

    setTimeout(() => {
        AppState.isRestoringHistory = false;
    }, 100);

    AppState.lastTranslatedText = "";
}

function toggleEditMode() {
    if (AppState.isEditingMode) {
        setState({ isEditingMode: false });
    } else {
        const reconstructed = AppState.translationPairs.map(p => p.src).join('\n');
        setState({ inputText: reconstructed, isEditingMode: true });
        AppState.lastTranslatedText = reconstructed;
    }
}

// ============= 重新生成所有翻译 =============
async function handleRegenerateAll() {
    // 如果没有翻译对，直接返回
    if (AppState.translationPairs.length === 0) return;

    // 如果正在重新生成，则取消
    if (AppState.isRegeneratingAll) {
        if (AppState.regenerateAllAbortController) {
            AppState.regenerateAllAbortController.abort();
            AppState.regenerateAllAbortController = null;
        }
        setState({ isRegeneratingAll: false });
        return;
    }

    // 初始化 AbortController
    const controller = new AbortController();
    AppState.regenerateAllAbortController = controller;

    setState({ isRegeneratingAll: true, error: null });

    try {
        const config = getApiConfig();
        // 使用原始输入内容重新翻译（不是按句拼接的）
        const originalText = AppState.originalInputText || AppState.inputText;

        // 重新翻译所有内容
        const result = await translateBulk(originalText, AppState.sourceLang, AppState.targetLang, config, controller.signal);

        if (result?.translations) {
            // 重新生成时，每个翻译对重置历史记录（不累加每句的历史）
            const pairs = result.translations.map((t) => ({
                src: t.src,
                tgt: t.tgt,
                history: [{ src: t.src, tgt: t.tgt }],
                historyIndex: 0,
                isUpdating: false,
                isRegenerating: false
            }));
            setState({ translationPairs: pairs, viewMode: 'preview', activeIndex: null });
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "重新生成翻译失败，请重试。" });
            console.error(err);
        }
    } finally {
        AppState.regenerateAllAbortController = null;
        setState({ isRegeneratingAll: false });
    }
}

// ============= 重新生成单条翻译 =============
async function handleRegenerateTranslation(index) {
    const pair = AppState.translationPairs[index];
    if (!pair) return;

    // 如果正在重新生成，则取消
    if (pair.isRegenerating) {
        const controller = AppState.regenerateAbortControllers?.get(index);
        if (controller) {
            controller.abort();
            AppState.regenerateAbortControllers.delete(index);
            updateTranslationPair(index, { isRegenerating: false });
        }
        return;
    }

    // 初始化 AbortController Map (如果不存在)
    if (!AppState.regenerateAbortControllers) {
        AppState.regenerateAbortControllers = new Map();
    }

    const controller = new AbortController();
    AppState.regenerateAbortControllers.set(index, controller);

    // 标记正在重新生成
    updateTranslationPair(index, { isRegenerating: true });

    try {
        const config = getApiConfig();
        const srcText = pair.src;
        const oldTgt = pair.tgt;

        // 使用当前语言设置重新翻译
        const result = await translateBulk(srcText, AppState.sourceLang, AppState.targetLang, config, controller.signal);

        if (result?.translations && result.translations.length > 0) {
            const newTgt = result.translations[0].tgt;

            // 只有当新翻译与旧翻译不同时，才添加到历史记录
            if (newTgt !== oldTgt) {
                addHistory(index, srcText, newTgt);

                // 如果当前正在编辑这一行，同时更新 editValues
                if (AppState.activeIndex === index) {
                    AppState.editValues.tgt = newTgt;
                }
            }
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "重新生成翻译失败，请重试。" });
            console.error(err);
        }
    } finally {
        AppState.regenerateAbortControllers?.delete(index);
        updateTranslationPair(index, { isRegenerating: false });
    }
}

// ============= 辅助函数 =============
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 属性上下文专用。escapeHtml() 走 textContent→innerHTML，**不转义引号**，
// 所以 attr="${escapeHtml(x)}" 里只要 x 含一个 " 就能闭合属性并注入 onmouseover= 之类。
// 受影响的是「非白名单」变量：芯片 title 里的 errMsg（来自厂商 API 的 error.message，远端可控）
// 和搜索框 value（用户输入，且 setSettingsModelQuery 渲染后会主动 focus）。
function escapeAttr(value) {
    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============= 在线模型目录派生层 =============
// 全 UI（Settings 勾选框、模型下拉、顶栏标签、页脚状态）都只消费这里，不再有第二份 id 列表。
// 合并规则：DEFAULT_MODEL_CATALOG 打底 → API 结果按 id upsert（保留种子的 sub/tier/short）
//          → 种子里有但 API 没返回的打 retired 标记（**只打标不删**：可能只是这个 project key
//            没启用该模型，或列表接口有滞后）→ 最后钉住当前选中项，保证下拉永不丢失正在用的模型。
const MODEL_ICON_CLASS = {
    gemini: { lite: 'text-emerald-500', fast: 'text-orange-500', pro: 'text-indigo-600' },
    openai: { lite: 'text-teal-500',    fast: 'text-green-500',  pro: 'text-sky-600'   },
    claude: { lite: 'text-amber-500',   fast: 'text-orange-600', pro: 'text-rose-600'  }
};

// 给 API 拉回来的陌生模型猜一个档位（只影响图标和配色）
function classifyModelTier(id) {
    const s = String(id).toLowerCase();
    if (/nano|lite|haiku/.test(s)) return 'lite';
    if (/mini|flash|sonnet/.test(s)) return 'fast';
    return 'pro';
}

function decorateModel(entry) {
    const tier = entry.tier || classifyModelTier(entry.id);
    const palette = MODEL_ICON_CLASS[entry.provider] || MODEL_ICON_CLASS.gemini;
    return {
        ...entry,
        tier,
        sub: entry.sub || (entry.group === 'other' ? '未验证是否支持对话' : '来自 API'),
        icon: tier === 'lite' ? Icons.Rocket : (tier === 'fast' ? Icons.Zap : Icons.Cpu),
        iconClass: palette[tier] || 'text-slate-500',
        price: getModelPrice(entry.id)   // null = 不在内置价格表里，两处渲染点都要按「价格未知」兜底
    };
}

// 某个 provider 的完整目录
function getModelCatalog(provider) {
    const map = new Map();
    DEFAULT_MODEL_CATALOG
        .filter(m => m.provider === provider)
        .forEach(m => map.set(m.id, { ...m, builtin: true, retired: false, group: 'chat' }));

    const fetched = (AppState.fetchedModels && AppState.fetchedModels[provider]) || [];
    if (fetched.length > 0) {
        const fetchedIds = new Set(fetched.map(m => m.id));
        // 种子里有、这次 API 没返回的 → 标 retired，但保留（可能只是没权限/接口滞后）
        Array.from(map.keys()).forEach(k => {
            if (!fetchedIds.has(k)) map.set(k, { ...map.get(k), retired: true });
        });
        fetched.forEach(m => {
            const old = map.get(m.id);
            map.set(m.id, {
                id: m.id,
                name: m.name || (old && old.name) || m.id,
                sub: (old && old.sub) || '',
                short: (old && old.short) || '',
                tier: (old && old.tier) || '',
                provider: provider,
                group: m.group || 'chat',
                created: m.created || '',
                builtin: !!(old && old.builtin),
                retired: false
            });
        });
    }

    // 钉住：用户当前正在用的模型永远不会从下拉里消失。
    // 刻意**不自动切换** selectedModel —— /v1/models 不是权威（project key 的模型白名单会过滤输出、
    // 新模型有收录延迟、Gemini 的 Model schema 里根本没有 deprecated 字段）。
    if (AppState.apiProvider === provider && AppState.selectedModel && !map.has(AppState.selectedModel)) {
        const pinnedId = sanitizeModelId(AppState.selectedModel);
        if (pinnedId) {
            map.set(pinnedId, {
                id: pinnedId, name: pinnedId, sub: '未在列表中（仍可用）', short: '',
                provider: provider, group: 'chat', builtin: false, retired: true, pinned: true
            });
        }
    }

    return Array.from(map.values()).map(decorateModel);
}

// 「正在使用的模型永不从下拉里消失」。getModelCatalog 的 pinned 只在选中模型**不在** map 里
// 时才成立，而最常见的情况恰恰是它还在目录里（只是被标了 retired）—— 那时 pinned 为 false，
// 「隐藏所有未在 API 列表中的模型」/「全不选」会把它一起隐藏，用户再也切不回来。
// 所以钉住判定必须在这一层做，而不是只依赖 pinned。
function isPinnedModel(provider, m) {
    return !!m.pinned || (provider === AppState.apiProvider && m.id === AppState.selectedModel);
}

function getVisibleModels(provider) {
    return getModelCatalog(provider)
        .filter(m => isPinnedModel(provider, m) || AppState.modelVisibility[m.id] !== false);
}

function getModelMeta(id) {
    for (let i = 0; i < MODEL_PROVIDERS.length; i++) {
        const hit = getModelCatalog(MODEL_PROVIDERS[i]).find(m => m.id === id);
        if (hit) return hit;
    }
    const local = (AppState.localModels || []).find(lm => lm.id === id);
    return local
        ? { id: local.id, name: local.id, sub: '', tier: '', provider: 'local', icon: Icons.Server, iconClass: 'text-indigo-600' }
        : null;
}

// 顶栏按钮的短标签。内置模型直接用目录里的 short（保证与重构前逐字一致），
// API 新模型退化为「去掉厂商前缀 + 超 15 字截断」。
function getModelShortLabel(id) {
    const meta = getModelMeta(id);
    if (meta && meta.short) return meta.short;
    const fallback = String(id || '');
    let label = (meta && meta.name) || fallback;
    label = label.replace(/^(Google\s+)?(Gemini|ChatGPT|GPT|Claude)[\s-]*/i, '').trim() || fallback;
    return label.length > 15 ? label.slice(0, 15) + '...' : label;
}

// 相对时间：刚刚 / N 分钟前 / N 小时前 / M/D HH:mm
function formatModelRefreshTime(ts) {
    if (!ts) return '从未更新';
    const diff = Date.now() - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return `${Math.floor(diff / 60000)} 分钟前`;
    if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / 3600000)} 小时前`;
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 缓存是否超过 TTL —— 只用来改文案，绝不清空数据
function isModelCatalogStale(provider) {
    const st = AppState.modelRefresh[provider];
    return !!(st && st.at && (Date.now() - st.at) > MODEL_CATALOG_TTL);
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
}

// 弹窗位置自动调整函数
function adjustPopupPosition(popupId, padding = 10) {
    requestAnimationFrame(() => {
        const popup = document.getElementById(popupId);
        if (!popup) return;

        const rect = popup.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // 检查右边是否超出
        if (rect.right > viewportWidth - padding) {
            const overflow = rect.right - viewportWidth + padding;
            popup.style.transform = `translateX(-${overflow}px)`;
        }

        // 检查左边是否超出
        if (rect.left < padding) {
            popup.style.left = `${padding}px`;
            popup.style.right = 'auto';
        }

        // 检查底部是否超出
        if (rect.bottom > viewportHeight - padding) {
            // 如果底部超出，尝试显示在上方
            popup.style.top = 'auto';
            popup.style.bottom = '100%';
            popup.style.marginTop = '0';
            popup.style.marginBottom = '8px';
        }
    });
}

// 渲染后调整所有弹窗位置
function adjustAllPopups() {
    ['modelMenuPopup', 'historyMenuPopup', 'saveMenuPopup', 'synonymPopup'].forEach(id => {
        adjustPopupPosition(id);
    });
}

// ============= 左右双栏逐行对齐 =============
// 问题：左右两栏各自 space-y-2 堆自己的行，同一句的英文常比中文多折一行（如 163px vs 137px），
// 高度差沿页面向下累加 —— 实测 top 差 3 / 29 / 55 ... 一路涨到 393px。
// 另有一个常数偏移：两栏表头高度不等（70 vs 66.67），两个滚动容器的起点就差 3.33px。
//
// 修法（纯 CSS 做不到：两栏在两个独立的滚动容器里，无法互相知道对方那一行有多高）：
//   1) 表头 min-h-[70px] 抹掉常数偏移（见 renderSourcePanel / renderTargetPanel）；
//   2) 渲染后成对把 min-height 补到 max(左, 右)，短的那格多留白（预期且正确的代价）；
//   3) 两栏滚动条互相跟随，否则用户一滚就散架，对齐只是摆设。
//
// ⚠️ 这里只碰**行高**，绝不碰容器的 padding-top。
//    曾经有过一版「用两个滚动容器的视口 top 之差补 padding-top 兜底常数偏移」，
//    它在 lg 断点以下（<1024px，main 是 grid-cols-1）会致命：两栏这时是上下堆叠的，
//    那个「常数偏移」变成一整个面板的高度（实测 900px 宽时 298px），被原样写成源栏的留白，
//    整个源面板一片空白。而且它自测还「通过」——把源栏推下去确实让两栏同一行落在同一个屏幕 Y，
//    只是在堆叠布局里这个目标本身没有意义。表头已经用 min-h-[70px] 钉死等高，兜底纯属多余。
//
// ⚠️ 渲染路径 root.innerHTML 全程没有 try/catch，这里抛一次异常页面就永久冻死，
//    所以整个同步过程自带 try/catch，出错只打 warn，绝不允许冒泡。
// ⚠️ 读写严格分离：先一次性清空上一轮补白，再一次性读完所有高度（只触发一次强制重排），
//    最后一次性写回。绝不逐行「读一次写一次」，那是 layout thrash。
let alignSyncRaf = 0;              // 已排队的 rAF 句柄（0 = 没排队）
let alignSyncTimer = 0;            // 兜底定时器句柄
let alignSyncApplying = false;     // 正在写尺寸：此时 ResizeObserver 的回调是我们自己造成的，忽略
let alignRowObserver = null;
let alignNoopStreak = 0;           // 连续多少轮「观察器叫醒了我们、结果什么都不用改」
let alignSyncFromObserver = false; // 这一轮是不是 ResizeObserver 触发的（熔断只统计它）

function scheduleAlignSync() {
    if (alignSyncRaf || alignSyncTimer) return;   // 本轮已排队，合并掉
    const run = () => {
        if (alignSyncRaf) { cancelAnimationFrame(alignSyncRaf); alignSyncRaf = 0; }
        if (alignSyncTimer) { clearTimeout(alignSyncTimer); alignSyncTimer = 0; }
        syncBilingualAlignment();
    };
    // 页面可见时 rAF 先到：在这一帧绘制之前就改完样式，用户看不到中间态，不会闪。
    alignSyncRaf = requestAnimationFrame(run);
    // 但后台标签页里浏览器会**暂停** rAF，上面那次排队会一直悬着，后续渲染全被合并挡掉。
    // 定时器兜底把它捞回来；后台本来就不绘制，这条路径不可能造成闪烁。
    alignSyncTimer = setTimeout(run, 50);
}

// 「保住滚动位置地跑一次对齐」。给的是**渲染路径之外**那些会改变行几何的操作用的
// （目前只有句对行距的三个 handler）。
//
// 为什么不能直接用 scheduleAlignSync：
//   syncBilingualAlignment 为了量到自然高度，必须先把上一轮补的 minHeight 全部清空，
//   而清空的那一瞬间较短的那一栏（中文通常比英文矮）整体塌下去，滚动条上限跟着变小，
//   浏览器**当场**把它的 scrollTop 夹掉；等行高补回来，被夹掉的那截滚动位置已经没人记得了。
//   scheduleAlignSync 把这一切排进 rAF，调用方连「夹之前的值是多少」都拿不到。
// 所以这里照抄 renderApp 的做法：**先记下滚动位置 → 同步跑完对齐（两栏高度就此一致）
// → 再把位置写回去**。写回时两栏已经等高，赋值不会再被夹。
// 全程 try/catch：万一 DOM 还没就绪也只是这一次没对齐，绝不能把异常抛给调用方。
function alignSyncKeepingScroll() {
    try {
        const a = document.querySelector('[data-align-scroll="src"]');
        const b = document.querySelector('[data-align-scroll="tgt"]');
        // 两栏是联动的，逻辑上只有一个滚动位置；谁在就用谁的（和 renderApp 同一套判断）
        const saved = a ? a.scrollTop : (b ? b.scrollTop : 0);
        syncBilingualAlignment();
        if (a) a.scrollTop = saved;
        if (b) b.scrollTop = saved;
    } catch (e) {
        console.warn('[align] 保位对齐失败：', e && e.message);
    }
}

function syncBilingualAlignment() {
    if (alignSyncApplying) return;
    alignSyncApplying = true;
    try {
        const srcBox = document.querySelector('[data-align-content="src"]');
        const tgtBox = document.querySelector('[data-align-content="tgt"]');
        if (!srcBox || !tgtBox) return;

        const srcRows = srcBox.children;
        const tgtRows = tgtBox.children;
        const n = Math.min(srcRows.length, tgtRows.length);
        if (n === 0) return;

        // 记下上一轮写进去的值，最后用来判断这一轮到底改没改（熔断依据，见文件末尾说明）
        const prev = new Array(n * 2);
        for (let i = 0; i < n; i++) {
            prev[i] = srcRows[i].style.minHeight;
            prev[n + i] = tgtRows[i].style.minHeight;
        }

        // ---- 写 1：清空上一轮的补白，让下面测到的是自然高度（否则永远只涨不缩）
        for (let i = 0; i < n; i++) {
            srcRows[i].style.minHeight = '';
            tgtRows[i].style.minHeight = '';
        }

        // ---- 读：一次性读完（这里触发本轮唯一一次强制重排）
        const srcH = new Array(n), tgtH = new Array(n);
        for (let i = 0; i < n; i++) srcH[i] = srcRows[i].getBoundingClientRect().height;
        for (let i = 0; i < n; i++) tgtH[i] = tgtRows[i].getBoundingClientRect().height;

        // ---- 写 2：成对补齐
        // 这里必须**向上取整**，不能直接用测到的小数高度：
        // 取小数时，高的那一侧 min-height 不生效（用自然高度 137.328），矮的那一侧生效（用 137.33），
        // 每行差个千分之几像素，几十行下来就攒出可见误差（实测 17 行攒到 0.15px，200 行就会破 1px）。
        // 取整后 ceil(max) 一定 >= 两侧的自然高度，两边都被 min-height 钉在同一个整数上，误差恒等于 0。
        // 代价是每行最多多留 1px 空白 —— 换来零累积，值。
        let changed = false;
        for (let i = 0; i < n; i++) {
            const px = Math.ceil(Math.max(srcH[i], tgtH[i])) + 'px';
            srcRows[i].style.minHeight = px;
            tgtRows[i].style.minHeight = px;
            if (prev[i] !== px || prev[n + i] !== px) changed = true;
        }

        // 熔断：只统计「观察器叫醒我们、结果一个字节都不用改」的连续轮次。
        // 判据不能是「频率高」——拖窗口边框时每帧都在真改，会误伤；
        // 也不能是「没改动」——渲染/打字触发的空跑很正常（菜单开关一下就是一次），
        // 连着 31 次就把观察器关掉纯属误杀。只有观察器自己在空转，才是真的回环。
        const fromObserver = alignSyncFromObserver;
        alignSyncFromObserver = false;
        alignNoopStreak = (fromObserver && !changed) ? alignNoopStreak + 1 : 0;
        if (alignNoopStreak > 30) {
            if (alignRowObserver) alignRowObserver.disconnect();
            console.warn('[align] 连续 30 轮空转，已停用行对齐观察器');
            return;
        }

        // 只有「不是观察器叫醒的」这一轮才重新挂观察器。
        // ResizeObserver 的 observe() 一定会先派发一次当前尺寸（哪怕尺寸压根没变），
        // 所以无条件 disconnect + 重新 observe 会自己喂自己：挂上 -> 立刻回调 -> 又挂上……
        // 实测一次 renderApp 就空转 33 轮、22.9ms，直到熔断器把观察器**关掉** ——
        // 观察器一关，字体/KaTeX 之后再改行高就没人补测了，恰好把它要保的东西弄丢。
        // 观察器触发的这一轮跳过重挂即可：之前的 observe 从没被撤销，照样盯着这些行。
        if (!fromObserver) observeAlignRows(srcRows, tgtRows, n);
    } catch (e) {
        console.warn('[align] 行对齐跳过：', e && e.message);
    } finally {
        alignSyncApplying = false;
    }
}

// 行高会因为编辑区 textarea 自动撑高、字体加载、KaTeX 重排等原因在渲染之后继续变，
// 所以盯住每一行的尺寸变化随时补测；ResizeObserver 只在「尺寸真的变了」时才回调，
// 而我们清空后写回的是同一个值（帧末尺寸不变），所以最多再跑一轮就收敛。
function observeAlignRows(srcRows, tgtRows, n) {
    if (typeof ResizeObserver === 'undefined') return;
    if (!alignRowObserver) {
        alignRowObserver = new ResizeObserver(() => {
            if (alignSyncApplying) return;   // 这次尺寸变化是我们自己刚写的，不是新情况
            alignSyncFromObserver = true;
            scheduleAlignSync();
        });
    }
    alignRowObserver.disconnect();
    for (let i = 0; i < n; i++) {
        alignRowObserver.observe(srcRows[i]);
        alignRowObserver.observe(tgtRows[i]);
    }
}

// 两栏滚动联动。注意：顶栏那个 AUTO SYNC 按钮跟滚动毫无关系（它是 isAutoTranslate，
// 停止输入 1.5s 后自动触发一次翻译），所以这里必须自己把两栏绑在一起，
// 否则用户一滚动，上面辛苦对齐的行立刻又错开。
function bindPaneScrollSync() {
    try {
        const a = document.querySelector('[data-align-scroll="src"]');
        const b = document.querySelector('[data-align-scroll="tgt"]');
        if (!a || !b) return;
        // 不用「加锁 + 稍后解锁」那一套：解锁得挂在定时器或 rAF 上，
        // 后台标签页里 rAF 是暂停的，锁会永久卡住，联动直接失效。
        // 改成自终止判据：两边已经一样就什么都不做。
        // 于是 A 改 B 触发的那次回声进来时条件不成立，自然停下，不需要任何标志位。
        // 0.5px 容差是给高 DPI 下 scrollTop 的小数回读留的，防止两边互相追着差 0.001px。
        const link = (from, to) => () => {
            if (Math.abs(to.scrollTop - from.scrollTop) < 0.5) return;
            to.scrollTop = from.scrollTop;
        };
        // 每次 renderApp 都是全新节点，旧监听器随旧节点一起被丢弃，不会叠加
        a.addEventListener('scroll', link(a, b), { passive: true });
        b.addEventListener('scroll', link(b, a), { passive: true });
    } catch (e) {
        console.warn('[align] 滚动联动绑定失败：', e && e.message);
    }
}

// ============= 主渲染函数 =============
function renderApp(preserveScroll = true) {
    // 保存滚动位置。两栏是**联动**的（bindPaneScrollSync），逻辑上只有一个位置，
    // 所以这里只存一个数。分开存两个数会在源栏那侧暂时没有滚动容器的那一轮出事：
    // viewMode 切到 'edit' 时源面板是一个 textarea，选择器选不到东西，存下来的是 0，
    // 切回 'preview' 又把这个 0 写回源栏，两栏当场差出一整页（实测 800px）；
    // syncBilingualAlignment 只管行高、从不碰 scrollTop，这个落差它救不回来。
    // 谁没有滚动容器就跟着另一边走，两边都没有才归零。
    let savedScroll = 0;
    if (preserveScroll) {
        const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
        const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');
        if (sourceContainer) savedScroll = sourceContainer.scrollTop;
        else if (targetContainer) savedScroll = targetContainer.scrollTop;
    }

    const root = document.getElementById('root');
    root.innerHTML = `
        <div class="min-h-screen bg-slate-50 flex flex-col p-4 md:p-6 max-w-[1600px] mx-auto w-full">
            ${renderErrorBanner()}
            ${renderSettingsModal()}
            ${renderLocalSettingsModal()}
            ${renderSynonymPopup()}
            ${renderToast()}
            ${renderHeader()}
            ${renderMainWorkspace()}
            ${renderFooter()}
        </div>
    `;
    attachEventListeners();

    // 同义词弹窗独立渲染到 body（避免被 root 内容替换影响）
    renderSynonymPopupOnly();

    // 左右双栏逐行对齐（内部自带 try/catch，绝不会把异常带回渲染路径）。
    // ⚠️ 必须在恢复滚动位置**之前**同步跑完，不能排进 rAF/定时器等下一轮：
    // 刚 innerHTML 出来的右栏是自然高度，比左栏矮一大截（实测 2915 vs 3669），
    // 它的 scrollTop 上限也就跟着矮（1890 vs 2114）。先恢复滚动再对齐，右栏那次赋值会被
    // 浏览器夹到自己的上限，等对齐把行撑高时 scrollTop 早就丢了 —— 两栏永久差 224px，
    // 而行高对齐器不碰 scrollTop，之后谁也修不回来。先对齐则两栏高度一致，赋值不会被夹。
    syncBilingualAlignment();

    // 同步恢复滚动位置（不使用 requestAnimationFrame，避免多次渲染时的竞态条件）
    if (preserveScroll) {
        const newSourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
        const newTargetContainer = document.querySelector('section:last-of-type .overflow-y-auto');
        if (newSourceContainer) newSourceContainer.scrollTop = savedScroll;
        if (newTargetContainer) newTargetContainer.scrollTop = savedScroll;
    }

    // 渲染后调整弹窗位置
    adjustAllPopups();
}

// ============= 错误横幅 =============
function renderErrorBanner() {
    if (!AppState.error) return '';
    return `
        <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-4 max-w-lg">
            ${Icons.AlertCircle}
            <span class="text-xs font-medium">${escapeHtml(AppState.error)}</span>
            <button onclick="setState({error:null})" class="ml-2 hover:bg-rose-100 p-1 rounded-full">${Icons.XSmall}</button>
        </div>
    `;
}

// ============= Toast 提示框 =============
function renderToast() {
    if (!AppState.toast) return '';

    const bgColor = {
        'success': 'bg-emerald-50 border-emerald-200 text-emerald-700',
        'warning': 'bg-amber-50 border-amber-200 text-amber-700',
        'info': 'bg-blue-50 border-blue-200 text-blue-700'
    }[AppState.toast.type] || 'bg-slate-50 border-slate-200 text-slate-700';

    return `
        <div class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] ${bgColor} border px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 backdrop-blur-sm bg-opacity-95 transition-all duration-300" onclick="setState({toast:null})">
            <span class="text-sm font-medium">${escapeHtml(AppState.toast.message)}</span>
        </div>
    `;
}

// ============= 在线模型区块的渲染辅助 =============
// 单个 provider 的状态芯片（含独立 ⟳ 只重试这一家）
function renderModelRefreshChip(group) {
    const st = group.state || {};
    const stale = isModelCatalogStale(group.provider);
    let dotClass = 'bg-slate-300';
    let text = '使用内置列表';
    let title = '';
    if (st.status === 'loading') {
        dotClass = 'bg-violet-500 animate-pulse';
        text = '正在获取...';
    } else if (st.status === 'error') {
        const soft = (st.errCode === 'NO_KEY' || st.errCode === 'EMPTY');
        dotClass = soft ? 'bg-amber-400' : 'bg-rose-500';
        text = MODEL_ERROR_TEXT[st.errCode] || '更新失败';
        title = st.errMsg || '';
    } else if (st.status === 'ok') {
        dotClass = stale ? 'bg-amber-400' : 'bg-emerald-500';
        text = `${st.count} 个 · ${formatModelRefreshTime(st.at)}`
             + (st.source === 'cache' ? ' · 缓存' : '')
             + (stale ? ' · 已过期' : '');
        title = stale ? '距上次更新已超过 7 天，建议重新更新' : '';
    }
    return `
        <span class="inline-flex items-center gap-1.5 px-2 py-1 bg-slate-50 border border-slate-200 rounded-lg text-[10px] text-slate-500" title="${escapeAttr(title)}">
            <span class="w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}"></span>
            <span class="font-semibold text-slate-600">${group.label}</span>
            <span class="truncate max-w-[150px]">${escapeHtml(text)}</span>
            <button onclick="refreshOnlineModelsClick('${group.provider}')" ${st.status === 'loading' ? 'disabled' : ''} class="text-slate-400 hover:text-violet-600 disabled:opacity-40" title="只更新这一家">${Icons.RefreshCw}</button>
        </span>
    `;
}

// 单个在线模型的勾选行
function renderOnlineModelCheckbox(m) {
    const locked = isPinnedModel(m.provider, m);   // 正在使用的模型不允许隐藏
    const visible = locked || AppState.modelVisibility[m.id] !== false;
    const bg = visible
        ? (m.provider === 'claude' ? 'bg-orange-50' : (m.provider === 'openai' ? 'bg-sky-50' : 'bg-indigo-50'))
        : '';
    let badge = '';
    if (locked) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-amber-100 text-amber-700 font-bold shrink-0" title="${escapeAttr(m.pinned ? '正在使用，未在 API 列表中但仍可调用' : '正在使用中，不可隐藏')}">使用中</span>`;
    } else if (m.retired) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-100 text-slate-500 font-bold shrink-0" title="上次更新时 API 没有返回这个模型（可能已下线，也可能是该 Key/项目没有权限）">未在列表</span>`;
    } else if (m.group === 'other') {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-100 text-slate-500 font-bold shrink-0" title="新家族，未验证是否支持对话">?</span>`;
    } else if ((AppState.newlyFoundIds || []).indexOf(m.id) >= 0) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-violet-100 text-violet-700 font-bold shrink-0">NEW</span>`;
    }
    // 价格挪到名字下面单独一行；同一行里再放模型的原始 id（等宽小字，超长时省略号 + title 兜底），
    // 这样「用户实际调用时要认的 id」和「价格」都可见，不用再靠悬停才能读到完整模型名。
    const priceLine = `<span class="text-[9px] text-slate-400 font-mono shrink-0" title="${escapeAttr(formatPriceTitle(m.price))}">${escapeHtml(formatPriceCompact(m.price))}</span>`;
    const idLine = `<span class="text-[9px] text-slate-400 font-mono truncate min-w-0 flex-1" title="${escapeAttr(m.id)}">${escapeHtml(m.id)}</span>`;
    return `
        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-all ${bg}" title="${escapeHtml(m.id)}">
            <input type="checkbox" ${visible ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="toggleModelVisibility('${escapeHtml(m.id)}')" class="w-4 h-4 mt-0.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 shrink-0">
            <span class="flex flex-col min-w-0 flex-1 gap-0.5">
                <span class="flex items-start gap-1 min-w-0">
                    <span class="text-xs font-medium ${m.iconClass} break-words leading-snug min-w-0 flex-1">${escapeHtml(m.name)}</span>
                    ${badge}
                </span>
                <span class="flex items-center gap-1.5 min-w-0">
                    ${idLine}
                    ${priceLine}
                </span>
            </span>
        </label>
    `;
}

// ============= Settings 分页：编辑与历史（选词弹窗默认功能之外的部分）=============

// 现在在设置里也各给一份入口。**刻意用不同的 input id**（settingsXxx 前缀）：

function renderSettingsEditingExtraSections() {
    const autoSaveMin = Math.floor(AppState.autoSaveInterval / 60000);
    const promptBlock = (type, label, colorClass) => {
        const currentPrompt = AppState.customPrompts[type] || '';

        const isUsingCustom = currentPrompt.trim().length > 0;
        return `
                        <div class="mb-3">
                            <div class="flex items-center justify-between mb-1.5">
                                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wide">${escapeHtml(label)}</span>

                            </div>

                                <button onclick="saveSettingsCustomPrompt('${type}')" class="px-2.5 py-1 text-[10px] font-bold text-white bg-${colorClass}-600 hover:bg-${colorClass}-700 rounded transition-colors" data-tip="保存这段提示词（写进浏览器本地存储，刷新后仍然生效）。" data-tip-pos="top-end">保存</button>

                            </div>
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">自定义 AI 提示词</span>

                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center gap-2 mb-3" data-tip="每隔多久把当前全部译文自动存一份进「历史记录」。翻译中途误关标签页时靠它找回。" data-tip-pos="bottom-start">
                            <div class="w-6 h-6 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-lg flex items-center justify-center text-white">
                                ${Icons.Timer}
                            </div>
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">自动保存间隔</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 flex-wrap">

                                <div class="flex items-center bg-slate-100 rounded-lg p-0.5">

                                    <button onclick="setAutoSaveInterval(${min * 60 * 1000})" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all whitespace-nowrap ${AppState.autoSaveInterval === min * 60 * 1000 ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}" data-tip="每 ${min} 分钟自动存一次。" data-tip-pos="top">${min} 分钟</button>

                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- History Limit Section -->
                    <div>
                        <div class="flex items-center gap-2 mb-3" data-tip="顶栏时钟图标里那份「最近会话」最多留几条。超出的从最旧的开始丢，调小会立刻裁掉多余的。" data-tip-pos="bottom-start">

                                `).join('')}
                                <div class="w-px h-3 bg-slate-200 mx-1"></div>
                                <span data-tip="要别的条数就直接在这里改（≥1），失焦即生效。" data-tip-pos="left">
                                    <input type="number" id="settingsHistoryLimitInput" min="1" value="${AppState.historyLimit}" class="w-8 bg-transparent text-[10px] font-bold text-center outline-none text-slate-600 border-none" onchange="setHistoryLimitCustom(this.value)">

                            </div>

                    </div>`;
}

function renderSettingsModal() {
    if (!AppState.showSettings) return '';
    // 当前页签。normalize 一遍：localStorage 里的脏值/老版本残留不能让四个面板全都不显示。
    const activeTab = normalizeSettingsTab(AppState.settingsTab);

    // 在线模型全部来自 getModelCatalog()（种子 + API + 钉住当前选中项），不再有硬编码数组
    const modelQuery = (AppState.settingsModelQuery || '').trim().toLowerCase();
    const anyRefreshing = MODEL_PROVIDERS.some(p => AppState.modelRefresh[p].status === 'loading');
    const onlineGroups = MODEL_PROVIDERS.map(p => ({
        provider: p,
        label: MODEL_PROVIDER_LABEL[p],
        state: AppState.modelRefresh[p],
        models: getModelCatalog(p).filter(m => !modelQuery
            || m.id.toLowerCase().includes(modelQuery)
            || String(m.name || '').toLowerCase().includes(modelQuery))
    }));
    const totalOnline = onlineGroups.reduce((n, g) => n + g.models.length, 0);
    // modelGroupExpanded 理论上恒为 {gemini,openai,claude} 形状的对象（见 openSettings/openLocalSettings），
    // 但防御性兜底：万一它是 null/undefined/非对象，下面按 g.provider 取值会直接抛错，而 renderApp()
    // 是先把整段 innerHTML 拼完才赋值的，拼接期间抛错会让页面冻结在上一帧、之后每次点击都再抛一次，
    // 不刷新页面救不回来。所以这里兜底成 {}，配合 toggleModelGroup 里的写兜底一起生效。
    const gexp = (AppState.modelGroupExpanded && typeof AppState.modelGroupExpanded === 'object') ? AppState.modelGroupExpanded : {};

    // 拖拽中优先用「正在进行时」的宽度（避免拖拽途中被 toast/刷新等异步 setState 弹回上次已提交的值），
    // 否则用 AppState 里持久化的宽度；两者都经过夹紧，且渲染时再叠一层 CSS min(...,95vw) 防止在
    // 小窗口/加载了过大的历史 localStorage 值时把弹窗撑出视口。
    const settingsModalWidthPx = settingsModalDragWidth != null
        ? clampSettingsModalWidth(settingsModalDragWidth)
        : clampSettingsModalWidth(AppState.settingsModalWidth);

    return `
        <div class="fixed inset-0 z-[100] bg-black/20 backdrop-blur-sm flex items-center justify-center p-4">
            <div id="settingsModalPanel" class="relative bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-h-[90vh] overflow-hidden flex flex-col" style="max-width:min(${settingsModalWidthPx}px, 95vw);">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 shrink-0">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        ${Icons.SettingsGear} Settings
                    </h3>
                    <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600" data-tip="关闭设置。已点过「保存」的内容都已生效；没点保存的输入框会丢弃。" data-tip-pos="left">${Icons.X}</button>
                </div>
${renderSettingsTabBar(activeTab)}
                <!-- mr-2.5 = 拖拽手柄的 w-2.5：把整个滚动容器（连同它右内缘那条 6px 的 custom-scrollbar）
                     整体左移 10px 让开手柄，否则手柄会把滚动条整条盖住、鼠标拖不动滚动条。
                     右内边距用 pr-4 而非 p-6 的 pr-6，把让出去的 10px 视觉上补回来。 -->
                <div id="settingsScrollArea" class="pt-6 pb-6 pl-6 pr-4 mr-2.5 overflow-y-auto custom-scrollbar flex-1 min-h-0">
                    <div data-settings-panel="models" class="settings-panel${activeTab === 'models' ? ' is-active' : ''} space-y-6">
                    <!-- Online Model Visibility Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2" data-tip="控制顶栏模型下拉里出现哪些在线模型。列表本身要点右边的「更新」才会去各家 API 拉新的。" data-tip-pos="bottom-start">
                                <div class="w-6 h-6 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-white">
                                    ${Icons.Globe}
                                </div>
                                <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Online Models Visibility</span>
                            </div>
                            <button onclick="refreshOnlineModelsClick('all')" ${anyRefreshing ? 'disabled' : ''} class="flex items-center gap-1.5 px-3 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-bold text-[10px] shadow-md shadow-violet-200 active:scale-95 transition-all disabled:opacity-50 shrink-0" data-tip="向三家 API 各要一次最新模型列表（要先填好对应的 Key）。新发现的模型默认不勾选，需要自己勾上。" data-tip-pos="bottom-end">
                                ${anyRefreshing ? Icons.LoaderSmall : Icons.RefreshCw}
                                ${anyRefreshing ? '更新中...' : '更新 / Refresh'}
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mb-3">从各家 API 拉取最新模型列表，勾选哪些出现在模型选择器里。当前共 ${totalOnline} 个。</p>

                        <!-- 三家状态芯片：每家独立结算，可单独重试 -->
                        <div class="flex flex-wrap gap-1.5 mb-3">

                    <div class="p-2 space-y-1 bg-orange-50/50 border-b border-slate-100">
                        <div class="text-[10px] font-bold text-slate-400 px-2 py-1 uppercase flex items-center gap-2">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            Anthropic Claude
                        </div>
                        ${claudeModels.map(m => `
                            <button onclick="selectModel('claude','${escapeHtml(m.id)}')" title="${escapeAttr(formatPriceTitle(m.price))}" class="w-full flex items-center justify-between p-2.5 rounded-xl transition-all ${AppState.apiProvider === 'claude' && AppState.selectedModel === m.id ? 'bg-orange-50 text-orange-700 ring-1 ring-orange-200' : 'hover:bg-white hover:shadow-sm text-slate-600'}">
                                <div class="flex flex-col items-start overflow-hidden">
                                    <span class="text-xs font-bold uppercase tracking-wide truncate max-w-[190px]">${escapeHtml(m.name)}</span>
                                    <span class="text-[9px] opacity-70 truncate max-w-[190px]">${escapeHtml(m.sub || '')} · ${escapeHtml(formatPriceCompact(m.price))}</span>
                                </div>
                                <span class="${m.iconClass} shrink-0">${m.icon}</span>
                            </button>
                        `).join('') || MODEL_GROUP_EMPTY_HINT}
                    </div>
                    <div class="p-2 bg-white">
                        <div class="text-[10px] font-bold text-slate-400 px-2 py-1 uppercase flex items-center justify-between">
                            <span>Local LM Studio</span>
                            ${Icons.Server}
                        </div>
                        ${(() => {
                            const visibleLocalModels = AppState.localModels.filter(lm => AppState.modelVisibility[lm.id] !== false);
                            return visibleLocalModels.length > 0 ? `
                                <div class="max-h-40 overflow-y-auto custom-scrollbar my-1">
                                    ${visibleLocalModels.map(lm => `
                                        <button onclick="selectModel('local','${escapeHtml(lm.id)}')" class="w-full flex items-center justify-between p-2 rounded-xl transition-all mb-1 ${AppState.apiProvider === 'local' && AppState.selectedModel === lm.id ? 'bg-indigo-50 text-indigo-700 ring-1 ring-indigo-200' : 'hover:bg-slate-50 text-slate-600'}">
                                            <div class="flex flex-col items-start w-full overflow-hidden">
                                                <span class="text-xs font-bold truncate w-full text-left">${escapeHtml(lm.id)}</span>
                                            </div>
                                            ${AppState.apiProvider === 'local' && AppState.selectedModel === lm.id ? '<div class="w-1.5 h-1.5 rounded-full bg-indigo-600 ml-2 shrink-0"></div>' : ''}
                                        </button>
                                    `).join('')}
                                </div>
                            ` : AppState.localModels.length > 0 ? `
                                <div class="text-[10px] text-slate-400 italic text-center py-2 bg-slate-50 rounded-lg mb-2">All local models hidden. Check Settings.</div>
                            ` : `
                                <div class="text-[10px] text-slate-400 italic text-center py-2 bg-slate-50 rounded-lg mb-2">No models fetched yet.</div>
                            `;
                        })()}
                        <button onclick="openSettings()" class="w-full flex items-center justify-center gap-2 p-2 mt-1 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 text-xs font-bold transition-all border border-transparent hover:border-indigo-100">
                            ${Icons.SettingsGear} Settings
                        </button>
                        <p class="text-[9px] text-slate-400 leading-snug px-1 pt-2 mt-2 border-t border-slate-100">
                            价格 = 美元 / 每 1M tokens（付费层标准档），「入」= 输入价、「出」= 输出价，<b>*</b> = 限时促销价。
                        </p>
                    </div>
                </div>
            ` : ''}
        </div>
    `;
}

// ============= 控制按钮 =============
function renderControlButtons() {
    return `
        <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-full border border-slate-200 shadow-inner">
            <button onclick="toggleAutoTranslate()" class="px-4 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-2 transition-all ${AppState.isAutoTranslate ? 'bg-orange-500 text-white shadow-md' : 'text-slate-500'}" data-tip="${AppState.isAutoTranslate ? '已开：在左边输入框停手 1.5 秒就自动翻一次。粘贴长文时会自动开跑，关掉它可以改成只按 TRANSLATE 才翻。' : '已关：只有点 TRANSLATE 才翻译。打开后，停止输入 1.5 秒会自动翻一次。（跟左右两栏的滚动联动无关）'}" data-tip-pos="bottom">
                ${AppState.isAutoTranslate ? Icons.ZapFilled : Icons.Zap} AUTO SYNC
            </button>
            <button onclick="toggleAutoDetect()" class="px-4 py-1.5 rounded-full text-[10px] font-bold transition-all ${AppState.isAutoDetect ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500'}" data-tip="${AppState.isAutoDetect ? '已开：自动判断输入是中文还是英文并决定翻译方向。手动点右边的 ZH / EN 会自动关掉它。' : '已关：翻译方向锁定为右边 ZH / EN 的选择。点开可恢复自动判断语种。'}" data-tip-pos="bottom">DETECT</button>
            <div class="h-4 w-px bg-slate-300 mx-1"></div>
            <button onclick="setLanguage('zh','en')" class="px-5 py-2 rounded-full text-xs font-bold transition-all ${AppState.sourceLang === 'zh' ? 'bg-white shadow-sm text-indigo-700' : 'text-slate-500 hover:text-indigo-600'}" data-tip="源语言设为中文，译成英文（中 → 英）。点它会关掉自动判断语种。" data-tip-pos="bottom">ZH</button>
            <button onclick="swapLanguages()" class="p-2 text-slate-400 hover:bg-white rounded-full transition-colors" data-tip="对调翻译方向（中→英 ⇄ 英→中）。只换方向，不动已有的原文和译文。" data-tip-pos="bottom">${Icons.ArrowRightLeft}</button>
            <button onclick="setLanguage('en','zh')" class="px-5 py-2 rounded-full text-xs font-bold transition-all ${AppState.sourceLang === 'en' ? 'bg-white shadow-sm text-indigo-700' : 'text-slate-500 hover:text-indigo-600'}" data-tip="源语言设为英文，译成中文（英 → 中）。点它会关掉自动判断语种。" data-tip-pos="bottom-end">EN</button>
        </div>
    `;
}

// ============= 主工作区 =============
function renderMainWorkspace() {
    return `
        <main class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-grow relative overflow-hidden" style="height: calc(100vh - 220px);">
            ${renderSourcePanel()}
            ${renderTargetPanel()}
        </main>
    `;
}

// ============= 源面板 =============
function renderSourcePanel() {
    return `
        <section class="bg-white rounded-[2rem] border border-slate-200 shadow-sm flex flex-col overflow-hidden relative group">
            <!-- min-h-[70px] + shrink-0：两栏表头必须等高，否则两个滚动容器的起点就差几个像素，
                 左右行永远差一个常数。左栏的按钮组比右栏的单个图标按钮高 3px，就是那个常数的来源。 -->
            <div class="px-6 py-4 min-h-[70px] shrink-0 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] whitespace-nowrap flex items-center gap-2">
                    Source Panel
                    ${AppState.activeIndex !== null ? `<span class="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full text-[9px] flex items-center gap-1.5 animate-pulse">${Icons.PenLineSmall} Editing</span>` : ''}
                </h3>
                <div class="flex items-center gap-3">
                    ${AppState.translationPairs.length > 0 ? `
                        <button onclick="copySourceText()" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors" data-tip="把左栏所有原文按顺序拼起来复制到剪贴板（不含译文）。" data-tip-pos="bottom">
                            ${Icons.Copy}
                        </button>
                        <div class="flex items-center bg-slate-100 rounded-xl p-0.5 border border-slate-200">
                            <button onclick="setViewMode('edit')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${AppState.viewMode === 'edit' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}" data-tip="回到大输入框，整篇原文可以直接改、直接粘贴新内容。此时左栏不再逐句显示。" data-tip-pos="bottom">
                                ${Icons.PenLine} Edit
                            </button>
                            <button onclick="setViewMode('preview')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${AppState.viewMode === 'preview' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}" data-tip="左栏按句排开、与右栏译文逐行对齐，LaTeX 公式渲染成成品样子。想逐句对照校对就用这个。" data-tip-pos="bottom">
                                ${Icons.Eye} Preview
                            </button>
                            <button onclick="setViewMode('original')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${AppState.viewMode === 'original' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}" data-tip="显示最初粘贴进来的那份原始文本（未拆句、未被逐句编辑修改过），只读，用于核对。" data-tip-pos="bottom-end">
                                ${Icons.History} Original
                            </button>
                        </div>
                    ` : ''}
                    <button onclick="handleClear()" class="text-slate-400 hover:text-rose-500 p-2 transition-colors" data-tip="清空输入框和左右两栏的全部内容，重新开始。已保存过的历史快照不受影响。" data-tip-pos="left">${Icons.Trash2}</button>
                </div>
            </div>
            <div class="flex-grow flex flex-col overflow-hidden bg-slate-50/20">
                ${AppState.translationPairs.length > 0 && AppState.viewMode === 'preview' ? `
                    <div class="overflow-y-auto h-full custom-scrollbar p-4" data-align-scroll="src" onclick="handleBlankAreaClick(event)">
                        <!-- 行距不再来自 space-y-2：改由 :root 上的 --pair-gap 统一驱动
                             （[data-align-content] > * + * { margin-top: var(--pair-gap) }），
                             左右两栏共用同一个变量，物理上不可能只改一边而破坏逐行对齐。 -->
                        <div class="pb-24" data-align-content="src">
                            ${AppState.translationPairs.map((pair, idx) => renderPairRow('src', pair, idx)).join('')}
                        </div>
                    </div>
                ` : AppState.translationPairs.length > 0 && AppState.viewMode === 'original' ? `
                    <div class="w-full h-full p-10 overflow-y-auto custom-scrollbar">
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                            ${Icons.History} 原始输入内容 (用于重新生成翻译)
                        </div>
                        <pre class="text-base text-slate-700 whitespace-pre-wrap font-medium leading-relaxed">${escapeHtml(AppState.originalInputText || AppState.inputText)}</pre>
                    </div>
                ` : `
                    <textarea id="mainInput" class="w-full h-full p-10 text-xl border-none focus:ring-0 placeholder-slate-300 resize-none leading-relaxed custom-scrollbar bg-transparent focus:outline-none font-medium text-slate-700 selection:bg-indigo-100" placeholder="Paste or type academic text here...">${escapeHtml(AppState.inputText)}</textarea>
                `}
            </div>
        </section>
    `;
}

// ============= 目标面板 =============
function renderTargetPanel() {
    return `
        <section class="bg-white rounded-[2rem] border border-slate-200 shadow-sm flex flex-col overflow-hidden relative group">
            <!-- 高度必须和 SOURCE PANEL 表头逐像素一致，见那边的注释 -->
            <div class="px-6 py-4 min-h-[70px] shrink-0 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] whitespace-nowrap">Target Panel</h3>
                <button onclick="copyTargetText()" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors" data-tip="把右栏所有译文按顺序拼起来复制到剪贴板（不含原文）。" data-tip-pos="bottom-end">${Icons.Copy}</button>
            </div>
            <div class="flex-grow p-4 overflow-y-auto custom-scrollbar bg-slate-50/20" data-align-scroll="tgt" onclick="handleBlankAreaClick(event)">
                ${AppState.isLoading && AppState.translationPairs.length === 0 ? `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 animate-pulse">
                        <span class="text-indigo-300 mb-6">${Icons.LoaderLarge}</span>
                        <p class="font-black text-lg tracking-widest uppercase">Initializing Translation...</p>
                    </div>
                ` : AppState.translationPairs.length === 0 ? `
                    <div class="h-full flex flex-col items-center justify-center text-slate-300/40">
                        <div class="p-8 bg-slate-100 rounded-full mb-6">${Icons.ZapBig}</div>
                        <p class="text-xl font-black uppercase tracking-widest">Awaiting Input</p>
                    </div>
                ` : `
                    <!-- 行距同源栏：--pair-gap，见 renderSourcePanel 里的注释 -->
                    <div class="pb-24" data-align-content="tgt" onclick="handleBlankAreaClick(event)">
                        ${AppState.translationPairs.map((pair, idx) => renderPairRow('tgt', pair, idx)).join('')}
                    </div>
                `}
            </div>
            ${renderAiInsightDrawer()}
        </section>
    `;
}

// ============= AI Insight抽屉 =============
function renderAiInsightDrawer() {
    if (!AppState.aiInsight) return '';
    return `
        <div class="absolute inset-y-0 right-0 w-full md:w-[450px] bg-white border-l border-slate-200 shadow-2xl z-50 flex flex-col">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-indigo-50/30">
                <div class="flex items-center gap-3 text-indigo-800 font-black text-sm uppercase tracking-widest">
                    <span class="text-amber-500">${Icons.Lightbulb}</span>
                    ${escapeHtml(AppState.aiInsight.title)}
                </div>
                <button onclick="setState({aiInsight:null})" class="p-2 text-slate-400 hover:text-slate-900 transition-colors">${Icons.X}</button>
            </div>
            <div class="flex-grow p-8 overflow-y-auto custom-scrollbar bg-white">
                ${AppState.isInsightLoading ? `
                    <div class="flex flex-col items-center justify-center mt-20 gap-4">
                        <span class="text-indigo-500">${Icons.LoaderMedium}</span>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Analysing semantic structure...</p>
                    </div>
                ` : `
                    <div class="prose prose-indigo prose-sm max-w-none text-slate-600 leading-relaxed">${renderFormattedText(AppState.aiInsight.content)}</div>
                `}
            </div>
        </div>
    `;
}

// ============= 翻译对行渲染 =============
function renderPairRow(side, pair, idx) {
    const isEditing = AppState.activeIndex === idx;
    const textValue = side === 'src' ? pair.src : pair.tgt;
    const editValue = side === 'src' ? AppState.editValues.src : AppState.editValues.tgt;

    if (isEditing) {
        return `
            <div class="group relative p-4 rounded-xl transition-all border cursor-pointer bg-white border-indigo-300 shadow-xl ring-4 ring-indigo-50 z-20 scale-[1.01]" data-idx="${idx}" data-side="${side}">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-30">
                    ${renderHistoryControls(pair, idx)}
                </div>
                <div class="relative flex flex-col gap-3">
                    <div class="absolute -top-10 right-0 z-40 flex items-center gap-2">
                        <button onclick="event.stopPropagation();triggerSaveRowUpdate(${idx});" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-white text-xs font-bold shadow-lg transition-all ${pair.isUpdating ? 'bg-rose-500 hover:bg-rose-600' : 'bg-indigo-600 hover:bg-indigo-700'}" data-tip="${pair.isUpdating ? '正在更新这一句，点一下停下来。' : '保存你刚才手改的内容，并让模型把另一侧那句同步改过来（改原文→重译，改译文→回译校对）。'}" data-tip-pos="left">
                            ${pair.isUpdating ? `<span class="animate-pulse">${Icons.StopCircle}</span> Stop` : `${Icons.PenLineSmall} Update`}
                        </button>
                        <button onclick="event.stopPropagation();handleRegenerateTranslation(${idx});" class="flex items-center justify-center p-1.5 rounded-lg text-white shadow-lg transition-all ${pair.isRegenerating ? 'bg-rose-500 hover:bg-rose-600' : 'bg-indigo-600 hover:bg-indigo-700'}" data-tip="${pair.isRegenerating ? '正在重新翻译这一句，点一下停下来。' : '只把这一句重新翻一遍（原文不动）。对这句译文不满意时用它，不影响其它句子。'}" data-tip-pos="left">
                            ${pair.isRegenerating ? `<span class="animate-pulse">${Icons.StopCircle}</span>` : Icons.RefreshCw}
                        </button>
                    </div>
                    <div class="relative">
                        ${renderSelectionHighlightLayer(side, idx)}
                        <textarea id="editTextarea_${side}_${idx}" class="relative block w-full bg-transparent border-none focus:ring-0 p-0 text-slate-800 leading-relaxed resize-none overflow-hidden min-h-[40px]" placeholder="Edit ${side === 'src' ? 'source' : 'target'}..." onclick="event.stopPropagation();">${escapeHtml(editValue)}</textarea>
                    </div>
                    ${renderAiToolbar(side, idx)}
                </div>
            </div>
        `;
    } else {
        return `
            <div class="group relative p-4 rounded-xl transition-all border cursor-pointer border-transparent hover:bg-white/80 hover:shadow-md" onclick="handleRowClick(${idx},'${side}')" data-idx="${idx}" data-side="${side}">
                <div class="prose prose-slate prose-sm max-w-none text-slate-700 leading-relaxed transition-all ${pair.isUpdating ? 'opacity-30 blur-[2px]' : ''}">${renderFormattedText(textValue)}</div>
            </div>
        `;
    }
}

// ============= 历史控制按钮 =============
function renderHistoryControls(pair, idx) {
    return `
        <div class="flex gap-1 bg-white shadow-sm border border-slate-200 rounded-full p-0.5 z-20 transition-all">
            <button onclick="event.stopPropagation();handleHistoryNav(${idx},-1);" ${pair.historyIndex <= 0 ? 'disabled' : ''} class="p-1 hover:bg-slate-100 rounded-full disabled:opacity-30 text-slate-600 transition-colors" data-tip="撤销：回到这一句的上一个版本（中间的数字就是第几版 / 共几版）。只影响这一句。" data-tip-pos="left">
                ${Icons.Undo2}
            </button>
            <span class="text-[9px] px-1 text-slate-400 font-mono flex items-center select-none">
                ${pair.historyIndex + 1}/${pair.history.length}
            </span>
            <button onclick="event.stopPropagation();handleHistoryNav(${idx},1);" ${pair.historyIndex >= pair.history.length - 1 ? 'disabled' : ''} class="p-1 hover:bg-slate-100 rounded-full disabled:opacity-30 text-slate-600 transition-colors" data-tip="重做：回到这一句更新的那个版本。只影响这一句。" data-tip-pos="right">
                ${Icons.Redo2}
            </button>
        </div>
    `;
}

// ============= AI工具栏 =============
function renderAiToolbar(side, idx) {
    const isGrammarSettingsOpen = AppState.activeSettingsPopup === 'grammar' && AppState.activeSettingsIndex === idx && AppState.activeSettingsSide === side;
    const isSimplifySettingsOpen = AppState.activeSettingsPopup === 'simplify' && AppState.activeSettingsIndex === idx && AppState.activeSettingsSide === side;

    return `
        <div class="mt-2 pt-2 border-t border-indigo-50 flex flex-wrap items-center gap-2 relative" onclick="event.stopPropagation();">
            <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider mr-1 flex items-center gap-1 select-none">
                ${Icons.SparklesSmall} ${side === 'src' ? 'Source AI' : 'Target AI'}
            </div>

            <!-- Grammar Button Group -->
            <div class="flex items-stretch rounded-lg bg-indigo-50 border border-indigo-100 relative">
                <button onclick="handleAiRefine(${idx},'${side}','grammar')" ${AppState.isRefining ? 'disabled' : ''} class="flex items-center gap-1.5 px-2 py-1 hover:bg-indigo-100 text-indigo-700 rounded-l-lg text-xs transition-colors disabled:opacity-50" data-tip="让模型检查并订正这一整句的语法，直接改写进上面的编辑框。用的提示词可在右边 ⋮ 或「设置 → 编辑与历史」里改。" data-tip-pos="bottom-start">
                    ${Icons.CheckCheck} Grammar
                </button>
                <div class="w-px bg-indigo-200 my-1"></div>
                <button onclick="toggleSettingsPopup('grammar',${idx},'${side}')" class="px-1 hover:bg-indigo-200 text-indigo-400 hover:text-indigo-700 rounded-r-lg transition-colors" data-tip="自定义 Grammar 按钮发给模型的指令（例如「只改语法，别动术语和 LaTeX」）。留空则用内置提示词。" data-tip-pos="bottom">
                    ${Icons.MoreVertical}
                </button>
                ${isGrammarSettingsOpen ? renderSettingsPopover('grammar') : ''}
            </div>

            <!-- Simplify Button Group -->
            <div class="flex items-stretch rounded-lg bg-emerald-50 border border-emerald-100 relative">
                <button onclick="handleAiRefine(${idx},'${side}','simplify')" ${AppState.isRefining ? 'disabled' : ''} class="flex items-center gap-1.5 px-2 py-1 hover:bg-emerald-100 text-emerald-700 rounded-l-lg text-xs transition-colors disabled:opacity-50" data-tip="把这一整句改写得更直白简短，意思和 LaTeX 公式保持不变。句子太绕、太长时用它。" data-tip-pos="bottom-start">
                    ${Icons.Feather} Simplify
                </button>
                <div class="w-px bg-emerald-200 my-1"></div>
                <button onclick="toggleSettingsPopup('simplify',${idx},'${side}')" class="px-1 hover:bg-emerald-200 text-emerald-400 hover:text-emerald-700 rounded-r-lg transition-colors" data-tip="自定义 Simplify 按钮发给模型的指令。留空则用内置提示词。" data-tip-pos="bottom">
                    ${Icons.MoreVertical}
                </button>
                ${isSimplifySettingsOpen ? renderSettingsPopover('simplify') : ''}
            </div>

            <!-- Custom Rewrite Input -->

// ============= 事件绑定 =============
function attachEventListeners() {
    // 主输入框
    const mainInput = document.getElementById('mainInput');
    if (mainInput) {
        mainInput.addEventListener('input', (e) => handleInputChange(e.target.value));
    }

    // 编辑文本框
    AppState.translationPairs.forEach((pair, idx) => {
        ['src', 'tgt'].forEach(side => {
            const textarea = document.getElementById(`editTextarea_${side}_${idx}`);
            if (textarea) {
                textarea.addEventListener('input', (e) => {
                    // 只更新状态值，不触发重新渲染
                    AppState.editValues[side] = e.target.value;
                    
                    // 关闭同义词弹窗但不重新渲染整个页面
                    // （走 updateSynonymState 而不是手动 remove：它会顺带把选中高亮层一起清掉，
                    //   否则用户一边打字、一边还留着一段位置早就对不上的 <mark>）
                    if (AppState.synonymState.show) {
                        updateSynonymState({ show: false });
                    }

                    autoResizeTextarea(textarea);
                });
                textarea.addEventListener('mouseup', (e) => handleTextSelect(e, side, idx));
                autoResizeTextarea(textarea);
            }

            const refineInput = document.getElementById(`refineInput_${side}_${idx}`);
            if (refineInput) {
                refineInput.addEventListener('input', (e) => {
                    // 只更新状态，不触发渲染
                    AppState.refinePrompt = e.target.value;
                });
                refineInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        triggerCustomRefine(idx, side);
                    }
                });
            }
        });
    });

    // 全局点击（关闭菜单）
    document.removeEventListener('mousedown', globalClickHandler);
    document.addEventListener('mousedown', globalClickHandler);

    // 两栏滚动联动（节点每轮全新，这里跟着重绑）
    bindPaneScrollSync();
}

function globalClickHandler(event) {
    const target = event.target;
    
    // 关闭同义词弹窗
    const synonymPopup = document.getElementById('synonymPopup');
    if (synonymPopup && !synonymPopup.contains(target)) {
        updateSynonymState({ show: false });
    }
    
    // 关闭设置弹窗（如果点击在弹窗外部）
    if (AppState.activeSettingsPopup !== null) {
        const popover = target.closest('.absolute.top-full');
        const settingsButton = target.closest('[onclick*="toggleSettingsPopup"]');
        if (!popover && !settingsButton) {
            closeSettingsPopup();
        }
    }
    
    // 关闭各种菜单
    if (AppState.showModelMenu && !target.closest('[onclick*="toggleModelMenu"]') && !target.closest('.absolute')) {
        AppState.showModelMenu = false;
        renderApp();
    }
    if (AppState.showHistoryMenu && !target.closest('[onclick*="toggleHistoryMenu"]') && !target.closest('.absolute')) {
        AppState.showHistoryMenu = false;
        renderApp();
    }
    if (AppState.showSaveMenu && !target.closest('[onclick*="toggleSaveMenu"]') && !target.closest('.absolute')) {
        AppState.showSaveMenu = false;
        renderApp();
    }
}

function autoResizeTextarea(textarea) {
    if (!textarea) return;
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
    // 编辑框长高 = 这一行长高 = 左右两栏当场错位。这是行高变化最高频的来源，
    // 直接在这里补一刀，不指望 ResizeObserver（它和 rAF 一样绑在渲染步骤上，
    // 后台标签页里根本不回调）。scheduleAlignSync 自带合并，连打字也只会每轮跑一次。
    scheduleAlignSync();
}

// ============= Settings 页签切换 =============
// ⚠️ 刻意**不走 setState/renderApp**。两个理由，缺一不可：
//   1) 保住输入到一半的 API Key。renderApp 会用 AppState 里的旧值重建 <input value="...">，
//      而 Key 只有点了 Save 才进 AppState —— 一旦重渲染，没保存的那串就没了。
//      四页内容全都在 DOM 里、切页只切 class，输入框节点根本没被碰过，自然不会丢。
//   2) 渲染路径（root.innerHTML）外面没有 try/catch，抛一次就永久冻页。切页这条路上
//      一行渲染代码都不跑，风险归零；整段还是包了 try/catch，最坏情况只是页签没切动。
// AppState.settingsTab + localStorage 只负责「下一次整体重渲染 / 重开弹窗时落在哪一页」。
function setSettingsTab(tab) {
    const t = normalizeSettingsTab(tab);
    AppState.settingsTab = t;
    try {
        localStorage.setItem('settingsTab', t);
    } catch (e) {}
    try {
        const panels = document.querySelectorAll('[data-settings-panel]');
        for (let i = 0; i < panels.length; i++) {
            panels[i].classList.toggle('is-active', panels[i].getAttribute('data-settings-panel') === t);
        }
        const tabs = document.querySelectorAll('[data-settings-tab]');
        for (let i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('is-active', tabs[i].getAttribute('data-settings-tab') === t);
        }
        // 换页后回到顶部：不然从「模型」那页滚到底再切过去，新页面会停在一片空白处
        const scroller = document.getElementById('settingsScrollArea');
        if (scroller) scroller.scrollTop = 0;
    } catch (e) {
        console.warn('[settings] 切换页签失败：', e && e.message);
    }
}

// ============= 句对行距（TASK 3）=============
// 拖动中：只写一次 CSS 变量 + 更新那个数字标签，然后叫一次对齐同步。
// 不 setState、不 renderApp —— 拖拽期间每帧重建整页 DOM 会又卡又丢焦点。
// scheduleAlignSync 自带「本轮已排队就合并」，一次拖拽最多每帧跑一遍对齐，
// 而且它内部是「先清空补白 → 一次性读完 → 一次性写回」的批处理，不会 layout thrash；
// ResizeObserver 那边看到的是我们自己写的尺寸变化，alignSyncApplying 会把它挡掉，不会互相打架。
//
// ⚠️ 这里**不能**直接叫 scheduleAlignSync()，必须走 alignSyncKeepingScroll()。
// syncBilingualAlignment 的「写 1」阶段会先把每一行的 minHeight 清空再量高度，
// 那一瞬间目标栏塌回自然高度（中文比英文短一大截），浏览器当场把它的 scrollTop
// 夹到新的上限；「写 2」把行高补回去，但夹掉的滚动位置**再也没人恢复**，
// 随后 bindPaneScrollSync 还会把这个被夹过的值同步回源栏。
// 实测：滚到底（scrollTop 2851）时动一格滑块，两栏一起跳回 1621 —— 用户正在校对的
// 那句话被甩出去 1230px。文档后 44%（scrollTop > 目标栏自然高度上限 1598）全中招。
// renderApp 早就防过同一件事（见它里面「先对齐则两栏高度一致，赋值不会被夹」那段注释），
// 这两个新 handler 当初漏抄了这道保险。
function handleRowGapInput(value) {
    const gap = clampRowGap(value);
    AppState.rowGap = gap;
    applyRowGapToDom(gap);
    try {
        const label = document.getElementById('rowGapValue');
        if (label) label.textContent = gap + 'px';
    } catch (e) {}
    alignSyncKeepingScroll();   // 行距变了 = 行几何变了，必须重跑对齐，否则左右两栏当场散架
}

// 松开鼠标（change）才落盘。拖拽途中每帧写 localStorage 没必要。
function commitRowGap(value) {
    const gap = clampRowGap(value);
    AppState.rowGap = gap;
    applyRowGapToDom(gap);
    try {
        localStorage.setItem('rowGap', String(gap));
    } catch (e) {}
    alignSyncKeepingScroll();
}

function resetRowGap() {
    AppState.rowGap = ROW_GAP_DEFAULT;
    applyRowGapToDom(ROW_GAP_DEFAULT);
    try {
        localStorage.setItem('rowGap', String(ROW_GAP_DEFAULT));
    } catch (e) {}
    try {
        const slider = document.getElementById('rowGapSlider');
        if (slider) slider.value = String(ROW_GAP_DEFAULT);
        const label = document.getElementById('rowGapValue');
        if (label) label.textContent = ROW_GAP_DEFAULT + 'px';
    } catch (e) {}
    alignSyncKeepingScroll();
}

// 刻意**不**走 renderApp：这个勾选框长在设置弹窗里，全量重渲染会把弹窗整块重建，

function setModelVisibilityBulk(provider, value) {

        if (!value && isPinnedModel(provider, m)) return;
        AppState.modelVisibility[m.id] = !!value;
    });
    try {
        localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
    } catch (e) {}
    renderApp();
}

function showAllNewlyFoundModels() {
    (AppState.newlyFoundIds || []).forEach(function (id) {
        AppState.modelVisibility[id] = true;
    });
    try {
        localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
    } catch (e) {}
    renderApp();
}

// 一键隐藏「API 已不再返回」的模型。只取消勾选、不删数据，随时可以再勾回来。
function hideRetiredModels() {
    let n = 0;
    MODEL_PROVIDERS.forEach(function (p) {
        getModelCatalog(p).forEach(function (m) {
            if (m.retired && !isPinnedModel(p, m) && AppState.modelVisibility[m.id] !== false) {
                AppState.modelVisibility[m.id] = false;
                n++;
            }
        });
    });
    try {
        localStorage.setItem('modelVisibility', JSON.stringify(AppState.modelVisibility));
    } catch (e) {}
    showToast(n > 0 ? `已隐藏 ${n} 个未在 API 列表中的模型` : '没有需要隐藏的模型', n > 0 ? 'success' : 'info');
}

function setSettingsModelQuery(value) {
    AppState.settingsModelQuery = String(value || '');
    renderApp();
    // renderApp 走 root.innerHTML 全量重建会丢焦点，手动还原光标
