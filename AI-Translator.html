        if (cur.length > 0 && (chars + len > limits.chars || cur.length >= limits.segs || ph + cnt > limits.ph)) {
            batches.push(cur); cur = []; chars = 0; ph = 0;
        }
        cur.push(i); chars += len; ph += cnt;
    }
    if (cur.length > 0) batches.push(cur);
    return batches;
}

// outMeta（可选，末位）：调用方想看 finish_reason / thinking / 推理 token 数时传一个空对象进来。
// 不传的调用方逐字不受影响 —— 这是为了让恢复阶梯能判断「这次失败是不是推理导致的」，
// 而不必再开第二套「上一次响应」的全局状态（见 spec §6.5）。
async function xportRequest(items, srcName, tgtName, config, signal, outMeta) {
    const user = items.map((it, i) => '@@' + (i + 1) + '@@\n' + it.text).join('\n\n');
    const sys = xportSystemPrompt(srcName, tgtName, config.provider);
    // 出参：finish_reason === 'length' / 'MAX_TOKENS' 时 meta.truncated = true
    const meta = (outMeta && typeof outMeta === 'object') ? outMeta : {};
    let raw;
    if (config.provider === 'local') {
        raw = await callLocalLLM(config.localBaseUrl, config.model,
            [{ role: 'system', content: sys }, { role: 'user', content: user }], false, signal, meta);
    } else {
        raw = await callGeminiAPI(config.model, user,
            { systemInstruction: sys, temperature: 0.3 }, config.geminiApiKey, signal, meta);
    }
    return xportParseBlocks(raw, items.length, meta.truncated === true);
}

// 阶梯最后一级：退回**现行 JSON 协议**翻这一段。结果最差也就等于今天的已知行为，
// 不可能更糟；而只要哨兵协议成功，这一级根本不会被触发。
async function xportLegacyOne(seg, srcName, tgtName, config, signal) {
    const systemPrompt = `You are a professional academic translator.
1. Split input into logical sentences/segments.
2. Translate ${srcName} to ${tgtName}.
3. Keep LaTeX math/citations intact.
4. You MUST return ONLY valid JSON: {"translations": [{"src": "Original 1", "tgt": "Translated 1"}]}
5. Do NOT include any text before or after the JSON.`;
    let data;
    if (config.provider === 'local') {
        // 阶梯的最后一级正是「模型已经在乱来」的时候才会跑到 —— A4 的分类必须落在这里，
        // 否则最后一根横杆保留着原来那条什么都不说的报错（见 spec §6.3）。
        const meta = {};
        const r = await callLocalLLM(config.localBaseUrl, config.model,
            [{ role: 'system', content: systemPrompt }, { role: 'user', content: seg }], false, signal, meta);
        data = parseLocalJson(r, meta);
    } else {
        const r = await callGeminiAPI(config.model, seg, {
            systemInstruction: systemPrompt,
            responseMimeType: 'application/json',
            responseSchema: {
                type: "OBJECT",
                properties: {
                    translations: {
                        type: "ARRAY",
                        items: { type: "OBJECT", properties: { src: { type: "STRING" }, tgt: { type: "STRING" } }, required: ["src", "tgt"] }
                    }
                },
                required: ["translations"]
            }
        }, config.geminiApiKey, signal);
        data = JSON.parse(r || '{}');
    }
    const arr = (data && Array.isArray(data.translations)) ? data.translations : [];
    const parts = [];
    for (let i = 0; i < arr.length; i++) {
        const t = arr[i] && arr[i].tgt;
        if (typeof t === 'string' && t.trim()) parts.push(t.trim());
    }
    return parts.length ? parts.join(' ') : null;
}

// ============= 阶梯第 3 级（旧 JSON 协议）交付前的完整性检查 =============
// 【改动前】级 1、级 2 都用 xportBlockOk 逐个点名占位符才敢交付；级 3 把 xportLegacyOne
// 的字符串**原样 return**，一次检查都没有，failedCount 不加、没有失败标记、没有 toast。
// 哨兵传输的全部承诺就是「交付出去的每一行都过了六类损坏检查」——级 3 是这个承诺上的洞。
//
// 【实测（本轮离线复现）】把一段带 \cite{} 和 $\alpha_i$ 的正文逼到级 3，让旧协议交回
// 一份**丢掉了整个 \cite{smith2020}、还带着裸 TAB** 的译文：
//     via={"legacy":1,"batch":1}  failedCount=0  markedFailed=false
// 同一份内容如果走批次路，xportBlockOk 第一眼就判失败。语料轮里也抓到过真的：
// 级 3 交回的公式被重排成一行、`(T)` 后面多出个 `\=`（数学模式里是重音符，**编译不过**），
// 而 xportEquationAudit 只数 \begin{env}，两边都有，lost=0，一声不吭。
//
// 【为什么不能直接调 xportBlockOk】级 3 发出去的是**没有遮罩**的原文，收回来的自然也
// 没有 [[k]]，xportBlockOk 会把每一行都判失败。等价的检查是：把 mm.map 里那些原文片段
// 直接拿到译文里逐个点名 —— 哨兵路的 xportUnmask 是把 map[k] 原样 splice 回去的，
// 所以「原样出现且只出现一次」正是那条路已经在保证的东西，一个字都没有更严。
//
// 【长的先抠】`$\alpha$` 和 `\alpha` 同时在 map 里时，先抠短的会让长的那处被重复计数。
// 按长度降序、抠掉的位置填一个 NUL 占位（NUL 不可能与任何片段拼出新的匹配），
// 抠完再扫一遍：还剩下同样的片段 = 模型把它复制了一份，与 xportBlockOk 的 seen!==1 同义。
//
// 【rawSeg 是可选的】给了就多做一条检查：交回来的裸 `%` 不能比原文里的多。级 3 发出去的是
// **没有遮罩**的原文，所以它自己可能带着真注释，不能像 xportBlockOk 那样要求恒为 0；
// 但「多出来一个」只能是模型把 `\%` 的反斜杠吃掉了，那一行在 PDF 里会从那里起整段消失。
function xportLegacyOk(body, map, rawSeg) {
    if (typeof body !== 'string') return false;
    const t = body.trim();
    if (t === '') return false;
    if (/@@\s*\d+\s*@@/.test(t)) return false;                  // 哨兵漏进正文 = 段落串了
    if (/[\x00-\x09\x0B-\x1F\x7F]/.test(t)) return false;       // 裸控制字符 = 反斜杠命令被吃掉
    if (/\[\[\s*\d+\s*\]\]/.test(t)) return false;              // 旧协议根本没发过占位符，出现即是幻觉
    if (!xportSoloOk(t)) return false;                          // 拒绝语 / 闲聊同样不能当译文入库
    if (typeof rawSeg === 'string' && xportBareComments(t) > xportBareComments(rawSeg)) return false;
    const lits = [];
    const arr = Array.isArray(map) ? map : [];
    for (let i = 0; i < arr.length; i++) {
        const s = String(arr[i] == null ? '' : arr[i]);
        if (s !== '') lits.push(s);
    }
    lits.sort(function (a, b) { return b.length - a.length; });
    let rest = t;
    for (let i = 0; i < lits.length; i++) {
        const at = rest.indexOf(lits[i]);
        if (at === -1) return false;                            // 丢了一段受保护内容
        rest = rest.slice(0, at) + '\u0000' + rest.slice(at + lits[i].length);
    }
    for (let i = 0; i < lits.length; i++) if (rest.indexOf(lits[i]) !== -1) return false;   // 复制了一份
    return true;
}

// 单段恢复阶梯。每一级都**改变了请求内容**——实测占位符丢失是确定性的，
// 重发同样的请求 6/6 次丢同样的 token，所以「原样重试」被刻意排除在外。
async function xportRecoverSegment(mm, rawSeg, wasBatched, srcName, tgtName, config, signal, spend) {
    // 级 1：从批次里单独拎出来重发（只有原来确实同批时才算「变了」）
    if (wasBatched && spend()) {
        try {
            const blocks = await xportRequest([mm], srcName, tgtName, config, signal);
            const body = blocks[1];
            if (body != null && xportBlockOk(body, mm.map)) return { tgt: xportUnmask(body, mm.map), via: 'isolate' };
        } catch (err) { if (err && err.name === 'AbortError') throw err; }
    }
    // 级 2：把这一段再切开，降低单次请求的占位符密度、换掉边界
    const parts = xportSplitSegment(rawSeg);
    if (parts.length > 1 && spend()) {
        try {
            const pm = parts.map(xportMask);
            const blocks = await xportRequest(pm, srcName, tgtName, config, signal);
            const pieces = [];
            let ok = true;
            for (let i = 0; i < pm.length; i++) {
                const body = blocks[i + 1];
                if (body != null && xportBlockOk(body, pm[i].map)) pieces.push(xportUnmask(body, pm[i].map));
                else { ok = false; break; }
            }
            // 【为什么是 '\n' 而不是 ' '】用空格拼，一块**结尾停在 LaTeX 注释里**的碎片会
            // 把下一块整个拉到同一行上 —— 那一行从 `%` 起全被注释掉，编译不报错，
            // PDF 里整段正文消失，而 failedCount 仍是 0。实测 main.tex 的第 632 段
            // （`%Both players observe…` 后面跟一条 \STATE）走到这一级时，交付出来的行
            // LaTeX 排出来是空的 —— 整句被删，一声不吭。
            // 换成换行之后 `%` 只吃到它自己那个换行为止，下一块安然无恙；而 xportSplitSegment
            // 本来就是**按句/按行**切的，用换行拼回去比用空格更接近原文的排版。
            if (ok) return { tgt: pieces.join('\n'), via: 'split' };
        } catch (err) { if (err && err.name === 'AbortError') throw err; }
    }
    // 级 3：退回旧协议。**和前两级同一把尺子**：过不了 xportLegacyOk 就当这一级也失败，
    // 这一段回到调用方后是可见的失败标记 + failedCount + toast —— 交付一份查不过的内容
    // 并把它算成成功，正是这次要堵的那个洞。
    if (spend()) {
        try {
            const legacy = await xportLegacyOne(rawSeg, srcName, tgtName, config, signal);
            if (legacy && xportLegacyOk(legacy, mm.map, rawSeg)) return { tgt: legacy, via: 'legacy' };
        } catch (err) { if (err && err.name === 'AbortError') throw err; }
    }
    return null;
}

// 哨兵协议只对**本次实测过**的两条链路生效：本地 LM Studio 与 Gemini。
// OpenAI / Claude 保持今天一模一样的行为 —— 上一版正是因为「代码写了但没测」被否，
// 这里不重复那个错误。开关关掉则全部回到现行协议。
function xportActive(config) {
    try {
        if (!AppState.sentinelTransport) return false;
        return config.provider === 'local' || config.provider === 'gemini';
    } catch (e) { return false; }
}

// 掩码之后，这一段还剩下**可翻译的字**吗？把 [[k]] 抠掉还是空 = 整段是注释、或者整段
// 就是一条公式，一个字都没得翻。这种段不该发出去：发出去只会让模型对着一个孤零零的
// 占位符编话（xportParseBlocks 的单段路对前导废话没有任何守卫），而它本来就该原样交付。
// main.tex 里光是「整段都是 % 注释」的段落就有 200 个。
function xportNothingToTranslate(maskedText) {
    return String(maskedText == null ? '' : maskedText).replace(/\[\[\s*\d+\s*\]\]/g, '').trim() === '';
}

// ============= 每一行「剥离颜色宏之前」的那份原文 =============
// 【它救的是什么】pair.src 是 stripTextColorForModel **之后**的文本 —— 用户论文里那
// 566 处 `\textcolor{...}{...}`（他用来标记修订）在里面一个都不剩。只要有任何一条路
// 拿 pairs 重建整篇（切进 Edit 视图、复制原文、从归档恢复、整篇重新生成），
// 那 566 处标记就被从文档里**删掉**，而且会随着下一次翻译 / 落盘变成永久的。
//
// 【为什么可以逐行对上】stripTextColorForModel 只**删字符**，从不插入、不重排，
// 所以剥离后的文本是原文的一个子序列；一次两指针扫描就能给每个剥离后字符找回它在
// 原文里的下标。而 xportSegmentsEx 交出的每一段都是剥离后文本的一段连续子串（按顺序），
// 用一个游标 indexOf 就能定位。两者一合，每一行都能切回原文里对应的那一片。
//
// 【切片边界】第 i 行取 [上一行最后一个字符之后, 本行最后一个字符] —— 被删掉的宏头
// （`\textcolor{blue}{`）和宏尾（`}`）不管落在行内还是行与行之间的空白里，都会被
// 某一行收进去，逐行拼起来正好还原整篇。最后一行一直取到文末。
//
// 【对不上就当没有这回事】任何一步不成立（不是子序列、某一段找不到、legacy 那条路
// 的 src 是模型自己编的）都直接 return，pairs 里就没有 srcRaw，行为与改动前逐字一致。
// 原文里根本没有 \textcolor 时更是第一行就返回 —— 常见情形零开销、零行为变化。
function xportAttachRawSrc(translations, pristine, stripped) {
    try {
        if (!Array.isArray(translations) || translations.length === 0) return;
        if (typeof pristine !== 'string' || typeof stripped !== 'string') return;
        if (pristine === stripped) return;          // 没有颜色宏：src 本身就是原样
        const idx = new Array(stripped.length);     // 剥离后下标 -> 原文下标
        let p = 0;
        for (let s = 0; s < stripped.length; s++) {
            const c = stripped[s];
            while (p < pristine.length && pristine[p] !== c) p++;
            if (p >= pristine.length) return;       // 不是子序列：放弃，不猜
            idx[s] = p++;
        }
        const ends = [];
        let cur = 0;
        for (let i = 0; i < translations.length; i++) {
            const seg = translations[i] && translations[i].src;
            if (typeof seg !== 'string' || seg === '') return;
            const at = stripped.indexOf(seg, cur);
            if (at === -1) return;                  // 这一行不是剥离后文本的子串：放弃
            ends.push(at + seg.length);
            cur = at + seg.length;
        }
        for (let i = 0; i < translations.length; i++) {
            const from = (i === 0) ? 0 : idx[ends[i - 1] - 1] + 1;
            const to = (i === translations.length - 1) ? pristine.length : idx[ends[i] - 1] + 1;
            translations[i].srcRaw = pristine.slice(from, to);
        }
    } catch (e) { /* 对不上就当没有这份信息 */ }
}

// 返回值与 translateBulk 完全同形（{translations:[{src,tgt}]}），外加统计字段。
// 契约：**只要有一段成功就绝不抛异常** —— 已交付的内容永远不会因为后面某一段失败而消失。
async function translateViaSentinel(text, srcLang, tgtLang, config, signal) {
    const srcName = srcLang === 'zh' ? 'Chinese' : 'English';
    const tgtName = tgtLang === 'zh' ? 'Chinese' : 'English';
    const cut = xportSegmentsEx(text);
    const segs = cut.segs;
    const brks = cut.breaks;
    // 切不出任何一段 = 输入是空白/纯注释。**抛**而不是返回空数组：调用方拿到
    // { translations: [] } 会当成一次成功的翻译，把屏幕上现有的译文整份换成 0 行。
    if (segs.length === 0) throw new Error('没有可翻译的内容（输入为空或只有空白）');

    const masked = segs.map(xportMask);
    const limits = await xportLimits(config);
    const tgts = new Array(segs.length).fill(null);
    const via = new Array(segs.length).fill('');
    // 没有可翻译字符的段（纯注释段 / 纯公式段）直接原样交付，不占请求、不进批次。
    const pending = [];
    for (let i = 0; i < segs.length; i++) {
        if (xportNothingToTranslate(masked[i].text)) { tgts[i] = segs[i]; via[i] = 'verbatim'; }
        else pending.push(i);
    }
    // xportPack 返回的是「它收到的那个数组」的下标，映射回全局段号。
    const batches = xportPack(pending.map(i => masked[i]), limits).map(b => b.map(k => pending[k]));
    let firstErr = null;
    let budget = limits.recovery;
    const spend = function () { if (budget <= 0) return false; budget--; return true; };

    for (let b = 0; b < batches.length; b++) {
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const batch = batches[b];
        let blocks = null;
        const bmeta = {};
        try {
            blocks = await xportRequest(batch.map(i => masked[i]), srcName, tgtName, config, signal, bmeta);
        } catch (err) {
            if (err && err.name === 'AbortError') throw err;
            firstErr = firstErr || err;
        }
        const failed = [];
        for (let j = 0; j < batch.length; j++) {
            const si = batch[j];
            const body = blocks ? blocks[j + 1] : null;
            if (body != null && xportBlockOk(body, masked[si].map)) {
                tgts[si] = xportUnmask(body, masked[si].map);
                via[si] = 'batch';
            } else {
                failed.push(si);
            }
        }
        // ---- A3：推理模式下把横幅弹出来，并把它记成**候选报错** ----
        // 【上一版在这里 throw，那是个可测的回归，别再写回去】条件是「这一批整批失败 +
        // 模型在推理 + 到现在一段都没成」，但它**没有**要求后面的批次也会失败。离线对照
        // （HEAD vs 上一版，同一输入同一桩、只有第 1 批不可解析）：HEAD 交付 27/27，
        // 上一版只发了 1 个请求就整轮抛异常、交付 0 —— 本来能翻的整篇文档被扔掉了。
        // 即使悲观情形（每批都不可解析）HEAD 也还能靠阶梯捞回 5 段 + 22 个可见重试标记。
        // 所以这里**不中止**：横幅立刻弹（十秒就能解决问题的那条信息，用户马上看得到），
        // 阶梯照跑，交付照旧。只有当整轮**一段都没成功**时，下面那个 tgts.every(null)
        // 分支才会把这条推理报错抛出去 —— 那时「模型在推理」才是唯一还站得住的线索。
        if (bmeta.thinking === true && failed.length === batch.length) {
            try { xportNoteThinking(config.model, true); } catch (e) {}
            firstErr = firstErr || new Error(xportThinkingMessage(config.model));
        }
        for (let f = 0; f < failed.length; f++) {
            if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
            if (budget <= 0) break;
            const si = failed[f];
            const r = await xportRecoverSegment(masked[si], segs[si], batch.length > 1,
                srcName, tgtName, config, signal, spend);
            if (r) { tgts[si] = r.tgt; via[si] = r.via; }
        }
    }

    // 【只看**发出去过**的那些段】原样交付的纯注释/纯公式段永远是「成功」的，把它们算进来
    // 会让「整轮网络全挂」变成一次「部分成功」，于是调用方拿一份几乎全是失败标记的文档
    // 覆盖掉屏幕上原来那份好的译文。判据必须是「送出去的段一段都没成」。
    if (pending.length > 0 && pending.every(i => tgts[i] === null)) {
        // 有过真的传输错误 = 配置 / 连接 / 模型级问题，把原始报错原样上抛（调用方保留旧译文）
        if (firstErr) throw firstErr;
        // ============= 没有任何传输错误，但每一段都没通过检查 =============
        // 【为什么改这句话】上一版这里说的是「请检查本地服务器与模型设置」。实测（单段文档，
        // 模型连续四次把 `32\%` 的反斜杠吃掉）它就是这么弹出来的 —— 服务器好好的、模型也
        // 答了、答得还挺像样，是**完整性检查**把它拦下来的。把锅甩给用户的服务器，
        // 会让他去改一个根本没坏的东西。这条 throw 本身是对的（抛出去调用方才会保留屏幕上
        // 原来那份译文，不至于被一份全是失败标记的文档覆盖），错的只是它说的话。
        throw new Error('翻译失败：模型有回应，但每一段都没通过完整性检查'
            + '（占位符、公式或注释符 % 被改动了），已保留原有译文。可以再点一次，或换一个模型。');
    }

    let failedCount = 0;
    const viaCount = {};
    const translations = [];
    for (let i = 0; i < segs.length; i++) {
        const key = via[i] || 'failed';
        viaCount[key] = (viaCount[key] || 0) + 1;
        if (tgts[i] === null) failedCount++;
        // brk：这一句后面在原文里是不是一个空行（= LaTeX 分段）。复制按钮和「回到大输入框」
        // 靠它把整篇拼回去，不然全篇分段会在导出时被抹平。
        translations.push({ src: segs[i], tgt: tgts[i] === null ? XPORT_FAIL_MARK : tgts[i], brk: brks[i] === true });
    }
    return { translations: translations, transport: 'sentinel', failedCount: failedCount, viaCount: viaCount, viaRows: via };
}

// ============= 批量翻译 =============
async function translateBulk(text, srcLang, tgtLang, config, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    // 传输期剥离颜色宏（不改动用户原文，仅改动本次发送给模型的副本）
    const pristine = typeof text === 'string' ? text : String(text == null ? '' : text);
    text = stripTextColorForModel(text);

    // 哨兵传输协议（详见上方大段注释）。开关关掉、或 provider 不在实测范围内时，
    // 下面一行之后的代码与改动前逐字一致。
    if (xportActive(config)) {
        const r = await translateViaSentinel(text, srcLang, tgtLang, config, signal);
        // 每一行**剥离之前**的那份原文，逐行挂回去（见 xportAttachRawSrc）。
        xportAttachRawSrc(r && r.translations, pristine, text);
        return r;
    }

    const srcName = srcLang === 'zh' ? 'Chinese' : 'English';
    const tgtName = tgtLang === 'zh' ? 'Chinese' : 'English';

    const systemPrompt = `You are a professional academic translator. 
1. Split input into logical sentences/segments.
2. Translate ${srcName} to ${tgtName}.
3. Keep LaTeX math/citations intact.
4. You MUST return ONLY valid JSON: {"translations": [{"src": "Original 1", "tgt": "Translated 1"}]}
5. Do NOT include any text before or after the JSON.`;

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            false, // 不使用json_mode，让模型自由返回
            signal,
            meta
        );
        return parseLocalJson(response, meta);
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { jsonMode: true },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            translations: {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        src: { type: "STRING" },
                        tgt: { type: "STRING" }
                    },
                    required: ["src", "tgt"]
                }
            }
        },
        required: ["translations"]
    };

    const response = await callGeminiAPI(config.model, text, {
        systemInstruction: systemPrompt,
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey, signal);

    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    return JSON.parse(response || "{}");
}

// ============= 句子精炼 =============
async function refineSentence(text, lang, type, config, instruction = null, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    let prompt = "";

    if (type === "grammar") {
        const baseInst = instruction || `${DEFAULT_GRAMMAR_PROMPT} (Language: ${lang === 'zh' ? 'Chinese' : 'English'})`;
        prompt = `${baseInst}

IMPORTANT RULES:
1. If there are grammar errors, return ONLY the corrected sentence.
2. If the text is already grammatically correct, return exactly: [NO_CHANGES]
3. Do NOT explain or describe what you did. Return ONLY the corrected text or [NO_CHANGES].

Text: "${text}"`;
    } else if (type === "simplify") {
        const baseInst = instruction || `${DEFAULT_SIMPLIFY_PROMPT} (Language: ${lang === 'zh' ? 'Chinese' : 'English'})
CRITICAL RULES:
1. Use common vocabulary.
2. STRICTLY PRESERVE all LaTeX math (e.g., $x_i$, \\xi_k), citations (e.g., [1]), and serial numbers (e.g., 1., (a)) exactly as they are.`;
        prompt = `${baseInst}\n3. Return ONLY the rewritten sentence.\nOriginal Text: "${text}"`;
    } else if (type === "custom") {
        prompt = `Rewrite the following ${lang === 'zh' ? 'Chinese' : 'English'} sentence based on this instruction: "${instruction}". Return ONLY the rewritten sentence.\n\nText: "${text}"`;
    }

    if (config.provider === 'local') {
        return await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false,
            signal
        );
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return response?.trim() || text;
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return response?.trim() || text;
    }

    // Gemini Path
    const response = await callGeminiAPI(config.model, prompt, { temperature: 0.3 }, config.geminiApiKey, signal);
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    return response?.trim() || text;
}

// ============= 智能更新 =============
async function getSmartUpdate(prompt, config, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    const systemPrompt = "You update translations intelligently. Return valid JSON only.";

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt + "\n\nRETURN JSON: {\"text\": \"...\"}" }
            ],
            false, // 不使用json_mode
            signal,
            meta
        );
        // 这条链路按既有行为**吞掉**失败（返回空串 = 不改动用户的译文），所以 A4 的分类
        // 只落到 console：把「推理吃光预算」和「真的没输出」在排查时分开，UI 行为一字不变。
        try {
            const data = parseLocalJson(response, meta);
            return data.text || "";
        } catch (e) { console.warn('getSmartUpdate: ' + (e && e.code ? e.code : '') + ' ' + (e && e.message)); return ""; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt + "\n\nRETURN JSON: {\"text\": \"...\"}" }
            ],
            { jsonMode: true },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        try {
            const data = parseJsonResponse(response);
            return data.text || "";
        } catch (e) { return ""; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt + "\n\nRETURN JSON: {\"text\": \"...\"}" }
            ],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        try {
            const data = parseJsonResponse(response);
            return data.text || "";
        } catch (e) { return ""; }
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            text: { type: "STRING" }
        },
        required: ["text"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey, signal);

    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    const data = JSON.parse(response || "{}");
    return data.text || "";
}

// ============= 获取同义词 =============
// mode: 'replace'（学术同义替换，默认）| 'simplify'（简化：更常用、更直白的说法）
// signal: 可选的 AbortSignal，只走本地链路的第 5 个位置参数（callLocalLLM 的既有形参）。
// 在线三家的签名一个字节都没动。
async function getSynonyms(sentence, selectedText, lang, config, avoidList = [], mode = 'replace', signal = null) {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT include any of the following words/phrases in your output: ${JSON.stringify(avoidList)}. Find DIFFERENT alternatives.`
        : "";

    const prompt = mode === 'simplify' ? `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 SIMPLER, more common, and more direct alternatives for the "Selected Text".
1. If "Selected Text" is a single word, replace rare, obscure, or overly formal words with common, everyday equivalents.
2. If "Selected Text" is a phrase, clause, or full sentence, rewrite it in plainer, more direct, and more concise language that conveys the SAME meaning.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by simplicity and commonness (most common and most direct first).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }` : `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 distinct, academic-style alternatives for the "Selected Text".
1. If "Selected Text" is a single word, provide synonyms.
2. If "Selected Text" is a phrase, clause, or full sentence, provide rephrased versions that convey the SAME meaning and function within the context.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by Semantic Proximity (closest meaning first, then slightly more varied).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }`;

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false, // 不使用json_mode
            signal,
            meta
        );
        // 同 getSmartUpdate：吞掉失败是既有行为（弹窗显示「没有候选」），
        // A4 的分类只进 console —— 这条链路上 UI 一字不变。
        try {
            const data = parseLocalJson(response, meta, { arrayKey: 'alternatives' });
            return data.alternatives || [];
        } catch (e) { console.warn('getSynonyms: ' + (e && e.code ? e.code : '') + ' ' + (e && e.message)); return []; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            const data = parseJsonResponse(response, { arrayKey: 'alternatives' });
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            const data = parseJsonResponse(response, { arrayKey: 'alternatives' });
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey);

    const data = JSON.parse(response || "{}");
    return data.alternatives || [];
}

// ============= 语法修正（选词弹窗第三个模式）=============
// 与 getSynonyms 是平级的兄弟函数。之所以单独开一个而不是塞进 getSynonyms：
// 语法模式的响应形状本质不同（要么「正确」，要么「N 条改写 + 原因」），
// 硬塞回 string[] 只能靠哨兵值伪装，反而更容易在渲染路径上炸。
// 返回值形状固定：
//   { status: 'correct'|'issues'|'empty'|'parse', issue: string, scope: 'selection'|'sentence', alternatives: string[] }
// —— 这里绝不 throw 解析错误，调用方拿到 status 就能给出可见文案。
// scope 决定这批 alternatives 该替换掉哪一段：'selection' = 只换选中的词，'sentence' = 换掉整句。
// 它必须跟着建议一起走，绝不能在应用时再猜一次。

// 两段文本在语法意义上算不算「同一句话」。
// 只归一化空白：大小写、标点在语法里是有意义的，不能抹平。
function isSameGrammarText(a, b) {
    const na = (typeof a === 'string' ? a : '').trim().replace(/\s+/g, ' ');
    const nb = (typeof b === 'string' ? b : '').trim().replace(/\s+/g, ' ');
    return na === nb;
}

// 只归一化空白。tier-1 判据（选区外逐字未变）用它。
function collapseWs(s) {
    return (typeof s === 'string' ? s : '').trim().replace(/\s+/g, ' ');
}
// 只保留「承载语法的词序列」：LaTeX 命令名、{}$~\、全部标点、引号/破折号变体、
// 大小写、空白一律抹平；词的替换/增删会保留下来 —— 那才是「错在选区外」的样子。
// 三个非 ASCII 字符集刻意写成 \u 转义（同 CHAT_MD_TILDE 的理由：裸字符肉眼查不出来）：
//   ‐-― = 连字符/各种破折号，‘’ʼ = 弯撇号，“” = 弯双引号。
function grammarKey(s) {
    return String(s == null ? '' : s)
        .replace(/\\textcolor\s*\{[^{}]*\}/g, ' ')   // \textcolor{blue}{X} → X（颜色参数不是语法）
        .replace(/\\[a-zA-Z]+\s*(\[[^\]]*\])?/g, ' ')
        .replace(/[{}$~\\]/g, ' ')
        .toLowerCase()
        .replace(/[\u2010-\u2015]/g, '-')
        .replace(/[\u2018\u2019\u02BC]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[^a-z0-9'\-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}
// derived 是从 corrected_sentence 里裁出来的。模型自己的修正稿偶尔会把选区开头
// 重复一遍（实测 c25 / p15L：选区 "Willie rewards, $R^{J}$" → derived
// "Willie rewards, Willie rewards, $R^{W}$"），排在第一位就是把一条看得见的
// 坏选项推到用户鼻子底下。这种情况**不删只降权**，让模型自己的候选先上。
// 实测：散文语料 146 条 tier-1 行 0 次误伤；数学语料 12 条里命中 3 条。
function grammarDerivedLooksDuplicated(sel, der) {
    const a = collapseWs(sel), b = collapseWs(der);
    if (!a || !b || b.length <= a.length) return false;
    for (let L = Math.min(a.length, 12); L >= 6; L--) {
        const p = a.slice(0, L);
        if (b.indexOf(p) === 0 && b.indexOf(p, 1) > 0) return true;
    }
    return false;
}

// 去空、去重、压成字符串数组
function normalizeGrammarList(raw) {
    const arr = Array.isArray(raw) ? raw : [];
    const seen = {};
    const out = [];
    for (let i = 0; i < arr.length; i++) {
        const v = arr[i];
        const str = (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
        if (!str) continue;
        if (seen[str]) continue; // 弱模型（如 qwen3-1.7b）实测会把同一条重复三遍
        seen[str] = true;
        out.push(str);
    }
    return out;
}

// 把模型返回的任意脏数据压成固定形状
// baseline: { selectedText, sentenceText, head, tail }
//   sentenceText 为空串 = 本次没有可用的整句范围 → 整句改写一律丢弃，只允许词级替换。
//   （没有范围却应用整句改写，就会把一整句塞进一个词的位置。）
//   head/tail = 整句里选区前后的两截；两者都在时用来判定「模型的修正稿动没动到选区之外」。
//
// 返回形状固定为 { status, issue, scope, alternatives, sentenceIssue, sentenceOffer }。
// 后两个是**附带提议**通道（「整句别处还有问题」），只有新 prompt 的两判定契约会填，
// 而且永远是二等公民 —— 它绝不会顶掉用户真正问的那段选区的答案。
function normalizeGrammarPayload(data, baseline) {
    const d = (data && typeof data === 'object') ? data : {};
    const base = (baseline && typeof baseline === 'object') ? baseline : {};
    const selectedText = typeof base.selectedText === 'string' ? base.selectedText : '';
    const sentenceText = typeof base.sentenceText === 'string' ? base.sentenceText : '';
    const head = typeof base.head === 'string' ? base.head : null;
    const tail = typeof base.tail === 'string' ? base.tail : null;

    // 「换了等于没换」的选项一律丢掉：实测模型会把原词原样列进候选里（results → results）
    const spanAlternatives = normalizeGrammarList(d.alternatives)
        .filter(v => !isSameGrammarText(v, selectedText));

    const corrected = typeof d.corrected_sentence === 'string' ? d.corrected_sentence.trim() : '';

    // 两判定契约（buildGrammarPrompt 现在要的形状）：focus_correct 只回答「**选区**对不对」，
    // sentence_issue / sentence_alternatives 说的是句子别处的毛病，改走附带提议通道。
    // **只有模型真的回了 focus_correct 才启用**：老形状（只有 correct）逐字走下面同一条阶梯，
    // 这样 1286 份历史响应的离线重放数字仍然可比，Gemini/旧缓存也不会走进没量过的分支。
    let focusCorrect = null;
    if (typeof d.focus_correct === 'boolean') focusCorrect = d.focus_correct;
    else if (typeof d.focus_correct === 'string' && d.focus_correct.trim()) {
        focusCorrect = /^(true|yes|correct)$/i.test(d.focus_correct.trim());
    }
    const twoVerdict = focusCorrect !== null;

    const rawSentenceList = normalizeGrammarList(
        d.sentence_alternatives != null ? d.sentence_alternatives : d.sentenceAlternatives);

    // 附带提议只在两判定契约下存在，而且必须真有整句范围才谈得上「整句改写」
    const offerList = (twoVerdict && sentenceText)
        ? rawSentenceList.filter(v => !isSameGrammarText(v, sentenceText))
        : [];
    const sentenceIssue = (twoVerdict && typeof d.sentence_issue === 'string') ? d.sentence_issue.trim() : '';

    // 主答案能用的整句池。两判定契约下 sentence_alternatives 已经改走提议通道了，
    // 主答案只认模型自己的 corrected_sentence。
    const sentenceAlternatives = sentenceText
        ? normalizeGrammarList((twoVerdict ? [] : rawSentenceList).concat(corrected ? [corrected] : []))
            .filter(v => !isSameGrammarText(v, sentenceText))
        : [];

    let issue = '';
    if (typeof d.issue === 'string') issue = d.issue.trim();
    else if (typeof d.reason === 'string') issue = d.reason.trim();

    // 所有出口共用一个收口：主答案已经是整句改写时，附带提议不再挂上去
    //（同一件事说两遍只会互相打架，而且 applySynonym 的范围只有一个）。
    const fin = function (status, scope, alternatives) {
        const sentScope = scope === 'sentence';
        return {
            status: status,
            issue: status === 'correct' ? '' : issue,
            scope: sentScope ? 'sentence' : 'selection',
            alternatives: alternatives,
            sentenceIssue: sentScope ? '' : sentenceIssue,
            sentenceOffer: sentScope ? [] : offerList
        };
    };

    // 「语法正确」必须有模型的明确表态才敢下结论。
    // 响应是 null / 数组 / 缺字段时一律算 'empty'——绝不能把一次失败的请求显示成「语法正确」。
    let correct = false;
    if (typeof d.correct === 'boolean') correct = d.correct;
    else if (typeof d.correct === 'string') correct = /^(true|yes|correct)$/i.test(d.correct.trim());
    if (twoVerdict) correct = focusCorrect;      // 新契约下由 focus_correct 说了算

    if (correct) return fin('correct', 'selection', []);

    // 交叉核对（放宽版）：问题不是「词级候选能不能逐字复现模型的整句修正稿」，
    // 而是「模型自己的修正稿有没有动到选区**以外**、且是语法意义上的改动」。
    //   动了 → 这个错必须出选区才能修，整句改写是应得的；
    //   没动 → 模型的修正稿本身就是一个词级修复，那就留在选区，并且把真正的
    //          替换串**从 corrected_sentence 里取出来**（实测：模型给的 alternatives
    //          经常只替换多词选区里的一部分，"these decision" → ["decisions"]，
    //          把 "these" 悄悄吞掉；corrected_sentence 里的那一段才是完整的）。
    // 改动前那条严格判据（head + alt + tail === corrected_sentence，逐字比整句）
    // 实测把 76.5% 的完美词级答案判死（17 条手工构造的载荷里 13 条），
    // 而且 74.5% 的整句改写就是它逼出来的。
    let tier = 0, derived = null;
    if (corrected && head !== null && tail !== null) {
        const c = collapseWs(corrected), h = collapseWs(head), t = collapseWs(tail);
        if ((h === '' || c.indexOf(h) === 0) && (t === '' || c.lastIndexOf(t) === c.length - t.length)
            && c.length >= h.length + t.length) {
            tier = 1;                                   // 选区外逐字未变
            derived = collapseWs(c.slice(h.length, c.length - t.length));
        } else {
            const kc = grammarKey(corrected), kh = grammarKey(head), kt = grammarKey(tail);
            // tier 2：抹掉 LaTeX 命令名/标点/大小写之后仍然一致 = 选区外没有**语法**改动。
            // tier 3：选区外真的换了词 —— 这才是 e3a4a7a 当初要抓的那种（c33 「These works」
            //         的 corrected_sentence 把选区外的 demonstrates 改成了 demonstrate）。
            tier = ((kh === '' || kc.indexOf(kh) === 0)
                 && (kt === '' || kc.lastIndexOf(kt) === kc.length - kt.length)
                 && kc.length >= kh.length + kt.length) ? 2 : 3;
        }
    }

    const scopeHint = typeof d.scope === 'string' ? d.scope.trim().toLowerCase() : '';

    // 两判定契约下「我要改整句」必须先说得出理由：outside_fix 得是选区**之外**真实存在的一段。
    // 说得出 → 直接升级，附带提议就是主答案；说不出 → 一路往下，最后落回选区。
    // 有歧义时默认永远是选区，这是整条阶梯的默认方向。
    const wantsSentence = twoVerdict && scopeHint === 'sentence';
    const reason = wantsSentence && typeof d.outside_fix === 'string' ? d.outside_fix.trim() : '';
    const reasonValid = !!reason
        && ((head === null ? '' : head) + ' ' + (tail === null ? '' : tail)).indexOf(reason) !== -1;
    if (wantsSentence && reasonValid && offerList.length > 0) return fin('issues', 'sentence', offerList);

    if (tier === 1) {
        const out = [];
        const push = function (v) {
            if (v && !isSameGrammarText(v, selectedText)
                && !out.some(x => isSameGrammarText(x, v))) out.push(v);
        };
        // derived 默认排第一（实测：把还原出正确答案的选项放进第 1 格，44/45 → 40/45 对
        // 27/30 → 20/30，差 22 个百分点）；只有它看起来是「选区开头被重复了一遍」时才降到末位。
        const demote = !!derived && grammarDerivedLooksDuplicated(selectedText, derived);
        if (derived && !demote) push(derived);
        for (let i = 0; i < spanAlternatives.length; i++) push(spanAlternatives[i]);
        if (derived && demote) push(derived);
        if (out.length > 0) return fin('issues', 'selection', out);
    }
    if (tier === 2 && spanAlternatives.length > 0) return fin('issues', 'selection', spanAlternatives);
    // 说不出理由的整句请求，到这里就被驳回：有词级候选就用词级候选。
    if (wantsSentence && !reasonValid && spanAlternatives.length > 0) return fin('issues', 'selection', spanAlternatives);
    if (scopeHint === 'sentence' && sentenceAlternatives.length > 0) return fin('issues', 'sentence', sentenceAlternatives);
    if (tier === 3 && sentenceAlternatives.length > 0) return fin('issues', 'sentence', sentenceAlternatives);
    // tier 0（模型压根没给 corrected_sentence）**必须**能走到这条选区出口。
    // 抢救上线后 48/86 的载荷都是这个形状；把这一条「简化」掉就等于把它们全推去整句改写。
    if (spanAlternatives.length > 0) return fin('issues', 'selection', spanAlternatives);
    if (sentenceAlternatives.length > 0) return fin('issues', 'sentence', sentenceAlternatives);
    return fin('empty', 'selection', []);
}

// spanOnly = true：没有可用的整句范围，只能要词级替换（模型不许提整句改写）
//
// 【为什么整个 prompt 重写了】改动前第一句是
// 「Check the grammar of the WHOLE "Sentence", paying special attention to the "Focus"」——
// 于是用户选中一个本身没毛病的词、而错在句子别处时，模型**完全按吩咐办事**，回一份整句改写。
// 实测这一类 22/24 = 91.7% 被升级成整句，其中 82% 是模型自己选的 scope:"sentence"，
// 客户端再怎么放宽判据都碰不到它。用户抱怨的就是这一条。
//
// 现在的形状（两判定契约）：
//   focus_correct           —— 整句全部校对之后，只回答「用户选的这段是不是其中一个错、
//                              或者是某个错的另一半」；这是主答案。**判定的作用域是选区，
//                              阅读的范围仍然是整句**——这两件事不能一起收窄，见下面第 1 条的实测。
//   scope / alternatives    —— 选区错了怎么修；默认 selection，sentence 必须「挣来」。
//   outside_fix             —— 要 sentence 就必须点名选区**之外**那段要改的字，
//                              说不出来就退回 selection（normalizeGrammarPayload 会核对）。
//   sentence_issue / sentence_alternatives —— 句子别处的毛病，**附带提议**，
//                              永远不顶掉 focus 的判定（客户端把它放进第二行，用户点了才生效）。
// 另外明确列出「什么算语法错误」，把 partial adaptive / adapt its monitor decisions 这类
// 词形错误钉死为语法问题 —— 少了这一条模型会把它读成用词偏好，直接答「语法正确」。
//
// 【第 1 条改过两轮，两轮都是量出来的，别再凭手感动它】
// 第一版写的是「First judge the FOCUS ONLY … EVEN IF some other part of the Sentence is wrong」。
// 实测代价：模型干脆不去读句子别处了，于是**选区是错误的另一半**时它照答 focus_correct=true，
// 屏幕上就是一颗绿勾。24 条 LaTeX 语料 x 2 次 x 自己那一版的构建
//（node .claude/tmp/combined/verify-prompt-fix.js，原始数据同名 .jsonl / .log）：
//   假「语法正确」(class ii+iii)     HEAD 0/36    第一版 9/36 (25.0%)   现在 2/36 (5.6%)
//   不必要的整句升级 (class i+ii)    HEAD 13/32   第一版 2/32           现在 2/32
//   class-ii 首选项就能修好          HEAD 5/20    第一版 18/20          现在 17/20
//   class-iii 修复稿就是主答案       HEAD 7/16    第一版 6/16           现在 10/16
// 两处改动分别对应两个实测出来的洞：
//   (a) 第 1 条现在**先整句校对、再判选区**（HEAD 的顺序），因为 HEAD 从没漏过错；
//       只把「判定的作用域」收窄到选区，不把「阅读的范围」也收窄。
//   (b) 第 4 条的 sentence 分支原来只要 outside_fix，**没说改写稿放哪** ——
//       而客户端读的是 sentence_alternatives。少这一句，升级上去的那一页拿到的
//       是第 5 条那个「与选区无关的别处问题」的改写稿，修的往往不是用户问的那个错。
// 【仍然没修好、且不是客户端能修的】两个错的句子（"The results shows … outperform …"，
// 选中 "results"）：主答案 0/4 次是完整修复，HEAD 是 3/4。这是两判定契约的**设计后果**
// 而不是 bug —— 用户问的是 "results"，主答案就只修 "results" 那一处，另一处走
// 「整句还有问题」那一行（4 次里 2 次可点开拿到完整修复）。要让主答案永远修全句，
// 就得退回 HEAD 那套「问一个词、改一整句」，而那正是本轮 91.7% 过度升级的来源。
function buildGrammarPrompt(sentence, selectedText, lang, avoidInstruction, spanOnly) {
    const scopeRules = spanOnly
        ? `4. Only the "selection" scope exists here. If the Focus is wrong, set "scope": "selection" and put 3-5 DISTINCT replacements for the WHOLE Focus string in "alternatives". Leave "sentence_alternatives" and "outside_fix" empty.`
        : `4. If the Focus is wrong, pick the scope. The DEFAULT is "selection"; "sentence" must be earned.
   - "scope": "selection" - the error can be repaired by rewriting the Focus alone. Put 3-5 DISTINCT replacements in "alternatives". Each alternative replaces the ENTIRE Focus string, so COPY THROUGH the parts of the Focus that are already correct and change only what is wrong; never return a replacement for a word that is not inside the Focus. Set "corrected_sentence" to the Sentence with alternatives[0] substituted for the Focus and EVERY OTHER CHARACTER copied verbatim. Leave "outside_fix" empty.
   - "scope": "sentence" - the Focus is PART OF an error that cannot be repaired inside the Focus (for example the Focus is the subject and the verb outside it disagrees). You MUST set "outside_fix" to the exact substring, taken from OUTSIDE the Focus, that has to change, AND put 3-5 DISTINCT fully corrected versions of the ENTIRE Sentence in "sentence_alternatives"; each version must repair EVERY error in the Sentence, not only the one nearest the Focus. If you cannot name an outside_fix, use "selection" instead.`;

    return `Sentence: "${sentence}"
Focus (the exact substring the user selected, inside the Sentence): "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Act as a strict academic proofreader. The user is asking about the "Focus". The rest of the "Sentence" is CONTEXT.
1. FIRST proofread the WHOLE Sentence and find every grammar error in it - do this even when the Focus looks fine, because the error is often outside the Focus. THEN judge the FOCUS against that list: set "focus_correct": false if the Focus is itself one of those errors, OR is one half of one (a subject whose verb outside the Focus does not agree with it, a verb whose subject does not agree, a noun whose article or number does not match). Set "focus_correct": true ONLY when every error you found lies in a part of the Sentence that the Focus has no grammatical relationship with.
2. If "focus_correct" is true, set "scope": "none", an empty "issue", an empty "alternatives" and an empty "corrected_sentence". Do NOT invent stylistic rewrites of a correct Focus.
3. If "focus_correct" is false, give a SHORT "issue" (one clause naming the error in or around the Focus).
${scopeRules}
5. SEPARATELY, and ONLY when "scope" is not "sentence": if some OTHER part of the Sentence - a part the Focus is not involved in - has a grammar error, describe it in one clause in "sentence_issue" and put 2-3 fully corrected versions of the ENTIRE Sentence in "sentence_alternatives". If the rest of the Sentence is clean, leave both empty. This is an aside for the user to accept or ignore; it never replaces the Focus verdict.
6. What counts as a grammar error: subject-verb agreement, number, tense, verb form, article, MISSING OR WRONG WORD FORM (an adjective where an adverb is required - "partial adaptive"; a bare noun where a gerund or participle is required - "adapt its monitor decisions"; a base verb after a modal that needs a participle), and malformed construction. A wrong word FORM is a grammar error even when the intended word is obvious. What does NOT count: stylistic tone, synonym preference, hyphenation preference, pronoun gender, terminology choice and formatting.
7. NEVER output an option identical to the text it would replace. Keep the original meaning and academic tone. Reproduce LaTeX commands, math and citations exactly as given.
8. ${avoidInstruction}

Return JSON: { "focus_correct": true, "issue": "", "scope": "none", "alternatives": [], "corrected_sentence": "", "sentence_issue": "", "sentence_alternatives": [], "outside_fix": "" }`;
}

// 解析失败的统一出口。**必须把 code 带出去**：改动前六个失败码在弹窗里塌成同一句
// 「模型未返回可用结果（响应为空或 JSON 解析失败）」，补救办法一个字都没有；
// BAD_ESCAPE 和 THINKING_ATE_BUDGET 的做法完全不同，混在一起等于什么都没说。
function grammarParseFailure(e) {
    const code = (e && typeof e.code === 'string') ? e.code : 'UNPARSEABLE';
    console.warn('getGrammarSuggestions: ' + code + ' ' + (e && e.message));
    return { status: 'parse', code: code, issue: '', scope: 'selection',
             alternatives: [], sentenceIssue: '', sentenceOffer: [] };
}

// sentence: 拿去分析的那一句（有整句范围时 = 整句；没有时 = 原来的整行上下文，并强制 spanOnly）
// splice: { head, tail } = 整句里选区前后的两截，用于交叉核对；缺省则不做核对
// signal: 同 getSynonyms —— 只透传给本地链路 callLocalLLM 的第 5 个位置参数。
async function getGrammarSuggestions(sentence, selectedText, lang, config, avoidList = [], spanOnly = false, splice = null, signal = null) {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT repeat any of the following corrections: ${JSON.stringify(avoidList)}. Propose DIFFERENT wordings of the fix.`
        : "";

    const prompt = buildGrammarPrompt(sentence, selectedText, lang, avoidInstruction, spanOnly);
    // 判重基准：spanOnly 时没有整句范围，sentenceText 必须留空，整句候选会被全部丢弃
    const sp = (!spanOnly && splice && typeof splice === 'object') ? splice : {};
    const baseline = {
        selectedText: selectedText,
        sentenceText: spanOnly ? '' : sentence,
        head: typeof sp.head === 'string' ? sp.head : null,
        tail: typeof sp.tail === 'string' ? sp.tail : null
    };

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false, // 不使用json_mode（与 getSynonyms 保持一致）
            signal,
            meta
        );
        // A4 分出来的码现在跟着返回值一起走到弹窗（grammarParseFailure），不再只进 console。
        try {
            return normalizeGrammarPayload(parseLocalJson(response, meta, { arrayKey: 'alternatives' }), baseline);
        } catch (e) {
            return grammarParseFailure(e);
        }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response, { arrayKey: 'alternatives' }), baseline);
        } catch (e) { return grammarParseFailure(e); }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response, { arrayKey: 'alternatives' }), baseline);
        } catch (e) { return grammarParseFailure(e); }
    }

    // Gemini Path
    // ⚠️ 未经实测：本环境没有 Gemini API Key，下面的 schema 只做过代码审查，没有真跑过一次请求。
    // schema 必须跟着 prompt 一起换成两判定形状（focus_correct / outside_fix / sentence_issue），
    // 否则 responseSchema 会强制模型回一个 prompt 里根本没提的 `correct` 字段。
    // 即使 schema 被 Gemini 拒绝或字段缺失，normalizeGrammarPayload 也只会退回
    // 'empty' / 词级替换（focus_correct 不在场时它逐字走老阶梯），不会拿不存在的范围去替换文本。
    const responseSchema = {
        type: "OBJECT",
        properties: {
            focus_correct: { type: "BOOLEAN" },
            issue: { type: "STRING" },
            scope: { type: "STRING" },
            corrected_sentence: { type: "STRING" },
            outside_fix: { type: "STRING" },
            sentence_issue: { type: "STRING" },
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            },
            sentence_alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["focus_correct", "issue", "scope", "corrected_sentence", "outside_fix", "sentence_issue", "alternatives", "sentence_alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey);

    try {
        return normalizeGrammarPayload(JSON.parse(response || "{}"), baseline);
    } catch (e) { return grammarParseFailure(e); }
}

// 选词弹窗统一取数入口：三个模式共用一个返回形状
// { alternatives: string[], note: {status,issue,scope,code,sentenceIssue,sentenceOffer}|null }。
// note 只有语法模式才有；另外两个模式保持原样走 getSynonyms（返回值契约一个字节都没动）。
// grammarScope: getGrammarScopeContext() 的产物 { sentence, head, tail }；
//   传 null 或 sentence 为空 = 没算出可靠的句子范围，语法模式退化成词级分析（等同改动前的行为）。
// signal: 可选的 AbortSignal（三个取数入口各自持有一个，见 AppState.synonymAbort）。
async function fetchSynonymOptions(mode, sentence, selectedText, lang, config, avoidList, grammarScope, signal) {
    const m = normalizeSynonymMode(mode);
    const avoid = Array.isArray(avoidList) ? avoidList : [];
    const sig = signal || null;

    if (m === 'grammar') {
        const gs = (grammarScope && typeof grammarScope === 'object') ? grammarScope : {};
        const useSentence = (typeof gs.sentence === 'string' && gs.sentence.trim()) ? gs.sentence : null;
        const result = await getGrammarSuggestions(
            useSentence || sentence, selectedText, lang, config, avoid, !useSentence,
            { head: gs.head, tail: gs.tail }, sig
        );
        // status:'empty' 改动前**连一行 console 都没有** —— 模型明明答了，是客户端把候选
        // 全过滤掉了（全部与原文相同），而屏幕上写的却是「响应为空或 JSON 解析失败」。
        // 这里补一行诊断；屏幕上的文案见 renderSynonymPopupOnly。
        if (result.status === 'empty') {
            console.warn('getGrammarSuggestions: EMPTY_AFTER_FILTER 模型有回应，但所有候选都与原文相同（选区='
                + JSON.stringify(selectedText) + '）');
        }
        return {
            alternatives: Array.isArray(result.alternatives) ? result.alternatives : [],
            // 这个投影是唯一的收口：多一个键都要在这里加，不然弹窗永远看不到。
            note: {
                status: result.status,
                issue: result.issue,
                scope: result.scope === 'sentence' ? 'sentence' : 'selection',
                code: typeof result.code === 'string' ? result.code : '',
                sentenceIssue: typeof result.sentenceIssue === 'string' ? result.sentenceIssue : '',
                sentenceOffer: Array.isArray(result.sentenceOffer) ? result.sentenceOffer : []
            }
        };
    }

    const alternatives = await getSynonyms(sentence, selectedText, lang, config, avoid, m, sig);
    return { alternatives: Array.isArray(alternatives) ? alternatives : [], note: null };
}

// ============= 文本摘要 =============
// ⚠️ 唯一的调用者 handleSummary 已随 Insight 功能一起删除，这个函数现在没有人调。
// 之所以**没有**跟着删：它的第三个分支里有 5 行属于 Claude 调用路径
// （`// Claude Path` / `if (config.provider === 'claude') {` / `await callClaudeAPI(` /
//  `config.claudeApiKey,` / `config.claudeProxyUrl`），而本仓库对 Claude 路径的硬约束是
// 「相对上一次提交零删除、零修改，只允许新增」。删掉它会让这几行的出现次数各少一次，
// 直接踩线。等 Claude 路径的约束解除、或由维护者显式确认后再删。
// 新代码请一律用 callModelPlainText（它是这套分支形状的更好版本：全程传 signal 可取消）。
async function summarizeText(text, config) {
    const prompt = `总结:\n${text}`;

    if (config.provider === 'local') {
        return await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }]
        );
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            {},
            config.openaiApiKey
        );
        return response || "";
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            {},
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        return response || "";
    }

    // Gemini Path
    const response = await callGeminiAPI(config.model, prompt, {}, config.geminiApiKey);
    return response || "";
}


// ==================== TRANSLATE.JS ====================
// ========================================
// translate.js - 翻译核心逻辑
// ========================================

// ============= 翻译相关函数 =============

// 执行翻译
// opts.auto = true 表示这一次是 AUTO SYNC 的防抖定时器发起的，不是用户亲手点 TRANSLATE。
// 唯一的区别在下面那道「未提交草稿闸门」：定时器不许弹 window.confirm（用户正在大输入框里
// 打字，一个从后台冒出来的模态框会被顺手按掉、连带丢掉他右栏那处没保存的修改），改成
// 什么都不做 + 一条说清楚原因的 toast。
async function handleTranslate(opts) {
    const autoFired = !!(opts && opts.auto === true);
    // 停止功能
    if (AppState.isLoading && AppState.mainAbortController) {
        AppState.mainAbortController.abort();
        setState({ isLoading: false });
        return;
    }

    // 先把原文栏里的逐句改稿收回大输入框（见 syncInputFromPairs）。
    // 【为什么必须在下面那个相等判断**之前**】用户在原文栏改了一句、直接按 TRANSLATE：
    // 改动只落在 pairs 里，inputText 一个字都没变，于是相等成立，弹出
    // 「原文和上次翻译的一模一样」—— 而屏幕上的原文明明就在那儿，跟上次不一样。
    // 收回来之后 inputText 反映的就是屏幕上那份，说的和做的从此一致。
    // 重建真的发生了才提示：这一次翻译之后 pairs 会整份换新，缝不回来的那几行的
    // \textcolor 从此**永久**没了（新 pairs 的 srcRaw 是按这份不带宏的文本重新算的），
    // 所以这是最后一次能说的机会。
    if (syncInputFromPairs()) xportWarnColorMacroLoss('这次要翻译的原文');

    if (!AppState.inputText.trim()) return;

    // 检查输入是否变化：如果已有翻译结果且输入未改变，则不执行翻译
    // 用户应使用重新生成按钮来重新翻译
    //
    // 【为什么这里必须说一句话】这条 return 是**用户按下按钮之后**唯一一条什么都不做、
    // 又什么都不说的路。按钮此刻是亮的、可点的，点下去 0 个网络请求、error=null、toast=null，
    // 用户只能理解成「这个应用坏了」。自动翻译那条防抖路自己就带了同样的判断，走不到这里，
    // 所以这句提示只会在用户**亲手点**的时候出现，不会糊屏。
    if (AppState.translationPairs.length > 0 && AppState.inputText === AppState.lastTranslatedText) {
        try {
            showToast('原文和上次翻译的一模一样，没有重新翻译。想换一版译文请用旁边的「重新生成所有翻译」。', 'info');
        } catch (e) {}
        return;
    }

    // ---- 未提交草稿闸门（与 handleRegenerateAll 那道逐字同一条理由）----
    // 【实测的原始故障（L2-1）】开着第 2 行的编辑框、框里有没按 Update 的字，点顶栏 TRANSLATE：
    // handleGlobalClick 对 <button> 直接 return，所以 activeIndex 一直留着；renderPairRow 的
    // isEditing 分支不吃 rowLocked，于是那一行照旧是一个可编辑的 textarea（实测
    // `open row carries the lock tooltip = false`，而**别的**行 lock tooltip / cursor-not-allowed
    // 都有），同时 toast 说着「这期间不能逐句编辑」。翻译落地把 translationPairs 整份换掉之后，
    // 随便点一下空白 → saveRowUpdate 拿**过期草稿**覆盖刚翻出来的新译文，而且因为「只有一侧变了」
    // 还会发一次智能更新把**原文栏**也改写掉（实测终态
    // pairs[1] = {"src":"AI-REWRITTEN-SOURCE","tgt":"T:Two sentence. MYDRAFT"}，error=null、
    // toast 只有那句「不能逐句编辑」）。
    // 文案和注释都说这期间不能编，那么正在开着的那一行也必须被关掉 —— renderPairRow 的
    // isEditing 分支同时补上了只读样式，两处一起才把那句话变成真的。
    // 【为什么放在这里】必须在相等判断之后（那一条什么都不做，不该顺手把编辑框关掉），
    // 又必须在 isLoading 置位之前（一旦置位，行就被 rowLocked 锁住，用户再也点不了 Update）。
    if (AppState.activeIndex !== null) {
        const cur = AppState.translationPairs[AppState.activeIndex];
        const dirty = !!cur && (AppState.editValues.src !== cur.src || AppState.editValues.tgt !== cur.tgt);
        if (dirty) {
            if (autoFired) {
                // 定时器路：不弹模态框，也**不**丢弃草稿 —— 什么都不做，把原因说出来。
                // 用户点 Update（或点走这一行）之后，下一次击键的防抖就会正常翻。
                try {
                    showToast('第 ' + (AppState.activeIndex + 1) + ' 行还有没保存的修改，自动翻译先停一下：'
                        + '翻译会把整篇译文换成新的一版，那处修改会被覆盖。点这一行的 Update 保存它'
                        + '（或者点走这一行放弃它），之后自动翻译会自己继续。', 'warning');
                } catch (e) {}
                return;
            }
            let go = false;
            try {
                go = window.confirm('第 ' + (AppState.activeIndex + 1) + ' 行还有没保存的修改。\n\n'
                    + 'TRANSLATE 会把整篇译文换成新的一版，这处修改会被丢掉，而且找不回来。\n\n'
                    + '确定 = 丢弃它并继续；取消 = 先回去点 Update 保存。');
            } catch (e) { go = false; }
            if (!go) return;
        }
        setState({ activeIndex: null, editValues: { src: '', tgt: '' } });
    }

    // 保存原始输入内容（每次翻译都刷新；否则重新生成/原文视图会停留在第一段旧文本）
    AppState.originalInputText = AppState.inputText;

    let srcLang, tgtLang;
    if (AppState.isAutoDetect) {
        const detected = detectLanguage(AppState.inputText);
        srcLang = detected.src;
        tgtLang = detected.tgt;
        setState({ sourceLang: srcLang, targetLang: tgtLang }, true);
    } else {
        srcLang = AppState.sourceLang;
        tgtLang = AppState.targetLang;
    }

    setState({ isLoading: true, error: null });

    // 初始化AbortController
    const controller = new AbortController();
    AppState.mainAbortController = controller;

    // 这一次请求属于**哪一份文档**。从历史恢复 / 清空会把 docGeneration 加一，届时下面
    // 的核对就不成立，这份在途结果会被原地丢掉，而不是盖到用户刚恢复出来的文档上。
    const gen = AppState.docGeneration;
    // 真正送出去的那份文本。基线必须同步成**它**，不是响应落地那一刻输入框里的内容 ——
    // 后者会把「等待期间又敲进去的那句」一起算进基线，于是 TRANSLATE 从此静默失效。
    const sentText = AppState.inputText;

    try {
        const config = getApiConfig();
        const result = await translateBulk(sentText, srcLang, tgtLang, config, controller.signal);
        if (gen !== AppState.docGeneration) return;   // 屏幕上已经换成别的文档了

        // 必须是 length > 0，不能只判 `result?.translations`：空数组也是真值，
        // 会把屏幕上现有的整份译文换成 0 行 —— 一次「成功」的翻译反而销毁了内容。
        if (result?.translations?.length > 0) {
            const pairs = result.translations.map(t => ({
                src: t.src,
                tgt: t.tgt,
                brk: t.brk === true,
                srcRaw: (typeof t.srcRaw === 'string') ? t.srcRaw : undefined,
                history: [{ src: t.src, tgt: t.tgt }],
                historyIndex: 0,
                isUpdating: false,
                isRegenerating: false
            }));
            // ============= 顶掉屏幕上那一份之前，先把它存进归档 =============
            // 【实测的原始故障（本轮，与 handleClear / handleRegenerateAll 同一条规矩，这里独独漏了）】
            // 「翻译」和「清空」「从历史恢复」「整篇重新生成」一样是**整份文档替换**，可全文件
            // addToGlobalHistory 的调用点里一个都不是 handleTranslate。逐字复现（node vm 里跑真
            // handler，模型走哨兵协议桩）：粘一段 A → TRANSLATE（2 行）→ 把第 1 行译文改成
            // 「…【我校对过的译文A】」→ Update → 等 2.5 秒（此刻 diskHasA=true、savedAt=…669090，
            // 历史面板写着「已存到本地（IndexedDB），刷新页面可恢复」，globalHistory 里没有 A，
            // 因为默认 5 分钟自动存档还没跑到）→ 切 Edit 视图、整段粘上 B 覆盖 → TRANSLATE →
            // 等落地：diskHasA=false、diskGhHasA=false、memGhHasA=false、globalHistory 从 0 到 0，
            // confirms=[]、toasts=[]、error=null —— **零通知**，A_anywhere=false，永久不可恢复。
            // 下面那段「换一把归档钥匙」的注释讨论的正是这条路，但它只换了钥匙；前提
            //「A 已经有一个归档槽位」在自动存档跑到之前根本不成立。
            // 【为什么不学 handleRegenerateAll 那样「同一份文档就不换钥匙」】那边的源头就是屏幕上
            // 这份 pairs，「同一份文档」几乎是必然；这里的 sentText 来自大输入框，用户可能整份换过，
            // 唯一的判据只有首句前 60 个非空白字符那把尺子。尺子判错一次 = A 和 B 共用一个槽位，
            // 5 分钟后自动存档把 A 顶掉 —— 正是这次要根除的那类静默永久损坏。
            // 所以钥匙**无条件换**（下面那行原样不动），尺子只用来决定要不要弹那句提示：
            // 判错的代价是多一条/少一条 toast，不是一份文档。
            // 【这个选择的代价，实测量过】同一份文档连着翻 N 次（在大输入框里续写再 TRANSLATE，
            // 或者开着 AUTO SYNC 边写边翻）会留下 N 条归档，而不是 1 条：实测 4 次续写 →
            // globalHistory 1/2/3/4（Keep Last 默认 5）。被挤掉的永远是**最旧**的那条，
            // 而且整个过程在历史菜单里看得见、Keep Last 用户自己能调大。
            // 拿「有界、可见、可调的淘汰」换掉「5 分钟内静默永久毁掉一份已校对的文档」，
            // 这笔账是刻意这么算的 —— 别为了少几条归档把钥匙改成有条件换。
            const outgoing = Array.isArray(AppState.translationPairs) ? AppState.translationPairs : [];
            if (outgoing.length > 0) {
                addToGlobalHistory(outgoing, AppState.sessionId);
                try {
                    const head = (s) => String(s || '').replace(/\s+/g, '').slice(0, 60);
                    const onScreenHead = head(outgoing[0] && outgoing[0].src);
                    // 两边必须是同一把尺子量出来的：屏幕上那句 pair.src 是剥离颜色宏之后的文本
                    //（理由与 handleRegenerateAll 里那段逐字相同）。
                    let sentHead;
                    try { sentHead = head(stripTextColorForModel(sentText)); } catch (e) { sentHead = head(sentText); }
                    if (onScreenHead && sentHead.slice(0, onScreenHead.length) !== onScreenHead) {
                        showToast('这次翻译把屏幕上原来那份译文整份换掉了。原来那份已经存进「历史」菜单，'
                            + '可以从那里整体恢复回来。', 'info');
                    }
                } catch (e) {}
            }
            // ============= 换一份文档就要换一把归档钥匙 =============
            // 这一行把 translationPairs **整份**换掉 —— 屏幕上从此是另一份文档了。
            // 不换 sessionId 的话，「保存 A → 粘贴 B → 翻译 → 保存」会让 B 直接写进 A 的
            // 归档槽位（addToGlobalHistory 按 id 命中就整份替换 pairs），A 从此哪儿都不存在。
            // 实测过：那正是上一版留下的 B3。换钥匙之后 A 那一条原地不动，B 另开一条。
            setState({
                sessionId: xportNewSessionId(),
                translationPairs: pairs, isEditingMode: false, viewMode: 'preview', isLoading: false,
                lastTransportFailures: Number(result.failedCount) || 0
            });
            AppState.srcEditedSinceTranslate = false;
            // 仅在成功后同步基线：失败时保持旧基线，TRANSLATE 才能重试
            AppState.lastTranslatedText = sentText;
            // 逐段失败必须**说出来**：结果已经交付了（其余段都在），但有几行是失败标记。
            // 静默交付一份缺口文档，正是这次改动要杜绝的那类问题。
            // A7 把「公式整块被吞掉」并进同一条 toast —— 那是唯一一类
            // 「JSON 合法、分段完整、内容却没了」的损坏，别的检查全都看不见。
            AppState.lastEquationLoss = xportReportAfterTranslate(
                sentText, result.translations, Number(result.failedCount) || 0).lost;
            xportPersistSoon();
        }
    } catch (err) {
        if (gen !== AppState.docGeneration) return;   // 这份文档已经被换掉，报错也不再属于它
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "AI Translation failed. Please try again." });
            console.error(err);
        }
    } finally {
        // 只清理**自己那次**的状态。恢复历史 / 用户按 STOP 都会在这之前把 isLoading 归零、
        // 甚至已经开了新的一次请求；无条件清理会把新那次的 STOP 按钮和 loading 态一起废掉。
        const stillOurs = (AppState.mainAbortController === controller);
        if (stillOurs) {
            AppState.mainAbortController = null;
            if (AppState.isLoading) setState({ isLoading: false });
        }
    }
}

// 保存行更新
async function saveRowUpdate(index, manualValues = null) {
    const original = AppState.translationPairs[index];
    const currentSrc = manualValues ? manualValues.src : AppState.editValues.src;
    const currentTgt = manualValues ? manualValues.tgt : AppState.editValues.tgt;

    // 检查是否需要取消现有更新
    if (original.isUpdating) {
        const controller = AppState.rowAbortControllers.get(index);
        if (controller) {
            controller.abort();
            AppState.rowAbortControllers.delete(index);
            updateTranslationPair(index, { isUpdating: false });
            return;
        }
    }

    // 严格检查：如果完全没有变化，立即退出
    if (currentSrc === original.src && currentTgt === original.tgt) {
        return;
    }

    const srcChanged = currentSrc !== original.src;
    const tgtChanged = currentTgt !== original.tgt;
    const needsAiUpdate = (srcChanged && !tgtChanged) || (tgtChanged && !srcChanged);

    // 原文侧动过 = 大输入框（inputText）和重新生成的输入源（originalInputText）都过时了。
    // 切进 Edit 视图、或者直接按 TRANSLATE 时，syncInputFromPairs 会据此把整篇重建出来
    // 并同时更新这两个字段，用户的逐句改稿才不会在下一次翻译/重新生成时被整份抹掉。
    if (srcChanged) AppState.srcEditedSinceTranslate = true;

    updateTranslationPair(index, {
        src: currentSrc,
        tgt: currentTgt,
        isUpdating: needsAiUpdate
    });
    // ============= 用户手打的这两句，从落进 pairs 的这一刻起就要落盘 =============
    // 【实测的原始故障】上一行已经把用户按 Update 时框里的原文/译文写进 translationPairs 了
    // （屏幕上当场就是新的），可这条路上唯一会 xportPersistSoon 的是下面的 addHistory ——
    // 而智能更新在飞的时候再点一次 Update 就是**取消**：函数顶上那条分支
    // `if (original.isUpdating) { … updateTranslationPair(…, {isUpdating:false}); return; }`
    // 直接 return，addHistory 一次都不会跑。逐字复现（真 Chrome，qwen/qwen3.6-35b-a3b）：
    //   改第 1 行原文加 ` ZZCANCEL2.` → Update（智能更新开始飞）→ 60ms 后再点一次 Update 取消
    //   → 等 4 秒：内存/屏幕都是 "… ZZCANCEL2."，盘上还是没有它，savedAt 停在 1787262958381
    //   一个数没动，error=null；刷新之后那句手打的原文没了。
    // 取消的是**模型那次改写**，不是用户自己打的字 —— 后者必须留下。
    xportPersistSoon();
    // 原文侧动过、而大输入框正开着（Edit 视图里右栏的行照样能点开编辑）：当场把这处改动
    // 一起收进大输入框，否则用户回到框里敲一个字就会把上面那面旗抹掉（见 handleInputChange）。
    if (srcChanged) xportFoldPairsIntoLiveInput();

    let prompt = "";
    let updateField = null;

    if (srcChanged && !tgtChanged) {
        prompt = `You are updating a translation. Original Source: "${original.src}". Current Translation: "${original.tgt}". New Source: "${currentSrc}". Task: Translate the "New Source" to ${AppState.targetLang === 'zh' ? 'Chinese' : 'English'}. Constraint: Keep the style and vocabulary of the "Current Translation" where possible. Return JSON: {"text": "..."}`;
        updateField = "tgt";
    } else if (tgtChanged && !srcChanged) {
        prompt = `You are aligning a source text to match a modified translation. Original Source: "${original.src}". Original Translation: "${original.tgt}". New Translation: "${currentTgt}". Task: Update the "Original Source" in ${AppState.sourceLang === 'zh' ? 'Chinese' : 'English'} so that it matches the meaning AND TONE of the "New Translation". Return JSON: {"text": "..."}`;
        updateField = "src";
    }

    if (!updateField) {
        addHistory(index, currentSrc, currentTgt);
        return;
    }

    // AI更新（支持中止）
    const controller = new AbortController();
    AppState.rowAbortControllers.set(index, controller);

    try {
        const config = getApiConfig();
        const resultText = (await getSmartUpdate(prompt, config, controller.signal)) || (updateField === 'src' ? currentSrc : currentTgt);
        const finalSrc = updateField === 'src' ? resultText : currentSrc;
        const finalTgt = updateField === 'tgt' ? resultText : currentTgt;
        addHistory(index, finalSrc, finalTgt);
        // editValues 已在 addHistory 中同步更新
    } catch (e) {
        if (e.name !== 'AbortError') {
            console.error("Smart update failed", e);
            addHistory(index, currentSrc, currentTgt);
            setState({ error: e.message || "Smart update failed" });
        }
    } finally {
        AppState.rowAbortControllers.delete(index);
    }
}

// 添加历史记录
function addHistory(index, s, t) {
    const pairs = [...AppState.translationPairs];
    // 【这里曾经有一行 `if (pairs[index].src !== s) AppState.srcEditedSinceTranslate = true;`，
    //   实测它是一条把模型编的英文写进用户手稿的路（L3-1），已删】
    // 那一行的理由是「智能更新把原文改写掉的那条路也算原文改稿」。但 srcEditedSinceTranslate
    // 的含义只能有一个：**用户**动过原文栏，所以 pairs 才是这份文档的准绳。模型的回写不是。
    // 实测的完整链条（真 Chrome + jump 上的 qwen3.6-35b-a3b，也可用 stub 逐字复现）：
    //   ① 用户在第 0 行原文栏加了一句 ` SRCEDITMARK01.` → 切 Edit 视图 → 收进 inputText /
    //      originalInputText（这一步是对的，是本轮的修复）；
    //   ② 用户接着去校对**译文**：只改了 tgt，saveRowUpdate 走 `updateField='src'`，
    //      发出 "You are aligning a source text to match a modified translation…"，
    //      模型交回一句它自己编的英文，addHistory 把它写进 pairs[0].src ——
    //      用户手打的 SRCEDITMARK01 在这一行里没了（这是 HEAD 就有的行为，且逐行可撤销、看得见）；
    //   ③ 上面那一行把 srcEditedSinceTranslate 置成 true；
    //   ④ 随便切一次视图 → syncInputFromPairs 把 pairs 重建进 inputText **和**
    //      originalInputText —— 实测 `origHasMark:false, hasResearch:true`，模型编的英文
    //      成了整篇文档的新准绳，用户手打的那句在 AppState 里哪儿都不剩（只剩逐行撤销栈）。
    // 删掉这一行之后：模型回写只影响它那一行（HEAD 行为，屏幕上看得见、↺ 撤得回），
    // 不再有任何一条路把它升级成整篇覆盖。
    const newHistory = [...pairs[index].history, { src: s, tgt: t }];
    pairs[index] = {
        ...pairs[index],
        src: s,
        tgt: t,
        history: newHistory,
        historyIndex: newHistory.length - 1,
        isUpdating: false
    };
    
    // 同时更新 editValues 以保持同步，避免状态不一致
    if (AppState.activeIndex === index) {
        AppState.editValues = { src: s, tgt: t };
    }
    
    setState({ translationPairs: pairs });
    xportPersistSoon();
}

// 历史导航
function handleHistoryNav(index, delta) {
    const item = AppState.translationPairs[index];
    const newIdx = item.historyIndex + delta;
    if (newIdx >= 0 && newIdx < item.history.length) {
        const historic = item.history[newIdx];
        // 撤销/重做也会换原文 —— 这面旗的语义是「pairs 才是准绳」，所以它必须被真的收回来，
        // 不能设了之后允许一次击键把它抹掉（那正是本轮 F2 的根因）。收回的动作在下面
        // xportFoldPairsIntoLiveInput()：大输入框开着就当场收，没开着就交给 setViewMode('edit')。
        if (item.src !== historic.src) AppState.srcEditedSinceTranslate = true;
        const pairs = [...AppState.translationPairs];
        pairs[index] = { ...item, src: historic.src, tgt: historic.tgt, historyIndex: newIdx };
        
        // 同时更新 editValues 以保持同步
        if (AppState.activeIndex === index) {
            AppState.editValues = { src: historic.src, tgt: historic.tgt };
            // 撤销/重做把这一行的正文整段换掉了 —— 挂在旧正文上的选词弹窗从这一刻起
            // 指的是别的字。applySynonym 那边现在会核对并中止（F3），但一个「候选项还亮着、
            // 点下去只会告诉你失效了」的弹窗本身就是在骗人。直接收起来。
            if (AppState.synonymState && AppState.synonymState.show
                && AppState.synonymState.index === index) {
                updateSynonymState({ show: false, loading: false, errorMessage: '' });
            }
        }

        setState({ translationPairs: pairs });
        // ============= 撤销/重做也必须落盘 =============
        // 【实测的原始故障】上一版这里没有 xportPersistSoon()。
        // 【上一版这段注释写的是「这是全文件唯一一个会改内容、却不叫 xportPersistSoon() 的
        //   处理器」——那句话是错的。上上一版把它改成「本轮重新普查过全文…另外还有三处」，
        //   那句话**同样是错的**：独立验证随后又抓出两处普查漏掉的（第四、第五处）。
        //   到目前为止补齐的五处，都在各自位置写了实测证据：
        //     · saveRowUpdate 里 updateTranslationPair 那一处（智能更新被取消 → 手打的原文丢掉）；
        //     · syncInputFromPairs 重建成功那一支（改稿收回大输入框之后没人落盘）；
        //     · setViewMode（viewMode 本身就在快照里）；
        //     · handleInputChange 的「输入为空」分支（它在 xportPersistSoon() 之前就 return 了，
        //       而它同时清掉 translationPairs 和 inputText，是全文件改内容改得最狠的一处之一）；
        //     · toggleAutoDetect（isAutoDetect 在快照里、恢复时也读，就是没人存）。
        //   别再在任何地方写「唯一」，也别再写「已经普查过全文」——这两种断言在这个文件里
        //   每一次被独立复核都是错的。要说就说「这一处补上了」。】
        // 逐字复现（真 Chrome，127.0.0.1:8765）：改一行原文+译文 → Update（addHistory 落盘，
        // disk="…ZZUNDOTEST."，savedAt=1787260254382）→ 点这一行的 ↺ 撤销 → 等 4 秒：
        // 内存里是撤销后的文本，盘上还是撤销前的那份，savedAt **一个数都没动**（没写过），
        // 而历史面板同时写着「已存到本地（IndexedDB），刷新页面可恢复 · <时间>」。
        // 刷新之后被撤销掉的那一版原样回到屏幕上（undoSurvived:false），零提示、零报错。
        // 撤销是用户用来**挽回**误改的动作，挽回结果不落盘等于挽回了个寂寞。
        // 别指望 5 分钟自动存档或 pagehide 兜底：前者太晚，后者根本不提交
        //（见 DOMContentLoaded 里注册 pagehide / visibilitychange 那两行上面的注释）。
        xportPersistSoon();
        // ↺/↻ 换掉了这一行的原文，而右栏这几颗按钮在 **Edit 视图里也照样渲染**
        //（renderTargetPanel 不看 viewMode，实测撤销按钮和 #mainInput 同帧共存）。
        // 不当场把它收进大输入框，用户在框里敲一个字就会把上面那面旗抹掉，
        // 他刚刚亲手撤销掉的那一版会在下一次 TRANSLATE 时静默回到屏幕上（实测
        // undoSilentlyReverted:true，confirms=[]、toasts=[]、error=null）。
        xportFoldPairsIntoLiveInput();
    }
}

// AI精炼
async function handleAiRefine(index, field, type) {
    if (AppState.isRefining) return;
    setState({ isRefining: true });

    const text = field === 'src' ? AppState.editValues.src : AppState.editValues.tgt;
    const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;

    let instruction = undefined;
    if (type === 'grammar') instruction = AppState.customPrompts.grammar;
    if (type === 'simplify') instruction = AppState.customPrompts.simplify;

    try {
        const config = getApiConfig();
        const customInst = type === 'custom' ? AppState.refinePrompt : instruction;
        const refined = await refineSentence(text, lang, type, config, customInst);

        if (refined) {
            // 检测 AI 返回的 "无需修改" 标记或常见的无修改响应
            const noChangePatterns = [
                '[NO_CHANGES]',
                'already grammatically correct',
                'no grammar errors',
                'no changes needed',
                'text is correct',
                '没有语法错误',
                '语法正确',
                '无需修改'
            ];

            const isNoChange = noChangePatterns.some(pattern =>
                refined.toLowerCase().includes(pattern.toLowerCase())
            ) || refined.trim() === text.trim();

            if (isNoChange) {
                // 显示提示框而不是替换文本
                showToast(type === 'grammar' ? '✓ No grammar errors found' : '✓ Text is already simple enough', 'success');
            } else {
                const newVals = { ...AppState.editValues, [field]: refined };
                setState({ editValues: newVals }, true);
                await saveRowUpdate(index, newVals);
            }
        }
    } catch (e) {
        setState({ error: e.message || "Refinement failed" });
    } finally {
        setState({ isRefining: false });
        if (type === 'custom') setState({ refinePrompt: "" }, true);
    }
}

// 显示 Toast 提示
function showToast(message, type = 'info') {
    setState({ toast: { message, type } });
    setTimeout(() => {
        setState({ toast: null });
    }, 3000);
}

// 处理文本选择（同义词）
// ============= 选词/语法弹窗的请求令牌 =============
// 开一次新的弹窗请求：序号 +1、把上一次还在飞的请求取消掉、发一个新的 AbortController。
// 三个取数入口（新选中 / 切模式 / 翻页）**都必须**走它，漏掉任何一个，那一个就还会串线。
function beginSynonymRequest() {
    AppState.synonymReqSeq = (AppState.synonymReqSeq || 0) + 1;
    try { if (AppState.synonymAbort) AppState.synonymAbort.abort(); } catch (e) {}
    const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    AppState.synonymAbort = ctl;
    return { id: AppState.synonymReqSeq, signal: ctl ? ctl.signal : null };
}
// 这次请求还是不是「最新的那一次」。不是就必须原地 return —— 结果属于别的选区，
// 写进 state 就是 R1（把段落 A 的整句改写挂到选区 B 上）。
function synonymReqStale(myReq) {
    const s = AppState.synonymState || {};
    return s.reqId !== myReq;
}
// 主动取消不是失败。**这个判断不是可选的**：少了它，S2 会把原本静默的串线换成
// 每次快速重选都弹一句「请求失败：Aborted」—— 比它修的那个 bug 更烦人。
function isSynonymAbort(err) {
    return !!(err && err.name === 'AbortError');
}

async function handleTextSelect(event, field, index) {
    const target = event.target;
    let start = target.selectionStart;
    let end = target.selectionEnd;

    if (start === end) return;

    const text = target.value;
    let selectedText = text.substring(start, end);

    // 去除尾随空格（浏览器双击选词常常会包含尾随空格）
    const trimmedEnd = selectedText.replace(/\s+$/, '');
    if (trimmedEnd.length < selectedText.length) {
        end = start + trimmedEnd.length;
        selectedText = trimmedEnd;
        // 更新浏览器的选中范围
        target.setSelectionRange(start, end);
    }
    
    // 去除前导空格
    const trimmedStart = selectedText.replace(/^\s+/, '');
    if (trimmedStart.length < selectedText.length) {
        start = end - trimmedStart.length;
        selectedText = trimmedStart;
        target.setSelectionRange(start, end);
    }

    if (!selectedText || selectedText.length < 1 || /^\s*$/.test(selectedText)) return;

    // 每次全新选择都按设置里的默认模式打开，并重置三个模式的缓存
    const defaultMode = normalizeSynonymMode(AppState.synonymDefaultMode);

    // 选区所在的整句：语法模式的分析范围和整句替换范围都来自这里；算不准就是 null
    const sentenceRange = findSentenceRange(text, start, end);

    // 令牌必须在写 state **之前**拿到，并跟着这次 setState 一起落进 synonymState.reqId：
    // 上一次选择的响应回来时核对的就是它。
    const req = beginSynonymRequest();

    updateSynonymState({
        show: true,
        loading: true,
        originalText: selectedText,
        mode: defaultMode,
        historyByMode: emptySynonymHistory(),
        pageIndexByMode: emptySynonymPageIndex(),
        grammarNotes: [],
        errorMessage: "",
        position: { x: event.clientX, y: event.clientY },
        selectionRange: { start, end },
        sentenceRange,
        field,
        index,
        contextSentence: text,
        reqId: req.id
    });

    // 跨栏对应高亮：在另一侧把「意思对应的那一段」也高亮出来。
    // 完全异步、完全独立 —— 它失败也好、被关掉也好，同义词弹窗这条主链路一个字节都不受影响。
    scheduleCrossHighlight(field, index, selectedText);

    try {
        const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;
        const config = getApiConfig();
        const result = await fetchSynonymOptions(
            defaultMode, text, selectedText, lang, config, [],
            getGrammarScopeContext(AppState.synonymState), req.signal
        );

        // 更新的选区赢了：本次结果属于旧选区，一个字节都不能写进 state。
        if (synonymReqStale(req.id)) return;

        const cur = AppState.synonymState;
        const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
        curHb[defaultMode] = [result.alternatives];
        updateSynonymState({
            historyByMode: curHb,
            ...(result.note ? { grammarNotes: [result.note] } : {}),
            // 请求返回时用户可能已切到另一个模式：只有当前模式就是本次请求的模式才收起 loading
            ...(cur.mode === defaultMode ? { loading: false } : {})
        });
    } catch (err) {
        if (isSynonymAbort(err)) return;          // 主动取消：不是失败，不画任何东西
        if (synonymReqStale(req.id)) return;      // R2：慢的旧失败不许覆盖快的新成功
        console.error(err);
        // 不再直接关掉弹窗：把失败原因显示出来，用户还能切模式重试
        if (AppState.synonymState.show) {
            updateSynonymState({ loading: false, errorMessage: describeSynonymError(err) });
        }
    }
}

// 把异常压成一句可直接显示的中文（渲染路径只吃字符串，绝不吃 Error 对象）
function describeSynonymError(err) {
    let detail = '';
    try {
        detail = (err && typeof err.message === 'string') ? err.message : String(err || '');
    } catch (e) { detail = ''; }
    detail = detail.trim();
    if (detail.length > 120) detail = detail.slice(0, 120) + '…';
    return detail ? `请求失败：${detail}` : '请求失败，请稍后重试。';
}

// 同义词弹窗模式切换（替换 / 简化 / 语法修正）
async function handleSynonymModeSwitch(mode) {
    const s = AppState.synonymState || {};
    const newMode = normalizeSynonymMode(mode);
    if (normalizeSynonymMode(s.mode) === newMode) return; // 点击当前激活模式 = no-op

    const cached = getSynonymHistory(s, newMode);

    if (cached.length > 0) {
        // 该模式已有缓存：立即展示，不重新请求（锚点不变，renderSynonymPopupOnly 会按新高度重新夹紧）
        updateSynonymState({ mode: newMode, loading: false, errorMessage: "" });
        return;
    }

    // 该模式还没请求过：切换并拉取第 1 页
    const req = beginSynonymRequest();
    updateSynonymState({ mode: newMode, loading: true, errorMessage: "", reqId: req.id });

    if (!s.field) {
        updateSynonymState({ loading: false });
        return;
    }

    try {
        const lang = s.field === 'src' ? AppState.sourceLang : AppState.targetLang;
        const config = getApiConfig();
        const result = await fetchSynonymOptions(
            newMode, s.contextSentence, s.originalText, lang, config, [],
            getGrammarScopeContext(s), req.signal
        );

        if (synonymReqStale(req.id)) return;

        const cur = AppState.synonymState;
        const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
        curHb[newMode] = [result.alternatives];
        updateSynonymState({
            historyByMode: curHb,
            ...(result.note ? { grammarNotes: [result.note] } : {}),
            ...(normalizeSynonymMode(cur.mode) === newMode ? { loading: false } : {})
        });
    } catch (e) {
        if (isSynonymAbort(e)) return;
        if (synonymReqStale(req.id)) return;
        console.error(e);
        if (normalizeSynonymMode(AppState.synonymState.mode) === newMode) {
            updateSynonymState({ loading: false, errorMessage: describeSynonymError(e) });
        }
    }
}

// 同义词翻页（按当前模式独立分页；avoid 列表也按模式隔离）
async function handleSynonymPageChange(direction) {
    const s = AppState.synonymState || {};
    const mode = normalizeSynonymMode(s.mode);
    const history = getSynonymHistory(s, mode);
    const pb = (s.pageIndexByMode && typeof s.pageIndexByMode === 'object') ? s.pageIndexByMode : emptySynonymPageIndex();
    const pageIndex = getSynonymPageIndex(s, mode);
    const { contextSentence, originalText, field } = s;
