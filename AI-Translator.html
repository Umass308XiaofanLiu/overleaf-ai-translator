// ============= 辅助函数 =============
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 属性上下文专用。escapeHtml() 走 textContent→innerHTML，**不转义引号**，
// 所以 attr="${escapeHtml(x)}" 里只要 x 含一个 " 就能闭合属性并注入 onmouseover= 之类。
// 受影响的是「非白名单」变量：芯片 title 里的 errMsg（来自厂商 API 的 error.message，远端可控）
// 和搜索框 value（用户输入，且 setSettingsModelQuery 渲染后会主动 focus）。
function escapeAttr(value) {
    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============= 在线模型目录派生层 =============
// 全 UI（Settings 勾选框、模型下拉、顶栏标签、页脚状态）都只消费这里，不再有第二份 id 列表。
// 合并规则：DEFAULT_MODEL_CATALOG 打底 → API 结果按 id upsert（保留种子的 sub/tier/short）
//          → 种子里有但 API 没返回的打 retired 标记（**只打标不删**：可能只是这个 project key
//            没启用该模型，或列表接口有滞后）→ 最后钉住当前选中项，保证下拉永不丢失正在用的模型。
const MODEL_ICON_CLASS = {
    gemini: { lite: 'text-emerald-500', fast: 'text-orange-500', pro: 'text-indigo-600' },
    openai: { lite: 'text-teal-500',    fast: 'text-green-500',  pro: 'text-sky-600'   },
    claude: { lite: 'text-amber-500',   fast: 'text-orange-600', pro: 'text-rose-600'  }
};

// 给 API 拉回来的陌生模型猜一个档位（只影响图标和配色）
function classifyModelTier(id) {
    const s = String(id).toLowerCase();
    if (/nano|lite|haiku/.test(s)) return 'lite';
    if (/mini|flash|sonnet/.test(s)) return 'fast';
    return 'pro';
}

function decorateModel(entry) {
    const tier = entry.tier || classifyModelTier(entry.id);
    const palette = MODEL_ICON_CLASS[entry.provider] || MODEL_ICON_CLASS.gemini;
    return {
        ...entry,
        tier,
        sub: entry.sub || (entry.group === 'other' ? '未验证是否支持对话' : '来自 API'),
        icon: tier === 'lite' ? Icons.Rocket : (tier === 'fast' ? Icons.Zap : Icons.Cpu),
        iconClass: palette[tier] || 'text-slate-500',
        price: getModelPrice(entry.id)   // null = 不在内置价格表里，两处渲染点都要按「价格未知」兜底
    };
}

// 某个 provider 的完整目录
function getModelCatalog(provider) {
    const map = new Map();
    DEFAULT_MODEL_CATALOG
        .filter(m => m.provider === provider)
        .forEach(m => map.set(m.id, { ...m, builtin: true, retired: false, group: 'chat' }));

    const fetched = (AppState.fetchedModels && AppState.fetchedModels[provider]) || [];
    if (fetched.length > 0) {
        const fetchedIds = new Set(fetched.map(m => m.id));
        // 种子里有、这次 API 没返回的 → 标 retired，但保留（可能只是没权限/接口滞后）
        Array.from(map.keys()).forEach(k => {
            if (!fetchedIds.has(k)) map.set(k, { ...map.get(k), retired: true });
        });
        fetched.forEach(m => {
            const old = map.get(m.id);
            map.set(m.id, {
                id: m.id,
                name: m.name || (old && old.name) || m.id,
                sub: (old && old.sub) || '',
                short: (old && old.short) || '',
                tier: (old && old.tier) || '',
                provider: provider,
                group: m.group || 'chat',
                created: m.created || '',
                builtin: !!(old && old.builtin),
                retired: false
            });
        });
    }

    // 钉住：用户当前正在用的模型永远不会从下拉里消失。
    // 刻意**不自动切换** selectedModel —— /v1/models 不是权威（project key 的模型白名单会过滤输出、
    // 新模型有收录延迟、Gemini 的 Model schema 里根本没有 deprecated 字段）。
    if (AppState.apiProvider === provider && AppState.selectedModel && !map.has(AppState.selectedModel)) {
        const pinnedId = sanitizeModelId(AppState.selectedModel);
        if (pinnedId) {
            map.set(pinnedId, {
                id: pinnedId, name: pinnedId, sub: '未在列表中（仍可用）', short: '',
                provider: provider, group: 'chat', builtin: false, retired: true, pinned: true
            });
        }
    }

    return Array.from(map.values()).map(decorateModel);
}

// 「正在使用的模型永不从下拉里消失」。getModelCatalog 的 pinned 只在选中模型**不在** map 里
// 时才成立，而最常见的情况恰恰是它还在目录里（只是被标了 retired）—— 那时 pinned 为 false，
// 「隐藏所有未在 API 列表中的模型」/「全不选」会把它一起隐藏，用户再也切不回来。
// 所以钉住判定必须在这一层做，而不是只依赖 pinned。
function isPinnedModel(provider, m) {
    return !!m.pinned || (provider === AppState.apiProvider && m.id === AppState.selectedModel);
}

function getVisibleModels(provider) {
    return getModelCatalog(provider)
        .filter(m => isPinnedModel(provider, m) || AppState.modelVisibility[m.id] !== false);
}

function getModelMeta(id) {
    for (let i = 0; i < MODEL_PROVIDERS.length; i++) {
        const hit = getModelCatalog(MODEL_PROVIDERS[i]).find(m => m.id === id);
        if (hit) return hit;
    }
    const local = (AppState.localModels || []).find(lm => lm.id === id);
    return local
        ? { id: local.id, name: local.id, sub: '', tier: '', provider: 'local', icon: Icons.Server, iconClass: 'text-indigo-600' }
        : null;
}

// 顶栏按钮的短标签。内置模型直接用目录里的 short（保证与重构前逐字一致），
// API 新模型退化为「去掉厂商前缀 + 超 15 字截断」。
function getModelShortLabel(id) {
    const meta = getModelMeta(id);
    if (meta && meta.short) return meta.short;
    const fallback = String(id || '');
    let label = (meta && meta.name) || fallback;
    label = label.replace(/^(Google\s+)?(Gemini|ChatGPT|GPT|Claude)[\s-]*/i, '').trim() || fallback;
    return label.length > 15 ? label.slice(0, 15) + '...' : label;
}

// 相对时间：刚刚 / N 分钟前 / N 小时前 / M/D HH:mm
function formatModelRefreshTime(ts) {
    if (!ts) return '从未更新';
    const diff = Date.now() - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return `${Math.floor(diff / 60000)} 分钟前`;
    if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / 3600000)} 小时前`;
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 缓存是否超过 TTL —— 只用来改文案，绝不清空数据
function isModelCatalogStale(provider) {
    const st = AppState.modelRefresh[provider];
    return !!(st && st.at && (Date.now() - st.at) > MODEL_CATALOG_TTL);
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
}

// 弹窗位置自动调整函数
function adjustPopupPosition(popupId, padding = 10) {
    requestAnimationFrame(() => {
        const popup = document.getElementById(popupId);
        if (!popup) return;

        const rect = popup.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // 检查右边是否超出
        if (rect.right > viewportWidth - padding) {
            const overflow = rect.right - viewportWidth + padding;
            popup.style.transform = `translateX(-${overflow}px)`;
        }

        // 检查左边是否超出
        if (rect.left < padding) {
            popup.style.left = `${padding}px`;
            popup.style.right = 'auto';
        }

        // 检查底部是否超出
        if (rect.bottom > viewportHeight - padding) {
            // 如果底部超出，尝试显示在上方
            popup.style.top = 'auto';
            popup.style.bottom = '100%';
            popup.style.marginTop = '0';
            popup.style.marginBottom = '8px';
        }
    });
}

// 渲染后调整所有弹窗位置
function adjustAllPopups() {
    ['modelMenuPopup', 'historyMenuPopup', 'saveMenuPopup', 'synonymPopup'].forEach(id => {
        adjustPopupPosition(id);
    });
}

// ============= 左右双栏逐行对齐 =============
// 问题：左右两栏各自 space-y-2 堆自己的行，同一句的英文常比中文多折一行（如 163px vs 137px），
// 高度差沿页面向下累加 —— 实测 top 差 3 / 29 / 55 ... 一路涨到 393px。
// 另有一个常数偏移：两栏表头高度不等（70 vs 66.67），两个滚动容器的起点就差 3.33px。
//
// 修法（纯 CSS 做不到：两栏在两个独立的滚动容器里，无法互相知道对方那一行有多高）：
//   1) 表头 min-h-[70px] 抹掉常数偏移（见 renderSourcePanel / renderTargetPanel）；
//   2) 渲染后成对把 min-height 补到 max(左, 右)，短的那格多留白（预期且正确的代价）；
//   3) 两栏滚动条互相跟随，否则用户一滚就散架，对齐只是摆设。
//
// ⚠️ 这里只碰**行高**，绝不碰容器的 padding-top。
//    曾经有过一版「用两个滚动容器的视口 top 之差补 padding-top 兜底常数偏移」，
//    它在 lg 断点以下（<1024px，main 是 grid-cols-1）会致命：两栏这时是上下堆叠的，
//    那个「常数偏移」变成一整个面板的高度（实测 900px 宽时 298px），被原样写成源栏的留白，
//    整个源面板一片空白。而且它自测还「通过」——把源栏推下去确实让两栏同一行落在同一个屏幕 Y，
//    只是在堆叠布局里这个目标本身没有意义。表头已经用 min-h-[70px] 钉死等高，兜底纯属多余。
//
// ⚠️ 渲染路径 root.innerHTML 全程没有 try/catch，这里抛一次异常页面就永久冻死，
//    所以整个同步过程自带 try/catch，出错只打 warn，绝不允许冒泡。
// ⚠️ 读写严格分离：先一次性清空上一轮补白，再一次性读完所有高度（只触发一次强制重排），
//    最后一次性写回。绝不逐行「读一次写一次」，那是 layout thrash。
let alignSyncRaf = 0;              // 已排队的 rAF 句柄（0 = 没排队）
let alignSyncTimer = 0;            // 兜底定时器句柄
let alignSyncApplying = false;     // 正在写尺寸：此时 ResizeObserver 的回调是我们自己造成的，忽略
let alignRowObserver = null;
let alignNoopStreak = 0;           // 连续多少轮「观察器叫醒了我们、结果什么都不用改」
let alignSyncFromObserver = false; // 这一轮是不是 ResizeObserver 触发的（熔断只统计它）

function scheduleAlignSync() {
    if (alignSyncRaf || alignSyncTimer) return;   // 本轮已排队，合并掉
    const run = () => {
        if (alignSyncRaf) { cancelAnimationFrame(alignSyncRaf); alignSyncRaf = 0; }
        if (alignSyncTimer) { clearTimeout(alignSyncTimer); alignSyncTimer = 0; }
        syncBilingualAlignment();
    };
    // 页面可见时 rAF 先到：在这一帧绘制之前就改完样式，用户看不到中间态，不会闪。
    alignSyncRaf = requestAnimationFrame(run);
    // 但后台标签页里浏览器会**暂停** rAF，上面那次排队会一直悬着，后续渲染全被合并挡掉。
    // 定时器兜底把它捞回来；后台本来就不绘制，这条路径不可能造成闪烁。
    alignSyncTimer = setTimeout(run, 50);
}

// 「保住滚动位置地跑一次对齐」。给的是**渲染路径之外**那些会改变行几何的操作用的
// （目前只有句对行距的三个 handler）。
//
// 为什么不能直接用 scheduleAlignSync：
//   syncBilingualAlignment 为了量到自然高度，必须先把上一轮补的 minHeight 全部清空，
//   而清空的那一瞬间较短的那一栏（中文通常比英文矮）整体塌下去，滚动条上限跟着变小，
//   浏览器**当场**把它的 scrollTop 夹掉；等行高补回来，被夹掉的那截滚动位置已经没人记得了。
//   scheduleAlignSync 把这一切排进 rAF，调用方连「夹之前的值是多少」都拿不到。
// 所以这里照抄 renderApp 的做法：**先记下滚动位置 → 同步跑完对齐（两栏高度就此一致）
// → 再把位置写回去**。写回时两栏已经等高，赋值不会再被夹。
// 全程 try/catch：万一 DOM 还没就绪也只是这一次没对齐，绝不能把异常抛给调用方。
function alignSyncKeepingScroll() {
    try {
        const a = document.querySelector('[data-align-scroll="src"]');
        const b = document.querySelector('[data-align-scroll="tgt"]');
        // 两栏是联动的，逻辑上只有一个滚动位置；谁在就用谁的（和 renderApp 同一套判断）
        const saved = a ? a.scrollTop : (b ? b.scrollTop : 0);
        syncBilingualAlignment();
        if (a) a.scrollTop = saved;
        if (b) b.scrollTop = saved;
    } catch (e) {
        console.warn('[align] 保位对齐失败：', e && e.message);
    }
}

// ============= 字体落地后补一次对齐（TASK：math-heavy 尾行漂移 25px）=============
// 症状：源栏含 KaTeX 公式时，最后几行的 |top(src_i) - top(tgt_i)| 会破到 ~25px。
// 实测根因（main.tex 真实 24 段、1440px 视口）：
//   renderApp 里 syncBilingualAlignment 是**同步**跑的，那一刻 document.fonts.status
//   还是 'loading' —— Inter 和 KaTeX 那二十多个 webfont 都还没到。量到的是回退字体的行高。
//   431ms 后字体落地，文字/公式重新排版换行，最后一行源栏自然高度 239 → 263.9px（+24.9px），
//   而配对的译文行还钉在 239px 的 min-height 上，这一对就此差 24.9px，后面每一行再累加。
// 为什么原有的 ResizeObserver 兜不住：它不是可靠兜底 ——
//   ① 标签页被遮挡/切到后台时浏览器根本不跑渲染步骤，ResizeObserver 一次都不回调（实测）；
//   ② 文件里那个「连续 30 轮空转就 disconnect」的熔断器一旦触发，它就彻底不再补测。
// 所以显式挂在 document.fonts.ready 上补一刀。它是 Promise，不依赖 rAF/渲染步骤，
// 后台标签页里照样兑现，正好补上 ResizeObserver 覆盖不到的那一块。
//
// ⚠️ 必须走 alignSyncKeepingScroll 而不是 scheduleAlignSync：
//    syncBilingualAlignment 的「写 1」阶段会先清空所有 minHeight，矮的那一栏当场塌下去、
//    scrollTop 被浏览器夹掉（历史上这条路丢过 1230px 的滚动位置）。alignSyncKeepingScroll
//    是「存 scrollTop → 同步跑完 → 写回」，两栏跑完已等高，写回不会再被夹。
// ⚠️ 不和 ResizeObserver 打架：这一轮 alignSyncFromObserver 是 false，
//    syncBilingualAlignment 会照常重挂观察器；写尺寸期间 alignSyncApplying 挡掉观察器回调。
// ⚠️ 整个函数不可能抛：只有 typeof 判断 + try/catch，且 alignSyncKeepingScroll 自带 try/catch。
let alignFontSettlePending = false;
function scheduleAlignAfterFonts(depth) {
    try {
        if (alignFontSettlePending) return;              // 已经在等这一轮字体了，别重复挂
        const fonts = document.fonts;
        // status !== 'loading' = 没有待加载的字体，稳态下这里直接返回，零开销。
        if (!fonts || fonts.status !== 'loading') return;
        if (!fonts.ready || typeof fonts.ready.then !== 'function') return;
        const next = (depth || 0) + 1;
        alignFontSettlePending = true;
        fonts.ready.then(function () {
            alignFontSettlePending = false;
            alignSyncKeepingScroll();
            // 字体可能分批到达（第一批落地后新的字形才触发第二批），最多再等三轮，必然终止。
            if (next < 4) scheduleAlignAfterFonts(next);
        }, function () {
            alignFontSettlePending = false;
        });
    } catch (e) {
        alignFontSettlePending = false;
        console.warn('[align] 字体落地补测挂载失败：', e && e.message);
    }
}

function syncBilingualAlignment() {
    if (alignSyncApplying) return;
    alignSyncApplying = true;
    try {
        const srcBox = document.querySelector('[data-align-content="src"]');
        const tgtBox = document.querySelector('[data-align-content="tgt"]');
        if (!srcBox || !tgtBox) return;

        const srcRows = srcBox.children;
        const tgtRows = tgtBox.children;
        const n = Math.min(srcRows.length, tgtRows.length);
        if (n === 0) return;

        // 记下上一轮写进去的值，最后用来判断这一轮到底改没改（熔断依据，见文件末尾说明）
        const prev = new Array(n * 2);
        for (let i = 0; i < n; i++) {
            prev[i] = srcRows[i].style.minHeight;
            prev[n + i] = tgtRows[i].style.minHeight;
        }

        // ---- 写 1：清空上一轮的补白，让下面测到的是自然高度（否则永远只涨不缩）
        for (let i = 0; i < n; i++) {
            srcRows[i].style.minHeight = '';
            tgtRows[i].style.minHeight = '';
        }

        // ---- 读：一次性读完（这里触发本轮唯一一次强制重排）
        const srcH = new Array(n), tgtH = new Array(n);
        for (let i = 0; i < n; i++) srcH[i] = srcRows[i].getBoundingClientRect().height;
        for (let i = 0; i < n; i++) tgtH[i] = tgtRows[i].getBoundingClientRect().height;

        // ---- 写 2：成对补齐
        // 这里必须**向上取整**，不能直接用测到的小数高度：
        // 取小数时，高的那一侧 min-height 不生效（用自然高度 137.328），矮的那一侧生效（用 137.33），
        // 每行差个千分之几像素，几十行下来就攒出可见误差（实测 17 行攒到 0.15px，200 行就会破 1px）。
        // 取整后 ceil(max) 一定 >= 两侧的自然高度，两边都被 min-height 钉在同一个整数上，误差恒等于 0。
        // 代价是每行最多多留 1px 空白 —— 换来零累积，值。
        let changed = false;
        for (let i = 0; i < n; i++) {
            const px = Math.ceil(Math.max(srcH[i], tgtH[i])) + 'px';
            srcRows[i].style.minHeight = px;
            tgtRows[i].style.minHeight = px;
            if (prev[i] !== px || prev[n + i] !== px) changed = true;
        }

        // 熔断：只统计「观察器叫醒我们、结果一个字节都不用改」的连续轮次。
        // 判据不能是「频率高」——拖窗口边框时每帧都在真改，会误伤；
        // 也不能是「没改动」——渲染/打字触发的空跑很正常（菜单开关一下就是一次），
        // 连着 31 次就把观察器关掉纯属误杀。只有观察器自己在空转，才是真的回环。
        const fromObserver = alignSyncFromObserver;
        alignSyncFromObserver = false;
        alignNoopStreak = (fromObserver && !changed) ? alignNoopStreak + 1 : 0;
        if (alignNoopStreak > 30) {
            if (alignRowObserver) alignRowObserver.disconnect();
            console.warn('[align] 连续 30 轮空转，已停用行对齐观察器');
            return;
        }

        // 只有「不是观察器叫醒的」这一轮才重新挂观察器。
        // ResizeObserver 的 observe() 一定会先派发一次当前尺寸（哪怕尺寸压根没变），
        // 所以无条件 disconnect + 重新 observe 会自己喂自己：挂上 -> 立刻回调 -> 又挂上……
        // 实测一次 renderApp 就空转 33 轮、22.9ms，直到熔断器把观察器**关掉** ——
        // 观察器一关，字体/KaTeX 之后再改行高就没人补测了，恰好把它要保的东西弄丢。
        // 观察器触发的这一轮跳过重挂即可：之前的 observe 从没被撤销，照样盯着这些行。
        if (!fromObserver) observeAlignRows(srcRows, tgtRows, n);
    } catch (e) {
        console.warn('[align] 行对齐跳过：', e && e.message);
    } finally {
        alignSyncApplying = false;
    }
}

// 行高会因为编辑区 textarea 自动撑高、字体加载、KaTeX 重排等原因在渲染之后继续变，
// 所以盯住每一行的尺寸变化随时补测；ResizeObserver 只在「尺寸真的变了」时才回调，
// 而我们清空后写回的是同一个值（帧末尺寸不变），所以最多再跑一轮就收敛。
function observeAlignRows(srcRows, tgtRows, n) {
    if (typeof ResizeObserver === 'undefined') return;
    if (!alignRowObserver) {
        alignRowObserver = new ResizeObserver(() => {
            if (alignSyncApplying) return;   // 这次尺寸变化是我们自己刚写的，不是新情况
            alignSyncFromObserver = true;
            scheduleAlignSync();
        });
    }
    alignRowObserver.disconnect();
    for (let i = 0; i < n; i++) {
        alignRowObserver.observe(srcRows[i]);
        alignRowObserver.observe(tgtRows[i]);
    }
}

// 两栏滚动联动。注意：顶栏那个 AUTO SYNC 按钮跟滚动毫无关系（它是 isAutoTranslate，
// 停止输入 1.5s 后自动触发一次翻译），所以这里必须自己把两栏绑在一起，
// 否则用户一滚动，上面辛苦对齐的行立刻又错开。
function bindPaneScrollSync() {
    try {
        const a = document.querySelector('[data-align-scroll="src"]');
        const b = document.querySelector('[data-align-scroll="tgt"]');
        if (!a || !b) return;
        // 不用「加锁 + 稍后解锁」那一套：解锁得挂在定时器或 rAF 上，
        // 后台标签页里 rAF 是暂停的，锁会永久卡住，联动直接失效。
        // 改成自终止判据：两边已经一样就什么都不做。
        // 于是 A 改 B 触发的那次回声进来时条件不成立，自然停下，不需要任何标志位。
        // 0.5px 容差是给高 DPI 下 scrollTop 的小数回读留的，防止两边互相追着差 0.001px。
        const link = (from, to) => () => {
            if (Math.abs(to.scrollTop - from.scrollTop) < 0.5) return;
            to.scrollTop = from.scrollTop;
        };
        // 每次 renderApp 都是全新节点，旧监听器随旧节点一起被丢弃，不会叠加
        a.addEventListener('scroll', link(a, b), { passive: true });
        b.addEventListener('scroll', link(b, a), { passive: true });
    } catch (e) {
        console.warn('[align] 滚动联动绑定失败：', e && e.message);
    }
}

// ============= 翻译对形状归一（渲染路径唯一的一道防线）=============
// 为什么非有不可：renderApp 走 root.innerHTML，外面**没有 try/catch**。
// translationPairs 里只要混进一个 null / 空洞，renderPairRow 读 pair.src 当场抛，
// 整页永久冻死在上一帧，之后每次点击再抛一次，不刷新页面救不回来。
//
// 已验证的真实产生路径（不是假想）：updateTranslationPair(index, …) 用**过期的行号**回写。
//   handleRegenerateTranslation / saveRowUpdate 都是「先 await 网络，finally 里再回写」，
//   而这段等待期间 Regenerate All / 恢复历史快照 完全可能把行数变少。于是
//       const pairs = [...translationPairs];      // 现在只有 3 行
//       pairs[7] = { ...pairs[7], ...updates };   // {...undefined} = {}，还顺手把 3~6 填成空洞
//   下一次渲染读 pairs[3].src → TypeError → 冻页。
// 次要来源：模型返回的 JSON 直接进状态（handleTranslate/handleRegenerateAll 里
//   `t.src` / `t.tgt` 一个类型都不查），弱模型漏字段就会得到 src/tgt 是 undefined 的单边行。
//
// 修法选**最省的一处**：在渲染入口把整份数组过一遍并写回 AppState，
// 之后所有读它的地方（复制原文、addHistory、历史导航、attachEventListeners）拿到的也都是干净的。
// 不在各个使用点分散加判断 —— 这个代码库里「删掉/收敛到一处」的修法成功过，「到处加机制」的没有。
//
// 全程不可能抛：只有 typeof / Array.isArray / 算术，不调用任何外部函数。
// 形状全对时**原样返回同一个数组、不新建任何对象**，所以稳态下开销只是一轮 typeof 检查。
function normalizePairText(v) {
    if (typeof v === 'string') return v;
    if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '';
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return '';   // null / undefined / 对象 / 数组 / Symbol 一律当空串（渲染成空行，不抛）
}

// 「干净」的判据必须覆盖渲染路径读到的每一个字段：
// 非编辑态读 pair.src / pair.tgt / pair.isUpdating，编辑态还要读 pair.history.length
// 和 pair.historyIndex（renderHistoryControls），后两个是编辑态独有的抛点。
function isCleanPair(p) {
    return !!p && typeof p === 'object'
        && typeof p.src === 'string' && typeof p.tgt === 'string'
        && Array.isArray(p.history) && p.history.length > 0
        && typeof p.historyIndex === 'number'
        && p.historyIndex >= 0 && p.historyIndex < p.history.length;
}

function normalizePair(p) {
    const o = (p && typeof p === 'object') ? p : {};
    const src = normalizePairText(o.src);
    const tgt = normalizePairText(o.tgt);
    let history = [];
    if (Array.isArray(o.history)) {
        for (let i = 0; i < o.history.length; i++) {
            const h = o.history[i];
            if (h && typeof h === 'object') {
                history.push({ src: normalizePairText(h.src), tgt: normalizePairText(h.tgt) });
            }
        }
    }
    // history 至少要有一条：renderHistoryControls 显示的是 `${historyIndex + 1}/${history.length}`，
    // 空数组会显示 1/0，撤销/重做两个按钮的 disabled 判据也会失去意义。
    if (history.length === 0) history = [{ src: src, tgt: tgt }];
    let hi = (typeof o.historyIndex === 'number' && Number.isFinite(o.historyIndex))
        ? Math.floor(o.historyIndex) : history.length - 1;
    if (hi < 0) hi = 0;
    if (hi > history.length - 1) hi = history.length - 1;
    return {
        src: src, tgt: tgt, history: history, historyIndex: hi,
        isUpdating: !!o.isUpdating, isRegenerating: !!o.isRegenerating
    };
}

function normalizeTranslationPairs(list) {
    if (!Array.isArray(list)) return [];   // null / undefined / 对象 → 空列表，renderSourcePanel 读 .length 才不会抛
    for (let i = 0; i < list.length; i++) {
        if (!isCleanPair(list[i])) {
            const out = new Array(list.length);   // 逐位赋值，顺便把空洞填实
            for (let j = 0; j < list.length; j++) out[j] = normalizePair(list[j]);
            return out;
        }
    }
    return list;   // 全干净：原样返回，零分配
}

// ============= 渲染错误边界 =============
// 这一段是整个文件里唯一一处「把整页从永久冻死里救回来」的代码。
//
// 【要救的是什么】
//   setState() -> renderApp() -> root.innerHTML = `<一整个模板字符串>`，全程没有 try/catch。
//   模板字符串是**先拼完再赋值**的，所以拼的过程中任何一处抛错：
//     · root.innerHTML 那一行根本没执行 —— 页面停在**上一帧**。看上去还活着，实际上此后
//       每一次 setState 都在同一处再抛一次，用户不刷新永远救不回来，控制台之外没有任何提示；
//     · 首次渲染时上一帧是空的 —— 用户看到的是一张白页，同样没有任何提示。
//   真实踩过的抛点（不是假想）：renderFormattedText 收到真值非字符串；translationPairs 里
//   混进 literal null（updateTranslationPair 用过期行号写出空洞，History 的 JSON 往返把空洞
//   变成 null）。浮动对话窗当初被刻意挂到 #root **外面**，就是因为这条路径会带走 #root 里的一切。
//
// 【为什么不能只写一个 try{}catch{} 就算完】
//   吞掉异常比不加更糟：不加的时候至少「看得见的那一帧是旧的 + 控制台里有红字」，吞掉之后
//   连红字都没有，应用会安静地永远显示陈旧或半截界面。所以这个边界的合同是五条：
//     1) 绝不吞：每一次捕获都同时 (a) console.error 带真栈 (b) 弹一个用户不可能错过的面板；
//     2) 绝不动用户正文：边界自己不写 localStorage、不调 addToGlobalHistory / setState，
//        不碰 translationPairs / inputText / originalInputText / editValues；
//     3) 给真的退路：自动重试一次（只清浮层类状态）+ 手动重试 + 正文备份（复制/下载）+ 刷新；
//     4) 边界自身不可能抛：面板全部用 createElement/textContent 造、挂在 <body> 上
//        （对话窗已实测这个位置扛得住 root.innerHTML 全量重建），每一步各自 try/catch，
//        并且不假设 AppState 是好的；
//     5) 绝不自转：同一个错误签名只自动重试一次，连续失败到上限后只累加计数、不再重排渲染。
//
// ⚠️ 一条决定了面板措辞的硬事实：**globalHistory 只活在内存里**。全文没有任何一处
//    localStorage.setItem 落盘 translationPairs / inputText / globalHistory（可自行搜证）。
//    所以「刷新页面」= 正文全部丢失。面板里因此把「先备份」排在「刷新」前面，
//    刷新按钮还要过一次 confirm()。
const RB_LOG_MAX = 50;           // 记录环形上限；只为排查，不显示全部
const RB_STREAK_MAX = 3;         // 连续失败到这个数就不再自动重试（防 CPU 空转）
const RB_ASYNC_PANEL_MAX = 3;    // 异步错误最多主动弹 3 次面板，之后只累加计数（防第三方脚本刷屏）
const RB_RESCUE_MAX_CHARS = 8 * 1024 * 1024;   // 备份文本硬上限，防止归档巨大时把内存顶爆

// 刻意是一个独立对象而不是 AppState 的字段：放进 AppState 就意味着
// 「记录一次渲染失败」本身可能触发一次渲染 —— 那正是要躲开的东西。
const RENDER_BOUNDARY = {
    ok: 0,             // 已经完整跑完的渲染次数（0 = 还没有过任何一帧 => 首次渲染）
    okAtFail: 0,       // 最近一次渲染失败发生时 ok 的值。面板要说的是「这次失败之后成功了几次」，
                       // 用它做基线；直接印 ok 就是把一辈子的成功次数当成恢复次数，永远偏乐观。
    fail: 0,           // 累计捕获到的渲染异常条数
    streak: 0,         // 连续失败次数，成功一次即归零；自动重试的熔断依据
    retries: 0,        // 自动重试实际跑过几次
    wrote: false,      // 本轮 root.innerHTML 是否已经赋值成功（决定面板说「上一帧」还是「半帧」）
    depth: 0,          // 重入深度：渲染过程中再调 renderApp 时不再套第二层边界
    lastRetrySig: '',  // 上次自动重试针对的错误签名；同签名不再重试第二遍
    asyncSeen: 0,      // window error / unhandledrejection 累计条数
    asyncShown: 0,     // 其中真正弹过面板的条数
    log: [],           // { at, kind, message, stack } 环形记录，给排查和自动化验收用
    visible: false,
    shownKind: '',     // 面板此刻显示的是哪一类故障（rbShow 的 kind）。恢复文案只许改写渲染类的那两种，
                       // 否则一次成功渲染会把正显示着的「颜色宏没能剥离」顶掉，等于把另一件事的告知吞了。
    titleSaved: null,
    stripGaveUp: 0,    // \textcolor 剥离放弃的累计次数（与渲染失败共用面板，但计数分开）
    el: null, msgEl: null, whereEl: null, statusEl: null, detailEl: null,
    taEl: null, countEl: null, titleEl: null, btns: null
};

// 任何值 -> 字符串，且**保证不抛**（Symbol 的 String() 会抛，对象的 toString 可能是用户数据里的陷阱）
function rbText(v) {
    try {
        if (typeof v === 'string') return v;
        if (v == null) return '';
        if (typeof v === 'object') {
            try { return JSON.stringify(v); } catch (e) { return '[object]'; }
        }
        return String(v);
    } catch (e) { return ''; }
}

// 错误签名：消息 + 栈顶那一行。用来判断「这是不是刚才那个错」，决定要不要再自动重试一次。
function rbSignature(err) {
    try {
        const msg = (err && err.message != null) ? rbText(err.message) : rbText(err);
        const st = (err && err.stack) ? String(err.stack).split('\n')[1] || '' : '';
        return (msg + '|' + st.trim()).slice(0, 300);
    } catch (e) { return 'unknown'; }
}

// 栈顶那一行里的 AI-Translator.html:<行号>，给面板显示「大概在哪炸的」
function rbWhere(err) {
    try {
        const st = err && err.stack ? String(err.stack) : '';
        const m = /([\w.\-]+\.html):(\d+)(?::(\d+))?/.exec(st);
        if (m) return m[1] + ':' + m[2];
        const l = st.split('\n')[1];
        return l ? l.trim().slice(0, 120) : '';
    } catch (e) { return ''; }
}

function rbRecord(kind, err) {
    try {
        RENDER_BOUNDARY.log.push({
            at: Date.now(), kind: kind,
            message: (err && err.message != null) ? rbText(err.message) : rbText(err),
            stack: (err && err.stack) ? String(err.stack).split('\n').slice(0, 24).join('\n') : ''
        });
        if (RENDER_BOUNDARY.log.length > RB_LOG_MAX) RENDER_BOUNDARY.log.shift();
    } catch (e) {}
}

// ---- 正文备份 ----
// 只读 AppState，逐字段各自兜底；includeArchive=true 时把 globalHistory 里的历史快照也带上
// （它同样只在内存里，刷新即丢，所以下载版必须包含它才算真的「备份」）。
function rbRescueText(includeArchive) {
    const out = [];
    const push = (s) => { try { out.push(s); } catch (e) {} };
    try {
        push('===== AI-Translator 正文应急备份 =====');
        try { push('时间：' + new Date().toISOString()); } catch (e) {}
        push('说明：本页的正文只存在于内存中，刷新页面会全部丢失。此文件是渲染失败时抓下来的原始内容。');
        push('');
        let pairs = null;
        try { pairs = AppState.translationPairs; } catch (e) {}
        if (Array.isArray(pairs)) {
            push('----- 句对（共 ' + pairs.length + ' 行）-----');
            for (let i = 0; i < pairs.length; i++) {
                let p = null;
                try { p = pairs[i]; } catch (e) {}
                const src = (p && typeof p === 'object') ? rbText(p.src) : '';
                const tgt = (p && typeof p === 'object') ? rbText(p.tgt) : '';
                push('--- #' + (i + 1) + ' 原文 ---');
                push(src);
                push('--- #' + (i + 1) + ' 译文 ---');
                push(tgt);
                push('');
            }
        } else {
            push('----- 句对：不是数组（' + Object.prototype.toString.call(pairs) + '）-----');
        }
        try {
            const ev = AppState.editValues;
            if (ev && typeof ev === 'object' && (rbText(ev.src) || rbText(ev.tgt))) {
                push('----- 编辑框里尚未保存的内容（activeIndex=' + rbText(AppState.activeIndex) + '）-----');
                push('原文侧：' + rbText(ev.src));
                push('译文侧：' + rbText(ev.tgt));
                push('');
            }
        } catch (e) {}
        try {
            push('----- 输入框原文（inputText）-----');
            push(rbText(AppState.inputText));
            push('');
            push('----- 最初粘贴的原文（originalInputText）-----');
            push(rbText(AppState.originalInputText));
            push('');
        } catch (e) {}
        if (includeArchive) {
            try {
                const hist = AppState.globalHistory;
                if (Array.isArray(hist) && hist.length) {
                    push('===== 内存里的历史快照（共 ' + hist.length + ' 份，刷新同样会丢）=====');
                    for (let h = 0; h < hist.length; h++) {
                        const item = hist[h] || {};
                        push('--- 快照 ' + (h + 1) + ' id=' + rbText(item.id) + ' ---');
                        const hp = item.pairs;
                        if (Array.isArray(hp)) {
                            for (let i = 0; i < hp.length; i++) {
                                const q = hp[i];
                                push('  [' + (i + 1) + '] 原文：' + ((q && typeof q === 'object') ? rbText(q.src) : ''));
                                push('  [' + (i + 1) + '] 译文：' + ((q && typeof q === 'object') ? rbText(q.tgt) : ''));
                            }
                        }
                        push('');
                    }
                }
            } catch (e) {}
        }
    } catch (e) {
        push('（备份过程中出错：' + rbText(e && e.message) + '；以上是抓到的部分）');
    }
    let s = '';
    try { s = out.join('\n'); } catch (e) { s = ''; }
    if (s.length > RB_RESCUE_MAX_CHARS) s = s.slice(0, RB_RESCUE_MAX_CHARS) + '\n…（已截断，超过备份上限）';
    return s;
}

// ---- 面板（全部 createElement/textContent，任何一步失败都只是少一块，不会把边界带走）----
function rbStyle(el, css) {
    try { for (const k in css) { try { el.style[k] = css[k]; } catch (e) {} } } catch (e) {}
}

function rbButton(label, onClick, primary) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    rbStyle(b, {
        cursor: 'pointer', border: '1px solid ' + (primary ? '#be123c' : '#cbd5e1'),
        background: primary ? '#e11d48' : '#f8fafc',
        color: primary ? '#fff' : '#0f172a',
        borderRadius: '9px', padding: '6px 11px', fontSize: '12px',
        fontWeight: primary ? '600' : '500', marginRight: '6px', marginTop: '6px'
    });
    try { b.addEventListener('click', function () { try { onClick(); } catch (e) { try { console.error('[render-boundary] 按钮处理失败', e); } catch (_) {} } }); } catch (e) {}
    return b;
}

function rbEnsurePanel() {
    const RB = RENDER_BOUNDARY;
    if (RB.el) {
        try { if (!RB.el.parentNode && document.body) document.body.appendChild(RB.el); } catch (e) {}
        return RB.el;
    }
    try {
        if (!document || !document.body || typeof document.createElement !== 'function') return null;

        const box = document.createElement('div');
        box.id = 'renderBoundaryPanel';
        // 「用户不可能错过」也要对读屏用户成立：assertive 的 live region 会在面板出现时直接朗读。
        try { box.setAttribute('role', 'alert'); box.setAttribute('aria-live', 'assertive'); } catch (e) {}
        // z 预算：对话窗是 2147483000、它的拖动遮罩是 2147482000。这个面板必须盖在最上面，
        // 否则「页面炸了」的告知会被一个还在正常工作的浮窗挡住。
        rbStyle(box, {
            position: 'fixed', top: '12px', left: '50%', transform: 'translateX(-50%)',
            zIndex: '2147483600', width: 'min(760px, calc(100vw - 24px))',
            maxHeight: '86vh', overflowY: 'auto', boxSizing: 'border-box',
            background: '#ffffff', color: '#0f172a',
            border: '2px solid #e11d48', borderRadius: '14px',
            boxShadow: '0 18px 50px rgba(15,23,42,.30)',
            padding: '14px 16px',
            fontFamily: 'ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
            fontSize: '13px', lineHeight: '1.6'
        });

        const head = document.createElement('div');
        rbStyle(head, { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' });
        const title = document.createElement('strong');
        // 面板不止服务于渲染失败（见 rbShow 的 kind 表），所以标题由 rbShow 按 kind 改写；
        // 这里的默认值只是它最常见的那一种。
        title.textContent = '⚠ 页面渲染出错';
        rbStyle(title, { color: '#be123c', fontSize: '15px' });
        const countEl = document.createElement('span');
        rbStyle(countEl, { color: '#64748b', fontSize: '12px' });
        const spacer = document.createElement('span');
        rbStyle(spacer, { flex: '1 1 auto' });
        const closeBtn = rbButton('关闭', function () { rbHide(); }, false);
        rbStyle(closeBtn, { marginRight: '0', marginTop: '0' });
        head.appendChild(title); head.appendChild(countEl); head.appendChild(spacer); head.appendChild(closeBtn);
        box.appendChild(head);

        const msgEl = document.createElement('div');
        rbStyle(msgEl, { marginBottom: '4px' });
        box.appendChild(msgEl);

        const whereEl = document.createElement('div');
        rbStyle(whereEl, {
            marginBottom: '8px', color: '#334155', fontSize: '12px',
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            wordBreak: 'break-all'
        });
        box.appendChild(whereEl);

        const hintEl = document.createElement('div');
        hintEl.textContent = '正文只存在于内存里（本页从不把译文落盘）。刷新页面会全部丢失 —— 请先「复制」或「下载」备份，再考虑刷新。';
        rbStyle(hintEl, {
            background: '#fff7ed', border: '1px solid #fed7aa', color: '#9a3412',
            borderRadius: '9px', padding: '7px 10px', fontSize: '12px', marginBottom: '4px'
        });
        box.appendChild(hintEl);

        const bar = document.createElement('div');
        const bCopy = rbButton('复制正文备份', function () { rbCopy(); }, true);
        const bDown = rbButton('下载备份 .txt', function () { rbDownload(); }, false);
        const bRetry = rbButton('重试渲染', function () { rbManualRetry(); }, false);
        const bDetail = rbButton('详细堆栈', function () { rbToggleDetail(); }, false);
        const bReload = rbButton('刷新页面', function () { rbReload(); }, false);
        bar.appendChild(bCopy); bar.appendChild(bDown); bar.appendChild(bRetry);
        bar.appendChild(bDetail); bar.appendChild(bReload);
        box.appendChild(bar);

        const statusEl = document.createElement('div');
        rbStyle(statusEl, { color: '#0f766e', fontSize: '12px', minHeight: '18px', marginTop: '4px' });
        box.appendChild(statusEl);

        // 备份文本框：即使剪贴板 API 被浏览器拒绝（file:// 下常见），用户也永远有一条
        // 「全选 + Ctrl+C」的手动出路。默认收起，点「复制正文备份」时展开并自动选中。
        const taEl = document.createElement('textarea');
        taEl.readOnly = false;
        rbStyle(taEl, {
            display: 'none', width: '100%', boxSizing: 'border-box', height: '180px',
            marginTop: '8px', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '12px', border: '1px solid #cbd5e1', borderRadius: '9px', padding: '8px',
            whiteSpace: 'pre', background: '#f8fafc'
        });
        box.appendChild(taEl);

        const detailEl = document.createElement('pre');
        rbStyle(detailEl, {
            display: 'none', marginTop: '8px', maxHeight: '260px', overflow: 'auto',
            background: '#0f172a', color: '#e2e8f0', borderRadius: '9px', padding: '10px',
            fontSize: '11px', lineHeight: '1.5', whiteSpace: 'pre-wrap', wordBreak: 'break-all'
        });
        box.appendChild(detailEl);

        document.body.appendChild(box);

        RB.el = box; RB.msgEl = msgEl; RB.whereEl = whereEl; RB.statusEl = statusEl;
        RB.detailEl = detailEl; RB.taEl = taEl; RB.countEl = countEl; RB.titleEl = title;
        RB.btns = { copy: bCopy, download: bDown, retry: bRetry, detail: bDetail, reload: bReload, close: closeBtn };
        return box;
    } catch (e) {
        try { console.error('[render-boundary] 面板构建失败（异常本身见下一条）', e); } catch (_) {}
        return null;
    }
}

function rbSetStatus(s) {
    try { if (RENDER_BOUNDARY.statusEl) RENDER_BOUNDARY.statusEl.textContent = rbText(s); } catch (e) {}
}

function rbCopy() {
    const text = rbRescueText(false);
    try {
        if (RENDER_BOUNDARY.taEl) {
            RENDER_BOUNDARY.taEl.value = text;
            RENDER_BOUNDARY.taEl.style.display = 'block';
            try { RENDER_BOUNDARY.taEl.focus(); RENDER_BOUNDARY.taEl.select(); } catch (e) {}
        }
    } catch (e) {}
    // 先给一句**同步**的回执再去碰剪贴板：clipboard.writeText 是异步的，
    // 只在 then/catch 里写状态的话，点下按钮到状态出现之间是一段「什么都没发生」的空白，
    // 而这正是用户最需要确定「我的字保住了没有」的时刻。文本框此刻已经填好且全选，
    // 所以这句话在任何浏览器上都是真的。剪贴板真的成功了再把它升级成更好的那一句。
    rbSetStatus('备份已放进下面的文本框并全选（' + text.length + ' 字符），按 Ctrl+C / ⌘C 即可复制。');
    try {
        if (navigator && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            const p = navigator.clipboard.writeText(text);
            if (p && typeof p.then === 'function') {
                p.then(function () { rbSetStatus('已复制到剪贴板（' + text.length + ' 字符）。下面的文本框里也有一份。'); },
                       function () { rbSetStatus('剪贴板被浏览器拒绝了。文本已经放在下面的框里并全选，按 Ctrl+C / ⌘C 即可。'); });
            }
        }
    } catch (e) { /* 同步回执已经给过，这里不需要再改文案 */ }
}

function rbDownload() {
    const text = rbRescueText(true);
    try {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        let stamp = '';
        try { stamp = new Date().toISOString().replace(/[:.]/g, '-'); } catch (e) { stamp = String(Date.now()); }
        a.download = 'AI-Translator-rescue-' + stamp + '.txt';
        rbStyle(a, { display: 'none' });
        document.body.appendChild(a);
        a.click();
        try { document.body.removeChild(a); } catch (e) {}
        try { setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000); } catch (e) {}
        rbSetStatus('已触发下载（' + text.length + ' 字符，含内存里的历史快照）。');
        return;
    } catch (e) {
        try { console.error('[render-boundary] 下载失败', e); } catch (_) {}
    }
    // 下载这条路走不通时，退回文本框，用户仍然有一条完整的出路
    try {
        if (RENDER_BOUNDARY.taEl) {
            RENDER_BOUNDARY.taEl.value = text;
            RENDER_BOUNDARY.taEl.style.display = 'block';
            try { RENDER_BOUNDARY.taEl.focus(); RENDER_BOUNDARY.taEl.select(); } catch (e2) {}
        }
    } catch (e2) {}
    rbSetStatus('这个环境不允许下载。完整备份已经放在下面的框里，请手动复制保存。');
}

function rbToggleDetail() {
    try {
        const d = RENDER_BOUNDARY.detailEl;
        if (!d) return;
        d.style.display = (d.style.display === 'block') ? 'none' : 'block';
    } catch (e) {}
}

function rbReload() {
    try {
        const ok = (typeof confirm === 'function')
            ? confirm('刷新会丢掉这一页的全部正文（本页从不把译文存到磁盘）。确定已经备份好了吗？')
            : true;
        if (!ok) { rbSetStatus('已取消刷新。'); return; }
        location.reload();
    } catch (e) {
        try { console.error('[render-boundary] 刷新失败', e); } catch (_) {}
    }
}

// 手动重试：把熔断计数清零后重新走一遍**带边界的** renderApp。
// 它只可能由用户点击触发，所以不存在自转风险；失败时面板会自己更新成最新的错。
function rbManualRetry() {
    try {
        RENDER_BOUNDARY.streak = 0;
        RENDER_BOUNDARY.lastRetrySig = '';
        rbSetStatus('正在重试渲染…');
        renderApp(false);
        // renderApp 失败时会走 rbShow，而 rbShow 会把状态行清空（不许拿旧回执糊新故障），
        // 所以这里按 streak 补一句结论：成功说成功，还失败就说还失败，不留空。
        // ⚠️ 只能说「仍然失败」，不能说「还是同样的错」：这里唯一读到的事实是 streak，
        //    它分不出第二次抛的是不是同一个错。上方的错误行已经被 rbShow 换成了最新那一次，
        //    真要判断是不是同一个错，看那一行即可 —— 由文案替用户下这个结论就是在瞎猜。
        if (RENDER_BOUNDARY.streak === 0) rbSetStatus('重试成功，界面已经是最新的。可以关掉这个面板继续用了。');
        else rbSetStatus('重试之后仍然失败，上方显示的是最新的那一次错误。请先备份正文，再刷新页面。');
    } catch (e) {
        // renderApp 现在不会抛；这一层纯属万一
        try { console.error('[render-boundary] 手动重试仍然失败', e); } catch (_) {}
        rbSetStatus('重试仍然失败：' + rbText(e && e.message));
    }
}

function rbHide() {
    try {
        RENDER_BOUNDARY.visible = false;
        if (RENDER_BOUNDARY.el) RENDER_BOUNDARY.el.style.display = 'none';
        if (RENDER_BOUNDARY.titleSaved != null) {
            try { document.title = RENDER_BOUNDARY.titleSaved; } catch (e) {}
            RENDER_BOUNDARY.titleSaved = null;
        }
    } catch (e) {}
}

// 面板可见时，每一次成功渲染都要把面板**整体**改写成此刻为真的样子。
//
// ⚠️ 这里不能只补计数行。rbShow 写的那段「页面停在上一帧、之后每一次操作都会在同一处
//    再抛一次、界面永远不会再更新」，在这一刻每一个分句都已经是假的：屏幕上就是刚画完的
//    新一帧，streak 已归零，ok 还在涨。留着它不动，面板就会一边显示「已成功渲染 N 次」
//    一边劝用户去刷新 —— 而刷新会丢掉全部正文。所以正文、标题、计数一起重写。
// 只在「面板此刻显示的确实是渲染故障」时做：它也可能正显示着异步错误 / \textcolor 剥离
// 放弃，那两件事和这次渲染成功毫无关系，把它们顶掉就是用一条真话吞掉另一条真话。
function rbNoteRecovery() {
    try {
        const RB = RENDER_BOUNDARY;
        if (!RB.visible || RB.fail === 0) return;
        if (RB.shownKind !== 'render-failed' && RB.shownKind !== 'render-recovered') return;
        const after = RB.ok - RB.okAtFail;   // 最近一次失败之后成功渲染了几次（不是一辈子几次）
        if (RB.countEl) {
            RB.countEl.textContent =
                '· 累计 ' + RB.fail + ' 次失败，最近一次失败之后已成功渲染 ' + after + ' 次';
        }
        if (RB.msgEl) {
            RB.msgEl.textContent =
                '之前有过 ' + RB.fail + ' 次渲染失败，现在已经恢复：你看到的是最新的一帧，'
                + '界面可以正常操作，不需要刷新。下面留的是最后那一次故障的现场，'
                + '如果反复出现，请点「下载备份 .txt」把正文和堆栈都存下来再排查。';
        }
        if (RB.titleEl) RB.titleEl.textContent = '⚠ 渲染出错（已恢复）';
        // 标签页标题同理：还留着「⚠ 渲染出错」这四个字（确实出过事，面板也还开着），
        // 但必须说清楚现在的状态，否则切回这个标签的人会以为页面还是坏的。
        if (RB.titleSaved != null) {
            try { document.title = '⚠ 渲染出错（已恢复） · ' + RB.titleSaved; } catch (e) {}
        }
    } catch (e) {}
}

// 唯一的「告知用户」出口。kind:
//   'render-failed'    渲染失败且自动重试没救回来
//   'render-recovered' 渲染抛过，但自动重试后这一帧是好的
//   'async'            window error / unhandledrejection
//   'strip-gaveup'     \textcolor 剥离放弃 —— 不是渲染故障，但同样是「静默就会毁文档」的一类，
//                      所以复用同一个面板（用户只需要认识一个「出事了」的界面）
// 整个函数不允许抛：面板造不出来时退回 console + 标题栏，绝不把异常带回渲染路径。
function rbShow(kind, err, extra) {
    const RB = RENDER_BOUNDARY;
    // 标签页标题也要说实话：不是渲染炸了就别说「渲染出错」。
    // 三种 kind 三种说法 —— 漏掉哪一种，那一种就会顶着别人的名字出现。
    const tabTag = (kind === 'strip-gaveup') ? '⚠ 颜色宏未剥离 · '
                 : (kind === 'async') ? '⚠ 后台出错 · '
                 : (kind === 'render-recovered') ? '⚠ 渲染出错（已恢复） · '
                 : '⚠ 渲染出错 · ';
    try { console.error('[render-boundary] ' + kind + ' —', err); } catch (e) {}
    try {
        const panel = rbEnsurePanel();
        if (!panel) {
            // 最后一道：至少让标签页标题喊出来。这一行几乎不可能失败。
            try {
                if (RB.titleSaved == null) RB.titleSaved = document.title;
                document.title = tabTag + RB.titleSaved;
            } catch (e) {}
            return;
        }
        panel.style.display = 'block';
        RB.visible = true;
        RB.shownKind = kind;
        // 状态行是上一次按钮操作的回执。新的一次故障进来时必须先清掉，
        // 否则一条「重试成功」会挂在一条全新的失败下面 —— 那就是在说假话。
        rbSetStatus('');
        try {
            if (RB.titleSaved == null) RB.titleSaved = document.title;
            document.title = tabTag + RB.titleSaved;
        } catch (e) {}
        try {
            if (RB.titleEl) {
                // 标题必须和正文说同一件事：'async' 的正文写着「不是渲染路径抛的」，
                // 标题再写「页面渲染出错」就是当场自相矛盾。
                RB.titleEl.textContent = (kind === 'strip-gaveup') ? '⚠ 颜色宏没能剥离'
                                       : (kind === 'async') ? '⚠ 后台任务出错'
                                       : (kind === 'render-recovered') ? '⚠ 渲染出错（已恢复）'
                                       : '⚠ 页面渲染出错';
            }
        } catch (e) {}

        // —— 文案必须为真：屏幕上现在到底是什么，由 ok / wrote 两个事实推出来，不能猜 ——
        let msg;
        if (kind === 'strip-gaveup') {
            msg = '这一次要发给模型的文本里有 \\textcolor 颜色宏，剥离器没能把它剥干净，'
                + '于是**原文原样发了出去**（一个字都没改，也没有交出半剥离的残缺文本）。'
                + '后果：译文里很可能出现 \\textcolor{...}{...} 字样，需要你自己删掉。'
                + '正文和历史都没有被动过，可以直接重试；换一段更小的选区通常就能绕开。';
        } else if (kind === 'async') {
            msg = '有一个异步错误没人接住（不是渲染路径抛的，界面本身仍然是正常的一帧）。'
                + '它通常意味着某个后台请求或定时器失败了，结果可能没有出现在界面上。';
        } else if (kind === 'render-recovered') {
            msg = '这一次渲染抛了异常，已经自动重试成功 —— 你现在看到的界面是最新的。'
                + '重试前关掉了设置弹窗 / 选词弹窗 / 各类菜单等浮层（正文一个字都没动）。'
                + '如果反复出现，请把下面的堆栈留存。';
        } else if (RB.ok === 0 && !RB.wrote) {
            msg = '首次渲染就失败了，所以这个面板后面是一张空白页 —— 界面根本没有画出来。'
                + '此时还没有任何正文，刷新是安全的。';
        } else if (RB.ok === 0 && RB.wrote) {
            msg = '首次渲染画出了界面，但收尾步骤（事件绑定 / 对齐 / 弹窗定位）失败了：'
                + '页面看得见，部分按钮和输入框可能没有反应。';
        } else if (RB.wrote) {
            msg = '渲染中途失败，但页面内容已经被换成了新的一帧：界面是新的，'
                + '收尾步骤（事件绑定 / 对齐 / 弹窗定位）没跑完，部分按钮和输入框可能没有反应。'
                + '请先备份正文，再点「重试渲染」或刷新。';
        } else {
            msg = '渲染失败，页面停在「上一帧」：你看到的是出错之前的界面，之后的每一次操作'
                + '都会在同一处再抛一次，不处理的话界面永远不会再更新。'
                + '请先备份正文，再点「重试渲染」；仍然不行就刷新（会丢正文，务必先备份）。';
        }
        if (RB.msgEl) RB.msgEl.textContent = msg;

        if (RB.whereEl) {
            const where = rbWhere(err);
            RB.whereEl.textContent = '错误：' + rbText(err && err.name ? err.name : '') + ' ' +
                ((err && err.message != null) ? rbText(err.message) : rbText(err)) +
                (where ? '   @ ' + where : '');
        }
        if (RB.countEl) {
            RB.countEl.textContent = (kind === 'strip-gaveup')
                ? ('· 第 ' + RB.stripGaveUp + ' 次剥离放弃')
                : ('· 第 ' + RB.fail + ' 次捕获，连续失败 ' + RB.streak +
                   ' 次，自动重试 ' + RB.retries + ' 次');
        }
        if (RB.detailEl) {
            let d = '';
            try {
                d += '[' + kind + '] ' + rbText(err && err.name) + ': ' +
                     ((err && err.message != null) ? rbText(err.message) : rbText(err)) + '\n';
                d += (err && err.stack) ? String(err.stack) : '（没有堆栈）';
                if (extra && extra.second) {
                    d += '\n\n—— 自动重试时的第二次异常 ——\n';
                    d += rbText(extra.second && extra.second.message) + '\n';
                    d += (extra.second && extra.second.stack) ? String(extra.second.stack) : '';
                }
                d += '\n\n—— 计数 ——\nok=' + RB.ok + ' fail=' + RB.fail + ' streak=' + RB.streak +
                     ' retries=' + RB.retries + ' wroteRoot=' + RB.wrote +
                     ' async=' + RB.asyncSeen;
            } catch (e) { d = '（堆栈整理失败）'; }
            RB.detailEl.textContent = d;
        }
    } catch (e) {
        try { console.error('[render-boundary] 面板更新失败（原异常已在上一条打印）', e); } catch (_) {}
    }
}

// 自动重试前清掉的**只有浮层类状态**。挑选标准：清掉它绝不会丢用户写过的任何一个字。
//   · 明确不碰：translationPairs / inputText / originalInputText / editValues / activeIndex
//     —— activeIndex 一清就退出行内编辑态，那一行没保存的修改会没；宁可重试失败也不能丢字。
//   · 明确不碰：globalHistory —— 内存里唯一的历史副本。
//   · 明确不做：任何 localStorage 写入、任何 addToGlobalHistory、任何 setState。
function rbCalmTransientState() {
    try {
        AppState.showSettings = false;
        AppState.showLocalSettings = false;
        AppState.showModelMenu = false;
        AppState.showHistoryMenu = false;
        AppState.showSaveMenu = false;
        AppState.activeSettingsPopup = null;
        AppState.activeSettingsIndex = null;
        AppState.activeSettingsSide = null;
        AppState.toast = null;
    } catch (e) {}
    try {
        AppState.synonymState = {
            show: false, loading: false, originalText: "", mode: "replace",
            historyByMode: { replace: [], simplify: [], grammar: [] },
            pageIndexByMode: { replace: 0, simplify: 0, grammar: 0 },
            grammarNotes: [], errorMessage: "",
            position: { x: 0, y: 0 }, selectionRange: { start: 0, end: 0 },
            sentenceRange: null, field: null, index: null, contextSentence: ""
        };
    } catch (e) {}
    try {
        AppState.crossHighlight = { seq: 0, idx: null, fromSide: null, toSide: null, fragments: [], status: 'idle', via: '' };
    } catch (e) {}
}

// ============= 主渲染函数（外层 = 错误边界，内层 = 原来的 renderApp）=============
// 边界必须包在 renderApp 这一层而不是 setState 里：全文有 ~40 处直接调 renderApp()
// 而不经过 setState（切页签、拖宽度、恢复历史……），只包 setState 会漏掉它们。
function renderApp(preserveScroll = true) {
    const RB = RENDER_BOUNDARY;

    // 重入：渲染过程中又调了一次 renderApp（事件处理器同步回调等）。
    // 不再套第二层边界，直接执行，异常交给最外层那一层处理 —— 否则内层会先把状态清一遍，
    // 外层拿到的就不是第一现场了。
    if (RB.depth > 0) return renderAppCore(preserveScroll);

    RB.depth++;
    try {
        RB.wrote = false;
        try {
            renderAppCore(preserveScroll);
            RB.ok++;
            RB.streak = 0;
            if (RB.visible) rbNoteRecovery();
            return;
        } catch (err1) {
            // 这个 catch 块是全函数最要紧的一段：它自己一旦抛，异常就会越过边界继续往上冒，
            // 等于边界压根没修好（「把冻死挪了个位置」）。下面每个 rb* 都已经各自带 try/catch，
            // 这一层是**结构性**兜底 —— 不靠逐个函数的自觉，靠语法保证。
            try {
                RB.fail++;
                RB.streak++;
                RB.okAtFail = RB.ok;   // 恢复计数的基线，见 RENDER_BOUNDARY.okAtFail 的说明
                rbRecord('render', err1);

                const sig = rbSignature(err1);
                // 只有「没连续炸到熔断上限」且「不是刚刚重试过的同一个错」才值得再试一次。
                // 同签名重试第二遍在本质上是同一次计算，只会白烧 CPU。
                const worthRetry = (RB.streak <= RB_STREAK_MAX) && (RB.lastRetrySig !== sig);
                if (worthRetry) {
                    RB.lastRetrySig = sig;
                    RB.retries++;
                    rbCalmTransientState();
                    RB.wrote = false;
                    try {
                        renderAppCore(false);
                        RB.ok++;
                        RB.streak = 0;
                        rbShow('render-recovered', err1, null);
                        return;
                    } catch (err2) {
                        rbRecord('render-retry', err2);
                        rbShow('render-failed', err1, { second: err2 });
                        return;
                    }
                }
                rbShow('render-failed', err1, null);
                return;
            } catch (boundaryErr) {
                // 走到这里说明「报告故障」这件事本身也失败了。最后一件还能做的事：
                // 把两条异常都打进控制台，然后正常返回（绝不再往上抛）。
                try { console.error('[render-boundary] 边界自身失败：', boundaryErr, ' 原始渲染异常：', err1); } catch (_) {}
                return;
            }
        }
    } finally {
        RB.depth--;
    }
    // 刻意不往外抛：调用点有上百处，绝大多数是 `setState(...)` 后面还跟着别的收尾语句
    // （关弹窗、清 loading、装 3 秒后关 toast 的定时器……）。让异常继续往上冒，
    // 那些收尾语句就全被跳过，用户会同时得到「界面不动」和「按钮永远转圈」。
    // 代价是：渲染失败后调用点的后续语句会照常执行。这是可接受的 —— renderAppCore
    // 第一件事就是把 translationPairs 归一化写回，所以之后哪怕真触发了自动存档，
    // 存进去的也是已经归一化过的数据，不会把归档里那份好的换成带缺口的。
}

function renderAppCore(preserveScroll = true) {
    // ⚠️ 必须是这个函数的第一件事：下面每一行渲染代码都假定 translationPairs 是
    //    「数组 + 每个元素形状完整」，而这个假定在真实运行中会被打破（见上方注释）。
    //    归一化本身不可能抛；写回 AppState 让这次修复对后续所有读取者同样生效。
    AppState.translationPairs = normalizeTranslationPairs(AppState.translationPairs);

    // 保存滚动位置。两栏是**联动**的（bindPaneScrollSync），逻辑上只有一个位置，
    // 所以这里只存一个数。分开存两个数会在源栏那侧暂时没有滚动容器的那一轮出事：
    // viewMode 切到 'edit' 时源面板是一个 textarea，选择器选不到东西，存下来的是 0，
    // 切回 'preview' 又把这个 0 写回源栏，两栏当场差出一整页（实测 800px）；
    // syncBilingualAlignment 只管行高、从不碰 scrollTop，这个落差它救不回来。
    // 谁没有滚动容器就跟着另一边走，两边都没有才归零。
    let savedScroll = 0;
    if (preserveScroll) {
        const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
        const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');
        if (sourceContainer) savedScroll = sourceContainer.scrollTop;
        else if (targetContainer) savedScroll = targetContainer.scrollTop;
    }

    const root = document.getElementById('root');
    root.innerHTML = `
        <div class="min-h-screen bg-slate-50 flex flex-col p-4 md:p-6 max-w-[1600px] mx-auto w-full">
            ${renderErrorBanner()}
            ${renderSettingsModal()}
            ${renderLocalSettingsModal()}
            ${renderSynonymPopup()}
            ${renderToast()}
            ${renderHeader()}
            ${renderMainWorkspace()}
            ${renderFooter()}
        </div>
    `;
    // 走到这一行说明整块模板字符串**已经拼完并且已经赋进 #root**。
    // 边界靠这个布尔量区分两种完全不同的故障现场：抛在赋值之前 = 屏幕上是上一帧（旧但完整），
    // 抛在赋值之后 = 屏幕上是新的一帧但收尾没跑完（新但可能点不动）。两种情况的正确说法不一样。
    RENDER_BOUNDARY.wrote = true;
    attachEventListeners();

    // 同义词弹窗独立渲染到 body（避免被 root 内容替换影响）
    renderSynonymPopupOnly();

    // 左右双栏逐行对齐（内部自带 try/catch，绝不会把异常带回渲染路径）。
    // ⚠️ 必须在恢复滚动位置**之前**同步跑完，不能排进 rAF/定时器等下一轮：
    // 刚 innerHTML 出来的右栏是自然高度，比左栏矮一大截（实测 2915 vs 3669），
    // 它的 scrollTop 上限也就跟着矮（1890 vs 2114）。先恢复滚动再对齐，右栏那次赋值会被
    // 浏览器夹到自己的上限，等对齐把行撑高时 scrollTop 早就丢了 —— 两栏永久差 224px，
    // 而行高对齐器不碰 scrollTop，之后谁也修不回来。先对齐则两栏高度一致，赋值不会被夹。
    syncBilingualAlignment();

    // 上面这次是同步量的，此刻 webfont（Inter / KaTeX）多半还没到，量到的是回退字体的行高。
    // 挂一个 document.fonts.ready 的回调，等字体真正落地后再补一次（详见函数上方注释）。
    // 这里只是**注册回调**，不做任何布局工作，放在恢复滚动位置之前之后都一样安全。
    scheduleAlignAfterFonts(0);

    // 同步恢复滚动位置（不使用 requestAnimationFrame，避免多次渲染时的竞态条件）
    if (preserveScroll) {
        const newSourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
        const newTargetContainer = document.querySelector('section:last-of-type .overflow-y-auto');
        if (newSourceContainer) newSourceContainer.scrollTop = savedScroll;
        if (newTargetContainer) newTargetContainer.scrollTop = savedScroll;
    }

    // 渲染后调整弹窗位置
    adjustAllPopups();
}

// ============= 全局异步异常 -> 同一个面板 =============
// 为什么要接：渲染路径修好之后，剩下唯一还会「静默失败」的就是异步路径 ——
// handleTranslate / refreshOnlineModels / 各种定时器里的 promise 没人 catch 时，
// 今天的表现是控制台一条红字、界面上什么都没有，用户只会觉得「点了没反应」。
// 它们和渲染失败共用同一个面板：用户只需要认识一个「出事了」的界面。
//
// 为什么必须限流：window 的 error 事件也会被第三方脚本（KaTeX / marked / Tailwind CDN）
// 和浏览器自身的噪声触发。所以
//   · 只认真正带 error/message 的事件，资源加载失败（img/script 404）一律不认；
//   · AbortError 一律不认 —— 那是用户点「停止」的正常结果，不是故障；
//   · ResizeObserver 那条著名的良性告警一律不认（本文件确实在用 ResizeObserver 对齐行高）；
//   · 最多主动弹 RB_ASYNC_PANEL_MAX 个**不同签名**的错，之后只累加计数、不再打扰；
//   · 渲染那边还没救回来时（streak > 0），异步错误绝不占用这个面板 —— 渲染失败更严重。
//     判据只能是 streak，**不能**再加「面板还开着」：「关闭」是面板上的一等按钮，
//     用户关掉它并不代表渲染修好了，而按可见性判断会让这条保护在关闭的那一刻蒸发，
//     下一条异步错误就会把面板重新弹成「界面本身仍然是正常的一帧」—— 那句话此刻是假的。
const rbAsyncSigs = [];

function rbShouldReportAsync(err, message) {
    try {
        const name = rbText(err && err.name);
        if (name === 'AbortError') return false;
        const msg = (err && err.message != null) ? rbText(err.message) : rbText(message);
        if (!msg && !err) return false;
        if (msg.indexOf('ResizeObserver loop') !== -1) return false;
        return true;
    } catch (e) { return false; }
}

function rbHandleAsync(err, message) {
    try {
        const RB = RENDER_BOUNDARY;
        if (!rbShouldReportAsync(err, message)) return;
        RB.asyncSeen++;
        const e = (err && typeof err === 'object') ? err : new Error(rbText(message) || '未知异步错误');
        rbRecord('async', e);
        const sig = rbSignature(e);
        if (rbAsyncSigs.indexOf(sig) !== -1) return;          // 同一个错反复来，只记一次
        if (rbAsyncSigs.length < RB_ASYNC_PANEL_MAX * 4) rbAsyncSigs.push(sig);
        if (RB.streak > 0) return;                            // 渲染那边还没救回来，不抢面板（面板被关掉了也一样）
        if (RB.asyncShown >= RB_ASYNC_PANEL_MAX) {
            try { console.error('[render-boundary] 异步错误（已达面板上限，只记录）', e); } catch (_) {}
            return;
        }
        RB.asyncShown++;
        rbShow('async', e, null);
    } catch (e2) {
        try { console.error('[render-boundary] 异步上报自身失败', e2); } catch (_) {}
    }
}

// ============= \textcolor 剥离放弃 -> 同一个面板 =============
// stripTextColorForModel 唯一的对外告知口，由它以 typeof 守卫调用（回归测试在没有边界的
// vm 沙箱里跑同一份函数，所以那边必须能安全地跳过这条路）。
//
// 为什么值得占用这个面板：剥离失败**不会抛异常**、**不会让界面变样**，用户唯一能察觉的
// 途径是事后在译文里读到 \textcolor{purple}{...}。这正是本项目一路在打的「静默损坏」，
// 和渲染冻死属于同一类事故，只是表现在文档里而不是屏幕上。控制台一条红字不算告知。
//
// 限流规则和异步错误一样：同一个原因只主动弹一次面板，之后只累加计数 —— 一次批量翻译
// 会连着调用很多次，不能变成弹窗刷屏。
const rbStripGaveUpReasons = [];

function rbReportStripGiveUp(why, sample, detail) {
    try {
        const RB = RENDER_BOUNDARY;
        RB.stripGaveUp++;
        const head = rbText(sample).slice(0, 160);
        const e = new Error('\\textcolor 剥离放弃：' + rbText(why) +
            (detail ? '（' + rbText(detail) + '）' : '') +
            ' —— 原文原样发给模型');
        rbRecord('strip-gaveup', e);
        const key = rbText(why);
        if (rbStripGaveUpReasons.indexOf(key) !== -1) {
            try { console.error('[textcolor] 又一次剥离放弃（同一原因，只记录不再弹窗）', key); } catch (_) {}
            return;
        }
        rbStripGaveUpReasons.push(key);
        // 渲染那边还没救回来的时候不抢面板：页面冻住比译文里多几个宏严重得多。
        // 判据同样只看 streak，不看面板是否还开着 —— 理由见 rbHandleAsync 上方那段。
        if (RB.streak > 0) {
            try { console.error('[textcolor] 剥离放弃，但渲染仍在失败中，不抢这个面板', e); } catch (_) {}
            return;
        }
        rbShow('strip-gaveup', e, { second: null, sample: head });
    } catch (e2) {
        try { console.error('[textcolor] 放弃上报自身失败', e2); } catch (_) {}
    }
}

try {
    window.addEventListener('error', function (ev) {
        try {
            // 资源加载失败（<img>/<script> 404）走的也是 error 事件，但没有 error/message，
            // 而且和「代码炸了」是两回事，不该弹这个面板。
            if (!ev || (ev.error == null && ev.message == null)) return;
            rbHandleAsync(ev.error, ev.message);
        } catch (e) {}
    });
    window.addEventListener('unhandledrejection', function (ev) {
        try {
            if (!ev) return;
            rbHandleAsync(ev.reason, ev.reason && ev.reason.message);
        } catch (e) {}
    });
} catch (e) {
    try { console.warn('[render-boundary] 全局异常监听注册失败：', e && e.message); } catch (_) {}
}

    if (!AppState.error) return '';
    return `

            ${Icons.AlertCircle}
            <span class="text-xs font-medium">${escapeHtml(AppState.error)}</span>

        </div>

// ============= Toast 提示框 =============
function renderToast() {
    if (!AppState.toast) return '';

    const bgColor = {
        'success': 'bg-emerald-50 border-emerald-200 text-emerald-700',
        'warning': 'bg-amber-50 border-amber-200 text-amber-700',
        'info': 'bg-blue-50 border-blue-200 text-blue-700'

        <div class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] ${bgColor} border px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 backdrop-blur-sm bg-opacity-95 transition-all duration-300" onclick="setState({toast:null})">

// ============= 在线模型区块的渲染辅助 =============
// 单个 provider 的状态芯片（含独立 ⟳ 只重试这一家）
function renderModelRefreshChip(group) {
    const st = group.state || {};
    const stale = isModelCatalogStale(group.provider);
    let dotClass = 'bg-slate-300';
    let text = '使用内置列表';
    let title = '';
    if (st.status === 'loading') {
        dotClass = 'bg-violet-500 animate-pulse';
        text = '正在获取...';
    } else if (st.status === 'error') {
        const soft = (st.errCode === 'NO_KEY' || st.errCode === 'EMPTY');
        dotClass = soft ? 'bg-amber-400' : 'bg-rose-500';
        text = MODEL_ERROR_TEXT[st.errCode] || '更新失败';
        title = st.errMsg || '';
    } else if (st.status === 'ok') {
        dotClass = stale ? 'bg-amber-400' : 'bg-emerald-500';
        text = `${st.count} 个 · ${formatModelRefreshTime(st.at)}`
             + (st.source === 'cache' ? ' · 缓存' : '')
             + (stale ? ' · 已过期' : '');
        title = stale ? '距上次更新已超过 7 天，建议重新更新' : '';
    }
    return `
        <span class="inline-flex items-center gap-1.5 px-2 py-1 bg-slate-50 border border-slate-200 rounded-lg text-[10px] text-slate-500" title="${escapeAttr(title)}">
            <span class="w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}"></span>
            <span class="font-semibold text-slate-600">${group.label}</span>
            <span class="truncate max-w-[150px]">${escapeHtml(text)}</span>
            <button onclick="refreshOnlineModelsClick('${group.provider}')" ${st.status === 'loading' ? 'disabled' : ''} class="text-slate-400 hover:text-violet-600 disabled:opacity-40" title="只更新这一家">${Icons.RefreshCw}</button>
        </span>
    `;
}

// 单个在线模型的勾选行
function renderOnlineModelCheckbox(m) {
    const locked = isPinnedModel(m.provider, m);   // 正在使用的模型不允许隐藏
    const visible = locked || AppState.modelVisibility[m.id] !== false;
    const bg = visible
        ? (m.provider === 'claude' ? 'bg-orange-50' : (m.provider === 'openai' ? 'bg-sky-50' : 'bg-indigo-50'))
        : '';
    let badge = '';
    if (locked) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-amber-100 text-amber-700 font-bold shrink-0" title="${escapeAttr(m.pinned ? '正在使用，未在 API 列表中但仍可调用' : '正在使用中，不可隐藏')}">使用中</span>`;
    } else if (m.retired) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-100 text-slate-500 font-bold shrink-0" title="上次更新时 API 没有返回这个模型（可能已下线，也可能是该 Key/项目没有权限）">未在列表</span>`;
    } else if (m.group === 'other') {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-100 text-slate-500 font-bold shrink-0" title="新家族，未验证是否支持对话">?</span>`;
    } else if ((AppState.newlyFoundIds || []).indexOf(m.id) >= 0) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-violet-100 text-violet-700 font-bold shrink-0">NEW</span>`;
    }
    // 价格挪到名字下面单独一行；同一行里再放模型的原始 id（等宽小字，超长时省略号 + title 兜底），
    // 这样「用户实际调用时要认的 id」和「价格」都可见，不用再靠悬停才能读到完整模型名。
    const priceLine = `<span class="text-[9px] text-slate-400 font-mono shrink-0" title="${escapeAttr(formatPriceTitle(m.price))}">${escapeHtml(formatPriceCompact(m.price))}</span>`;
    const idLine = `<span class="text-[9px] text-slate-400 font-mono truncate min-w-0 flex-1" title="${escapeAttr(m.id)}">${escapeHtml(m.id)}</span>`;
    return `
        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-all ${bg}" title="${escapeHtml(m.id)}">
            <input type="checkbox" ${visible ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="toggleModelVisibility('${escapeHtml(m.id)}')" class="w-4 h-4 mt-0.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 shrink-0">
            <span class="flex flex-col min-w-0 flex-1 gap-0.5">
                <span class="flex items-start gap-1 min-w-0">
                    <span class="text-xs font-medium ${m.iconClass} break-words leading-snug min-w-0 flex-1">${escapeHtml(m.name)}</span>
                    ${badge}
                </span>
                <span class="flex items-center gap-1.5 min-w-0">
                    ${idLine}
                    ${priceLine}
                </span>
            </span>
        </label>
    `;
}

    return `
                    <!-- Row Spacing Section -->

                            <div class="w-6 h-6 bg-gradient-to-br from-sky-500 to-indigo-600 rounded-lg flex items-center justify-center text-white">

                            </div>

                                 同时有 data-tip 时，悬停按钮会同时浮出两个气泡。
                                 也不能直接挂在 <input> 上：input 是替换元素，::after 不渲染。 -->
                            <div class="flex-grow flex items-center gap-3" data-tip="向左更紧凑、向右更宽松（${ROW_GAP_MIN}–${ROW_GAP_MAX}px）。松开鼠标即保存，刷新后仍然生效。" data-tip-pos="bottom">
                                <span class="text-[10px] text-slate-400 shrink-0 whitespace-nowrap">紧凑</span>
                                <input type="range" id="rowGapSlider" min="${ROW_GAP_MIN}" max="${ROW_GAP_MAX}" step="1" value="${gap}"

                        </div>

                            <div class="w-6 h-6 bg-gradient-to-br from-teal-500 to-emerald-600 rounded-lg flex items-center justify-center text-white">

// ============= B1/B2：本地模型的能力芯片 + 唯一那个推理控件 =============
// 【为什么这一块是自己刷自己，而不是走 renderApp】
// 能力发现是异步的（4s 超时），而设置弹窗里有四个**没保存就不能重渲染**的输入框
// （三家 API Key + 本地地址）。发现结果几秒后回来时再 renderApp()，会用 AppState 里的
// 旧值重建 <input value="...">，把用户正在输入的 Key 抹掉 —— 这正是 setSettingsTab
// 上方那段注释在躲的坑。所以这里走**定点重绘**：每个模型一个 [data-xport-model] 容器，
// 发现结果回来时只替换这些容器的 innerHTML，弹窗其余部分一个节点都不碰。
// 整条路径全程 try/catch 且只返回字符串，renderApp（无 try/catch）永远拿不到异常。

// 只读芯片的**数据**：加载期上下文 / 量化 / 架构 / 参数量 / 视觉 / 工具。
// 上下文实测是**加载期**参数，HTTP 改不了，所以只显示不给调 —— 给滑块就是撒谎。
// 设置弹窗（Tailwind 类）和对话窗参数条（#aiChatRoot 自带 CSS）共用这一份数据、各自渲染：
// 对话窗那一侧刻意不依赖 Tailwind 的运行时扫描，理由见 .aichat-params 的样式注释。
function xportCapsChipList(caps) {
    const chips = [];
    if (!caps) return chips;
    if (caps.ctx || caps.maxCtx) {
        const ctxTxt = (caps.ctx ? String(caps.ctx) : '?') + ' / ' + (caps.maxCtx ? String(caps.maxCtx) : '?');
        chips.push({ text: 'ctx ' + ctxTxt, pos: 'top-start', tip: '当前加载的上下文 / 该模型支持的上限（token）。上下文只能在 LM Studio 加载模型时设定，HTTP 改不了（实测发 context_length/num_ctx/n_ctx 返回 200 但实际值纹丝不动），所以这里只读。' });
    }
    if (caps.quant) chips.push({ text: caps.quant, pos: 'top', tip: '量化格式（权重精度）。加载期属性，只读。' });
    if (caps.arch) chips.push({ text: caps.arch, pos: 'top', tip: '模型架构标识。' });
    if (caps.params) chips.push({ text: caps.params, pos: 'top', tip: '参数规模。' });
    if (caps.vision) chips.push({ text: '视觉 ✓', pos: 'top', tip: '该模型声明支持图像输入（本翻译器不使用）。' });
    if (caps.tools) chips.push({ text: '工具 ✓', pos: 'top', tip: '该模型声明经过工具调用训练（本翻译器不使用）。' });
    return chips;
}

function xportCapsChipsHtml(caps) {
    const chips = xportCapsChipList(caps).map(function (c) {
        return '<span data-tip="' + escapeAttr(c.tip) + '" data-tip-pos="' + escapeAttr(c.pos) + '">' + escapeAttr(c.text) + '</span>';
    });
    if (!chips.length) return '';
    return '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[9px] text-slate-400 font-mono">' + chips.join('<span class="text-slate-300">·</span>') + '</div>';
}

// 一个模型 = **一个**推理控件，形态由 allowed_options 反推：
//   二值模型（3.6 / 1.7b）→ 关/开 两态；有真实档位的（3.8）→ 关 + 低/中/极高 下拉。
// 下拉里出现的每一项都保证能映射到合法的 reasoning_effort —— 映射不了的档位在
// xportReasoningControl 里就被丢掉了，所以 UI 永远不会给出一个模型会拒绝的选项。
function xportReasoningControlHtml(id, caps) {
    const ctl = xportReasoningControl(caps.reasoning ? caps.reasoning.allowed : null);
    if (ctl.kind === 'none') return '';
    const cur = xportReasoningValue(AppState.localBaseUrl, id);
    const on = cur !== 'off';
    // 提示里把「实测代价」和「default 不是 API 默认值」这两件事都说清楚，不含糊其辞。
    // 数字与 XPORT_PARAM_SPECS.reasoning.desc 保持同一套（只留三次测量都支持的比值，
    // 不再印那对拼接出来、且被自己的实验报告标注为受污染的绝对耗时）——理由见那里的注释。
    let latched = false;
    try { latched = xportEffortUnsupported.has(xportCapsOrigin(AppState.localBaseUrl)); } catch (e) { latched = false; }
    const tip = '推理（reasoning_effort）。默认关：实测开启后 qwen3.6 整体耗时是关闭时的 6–10 倍、'
        + '每源字符的往返 token 约 5.8 倍、旧 JSON 链路硬失败率从 16.7% 涨到 33.3%，盲评 6 段里 5 段看不出差别。'
        + '注意本模型元数据里的默认值「' + (caps.reasoning && caps.reasoning.uiDefault ? caps.reasoning.uiDefault : '未知')
        + '」是 LM Studio 界面默认值，不是 API 默认值 —— 实测不显式发送时 API 一律不推理，'
        + '所以选「关」时发的是 reasoning_effort:"none"，而不是靠省略。'
        + (latched
            ? '（本地址已经用 400 明确拒绝过 reasoning_effort，这个字段现在不再发送；省略与「关」等价，'
              + '所以本开关只能停在「关」上，直到重新载入页面。）'
            : '');
    if (ctl.kind === 'toggle') {
        const btn = function (val, label) {
            const active = (val === 'off') ? !on : on;
            return '<button onclick="setModelReasoning(\'' + id + '\',\'' + val + '\')" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (active ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600') + '">' + label + '</button>';
        };
        return '<span class="flex items-center gap-1.5" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-end">'
            + '<span class="text-[10px] text-slate-500 font-medium">推理</span>'
            + '<span class="flex items-center bg-slate-100 rounded-lg p-0.5">'
            + btn('off', XPORT_EFFORT_LABEL.off) + btn('on', XPORT_EFFORT_LABEL.on)
            + '</span></span>';
    }
    const opts = ['off'].concat(ctl.levels).map(function (v) {
        return '<option value="' + escapeAttr(v) + '"' + (v === cur ? ' selected' : '') + '>'
            + escapeAttr(XPORT_EFFORT_LABEL[v] || v) + '</option>';
    }).join('');
    return '<span class="flex items-center gap-1.5" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-end">'
        + '<span class="text-[10px] text-slate-500 font-medium">推理</span>'
        + '<select onchange="setModelReasoning(\'' + id + '\', this.value)" class="text-[10px] font-bold text-purple-600 bg-slate-100 border-none rounded-lg py-0.5 pl-2 pr-6 outline-none cursor-pointer">'
        + opts + '</select></span>';
}

// 一个本地模型在设置里的那一行「能力 + 控件」。**纯字符串、绝不抛**。
function xportCapsRowHtml(modelId) {
    try {
        const id = sanitizeModelId(modelId);
        if (!id) return '';
        const caps = xportCapsPeek(AppState.localBaseUrl, id);
        if (caps === undefined) {
            return '<span class="text-[9px] text-slate-300 italic">正在读取模型能力…</span>';
        }
        if (!caps) {
            // 两种 null 分开说：整份 GET 失败 vs 表里没这个 id。补救办法不同，不能混为一谈。
            const ok = xportCapsOk(AppState.localBaseUrl);
            const tip = (ok === false)
                ? '读不到 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models（LM Studio 没在跑，或版本过旧没有这个端点）。没有能力信息就不画控件——宁可不显示，也不显示一个可能是假的开关。'
                : '模型未加载：LM Studio 的模型列表里没有这一项，拿不到它支持哪些推理档位。在 LM Studio 里加载该模型后重开本页即可。';
            return '<span class="text-[9px] text-slate-300 italic" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-start">'
                + (ok === false ? '能力信息不可用' : '模型未加载') + '</span>';
        }
        const chips = xportCapsChipsHtml(caps);
        const ctlHtml = caps.reasoning ? xportReasoningControlHtml(id, caps) : '';
        // reasoning 为 null（能力里没有 reasoning 段，例如 embedding 条目）也走这条：只出芯片，不出控件。
        const right = ctlHtml || '<span class="text-[9px] text-slate-300 italic" data-tip="'
            + escapeAttr('该模型没有声明任何推理档位（capabilities.reasoning 缺失），因此不提供推理开关。') + '" data-tip-pos="top-end">无推理档位</span>';
        return '<div class="flex items-center justify-between gap-3 flex-wrap">' + (chips || '<span></span>') + right + '</div>';
    } catch (e) { return ''; }
}

// 定点重绘：只换 [data-xport-model] 容器的内容，弹窗其它节点（含没保存的输入框）零影响。
function xportCapsPaint() {
    try {
        if (typeof document === 'undefined') return;
        const nodes = document.querySelectorAll('[data-xport-model]');
        for (let i = 0; i < nodes.length; i++) {
            nodes[i].innerHTML = xportCapsRowHtml(nodes[i].getAttribute('data-xport-model'));
        }
    } catch (e) {}
    // 对话窗那条参数条读的是同一份发现结果（本地模型列表 + capabilities），
    // 所以发现一回来它也得跟着重画一次。**单独一个 try**：这两块互不背锅。
    try { chatRenderParamBar(); } catch (e) {}
}

// 发起一次发现（60 秒内重复调用不会真的再发请求），回来后定点重绘。fire-and-forget，
// 但两个分支都接住 —— 一次 unhandled rejection 在这个文件里就是静默死锁。
function xportCapsWarm() {
    try {
        // 从没连过本地服务的用户不该因为「打开了设置」就每次吃一个必然失败的请求。
        // 没有本地模型时那一段本来就只显示「No local models available」，一行容器都不会渲染。
        const list = Array.isArray(AppState.localModels) ? AppState.localModels : [];
        if (!list.length && AppState.apiProvider !== 'local') return;
        xportFetchCaps(AppState.localBaseUrl).then(function () { xportCapsPaint(); }, function () {});
    } catch (e) {}
}

// 用户改了某个模型的推理档位。**不走 renderApp** —— 理由同上（会抹掉没保存的 API Key）。
function setModelReasoning(modelId, value) {
    try {
        const id = sanitizeModelId(modelId);
        if (!id) return;
        const v = (typeof value === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, value))
            ? value : XPORT_REASONING_DEFAULT;
        if (!AppState.reasoningByModel || typeof AppState.reasoningByModel !== 'object') AppState.reasoningByModel = {};
        AppState.reasoningByModel[id] = v;
        try { localStorage.setItem(XPORT_REASONING_LS_KEY, JSON.stringify(AppState.reasoningByModel)); } catch (e) {}
        xportCapsPaint();
    } catch (e) {}
}
