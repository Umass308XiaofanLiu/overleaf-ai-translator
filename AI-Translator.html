// ============= B1/B2：本地模型的能力芯片 + 唯一那个推理控件 =============
// 【为什么这一块是自己刷自己，而不是走 renderApp】
// 能力发现是异步的（4s 超时），而设置弹窗里有四个**没保存就不能重渲染**的输入框
// （三家 API Key + 本地地址）。发现结果几秒后回来时再 renderApp()，会用 AppState 里的
// 旧值重建 <input value="...">，把用户正在输入的 Key 抹掉 —— 这正是 setSettingsTab
// 上方那段注释在躲的坑。所以这里走**定点重绘**：每个模型一个 [data-xport-model] 容器，
// 发现结果回来时只替换这些容器的 innerHTML，弹窗其余部分一个节点都不碰。
// 整条路径全程 try/catch 且只返回字符串，renderApp（无 try/catch）永远拿不到异常。

// 只读芯片的**数据**：加载期上下文 / 量化 / 架构 / 参数量 / 视觉 / 工具。
// 上下文实测是**加载期**参数，HTTP 改不了，所以只显示不给调 —— 给滑块就是撒谎。
// 设置弹窗（Tailwind 类）和对话窗参数条（#aiChatRoot 自带 CSS）共用这一份数据、各自渲染：
// 对话窗那一侧刻意不依赖 Tailwind 的运行时扫描，理由见 .aichat-params 的样式注释。
function xportCapsChipList(caps) {
    const chips = [];
    if (!caps) return chips;
    if (caps.ctx || caps.maxCtx) {
        const ctxTxt = (caps.ctx ? String(caps.ctx) : '?') + ' / ' + (caps.maxCtx ? String(caps.maxCtx) : '?');
        chips.push({ text: 'ctx ' + ctxTxt, pos: 'top-start', tip: '当前加载的上下文 / 该模型支持的上限（token）。上下文只能在 LM Studio 加载模型时设定，HTTP 改不了（实测发 context_length/num_ctx/n_ctx 返回 200 但实际值纹丝不动），所以这里只读。' });
    }
    if (caps.quant) chips.push({ text: caps.quant, pos: 'top', tip: '量化格式（权重精度）。加载期属性，只读。' });
    if (caps.arch) chips.push({ text: caps.arch, pos: 'top', tip: '模型架构标识。' });
    if (caps.params) chips.push({ text: caps.params, pos: 'top', tip: '参数规模。' });
    if (caps.vision) chips.push({ text: '视觉 ✓', pos: 'top', tip: '该模型声明支持图像输入（本翻译器不使用）。' });
    if (caps.tools) chips.push({ text: '工具 ✓', pos: 'top', tip: '该模型声明经过工具调用训练（本翻译器不使用）。' });
    return chips;
}

function xportCapsChipsHtml(caps) {
    const chips = xportCapsChipList(caps).map(function (c) {
        return '<span data-tip="' + escapeAttr(c.tip) + '" data-tip-pos="' + escapeAttr(c.pos) + '">' + escapeAttr(c.text) + '</span>';
    });
    if (!chips.length) return '';
    return '<div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[9px] text-slate-400 font-mono">' + chips.join('<span class="text-slate-300">·</span>') + '</div>';
}

// 一个模型 = **一个**推理控件，形态由 allowed_options 反推：
//   二值模型（3.6 / 1.7b）→ 关/开 两态；有真实档位的（3.8）→ 关 + 低/中/极高 下拉。
// 下拉里出现的每一项都保证能映射到合法的 reasoning_effort —— 映射不了的档位在
// xportReasoningControl 里就被丢掉了，所以 UI 永远不会给出一个模型会拒绝的选项。
function xportReasoningControlHtml(id, caps) {
    const ctl = xportReasoningControl(caps.reasoning ? caps.reasoning.allowed : null);
    if (ctl.kind === 'none') return '';
    const cur = xportReasoningValue(AppState.localBaseUrl, id);
    const on = cur !== 'off';
    // 提示里把「实测代价」和「default 不是 API 默认值」这两件事都说清楚，不含糊其辞。
    // 数字与 XPORT_PARAM_SPECS.reasoning.desc 保持同一套（只留三次测量都支持的比值，
    // 不再印那对拼接出来、且被自己的实验报告标注为受污染的绝对耗时）——理由见那里的注释。
    let latched = false;
    try { latched = xportEffortUnsupported.has(xportCapsOrigin(AppState.localBaseUrl)); } catch (e) { latched = false; }
    const tip = '推理（reasoning_effort）。默认关：实测开启后 qwen3.6 整体耗时是关闭时的 6–10 倍、'
        + '每源字符的往返 token 约 5.8 倍、旧 JSON 链路硬失败率从 16.7% 涨到 33.3%，盲评 6 段里 5 段看不出差别。'
        + '注意本模型元数据里的默认值「' + (caps.reasoning && caps.reasoning.uiDefault ? caps.reasoning.uiDefault : '未知')
        + '」是 LM Studio 界面默认值，不是 API 默认值 —— 实测不显式发送时 API 一律不推理，'
        + '所以选「关」时发的是 reasoning_effort:"none"，而不是靠省略。'
        + (latched
            ? '（本地址已经用 400 明确拒绝过 reasoning_effort，这个字段现在不再发送；省略与「关」等价，'
              + '所以本开关只能停在「关」上，直到重新载入页面。）'
            : '');
    if (ctl.kind === 'toggle') {
        const btn = function (val, label) {
            const active = (val === 'off') ? !on : on;
            return '<button onclick="setModelReasoning(\'' + id + '\',\'' + val + '\')" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (active ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600') + '">' + label + '</button>';
        };
        return '<span class="flex items-center gap-1.5" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-end">'
            + '<span class="text-[10px] text-slate-500 font-medium">推理</span>'
            + '<span class="flex items-center bg-slate-100 rounded-lg p-0.5">'
            + btn('off', XPORT_EFFORT_LABEL.off) + btn('on', XPORT_EFFORT_LABEL.on)
            + '</span></span>';
    }
    const opts = ['off'].concat(ctl.levels).map(function (v) {
        return '<option value="' + escapeAttr(v) + '"' + (v === cur ? ' selected' : '') + '>'
            + escapeAttr(XPORT_EFFORT_LABEL[v] || v) + '</option>';
    }).join('');
    return '<span class="flex items-center gap-1.5" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-end">'
        + '<span class="text-[10px] text-slate-500 font-medium">推理</span>'
        + '<select onchange="setModelReasoning(\'' + id + '\', this.value)" class="text-[10px] font-bold text-purple-600 bg-slate-100 border-none rounded-lg py-0.5 pl-2 pr-6 outline-none cursor-pointer">'
        + opts + '</select></span>';
}

// 一个本地模型在设置里的那一行「能力 + 控件」。**纯字符串、绝不抛**。
function xportCapsRowHtml(modelId) {
    try {
        const id = sanitizeModelId(modelId);
        if (!id) return '';
        const caps = xportCapsPeek(AppState.localBaseUrl, id);
        if (caps === undefined) {
            return '<span class="text-[9px] text-slate-300 italic">正在读取模型能力…</span>';
        }
        if (!caps) {
            // 两种 null 分开说：整份 GET 失败 vs 表里没这个 id。补救办法不同，不能混为一谈。
            const ok = xportCapsOk(AppState.localBaseUrl);
            const tip = (ok === false)
                ? '读不到 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models（LM Studio 没在跑，或版本过旧没有这个端点）。没有能力信息就不画控件——宁可不显示，也不显示一个可能是假的开关。'
                : '模型未加载：LM Studio 的模型列表里没有这一项，拿不到它支持哪些推理档位。在 LM Studio 里加载该模型后重开本页即可。';
            return '<span class="text-[9px] text-slate-300 italic" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-start">'
                + (ok === false ? '能力信息不可用' : '模型未加载') + '</span>';
        }
        const chips = xportCapsChipsHtml(caps);
        const ctlHtml = caps.reasoning ? xportReasoningControlHtml(id, caps) : '';
        // reasoning 为 null（能力里没有 reasoning 段，例如 embedding 条目）也走这条：只出芯片，不出控件。
        const right = ctlHtml || '<span class="text-[9px] text-slate-300 italic" data-tip="'
            + escapeAttr('该模型没有声明任何推理档位（capabilities.reasoning 缺失），因此不提供推理开关。') + '" data-tip-pos="top-end">无推理档位</span>';
        return '<div class="flex items-center justify-between gap-3 flex-wrap">' + (chips || '<span></span>') + right + '</div>';
    } catch (e) { return ''; }
}

// 定点重绘：只换 [data-xport-model] 容器的内容，弹窗其它节点（含没保存的输入框）零影响。
function xportCapsPaint() {
    try {
        if (typeof document === 'undefined') return;
        const nodes = document.querySelectorAll('[data-xport-model]');
        for (let i = 0; i < nodes.length; i++) {
            nodes[i].innerHTML = xportCapsRowHtml(nodes[i].getAttribute('data-xport-model'));
        }
    } catch (e) {}
    // 对话窗那条参数条读的是同一份发现结果（本地模型列表 + capabilities），
    // 所以发现一回来它也得跟着重画一次。**单独一个 try**：这两块互不背锅。
    try { chatRenderParamBar(); } catch (e) {}
    // 「默认模型」那两行的推理控件形态同样是从 allowed_options 反推的，发现一回来也得重画。
    // 又是**单独一个 try**：三块彼此不背锅。
    try { surfaceDefaultsPaint(); } catch (e) {}
}

// 发起一次发现（60 秒内重复调用不会真的再发请求），回来后定点重绘。fire-and-forget，
// 但两个分支都接住 —— 一次 unhandled rejection 在这个文件里就是静默死锁。
function xportCapsWarm() {
    try {
        // 从没连过本地服务的用户不该因为「打开了设置」就每次吃一个必然失败的请求。
        // 没有本地模型时那一段本来就只显示「No local models available」，一行容器都不会渲染。
        const list = Array.isArray(AppState.localModels) ? AppState.localModels : [];
        if (!list.length && AppState.apiProvider !== 'local') return;
        xportFetchCaps(AppState.localBaseUrl).then(function () { xportCapsPaint(); }, function () {});
    } catch (e) {}
}

// 用户改了某个模型的推理档位。**不走 renderApp** —— 理由同上（会抹掉没保存的 API Key）。
function setModelReasoning(modelId, value) {
    try {
        const id = sanitizeModelId(modelId);
        if (!id) return;
        const v = (typeof value === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, value))
            ? value : XPORT_REASONING_DEFAULT;
        if (!AppState.reasoningByModel || typeof AppState.reasoningByModel !== 'object') AppState.reasoningByModel = {};
        AppState.reasoningByModel[id] = v;
        try { localStorage.setItem(XPORT_REASONING_LS_KEY, JSON.stringify(AppState.reasoningByModel)); } catch (e) {}
        xportCapsPaint();
    } catch (e) {}
}

// ============================================================================
// 设置 → 模型 → 「默认模型」两行（翻译 / 对话）
// ============================================================================
//
// 【三条纪律，都是这个文件已经付过学费的】
//   1. 这一段拼进 renderSettingsModal 的模板字符串，而 renderApp 外面**没有** try/catch ——
//      拼接期间抛一次异常，页面就永久冻在上一帧。所以下面每个函数都自带 try/catch 且返回 ''。
//   2. 所有 setter **绝不** renderApp：设置弹窗里有没保存的 API Key 输入框，重渲染会把它们冲掉。
//      走定点重绘（surfaceDefaultsPaint），和 setModelReasoning / xportCapsPaint 同一条路。
//   3. 推理控件的形态**一律**由 xportReasoningControl 从发现到的 allowed_options 反推，
//      这里不许再写第二套判断 —— 那正是 reasoning-heterogeneity.md 禁止的「装饰性控件」。

// 两行共用的模型下拉。复用 chatModelGroups()：它已经尊重「模型可见性」勾选、
// 并且会把当前选中的那个钉住（否则选过一次冷门模型就再也切不回来）。
function surfaceModelOptionsHtml(curProvider, curModel) {
    try {
        return chatModelGroups().map(function (g) {
            return '<optgroup label="' + escapeAttr(g.label) + '">' + g.items.map(function (it) {
                const sel = (it.provider === curProvider && it.id === curModel) ? ' selected' : '';
                return '<option value="' + escapeAttr(it.provider + ':' + it.id) + '"' + sel + '>'
                    + escapeHtml(chatModelLabel(it.provider, it.id)) + '</option>';
            }).join('') + '</optgroup>';
        }).join('');
    } catch (e) { return ''; }
}

// 固定宽度的推理槽位。**宽度固定是硬要求**（reasoning-heterogeneity.md 决策 5）：
// 二值模型画开关、多档模型画下拉，两者宽度不同的话，换一次模型整行就会抖一下。
const SURFACE_REASON_SLOT = 'display:inline-flex;align-items:center;gap:6px;min-width:132px;';

// 每个模型只画**它自己声明支持**的档位。四种情况各有各的说法，一种都不许含糊过去：
//   有真实档位 → 关/开 + 强度下拉；只有 [off,on] → 关/开；没有 capabilities → 「模型未加载」；
//   在线三家 → 根本没有已接线的推理发现，一个控件都不画。
function surfaceReasoningHtml(surface, provider, model, cur) {
    try {
        // 提示语：先把「为什么这个模型长这样、那个模型长那样」说清楚 —— 用户第一反应是「坏了吗」。
        const shapeTip = '档位由模型自身能力决定：qwen3.8 声明支持四档（关/低/中/极高），'
            + 'qwen3.6 与 qwen3-1.7b 只声明了开关两档，所以它们的控件天生不一样，这不是故障。'
            + '选项来自 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models 的 '
            + 'capabilities.reasoning.allowed_options，本工具一个选项都不会自己发明。';
        const surfaceTip = (surface === 'chat')
            ? '这一档是**新对话的起点**：设置在这里，下次「清理」开新对话、或者换一份文档时生效。'
              + '想只改**当前**这段对话，用对话窗自己那条参数条 —— 它的修改不会回写到这里。'
            : '这一档就是翻译链路当场生效的值（和顶栏那个模型是同一份设置）。'
              + '对话窗那边的推理是另存一份，改这里不会动它，反过来也一样。';
        if (provider !== 'local') {
            return '<span style="' + SURFACE_REASON_SLOT + '" data-tip="'
                + escapeAttr('这一家没有任何已接线的逐模型推理发现（只有本地 LM Studio 有 /api/v1/models 这种端点）。'
                    + '画一个灰的、或者画一个「看着能设其实不发」的控件，都是撒谎，所以这里什么都不画。')
                + '" data-tip-pos="top"><span class="text-[10px] text-slate-300 italic">无推理发现</span></span>';
        }
        const caps = xportCapsPeek(AppState.localBaseUrl, model);
        if (caps === undefined) {
            return '<span style="' + SURFACE_REASON_SLOT + '"><span class="text-[10px] text-slate-300 italic">读取模型能力…</span></span>';
        }
        if (!caps) {
            const ok = xportCapsOk(AppState.localBaseUrl);
            const tip = (ok === false)
                ? '读不到 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models（LM Studio 没在跑，或版本过旧没有这个端点）。没有能力信息就不画控件。'
                : '模型未加载：LM Studio 的模型列表里没有这一项，拿不到它支持哪些推理档位。在 LM Studio 里加载该模型后重开本页即可。';
            return '<span style="' + SURFACE_REASON_SLOT + '" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top">'
                + '<span class="text-[10px] text-slate-300 italic">' + (ok === false ? '能力信息不可用' : '模型未加载') + '</span></span>';
        }
        const ctl = xportReasoningControl(caps.reasoning ? caps.reasoning.allowed : null);
        if (ctl.kind === 'none') {
            return '<span style="' + SURFACE_REASON_SLOT + '" data-tip="'
                + escapeAttr('该模型没有声明任何推理档位（capabilities.reasoning 缺失或为空），因此不提供推理开关。')
                + '" data-tip-pos="top"><span class="text-[10px] text-slate-300 italic">无推理档位</span></span>';
        }
        const on = cur !== 'off';
        const wire = XPORT_EFFORT_WIRE[cur] || 'none';
        const tip = shapeTip + surfaceTip
            + '「关」发的是 reasoning_effort:"none"，不是靠省略 —— 实测省略等于不推理，'
            + '而元数据里的 default 是 LM Studio 的界面默认值、不是 API 默认值。本档当前会发出去的是 "' + wire + '"。';
        const fn = (surface === 'chat') ? 'setChatDefaultReasoning' : 'setModelReasoning';
        const arg = (surface === 'chat') ? '' : ('\'' + escapeAttr(model) + '\',');
        let html = '<span style="' + SURFACE_REASON_SLOT + '" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top">'
            + '<span class="text-[10px] text-slate-500 font-medium shrink-0">推理</span>'
            + '<span class="flex items-center bg-slate-100 rounded-lg p-0.5 shrink-0">';
        [['off', XPORT_EFFORT_LABEL.off], ['on', XPORT_EFFORT_LABEL.on]].forEach(function (pair) {
            const active = (pair[0] === 'off') ? !on : on;
            // 多档模型点「开」时落到 medium（它一定在 allowed 里，否则不会被列出来）。
            const target = (pair[0] === 'on' && ctl.kind === 'select')
                ? (ctl.levels.indexOf('medium') !== -1 ? 'medium' : ctl.levels[0]) : pair[0];
            html += '<button onclick="' + fn + '(' + arg + '\'' + escapeAttr(target) + '\')"'
                + ' class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (active ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600') + '">'
                + escapeHtml(pair[1]) + '</button>';
        });
        html += '</span>';
        if (ctl.kind === 'select' && on) {
            const opts = ctl.levels.map(function (v) {
                return '<option value="' + escapeAttr(v) + '"' + (v === cur ? ' selected' : '') + '>'
                    + escapeHtml(XPORT_EFFORT_LABEL[v] || v) + '</option>';
            }).join('');
            html += '<select onchange="' + fn + '(' + arg + ' this.value)"'
                + ' class="text-[10px] font-bold text-purple-600 bg-slate-100 border-none rounded-lg py-0.5 pl-2 pr-5 outline-none cursor-pointer shrink-0">'
                + opts + '</select>';
        }
        return html + '</span>';
    } catch (e) { return ''; }
}

// 一整行。surface: 'translate' | 'chat'
function surfaceDefaultRowHtml(surface) {
    try {
        const isChat = surface === 'chat';
        const rec = SURFACE_RECOMMENDED[isChat ? 'chat' : 'translate'];
        const cur = isChat ? chatDefaultChoice()
                           : { provider: AppState.apiProvider, model: AppState.selectedModel, set: true };
        const curReason = isChat ? chatDefaultReasoningRaw(cur.model)
                                 : xportReasoningValue(AppState.localBaseUrl, cur.model);
        const modelTip = (isChat
            ? '开**新**对话时用哪个模型。改这里不会动正在进行的那段对话（那段用对话窗自己的参数条改），也不会动翻译。'
            : '翻译用哪个模型。这一项和顶栏的模型下拉是同一份设置，改这里顶栏也跟着变；对话窗那边是另一份，不受影响。')
            + '推荐：' + rec.model + ' —— ' + rec.why;

        let html = '<div class="flex items-center gap-2 flex-wrap py-1.5" data-surface-default="' + escapeAttr(surface) + '">'
            + '<span class="text-[11px] font-bold text-slate-600 w-10 shrink-0">' + (isChat ? '对话' : '翻译') + '</span>'
            + '<span data-tip="' + escapeAttr(modelTip) + '" data-tip-pos="top-start">'
            + '<select onchange="' + (isChat ? 'setChatDefaultModel' : 'setTranslateDefaultModel') + '(this.value)"'

            + surfaceModelOptionsHtml(cur.provider, cur.model) + '</select></span>'
            + surfaceReasoningHtml(surface, cur.provider, cur.model, curReason);

        if (isChat) {
            html += '<span style="' + SURFACE_REASON_SLOT + 'min-width:0;" data-tip="'
                + escapeAttr('新对话是否展开「思考」区。**纯显示**开关：它不改请求，也不改 reasoning_content 的去向 —— '
                    + '思考内容永远只进那块折叠区，永远不是答案、不会被「复制答案」带走、更不会被当成修改应用。'
                    + '推理关着时这块区域根本不出现（不画空盒子）。当前这段对话想临时改，用对话窗 ⋮ 里的同名开关，那边不回写这里。')
                + '" data-tip-pos="top-end">'
                + '<span class="text-[10px] text-slate-500 font-medium shrink-0">显示思考过程</span>'
                + '<span class="flex items-center bg-slate-100 rounded-lg p-0.5 shrink-0">'
                + '<button onclick="setChatShowThinking(false)" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (ChatDefaults.showThinking ? 'text-slate-400 hover:text-slate-600' : 'bg-white text-purple-600 shadow-sm') + '">关</button>'
                + '<button onclick="setChatShowThinking(true)" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (ChatDefaults.showThinking ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600') + '">开</button>'
                + '</span></span>';

            html += '<span style="' + SURFACE_REASON_SLOT + 'min-width:0;" data-tip="'
                + escapeAttr('开着的时候，模型每给出一条修改建议，卡片一出现就自动应用，不用你逐条点「应用」。'
                    + '**不会放松任何一道闸门**：目标行还在、没有别的请求正在覆盖这一行、这一行自捕获以来没被改过、'
                    + '那段文字还在原位置 —— 这四道闸门照样逐条核对，过不了照样中止、一个字节都不写，'
                    + '这个开关只省掉「问不问你」这一步。默认关。当前这段对话想临时改，用对话窗 ⋮ 里的同名开关，那边不回写这里。')
                + '" data-tip-pos="top-end">'
                + '<span class="text-[10px] text-slate-500 font-medium shrink-0">跳过审批</span>'
                + '<span class="flex items-center bg-slate-100 rounded-lg p-0.5 shrink-0">'
                + '<button onclick="setChatAutoApprove(false)" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (ChatDefaults.autoApprove ? 'text-slate-400 hover:text-slate-600' : 'bg-white text-purple-600 shadow-sm') + '">关</button>'
                + '<button onclick="setChatAutoApprove(true)" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all '
                + (ChatDefaults.autoApprove ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600') + '">开</button>'
                + '</span></span>';
        }

        // 「用推荐值」：只有那个模型确实在本机加载列表里时才给，否则按钮点了会指向一个不存在的模型。
        let has = false;
        try {
            has = (Array.isArray(AppState.localModels) ? AppState.localModels : [])
                .some(function (lm) { return String(lm.id) === rec.model; });
        } catch (e) { has = false; }
        const already = (cur.provider === rec.provider && cur.model === rec.model);
        if (has && !already) {
            html += '<button onclick="applyRecommendedDefault(\'' + escapeAttr(surface) + '\')"'
                + ' class="text-[10px] font-bold text-indigo-500 hover:text-indigo-700 underline decoration-dotted shrink-0"'
                + ' data-tip="' + escapeAttr('切到推荐值 ' + rec.model + '（推理设为「'
                    + (XPORT_EFFORT_LABEL[rec.reasoning] || rec.reasoning) + '」）。依据：' + rec.why
                    + ' 这只是推荐，选择器始终自由。') + '" data-tip-pos="top-end">用推荐值</button>';
        } else if (already) {
            html += '<span class="text-[10px] text-emerald-600 font-bold shrink-0" data-tip="'
                + escapeAttr('当前就是推荐值。依据：' + rec.why) + '" data-tip-pos="top-end">推荐 ✓</span>';
        }
        return html + '</div>';
    } catch (e) { return ''; }
}

function renderSurfaceDefaultsSection() {
    try {
        return '<div class="pb-5 border-b border-slate-100">'
            + '<div class="flex items-center gap-2 mb-1">'
            + '<h4 class="text-xs font-bold text-slate-700">默认模型</h4>'
            + '<span class="text-[10px] text-slate-400" data-tip="'
            + escapeAttr('翻译和对话各有各的默认模型与推理档位，互不影响 —— 因为同一个模型在这两件事上的**实测**代价差一个数量级：'
                + 'qwen3.6 开推理慢 6–10 倍、约 92% 的生成 token 花在推理上；qwen3.8 开推理只多约 291 个推理 token、约 0.99 倍速度。'
                + '而推理对翻译实测没有质量收益，对话才是它值得开的地方。所以「一个全局默认模型」必然在其中一边是错的。')
            + '" data-tip-pos="top-start">两边分开存 · 实测依据见悬停</span></div>'
            // 这里是 HTML，不是 Markdown：强调要用 <strong>，写 `**…**` 只会把星号原样印出来。
            + '<p class="text-[10px] text-slate-400 mb-2 leading-relaxed">'
            + escapeHtml('翻译这一行当场生效；对话这一行是') + '<strong class="text-slate-500">'
            + escapeHtml('新对话的起点') + '</strong>'
            + escapeHtml(' —— 对话窗自己那条参数条随时可以覆盖当前这段对话，且不会回写到这里。')
            + '</p>'

            + surfaceDefaultRowHtml('chat')
            + '</div>';

// —— 定点重绘 ——
// 和 xportCapsPaint 一样：只换这两行的容器，弹窗里其它节点（含没保存的输入框）零影响。
function surfaceDefaultsPaint() {
    try {
        if (typeof document === 'undefined') return;
        const nodes = document.querySelectorAll('[data-surface-default]');
        for (let i = 0; i < nodes.length; i++) {
            const s = nodes[i].getAttribute('data-surface-default');
            const html = surfaceDefaultRowHtml(s);
            // 外层 div 由 surfaceDefaultRowHtml 自己带，所以整块替换掉这个节点。
            if (html && nodes[i].parentNode) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                if (tmp.firstChild) nodes[i].parentNode.replaceChild(tmp.firstChild, nodes[i]);
            }
        }
    } catch (e) {}
}

// 翻译那一行的模型选择器 = 顶栏那个翻译模型。**不走 renderApp**（会冲掉没保存的 API Key），
// 所以这里手工把顶栏也同步一下：selectModel 里那三件事（改状态、落盘、重绘）逐条照做。
function setTranslateDefaultModel(value) {
    try {
        const s = String(value == null ? '' : value);
        const i = s.indexOf(':');
        if (i <= 0) return;
        const prov = s.slice(0, i);
        const id = sanitizeModelId(s.slice(i + 1));
        if (!id || (prov !== 'local' && MODEL_PROVIDERS.indexOf(prov) === -1)) return;
        AppState.apiProvider = prov;
        AppState.selectedModel = id;
        try {
            localStorage.setItem('apiProvider', prov);
            localStorage.setItem('selectedModel', id);
        } catch (e) {}
        surfaceDefaultsPaint();
        try { xportCapsPaint(); } catch (e) {}
        // 顶栏那颗模型按钮的文字也得跟上，否则设置里改完、顶栏还写着旧模型 —— 两处不一致就是撒谎。
        // **定点改一个文字节点**，不走 renderApp：整页重渲染会把还没点「保存」的 API Key 输入框冲掉
        // （那几个输入框的值只活在 DOM 里，saveSettings 时才读进 AppState）。
        try {
            const lab = document.getElementById('headerModelLabel');
            if (lab) {
                lab.textContent = (prov === 'local')
                    ? (id === 'local-model' ? 'Local LLM' : (id.length > 15 ? id.slice(0, 15) + '...' : id))
                    : getModelShortLabel(id);
            }
        } catch (e) {}
        // 对话窗那条参数条在用户没钉过模型时是**跟着翻译模型走**的，所以它也得重画。
        try { chatRenderParamBar(); chatUpdateBar(); } catch (e) {}
    } catch (e) {}
}

function setChatDefaultModel(value) {
    try {
        const s = String(value == null ? '' : value);
        const i = s.indexOf(':');
        if (i <= 0) return;
        const prov = s.slice(0, i);
        const id = sanitizeModelId(s.slice(i + 1));
        if (!id || (prov !== 'local' && MODEL_PROVIDERS.indexOf(prov) === -1)) return;
        ChatDefaults.provider = prov;
        ChatDefaults.model = id;
        chatDefaultsSave();
        // 能力表可能还没拉过这个模型：拉一次（60 秒内不重复请求），回来后重绘控件形态。
        if (prov === 'local') { try { xportCapsWarm(); } catch (e) {} }
        surfaceDefaultsPaint();
    } catch (e) {}
}

function setChatDefaultReasoning(value) {
    try {
        const c = chatDefaultChoice();
        const v = (typeof value === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, value))
            ? value : XPORT_REASONING_DEFAULT;
        if (!ChatDefaults.reasoningByModel || typeof ChatDefaults.reasoningByModel !== 'object') ChatDefaults.reasoningByModel = {};
        ChatDefaults.reasoningByModel[c.model] = v;
        chatDefaultsSave();
        surfaceDefaultsPaint();
    } catch (e) {}
}

function setChatShowThinking(on) {
    try {
        ChatDefaults.showThinking = !!on;
        chatDefaultsSave();
        surfaceDefaultsPaint();
    } catch (e) {}
}

function setChatAutoApprove(on) {
    try {
        ChatDefaults.autoApprove = !!on;
        chatDefaultsSave();
        surfaceDefaultsPaint();
    } catch (e) {}
}

function applyRecommendedDefault(surface) {
    try {
        const isChat = surface === 'chat';
        const rec = SURFACE_RECOMMENDED[isChat ? 'chat' : 'translate'];
        if (isChat) {
            setChatDefaultModel(rec.provider + ':' + rec.model);
            setChatDefaultReasoning(rec.reasoning);
        } else {
            setTranslateDefaultModel(rec.provider + ':' + rec.model);
            setModelReasoning(rec.model, rec.reasoning);
        }
    } catch (e) {}
}

function renderSettingsModal() {
    if (!AppState.showSettings) return '';
    // 当前页签。normalize 一遍：localStorage 里的脏值/老版本残留不能让四个面板全都不显示。
    const activeTab = normalizeSettingsTab(AppState.settingsTab);

    // 在线模型全部来自 getModelCatalog()（种子 + API + 钉住当前选中项），不再有硬编码数组
    const modelQuery = (AppState.settingsModelQuery || '').trim().toLowerCase();
    const anyRefreshing = MODEL_PROVIDERS.some(p => AppState.modelRefresh[p].status === 'loading');
    const onlineGroups = MODEL_PROVIDERS.map(p => ({
        provider: p,
        label: MODEL_PROVIDER_LABEL[p],
        state: AppState.modelRefresh[p],
        models: getModelCatalog(p).filter(m => !modelQuery
            || m.id.toLowerCase().includes(modelQuery)
            || String(m.name || '').toLowerCase().includes(modelQuery))
    }));
    const totalOnline = onlineGroups.reduce((n, g) => n + g.models.length, 0);
    // modelGroupExpanded 理论上恒为 {gemini,openai,claude} 形状的对象（见 openSettings/openLocalSettings），
    // 但防御性兜底：万一它是 null/undefined/非对象，下面按 g.provider 取值会直接抛错，而 renderApp()
    // 是先把整段 innerHTML 拼完才赋值的，拼接期间抛错会让页面冻结在上一帧、之后每次点击都再抛一次，
    // 不刷新页面救不回来。所以这里兜底成 {}，配合 toggleModelGroup 里的写兜底一起生效。
    const gexp = (AppState.modelGroupExpanded && typeof AppState.modelGroupExpanded === 'object') ? AppState.modelGroupExpanded : {};

    // 拖拽中优先用「正在进行时」的宽度（避免拖拽途中被 toast/刷新等异步 setState 弹回上次已提交的值），
    // 否则用 AppState 里持久化的宽度；两者都经过夹紧，且渲染时再叠一层 CSS min(...,95vw) 防止在
    // 小窗口/加载了过大的历史 localStorage 值时把弹窗撑出视口。
    const settingsModalWidthPx = settingsModalDragWidth != null
        ? clampSettingsModalWidth(settingsModalDragWidth)
        : clampSettingsModalWidth(AppState.settingsModalWidth);

    return `
        <div class="fixed inset-0 z-[100] bg-black/20 backdrop-blur-sm flex items-center justify-center p-4">
            <div id="settingsModalPanel" class="relative bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-h-[90vh] overflow-hidden flex flex-col" style="max-width:min(${settingsModalWidthPx}px, 95vw);">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 shrink-0">

                        ${Icons.SettingsGear} Settings

                    <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600" data-tip="关闭设置。已点过「保存」的内容都已生效；没点保存的输入框会丢弃。" data-tip-pos="left">${Icons.X}</button>
                </div>
${renderSettingsTabBar(activeTab)}
                <!-- mr-2.5 = 拖拽手柄的 w-2.5：把整个滚动容器（连同它右内缘那条 6px 的 custom-scrollbar）
                     整体左移 10px 让开手柄，否则手柄会把滚动条整条盖住、鼠标拖不动滚动条。
                     右内边距用 pr-4 而非 p-6 的 pr-6，把让出去的 10px 视觉上补回来。 -->
                <div id="settingsScrollArea" class="pt-6 pb-6 pl-6 pr-4 mr-2.5 overflow-y-auto custom-scrollbar flex-1 min-h-0">
                    <div data-settings-panel="models" class="settings-panel${activeTab === 'models' ? ' is-active' : ''} space-y-6">
                    <!-- 默认模型：翻译一行、对话一行。刻意放在「模型可见性」列表**上面** ——
                         放在下面会读成「又一条按模型的设置」，而它是这一页的结论，不是明细。 -->
                    ${renderSurfaceDefaultsSection()}
                    <!-- Online Model Visibility Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2" data-tip="控制顶栏模型下拉里出现哪些在线模型。列表本身要点右边的「更新」才会去各家 API 拉新的。" data-tip-pos="bottom-start">
                                <div class="w-6 h-6 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-white">
                                    ${Icons.Globe}
                                </div>
                                <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Online Models Visibility</span>
                            </div>
                            <button onclick="refreshOnlineModelsClick('all')" ${anyRefreshing ? 'disabled' : ''} class="flex items-center gap-1.5 px-3 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-bold text-[10px] shadow-md shadow-violet-200 active:scale-95 transition-all disabled:opacity-50 shrink-0" data-tip="向三家 API 各要一次最新模型列表（要先填好对应的 Key）。新发现的模型默认不勾选，需要自己勾上。" data-tip-pos="bottom-end">
                                ${anyRefreshing ? Icons.LoaderSmall : Icons.RefreshCw}

                        </div>

// ============= 历史菜单 =============
function renderHistoryMenu() {
    return `
        <div class="relative">
            <button onclick="toggleHistoryMenu()" class="relative p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-all" data-tip="最近保存过的会话快照，点其中一条即可把当时的原文和译文整体恢复回来（会覆盖当前内容）。角标「未存」= 这一刻屏幕上的内容还没写进本地存档；写入失败（配额满、隐私模式、被别的标签页占住）时它会一直亮着，点开菜单看红字说明。" data-tip-pos="bottom-start">
                ${Icons.History}
                <!-- 落盘状态角标。防抖窗口里关标签/刷新会丢这一次改动（见 xportPersistUnsaved
                     上面那段），所以「还没存」这件事必须在顶栏一直看得见，而不是藏在这个
                     菜单里等用户点开。首帧由模板给出正确初值，之后由 xportPersistBadgeSync
                     直接改这一个节点（不重渲染，理由同 syncTranslateButtonState）。 -->
                <span id="persistPendingDot" style="display:${xportPersistUnsaved() ? '' : 'none'}"
                      class="absolute top-0 right-0 px-1 rounded-full bg-amber-500 text-white text-[8px] font-bold leading-[13px] pointer-events-none">未存</span>
            </button>
            ${AppState.showHistoryMenu ? `
                <div id="historyMenuPopup" class="absolute top-full right-0 mt-2 w-80 bg-white border border-slate-200 shadow-2xl rounded-2xl p-4 z-[70]">
                    <!-- History Settings Header -->
                    <div class="mb-4 pb-3 border-b border-slate-100">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                            ${Icons.Settings2} History Settings
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-xs text-slate-600 font-medium">Keep Last:</span>
                            <div class="flex items-center bg-slate-100 rounded-lg p-0.5">
                                ${[5, 10, 20].map(limit => `
                                    <button onclick="setHistoryLimit(${limit})" class="px-2 py-0.5 rounded-md text-[10px] font-bold transition-all ${AppState.historyLimit === limit ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}">
                                        ${limit}
                                    </button>
                                `).join('')}
                                <div class="w-px h-3 bg-slate-200 mx-1"></div>
                                <input type="number" id="customHistoryLimitInput" min="1" value="${AppState.historyLimit}" class="w-8 bg-transparent text-[10px] font-bold text-center outline-none text-slate-600 border-none" onchange="setHistoryLimitCustom(this.value)">
                            </div>
                        </div>
                    </div>
                    
                    <!-- 落盘状态：这个面板承诺「会话可以恢复」，所以它必须说实话。
                         存成功了就说存到哪一刻，存失败了 / 让位给别的标签页了就红字常驻
                        （toast 会消失，这行不会）。
                         ⚠️ 「刷新页面可恢复」这句话只有在**真的写成功过一次**时才成立：
                         persistOkAt 只在写事务 oncomplete 之后才被赋值，跳过写（空快照、
                         或让位给另一个标签页）一律不赋值。上一版这行在盘上那条记录正被
                         一个空白标签页清掉的同一刻还在显示它，那是这轮里最刺眼的一句假话。
                         ⚠️ 第二句假话（本轮实测并改掉）：persistOkAt 只说「上一次写成功是几点」，
                         它**不知道**此刻还有没有一次防抖没落地的改动。于是屏幕上是新文本、
                         盘上是旧文本的那 1.2 秒里，这行字照旧写着「刷新页面可恢复」——
                         而刷新恰恰会把那次改动丢掉。文案现在统一由 xportPersistStatusText()
                         给出（见它上面那段实测记录），未落盘时明说「会丢」。 -->
                    ${AppState.persistError ? `
                        <div class="mb-3 p-2 rounded-lg bg-rose-50 border border-rose-200 text-[10px] leading-relaxed text-rose-700">
                            ⚠️ ${escapeHtml(AppState.persistError)}
                        </div>
                    ` : `
                        <div id="persistStatusLine" class="mb-3 text-[10px] ${xportPersistUnsaved() ? 'text-amber-600 font-medium' : 'text-slate-400'}">
                            ${escapeHtml(xportPersistStatusText())}
                        </div>
                    `}

                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                        ${Icons.Clock} Recent Sessions
                    </h4>
                    ${AppState.globalHistory.length === 0 ? `
                        <div class="text-center py-4 text-slate-300 text-xs italic">No history available yet.</div>
                    ` : `
                        <div class="space-y-2 max-h-[300px] overflow-y-auto custom-scrollbar pr-1">
                            ${AppState.globalHistory.map((item, idx) => `
                                <button onclick="restoreHistoryItem(${idx})" class="w-full text-left p-3 rounded-xl border transition-all group ${item.id === AppState.sessionId ? 'bg-indigo-50 border-indigo-200' : 'bg-slate-50 border-slate-100 hover:bg-white hover:border-indigo-100'}">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-[10px] font-bold ${item.id === AppState.sessionId ? 'text-indigo-600' : 'text-slate-400 group-hover:text-indigo-400'}">
                                            ${new Date(item.timestamp).toLocaleTimeString()}${item.id === AppState.sessionId ? ' (Current)' : ''}
                                        </span>
                                        <span class="text-[9px] bg-slate-200 text-slate-500 px-1.5 rounded group-hover:bg-indigo-200 group-hover:text-indigo-700">
                                            ${item.pairs.length} segs
                                        </span>
                                    </div>
                                    <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed">
                                        ${escapeHtml(item.pairs[0]?.src || 'Empty content')}
                                    </p>
                                </button>
                            `).join('')}
                        </div>
                    `}
                </div>
            ` : ''}
        </div>
    `;
}

// ============= 模型选择器 =============
// 在线组被用户全部隐藏时的兜底文案（对齐本地组的 "All local models hidden. Check Settings."）。
// 没有它的话该区块会渲染成一个只有标题、没有任何按钮的空壳。
const MODEL_GROUP_EMPTY_HINT = `<div class="text-[10px] text-slate-400 italic text-center py-2 bg-white/60 rounded-lg">该厂商模型已全部隐藏，请在 Settings 勾选</div>`;

function renderModelSelector() {
    // 单一事实源：目录与可见性全部从 getModelCatalog / getVisibleModels 派生，
    // 不再有第二份硬编码 id 列表（原来那三个数组已删除）。
    const geminiModels = getVisibleModels('gemini');
    const openaiModels = getVisibleModels('openai');
    const claudeModels = getVisibleModels('claude');

    let currentIcon, currentIconClass, currentLabel;
    if (AppState.apiProvider === 'local') {
        currentIcon = Icons.Server;
        currentIconClass = 'text-indigo-600';
        currentLabel = AppState.selectedModel === 'local-model' ? 'Local LLM' : (AppState.selectedModel.length > 15 ? AppState.selectedModel.slice(0, 15) + '...' : AppState.selectedModel);
    } else {
        // 查目录拿图标/配色/短标签。原来那串写死的 if/else 会把任何新模型误标成
        // GPT-5.2 / Opus 4.5 / 3 Pro —— 这是「更新」按钮最容易被忽略的连带 bug。
        const currentMeta = getModelMeta(AppState.selectedModel);
        currentIcon = (currentMeta && currentMeta.icon) || Icons.Cpu;
        currentIconClass = (currentMeta && currentMeta.iconClass) || 'text-indigo-600';
        currentLabel = getModelShortLabel(AppState.selectedModel);
    }

    return `
        <div class="relative">
            <button onclick="toggleModelMenu()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-2xl border border-slate-200 transition-all text-xs font-bold text-slate-700 active:scale-95" data-tip="当前用来翻译的模型。点开可在 Gemini / OpenAI / Claude / 本地 LM Studio 之间切换；列表里没有的模型去「设置 → 模型」勾选。" data-tip-pos="bottom-start">
                <span class="${currentIconClass}">${currentIcon}</span>
                <!-- id 是给「设置 → 模型 → 默认模型」的翻译行用的：那里改了模型不能走 renderApp
                     （会冲掉还没点保存的 API Key 输入框），所以它定点改这一个文字节点。
                     两处显示的必须永远是同一个模型 —— 顶栏还写着旧模型就是在撒谎。 -->
                <span class="uppercase tracking-wider" id="headerModelLabel">${escapeHtml(currentLabel)}</span>
                <span class="transition-transform duration-200 ${AppState.showModelMenu ? 'rotate-180' : ''}">${Icons.ChevronDown}</span>
            </button>
            ${AppState.showModelMenu ? `

                <div class="flex items-center gap-3">

                                ${Icons.PenLine} Edit
                            </button>
                            <button onclick="setViewMode('preview')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${AppState.viewMode === 'preview' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}" data-tip="左栏按句排开、与右栏译文逐行对齐，LaTeX 公式渲染成成品样子。想逐句对照校对就用这个。" data-tip-pos="bottom">
                                ${Icons.Eye} Preview
                            </button>
                            <button onclick="setViewMode('original')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${AppState.viewMode === 'original' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}" data-tip="显示最初粘贴进来的那份原始文本（未拆句、未被逐句编辑修改过），只读，用于核对。" data-tip-pos="bottom-end">

                    <button onclick="handleClear()" class="text-slate-400 hover:text-rose-500 p-2 transition-colors" data-tip="清空输入框和左右两栏的全部内容，重新开始。已保存过的历史快照不受影响。" data-tip-pos="left">${Icons.Trash2}</button>
                </div>
            </div>
            <div class="flex-grow flex flex-col overflow-hidden bg-slate-50/20">

// （原 renderAiInsightDrawer 已删除，连同它在上面 <section> 里的调用点。
//   它渲染在 #root 内部，每次 renderApp 都会被 innerHTML 整个重建 —— 而 renderApp 在用户
//   什么都没做的时候也会跑（showToast 每次两轮、自动存档定时器 1~5 分钟一轮）。
//   浮动对话窗故意不走这条路：它挂在 <body> 上，renderApp 一行都碰不到它。）

// ============= 翻译对行渲染 =============
function renderPairRow(side, pair, idx) {
    const isEditing = AppState.activeIndex === idx;
    const textValue = side === 'src' ? pair.src : pair.tgt;
    const editValue = side === 'src' ? AppState.editValues.src : AppState.editValues.tgt;
    // 整篇翻译 / 整篇重新生成期间这一行是**只读**的（理由见 handleRowClick 上方那段注释）。
    // 光在 handleRowClick 里挡住还不够：行还带着 cursor-pointer 和悬停抬起效果，
    // 那本身就是一句「点我，能编」的承诺。这里把承诺一并撤掉，点下去再由 toast 说明原因。
    const rowLocked = AppState.isRegeneratingAll || AppState.isLoading;

    // 整篇操作期间**正在打开**的那一行也必须锁住。上一版 rowLocked 只用在 else 分支：
    // 实测 `open row carries the lock tooltip = false`、`OTHER rows carry the lock tooltip = true`，
    // 而 toast 同时说着「这期间不能逐句编辑」—— 屏幕上明摆着一个能打字的框在打这句话的脸。
    // handleTranslate / handleRegenerateAll 现在都会在开始之前先把这一行收掉，所以正常路径下
    // 走不到这里；这一支是兜底（例如别处直接置了 isLoading），一旦发生也要**看得出来**不能用。
    const lockTip = escapeAttr(AppState.isRegeneratingAll
        ? '整篇重新生成进行中，这几分钟里逐句编辑是关掉的：跑完会把整篇译文换成新的一版。'
        : '整篇翻译进行中，这几分钟里逐句编辑是关掉的：翻完会把整篇译文换成新的一版。');

    if (isEditing) {
        return `
            <div class="group relative p-4 rounded-xl transition-all border ${rowLocked ? 'cursor-not-allowed opacity-60' : 'cursor-pointer'} bg-white border-indigo-300 shadow-xl ring-4 ring-indigo-50 z-20 scale-[1.01]" data-idx="${idx}" data-side="${side}"${rowLocked ? ` data-tip="${lockTip}" data-tip-pos="top"` : ''}>
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-30">
                    ${renderHistoryControls(pair, idx)}
                </div>
                <div class="relative flex flex-col gap-3">
                    <div class="absolute -top-10 right-0 z-40 flex items-center gap-2">
                        <button onclick="event.stopPropagation();triggerSaveRowUpdate(${idx});" ${rowLocked ? 'disabled' : ''} class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-white text-xs font-bold shadow-lg transition-all ${rowLocked ? 'bg-slate-300 cursor-not-allowed' : pair.isUpdating ? 'bg-rose-500 hover:bg-rose-600' : 'bg-indigo-600 hover:bg-indigo-700'}" data-tip="${rowLocked ? lockTip : pair.isUpdating ? '正在更新这一句，点一下停下来。' : '保存你刚才手改的内容，并让模型把另一侧那句同步改过来（改原文→重译，改译文→回译校对）。'}" data-tip-pos="left">
                            ${pair.isUpdating ? `<span class="animate-pulse">${Icons.StopCircle}</span> Stop` : `${Icons.PenLineSmall} Update`}
                        </button>

                     附加曾经是「让模型看得见这一句」的唯一通道；文档现在每一轮整篇发过去，
                     那个用途没有了，剩下的需求是「这几处请多留意」，那是一个**多选**的状态，
                     不是一个动作，所以它是复选框而不是按钮。
                     绝对定位，脱离文档流 ⇒ 对行高、对左右两栏 1px 对齐不变式没有任何影响
                     （行高由 syncBilingualAlignment 按 getBoundingClientRect 逐对补齐）。
                     它也不在 .prose 里面，跨栏高亮和关注高亮的文本节点遍历
                     （findRenderedRowBody → .prose）都看不到它，不会把「关注」两个字画上黄底。
                     ⚠️ C2：两层 stopPropagation 是必须的 —— 外层挡住 handleRowClick（点行进编辑态），
                     它同时也让这次点击到不了 document 上的 handleGlobalClick（那家伙会 saveRowUpdate
                     并退出编辑态）。handleGlobalClick 里另有一条按 [data-focus-cb] 的显式豁免兜底。 -->
                ${focusCheckboxHtml(idx, side, 'row')}
                ${side === 'src' && xportRowDropsColorMacros(pair) ? `

                     而改动压在了宏语法上）。绝对定位，脱离文档流 —— 对行高和左右两栏
                     逐像素对齐没有任何影响，理由同上面「关注」复选框。 -->
                <span class="absolute top-1.5 left-1.5 z-10 text-[11px] leading-none text-amber-500 select-none" data-tip="这一行的 \\textcolor 修订标记带不回来：你改过这一行的原文，改动压在了颜色宏上。复制原文 / 切到大输入框 / 重新生成时，这一行是不带宏的纯文本（其余行原样保留）。需要那几处标记就到「历史」里取回改动前的那一版。" data-tip-pos="top">⚠</span>

// ============= 事件绑定 =============
function attachEventListeners() {
    // 主输入框
    const mainInput = document.getElementById('mainInput');
    if (mainInput) {
        mainInput.addEventListener('input', (e) => handleInputChange(e.target.value));
    }

    // 编辑文本框
    AppState.translationPairs.forEach((pair, idx) => {
        ['src', 'tgt'].forEach(side => {
            const textarea = document.getElementById(`editTextarea_${side}_${idx}`);
            if (textarea) {
                textarea.addEventListener('input', (e) => {
                    // 只更新状态值，不触发重新渲染
                    AppState.editValues[side] = e.target.value;
                    
                    // 关闭同义词弹窗但不重新渲染整个页面
                    // （走 updateSynonymState 而不是手动 remove：它会顺带把选中高亮层一起清掉，
                    //   否则用户一边打字、一边还留着一段位置早就对不上的 <mark>）
                    if (AppState.synonymState.show) {
                        updateSynonymState({ show: false });
                    }

                    autoResizeTextarea(textarea);
                });
                textarea.addEventListener('mouseup', (e) => handleTextSelect(e, side, idx));
                autoResizeTextarea(textarea);
            }

            const refineInput = document.getElementById(`refineInput_${side}_${idx}`);
            if (refineInput) {
                refineInput.addEventListener('input', (e) => {
                    // 只更新状态，不触发渲染
                    AppState.refinePrompt = e.target.value;
                });
                refineInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        triggerCustomRefine(idx, side);
                    }
                });
            }
        });
    });

    // 全局点击（关闭菜单）
    document.removeEventListener('mousedown', globalClickHandler);
    document.addEventListener('mousedown', globalClickHandler);

    // 两栏滚动联动（节点每轮全新，这里跟着重绑）
    bindPaneScrollSync();
}

function globalClickHandler(event) {
    const target = event.target;
    
    // 关闭同义词弹窗
    const synonymPopup = document.getElementById('synonymPopup');
    if (synonymPopup && !synonymPopup.contains(target)) {
        updateSynonymState({ show: false });
    }
    
    // 关闭设置弹窗（如果点击在弹窗外部）
    if (AppState.activeSettingsPopup !== null) {
        const popover = target.closest('.absolute.top-full');
        const settingsButton = target.closest('[onclick*="toggleSettingsPopup"]');
        if (!popover && !settingsButton) {
            closeSettingsPopup();
        }
    }
    
    // 关闭各种菜单
    if (AppState.showModelMenu && !target.closest('[onclick*="toggleModelMenu"]') && !target.closest('.absolute')) {
        AppState.showModelMenu = false;
        renderApp();
    }
    if (AppState.showHistoryMenu && !target.closest('[onclick*="toggleHistoryMenu"]') && !target.closest('.absolute')) {
        AppState.showHistoryMenu = false;
        renderApp();
    }
    if (AppState.showSaveMenu && !target.closest('[onclick*="toggleSaveMenu"]') && !target.closest('.absolute')) {
        AppState.showSaveMenu = false;
        renderApp();
    }
}

function autoResizeTextarea(textarea) {
    if (!textarea) return;
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
    // 编辑框长高 = 这一行长高 = 左右两栏当场错位。这是行高变化最高频的来源，
    // 直接在这里补一刀，不指望 ResizeObserver（它和 rAF 一样绑在渲染步骤上，
    // 后台标签页里根本不回调）。scheduleAlignSync 自带合并，连打字也只会每轮跑一次。
    scheduleAlignSync();
}

// ============= Settings 页签切换 =============
// ⚠️ 刻意**不走 setState/renderApp**。两个理由，缺一不可：
//   1) 保住输入到一半的 API Key。renderApp 会用 AppState 里的旧值重建 <input value="...">，
//      而 Key 只有点了 Save 才进 AppState —— 一旦重渲染，没保存的那串就没了。
//      四页内容全都在 DOM 里、切页只切 class，输入框节点根本没被碰过，自然不会丢。
//   2) 渲染路径（root.innerHTML）外面没有 try/catch，抛一次就永久冻页。切页这条路上
//      一行渲染代码都不跑，风险归零；整段还是包了 try/catch，最坏情况只是页签没切动。
// AppState.settingsTab + localStorage 只负责「下一次整体重渲染 / 重开弹窗时落在哪一页」。
function setSettingsTab(tab) {
    const t = normalizeSettingsTab(tab);
    AppState.settingsTab = t;
    try {
        localStorage.setItem('settingsTab', t);
    } catch (e) {}
    try {
        const panels = document.querySelectorAll('[data-settings-panel]');
        for (let i = 0; i < panels.length; i++) {
            panels[i].classList.toggle('is-active', panels[i].getAttribute('data-settings-panel') === t);
        }
        const tabs = document.querySelectorAll('[data-settings-tab]');
        for (let i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('is-active', tabs[i].getAttribute('data-settings-tab') === t);
        }
        // 换页后回到顶部：不然从「模型」那页滚到底再切过去，新页面会停在一片空白处
        const scroller = document.getElementById('settingsScrollArea');
        if (scroller) scroller.scrollTop = 0;
    } catch (e) {
        console.warn('[settings] 切换页签失败：', e && e.message);
    }
}

// ============= 句对行距（TASK 3）=============
// 拖动中：只写一次 CSS 变量 + 更新那个数字标签，然后叫一次对齐同步。
// 不 setState、不 renderApp —— 拖拽期间每帧重建整页 DOM 会又卡又丢焦点。
// scheduleAlignSync 自带「本轮已排队就合并」，一次拖拽最多每帧跑一遍对齐，
// 而且它内部是「先清空补白 → 一次性读完 → 一次性写回」的批处理，不会 layout thrash；
// ResizeObserver 那边看到的是我们自己写的尺寸变化，alignSyncApplying 会把它挡掉，不会互相打架。
//
// ⚠️ 这里**不能**直接叫 scheduleAlignSync()，必须走 alignSyncKeepingScroll()。
// syncBilingualAlignment 的「写 1」阶段会先把每一行的 minHeight 清空再量高度，
// 那一瞬间目标栏塌回自然高度（中文比英文短一大截），浏览器当场把它的 scrollTop
// 夹到新的上限；「写 2」把行高补回去，但夹掉的滚动位置**再也没人恢复**，
// 随后 bindPaneScrollSync 还会把这个被夹过的值同步回源栏。
// 实测：滚到底（scrollTop 2851）时动一格滑块，两栏一起跳回 1621 —— 用户正在校对的
// 那句话被甩出去 1230px。文档后 44%（scrollTop > 目标栏自然高度上限 1598）全中招。
// renderApp 早就防过同一件事（见它里面「先对齐则两栏高度一致，赋值不会被夹」那段注释），
// 这两个新 handler 当初漏抄了这道保险。
function handleRowGapInput(value) {
    const gap = clampRowGap(value);
    AppState.rowGap = gap;
    applyRowGapToDom(gap);
    try {
        const label = document.getElementById('rowGapValue');
        if (label) label.textContent = gap + 'px';
    } catch (e) {}
    alignSyncKeepingScroll();   // 行距变了 = 行几何变了，必须重跑对齐，否则左右两栏当场散架
}

// 松开鼠标（change）才落盘。拖拽途中每帧写 localStorage 没必要。
function commitRowGap(value) {
    const gap = clampRowGap(value);
    AppState.rowGap = gap;
    applyRowGapToDom(gap);
    try {
        localStorage.setItem('rowGap', String(gap));
    } catch (e) {}
    alignSyncKeepingScroll();
}

function resetRowGap() {
    AppState.rowGap = ROW_GAP_DEFAULT;
    applyRowGapToDom(ROW_GAP_DEFAULT);
    try {
        localStorage.setItem('rowGap', String(ROW_GAP_DEFAULT));
    } catch (e) {}
    try {
        const slider = document.getElementById('rowGapSlider');
        if (slider) slider.value = String(ROW_GAP_DEFAULT);
        const label = document.getElementById('rowGapValue');
        if (label) label.textContent = ROW_GAP_DEFAULT + 'px';
    } catch (e) {}
    alignSyncKeepingScroll();
}

// 刻意**不**走 renderApp：这个勾选框长在设置弹窗里，全量重渲染会把弹窗整块重建，

// 哨兵传输协议开关。写 localStorage 失败（隐私模式 / 配额满）也绝不能把设置面板炸掉。

// Settings 弹窗右边缘拖拽调宽。刻意不走 setState/renderApp——renderSettingsModal() 整段走
// root.innerHTML 重建，拖拽中每次 mousemove 都 setState 会和重渲染打架、肉眼可见地弹回起点。
// 做法：mousedown 记录起点，mousemove 直接把新宽度写进 DOM（每次都用 id 重新查一遍元素，
// 因为拖拽过程中可能被别的异步 setState —— 比如 toast 3 秒后自动消失 —— 整体重渲染一次，
// 之前 mousedown 时拿到的节点引用会变成一个脱离文档树的旧节点，继续写它的 style 不会有任何
// 视觉效果），mouseup 才落盘进 AppState + localStorage。
function startSettingsModalResize(e) {
    e.preventDefault();
    const panel = document.getElementById('settingsModalPanel');
    if (!panel) return;
    const startX = e.clientX;
    const startWidth = panel.getBoundingClientRect().width;
    let finished = false;                       // onUp 幂等哨兵：blur / buttons===0 兜底可能和真 mouseup 重复触发
    document.body.classList.add('is-resizing-settings-modal');

    function onMove(ev) {
        // 兜底 1：鼠标已经松开却还在收 mousemove（在浏览器窗口外松手、右键系统菜单吞掉 mouseup、
        // 拖拽中 Alt-Tab 切窗口）。ev.buttons === 0 是「mouseup 丢了」的确定信号，立刻收尾自愈，
        // 否则 document 上的监听不会解绑，body 的 is-resizing 类会粘死（全局 ew-resize + 禁选中），
        // 并且之后光是移动鼠标就会「幽灵拖拽」改宽度。
        if (ev.buttons === 0) { onUp(); return; }
        const live = document.getElementById('settingsModalPanel');
        if (!live) return;
        const dx = ev.clientX - startX;
        const viewportCap = Math.max(SETTINGS_MODAL_MIN_WIDTH, Math.round(window.innerWidth * 0.95));
        const maxAllowed = Math.min(SETTINGS_MODAL_MAX_WIDTH, viewportCap);
        // 弹窗被 overlay 的 justify-center 水平居中：宽度每增加 2px，右边缘才右移 1px。
        // 所以要让手柄贴住光标，宽度增量必须取 dx * 2，否则手柄会从光标下面「逃走」。
        const newWidth = Math.max(SETTINGS_MODAL_MIN_WIDTH, Math.min(maxAllowed, startWidth + dx * 2));
        live.style.maxWidth = `min(${newWidth}px, 95vw)`;
        settingsModalDragWidth = newWidth;
    }
    function onUp() {
        if (finished) return;
        finished = true;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        window.removeEventListener('blur', onUp);   // 兜底 2 的对称解绑
        document.body.classList.remove('is-resizing-settings-modal');
        if (settingsModalDragWidth != null) {
            const finalWidth = clampSettingsModalWidth(settingsModalDragWidth);
            settingsModalDragWidth = null;
            AppState.settingsModalWidth = finalWidth;
            try {
                localStorage.setItem('settingsModalWidth', String(finalWidth));
            } catch (e) {}
            // 宽度已经通过 AppState 落盘；不需要再 renderApp()——DOM 上的宽度已经是最终值了，
            // 下次任何原因触发的重渲染会自然带上这个持久化后的宽度（见 renderSettingsModal 里
            // 对 settingsModalDragWidth / AppState.settingsModalWidth 的读取）。
        }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    // 兜底 2：拖到窗口外松手 / Alt-Tab 切走时浏览器只给 blur，不给 mouseup。
    window.addEventListener('blur', onUp);
}

// 双击拖拽手柄：恢复默认宽度（同样直接改 DOM + 落盘，不整段重渲染）
function resetSettingsModalWidth() {
    settingsModalDragWidth = null;
    AppState.settingsModalWidth = SETTINGS_MODAL_DEFAULT_WIDTH;
    try {

    if (panel) panel.style.maxWidth = `min(${SETTINGS_MODAL_DEFAULT_WIDTH}px, 95vw)`;
}

// ============= 手动锁定的方向必须跟着落盘 =============
// 【实测的原始故障】xportPersistSnapshot 存了 sourceLang / targetLang / isAutoDetect，
// xportPersistRestore 也把它们恢复回来 —— 但会改方向的函数一个都不落盘。
// 【上一版这里写的是「这两个**唯一**会改方向的函数」，那句话是错的：toggleAutoDetect 是
//   第三个，它一个字都没提，于是它继续不落盘，被独立验证当场逮住（见它上面那段实测）。
//   会改 isAutoDetect / sourceLang / targetLang 的用户入口共三个：setLanguage、
//   swapLanguages、toggleAutoDetect，三个都在这一轮补齐了。别再写「唯一」——
//   那种断言在这个文件里每次被独立复核都是错的。】
// 于是（真 Chrome，127.0.0.1:8765，屏幕上有 3 行译文）：
//   setLanguage('zh','en') → 内存 ["zh","en",false]，等 3.5 秒读盘 ["en","zh",true]、
//   savedAt 一个数没动 → 刷新 → 回来还是 ["en","zh",true]，顶栏芯片也翻回 EN⇄ZH，
//   零提示、persistError=null。用户手动锁的方向被静默解锁并翻转。
// 接下来按 TRANSLATE / 「重新生成所有翻译」跑的就是反方向：系统提示词写着
// Translate English into Chinese，而整篇中文原文被当英文送进去 —— 正是
// handleRegenerateAll 里那段注释宣称「刷新那条路已经堵上了」的那个故障，
// 它当时只堵了「恢复」这一半，没堵「保存」这一半。
// 【为什么不能靠别的写点兜底】剩下所有 xportPersistSoon() 都挂在**内容**变化上；
// 只改方向不改内容时一次都不会触发，那条记录可以停在几十分钟前的方向上。
function setLanguage(src, tgt) {
    AppState.sourceLang = src;
    AppState.targetLang = tgt;
    AppState.isAutoDetect = false;
    renderApp();
    xportPersistSoon();
}

function setViewMode(mode) {
    // 进大输入框之前先把原文栏里的逐句改稿收回来（见 syncInputFromPairs 上方那段注释）。
    // 这是原来那个死函数 toggleEditMode 唯一该待的地方。
    // 重建真的发生了（返回 true）才提示：那一刻才是「被削过的文本写进 inputText /
    // originalInputText」的时刻，也才值得打断用户。没重建就一声不吭。
    if (mode === 'edit' && syncInputFromPairs()) xportWarnColorMacroLoss('大输入框');
    AppState.viewMode = mode;
    AppState.isEditingMode = (mode === 'edit');
    renderApp();
    // viewMode 本来就在 xportPersistSnapshot 里、xportPersistRestore 也读它，
    // 却没有任何一条路会因为「切了视图」而落盘 —— 存了不用/用了不存都是同一种不一致。
    xportPersistSoon();
}

// 与 setLanguage 同一条理由、同一个实测故障（见它上面那段）：这也是一次「只改方向、
// 不改内容」的变更，不在这里落盘就没有任何别的路会替它落。
function swapLanguages() {
    const temp = AppState.sourceLang;
    AppState.sourceLang = AppState.targetLang;
    AppState.targetLang = temp;
    AppState.isAutoDetect = false;
    renderApp();
    xportPersistSoon();
}

    saveRowUpdate(idx, AppState.editValues);
}

// ============= 设置弹窗控制 =============
function toggleSettingsPopup(type, idx, side) {
    if (AppState.activeSettingsPopup === type && AppState.activeSettingsIndex === idx && AppState.activeSettingsSide === side) {
        closeSettingsPopup();
    } else {
        AppState.activeSettingsPopup = type;
        AppState.activeSettingsIndex = idx;
        AppState.activeSettingsSide = side;
        renderApp();
    }
}

function closeSettingsPopup() {
    AppState.activeSettingsPopup = null;
    AppState.activeSettingsIndex = null;
    AppState.activeSettingsSide = null;
    renderApp();
}

function saveCustomPrompt(type) {
    const textarea = document.getElementById(`customPromptTextarea_${type}`);
    if (textarea) {
        AppState.customPrompts[type] = textarea.value.trim();
        // 保存到 localStorage
        try {
            localStorage.setItem('customPrompts', JSON.stringify(AppState.customPrompts));
        } catch (e) {}
    }
    closeSettingsPopup();
}

function resetPromptToDefault(type) {
    AppState.customPrompts[type] = '';
    // 更新 localStorage
    try {
        localStorage.setItem('customPrompts', JSON.stringify(AppState.customPrompts));
    } catch (e) {}
    renderApp();
}

// ============= History Limit 设置 =============
function setHistoryLimit(limit) {
    // 【取消 = 什么都没发生】上一版取消那一支写的是
    // `AppState.historyLimit = AppState.globalHistory.length` 然后 return —— 它既不是
    // 用户原来的设置，也没写进 localStorage：内存里是「当前条数」，盘上还是旧值，两边对不上。
    // 后果是下一次自动存档时 slice(0, historyLimit) 正好把最旧的一份挤掉 —— 用户刚刚
    // 明确拒绝的那件事，转头就在他不知情的时候发生了。取消必须原样退回**之前的设置**。
    const prev = AppState.historyLimit;
    // 裁剪历史记录 —— 这是**唯一**会淘汰内容的地方，而且是用户自己按下的。
    // 调小会当场丢掉多出来的快照，所以先说一声：内容绝不在用户不知情的时候消失。
    if (AppState.globalHistory.length > limit) {
        const drop = AppState.globalHistory.length - limit;
        let go = true;
        try {
            go = window.confirm('把「保留最近」调到 ' + limit + ' 份，会立刻删掉最旧的 '
                + drop + ' 份快照，删掉之后找不回来。\n\n确定吗？');
        } catch (e) { go = true; }
        if (!go) { AppState.historyLimit = prev; renderApp(); return; }
        AppState.historyLimit = limit;
        AppState.globalHistory = AppState.globalHistory.slice(0, limit);
        try { showToast('已删除最旧的 ' + drop + ' 份快照', 'warning'); } catch (e) {}
    }
    AppState.historyLimit = limit;
    // 保存到 localStorage
    try {
        localStorage.setItem('historyLimit', limit.toString());
    } catch (e) {}
    xportPersistSoon();
    renderApp();
}

function setHistoryLimitCustom(value) {
    const limit = Math.max(1, parseInt(value) || 5);
    setHistoryLimit(limit);
}

// ============= Auto-Save 自定义设置 =============
function applyCustomAutoSave() {
    const input = document.getElementById('customAutoSaveInput');
    if (input) {
        const val = parseInt(input.value);
        if (val > 0) {
            setAutoSaveInterval(val * 60 * 1000);
        }
    }
}

// ==================== 浮动 AI 对话窗 · 外壳（SLICE C1）====================
// 这一段只有「窗户」本身：挂载、开关、拖动、缩放、边界夹取、几何持久化、消息行追加接口。
// 模型调用、附加选段、编辑提案都在后续切片里往这里挂，renderApp 一行都不会再动。
//
// ⚠️ 唯一的架构硬事实（实测，见 .claude/tmp/chat-window.md §2）：
//   renderApp() 走 `root.innerHTML = <一整个字符串>`，而且**没有 try/catch**。
//   于是任何挂在 #root 里的面板都是一次性的：
//     · 挂 #root 里的面板，一次 renderApp() 之后 {exists:false} —— 整个节点没了；
//     · 挂 <body> 上的面板，连跑 20 次 renderApp() 之后仍然是
//       {left:'777px', top:'111px', scrollTop:400, taValue:'USER TYPED THIS, UNSENT',
//        taSel:[5,10], jsListener:'kept'} —— 一个字节都没变。
//   而 renderApp() 在用户**完全没有操作**时也会跑：
//     · showToast() 每次连开两轮（立刻一次 + 3 秒后一次），
//     · DOMContentLoaded 里的自动存档 setInterval 默认 5 分钟一轮、设置里还能调到 1 分钟。
//   也就是说：一个挂在 #root 里的聊天窗，会在用户打字打到一半时每 1~5 分钟被抹掉一次。
//
// 由此推出这一段的三条纪律，**不许破**：
//   1) 窗口挂 document.body（ensureChatRoot），renderApp 不知道它存在；
//   2) 状态放 ChatState，**不放 AppState** —— 聊天的任何更新都不可能触发整页重渲染；
//   3) 聊天代码**永远不调用 setState**，每个入口自带 try/catch，异常只进控制台和窗口内的错误行。
//   附带好处：renderApp 里真炸了整页冻死在上一帧时，这个窗口是唯一还活着、还能告诉用户
//   发生了什么的界面（实测：冻页之后它的点击处理器照样计数）。

// —— 几何常量（取值依据见 chat-window.md §3.2）——
// 【这两个下限是量出来的，不是拍的】八向缩放落地时在 Chrome 里按 5px 步长扫过一遍
// （geom 直接改 + chatApplyGeom + 逐个读 getBoundingClientRect）：
//   · 参数条（模型 / 思考 / 强度 / ⋮）在 **≥300px** 时是一行，295px 起折成两行（22px → 47px）；
//   · 状态条那一行（用量圆环 + 「文档 …」+「会话」）在 **≥315px** 时是一行，310px 起折成两行（27px → 53px）；
//   · 全程没有任何一处横向溢出（root / 参数条 / 状态条 / 页脚 / 标题栏的 scrollWidth−clientWidth 恒为 0），
//     因为这几行都是 flex-wrap —— 所以「溢出」不是有效判据，「换行吃掉消息区」才是。
// 取 320：压过两个阈值里较大的那个（315）还剩 5px 余量，输入框此时仍有 234px 可打字宽度。
const CHAT_MIN_W = 320;
// 同一次实测：标题栏 41px + 页脚 121px = 162px 是「一个控件都不被裁掉」的绝对地板
// （h=180 时 send / 圆环仍然完整在框内，frame 的 scrollHeight−clientHeight = 0）。
// 但 162px 的窗口消息区只剩 18px，连一条气泡都放不下。取 240：消息区 78px ≈ 一条短气泡，
// 是「还能当聊天窗用」的下限。
const CHAT_MIN_H = 240;
const CHAT_DEFAULT_W = 420;
const CHAT_DEFAULT_H = 560;
const CHAT_VIEWPORT_PAD = 16;    // 尺寸上限相对视口留的边
const CHAT_SCREEN_INSET = 24;    // 首次打开时距视口右下角的距离
const CHAT_EDGE_KEEP = 48;       // 无论怎么拖，横向至少留这么多像素在屏幕里（永远抓得回来）
const CHAT_TITLEBAR_H = 40;      // 必须和 CSS 里 .aichat-titlebar 的 height 一致
const CHAT_RESTORE_PAD = 8;      // 从 localStorage 恢复时，整窗回到视口内所留的边

// 当前正在进行的拖拽/缩放会话的收尾函数（chatBeginDrag 里的 onUp），没有拖拽时为 null。
// 【为什么需要】chatClose()（连同 Esc 处理器）要能在关窗前主动结束一次进行中的拖拽 ——
// 否则 Esc 关闭对话窗时，只要用户当时还按着鼠标没松开，document 上的 pointermove/up
// 监听器和 data-aichat-drag 属性都不会被清掉：拖拽会在窗口已经视觉消失之后继续在后台跑，
// 真正松手时算出的尺寸会被当成「用户特意调的」写进 localStorage —— 而这是一次被 Esc
// 打断的操作，不是用户主动选择的结果。onUp 是 chatBeginDrag 内部的闭包，外部拿不到，
// 所以在这里存一份引用；onUp 自己跑完后立刻把这里清回 null（幂等，不依赖谁先调用）。
let chatActiveDragEnd = null;

// 聊天的全部状态。刻意是一个独立对象而不是 AppState 的字段：
// 放进 AppState 就意味着「改聊天状态 = 可能触发 renderApp」，那正是要躲开的东西。
const ChatState = {
    mounted: false,                 // ensureChatRoot 是否已经建过节点（幂等哨兵）
    open: false,
    // mode: 'auto' = 用户还没碰过尺寸/位置，每次打开都按当前视口重新自动排一次；
    //       'free' = 用户拖过了，之后一律尊重用户存下来的几何。
    geom: { x: 0, y: 0, w: CHAT_DEFAULT_W, h: CHAT_DEFAULT_H, mode: 'auto' },
    lastFocus: null,                // 关窗时把焦点还回去的那个元素

    // —— 最小化到后台 ——
    // 【和「关闭」的区别是刻意的】关闭 = 窗口不见了、焦点还给页面、下次打开重新对一次会话；
    // 最小化 = 窗口还在原地，只是折叠成一条标题栏，一个字节都不丢。
    // minimized 只影响**渲染**：geom 一个字段都不改（见 CSS 里 #aiChatRoot.is-min 那段注释），
    // 所以用户手动调过的尺寸在折叠 → 展开之后原样回来。
    minimized: false,
    // 折叠瞬间抄下来的那几样浏览器会在 display:none 期间弄丢或被我们自己写坏的东西：
    // { draft, selStart, selEnd, hadFocus, logScroll, atBottom }。展开时逐项还原。
    minSaved: null,
    unread: 0,                      // 折叠期间新到的助手回复 / 错误行条数，展开即归零
    // 拖过没有。标题栏的 click 用它区分「点了一下」（= 展开）和「拖完松手」（浏览器同样会
    // 在拖拽结束时补一个 click）—— 没有这个标记，拖动折叠条会顺手把窗口展开。
    dragMoved: false,

    // —— C2：对话 ——
    // messages: 全部轮次，只用于显示和拼历史。assistant 条目形如
    //   { role, content(原始回复), prose, reasoning, editBody, proposalId }
    // reasoning **只**进折叠的「思考」区，永远不发回给模型、永远不当答案。
    messages: [],
    seq: 0,                         // 单调递增。回来的响应 seq 对不上就是陈旧响应，直接丢弃。
    abort: null,                    // 当前在飞那一轮的 AbortController
    busy: false,

    // —— C3：附加选段 → 提案 → 应用 ——
    // target 在**点「附到对话」的那一刻**整个抄下来，之后绝不再读实时选区
    // （实测：行内 textarea 的选区能扛住焦点跑到聊天输入框，但任何一次整页重渲染都会把它清零，
    //   而重渲染是定时器驱动的 —— 用户什么都不做也会发生）。
    target: null,                   // { rowIndex, side, start, end, text, rowSrcAtCapture, rowTgtAtCapture, whole }
    proposals: [],                  // { id, rowIndex, side, start, end, text, replacement, rowSrcAtCapture, rowTgtAtCapture, applied, dismissed }
    proposalSeq: 0,

    // —— C4：输入框下面那条参数条 ——
    // 【第一条纪律：对话的模型和翻译的模型是两件事】provider/model **不进 AppState**，
    // 也永远不写 AppState.selectedModel。空串 = 用户从没在这条参数条上选过模型，
    // 此时回落到当前翻译模型；一旦选过，翻译那边怎么换都不再跟随。
    provider: '',
    model: '',
    // 【第二条纪律：推理档位也是两件事】翻译用 AppState.reasoningByModel，对话用这一份。
    // 同一个模型可以「翻译时关推理、对话时开推理」，互不影响。键 = 模型 id，值 = UI 词表。
    reasoningByModel: {},
    // Gemini 的推理是另一套合约（thinkingBudget，实测合法集 {0, -1} ∪ [512, 24576]），
    // 和 reasoning_effort 没有任何共用，所以单独一个字段。'' = 不发 thinkingConfig。
    geminiThinking: '',
    temperature: null,              // null = 用各家原本的默认（本地/Claude 0.3、OpenAI 0.3）
    maxTokens: 0,                   // 0 = 用各家原本的默认（见 chatDefaultMaxTokens）
    stream: true,                   // 仅 local 生效；其余提供方隐藏这个开关（C5）
    keepReasoning: false,           // **客户端**行为：要不要把上一轮的思考内容回传（不是模型参数）
    // 「显示思考过程」。**纯显示**开关：关掉只是不画那块折叠区，既不改请求、也不改
    // reasoning_content 的去向（它永远只能进折叠区，永远不是答案）。默认开 —— 推理本身默认关，
    // 所以关着的时候这块区域根本不出现；要是把显示也默认关掉，用户打开推理后会看不到任何变化，
    // 那个开关就成了「点了没反应」。
    showThinking: true,
    // 「跳过审批」。开着的时候，模型每给出一个新的 ==EDIT== 提案，卡片一画出来就自动点一次
    // chatApplyProposal（见 chatRenderProposalCard 末尾）—— 用户不用再逐条点「应用」。
    // 【绝不放松闸门】这个开关只省掉「问不问用户」这一步，chatApplyProposal 内部那四道闸门
    // （目标行还在、没有别的请求正在覆盖这一行、这一行自捕获以来没被改过、那段文字还在原位置）
    // 一条都不会跳过 —— 过不了闸门照样中止、一个字节都不写，和手动点「应用」逐字一样。
    // 默认关：这是个「信任模型」的开关，不能悄悄地就是开的。
    autoApprove: false,
    paramsOpen: false,              // 「⋮」展开与否
    // 上一次真正发出去的请求参数摘要。给验收和排查用：「界面显示的」和「线上发的」
    // 对不上时，这是唯一能一眼看穿的地方（callLocalLLM 的 meta.reasoningEffortSent 同理）。
    lastRequest: null,

    // —— C6：自动文档上下文 + 用量环 + 会话历史 ——
    // 【这一段的founding constraint】文档上下文**不是一条消息**。它每一轮从
    // AppState.translationPairs 现生成（chatBuildDocContext），拼进那一轮的最后一条 user
    // 消息里就发出去，**从不写进 ChatState.messages**。
    // 由此三条验收自动成立、而且是**结构上**成立，不是靠「记得别压缩文档」这种会被后人改坏的约定：
    //   · 压缩只改 messages ⇒ 压缩后文档仍然完整；
    //   · 清理清空 messages ⇒ 新对话第一轮照样带全文；
    //   · 重译换掉 translationPairs ⇒ 下一轮带的是**新**文档。
    // 上下文开关（默认开）。关掉 = ==DOC== 文档块和 ==FOCUS== 关注块这一轮都不生成
    // （关注条目带的是稿子原文逐字，所以它必须跟着这个开关走，见 chatAssembleTurn）。
    // 它**管不着**已经在 ChatState.messages 里的那些轮次 —— 那要靠「清理」。
    autoContext: true,
    docSnapshot: null,              // { id, from, to, total, hashes:{n:{src,tgt}}, at } —— 本轮发出去的那份文档的指纹
    snapshotSeq: 0,
    // 用量。measured 那一份来自 usage.prompt_tokens（唯一权威），估算那一份来自 chatEstTokens。
    // 两者在界面上**必须**长得不一样（实线环 vs 虚线环 + 「≈」）。
    usage: null,                    // { promptTokens, parts, sum, overhead, templateOverhead, calibK, model, sig, at }
    lastSent: null,                 // 发出去那一刻的分项估算，等响应回来后和实测对账
    calib: null,                    // { model, k, at } 每模型的估算校准倍率（只影响估算显示）
    ringTimer: null,                // 打字时重画环的防抖句柄
    panel: '',                      // '' | 'ctx' | 'history'
    pendingCompact: null,           // 压缩的「先给预估、再确认」中间态
    sessionId: null,                // 这段对话属于哪个 AppState.sessionId（换文档要归档、不许静默带过去）
    // 这段对话在归档里的**稳定身份**。有了它，反复归档同一段对话是 upsert 而不是不断新增
    // （否则「打开一份旧对话 → 换个文档 → 换回来」每来回一次就多一份重复记录，配额几轮就烧光）。
    convId: ''
};

// 渲染路径（renderHeader）会读这个函数来决定顶栏按钮的样子。
// renderApp 外面没有 try/catch，所以它自带一层：无论 ChatState 处于什么状态都只返回布尔值。
function chatIsOpen() {
    try { return !!(ChatState && ChatState.open); } catch (e) { return false; }
}

// —— 几何计算 ——
// 脏值一律回落，绝不把 NaN/Infinity 写进 style（写进去窗口会直接消失且再也算不回来）
function chatNum(v, fallback) {
    const n = Number(v);
    return isFinite(n) ? n : fallback;
}

function chatViewport() {
    return {
        vw: chatNum(window.innerWidth, CHAT_DEFAULT_W + 2 * CHAT_SCREEN_INSET),
        vh: chatNum(window.innerHeight, CHAT_DEFAULT_H + 2 * CHAT_SCREEN_INSET)
    };
}

// 按当前视口算一份「自动尺寸 + 右下角停靠」的几何。用户没碰过窗口时每次打开都重算，
// 所以从 4K 换到笔记本、或者把浏览器窗口拉窄，下次打开还是一个合身的窗口。
function chatAutoGeom() {
    const v = chatViewport();
    const w = Math.min(CHAT_DEFAULT_W, Math.max(CHAT_MIN_W, v.vw - 2 * CHAT_SCREEN_INSET));
    const h = Math.min(CHAT_DEFAULT_H, Math.max(CHAT_MIN_H, v.vh - 2 * CHAT_SCREEN_INSET));
    return { x: v.vw - w - CHAT_SCREEN_INSET, y: v.vh - h - CHAT_SCREEN_INSET, w: w, h: h, mode: 'auto' };
}

// 宽松档：拖动中和窗口 resize 时用。
// 位置夹的是**标题栏**而不是整个盒子 —— 用户想把窗口大半推出屏幕是他的自由，
// 但横向必须至少留 CHAT_EDGE_KEEP 像素、纵向标题栏不许跑到视口上沿之上或下沿之下，
// 否则那条唯一的拖动把手就没了，窗口再也抓不回来。
function chatClampGeom(g) {
    const v = chatViewport();
    const out = {
        x: chatNum(g && g.x, 0),
        y: chatNum(g && g.y, 0),
        w: chatNum(g && g.w, CHAT_DEFAULT_W),
        h: chatNum(g && g.h, CHAT_DEFAULT_H),
        mode: (g && g.mode === 'free') ? 'free' : 'auto'
    };
    // 尺寸：下限优先于上限 —— 视口比 CHAT_MIN_W 还窄时宁可溢出，也不要出现 0 宽的窗口
    out.w = Math.max(CHAT_MIN_W, Math.min(out.w, Math.max(CHAT_MIN_W, v.vw - CHAT_VIEWPORT_PAD)));
    out.h = Math.max(CHAT_MIN_H, Math.min(out.h, Math.max(CHAT_MIN_H, v.vh - CHAT_VIEWPORT_PAD)));
    out.x = Math.max(CHAT_EDGE_KEEP - out.w, Math.min(out.x, v.vw - CHAT_EDGE_KEEP));
    out.y = Math.max(0, Math.min(out.y, Math.max(0, v.vh - CHAT_TITLEBAR_H)));
    return out;
}

// 严格档：**只**在从 localStorage 恢复时用。
// 恢复是一次用户没有参与的移动，所以能整窗放进视口就整窗放进去 ——
// 4K 显示器上存下的 {x:3000} 在笔记本上必须自己走回来，而不是只露出 48 像素。
// 放不下（视口比窗口还小）时退回宽松档的结果，至少保证把手还在。
function chatClampGeomForRestore(g) {
    const out = chatClampGeom(g);
    const v = chatViewport();
    const maxX = v.vw - out.w - CHAT_RESTORE_PAD;
    const maxY = v.vh - out.h - CHAT_RESTORE_PAD;
    if (maxX >= CHAT_RESTORE_PAD) out.x = Math.max(CHAT_RESTORE_PAD, Math.min(out.x, maxX));
    if (maxY >= CHAT_RESTORE_PAD) out.y = Math.max(CHAT_RESTORE_PAD, Math.min(out.y, maxY));
    return out;
}

function chatApplyGeom() {
    const rootEl = document.getElementById('aiChatRoot');
    if (!rootEl) return;
    const g = ChatState.geom;
    rootEl.style.left = Math.round(g.x) + 'px';
    rootEl.style.top = Math.round(g.y) + 'px';
    rootEl.style.width = Math.round(g.w) + 'px';
    rootEl.style.height = Math.round(g.h) + 'px';
}

// —— 持久化 ——
// 几何和「开着没开」各自一个 key、各自一个 try/catch。
// 刻意不和别人共用 try 块：隐私模式/配额爆掉时，别人写失败不能顺手把窗口位置一起弄丢，反之亦然。
// 也刻意不落盘聊天记录（v1）：globalHistory 已经存着最多 5 份全文，再塞进不设上限的对话
// 只会更快撞配额。
function chatSaveGeom() {
    try {
        const g = ChatState.geom;
        localStorage.setItem('chatGeom', JSON.stringify({
            x: Math.round(g.x), y: Math.round(g.y),
            w: Math.round(g.w), h: Math.round(g.h),
            mode: g.mode === 'free' ? 'free' : 'auto'
        }));
    } catch (e) {}
}

function chatLoadGeom() {
    try {
        const raw = localStorage.getItem('chatGeom');
        if (!raw) return null;
        const g = JSON.parse(raw);
        return (g && typeof g === 'object') ? g : null;
    } catch (e) { return null; }
}

function chatSaveOpen(open) {
    try { localStorage.setItem('chatOpen', open ? '1' : '0'); } catch (e) {}
}

function chatLoadOpen() {
    try { return localStorage.getItem('chatOpen') === '1'; } catch (e) { return false; }
}

// —— 外壳的 HTML ——
// 全是字面量，没有任何变量插值，所以这里没有转义面。窗口里**会**出现模型生成的文本，
// 那些一律走 chatAppendRow 的 textContent 通道（见下面），不拼进 HTML 字符串。
//
// data-tip 纪律（见文件头部那段长注释）：带 data-tip 的元素不许再带 title，
// 而且两个 data-tip 元素不能互为祖先—后代（:hover 会冒泡到祖先，两个气泡会一起浮出来）。
// 所以标题栏本身**不带** data-tip，提示挂在它里面的标题文字上，和关闭按钮是兄弟关系。
function chatShellHtml() {
    return ''
        + '<div class="aichat-frame">'
        +   '<div class="aichat-titlebar" id="aiChatTitleBar">'
        +     '<span class="aichat-title-icon">' + Icons.MessageSquare + '</span>'
        +     '<span class="aichat-title-text" data-tip="按住这里拖动窗口。窗口挂在页面最外层，界面刷新、自动存档都不会打断你输到一半的内容。" data-tip-pos="bottom-start">AI 对话</span>'
        +     '<span class="aichat-title-spacer"></span>'
        +     '<span class="aichat-unread" id="aiChatUnread" data-n="0"></span>'
        // 三颗按钮从左到右：+ 新建对话 → − 最小化 → × 关闭。
        // 每颗都有中文 data-tip；按 data-tip 纪律，它们互相是兄弟、祖先（.aichat-titlebtns）不带 tip。
        +     '<span class="aichat-titlebtns">'
        +       '<button type="button" class="aichat-iconbtn" id="aiChatNewBtn" data-tip="新建对话：先把当前这段存进「会话」再开一段空的（和面板里的「清理」是同一条代码路径）。文档上下文不受影响 —— 它每轮现生成，新对话第一轮照样带整篇最新原文（左栏，不含译文）。你标出来的关注（黄色高亮 / 勾选框）属于稿子不属于这段对话，**会原样保留**。当前对话是空的时就什么都不做，不会往历史里塞空条目。" data-tip-pos="bottom-end">' + Icons.PlusSmall + '</button>'
        +       '<button type="button" class="aichat-iconbtn" id="aiChatMinBtn" data-tip="最小化到后台：折叠成一条标题栏停在原地，仍然可以拖。和「关闭」不一样 —— 草稿（连同光标选区）、滚动位置、全部消息、关注标记、用量圆环、窗口尺寸全都留着，展开后逐项还原。折叠期间模型回完了，这里会亮出未读数。点这颗按钮或点标题栏都能展开。" data-tip-pos="bottom-end">' + Icons.MinusSmall + '</button>'
        +       '<button type="button" class="aichat-iconbtn" id="aiChatCloseBtn" data-tip="关掉对话窗（按 Esc 也一样）。位置和大小会记住，下次打开还在原处。" data-tip-pos="bottom-end">' + Icons.XSmall + '</button>'
        +     '</span>'
        +   '</div>'
        +   '<div class="aichat-log" id="aiChatLog"></div>'
        +   '<div class="aichat-footer">'
        +     '<div id="aiChatFocusSlot"></div>'
        +     '<div id="aiChatTargetSlot"></div>'
        +     '<div id="aiChatBatchSlot"></div>'
        +     '<div class="aichat-inputrow">'
        +       '<textarea class="aichat-input" id="aiChatInput" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>'
        +       '<button type="button" class="aichat-send" id="aiChatSendBtn" data-tip="发送（Enter 也一样）。请求进行中这颗按钮变成 STOP，点一下当场中止，已经收到的字会留在窗口里。" data-tip-pos="top-end">SEND</button>'
        +     '</div>'
        +     '<div class="aichat-params" id="aiChatParams"></div>'
        +     '<div class="aichat-bar" id="aiChatBar"></div>'
        +     '<div id="aiChatPanel"></div>'
        +   '</div>'
        + '</div>'
        // —— 八向缩放手柄 ——
        // ⚠️【它们必须是 #aiChatRoot 的直接子节点，绝不能待在 .aichat-frame 里面】
        // .aichat-frame 有 `overflow:hidden` + `border-radius:16px`。手柄放在框里的话，
        // **四个角**正好落在圆角被裁掉的那一块：实测 elementFromPoint(角+3px) 返回的是
        // #aiChatRoot 本身而不是手柄，光标也不变形 —— 四个角的缩放整个是死的。
        // （C1 那版只有一个 tl 手柄，它从落地起就带着这个毛病，只是没人往角上放过鼠标。）
        // 挪出来之后它们和 .aichat-frame 是兄弟、且在其后，所以照样画在框上面。
        // 顺序 = 四条边、四个角；data-h 的值就是 chatBeginDrag 的 kind。
        +   '<div class="aichat-resize aichat-resize-l"  data-h="l"  data-tip="拖左边框改宽度（右边缘钉住不动）。" data-tip-pos="right"></div>'
        +   '<div class="aichat-resize aichat-resize-r"  data-h="r"  data-tip="拖右边框改宽度。" data-tip-pos="left"></div>'
        +   '<div class="aichat-resize aichat-resize-t"  data-h="t"  data-tip="拖上边框改高度（下边缘钉住不动）。" data-tip-pos="bottom"></div>'
        +   '<div class="aichat-resize aichat-resize-b"  data-h="b"  data-tip="拖下边框改高度。" data-tip-pos="top"></div>'
        +   '<div class="aichat-resize aichat-resize-tl" data-h="tl" data-tip="拖左上角同时改宽高（右下角钉住不动）。" data-tip-pos="bottom-start"></div>'
        +   '<div class="aichat-resize aichat-resize-tr" data-h="tr" data-tip="拖右上角同时改宽高（左下角钉住不动）。" data-tip-pos="bottom-end"></div>'
        +   '<div class="aichat-resize aichat-resize-bl" data-h="bl" data-tip="拖左下角同时改宽高（右上角钉住不动）。" data-tip-pos="top-start"></div>'
        +   '<div class="aichat-resize aichat-resize-br" data-h="br" data-tip="拖右下角同时改宽高（左上角钉住不动）。" data-tip-pos="top-end"></div>';
}

// —— 消息行 ——
// kind: 'system' | 'user' | 'assistant' | 'error'
// 文本一律走 textContent，不经过任何 HTML 字符串拼接。窗口里显示的是**模型生成的文本**
// （以及远端返回的错误信息），一个 `<` 都不许被当成标签 —— 这是正确性，不是安全加固。
// C2 里助手气泡要渲染 Markdown/KaTeX 时，走 renderFormattedText，别把这条通道改成 innerHTML。
function chatAppendRow(kind, text, opts) {
    try {
        const log = document.getElementById('aiChatLog');
        if (!log) return null;
        const row = document.createElement('div');
        row.className = 'aichat-row aichat-row-' + (kind || 'system');
        const bubble = document.createElement('div');
        bubble.className = 'aichat-bubble';
        bubble.textContent = String(text == null ? '' : text);
        row.appendChild(bubble);
        log.appendChild(row);
        chatScrollToBottom();
        // 折叠着的时候这一行用户看不见 —— 标题栏上亮个未读数，别让回复静静地烂在后台。
        // 只认助手回复和错误行：系统提示（「已开始新对话」之类）不是「有人回你话了」。
        // opts.skipUnread：流式占位行专用（chatLiveSink.ensureRow）。一条完整回复会先建一个
        // 空占位行、再在收全之后由 chatRenderAssistant 建一条真正的最终行——两次调用都是
        // chatAppendRow('assistant', ...)，不加这个旗标的话未读数会给同一条回复计两次
        // （实测：一问一答角标显示「2」而不是「1」，虽然最终 DOM 里只留了一条气泡）。
        if (!(opts && opts.skipUnread)) chatNoteUnread(kind);
        return row;
    } catch (e) {
        console.error('[chat] appendRow failed', e);
        return null;
    }
}

// 「正在处理」指示器（C8）。**两种「显示思考过程」模式下都要画**——那个开关只决定
// 思考正文显不显示，不决定「我还活着」这个信号显不显示；关掉思考正文恰恰最容易让人
// 以为卡死。内容：动画（纯 CSS，不代表进度）+ "thinking" 字样 + 真实已耗时秒数 +
// 按已收到的推理文字实时估的 token 数（tokEl，调用方在收到 reasoning delta 时更新）。
// 动画、计时、token 三条都是独立的线：动画一旦挂上 CSS class 就自己转，不需要 JS 再摸它；
// 计时和 token 各自只改自己那一个节点的 textContent。
// tokEl 上的数字**必须**带 ≈ 前缀：这是按字符数现算的估算，不是 usage 里的实测值——
// 真实值要等这一轮彻底结束才拿得到，在那之前显示一个不带 ≈ 的数字就是把估算充成实测。
function chatAppendPendingRow() {
    try {
        const log = document.getElementById('aiChatLog');
        if (!log) return null;
        const row = document.createElement('div');
        row.className = 'aichat-row aichat-row-system';
        const bubble = document.createElement('div');
        bubble.className = 'aichat-bubble aichat-pending';
        const dots = document.createElement('span');
        dots.className = 'aichat-pending-dots';
        dots.setAttribute('aria-hidden', 'true');
        for (let i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
        const label = document.createElement('span');
        label.className = 'aichat-pending-label';
        label.textContent = 'thinking…';
        const time = document.createElement('span');
        time.className = 'aichat-pending-time';
        time.textContent = '0.0s';
        const tok = document.createElement('span');
        tok.className = 'aichat-pending-tok';
        tok.textContent = '';
        bubble.appendChild(dots);
        bubble.appendChild(label);
        bubble.appendChild(time);
        bubble.appendChild(tok);
        row.appendChild(bubble);
        log.appendChild(row);
        chatScrollToBottom();
        return { row: row, timeEl: time, tokEl: tok };
    } catch (e) {
        console.error('[chat] appendPendingRow failed', e);
        return null;
    }
}

// 出错一律写进对话流里的一条玫瑰色行，**绝不**写 AppState.error ——
// 那会弹顶部横幅并把整页重渲染一遍，正好把用户没发出去的草稿冲掉。
function chatErrorRow(where, err) {
    const msg = (err && (err.message || err.toString())) || String(err);
    return chatAppendRow('error', '出错了（' + where + '）：' + msg);
}

function chatScrollToBottom() {
    try {
        const log = document.getElementById('aiChatLog');
        if (log) log.scrollTop = log.scrollHeight;
    } catch (e) {}
}

// 输入框 1→6 行自增长。和行内 textarea 用的是同一招：先归零再按 scrollHeight 量。
function chatAutoGrowInput() {
    try {
        const ta = document.getElementById('aiChatInput');
        if (!ta) return;
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 132) + 'px';
    } catch (e) {}
}

// —— 拖动 / 缩放 ——
// 用 Pointer Events + setPointerCapture：捕获之后，即使指针跑到浏览器窗口外面，
// pointerup / pointercancel 也保证送得到，mouse 版那三个兜底大部分就不需要了。
// 但 buttons===0 和 window blur 两个兜底照样留着 —— 一共 4 行，而这个代码库的注释
// 记录了这类「mouseup 丢了 → 监听不解绑 → 幽灵拖拽」真实发生过（见 startSettingsModalResize）。
// 这一格里的哪几条边跟着光标走。八向就是这三张表的组合，没有第二处需要同步的地方。
const CHAT_HANDLE_L = { l: 1, tl: 1, bl: 1 };
const CHAT_HANDLE_R = { r: 1, tr: 1, br: 1 };
const CHAT_HANDLE_T = { t: 1, tl: 1, tr: 1 };
const CHAT_HANDLE_B = { b: 1, bl: 1, br: 1 };
const CHAT_DRAG_SLOP = 3;        // 位移不超过这么多像素就当「点了一下」，不当拖拽

function chatBeginDrag(ev, kind) {
    try {
        if (ev.button != null && ev.button !== 0) return;                       // 只认左键
        // 标题栏上的三颗按钮不算把手，否则点它们会先起一次拖拽
        if (kind === 'move' && ev.target && ev.target.closest && ev.target.closest('button')) return;
        // 折叠成一条时只剩「移动」这一个手势 —— 手柄虽然已经 display:none，
        // 这里再挡一道：改一个看不见的高度对用户没有任何意义。
        if (kind !== 'move' && ChatState.minimized) return;
        const capEl = ev.currentTarget || ev.target;
        if (!capEl) return;
        ev.preventDefault();

        const startX = chatNum(ev.clientX, 0);
        const startY = chatNum(ev.clientY, 0);
        const start = {
            x: ChatState.geom.x, y: ChatState.geom.y,
            w: ChatState.geom.w, h: ChatState.geom.h
        };
        const pid = ev.pointerId;
        let finished = false;
        ChatState.dragMoved = false;

        // —— rAF 合帧 ——
        // 一次拖拽里 pointermove 可以来得比屏幕刷新还密（高刷鼠标 1000Hz）。每来一个就写
        // 一次 left/top/width/height，等于让浏览器在**同一帧内**为同一个窗口重排好几次；
        // 而这个窗口里装着一整条消息列表，改宽度会让每一条气泡重新折行。
        // 这里把「最新一份几何」攒起来，一帧只落一次。攒的是**结果**不是增量，
        // 所以丢掉中间帧不会累积误差 —— 最后一帧永远是光标当前位置算出来的那一份。
        let pendingGeom = null;
        let rafId = 0;
        const raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : null;
        const caf = (typeof cancelAnimationFrame === 'function') ? cancelAnimationFrame : null;
        function flush() {
            rafId = 0;
            if (!pendingGeom) return;
            ChatState.geom = pendingGeom;
            pendingGeom = null;
            chatApplyGeom();
        }
        function schedule(g) {
            pendingGeom = g;
            if (!raf) { flush(); return; }        // 没有 rAF 的环境（测试沙箱）退回同步
            if (!rafId) rafId = raf(flush);
        }

        try { if (pid != null && capEl.setPointerCapture) capEl.setPointerCapture(pid); } catch (e) {}
        try { document.body.setAttribute('data-aichat-drag', kind); } catch (e) {}
        // onUp 是下面的函数声明，在整个 chatBeginDrag 作用域内提升，这里引用它不用等它的
        // 文本定义先出现。
        chatActiveDragEnd = function () { onUp(); };
        const thisDragEnd = chatActiveDragEnd;

        function onMove(e) {
            try {
                // 兜底 1：指针其实已经松开了却还在收 move（窗口外松手 / 右键系统菜单吞掉 up /
                // 拖到一半 Alt-Tab）。buttons===0 是「up 丢了」的确定信号，立刻收尾自愈。
                if (e.buttons === 0) { onUp(); return; }
                const dx = chatNum(e.clientX, startX) - startX;
                const dy = chatNum(e.clientY, startY) - startY;
                if (Math.abs(dx) > CHAT_DRAG_SLOP || Math.abs(dy) > CHAT_DRAG_SLOP) ChatState.dragMoved = true;
                const v = chatViewport();
                const maxW = Math.max(CHAT_MIN_W, v.vw - CHAT_VIEWPORT_PAD);
                const maxH = Math.max(CHAT_MIN_H, v.vh - CHAT_VIEWPORT_PAD);
                const g = { x: start.x, y: start.y, w: start.w, h: start.h, mode: 'free' };
