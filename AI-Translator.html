                if (kind === 'move') {
                    g.x = start.x + dx;
                    g.y = start.y + dy;
                }
                // 左边框 / 上边框：右下角必须钉死不动，所以宽高先夹到合法区间，
                // 再由「原右边缘 - 新宽度」反算左上角。先算 x 再夹宽度的话，
                // 撞到最小宽度时右边缘会开始跟着光标跑。这正是 Windows 的行为。
                if (CHAT_HANDLE_L[kind]) {
                    const nw = Math.max(CHAT_MIN_W, Math.min(start.w - dx, maxW));
                    g.x = start.x + (start.w - nw);
                    g.w = nw;
                }
                if (CHAT_HANDLE_T[kind]) {
                    // 上界要在 maxH 之外再收一道：新高度最多长到「原来的下边缘」为止。
                    // 【为什么】setPointerCapture 会照常把 clientY 为负的 move 送进来（指针拖出
                    // 浏览器窗口上沿）。只夹 maxH 的话 nh 会一路长到 maxH、算出**负的** g.y，
                    // 随后 chatClampGeom 里那句 `out.y = Math.max(0, …)` 单独把 y 抬回 0
                    // 却不同步缩 h —— 两次夹取互相不认账，净效果是下边缘跟着往下窜
                    // （实测 {400,80,500,500} 拖上 300px：下边缘从 580 跑到 800）。
                    // 而这个手柄的合约（data-tip 原话）就是「下边缘钉住不动」。
                    // start.y 已经被上一次 chatClampGeom 保证 >= 0，所以 start.y + start.h >= start.h
                    // >= CHAT_MIN_H，这个上界永远不会和下面的最小高度下限打架。
                    const topMaxH = Math.min(maxH, start.y + start.h);
                    const nh = Math.max(CHAT_MIN_H, Math.min(start.h - dy, topMaxH));
                    g.y = start.y + (start.h - nh);
                    g.h = nh;
                }
                // 右边框 / 下边框：左上角本来就不动，直接改宽高。
                if (CHAT_HANDLE_R[kind]) g.w = Math.max(CHAT_MIN_W, Math.min(start.w + dx, maxW));
                if (CHAT_HANDLE_B[kind]) g.h = Math.max(CHAT_MIN_H, Math.min(start.h + dy, maxH));
                schedule(chatClampGeom(g));
            } catch (err) {
                console.error('[chat] drag move failed', err);
                onUp();
            }
        }

        function onUp() {
            if (finished) return;                 // 幂等哨兵：下面两个兜底可能和真 pointerup 撞车
            finished = true;
            // 只清自己这一份：一旦这个 onUp 真的跑到这里，chatActiveDragEnd 要么还指着
            // 这次会话自己的包装函数（正常收尾），要么已经被下一次 chatBeginDrag 换成了
            // 新会话的包装函数（不应该发生——旧会话的监听器在到达这里之前已经解绑——
            // 但万一发生，这一句绝不能把新会话的收尾函数误清掉）。
            if (chatActiveDragEnd === thisDragEnd) chatActiveDragEnd = null;
            try { document.removeEventListener('pointermove', onMove); } catch (e) {}
            try { document.removeEventListener('pointerup', onUp); } catch (e) {}
            try { document.removeEventListener('pointercancel', onUp); } catch (e) {}
            try { window.removeEventListener('blur', onUp); } catch (e) {}
            try { if (pid != null && capEl.hasPointerCapture && capEl.hasPointerCapture(pid)) capEl.releasePointerCapture(pid); } catch (e) {}
            try { document.body.removeAttribute('data-aichat-drag'); } catch (e) {}
            // 落盘前必须把攒着的那一帧先写进 ChatState.geom，否则「最后一帧还没落地就松手」
            // 会把**上一帧**的尺寸存进 localStorage —— 快速拖一下再松手，尺寸就差一截。
            try { if (rafId && caf) caf(rafId); } catch (e) {}
            rafId = 0;
            flush();
            chatSaveGeom();                       // 只在松手时落盘，绝不每次 move 都写 localStorage
        }

        // 监听挂在 document 上：pointer capture 会把事件重定向到 capEl，而 capEl 在 #aiChatRoot 里面，
        // 事件照常冒泡上来（根节点只拦 click / mousedown / pointerdown，不拦 move / up）。
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
        window.addEventListener('blur', onUp);    // 兜底 2：拖出窗口后 Alt-Tab，浏览器只给 blur
    } catch (e) {
        console.error('[chat] beginDrag failed', e);
        try { document.body.removeAttribute('data-aichat-drag'); } catch (e2) {}
    }
}

// 视口变了要重新夹一次，否则把浏览器窗口拉小之后窗口会整个留在视口外面。
// 刻意**不**并进已有的 scheduleAlignSync：这里抛异常绝不能溅到对齐代码上。
function chatOnViewportResize() {
    try {
        ChatState.geom = chatClampGeom(ChatState.geom);
        chatApplyGeom();
    } catch (e) {
        console.error('[chat] viewport resize handler failed', e);
    }
}

// —— 事件绑定（只在第一次建节点时跑一次）——
function chatStopEvent(e) {
    // 只截冒泡，不 preventDefault —— 按钮要能点、textarea 要能聚焦、文字要能选中。
    try { e.stopPropagation(); } catch (err) {}
}

function chatBindShell(rootEl) {
    // 第一道防线：对话窗内部的 click / mousedown / pointerdown 一律不冒泡到 document。
    // 不加这个，行编辑态下点标题栏或消息气泡会被 handleGlobalClick 当成「点了空白区域」，
    // 直接把用户这一行提交掉、退出编辑，还会触发一次重译另一栏的网络请求（实测 §2.6）。
    // 第二道防线在 handleGlobalClick 里那一行 closest('#aiChatRoot')。
    rootEl.addEventListener('click', chatStopEvent);
    rootEl.addEventListener('mousedown', chatStopEvent);
    rootEl.addEventListener('pointerdown', chatStopEvent);

    const bar = rootEl.querySelector('#aiChatTitleBar');
    if (bar) {
        // 【这一下按在哪颗按钮上，必须在 pointerdown 就记住】下面那个 click 处理器**不能**
        // 只靠 e.target 来判「点的是按钮还是标题栏空白」：按钮自己的处理器会在同一次事件派发里
        // 把按钮的 innerHTML 整个换掉（chatSyncMinUI 把「−」换成「还原」图标），事件的 target
        // （按钮里那个 <svg>/<path>）当场脱离文档，等冒泡到标题栏时 closest('button') 返回 null。
        // 实测（刷新后第一次、dragMoved 还是 false）：点「−」的图标笔画 → 按钮把窗口折叠了，
        // 紧接着标题栏把它当成「点了空白」又展开，净效果是这颗按钮完全无操作。
        // pointerdown 那一刻 DOM 还没被任何处理器动过，所以这一笔是可靠的。
        let downOnBtn = false;
        bar.addEventListener('pointerdown', function (e) {
            try {
                downOnBtn = !!(e && e.target && e.target.closest && e.target.closest('button'));
            } catch (err) { downOnBtn = false; }
            chatBeginDrag(e, 'move');
        });
        // 折叠状态下点标题栏 = 展开。必须挡掉「拖完松手浏览器补的那个 click」
        // （dragMoved），否则把折叠条拖到别处、一松手窗口就自己展开了。
        // 三颗按钮上的点击也要放过去 —— 它们有自己的处理器。
        bar.addEventListener('click', function (e) {
            try {
                // 无论这一次要不要展开，都得把标记清掉：留着会污染下一次点击。
                const onBtn = downOnBtn;
                downOnBtn = false;
                if (!ChatState.minimized || ChatState.dragMoved) return;
                if (onBtn) return;                                                  // pointerdown 记下的，扛得住 DOM 被换
                if (e && e.target && e.target.closest && e.target.closest('button')) return;  // 键盘激活按钮（没有 pointerdown）走这条
                chatExpand();
            } catch (err) { console.error('[chat] titlebar click failed', err); }
        });
    }

    // 八向缩放手柄：类名后缀就是 kind，一次绑完，新增一个方向不需要改这里。
    const handles = rootEl.querySelectorAll('.aichat-resize');
    for (let i = 0; i < handles.length; i++) {
        (function (h) {
            const kind = h.getAttribute('data-h') || '';
            if (!kind) return;
            h.addEventListener('pointerdown', function (e) { chatBeginDrag(e, kind); });
        })(handles[i]);
    }

    const newBtn = rootEl.querySelector('#aiChatNewBtn');
    // 【刻意不写第二套实现】新建对话 = 「清理」，同一个函数。两套实现迟早会分叉，
    // 而分叉出去的那一套一定是漏掉归档的那一套 —— 那就是用户的对话被静默销毁。
    // 空对话的处理也一并继承：chatClearConversation 自己会在没有消息时原地返回、不归档。
    // 三颗按钮的 click 一律**先** stopPropagation 再干活：它们就在标题栏里面，而标题栏那个
    // click 处理器在折叠态下的语义是「展开」。不拦住，一次点击会被两个处理器各解释一遍
    // （上面那段注释里的实测：按钮折叠 → 标题栏又展开）。stopPropagation 放在第一行，
    // 这样即使下面的动作抛异常，也已经拦住了 —— 顺序反过来就等于没拦。
    if (newBtn) newBtn.addEventListener('click', function (e) { chatStopEvent(e); chatClearConversation(); });

    const minBtn = rootEl.querySelector('#aiChatMinBtn');
    if (minBtn) minBtn.addEventListener('click', function (e) { chatStopEvent(e); chatToggleMinimize(); });

    const closeBtn = rootEl.querySelector('#aiChatCloseBtn');
    if (closeBtn) closeBtn.addEventListener('click', function (e) { chatStopEvent(e); chatClose(); });

    const input = rootEl.querySelector('#aiChatInput');
    if (input) {
        input.addEventListener('input', chatAutoGrowInput);
        // C6：草稿变了 ⇒ 上下文用量变了 ⇒ 环必须退回「估算」并更新数字。防抖 220ms。
        input.addEventListener('input', chatRingSoon);
        // Enter 发送，Shift+Enter 换行。输入法组字过程中的 Enter 不算（isComposing），
        // 否则中文用户每选一次候选词就发一条。
        input.addEventListener('keydown', function (e) {
            try {
                if (!e || e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
                if (e.isComposing || e.keyCode === 229) return;
                e.preventDefault();
                chatSend();
            } catch (err) { console.error('[chat] enter-to-send failed', err); }
        });
    }

    // 这颗按钮在请求进行中就是 STOP，点它 = 中止，绝不当成「再发一条」。
    // （Enter 的语义不同：草稿里有字就是「不要上一句了，发这一句」，见 chatSend。）
    const sendBtn = rootEl.querySelector('#aiChatSendBtn');
    if (sendBtn) sendBtn.addEventListener('click', function () {
        if (ChatState.busy) chatStop();
        else chatSend();
    });

    window.addEventListener('resize', chatOnViewportResize);

    // Esc 关窗。刻意只在「焦点确实在对话窗里」或者「谁都没被聚焦」时才动手 ——
    // 用户在行内 textarea 里按 Esc 是他和那个 textarea 的事，不许被这里劫走。
    // 也不 preventDefault，免得挡住浏览器/其它组件对 Esc 的处理。
    document.addEventListener('keydown', function (e) {
        try {
            if (!e || e.key !== 'Escape' || !ChatState.open) return;
            const active = document.activeElement;
            const insideChat = !!(active && active.closest && active.closest('#aiChatRoot'));
            const nothingFocused = (!active || active === document.body);
            if (insideChat || nothingFocused) chatClose();
        } catch (err) {}
    });
}

// ============================================================================
// C2 —— 对话本身
// ============================================================================
//
// 线格式是**纯文本信封**，不是 JSON：
//
//     ==CHAT==
//     <给用户看的话>
//     ==EDIT side=src row=4==
//     <替换后的完整文本>
//     ==END==
//
// 为什么不用 JSON —— 说清楚，因为这件事被误传过：
// 重跑对照实验之后，**JSON 在两个强模型上也是干净解析、LaTeX 一个 token 都没丢的**。
// 早先那份「JSON 会毁掉强模型」的结论来自测量脚本自己的 bug（正则切到第一个 '}'，
// 而 LaTeX 里到处是 '}'）。所以选信封的真实理由只有一条：它对本项目整场都在打的
// **转义类缺陷天生免疫** —— 反斜杠不进 JSON 字符串字面量，就不存在「\ref 被解析成
// CR+ef」这一类损坏。另外弱模型（1.7b）在 JSON 上是**全盘失败**（2/2 不可解析，用户
// 什么都拿不到），在信封上是**降级为白话**（2/2 忽略信封但正文可用）。失败方向不同。
//
// 解析铁律：**没有 ==EDIT==/==END== 就当整段是白话，绝不从白话里凑一个修改出来。**

const CHAT_HISTORY_MSGS = 6;      // 每轮最多带 6 条历史（3 个来回），超出的从最老的丢
const CHAT_MAX_TOKENS = 2048;     // 只对 openai/claude/gemini 生效；本地走 callLocalLLM 自己的 16384
const CHAT_CTX_NEIGHBORS = 1;     // 目标行上下各带几行（**只**在关掉自动上下文、又附了选段时才用得上）
const CHAT_CHIP_CHARS = 60;       // 附加选段 chip 上显示多少个字
const CHAT_TICK_MS = 100;         // 「思考中… x.x s」的刷新间隔

// —— 分隔符的进出转义 ——
// 用户的选段里**本来就可能有一行 `==END==`**。原样发出去、模型再原样抄回来，
// 解析就会在正文中间截断 —— 而截断后的那段文本是要写进用户文档的。
// 防线只有一道，而且是这一道：发出去之前把长得像分隔符的整行插一个零宽空格。
// 模型抄回来的是插过零宽空格的那一行，解析器根本不会把它当成分隔符，正文里的
// `==END==` 因此天然安全（实测逐字节往返一致）。
// 【别再改回"取最后一个 ==END=="】那条规则曾经存在，它买不到这道转义没买到的东西，
// 却把「模型多打了一个 ==END==」这种常见的模型抖动变成了**往用户文档里注入协议标记**：
// 实测 qwen3.6 回了 body + ==END== + ==END==，取最后一个的结果就是替换文本末尾多出
// 一行字面量 `==END==`，并被写进了正文和行历史。取**第一个**在所有实测样本上都是逐字节正确的。
// 刻意不和哨兵协议的 [[k]]/@@n@@ 转义共用一个 helper：那边保护的是**模型不许改动的 token**，
// 这边保护的是**我们自己的分帧符**，两者的正确行为在「模型丢了标记怎么办」上正好相反。
const CHAT_ZWSP = '\u200B';        // 零宽空格。写成转义，别在源码里放裸字符 —— 那种字符肉眼查不出来。
// 私用区码位：把 `~` 藏过 marked 的 GFM 删除线，解析完就换回来。
// 两个地方用它 —— chatRenderProse（聊天气泡）和 renderFormattedText（原文/译文预览栏，
// LaTeX 的 `Section~\ref{...}` 在那里同样会被画成删除线）。两边都只在「marked.parse 前后」
// 这一小段里活着，出了那几行就不存在。
// 同样写成转义、绝不在源码里放裸字符。它**绝不**参与任何发出去或写进文档的路径。
const CHAT_MD_TILDE = '\uE000';
// 【为什么 DOC 也在这张表里】C6 的文档上下文用 `==DOC …==` / `==DOCEND==` 分帧，而帧里装的
// 正是用户的论文正文 —— 论文里出现一行 `==DOCEND==` 的概率不高，但「不高」不是「不可能」，
// 而一旦出现就是模型看到一个提前结束的文档、并对不存在的行号发表意见。
// 注意 `END` 这一支本来就吃得下 `==DOCEND==`（`==` + `END` + `DOC==` 也匹配），
// 但 `==DOC rows=…==` 需要 `DOC` 这一支；两支都在，逃逸和还原才是互逆的。
// `FOCUS` 这一支同时吃下 `==FOCUS n=…==` 和 `==FOCUSEND==`（后者是 `==` + `FOCUS` + `END==`，
// 尾巴那截落进 `[^\n]*==`）。两支都在，逃逸和还原才是互逆的。
function chatEscapeDelims(s) {
    return String(s == null ? '' : s)
        .replace(/^([ \t]*==)(CHAT|EDIT|END|DOC|FOCUS)([^\n]*==[ \t]*)$/gm, '$1' + CHAT_ZWSP + '$2$3');
}
function chatUnescapeDelims(s) {
    return String(s == null ? '' : s)
        .replace(new RegExp('==' + CHAT_ZWSP + '(CHAT|EDIT|END|DOC|FOCUS)', 'g'), '==$1');
}

// C7（对话上下文收窄）：左栏（原文/src）此刻是什么语言。只在 hasDoc 为真时才有意义
// （没有文档就没有任何可指认的行，也就没有 EDIT），但计算本身不依赖 hasDoc —— 只要
// 已经翻译过一次，AppState.sourceLang 就是权威值（isAutoDetect 也会在那时把它写实），
// 不需要在这里重新跑一次 detectLanguage。
function chatDocLang() {
    const code = (AppState.sourceLang === 'en') ? 'en' : 'zh';
    return { code: code, name: code === 'en' ? '英文' : '中文' };
}

// hasTarget = 这一轮附了选段；hasDoc = 这一轮带了自动文档上下文（==DOC== 块）；
// hasFocus  = 这一轮带了 ==FOCUS== 关注块。
// 前两者都没有时才回到「绝对不要输出 ==EDIT==」那条老规则 —— 因为那时模型根本没有可指认的行。
// ⚠️ hasFocus **不**参与那个判断：关注不是可指认的编辑目标，也不是修改授权。
//    一份只有关注、没有文档也没有选段的载荷，照旧一个 ==EDIT== 块都不许出。
//
// C7（对话上下文收窄）：docLang 是左栏原文此刻的语言（chatDocLang()）。EDIT 块里的改写正文
// **必须**用这个语言写，和「用什么语言回答用户」是两回事——那句话回什么语言跟着用户的问题走，
// 这里的改写文本只跟着原文的语言走，两条规则互不干扰。
function chatSystemPrompt(hasTarget, hasDoc, hasFocus, docLang) {
    const lang = docLang || chatDocLang();
    const focusRule = hasFocus
        ? '\n用户这一轮还标了若干「额外关注」，装在 ==FOCUS …== 与 ==FOCUSEND== 之间。\n'
          + '那是**请你多留意的地方**，不是让你改的地方：没有被明确要求改动之前，'
          + '不要因为某处被标出来就去改写它，更不要为此输出 ==EDIT== 块。\n'
        : '';
    const base = ''
        + '你是学术论文翻译工具里的助手。用户正在处理一篇需要翻译的论文，你**只看得到左栏「原文」**'
        + '（用户正在写、正在改的那份待翻译内容）；右栏的「译文」是翻译结果，你看不到它，'
        + '也不能改动它——这个工具现在只把左栏的内容当作你的上下文和可能的修改对象。\n'
        + '这句话回答用什么语言，跟着用户提问的语言走（用户用中文问就用中文答，用英文问就用英文答）；\n'
        + '但下面 ==EDIT== 块里改写之后的正文是另一回事，**必须永远使用原文的语言**'
        + '（此刻左栏原文是' + lang.name + '），不会因为你这句话用了别的语言就跟着换，见规则里单独那一条。\n\n'
        + (hasDoc
            ? '用户这一轮附带了**整份待翻译的原文**，装在 ==DOC …== 与 ==DOCEND== 之间，'
              + '每一行都编了号，形如 `[3] 原文：…`。这份文档**只有原文，没有译文**——'
              + '你看不到用户那边已经翻译出来的结果，回答时不要假装看过。\n'
              + '这个编号就是**寻址方式**：用户说「第 3 行」指的就是 [3]，你回答时也用 [n] 指认。\n'
              + '文档块只给了 ==DOC== 头部声明的那个行号范围；范围之外的行你没有看到，'
              + '**不许假装看过**，直接说「这一轮没给我第 N 行」。\n\n'
            : '')
        + focusRule
        + (focusRule ? '\n' : '')
        + '回复格式（严格遵守，**不要输出 JSON**）：\n'
        + '==CHAT==\n'
        + '<给用户看的话，可以用 Markdown>\n\n'
        + '规则：\n'
        + '1. LaTeX 命令（\\cite{...}、\\ref{...}、$...$、\\textcolor{..}{..}、\\begin{..}...\\end{..}）'
        + '必须逐字符原样保留，一个反斜杠都不许增删。\n'
        + '2. 不要复述用户给你的原文，直接说结论。\n'
        + '3. **这个工具现在只能改左栏的原文，不能改右栏的译文**：任何 ==EDIT== 块的 side 都只能写'
        + ' side=src；写 side=tgt 会被直接拒绝、不会生效。\n'
        + '4. ==EDIT== 块里替换之后的正文必须使用**' + lang.name + '**（和左栏原文同一种语言）——'
        + '不要因为你刚才这句 ==CHAT== 用别的语言回答了用户，就顺手把改写结果也换了语言。\n';
    if (!hasTarget && !hasDoc) {
        return base + '5. 这一轮用户**没有附加选段、也没有文档上下文**，所以**绝对不要**输出 ==EDIT== 块。\n';
    }
    if (!hasTarget) {
        // 文档在手、没有附加选段：允许**按行号整行替换**。这是 chat-auto-context.md 决策 2
        // 的全部意义 —— 附加从此是精确工具，不再是提问的前置条件。
        return base
            + '5. 只有当用户明确要求修改某一行原文时，才在 ==CHAT== 段之后追加一个修改块：\n'
            + '==EDIT side=src row=<行号>==\n'
            + '<这一行替换之后的完整原文>\n'
            + '==END==\n'
            + '6. ==EDIT== 与 ==END== 之间只放正文本身：不要引号、不要 diff、不要任何解释，\n'
            + '   而且必须是**整行**替换之后的完整文本，不是片段、不是只写改动的那几个字。\n'
            + '7. row 必须落在这一轮 ==DOC== 声明的范围内。一轮最多一个 ==EDIT== 块。\n'
            + '8. 只是回答问题、没有要改的时候，**不要**输出 ==EDIT== 块。\n';
    }
    return base
        + '5. 只有当用户明确要求改写「附加的选段」时，才在 ==CHAT== 段之后追加一个修改块：\n'
        + '==EDIT side=src row=<行号>==\n'
        + '<替换后的完整文本>\n'
        + '==END==\n'
        + '6. ==EDIT== 与 ==END== 之间只放替换后的正文本身：不要引号、不要 diff、不要任何解释，\n'
        + '   而且必须是**整个选段**替换之后的完整文本，不是片段。\n'
        + '7. row 必须与用户附加的选段一致。一轮最多一个 ==EDIT== 块。\n'
        + '8. 只是回答问题、没有要改的时候，**不要**输出 ==EDIT== 块。\n';
}

// 解析模型回复。返回 { prose, edit:{side,row,body}|null, hadChatMark, unterminated }
function chatParseEnvelope(raw) {
    const text = String(raw == null ? '' : raw);
    const out = { prose: '', edit: null, hadChatMark: false, unterminated: false, extraEnd: false };
    const chatMark = /^[ \t]*==CHAT==[ \t]*\r?\n?/m;
    out.hadChatMark = chatMark.test(text);

    const em = /^[ \t]*==EDIT\b([^\n]*?)==[ \t]*$/m.exec(text);
    if (!em) {
        // 没有修改块 = 整段都是白话。**绝不**从白话里推断一个修改出来。
        out.prose = chatUnescapeDelims(text.replace(chatMark, '')).trim();
        return out;
    }

    const bodyStart = em.index + em[0].length;
    // 终止符取**第一个** ==END==。用户选段里那个 ==END== 已经被 chatEscapeDelims 插了零宽空格，
    // 不会匹配到这里；而模型多打一个 ==END==、或者一轮里塞了第二个 ==EDIT== 块的时候，
    // 取第一个才不会把协议标记本身变成写进文档的正文。
    const endRe = /^[ \t]*==END==[ \t]*$/gm;
    endRe.lastIndex = bodyStart;
    const m2 = endRe.exec(text);
    const endIdx = m2 ? m2.index : -1;
    // 第一个之后还有 ==END==：这一轮的格式是坏的（模型多打了一个终止符、一轮塞了两个修改块，
    // 或者把用户选段里那行 ==END== 的零宽空格转义抄丢了 —— 三种实测都见过）。
    // 我们照旧只取第一个，但**必须说出来**：否则用户只会看到一段莫名其妙被截短的替换文本，
    // 而截短是会被应用进文档的。（`endRe` 带 g，test 从上一次匹配之后继续找。）
    out.extraEnd = m2 ? endRe.test(text) : false;

    out.prose = chatUnescapeDelims(text.slice(0, em.index).replace(chatMark, '')).trim();
    if (endIdx === -1) {
        // ==EDIT== 开了没关（被 token 上限截断，或者模型自己忘了）。半截的替换文本
        // 绝不允许长出一颗「应用」按钮。
        out.unterminated = true;
        return out;
    }

    let body = text.slice(bodyStart, endIdx);
    body = body.replace(/^\r?\n/, '').replace(/\r?\n[ \t]*$/, '');
    const attrs = String(em[1] || '');
    const sideM = /\bside\s*=\s*"?(src|tgt)"?/i.exec(attrs);
    const rowM = /\brow\s*=\s*"?(\d+)"?/i.exec(attrs);
    out.edit = {
        side: sideM ? sideM[1].toLowerCase() : null,
        row: rowM ? parseInt(rowM[1], 10) : null,
        body: chatUnescapeDelims(body)
    };
    return out;
}

// 「附加选段 + 用户这句话」这一半。文档上下文那一半由 chatBuildDocContext() 每轮现生成，
// 在 chatAssembleTurn() 里拼到前面 —— 拆成两个函数不是风格，是为了让
// **「文档从来不是一条消息」** 这件事在代码结构上看得见：这里返回的东西会进 wire，
// 但 ChatState.messages 里存的永远只有 userText 本身。
//
// 关掉自动上下文、又附了选段时，仍然带目标行 ±CHAT_CTX_NEIGHBORS 行 —— 这是本函数的原行为，
// 一个字节都没动，它是「我只想问这一段、别把整篇发出去」那条路上的最小可用上下文。
function chatBuildTargetTurn(userText, withNeighbors) {
    const t = ChatState.target;
    const pairs = Array.isArray(AppState.translationPairs) ? AppState.translationPairs : [];
    let ctx = '';
    if (t && t.rowIndex >= 0 && t.rowIndex < pairs.length) {
        if (withNeighbors) {
            const lo = Math.max(0, t.rowIndex - CHAT_CTX_NEIGHBORS);
            const hi = Math.min(pairs.length - 1, t.rowIndex + CHAT_CTX_NEIGHBORS);
            const lines = [];
            for (let i = lo; i <= hi; i++) {
                const p = pairs[i] || {};
                lines.push('第 ' + (i + 1) + ' 行' + (i === t.rowIndex ? '（目标行）' : '') + '\n'
                    + '  原文：' + chatEscapeDelims(String(p.src == null ? '' : p.src)) + '\n'
                    + '  译文：' + chatEscapeDelims(String(p.tgt == null ? '' : p.tgt)));
            }
            ctx = '【文档上下文】\n' + lines.join('\n') + '\n\n';
        }
        ctx += '【用户附加的选段】side=' + t.side + ' row=' + (t.rowIndex + 1)
            + (t.whole ? '（整行）' : '（该行第 ' + t.start + '–' + t.end + ' 个字符）') + '\n'
            + '==TARGET==\n' + chatEscapeDelims(t.text) + '\n==END==\n\n';
    }
    return ctx + '【用户的问题】\n' + chatEscapeDelims(String(userText == null ? '' : userText));
}

// 发给模型的历史：只带最近 CHAT_HISTORY_MSGS 条，且 assistant 一律**去掉 reasoning**
// （思考过程是关于答案的自言自语，不是答案，再发回去纯属烧钱烧上下文）。
// 已经被用户应用的修改块换成一行标记 —— 那段文本此刻已经在文档里、会随上下文重新发出去，
// 再重复一份没有意义；**还没应用**的提案则原样保留，用户正靠它继续说「再短一点」。
function chatWireContent(m) {
    if (!m) return '';
    if (m.role !== 'assistant') return String(m.content == null ? '' : m.content);
    let s = String(m.prose == null ? '' : m.prose);
    // C4：「回传思考」是一个**客户端**开关（ChatState.keepReasoning），不是模型参数 ——
    // LM Studio 的 preserve_thinking 作为请求参数被静默忽略，所以能诚实提供的只有这个。
    // 开着的时候把上一轮的思考内容原样放回历史里（会明显增加输入 token，提示里说清楚了）。
    if (ChatState.keepReasoning && m.reasoning && String(m.reasoning).trim()) {
        s = '[上一轮的思考过程]\n' + chatEscapeDelims(String(m.reasoning)) + '\n[/上一轮的思考过程]\n' + s;
    }
    if (m.editBody) {
        const p = chatFindProposal(m.proposalId);
        s += (p && p.applied)
            ? '\n[上一轮提出的修改已被用户应用]'
            : '\n==EDIT==\n' + chatEscapeDelims(m.editBody) + '\n==END==';
    }
    return s;
}

function chatWireHistory() {
    const msgs = ChatState.messages;
    let start = Math.max(0, msgs.length - CHAT_HISTORY_MSGS);
    // 窗口切在 assistant 上时往后挪一格：Claude 明确要求第一条必须是 user 角色，
    // Gemini 的 contents 也应当以 user 开头。少发一条历史，换掉一个 400。
    while (start < msgs.length && msgs[start].role !== 'user') start++;
    const out = [];
    for (let i = start; i < msgs.length; i++) {
        out.push({ role: msgs[i].role, content: chatWireContent(msgs[i]) });
    }
    return out;
}

// —— 传输 ——
// local / openai / claude 三家本来就吃 messages 数组，直接把历史透传过去即可。
// Gemini 不行：callGeminiAPI 的第二个参数是**一个字符串**，而且它读 parts[0]。
// 所以这里为聊天单写一条 Gemini 通道（实测：真正的多轮 contents 数组 HTTP 200，
// promptTokenCount 91），**不动** callGeminiAPI 一行，也不把多轮对话拍扁成一个字符串
// 再假装它是记忆。
async function chatCallGemini(config, messages, systemPrompt, signal, meta, req) {
    if (!config.geminiApiKey) {
        throw new Error('Gemini API Key 没配置。到「设置」里填一个再试。');
    }
    const r = req || {};
    const body = {
        contents: messages.map(function (m) {
            return {
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: String(m.content == null ? '' : m.content) }]
            };
        }),
        generationConfig: {
            temperature: (typeof r.temperature === 'number' && isFinite(r.temperature)) ? r.temperature : 0.3,
            maxOutputTokens: (typeof r.maxTokens === 'number' && r.maxTokens > 0) ? r.maxTokens : CHAT_MAX_TOKENS
        }
    };
    // C4：Gemini 的推理是**另一套合约** —— thinkingConfig.thinkingBudget，实测合法集是
    // {0=关, -1=动态} ∪ [512, 24576]（1–511 一律 400）。和 reasoning_effort 没有一个字节共用。
    // 与本地那条链路还有一处关键差别，参数条的提示里也照实写了：
    //   · 本地：**省略** reasoning_effort ≡ 关闭推理，所以那边必须永远显式发；
    //   · Gemini：省略 thinkingConfig ≡ 用模型自己的默认（flash-lite 实测是关）。
    // 所以这里保留一个「默认（不发送）」档 —— 它是诚实的，而不是「显示一个值却什么都不发」。
    if (typeof r.thinkingBudget === 'number') {
        body.generationConfig.thinkingConfig = (r.thinkingBudget === 0)
            ? { thinkingBudget: 0 }
            // 预算非 0 时才要 includeThoughts：不要它的话思考内容根本不回传，
            // 「思考」折叠区会永远是空的 —— 那就成了一个看得见效果为零的开关。
            : { thinkingBudget: r.thinkingBudget, includeThoughts: true };
    }
    if (systemPrompt) body.systemInstruction = { parts: [{ text: systemPrompt }] };

    const url = `${GEMINI_API_BASE}/${config.model}:generateContent?key=${config.geminiApiKey}`;
    const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal
    });
    if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`Gemini API Error: ${resp.status} - ${errText}`);
    }
    const data = await resp.json();
    const cand = (data && data.candidates && data.candidates[0]) || {};
    const parts = (cand.content && Array.isArray(cand.content.parts)) ? cand.content.parts : [];
    const partText = function (p) { return (p && typeof p.text === 'string') ? p.text : ''; };
    if (meta) {
        meta.finish = cand.finishReason || '';
        meta.truncated = meta.finish === 'MAX_TOKENS';
        // C6：Gemini 把输入 token 放在 usageMetadata.promptTokenCount，不是 usage.prompt_tokens。
        meta.promptTokens = Number(data && data.usageMetadata && data.usageMetadata.promptTokenCount) || 0;
        // thought:true 的 part 是**思维链**，绝不能当答案（旧 callGeminiAPI 读 parts[0] 就会读到它）
        meta.reasoning = parts.filter(function (p) { return p && p.thought === true; }).map(partText).join('');
        meta.thinking = meta.reasoning.trim() !== '';
    }
    if (!parts.length) {
        throw new Error('Gemini 返回了空内容（可能是 thinking 预算耗尽或被安全策略拦截）。');
    }
    const answer = parts.filter(function (p) { return !p || p.thought !== true; }).map(partText).join('');
    if (meta) meta.text = answer;
    return answer;
}

// 【C4 的核心一行】这里读的是 chatApiConfig()，**不是** getApiConfig()。
// 对话的 provider/model 独立于 AppState.apiProvider/selectedModel，见 chatModelChoice。
// sink 只有开了流式（且 provider==='local'）时才有值。
async function chatCallModel(messages, systemPrompt, signal, meta, sink) {
    const config = chatApiConfig();
    const req = {
        provider: config.provider,
        model: config.model,
        temperature: chatEffectiveTemperature(config.provider, config.model),
        maxTokens: chatEffectiveMaxTokens(config.provider),
        reasoningEffort: '',
        thinkingBudget: null,
        stream: false
    };
    if (config.provider === 'gemini') {
        const g = chatGeminiOption(ChatState.geminiThinking);
        if (g && g.budget !== null) req.thinkingBudget = g.budget;
        ChatState.lastRequest = req;
        return await chatCallGemini(config, messages, systemPrompt, signal, meta, req);
    }
    const full = [{ role: 'system', content: systemPrompt }].concat(messages);
    if (config.provider === 'local') {
        req.reasoningEffort = chatWireEffort(config.model);
        req.stream = !!(sink && ChatState.stream);
        ChatState.lastRequest = req;
        if (req.stream) return await chatStreamLocal(config, full, signal, meta, req, sink);
        // meta 由 callLocalLLM 用 readLocalChoice 填满：text / reasoning / finish / truncated / thinking
        return await callLocalLLM(config.localBaseUrl, config.model, full, false, signal, meta, {
            temperature: req.temperature,
            maxTokens: req.maxTokens,
            reasoningEffort: req.reasoningEffort
        }) || '';
    }
    // OpenAI / Claude：temperature 为 null 表示「这个模型上这个参数不可设」（新 OpenAI 模型只接受 1），
    // 那就一个字节都不发 —— 参数条那边同样不画这个控件，两处必须一致，否则就是画了个假控件。
    const opt = { max_tokens: req.maxTokens };
    if (req.temperature !== null) opt.temperature = req.temperature;
    ChatState.lastRequest = req;
    if (config.provider === 'openai') {
        return await callOpenAIAPI(config.model, full, opt, config.openaiApiKey, signal) || '';
    }
    if (config.provider === 'claude') {
        return await callClaudeAPI(config.model, full, opt, config.claudeApiKey, signal, config.claudeProxyUrl) || '';
    }
    throw new Error('未知的模型提供方：' + String(config.provider));
}

// —— 窗口内的几个小 DOM 工具 ——
function chatBubbleOf(row) {
    try { return row ? row.querySelector('.aichat-bubble') : null; } catch (e) { return null; }
}

// 「思考」折叠区。reasoning_content 只能出现在这里，永远不当答案。
//
// 【存在性判定：绝不看键在不在】非流式响应里 message.reasoning_content 是**恒定存在**的键，
// 没用推理时它是空串 —— 拿 `'reasoning_content' in message` 判断的话每一轮都会画出一个空盒子。
// 唯二可信的信号是：非空的 reasoning_content，或者 usage.completion_tokens_details.reasoning_tokens > 0。
// 两者都由 readLocalChoice 归一化好了（reasoning / reasoningTokens），这里只消费。
//
// 【第三种状态必须说出来】rtok > 0 但文本是空的 = 模型确实推理了、但没把过程回传
// （Gemini 不带 includeThoughts 时就是这样）。那时候既不能画空盒子、也不能装作没推理过 ——
// 画一行说明，把花掉的 token 数说清楚，因为**那些 token 用户是付了钱的**。
//
// 折叠区一律插在**答案上面**：它是关于答案的散文，不是答案；排在下面读起来像是后续结论。
function chatAppendThinking(row, reasoning, reasoningTokens) {
    try {
        if (!row) return;
        if (!ChatState.showThinking) return;          // 纯显示开关：关掉就什么都不画（不是画个空的）
        const text = String(reasoning == null ? '' : reasoning);
        const rtok = Number(reasoningTokens) || 0;
        const hasText = text.trim() !== '';
        if (!hasText && rtok <= 0) return;            // 推理是关的 ⇒ 一个空盒子都不留
        const box = chatBubbleOf(row) || row;
        const det = document.createElement('details');
        det.className = 'aichat-think';
        const sum = document.createElement('summary');
        // 默认**折叠**：它很长，而且用户要看的是答案。
        sum.textContent = hasText
            ? ('思考（模型的推理过程，不是答案' + (rtok > 0 ? '；' + chatFmtNum(rtok) + ' tok' : '') + '）')
            : ('思考（模型推理了 ' + chatFmtNum(rtok) + ' tok，但没有回传过程文本）');
        const body = document.createElement('div');
        body.className = 'aichat-think-body';
        body.textContent = hasText                    // textContent：推理里出现的 '<' 一个都不许当标签
            ? text
            : '这一轮 usage.completion_tokens_details.reasoning_tokens = ' + chatFmtNum(rtok)
              + '，说明模型确实推理了，但响应里没有带回推理正文。'
              + '（Gemini 上是没开 includeThoughts；本地模型上是服务端没回传 reasoning_content。）'
              + '这些 token 已经计入生成量，所以这里如实说明，而不是装作没发生过。';
        det.appendChild(sum);
        det.appendChild(body);
        // 插到气泡最前面 —— 思考永远排在答案上面（流式那条路 chatLiveSink 也是同一顺序）。
        if (box.firstChild) box.insertBefore(det, box.firstChild);
        else box.appendChild(det);
    } catch (e) {}
}

// 助手气泡下面那颗「复制答案」。
// 【它复制的是什么，必须一个字节都不含糊】只复制 parsed.prose —— 即 message.content 去掉
// ==CHAT== 信封头和 ==EDIT== 块之后的散文。**绝不**包含 reasoning：思考内容不是答案，
// 顺手复制走会让它出现在用户的论文里，而用户以为那是模型的结论。
// （替换文本有它自己的「复制」按钮，在提案卡上，复制的是 p.replacement。两条路互不相通。）
function chatAppendCopyAnswer(row, answerText) {
    try {
        if (!row) return;
        const s = String(answerText == null ? '' : answerText);
        if (!s.trim()) return;
        const box = chatBubbleOf(row) || row;
        const bar = document.createElement('div');
        bar.className = 'aichat-msgacts';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'aichat-minibtn';
        btn.textContent = '复制答案';
        btn.setAttribute('data-tip', '只复制答案正文（message.content 去掉信封头和 ==EDIT== 块）。'
            + '**不含思考过程**——那是关于答案的推理，不是答案；也不含替换文本，替换文本在提案卡上有自己的「复制」。');
        btn.setAttribute('data-tip-pos', 'top-start');
        btn.addEventListener('click', function () {
            try {
                copyToClipboard(s);
                btn.textContent = '已复制';
                setTimeout(function () { try { btn.textContent = '复制答案'; } catch (e2) {} }, 1200);
            } catch (e) {}
        });
        bar.appendChild(btn);
        box.appendChild(bar);
    } catch (e) {}
}

// 助手气泡里的正文。**先 escapeHtml，再 marked.parse**，刻意不走 renderFormattedText：
//   · escapeHtml 是本文件对「往 HTML 里塞不受控文本」的既有约定（见 escapeAttr 上方的注释），
//     而气泡里装的是模型自由生成的文本。实测不转义时，回复里的
//     `<img src=x onerror=...>` 会在气泡里变成活的元素并执行 —— 这不是安全加固问题，
//     是「模型说的话被当成了标记」这种**正确性**问题。
//   · 实测 escapeHtml→marked 不会把已有实体二次转义（`5 &lt; 6` 原样出来），
//     Markdown 的加粗/列表/代码块全都照常工作。
//   · 顺带的取舍：这样 `$\alpha_i$` 会**按源码原样显示**而不是渲染成公式。
//     对这个工具反而是对的 —— 在讨论 LaTeX 的时候，用户要看的就是那串字节本身，
//     提案卡的前后两栏也是同一个理由用等宽原样显示。
//   · **波浪号必须先藏起来。** marked 默认开着 GFM 的单波浪号删除线，而 LaTeX 里
//     `第~\ref{sec:II}节` / `不确定性~\cite{10143419}` 这种不换行空格几乎出现在每一处引用上。
//     实测（本地 qwen3.6 与 gemini-2.5-flash-lite 各一次真实对话，第一轮就中）气泡里出现
//     `<del>\cite{10143419}，如第</del>`：波浪号被吞掉，引用被画上删除线 —— 删除线
//     在中文语境里恰好读作「把这段删掉」，正好是模型意思的反面。
//     做法是解析前把 `~` 换成一个私用区码位、解析完再换回来，而不是去改全局 marked 配置
//     （同一个 marked 还在给译文渲染用，不能因为聊天窗的毛病去动它）。
//     两个被实测否掉的更"简单"的写法，别再试：
//       · 换成 HTML 实体 `&#126;`：代码段里 marked 会把 `&` 再转义一次，
//         `` `inline~code` `` 会**原样显示成** `inline&#126;code`。
//       · 换成 `U+0001` 之类控制字符：markdown 链接的目标不允许控制字符，
//         `[文档](http://x/a~b)` 会整个不再是链接。
//     私用区码位两条都躲开了；唯一要补的是链接目标会被 encodeURI 成 %EE%80%80，所以还原时
//     把编码后的形式一起换回去（实测 `[主页](http://ece.umass.edu/~lorenzo)` href 逐字正确）。
function chatRenderProse(bubble, text) {
    const s = String(text == null ? '' : text);
    try {
        if (!window.marked) { bubble.textContent = s; return; }
        bubble.classList.add('aichat-md');
        // 先清掉模型自己写出来的哨兵码位，替换才是单射的（U+E000 是私用区，没有任何定义好的
        // 含义，浏览器本来也只会画一个豆腐块 —— 丢掉它不会丢掉任何可读内容）。
        const md = escapeHtml(s).split(CHAT_MD_TILDE).join('').split('~').join(CHAT_MD_TILDE);
        bubble.innerHTML = window.marked.parse(md)
            .split(CHAT_MD_TILDE).join('~')
            .split(encodeURI(CHAT_MD_TILDE)).join('~');
    } catch (e) {
        bubble.classList.remove('aichat-md');
        bubble.textContent = s;
    }
}

function chatSetBusy(on) {
    try {
        ChatState.busy = !!on;
        const btn = document.getElementById('aiChatSendBtn');
        if (!btn) return;
        btn.textContent = on ? 'STOP' : 'SEND';
        if (on) btn.classList.add('is-busy');
        else btn.classList.remove('is-busy');
    } catch (e) {}
}

// 【这里原本还有一个 chatUpdateBar】C6 之前的旧版本（只画「共 n 条消息」那一行）。
// 带环和上下文开关的那一版在同一个脚本里靠后声明，函数声明提升让它整个覆盖掉了这一份 ——
// 也就是说旧的那份从落地起就是死代码，只会在排查「状态条为什么不刷新」时把人引到错的函数上
// （而提取式测试的 extractFn 取的正是文件里**第一个**同名函数）。已删除。

function chatPushUser(text) {
    ChatState.messages.push({ role: 'user', content: String(text == null ? '' : text) });
    chatAppendRow('user', text);
    chatUpdateBar();
}

// 停止：中止在飞的请求。**不**清空已经收到的东西 —— 取消是预期路径，不是错误。
function chatStop() {
    try {
        if (ChatState.abort) {
            try { ChatState.abort.abort(); } catch (e) {}
        }
    } catch (e) {}
}

async function chatSend() {
    let mySeq = 0;
    let pendingRow = null;
    let tick = null;
    let live = null;
    try {
        const ta = document.getElementById('aiChatInput');
        const draft = ta ? String(ta.value || '') : '';
        if (!draft.trim()) {
            // 空草稿 + 正在飞 = 用户按 Enter 想中止（按钮那条路径直接走 chatStop）
            if (ChatState.busy) { chatStop(); return; }
            chatAppendRow('system', '输入框是空的。');
            return;
        }

        // 上一轮还没落地就先掐掉，再发新的这一轮 —— 用户又打了一句，就是不要上一句的答案了。
        // 光有 abort 不够：两条消息挨得很近时，旧请求可能已经拿到响应正在解析。
        // 所以还要 seq 守卫（照抄 scheduleCrossHighlight）：mySeq 对不上的响应一律丢弃。
        chatStop();
        mySeq = ++ChatState.seq;

        // 换文档了就先把上一份文档的对话归档、从空白开始（行号对不上，继续沿用只会误导）。
        chatSyncSession();

        if (ta) { ta.value = ''; chatAutoGrowInput(); }
        chatPushUser(draft);

        // 【发送前必做】关注集逐条重新锚定：引文还在且能唯一定位就挪过去，
        // 找不到 / 找到多处就**当场作废并且说出来**。C3 的最后一道收口 ——
        // 一个指错地方的关注会让模型一本正经地对着别的文字发表意见，而用户看不出来。
        try { focusRevalidate('发送前复核'); } catch (eFocus) {}

        // 【文档在这里、也只在这里进 wire】chatAssembleTurn 每次调用都从 AppState.translationPairs
        // 现生成一份，绝不复用上一轮那份 —— 「压缩后文档还在 / 清理后仍带全文 / 重译后带的是新文档」
        // 这三条因此是结构上成立的，不是靠谁记得刷新。
        const assembled = chatAssembleTurn(draft, true);
        const sys = assembled.sys;
        const wire = assembled.wire;
        const docNow = assembled.doc;
        // 这一轮发出去的文档指纹：模型按行号提修改时，闸门靠它判「这一行从那以后被改过没有」。
        ChatState.docSnapshot = docNow.on
            ? { id: ++ChatState.snapshotSeq, from: docNow.from, to: docNow.to, total: docNow.total,
                hashes: docNow.hashes, windowed: docNow.windowed, at: Date.now() }
            : null;
        // 分项估算先存下来，等 usage.prompt_tokens 回来再算残差和校准倍率。
        // msgCount 含 system 那一条 —— 模板固定开销按条数算。
        ChatState.lastSent = { parts: assembled.parts, docSig: chatRowHash(docNow.text),
                               msgCount: wire.length + 1 };
        if (docNow.windowed) {
            chatAppendRow('system', '⚠ 这一轮的文档上下文被截成了第 ' + docNow.from + '–' + docNow.to
                + ' 行（共 ' + docNow.total + ' 行）—— 整篇装不进可用窗口。'
                + '范围已经写进发出去的载荷里，所以模型被问到范围外的行会说「没看到」而不是编一个。');
        }
        chatUpdateBar();

        const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        ChatState.abort = controller;
        chatSetBusy(true);

        // C8：「正在处理」指示器。**不受「显示思考过程」开关影响**——那个开关只管思考正文
        // 显不显示，这里画的是「请求还在飞、我还活着」，两回事。页面上只允许有这一个活跃计时器：
        // chatStop()（上面已经调过）会让上一轮的 killPending 先跑，所以这里起的永远是唯一一个。
        const pending = chatAppendPendingRow();
        pendingRow = pending ? pending.row : null;
        const t0 = Date.now();
        tick = setInterval(function () {
            try {
                // 只改这一个节点的 textContent —— 动画是纯 CSS，interval 不摸它。
                if (pending && pending.timeEl) pending.timeEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
            } catch (e) {}
        }, CHAT_TICK_MS);

        const meta = {};
        // C5：流式的活气泡。真正的答案文字（text delta）到达时才建行（在那之前
        // 「thinking… x.x s ≈N tok」照常跑），建行的同时把计时行撤掉 —— 两条同时在屏幕上
        // 等于告诉用户「有两件事在发生」。
        const killPending = function () {
            try { if (tick) { clearInterval(tick); tick = null; } } catch (e) {}
            try { if (pendingRow && pendingRow.parentNode) pendingRow.parentNode.removeChild(pendingRow); } catch (e) {}
            pendingRow = null;
        };
        const sink0 = chatLiveSink();
        live = {
            // 推理增量**不**撤掉计时行了（这是之前的问题：关掉「显示思考」时，第一条 reasoning
            // delta 一来就把 thinking 指示器撤了，而 sink0.reasoning 里那句
            // `if (!ChatState.showThinking) return;` 又什么都不画——用户在整个推理阶段
            // 什么信号都看不到，跟真卡死了一样）。改成：不管开关开没开，thinking 期间都用
            // chatEstTokens 按已收到的推理文字实时估一个 token 数、写回 pending 指示器；
            // 开关只决定要不要**额外**把推理正文本身画成一个实时展开的框。
            reasoning: function (s) {
                try { if (pending && pending.tokEl) pending.tokEl.textContent = '≈' + chatFmtNum(chatEstTokens(s)) + ' tok'; } catch (e) {}
                if (ChatState.showThinking) sink0.reasoning(s);
            },
            text: function (s) { killPending(); sink0.text(s); },
            destroy: sink0.destroy
        };
        const raw = await chatCallModel(wire, sys, controller ? controller.signal : null, meta, live);

        // 陈旧响应：用户在这期间又发了一条。丢弃，绝不往窗口里写。
        if (mySeq !== ChatState.seq) return;
        live.destroy();                 // 活气泡退场，最终那一版由 chatRenderAssistant 统一渲染
        live = null;
        if (meta.aborted) {
            // 流被中止：已经收到的字**留下**（取消是预期路径，不是错误），
            // 而半截的 ==EDIT== 在 chatParseEnvelope 里就已经被判成 unterminated，长不出「应用」按钮。
            if (String(raw || '').trim()) {
                chatRenderAssistant(raw, meta);
                chatAppendRow('system', '已停止 —— 上面是中止前已经收到的内容。');
            } else {
                chatAppendRow('system', '已停止。');
            }
            return;
        }
        chatRenderAssistant(raw, meta);
        // C6：**实测**用量落袋。分项之和不会等于 prompt_tokens（服务器的 chat template 还要加
        // 角色标记和分隔符），残差就叫「模板开销」，明着显示、当场对账，绝不摊进别的分项里。
        try {
            const ptok = Number(meta && meta.promptTokens) || 0;
            if (ptok > 0 && ChatState.lastSent) {
                const p = ChatState.lastSent.parts;
                const sum = chatPartsSum(p);
                const c = chatModelChoice();
                const modelKey = c.provider + ':' + c.model;
                const tmpl = chatEstOverhead(ChatState.lastSent.msgCount);
                // 自校准：把「实测 − 可独立测量的模板固定开销」÷「分项原始估算」折成一个倍率。
                // 只影响下一次的**估算**显示，绝不用来重写这一轮的分项 —— 那会让残差变成一个
                // 由公式反推出来的数字，面板就从「照实记账」退化成「自证其说」。
                if (sum > 0) {
                    const k = (ptok - tmpl) / sum;
                    if (isFinite(k) && k >= CHAT_CALIB_MIN && k <= CHAT_CALIB_MAX) {
                        ChatState.calib = { model: modelKey, k: k, at: Date.now() };
                    }
                }
                ChatState.usage = {
                    promptTokens: ptok,
                    parts: p,
                    sum: sum,
                    overhead: Math.max(0, ptok - sum),
                    templateOverhead: tmpl,
                    calibK: chatCalibFactor(modelKey),
                    model: modelKey,
                    // 生成侧的推理量。**实测**，来自 usage.completion_tokens_details.reasoning_tokens。
                    // 它属于 completion，不是 prompt —— 所以面板上单列一行，绝不加进输入侧的对账里
                    // （加进去会让「四项估算 + 残差 = 实测 prompt_tokens」这条恒等式当场变成假的）。
                    reasoningTokens: Number(meta && meta.reasoningTokens) || 0,
                    // 身份 = 「环上这个实测值现在还对不对得上窗口里的内容」。只要有一处变了就退回估算。
                    // 此刻草稿已经清空、助手那条也已经 push 完，所以这里算出来的身份
                    // 和紧接着 chatCtxReadout() 算出来的那个是同一个字符串。
                    sig: chatCtxSig(ChatState.lastSent.docSig, 0),
                    at: Date.now()
                };
            }
        } catch (e2) { console.error('[chat] usage record failed', e2); }
        // 每轮落一次档（upsert 到同一条，不会越攒越多）。
        // 【为什么必须每轮存，而不是只在清理/切文档时存】那两个时机都要求用户**主动做点什么**。
        // 用户直接关标签页、或者直接从 History 恢复另一份翻译，都不经过它们；
        // 而 ChatState.messages 一个字节都不跨刷新存在。不每轮落档的话，
        // 「恢复一份翻译，它的对话跟着回来」在最常见的路径上根本不成立 —— 归档里压根没有那一段。
        // 写不进去（配额满）时 chatArchivePush 自己会在窗口里明说，不静默。
        try { chatArchivePush('自动存档'); } catch (e3) { console.error('[chat] autosave archive failed', e3); }
        chatUpdateBar();
    } catch (e) {
        if (mySeq !== ChatState.seq) return;               // 陈旧轮次的异常也一并丢弃
        if (e && e.name === 'AbortError') {
            chatAppendRow('system', '已停止。');
        } else {
            // 出错一律是对话流里的一行，**绝不**写 AppState.error（那会重渲染整页）
            chatErrorRow('对话', chatDescribeError(e));
        }
    } finally {
        try { if (tick) clearInterval(tick); } catch (e2) {}
        try { if (pendingRow && pendingRow.parentNode) pendingRow.parentNode.removeChild(pendingRow); } catch (e2) {}
        // 活气泡也一定要收掉：正常路径上面已经 destroy 过（幂等），异常/陈旧路径靠这一行兜底，
        // 否则页面上会永远留着一段半截的流式文本，而它下面绝不会有「应用」按钮 —— 更糟的是
        // 用户会以为那就是最终答案。
        try { if (live) live.destroy(); } catch (e2) {}
        if (mySeq === ChatState.seq) {
            ChatState.abort = null;
            chatSetBusy(false);
        }
        chatScrollToBottom();
    }
}

// LM Studio 的报错措辞有时是误导性的（body 稍有不对就一律说 "failed to parse JSON value"），
// 但 error.code / error.param 是准的。能挖出来就把这两个字段亮出来。
function chatDescribeError(e) {
    try {
        const msg = (e && (e.message || e.toString())) || String(e);
        const m = /\{[\s\S]*\}$/.exec(msg);
        if (m) {
            const j = JSON.parse(m[0]);
            const err = (j && j.error) || j;
            if (err && (err.code || err.param || err.message)) {
                return msg.slice(0, m.index)
                    + (err.message || '')
                    + (err.code ? '（code=' + err.code + '）' : '')
                    + (err.param ? '（param=' + err.param + '）' : '');
            }
        }
        return msg.length > 400 ? msg.slice(0, 400) + '…' : msg;
    } catch (err) {
        return (e && (e.message || e.toString())) || String(e);
    }
}

function chatRenderAssistant(raw, meta) {
    const parsed = chatParseEnvelope(raw);
    const m = meta || {};
    const record = {
        role: 'assistant',
        content: String(raw == null ? '' : raw),
        prose: parsed.prose,
        reasoning: String(m.reasoning == null ? '' : m.reasoning),
        // 存在性判定的第二个信号。**不是**「键在不在」——那个键恒存在。
        reasoningTokens: Number(m.reasoningTokens) || 0,
        editBody: null,
        proposalId: null
    };

    // 正文为空 + 有推理 = 推理吃光了预算。这是本地模型最典型的一种「什么都没返回」。
    if (!String(raw || '').trim()) {
        const errRow = chatErrorRow('对话', m.thinking
            ? '模型把 token 预算全用在推理上了，正文是空的。到「设置 → 模型」把该模型的「推理」设为「关」再试。'
            : '模型返回了空正文。');
        // 推理内容仍然给出来（诊断用），但没有推理时不要留一条空行。
        // 这一条**绕过**「显示思考过程」开关：正文是空的，此刻推理内容是屏幕上唯一的诊断线索，
        // 把它也藏起来，用户看到的就只剩一条「模型返回了空正文」而无从下手。
        if (record.reasoning.trim()) {
            const diag = chatAppendRow('system', '');
            const keep = ChatState.showThinking;
            ChatState.showThinking = true;
            try { chatAppendThinking(diag, record.reasoning, record.reasoningTokens); }
            finally { ChatState.showThinking = keep; }
        }
        ChatState.messages.push(record);
        chatUpdateBar();
        chatScrollToBottom();
        return;
    }

    const row = chatAppendRow('assistant', '');
    const bubble = chatBubbleOf(row);
    if (bubble) chatRenderProse(bubble, parsed.prose || String(raw));
    // 顺序要点：先画正文，再把思考区**插到最前面**，然后「复制答案」。
    chatAppendThinking(row, record.reasoning, record.reasoningTokens);
    // 复制的永远是 parsed.prose（来自 message.content），和思考区读的是两个不同的字段。
    chatAppendCopyAnswer(row, parsed.prose || String(raw));

    if (m.truncated) {
        chatAppendRow('system', '⚠ 这条回复被 token 上限截断了（finish_reason=length），下面的内容是半截的。');
    }
    if (parsed.unterminated) {
        chatAppendRow('system', '模型开了 ==EDIT== 却没有写 ==END==（多半是被截断）。半截的替换文本不会长出「应用」按钮。');
    }
    if (parsed.extraEnd) {
        chatAppendRow('system', '这条回复里有不止一个 ==END==（模型多打了一个，或者一轮里塞了两个修改块）。'
            + '替换文本只取到**第一个** ==END== 为止 —— 后面那些是协议标记，绝不会被写进你的文档。'
            + '请对照卡片确认这段文本有没有被截短。');
    }

    if (parsed.edit) {
        record.editBody = parsed.edit.body;
        const p = chatMakeProposal(parsed.edit);
        if (p) record.proposalId = p.id;
    }

    ChatState.messages.push(record);
    chatUpdateBar();
    chatScrollToBottom();
}

// ============================================================================
// C4 —— 输入框下面那条参数条
// ============================================================================
//
// 用户要的是三件事：**对话用哪个模型**（和翻译各管各的）、**思考开不开**、**推理强度**，
// 外加「模型还支持什么就都放上来，太多就收进一个竖排的 ⋮」。
//
// 这一段的全部难点不在渲染，在于**不许出现装饰性控件**。所以先把「什么是真的、什么会是谎」
// 一条条钉死（全部实测，出处见 .claude/tmp/capabilities.md 与 chat-window.md §6）：
//
//   1) 选项从哪来：`GET <origin>/api/v1/models`（**不是** /api/v0），顶层键 `models`、
//      id 键 `key`、非 LLM 条目整个 `capabilities` 缺失。这一份发现已经由 xportModelCaps /
//      xportCapsPeek 落地并带 60 秒缓存，**这里只消费，绝不再写第二个抓取器**。
//        · qwen3.8-27b   → ["off","low","medium","xhigh","on"]（唯一有真实档位的）
//        · qwen3.6-35b-a3b / qwen3-1.7b → ["off","on"]（二值）
//
//   2) **永远显式发 reasoning_effort。** capabilities.reasoning.default 是 LM Studio 的
//      **界面**默认值，不是 API 默认值：实测省略这个字段 = 零推理，哪怕 default 写着 "xhigh"。
//      屏幕上显示 xhigh 却什么都不发，就是撒谎。
//
//   3) **界面词表 ≠ 线上词表。** off→"none"、on→"medium"；永远不发 "high"（3.8 上会回落）、
//      永远不发 "minimal"（服务端 WARN 着映射成 "low"）、发 "off" 直接 400。
//      能复现的只有「none=0 推理 token，非 none 一定 >0，三个模型无一 400」这三条。
//      ⚠ 具体的推理 token 数**跟着提问走，不是模型属性**：同一条链路上 low/medium/xhigh 量到过
//      56/56/61、84/84/140、376/456/613、27/30/43、107/107/244。任何一组都不许再被当成通用结论
//      写进界面（曾经写进过推理强度的 data-tip，是一条假的实测声明）。
//
//   4) **这两样东西不画控件**，因为按请求根本设不了 —— 画了就是装饰：
//        · preserve_thinking：只存在于磁盘上的 model.yaml，作为请求参数被静默忽略，
//          /api/v1/models 里也完全没有它。所以这里提供的是**客户端**的同名效果
//          （keepReasoning：要不要把上一轮的思考内容回传），并在提示里明说这是我们的行为。
//        · context length：加载期参数，发 context_length/num_ctx/n_ctx 返回 200 但纹丝不动。
//          所以只读展示（⋮ 里那排芯片），不给任何可调的东西。
//
//   5) capabilities 读不到时**隐藏控件 + 说明原因**，绝不去探测、更不去卸载模型来试
//      （那台服务器可能有别的工作流在用）。
//
//   6) Gemini 是另一套合约：thinkingBudget ∈ {0, -1} ∪ [512, 24576]，且**省略 ≡ 模型自己的
//      默认**（与本地相反）。所以它的档位表里保留一个诚实的「默认（不发送）」。
//      OpenAI / Claude 这边没有任何已接线的推理发现，所以**不画推理控件**（不是画一个灰的）。

const CHAT_PARAMS_LS_KEY = 'chatParams';
const CHAT_TEMP_DEFAULT = 0.3;
// 刻意用**有限集**而不是自由输入框：参数条上的每一个选项都要被真机逐个跑过一遍才敢发布，
// 自由输入框做不到「穷尽验证」，而且 0 在 callOpenAIAPI 里会被 `config.temperature || 0.3`
// 悄悄吃成 0.3（那个既有写法不在本轮改动范围内）—— 不提供 0 就不会踩到它。
const CHAT_TEMPS = [0.1, 0.3, 0.7, 1.0];
const CHAT_MAXTOK_CHOICES = [1024, 2048, 4096, 8192, 16384];
// Gemini 思考档。budget=null 表示**不发送** thinkingConfig。
const CHAT_GEMINI_THINKING = [
    { v: '',        label: '默认', budget: null },
    { v: 'off',     label: '关',   budget: 0 },
    { v: 'dynamic', label: '动态', budget: -1 },
    { v: 'max',     label: '最大', budget: 24576 }
];

function chatGeminiOption(v) {
    for (let i = 0; i < CHAT_GEMINI_THINKING.length; i++) {
        if (CHAT_GEMINI_THINKING[i].v === String(v == null ? '' : v)) return CHAT_GEMINI_THINKING[i];
    }
    return CHAT_GEMINI_THINKING[0];
}

// —— 持久化 ——
// 独立的 key，和翻译的 selectedModel / reasoningByModel 完全不共享一个字节。
// 单独一个 try/catch（和 chatSaveGeom 同样的理由：别人写失败不能顺手弄丢这一份）。
function chatParamsSave() {
    try {
        localStorage.setItem(CHAT_PARAMS_LS_KEY, JSON.stringify({
            provider: ChatState.provider,
            model: ChatState.model,
            reasoningByModel: ChatState.reasoningByModel,
            geminiThinking: ChatState.geminiThinking,
            temperature: ChatState.temperature,
            maxTokens: ChatState.maxTokens,
            stream: !!ChatState.stream,
            keepReasoning: !!ChatState.keepReasoning,
            paramsOpen: !!ChatState.paramsOpen,
            autoContext: !!ChatState.autoContext,
            showThinking: !!ChatState.showThinking,
            autoApprove: !!ChatState.autoApprove
        }));
    } catch (e) {}
}

// 逐键校验，脏值一律**不收**（不是回落成别的值）。localStorage 里躺着一个不认识的档位，
// 结果被当成合法值发出去，正是这个文件反复在防的那类事。
function chatParamsLoad() {
    try {
        const raw = localStorage.getItem(CHAT_PARAMS_LS_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object' || Array.isArray(p)) return;

        const prov = String(p.provider || '');
        const mid = sanitizeModelId(p.model);
        if (mid && (prov === 'local' || MODEL_PROVIDERS.indexOf(prov) !== -1)) {
            ChatState.provider = prov;
            ChatState.model = mid;
        }
        if (p.reasoningByModel && typeof p.reasoningByModel === 'object' && !Array.isArray(p.reasoningByModel)) {
            const clean = {};
            Object.keys(p.reasoningByModel).forEach(function (k) {
                const id = sanitizeModelId(k);
                const v = p.reasoningByModel[k];
                if (id && typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v)) clean[id] = v;
            });
            ChatState.reasoningByModel = clean;
        }
        if (typeof p.geminiThinking === 'string' && chatGeminiOption(p.geminiThinking).v === p.geminiThinking) {
            ChatState.geminiThinking = p.geminiThinking;
        }
        if (typeof p.temperature === 'number' && CHAT_TEMPS.indexOf(p.temperature) !== -1) {
            ChatState.temperature = p.temperature;
        }
        if (typeof p.maxTokens === 'number' && CHAT_MAXTOK_CHOICES.indexOf(p.maxTokens) !== -1) {
            ChatState.maxTokens = p.maxTokens;
        }
        if (typeof p.stream === 'boolean') ChatState.stream = p.stream;
        if (typeof p.keepReasoning === 'boolean') ChatState.keepReasoning = p.keepReasoning;
        if (typeof p.paramsOpen === 'boolean') ChatState.paramsOpen = p.paramsOpen;
        if (typeof p.autoContext === 'boolean') ChatState.autoContext = p.autoContext;
        if (typeof p.showThinking === 'boolean') ChatState.showThinking = p.showThinking;
        if (typeof p.autoApprove === 'boolean') ChatState.autoApprove = p.autoApprove;
    } catch (e) {}
}

// ============================================================================
// 默认模型（设置 → 模型 → 默认模型）：翻译一行、对话一行，各存各的
// ============================================================================
//
// 【为什么是两行而不是一行】同一个模型在这两个界面上的经济性**实测**差一个数量级，
// 所以「一个全局默认模型」必然在其中一个界面上是错的。以下数字全部来自本轮实测
// （出处：.claude/tmp/benchmark.md、capabilities.md、thinking-json.md），写在这里是为了
// 以后不会有人凭直觉把它改回去：
//
//   翻译 → qwen3.6-35b-a3b
//     · 端到端快 2.05 倍（配对中位数，p25 1.89 / p75 2.33），53.0 vs 26.3 tok/s
//     · 在用户自己的论文上盲测强制二选一 6:1 胜出
//     · 把已定义的实体名 'Willie' 音译掉的比例 4.5%，qwen3.8 是 19.3%
//     · 推理在翻译上实测**没有**质量收益（盲评 6 段里 5 平 1 微胜 0 负，n=6 单评委，弱信号且
//       如实标注为弱），代价却是 5.8 倍 token、6–10 倍墙钟 —— 所以翻译这边推理默认关，
//       换哪个模型都一样。
//
//   对话 → qwen3.8-27b
//     · 推理的代价差一个数量级：qwen3.6 开推理 = 慢 6–10 倍、约 92% 的生成 token 花在推理上；
//       qwen3.8 开推理 ≈ 291 个推理 token、约 0.99 倍速度，基本免费。
//     · 而对话恰恰是推理**值得开**的那个界面（翻译不是）。
//     · qwen3.8 也是唯一暴露真实档位的（allowed_options 有 low/medium/xhigh，另两个只有开关）。
//
// 这两条是**推荐值**，不是限制：两个选择器都保持自由，界面上只给一颗「用推荐值」按钮。
// 刻意不在代码里静默地把它们当成硬默认 —— 用户机器上可能压根没加载这两个模型，
// 那时候一个指向不存在模型的「默认」比没有默认更糟。
const SURFACE_RECOMMENDED = {
    translate: { provider: 'local', model: 'qwen/qwen3.6-35b-a3b', reasoning: 'off',
                 why: '端到端快 2.05 倍、盲评 6:1 胜出、实体名音译率 4.5% vs 19.3%；推理在翻译上实测无质量收益却要 5.8 倍 token，所以推理推荐「关」。' },
    chat:      { provider: 'local', model: 'qwen/qwen3.8-27b', reasoning: 'off',
                 why: '开推理只花约 291 个推理 token、约 0.99 倍速度（qwen3.6 同样开推理要慢 6–10 倍、92% 的生成 token 都在推理）；而且它是唯一有真实档位的模型。推理仍默认「关」，要用时一键就能开。' }
};

// 对话界面的「新对话起点」。**和 ChatState 是两份东西**：
//   · 这一份（设置里那一行）= 开**新**对话时采用什么；
//   · ChatState.provider/model/reasoningByModel/showThinking = **当前这段**对话正在用什么。
// 参数条上的修改只改后者，永远不回写这一份 —— 否则「临时换个模型问一句」会把默认也改掉。
const CHAT_DEFAULTS_LS_KEY = 'chatSurfaceDefaults';
const ChatDefaults = {
    provider: '',                   // '' = 用户没设过默认，开新对话时不动参数条
    model: '',
    reasoningByModel: {},           // 键 = 模型 id，值 = UI 词表。和 ChatState 那份一样按模型存
    showThinking: true,
    autoApprove: false              // 新对话的起点，同 ChatState.autoApprove 那条注释
};

function chatDefaultsSave() {
    try {
        localStorage.setItem(CHAT_DEFAULTS_LS_KEY, JSON.stringify({
            provider: ChatDefaults.provider,
            model: ChatDefaults.model,
            reasoningByModel: ChatDefaults.reasoningByModel,
            showThinking: !!ChatDefaults.showThinking,
            autoApprove: !!ChatDefaults.autoApprove
        }));
    } catch (e) {}
}

// 逐键校验，脏值一律**不收**（不是回落成别的值）—— 和 chatParamsLoad 同一条纪律。
function chatDefaultsLoad() {
    try {
        const raw = localStorage.getItem(CHAT_DEFAULTS_LS_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object' || Array.isArray(p)) return;
        const prov = String(p.provider || '');
        const mid = sanitizeModelId(p.model);
        if (mid && (prov === 'local' || MODEL_PROVIDERS.indexOf(prov) !== -1)) {
            ChatDefaults.provider = prov;
            ChatDefaults.model = mid;
        }
        if (p.reasoningByModel && typeof p.reasoningByModel === 'object' && !Array.isArray(p.reasoningByModel)) {
            const clean = {};
            Object.keys(p.reasoningByModel).forEach(function (k) {
                const id = sanitizeModelId(k);
                const v = p.reasoningByModel[k];
                if (id && typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v)) clean[id] = v;
            });
            ChatDefaults.reasoningByModel = clean;
        }
        if (typeof p.showThinking === 'boolean') ChatDefaults.showThinking = p.showThinking;
        if (typeof p.autoApprove === 'boolean') ChatDefaults.autoApprove = p.autoApprove;
    } catch (e) {}
}

// 设置里那一行给某个模型定的推理档位（**新对话的起点**，不是当前对话的值）。
function chatDefaultReasoningRaw(model) {
    try {
        const box = ChatDefaults.reasoningByModel;
        const v = (box && typeof box === 'object') ? box[String(model)] : null;
        return (typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v))
            ? v : XPORT_REASONING_DEFAULT;
    } catch (e) { return XPORT_REASONING_DEFAULT; }
}

// 设置里那一行现在指着哪个模型。没设过就跟着当前对话的选择走（这样界面上不会出现空选择器）。
function chatDefaultChoice() {
    try {
        const p = String(ChatDefaults.provider || '');
        const m = sanitizeModelId(ChatDefaults.model);
        if (m && (p === 'local' || MODEL_PROVIDERS.indexOf(p) !== -1)) return { provider: p, model: m, set: true };
    } catch (e) {}
    const c = chatModelChoice();
    return { provider: c.provider, model: c.model, set: false };
}

// —— 开新对话时采用设置里的默认 ——
// 【只在这里发生，绝不在别处】被三个地方调用：清理、切到一份没有旧对话的文档、页面启动。
// 「页面启动也算新对话」是有意的：ChatState.messages 不跨刷新保存，刷新之后本来就是一段新对话。
// 用户没设过默认（provider 为空）时整个函数是空操作 —— 那样参数条上原来钉住的模型照旧生效，
// 老用户的行为逐字不变。
function chatAdoptDefaults() {
    try {
        if (typeof ChatDefaults.showThinking === 'boolean') ChatState.showThinking = ChatDefaults.showThinking;
        if (typeof ChatDefaults.autoApprove === 'boolean') ChatState.autoApprove = ChatDefaults.autoApprove;
        const d = String(ChatDefaults.provider || '');
        const m = sanitizeModelId(ChatDefaults.model);
        if (!m || (d !== 'local' && MODEL_PROVIDERS.indexOf(d) === -1)) { chatParamsSave(); return false; }
        ChatState.provider = d;
        ChatState.model = m;
        // 档位也一并采用，但**只采用这一个模型的那一格** —— 绝不整份覆盖 ChatState.reasoningByModel，
        // 用户在别的模型上手调过的值没有理由因为「开了一段新对话」而消失。
        if (!ChatState.reasoningByModel || typeof ChatState.reasoningByModel !== 'object') ChatState.reasoningByModel = {};
        ChatState.reasoningByModel[m] = chatDefaultReasoningRaw(m);
        chatParamsSave();
        return true;
    } catch (e) { return false; }
}

// —— 模型选择：**独立于翻译** ——
// ChatState.provider/model 为空 = 用户从没在这条参数条上选过，此时回落到当前翻译模型
//（这就是「首次打开默认跟翻译一样」）。一旦选过，翻译那边换成什么都不再跟随，
// 而且这里**永远不写** AppState.apiProvider / AppState.selectedModel。
function chatModelChoice() {
    try {
        const p = String(ChatState.provider || '');
        const m = sanitizeModelId(ChatState.model);
        if (m && (p === 'local' || MODEL_PROVIDERS.indexOf(p) !== -1)) return { provider: p, model: m, pinned: true };
    } catch (e) {}
    return { provider: AppState.apiProvider, model: AppState.selectedModel, pinned: false };
}

// 对话专用的 API 配置。和 getApiConfig() 逐字段同形，只有 provider/model 换成对话自己的，
// 好让 chatCallGemini / callOpenAIAPI / callClaudeAPI 的调用点一个字都不用改形状。
function chatApiConfig() {
    const c = chatModelChoice();
    return {
        provider: c.provider,
        model: c.model,
        localBaseUrl: AppState.localBaseUrl,
        geminiApiKey: AppState.geminiApiKey,
        openaiApiKey: AppState.openaiApiKey,
        claudeApiKey: AppState.claudeApiKey,
        claudeProxyUrl: AppState.claudeProxyUrl
    };
}

function chatModelLabel(provider, id) {
    try {
        if (provider === 'local') return String(id);
        const meta = getModelMeta(id);
        return (meta && meta.name) ? meta.name : String(id);
    } catch (e) { return String(id); }
}

// 下拉里的分组。在线三家复用 getVisibleModels（尊重用户在设置里的模型可见性勾选），
// 本地直接用 AppState.localModels。最后把「当前选中的那个」钉住 —— 它绝不能从下拉里消失，
// 否则用户选过一个模型之后就再也切不回来（照抄 getModelCatalog 的钉住纪律）。
function chatModelGroups() {
    const groups = [];
    try {
        // /v1/models（fetchLocalModels 用的那个）只给 id，分不出 embedding；
        // /api/v1/models 给了 type，所以这里**只在确实知道它是 embedding 时**才剔除。
        // 不知道就留着 —— 猜错方向的代价是「用户看不到自己装的模型」，比多一条不能聊的更糟。
        const cur0 = chatModelChoice();
        const locals = (Array.isArray(AppState.localModels) ? AppState.localModels : []).filter(function (lm) {
            const id = String(lm.id);
            // chatSetModel 会用 sanitizeModelId 把非法 id 拒掉，那么下拉里就不该出现它 ——
            // 一个点了没反应的选项也是装饰性控件。
            if (!sanitizeModelId(id)) return false;
            if (id === cur0.model) return true;              // 当前选中的永不消失
            try {
                const c = xportCapsPeek(AppState.localBaseUrl, id);
                return !(c && /embed/i.test(String(c.type || '')));
            } catch (e) { return true; }
        });
        if (locals.length) {
            groups.push({
                label: '本地 LM Studio',
                items: locals.map(function (lm) { return { provider: 'local', id: String(lm.id) }; })
            });
        }
        MODEL_PROVIDERS.forEach(function (prov) {
            let list = [];
            try { list = getVisibleModels(prov) || []; } catch (e) { list = []; }
            if (!list.length) return;
            groups.push({
                label: MODEL_PROVIDER_LABEL[prov] || prov,
                items: list.map(function (m) { return { provider: prov, id: String(m.id) }; })
            });
        });
    } catch (e) {}
    const cur = chatModelChoice();
    let found = false;
    groups.forEach(function (g) {
        g.items.forEach(function (it) { if (it.provider === cur.provider && it.id === cur.model) found = true; });
    });
    if (!found && cur.model) {
        groups.unshift({ label: '当前选择（不在列表里，仍可用）', items: [{ provider: cur.provider, id: cur.model }] });
    }
    return groups;
}

// —— 对话自己的推理档位 ——
// 存在 ChatState.reasoningByModel，**不是** AppState.reasoningByModel。
// 「这个模型支持哪些档位」的夹取器是共用的（xportClampReasoning），所以对话这条路
// 不可能给出一个模型其实不支持的档位。
function chatReasoningRaw(model) {
    try {
        const box = ChatState.reasoningByModel;
        const v = (box && typeof box === 'object') ? box[String(model)] : null;
        return (typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v))
            ? v : XPORT_REASONING_DEFAULT;
    } catch (e) { return XPORT_REASONING_DEFAULT; }
}

function chatReasoningValue(model) {
    return xportClampReasoning(AppState.localBaseUrl, model, chatReasoningRaw(model));
}

function chatWireEffort(model) {
    try { return XPORT_EFFORT_WIRE[chatReasoningValue(model)] || 'none'; } catch (e) { return 'none'; }
}

// —— 每次请求真正会用的数值 ——
// 「新 OpenAI 模型只接受 temperature=1」是既有事实（isNewOpenAIModel），所以那些模型上
// 这个参数**根本设不了**：返回 null ⇒ 不发送、且参数条上不画这个控件。两处必须同源。
function chatTemperatureSettable(provider, model) {
    if (provider === 'openai') { try { return !isNewOpenAIModel(model); } catch (e) { return false; } }
    return provider === 'local' || provider === 'gemini' || provider === 'claude';
}

function chatEffectiveTemperature(provider, model) {
    if (!chatTemperatureSettable(provider, model)) return null;
    const v = ChatState.temperature;
    return (typeof v === 'number' && CHAT_TEMPS.indexOf(v) !== -1) ? v : CHAT_TEMP_DEFAULT;
}

// 「默认」= 这条链路本来就在用的值，改这个功能之前是多少，这里就是多少（本地 16384，
// 在线 CHAT_MAX_TOKENS）。这样「没动过参数条」的用户逐字保持原行为。
function chatDefaultMaxTokens(provider) {
    return provider === 'local' ? 16384 : CHAT_MAX_TOKENS;
}

function chatEffectiveMaxTokens(provider) {
    const v = ChatState.maxTokens;
    return (typeof v === 'number' && CHAT_MAXTOK_CHOICES.indexOf(v) !== -1) ? v : chatDefaultMaxTokens(provider);
}

// —— 设值。一律：改状态 → 落盘 → 只重画这条参数条。**永远不 setState**。——
function chatSetModel(value) {
    try {
        const s = String(value == null ? '' : value);
        const i = s.indexOf(':');
        if (i <= 0) return;
        const prov = s.slice(0, i);
        const id = sanitizeModelId(s.slice(i + 1));
        if (!id || (prov !== 'local' && MODEL_PROVIDERS.indexOf(prov) === -1)) return;
        ChatState.provider = prov;
        ChatState.model = id;
        chatParamsSave();
        // 本地模型的能力表可能还没拉过（比如用户一上来就在参数条里换了个模型）：
        // 发一次（60 秒内不会重复请求），回来后 xportCapsPaint + 这里再画一次。
        if (prov === 'local') chatCapsWarmForBar();
        chatRenderParamBar();
        // 换模型 = 换加载期上下文 = 换分母，而且上一轮的实测残差不再适用于新模型的 chat template。
        chatUpdateBar();
        chatAppendRow('system', '对话模型已切到「' + chatModelLabel(prov, id) + '」。'
            + '这只影响对话窗，翻译仍然用顶栏那个模型。');
    } catch (e) { console.error('[chat] setModel failed', e); }
}

function chatSetReasoning(uiValue) {
    try {
        const c = chatModelChoice();
        const v = (typeof uiValue === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, uiValue))
            ? uiValue : XPORT_REASONING_DEFAULT;
        if (!ChatState.reasoningByModel || typeof ChatState.reasoningByModel !== 'object') ChatState.reasoningByModel = {};
        ChatState.reasoningByModel[c.model] = v;
        chatParamsSave();
        chatRenderParamBar();
    } catch (e) { console.error('[chat] setReasoning failed', e); }
}

// 二值/多档模型共用的「开」：多档模型开到 medium（它一定在 allowed 里，否则 xportReasoningControl
// 不会把它列出来；不在就退到第一个可用档），二值模型开就是 'on'。
function chatReasoningTurnOn() {
    try {
        const c = chatModelChoice();
        const caps = xportCapsPeek(AppState.localBaseUrl, c.model);
        const ctl = xportReasoningControl(caps && caps.reasoning ? caps.reasoning.allowed : null);
        if (ctl.kind === 'select') {
            chatSetReasoning(ctl.levels.indexOf('medium') !== -1 ? 'medium' : ctl.levels[0]);
        } else {
            chatSetReasoning('on');
        }
    } catch (e) { chatSetReasoning('on'); }
}

function chatSetGeminiThinking(v) {
    try {
        ChatState.geminiThinking = chatGeminiOption(v).v;
        chatParamsSave();
        chatRenderParamBar();
    } catch (e) {}
}

function chatSetTemperature(v) {
    try {
        const n = Number(v);
        ChatState.temperature = (CHAT_TEMPS.indexOf(n) !== -1) ? n : CHAT_TEMP_DEFAULT;
        chatParamsSave();
        chatRenderParamBar();
    } catch (e) {}
}

function chatSetMaxTokens(v) {
    try {
        const n = Number(v);
        ChatState.maxTokens = (CHAT_MAXTOK_CHOICES.indexOf(n) !== -1) ? n : 0;   // 0 = 用各家默认
        chatParamsSave();
        chatRenderParamBar();
        // 生成上限就是用量环那个「为回复预留」的额度 —— 改了它，分母当场跟着变。
        chatUpdateBar();
    } catch (e) {}
}

function chatSetStream(on) {
    try { ChatState.stream = !!on; chatParamsSave(); chatRenderParamBar(); } catch (e) {}
}

function chatSetKeepReasoning(on) {
    try { ChatState.keepReasoning = !!on; chatParamsSave(); chatRenderParamBar(); chatUpdateBar(); } catch (e) {}
}

// 「显示思考过程」，**当前这段对话**的值。刻意不回写 ChatDefaults ——
// 「临时看一眼思考」不该顺手改掉以后每一段新对话的默认。
// 已经画出来的历史消息不重画（那要重跑一遍 marked/提案卡渲染，得不偿失），
// 所以明说一句「从下一条回复开始生效」，而不是让用户以为开关坏了。
function chatSetShowThinking(on) {
    try {
        const before = !!ChatState.showThinking;
        ChatState.showThinking = !!on;
        chatParamsSave();
        chatRenderParamBar();
        if (before !== !!on) {
            chatAppendRow('system', on
                ? '已打开「显示思考过程」：从下一条回复开始，模型的推理会出现在答案**上方**一块默认折叠的区域里。'
                  + '它永远只是显示 —— 不会被当成答案、不会被「复制答案」带走、也不会被应用进文档。'
                : '已关闭「显示思考过程」：从下一条回复开始不再画那块折叠区。'
                  + '这**只影响显示** —— 推理档位没动，模型该推理还是推理，token 照花；'
                  + '要真的不花那份 token，请把上面的「思考」设为「关」。');
        }
    } catch (e) { console.error('[chat] setShowThinking failed', e); }
}

function chatToggleParams() {
    try { ChatState.paramsOpen = !ChatState.paramsOpen; chatParamsSave(); chatRenderParamBar(); } catch (e) {}
}

// 能力发现是异步的。回来之后**只**重画参数条（和设置弹窗那边的 xportCapsPaint 同一条纪律：
// 定点重绘，绝不 renderApp —— 那会把用户没保存的 API Key 输入框冲掉）。
function chatCapsWarmForBar() {
    try {
        xportFetchCaps(AppState.localBaseUrl).then(function () {
            try { xportCapsPaint(); } catch (e) {}
            chatRenderParamBar();
            // C6：用量环的分母也靠这份发现。回来了就重画一次环 —— 在那之前它显示的是
            // 「没有可发现的上下文长度」，而不是一个写死的 65536。
            try { chatUpdateBar(); } catch (e) {}
        }, function () {});
        // 第二个来源：/api/v0/models 的 loaded_context_length。/api/v1 那份缺条目时靠它兜底。
        const c = chatModelChoice();
        if (c.provider === 'local') {
            xportLocalContext(AppState.localBaseUrl, c.model).then(function () {
                try { chatUpdateBar(); } catch (e) {}
            }, function () {});
        }
    } catch (e) {}
}

// —— 渲染 ——
// 纯字符串拼接 + escapeAttr/escapeHtml，画完再按 id 绑监听（每次重画都是新节点，
// 旧监听随节点一起被回收）。整个函数带 try/catch 且不抛：它虽然在 renderApp 之外，
// 但抛出去会让参数条永久停在上一帧。
function chatSegHtml(idOff, idOn, labOff, labOn, on) {
    return '<span class="aichat-seg">'
        + '<button type="button" id="' + idOff + '" class="' + (on ? '' : 'is-on') + '">' + labOff + '</button>'
        + '<button type="button" id="' + idOn + '" class="' + (on ? 'is-on' : '') + '">' + labOn + '</button>'
        + '</span>';
}

function chatReasoningBarHtml(choice) {
    // —— Gemini：另一套合约，给它自己的档位表 ——
    if (choice.provider === 'gemini') {
        const cur = chatGeminiOption(ChatState.geminiThinking);
        const tip = '思考预算（thinkingConfig.thinkingBudget）。实测合法值只有 {0=关, -1=动态} ∪ [512, 24576]，'
            + '1–511 一律 400，所以这里只给「关 / 动态 / 最大(24576)」三档。'
            + '「默认」= 不发送 thinkingConfig，让模型用自己的默认（gemini-2.5-flash-lite 实测是关）—— '
            + '这一点和本地相反：本地省略 reasoning_effort 等于关闭推理，所以那边必须永远显式发。'
            + '选了非「关」的档时会同时带上 includeThoughts:true，否则思考内容根本不回传，「思考」折叠区会永远是空的。'
            + '以上数字实测自 gemini-2.5-flash-lite；换别的 Gemini 模型时若被拒，错误会原样显示在对话里。';
        const opts = CHAT_GEMINI_THINKING.map(function (o) {
            return '<option value="' + escapeAttr(o.v) + '"' + (o.v === cur.v ? ' selected' : '') + '>'
                + escapeHtml(o.label) + '</option>';
        }).join('');
        return '<span class="aichat-pgroup" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top">'
            + '<span class="aichat-plabel">思考</span>'
            + '<select class="aichat-psel" id="aiChatGemSel" style="max-width:82px">' + opts + '</select></span>';
    }

    // —— OpenAI / Claude：没有任何已接线的推理发现 ⇒ 一个控件都不画 ——
    // 画一个灰的、或者画一个「看起来能设其实不发」的，都是撒谎。解释放进 ⋮ 里。
    if (choice.provider !== 'local') return '';

    const caps = xportCapsPeek(AppState.localBaseUrl, choice.model);
    if (caps === undefined) {
        return '<span class="aichat-plabel" data-tip="'
            + escapeAttr('正在读取 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models，拿到这个模型支持哪些推理档位之后才画控件。')
            + '" data-tip-pos="top">推理 读取中…</span>';
    }
    if (!caps) {
        const ok = xportCapsOk(AppState.localBaseUrl);
        const tip = (ok === false)
            ? '读不到 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models（LM Studio 没在跑，或版本过旧没有这个端点）。'
              + '没有能力信息就不画控件 —— 宁可不显示，也不显示一个可能是假的开关。'
            : '模型未加载：LM Studio 的模型列表里没有这一项，拿不到它支持哪些推理档位。在 LM Studio 里加载该模型后重开本页即可。';
        return '<span class="aichat-plabel" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top">'
            + (ok === false ? '推理 不可用' : '推理 模型未加载') + '</span>';
    }
    const ctl = xportReasoningControl(caps.reasoning ? caps.reasoning.allowed : null);
    if (ctl.kind === 'none') {
        return '<span class="aichat-plabel" data-tip="'
            + escapeAttr('该模型没有声明任何推理档位（capabilities.reasoning 缺失或为空），因此不提供推理开关。')
            + '" data-tip-pos="top">无推理档位</span>';
    }

    let latched = false;
    try { latched = xportEffortUnsupported.has(xportCapsOrigin(AppState.localBaseUrl)); } catch (e) { latched = false; }
    const cur = chatReasoningValue(choice.model);
    const on = cur !== 'off';
    const wire = chatWireEffort(choice.model);
    const tip = '思考 / 推理（reasoning_effort）。这一档只管对话窗，翻译用的是「设置 → 模型」里那一份，两者互不影响。'
        + '这个模型声明支持的档位是 [' + (caps.reasoning ? caps.reasoning.allowed.join(', ') : '') + ']；'
        + '元数据里的默认值「' + (caps.reasoning && caps.reasoning.uiDefault ? caps.reasoning.uiDefault : '未知')
        + '」是 LM Studio 的「界面」默认值，不是 API 默认值 —— 实测不显式发送时 API 一律不推理，'
        + '所以选「关」时发的是 reasoning_effort:"none"，而不是靠省略。本次会发出去的是 "' + wire + '"。'
        + (latched ? '（本地址已经用 400 明确拒绝过 reasoning_effort，这个字段现在不再发送，所以只能停在「关」。）' : '');

    let html = '<span class="aichat-pgroup" data-tip="' + escapeAttr(tip) + '" data-tip-pos="top">'
        + '<span class="aichat-plabel">思考</span>'
        + chatSegHtml('aiChatThinkOff', 'aiChatThinkOn', XPORT_EFFORT_LABEL.off, XPORT_EFFORT_LABEL.on, on)
        + '</span>';

    // 有真实档位的模型（实测只有 qwen3.8）才多一个强度下拉，而且只在「开」的时候出现 ——
    // 关着的时候显示一个强度值等于暗示它在起作用。
    if (ctl.kind === 'select' && on) {
        const opts = ctl.levels.map(function (v) {
            return '<option value="' + escapeAttr(v) + '"' + (v === cur ? ' selected' : '') + '>'
                + escapeHtml(XPORT_EFFORT_LABEL[v] || v) + '</option>';
        }).join('');
        // 【这段文案改过两次，别再写回带具体数字的版本】曾经写着「实测 qwen3.8：low=56、
        // medium=56、xhigh=61 个推理 token —— 单调但幅度很小」，那是**假的**：那组数字来自
        // 某一次实验的某一个提问，换个提问一个都对不上。五组 low/medium/xhigh 实测
        // （全部走本函数所在的这条链路，reasoning_effort 逐字发出去，stream 关）：
        //   56/56/61 · 84/84/140 · 376/456/613 · 27/30/43 · 107/107/244
        // 能站住的只有两条：xhigh 五次全都高于 low（高出 9%~128%，所以"幅度很小"是假的）；
        // low 和 medium 有三次给出一模一样的数字。绝对值是**跟着提问走**的，把它当成模型属性
        // 写进界面就是撒谎 —— 这正是 XPORT_PARAM_SPECS 上方那条注释已经禁止过的事。
        const ltip = '推理强度。只有这个模型支持真实档位（' + ctl.levels.join(' / ') + '）：'
            + '这三档会原样出现在请求的 reasoning_effort 里，而且确实会改变模型的思考量。'
            + '但具体多花多少推理 token 完全取决于你问什么 —— 实测同一档在不同问题上从几十到几百都有，'
            + '所以这里只给档位、不给数字。五组实测里 xhigh 每一次都高于 low（高出 9%~128% 不等），'
            + 'low 和 medium 则有三组给出一模一样的推理量。'
            + '二值模型（3.6 / 1.7b）不会出现这个下拉，因为它们的任何非 none 值都塌缩成「开」。';
        html += '<span class="aichat-pgroup" data-tip="' + escapeAttr(ltip) + '" data-tip-pos="top">'
            + '<select class="aichat-psel" id="aiChatLevelSel" style="max-width:74px">' + opts + '</select></span>';
    }
    return html;
}

function chatMoreBoxHtml(choice) {
    const rows = [];

    // —— 温度 ——
    if (chatTemperatureSettable(choice.provider, choice.model)) {
        const t = chatEffectiveTemperature(choice.provider, choice.model);
        const opts = CHAT_TEMPS.map(function (v) {
            return '<option value="' + escapeAttr(String(v)) + '"' + (v === t ? ' selected' : '') + '>' + escapeHtml(String(v)) + '</option>';
        }).join('');
        rows.push('<span class="aichat-pgroup" data-tip="'
            + escapeAttr('采样温度，按请求生效。这里给的是有限几档而不是自由输入 —— 参数条上的每个选项都要能被真机逐个跑过一遍才敢发布。')
            + '" data-tip-pos="top-start"><span class="aichat-plabel">温度</span>'
            + '<select class="aichat-psel" id="aiChatTempSel" style="max-width:64px">' + opts + '</select></span>');
    }

    // —— 最大生成 token ——
    const mt = chatEffectiveMaxTokens(choice.provider);
    const auto = !(typeof ChatState.maxTokens === 'number' && CHAT_MAXTOK_CHOICES.indexOf(ChatState.maxTokens) !== -1);
    const mtOpts = ['<option value="0"' + (auto ? ' selected' : '') + '>默认 (' + escapeHtml(String(chatDefaultMaxTokens(choice.provider))) + ')</option>']
        .concat(CHAT_MAXTOK_CHOICES.map(function (v) {
            return '<option value="' + escapeAttr(String(v)) + '"' + ((!auto && v === mt) ? ' selected' : '') + '>' + escapeHtml(String(v)) + '</option>';
        })).join('');
    rows.push('<span class="aichat-pgroup" data-tip="'
        + escapeAttr('这一轮最多生成多少 token，按请求生效。「默认」= 改这个功能之前这条链路本来就在用的值（本地 16384、在线 '
            + CHAT_MAX_TOKENS + '），所以没动过这一项的用户行为逐字不变。回复被它截断时窗口里会出现一条明确的提示，'
            + '而且半截的 ==EDIT== 块永远不会长出「应用」按钮。')
        + '" data-tip-pos="top-start"><span class="aichat-plabel">上限</span>'
        + '<select class="aichat-psel" id="aiChatMaxSel" style="max-width:96px">' + mtOpts + '</select></span>');

    // —— 流式（只有本地实测过）——
    if (choice.provider === 'local') {
        rows.push('<span class="aichat-pgroup" data-tip="'
            + escapeAttr('边生成边显示。实测本地 SSE 里 delta.reasoning_content 和 delta.content 是「两个独立字段」、'
                + '不会交错，所以思考区和答案气泡各自流各自的，不需要任何猜测式解析。'
                + '不管流不流，==EDIT== 都只在收全之后才解析一次：半截的修改块绝不会长出「应用」按钮。'
                + 'Gemini / Claude 代理的 SSE 没有人实测过，所以那两家不提供这个开关。')
            + '" data-tip-pos="top-start"><span class="aichat-plabel">流式</span>'
            + chatSegHtml('aiChatStreamOff', 'aiChatStreamOn', '关', '开', !!ChatState.stream) + '</span>');
    }

    // —— 显示思考过程（**当前这段对话**的覆盖值）——
    // 设置里那一行是「新对话的起点」，这一颗是「当前这段对话」。两者刻意不互相回写。
    rows.push('<span class="aichat-pgroup" data-tip="'
        + escapeAttr('要不要展示模型的思考过程。**纯显示**开关：不改请求、不改推理档位，'
            + 'reasoning_content 的去向也一个字节都不变 —— 它永远只进那块折叠区，'
            + '永远不是答案、不会被「复制答案」带走、也永远不会被当成修改写进文档。'
            + '推理本身关着时这块区域根本不出现（不画空盒子）。'
            + '这里改的只是**当前这段对话**；新对话的默认值在「设置 → 模型 → 默认模型」的对话那一行，'
            + '在这里改不会回写到那边。')
        + '" data-tip-pos="top-start"><span class="aichat-plabel">显示思考</span>'
        + chatSegHtml('aiChatShowThinkOff', 'aiChatShowThinkOn', '关', '开', !!ChatState.showThinking) + '</span>');

    // —— 客户端的「保留思考」 ——
    rows.push('<span class="aichat-pgroup" data-tip="'
        + escapeAttr('把上一轮的思考内容一起回传给模型。这是我们客户端的行为，不是模型参数 —— '
            + 'LM Studio 的 preserve_thinking 只存在于磁盘上的 model.yaml，作为请求参数被静默忽略'
            + '（四组多轮对照的 prompt_tokens 全部相同），/api/v1/models 里也完全没有它，'
            + '所以这里绝不会假装那是一个能设的模型参数。开着会明显增加每轮的输入 token。默认关。')
        + '" data-tip-pos="top-start"><span class="aichat-plabel">回传思考</span>'
        + chatSegHtml('aiChatKeepOff', 'aiChatKeepOn', '关', '开', !!ChatState.keepReasoning) + '</span>');

    let html = '<div class="aichat-pmorebox"><div class="aichat-prow">' + rows.join('') + '</div>';

    // —— 分割线以下：只读 ——
    html += '<div class="aichat-pdiv">只读 · 来自模型发现</div>';
    if (choice.provider === 'local') {
        const caps = xportCapsPeek(AppState.localBaseUrl, choice.model);
        if (caps === undefined) {
            html += '<div class="aichat-pnote">正在读取模型能力…</div>';
        } else if (!caps) {
            html += '<div class="aichat-pnote">'
                + escapeHtml(xportCapsOk(AppState.localBaseUrl) === false
                    ? '读不到 ' + xportCapsOrigin(AppState.localBaseUrl) + '/api/v1/models，所以这里什么都不显示 —— 不猜。'
                    : '这个 id 不在 LM Studio 的模型列表里（多半没加载），拿不到它的任何能力信息。')
                + '</div>';
        } else {
            const chips = xportCapsChipList(caps).map(function (c) {
                return '<span data-tip="' + escapeAttr(c.tip) + '" data-tip-pos="' + escapeAttr(c.pos) + '">' + escapeHtml(c.text) + '</span>';
            });
            if (chips.length) html += '<div class="aichat-pchips">' + chips.join('<span class="aichat-pdot">·</span>') + '</div>';
            html += '<div class="aichat-pnote">'
                + escapeHtml('上下文是「加载期」参数：实测发 context_length / num_ctx / n_ctx 会返回 200 但实际值纹丝不动，所以这里只读，不给任何滑块。')
                + '</div>';
        }
    } else {
        html += '<div class="aichat-pnote">'
            + escapeHtml('只有本地 LM Studio 有 /api/v1/models 这种逐模型能力端点。'
                + (choice.provider === 'gemini'
                    ? 'Gemini 这边只把实测过的 thinkingBudget 接了出来，其余一律不猜、不画。'
                    : '这一家没有任何已接线的推理发现，所以上面不画推理控件 —— 画一个灰的或者画一个「看着能设其实不发」的，都是撒谎。'))
            + '</div>';
    }
    return html + '</div>';
}

function chatParamBarHtml() {
    const choice = chatModelChoice();
    const groups = chatModelGroups();
    const optHtml = groups.map(function (g) {
        return '<optgroup label="' + escapeAttr(g.label) + '">' + g.items.map(function (it) {
            const val = it.provider + ':' + it.id;
            const sel = (it.provider === choice.provider && it.id === choice.model) ? ' selected' : '';
            return '<option value="' + escapeAttr(val) + '"' + sel + '>' + escapeHtml(chatModelLabel(it.provider, it.id)) + '</option>';
        }).join('') + '</optgroup>';
    }).join('');

    const modelTip = '对话用哪个模型。和翻译用的模型是两回事：在这里换模型不会动顶栏那个翻译模型，'
        + '推理档位也各存各的。' + (choice.pinned
            ? '（当前是你在这里选定的，翻译那边换成什么都不会跟着变。）'
            : '（你还没在这里选过，所以暂时跟着翻译模型走；只要选一次，之后就固定下来。）');

    let html = '<div class="aichat-prow">'
        + '<span class="aichat-pgroup" data-tip="' + escapeAttr(modelTip) + '" data-tip-pos="top-start">'
        + '<span class="aichat-plabel">模型</span>'
        + '<select class="aichat-psel" id="aiChatModelSel">' + optHtml + '</select></span>'
        + chatReasoningBarHtml(choice)
        + '<span class="aichat-pspacer"></span>'
        + '<button type="button" class="aichat-pmore' + (ChatState.paramsOpen ? ' is-on' : '') + '" id="aiChatMoreBtn" data-tip="'
        + escapeAttr('展开其余可按请求设置的参数（温度、生成上限、流式、是否回传上一轮思考），'
            + '以及分割线以下「只读」的模型信息。只读那部分是这条参数条最重要的诚实之处：'
            + '上下文长度、preserve_thinking 之类按请求根本设不了，所以它们不会以「可调控件」的样子出现。')
        + '" data-tip-pos="top-end">' + Icons.MoreVertical + '</button>'
        + '</div>';
    if (ChatState.paramsOpen) html += chatMoreBoxHtml(choice);
    return html;
}

function chatRenderParamBar() {
    try {
        const box = document.getElementById('aiChatParams');
        if (!box) return;
        box.innerHTML = chatParamBarHtml();
        chatBindParamBar(box);
    } catch (e) {
        console.error('[chat] param bar render failed', e);
    }
}

function chatBindParamBar(box) {
    const on = function (id, ev, fn) {
        try {
            const el = box.querySelector('#' + id);
            if (el) el.addEventListener(ev, fn);
        } catch (e) {}
    };
    on('aiChatModelSel', 'change', function () { chatSetModel(this.value); });
    on('aiChatThinkOff', 'click', function () { chatSetReasoning('off'); });
    on('aiChatThinkOn', 'click', function () { chatReasoningTurnOn(); });
    on('aiChatLevelSel', 'change', function () { chatSetReasoning(this.value); });
    on('aiChatGemSel', 'change', function () { chatSetGeminiThinking(this.value); });
    on('aiChatMoreBtn', 'click', function () { chatToggleParams(); });
    on('aiChatTempSel', 'change', function () { chatSetTemperature(this.value); });
    on('aiChatMaxSel', 'change', function () { chatSetMaxTokens(this.value); });
    on('aiChatStreamOff', 'click', function () { chatSetStream(false); });
    on('aiChatStreamOn', 'click', function () { chatSetStream(true); });
    on('aiChatKeepOff', 'click', function () { chatSetKeepReasoning(false); });
    on('aiChatKeepOn', 'click', function () { chatSetKeepReasoning(true); });
    on('aiChatShowThinkOff', 'click', function () { chatSetShowThinking(false); });
    on('aiChatShowThinkOn', 'click', function () { chatSetShowThinking(true); });
}

// ============================================================================
// C5 —— 流式（**只**对本地生效）
// ============================================================================
//
// 实测的 SSE 形状（qwen3.6，stream_options:{include_usage:true}）：
//   data: {... "delta":{"role":"assistant","reasoning_content":"Here"} ...}
//   data: {... "delta":{"reasoning_content":"'s"} ...}          ← 思考先流完
