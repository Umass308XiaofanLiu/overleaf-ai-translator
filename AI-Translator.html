<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Academic Translator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

body { font-family: 'Inter', sans-serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }

/* Custom Scrollbar */
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

/* KaTeX Display Math */
.katex-display {
    margin: 0.75em 0;
    padding: 0.75em;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    overflow-x: auto;
    text-align: center;
}

/* Prose code style fix */
.prose :where(code):not(:where([class~="not-prose"], [class~="not-prose"] *))::before,
.prose :where(code):not(:where([class~="not-prose"], [class~="not-prose"] *))::after {
    content: "";
}

/* Settings 弹窗拖拽调宽手柄：常态半透明一条细线，hover/拖拽时高亮 */
.settings-resize-handle {
    background: transparent;
    transition: background-color 0.15s ease;
}
.settings-resize-handle::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 2px;
    width: 2px;
    height: 32px;
    transform: translateY(-50%);
    border-radius: 2px;
    background: #cbd5e1;
}
.settings-resize-handle:hover,
.settings-resize-handle:active {
    background: rgba(99, 102, 241, 0.12);
}
.settings-resize-handle:hover::after,
.settings-resize-handle:active::after {
    background: #6366f1;
}
/* 选词高亮镜像层。
   renderApp() 走 root.innerHTML 全量重建，会把编辑用的 <textarea> 整个换成新节点，
   浏览器原生 Selection 随旧节点一起消失 —— 这就是「弹窗还在、蓝色高亮没了」的根因。
   所以高亮改成状态驱动：在 textarea 背后铺一层同字体/同行高/同宽度的镜像文本，
   只把选中片段包进 <mark> 画背景，文字本身透明。每次渲染都会按 synonymState 重新生成，
   因此全量重渲染、失焦、翻页都不会让它消失。 */
.sel-highlight-layer {
    color: transparent;
    -webkit-text-fill-color: transparent;
}
.sel-highlight-layer mark {
    background-color: rgba(99, 102, 241, 0.25);
    color: transparent;
    -webkit-text-fill-color: transparent;
    border-radius: 2px;
}
/* 语法模式给出「整句改写」时，高亮的是即将被整体替换的那一句（不再只是选中的词），
   所以换一个颜色，让用户在点下去之前就看清楚到底会替换掉多大一片。 */
.sel-highlight-layer mark.sent-scope {
    background-color: rgba(245, 158, 11, 0.28);
    box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.45);
}
/* 跨栏对应高亮：在**另一侧**画出与选中内容意思对应的片段。
   刻意用第三种颜色（青绿），和「本侧选区」（靛蓝）、「整句改写范围」（琥珀）三者一眼可分。
   ⚠️ 这两条规则里只许出现 background-color / box-shadow / border-radius —— 三者都不参与布局。
   一旦加了 padding / margin / border / font-size / line-height，行高就会变，
   syncBilingualAlignment 的「|top(src_i) - top(tgt_i)| <= 1px」不变量当场破功。 */
.sel-highlight-layer mark.cross-hl {
    background-color: rgba(13, 148, 136, 0.26);
    box-shadow: 0 0 0 1px rgba(13, 148, 136, 0.42);
}
/* 非编辑行（已渲染的 marked/KaTeX 正文）上的跨栏高亮。同样只许改背景，不许碰盒模型。 */
.cross-hl-span {
    background-color: rgba(13, 148, 136, 0.26);
    box-shadow: 0 0 0 1px rgba(13, 148, 136, 0.42);
    border-radius: 2px;
}

/* ============= 「额外关注」高亮（第四套）=============
   已经有三套了，颜色分别是：选区靛蓝实底、整句改写范围琥珀实底+实线环、跨栏对应青绿实底+实线环。
   第四套如果只是「再挑一个颜色」，最先撞车的就是琥珀 —— 而这两者的后果天差地别：
   琥珀说的是「点下去这一整片就会被替换掉」，黄色说的是「我请模型多留意这一片，不会动它」。
   所以这里不止换色，还换**结构**：亮黄实底 + **虚线**描边。虚线是这一套独有的，隔着屏幕也分得开。
   ⚠️ 只许出现 background-color / outline / box-shadow / border-radius。
      outline 和 border 的关键区别就是**不占布局**；一旦手滑写成 border 或 padding，
      行高立刻变化，syncBilingualAlignment 的 |top(src_i) − top(tgt_i)| <= 1px 不变量当场破功。 */
.sel-highlight-layer mark.focus-hl {
    background-color: rgba(253, 224, 71, 0.55);
    outline: 1px dashed rgba(161, 98, 7, 0.8);
    border-radius: 2px;
}
.focus-hl-span {
    background-color: rgba(253, 224, 71, 0.55);
    outline: 1px dashed rgba(161, 98, 7, 0.8);
    border-radius: 2px;
}
/* 叠加规则（C1 的答案）：同一批字符同时落进两套系统时，**绝不套两层 mark** ——
   嵌套之后两套的偏移计算和清理逻辑会各自算错，这是这个文件里反复吃过的亏。
   改成：由优先级高的那一套独家出面画底色，再补一条黄色底边表示「这底下还压着一个关注标记」。
   优先级写死在 focusPaintFlat 里：整句改写范围 > 选区 > 跨栏对应 > 额外关注。 */
.sel-highlight-layer mark.also-focus {
    box-shadow: inset 0 -3px 0 0 rgba(202, 138, 4, 0.9);
}
.sel-highlight-layer mark.sent-scope.also-focus {
    box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.45), inset 0 -3px 0 0 rgba(202, 138, 4, 0.9);
}
.sel-highlight-layer mark.cross-hl.also-focus {
    box-shadow: 0 0 0 1px rgba(13, 148, 136, 0.42), inset 0 -3px 0 0 rgba(202, 138, 4, 0.9);
}

/* 关注复选框：句对行上那一颗、以及选词弹窗里那一颗，共用这一套外观。
   ⚠️ 行上那颗是 position:absolute（.focus-row-chip），脱离文档流 —— 和它取代的那颗
   「附到对话」按钮一样，对行高零影响。 */
.focus-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 5px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #e0e7ff;
    color: #a5b4fc;
    cursor: pointer;
    transition: opacity .15s, color .15s, border-color .15s, background-color .15s;
}
.focus-chip input[type="checkbox"] {
    width: 12px;
    height: 12px;
    margin: 0;
    accent-color: #eab308;
    cursor: pointer;
}
.focus-chip .focus-chip-t {
    font-size: 9px;
    font-weight: 700;
    line-height: 1.4;
    user-select: none;
    white-space: nowrap;
}
.focus-chip.is-on {
    border-color: #facc15;
    background: #fefce8;
    color: #a16207;
}
.focus-chip:hover {
    border-color: #c7d2fe;
    color: #6366f1;
}
.focus-chip.is-on:hover {
    border-color: #eab308;
    color: #854d0e;
}
/* ⚠️ 必须是**两个类**的选择器。下面那条 `[data-tip] { position: relative; }` 排在本段之后，
   属性选择器和单个类同权重、后写者胜 —— 只写 `.focus-row-chip { position:absolute }` 会被它盖掉，
   复选框于是掉回文档流，把行撑高。实测过一次：它当场给这一行加了 16px，
   虽然 syncBilingualAlignment 事后能把两栏补齐，但那已经是「高亮改变了行几何」（C6 明令禁止）。
   两个类 (0,2,0) > 属性 (0,1,0)，绝对定位才拿得回来。 */
.focus-chip.focus-row-chip {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 10;
    opacity: 0;
}
.group:hover > .focus-chip.focus-row-chip,
.focus-chip.focus-row-chip:focus-within {
    opacity: 1;
}
.focus-chip.focus-row-chip.is-on {
    opacity: 1;
}

/* 拖拽过程中禁止选中文字，光标全局保持左右拖拽箭头 */
body.is-resizing-settings-modal {
    cursor: ew-resize !important;
    user-select: none !important;
}
body.is-resizing-settings-modal * {
    user-select: none !important;
}

/* ============= 中文悬停提示（纯 CSS，data-tip 驱动）=============
   为什么必须是纯 CSS 而不是 JS 浮层：
   renderApp() 走 root.innerHTML 全量重建，JS 浮层每轮都要重新绑事件、重新定位，
   而渲染路径外面没有 try/catch —— 多一行 JS 就多一次「整页永久冻死」的机会。
   ::after + attr(data-tip) 是随节点走的，重建多少次都自动还在，零状态、零风险。

   与原生 title 的关系：**同一个元素上二选一**。凡是加了 data-tip 的元素，
   它自己的 title 必须删掉，否则悬停 1 秒后系统气泡会叠在自定义气泡上（两个提示）。
   父元素带 data-tip、子元素带 title 同样会双出（:hover 会冒泡到父级），所以
   两者在 DOM 上不允许存在祖先—后代关系。

   延迟 0.3s 才浮出：鼠标划过工具栏时不会一路炸出一串气泡。

   ⚠️ 隐藏态必须是 display:none，**不能**是 visibility:hidden。
   visibility:hidden 的盒子仍然占布局，绝对定位的它照样计进最近那个滚动容器的
   scrollWidth/scrollHeight —— 每一个 data-tip 都在给祖先偷偷加宽。实测（设置弹窗
   「编辑与历史」页，一次渲染就有 70 个 data-tip）：
     · 1440px 视口：settingsScrollArea scrollWidth 769 / clientWidth 763 → 弹窗常驻一条横向滚动条；
     · 415px 视口：页签条 389 / 327，弹窗面板溢出 42px，文档级横向溢出里有 34px 是它们贡献的。
   把 6 / 62 / 42 / 34 一次性清零的唯一根因修法，就是让这些气泡压根不参与布局。
   代价是 display 不能做补间，所以「悬停 0.3s 后才浮出」改用 animation 复刻：
   display:none → block 时 transition 没有起始帧不会跑，animation 会跑，
   而 fill-mode:both 让 0.3s 延迟期间一直停在 opacity:0（= 原来那 0.3s 空窗）。
   唯一的行为差异：移开鼠标时气泡立即消失，不再有 0.12s 淡出。 */
[data-tip] { position: relative; }
[data-tip]::after {
    content: attr(data-tip);
    display: none;
    position: absolute;
    z-index: 2147483000;
    left: 50%;
    bottom: calc(100% + 8px);
    transform: translateX(-50%);
    width: max-content;
    max-width: 240px;
    padding: 6px 9px;
    border-radius: 8px;
    background: #1e293b;
    color: #f8fafc;
    /* 这些按钮很多带 uppercase / tracking-wider / text-[9px]，提示气泡必须自己钉死排版，
       否则会继承成「大写+字距拉开」的一坨，中文尤其难看 */
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: normal;
    text-transform: none;
    text-align: left;
    white-space: normal;
    word-break: break-word;
    box-shadow: 0 8px 20px -6px rgba(15, 23, 42, 0.45);
    pointer-events: none;   /* 气泡自己绝不吃鼠标事件，不会挡住底下的按钮 */
}
[data-tip]:hover::after,
[data-tip]:focus-visible::after {
    display: block;
    animation: data-tip-fade-in 0.12s ease 0.3s both;
}
@keyframes data-tip-fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}
/* 空 data-tip 一律不出气泡（防止某个分支算出空串时浮出一个黑色小方块） */
[data-tip=""]::after { content: none; }

/* 视口/容器边缘的方位修正。默认 top 居中；贴右边缘用 *-end，贴顶用 bottom，
   贴左右两侧的窄按钮用 left/right。设置弹窗的滚动容器是 overflow-y:auto
   （浏览器会把 overflow-x 一起变成 auto），横向溢出会被裁掉，所以弹窗内
   靠右的控件一律 *-end / left。 */
[data-tip][data-tip-pos="bottom"]::after { bottom: auto; top: calc(100% + 8px); }
[data-tip][data-tip-pos="top-end"]::after { left: auto; right: 0; transform: none; }
[data-tip][data-tip-pos="bottom-end"]::after { bottom: auto; top: calc(100% + 8px); left: auto; right: 0; transform: none; }
[data-tip][data-tip-pos="top-start"]::after { left: 0; transform: none; }
[data-tip][data-tip-pos="bottom-start"]::after { bottom: auto; top: calc(100% + 8px); left: 0; transform: none; }
[data-tip][data-tip-pos="left"]::after {
    left: auto; right: calc(100% + 8px); bottom: auto; top: 50%; transform: translateY(-50%);
}
[data-tip][data-tip-pos="right"]::after {
    left: calc(100% + 8px); bottom: auto; top: 50%; transform: translateY(-50%);
}

/* ============= Settings 分页 =============
   四个页签的内容**全部**渲染进 DOM，切页只切 class（setSettingsTab 直接改 DOM，
   不走 setState/renderApp）。这么做有两个硬理由：
     1) 切页不重渲染 = 输到一半还没点保存的 API Key 不会被 AppState 的旧值覆盖回去；
     2) 切页不重渲染 = 切页这条路径上一行渲染代码都不跑，不可能冻页。
   AppState.settingsTab + localStorage 只负责「下次整体重渲染/重开弹窗时落在哪一页」。 */
.settings-panel { display: none; }
.settings-panel.is-active { display: block; }
.settings-tab-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 10px 10px 0 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #64748b;
    background: transparent;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.settings-tab-btn:hover { color: #4f46e5; background: #eef2ff; }
.settings-tab-btn.is-active {
    color: #4f46e5;
    background: #ffffff;
    border-bottom-color: #4f46e5;
}

/* ============= 句对行距（TASK 3）=============
   ⚠️ 左右两栏共用同一个 --pair-gap，物理上不可能只改一边。
   只改一边 = syncBilingualAlignment 补的行高还对，但行与行之间的外边距对不上，
   top 差会沿页面向下累加 —— 那正是这个变量必须挂在 :root 而不是各栏自己身上的原因。
   行本身的 mb-2 / my-4 已经从 renderPairRow 里删掉，space-y-2 也已从两个内容盒删掉，
   所以行距只有这一个来源，滑块能一路调到 0。 */
:root { --pair-gap: 8px; }
[data-align-content] > * + * { margin-top: var(--pair-gap); }
/* 每行都带 Tailwind 的 transition-all（0.15s），它会把 margin-top 一起做补间动画。
   实测后果：拖动行距滑块时行距是「渐变」到位的，而 syncBilingualAlignment 在这 150ms 内
   量到的是中间态高度；更糟的是后台标签页里动画时钟是冻结的，margin 会一直卡在旧值。
   这里把过渡属性收窄回 Tailwind 默认 `transition` 的那一组（颜色/阴影/形变/透明度），
   把 margin 排除在外 —— 行距改动立即生效，hover 高亮、编辑态放大等观感一点没丢。
   属性选择器**故意写两遍**：Tailwind 的 .transition-all 特异度是 (0,1,0)，而它生成的
   样式表是运行时注入的、排在本 <style> 之后，单写一次 [data-align-content] 打平后会输给它
   （实测 transitionProperty 仍是 all）。写两遍把特异度抬到 (0,2,0) 才压得住。 */
[data-align-content][data-align-content] > * {
    transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, -webkit-backdrop-filter, backdrop-filter;
}

/* ============= 浮动 AI 对话窗（#aiChatRoot）=============
   为什么整块样式写死在这里，而不是像页面其它部分那样用 Tailwind 类：
   这个窗口的 DOM 是 JS 直接建到 <body> 上的，不经过 renderApp。Tailwind 是 CDN 版 JIT，
   靠扫描 DOM 按需生成类 —— 把「窗口能不能看见」押在一个异步扫描器上，等于给
   「拖到一半突然掉样式」留了口子。写死在这里，零依赖、零时序。

   z-index 2147482000 的取法（实测的 z 预算）：
     · 页面里最高的应用层是错误横幅 / toast / 同义词弹窗的 z-[100]，原 Insight 抽屉是 z-50；
     · data-tip 气泡是 2147483000。
   取它们中间：对话窗压过所有应用面板，但**低于**提示气泡 —— 悬停提示仍然浮在窗口之上。

   选择器一律带 #aiChatRoot 前缀（特异度 0,1,1,0），这样上面 [data-tip]{position:relative}
   这类等特异度的全局规则不会把手柄的 position:absolute 顶掉，Tailwind 的工具类也压不过来。 */
#aiChatRoot {
    position: fixed;
    z-index: 2147482000;
    display: none;
    /* left / top / width / height 全部由 JS 写内联样式，这里只是一个不挡事的初值 */
    left: 0;
    top: 0;
    width: 420px;
    height: 560px;
}
#aiChatRoot.is-open { display: block; }

#aiChatRoot .aichat-frame {
    position: relative;
    width: 100%;
    height: 100%;
    /* 高度自适应就靠这一组：列向 flex + 消息区 flex:1;min-height:0 —— 内容少时自然收，
       内容多时消息区自己滚，全程零 JS。min-height:0 不能省，否则 flex 子项的
       自动最小尺寸会让消息区把整个框撑破而不是滚动。 */
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 24px 60px -12px rgba(15, 23, 42, 0.35);
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #0f172a;
}

/* ---- 标题栏（= 拖动把手，高度必须和 JS 里的 CHAT_TITLEBAR_H 一致）---- */
#aiChatRoot .aichat-titlebar {
    flex: 0 0 auto;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    /* 右边距 12px（不是 8px）是给右上角那颗 12×12 缩放手柄让位的：最右一颗按钮的右边缘
       必须落在手柄之外，否则「关闭」的右上角会有一小片按不到（点下去变成拖拽缩放）。
       改这个值前先量一遍 .aichat-resize-tr 的尺寸。 */
    padding: 0 12px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    cursor: grab;
    /* 指针事件拖拽必须关掉浏览器自己的手势，否则触控板/触屏会把 pointermove 抢去做滚动 */
    touch-action: none;
    user-select: none;
}
#aiChatRoot .aichat-title-icon { display: inline-flex; color: #6366f1; }
#aiChatRoot .aichat-title-icon svg { width: 15px; height: 15px; }
#aiChatRoot .aichat-title-text {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #334155;
    white-space: nowrap;
}
#aiChatRoot .aichat-title-spacer { flex: 1 1 auto; min-width: 0; }
/* 三颗标题栏按钮自成一组、组内 gap 2px。不这么做的话它们会继承标题栏的 gap:8px，
   在 320px 的最小宽度下白白吃掉 16px，而且三颗按钮看上去像三件不相干的东西。 */
#aiChatRoot .aichat-titlebtns { display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto; }
/* 未读徽标：最小化期间模型回完了才出现。纯 CSS 显隐（JS 只改 hidden 属性和数字），
   不参与任何渲染路径。 */
#aiChatRoot .aichat-unread {
    display: none;
    flex: 0 0 auto;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: #e11d48;
    color: #ffffff;
    font-size: 9px;
    font-weight: 800;
    line-height: 16px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}
#aiChatRoot.is-min .aichat-unread[data-n]:not([data-n="0"]) { display: inline-block; }
#aiChatRoot .aichat-iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease;
}
#aiChatRoot .aichat-iconbtn:hover { color: #0f172a; background: #e2e8f0; }
#aiChatRoot .aichat-iconbtn svg { width: 13px; height: 13px; }

/* ---- 消息区 ---- */
#aiChatRoot .aichat-log {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #ffffff;
}
#aiChatRoot .aichat-row { display: flex; }
#aiChatRoot .aichat-row-user { justify-content: flex-end; }
#aiChatRoot .aichat-bubble {
    max-width: 88%;
    padding: 8px 10px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    background: #f1f5f9;
    color: #334155;
}
#aiChatRoot .aichat-row-user .aichat-bubble { background: #eef2ff; color: #3730a3; }
#aiChatRoot .aichat-row-system .aichat-bubble {
    background: transparent;
    color: #94a3b8;
    font-size: 11px;
    max-width: 100%;
    padding: 4px 2px;
}
#aiChatRoot .aichat-row-error .aichat-bubble {
    background: #fff1f2;
    color: #be123c;
    border: 1px solid #fecdd3;
    max-width: 100%;
}

/* ---- 「正在处理」指示器（C8）----
   在飞请求的**唯一**活体证据：一个纯 CSS 动画（不代表进度，只代表「还活着」）+ 一个每 100ms
   只改 textContent 的计时节点（真实已耗时秒数，唯一说得准的量）。「显示思考过程」关着的时候
   *尤其*需要它——那正是最容易让人以为卡死的状态，所以这东西两种模式下都画，不受那个开关管。 */
#aiChatRoot .aichat-pending { display: inline-flex; align-items: center; gap: 6px; }
#aiChatRoot .aichat-pending-dots { display: inline-flex; align-items: center; gap: 3px; }
#aiChatRoot .aichat-pending-dots i {
    width: 4px; height: 4px; border-radius: 50%; background: #a5b4fc; display: inline-block;
    animation: aichat-pending-blink 1.1s ease-in-out infinite;
}
#aiChatRoot .aichat-pending-dots i:nth-child(2) { animation-delay: 0.15s; }
#aiChatRoot .aichat-pending-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes aichat-pending-blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
}
#aiChatRoot .aichat-pending-label { font-style: italic; color: #818cf8; }
#aiChatRoot .aichat-pending-time { font-variant-numeric: tabular-nums; color: #94a3b8; }
/* 思考期间按已收到的推理文字实时估的 token 数。空文本节点时不留间隙——tokEl 一开始是空的
   （还没收到任何 reasoning delta），加了 gap 会在时间和它之间凭空多出一截空白。 */
#aiChatRoot .aichat-pending-tok { font-variant-numeric: tabular-nums; color: #a5b4fc; }
#aiChatRoot .aichat-pending-tok:empty { display: none; }

/* ---- 输入区 ---- */
#aiChatRoot .aichat-footer {
    flex: 0 0 auto;
    border-top: 1px solid #e2e8f0;
    background: #f8fafc;
    /* 下边距 12px（不是 8px）是给底部那三个缩放手柄让位的：底边手柄 6px、左下/右下角
       手柄 12px，最后一行的按钮（会话 / 清理 / 压缩）必须整个落在手柄之外，
       否则它们的下沿会有一条按不到的带子。改这个值前先量一遍 .aichat-resize-b* 的尺寸。 */
    padding: 8px 8px 12px;
}
#aiChatRoot .aichat-inputrow { display: flex; align-items: flex-end; gap: 8px; }
#aiChatRoot .aichat-input {
    flex: 1 1 auto;
    min-width: 0;
    resize: none;
    overflow-y: auto;
    max-height: 132px;
    padding: 8px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: #0f172a;
}
#aiChatRoot .aichat-input:focus { outline: none; border-color: #a5b4fc; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
#aiChatRoot .aichat-send {
    flex: 0 0 auto;
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    background: #4f46e5;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
#aiChatRoot .aichat-send:hover { background: #4338ca; }
/* 模型 / 思考 / 强度控件之后会填进这一条；空着的时候不占任何高度 */
#aiChatRoot .aichat-bar { margin-top: 6px; }
#aiChatRoot .aichat-bar:empty { display: none; }
/* 发送按钮在请求进行中变成「停止」。只换配色和字，不换节点 —— 换节点会丢监听。 */
#aiChatRoot .aichat-send.is-busy { background: #e11d48; }
#aiChatRoot .aichat-send.is-busy:hover { background: #be123c; }

/* ---- C4：输入框下面那条参数条 ---- */
/* 和窗口其它部分同一条纪律：**不使用 Tailwind 工具类**。这一整块 DOM 由 JS 直接建到
   <body> 下的 #aiChatRoot 里，Tailwind CDN 是运行时扫描 DOM 才生成类的 JIT——
   把「参数条能不能看见」押在一个异步扫描器上，等于给「刚打开时控件糊成一坨」留口子。
   （这也是为什么下面的只读芯片不复用设置弹窗里那段带 Tailwind 类的 HTML，而是共用
     xportCapsChipList() 那份**数据**，各自渲染。） */
#aiChatRoot .aichat-params { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
#aiChatRoot .aichat-params:empty { display: none; }
#aiChatRoot .aichat-prow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
#aiChatRoot .aichat-pspacer { flex: 1 1 auto; min-width: 0; }
#aiChatRoot .aichat-plabel { font-size: 10px; font-weight: 700; color: #64748b; white-space: nowrap; }
#aiChatRoot .aichat-pgroup { display: inline-flex; align-items: center; gap: 4px; }
#aiChatRoot .aichat-psel {
    max-width: 190px;
    padding: 2px 4px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #4f46e5;
    cursor: pointer;
    outline: none;
}
#aiChatRoot .aichat-psel:focus { border-color: #a5b4fc; }
#aiChatRoot .aichat-pnum {
    width: 62px;
    padding: 2px 4px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #0f172a;
    outline: none;
}
#aiChatRoot .aichat-pnum:focus { border-color: #a5b4fc; }
#aiChatRoot .aichat-seg { display: inline-flex; align-items: center; background: #e2e8f0; border-radius: 8px; padding: 2px; }
#aiChatRoot .aichat-seg > button {
    border: none;
    background: transparent;
    padding: 1px 7px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 800;
    color: #64748b;
    cursor: pointer;
}
#aiChatRoot .aichat-seg > button.is-on { background: #ffffff; color: #4f46e5; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12); }
#aiChatRoot .aichat-pmore {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
}
#aiChatRoot .aichat-pmore:hover { color: #0f172a; background: #e2e8f0; }
#aiChatRoot .aichat-pmore.is-on { color: #4f46e5; background: #e0e7ff; }
#aiChatRoot .aichat-pmore svg { width: 13px; height: 13px; }
#aiChatRoot .aichat-pmorebox {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 6px;
    border-top: 1px dashed #e2e8f0;
}
#aiChatRoot .aichat-pdiv { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: #cbd5e1; }
#aiChatRoot .aichat-pchips { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 9px; color: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
#aiChatRoot .aichat-pchips .aichat-pdot { color: #e2e8f0; }
#aiChatRoot .aichat-pnote { font-size: 9px; line-height: 1.55; color: #94a3b8; }

/* ---- C3：附加的选段（输入框上方那条 chip）---- */
#aiChatRoot .aichat-target {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 6px;
    padding: 5px 6px 5px 8px;
    border: 1px solid #ddd6fe;
    border-radius: 8px;
    background: #f5f3ff;
    font-size: 11px;
    line-height: 1.5;
    color: #5b21b6;
}
#aiChatRoot .aichat-target-label { flex: 0 0 auto; font-weight: 800; letter-spacing: 0.03em; }
#aiChatRoot .aichat-target-text {
    flex: 1 1 auto;
    min-width: 0;
    color: #6d28d9;
    /* 选段里可能带换行/超长 LaTeX：一律截成一行，绝不让 chip 把输入框挤下去 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#aiChatRoot .aichat-target-x {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: #a78bfa;
    cursor: pointer;
    padding: 0 2px;
    font-size: 12px;
    line-height: 1.4;
}
#aiChatRoot .aichat-target-x:hover { color: #4c1d95; }
#aiChatRoot .aichat-status { font-size: 10px; color: #94a3b8; padding: 0 2px; }

/* 批量通过条：只在≥2条待处理提案时出现，见 chatRenderBatchBar */
#aiChatRoot .aichat-batchbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    padding: 5px 6px 5px 8px;
    border: 1px solid #fde68a;
    border-radius: 8px;
    background: #fffbeb;
    font-size: 11px;
    line-height: 1.5;
    color: #92400e;
}
#aiChatRoot .aichat-batchbar-label { flex: 1 1 auto; min-width: 0; font-weight: 700; }
#aiChatRoot .aichat-batchbar .aichat-btn { flex: 0 0 auto; padding: 3px 10px; font-size: 11px; }

/* ---- 额外关注清单（输入框上方，附加选段 chip 的上面一条）----
   十分钟前勾的一处重点会一直跟着每一轮问话走。不把它摆在眼前，
   用户就会拿一个自己都忘了的重点去问一个不相干的问题。所以：计数 + 逐条列出 + 一键清空。
   高度封顶 + 自己滚，勾了 40 处也绝不会把输入框挤出窗口。 */
#aiChatRoot .aichat-focus {
    margin-bottom: 6px;
    padding: 5px 6px 5px 8px;
    border: 1px solid #fde68a;
    border-radius: 8px;
    background: #fffbeb;
    font-size: 11px;
    line-height: 1.5;
    color: #92400e;
    max-height: 132px;
    overflow-y: auto;
}
#aiChatRoot .aichat-focus-h { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
#aiChatRoot .aichat-focus-label { font-weight: 800; letter-spacing: 0.03em; flex: 0 0 auto; }
#aiChatRoot .aichat-focus-spacer { flex: 1 1 auto; }
#aiChatRoot .aichat-focus-clear {
    flex: 0 0 auto;
    border: 1px solid #fcd34d;
    background: #fef3c7;
    color: #92400e;
    border-radius: 6px;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 6px;
    cursor: pointer;
}
#aiChatRoot .aichat-focus-clear:hover { background: #fde68a; color: #78350f; }
#aiChatRoot .aichat-focus-item { display: flex; align-items: center; gap: 5px; padding: 1px 0; }
#aiChatRoot .aichat-focus-kind {
    flex: 0 0 auto;
    font-size: 9px;
    font-weight: 800;
    padding: 0 4px;
    border-radius: 4px;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #a16207;
}
#aiChatRoot .aichat-focus-kind.is-row { background: #fde68a; }
#aiChatRoot .aichat-focus-text {
    flex: 1 1 auto;
    min-width: 0;
    color: #a16207;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#aiChatRoot .aichat-focus-x {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: #d97706;
    cursor: pointer;
    padding: 0 2px;
    font-size: 12px;
    line-height: 1.4;
}
#aiChatRoot .aichat-focus-x:hover { color: #78350f; }

/* ---- C6：上下文用量环 / 分解面板 / 会话历史 ----
   全部住在 .aichat-bar 与 .aichat-footer 里，和参数条同一条纪律：不依赖 Tailwind 的
   运行时扫描（#aiChatRoot 在 <body> 下，JIT 扫不到就会糊成一坨）。 */
#aiChatRoot .aichat-ctxrow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
#aiChatRoot .aichat-ringchip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 7px 2px 3px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: #eef2ff;
    color: #4338ca;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
}
#aiChatRoot .aichat-ringchip:hover { background: #e0e7ff; }
/* 【实测值 vs 估算值必须一眼分得开】实测 = 实线弧 + 实线边框；估算 = 虚线弧 + 虚线边框 + 「≈」。
   把估算画成实测的样子，和设置里那句「实测：LaTeX 命令零丢失」是同一类缺陷。 */
#aiChatRoot .aichat-ringchip.is-est { background: #f8fafc; color: #64748b; border-color: #cbd5e1; border-style: dashed; }
#aiChatRoot .aichat-ringchip svg { display: block; }
#aiChatRoot .aichat-ring-track { fill: none; stroke: #c7d2fe; stroke-width: 3; }
#aiChatRoot .aichat-ringchip.is-est .aichat-ring-track { stroke: #e2e8f0; }
#aiChatRoot .aichat-ring-arc { fill: none; stroke: #4f46e5; stroke-width: 3; stroke-linecap: round; }
#aiChatRoot .aichat-ringchip.is-est .aichat-ring-arc { stroke: #94a3b8; stroke-dasharray: 2 2; stroke-linecap: butt; }
#aiChatRoot .aichat-minibtn {
    flex: 0 0 auto;
    padding: 2px 8px;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    background: #ffffff;
    color: #64748b;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.4;
    cursor: pointer;
}
#aiChatRoot .aichat-minibtn:hover { border-color: #a5b4fc; color: #4338ca; }
#aiChatRoot .aichat-minibtn.is-on { background: #eef2ff; border-color: #a5b4fc; color: #4338ca; }
#aiChatRoot .aichat-minibtn.is-danger:hover { border-color: #fda4af; color: #be123c; }
#aiChatRoot .aichat-panel {
    margin-top: 6px;
    padding: 8px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #ffffff;
    font-size: 10px;
    color: #475569;
    max-height: 240px;
    overflow-y: auto;
}
#aiChatRoot .aichat-panel-h { font-size: 10px; font-weight: 800; color: #334155; margin-bottom: 4px; }
#aiChatRoot .aichat-panel-note { color: #94a3b8; line-height: 1.6; margin: 4px 0; }
#aiChatRoot .aichat-kv { display: flex; align-items: baseline; gap: 6px; padding: 1px 0; }
#aiChatRoot .aichat-kv > span:first-child { flex: 1 1 auto; min-width: 0; }
#aiChatRoot .aichat-kv > span:last-child { flex: 0 0 auto; font-variant-numeric: tabular-nums; font-weight: 700; color: #334155; }
#aiChatRoot .aichat-kv.is-sum { border-top: 1px solid #e2e8f0; margin-top: 3px; padding-top: 3px; }
#aiChatRoot .aichat-kv.is-ok > span:last-child { color: #047857; }
#aiChatRoot .aichat-kv.is-bad > span:last-child { color: #be123c; }
#aiChatRoot .aichat-panel-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
#aiChatRoot .aichat-arcitem {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
    border-top: 1px solid #f1f5f9;
}
#aiChatRoot .aichat-arcitem:first-child { border-top: none; }
#aiChatRoot .aichat-arctitle { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; }
#aiChatRoot .aichat-arcmeta { flex: 0 0 auto; color: #94a3b8; font-variant-numeric: tabular-nums; }

/* ---- C3：提案卡片（模型建议的替换）---- */
#aiChatRoot .aichat-card {
    width: 100%;
    max-width: 100%;
    border: 1px solid #c7d2fe;
    border-radius: 12px;
    background: #ffffff;
    overflow: hidden;
}
#aiChatRoot .aichat-card-head {
    padding: 5px 8px;
    background: #eef2ff;
    border-bottom: 1px solid #e0e7ff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #4338ca;
}
#aiChatRoot .aichat-card-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#aiChatRoot .aichat-pane-label { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: #94a3b8; }
#aiChatRoot .aichat-pane {
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.6;
    /* 逐字对照必须保原样：空格、换行、缩进都不许被折叠 */
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 160px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
#aiChatRoot .aichat-pane-old { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
#aiChatRoot .aichat-pane-new { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
#aiChatRoot .aichat-card-warn {
    font-size: 10px;
    line-height: 1.5;
    color: #b45309;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 4px 6px;
}
#aiChatRoot .aichat-card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
#aiChatRoot .aichat-btn {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #ffffff;
    color: #475569;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
}
#aiChatRoot .aichat-btn:hover { background: #f1f5f9; color: #0f172a; }
#aiChatRoot .aichat-btn-primary { background: #4f46e5; border-color: #4f46e5; color: #ffffff; }
#aiChatRoot .aichat-btn-primary:hover { background: #4338ca; color: #ffffff; }
#aiChatRoot .aichat-btn[disabled] { opacity: 0.45; cursor: default; }
#aiChatRoot .aichat-card-done { font-size: 11px; font-weight: 700; color: #047857; }

/* ---- 「思考」折叠区：reasoning_content 只能待在这里，绝不能当答案显示 ---- */
#aiChatRoot .aichat-think { margin-top: 6px; }
#aiChatRoot .aichat-think > summary {
    cursor: pointer;
    font-size: 10px;
    color: #94a3b8;

#aiChatRoot .aichat-think-body {
    margin-top: 4px;
    padding: 6px 8px;

    border: 1px dashed #e2e8f0;
    border-radius: 8px;
    font-size: 10px;
    line-height: 1.6;
    color: #94a3b8;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;

/* 助手气泡下面那排小动作（目前只有「复制答案」）。刻意低对比：它是辅助，不是主角。 */
#aiChatRoot .aichat-msgacts { display: flex; gap: 6px; margin-top: 6px; }

/* 助手气泡里渲染 Markdown/KaTeX 之后，段落间距要收一收，否则一句话占三行高 */
#aiChatRoot .aichat-md { white-space: normal; }
#aiChatRoot .aichat-md p { margin: 0 0 6px 0; }
#aiChatRoot .aichat-md p:last-child { margin-bottom: 0; }

#aiChatRoot .aichat-md code { background: #e2e8f0; border-radius: 4px; padding: 0 3px; font-size: 11px; }

/* ---- 缩放手柄：八向，四条边 + 四个角，光标形状照 Windows 的窗口边框 ----
   【尺寸不是拍的，是被两侧夹出来的】
     · 太薄抓不住；Windows 自己的可拖边框（SM_CXSIZEFRAME + 边框填充）实际约 4–8 px。
     · 太厚就会盖住底下真正能点的东西 —— 而这个窗口的边缘全是控件：
       标题栏三颗按钮上下各留 7px（(40−26)/2）、页脚内边距 8px。
   于是取 **边 6px、角 12px**，再把标题栏右边距和页脚下边距各放宽到 12px 给四个角让位。
   结论：没有任何一颗按钮的任何一个像素落在手柄之下（实测见提交说明）。
   textarea 自带的 resize 角不存在冲突 —— .aichat-input 一直是 resize:none，
   输入框的高度由 chatAutoGrowInput 按内容自增长（1→6 行），本来就没有原生把手。 ---- */
#aiChatRoot .aichat-resize { position: absolute; touch-action: none; }
#aiChatRoot .aichat-resize-l  { left: 0;   top: 12px;    bottom: 12px; width: 6px;   cursor: ew-resize; }
#aiChatRoot .aichat-resize-r  { right: 0;  top: 12px;    bottom: 12px; width: 6px;   cursor: ew-resize; }
#aiChatRoot .aichat-resize-t  { left: 12px; right: 12px; top: 0;       height: 6px;  cursor: ns-resize; }
#aiChatRoot .aichat-resize-b  { left: 12px; right: 12px; bottom: 0;    height: 6px;  cursor: ns-resize; }
#aiChatRoot .aichat-resize-tl { left: 0;   top: 0;    width: 12px; height: 12px; cursor: nwse-resize; }
#aiChatRoot .aichat-resize-tr { right: 0;  top: 0;    width: 12px; height: 12px; cursor: nesw-resize; }
#aiChatRoot .aichat-resize-bl { left: 0;   bottom: 0; width: 12px; height: 12px; cursor: nesw-resize; }
#aiChatRoot .aichat-resize-br { right: 0;  bottom: 0; width: 12px; height: 12px; cursor: nwse-resize; }

/* ---- 最小化：折叠成一条只剩标题栏的窄条 ----
   【为什么用 height:auto + 隐藏内容，而不是把 geom.h 改成 42】
   geom.h 是**用户手动调出来的尺寸**，最小化不许动它 —— 动了就意味着展开时要靠另一份
   备份把它算回来，而那份备份迟早会和 geom 分叉。这里的做法是：ChatState.geom 一个字段
   都不改，只让 CSS 把渲染高度接管过去（!important 压过 chatApplyGeom 写的内联 height），
   展开时把 class 摘掉，内联 height 原封不动地重新生效。
   内容用 display:none 而不是 visibility:hidden：后者照样占位、照样撑大祖先的 scrollWidth。
   草稿/选区/滚动位置在 display:none 期间不会被浏览器清掉，但 chatScrollToBottom 之类的
   代码在隐藏期间会把 scrollTop 写成 0，所以这三样由 chatMinimize 显式存、chatExpand 显式还原。 */
#aiChatRoot.is-min { height: auto !important; }
#aiChatRoot.is-min .aichat-frame { height: auto; }

#aiChatRoot.is-min .aichat-footer { display: none; }

   留着它们等于让用户去改一个看不见的高度。 */
#aiChatRoot.is-min .aichat-resize { display: none; }
#aiChatRoot.is-min .aichat-titlebar { border-bottom: none; }

body[data-aichat-drag] { user-select: none !important; }
body[data-aichat-drag] * { user-select: none !important; }
body[data-aichat-drag="move"] { cursor: grabbing !important; }
body[data-aichat-drag="l"]    { cursor: ew-resize !important; }
body[data-aichat-drag="r"]    { cursor: ew-resize !important; }
body[data-aichat-drag="t"]    { cursor: ns-resize !important; }
body[data-aichat-drag="b"]    { cursor: ns-resize !important; }
body[data-aichat-drag="tl"]   { cursor: nwse-resize !important; }
body[data-aichat-drag="br"]   { cursor: nwse-resize !important; }
body[data-aichat-drag="tr"]   { cursor: nesw-resize !important; }

// ============= 版本号：唯一事实源是仓库根目录的 VERSION 文件 =============

window.APP_VERSION = APP_VERSION;
window.APP_BUILD_DATE = APP_BUILD_DATE;

    { id: 'gpt-5-nano',                 name: 'GPT-5 Nano',            sub: 'Ultra Fast & Light',   short: 'GPT-5 Nano', provider: 'openai', tier: 'lite' },

    { id: 'claude-opus-4-5-20251101',   name: 'Claude Opus 4.5',       sub: 'Best Quality',         short: 'Opus 4.5',   provider: 'claude', tier: 'pro'  }

// 缓存超过 7 天只改文案（提示「已过期」），绝不清空数据
const MODEL_CATALOG_TTL = 7 * 24 * 60 * 60 * 1000;
const MODEL_CATALOG_LS_KEY = 'onlineModelCatalog';
const MODEL_CATALOG_SCHEMA_VERSION = 1;

// 安全闸：只有匹配这个白名单的 id 才允许进入目录。
// 原因：escapeHtml() 走 textContent→innerHTML，**不转义单引号**，而模型 id 会被插进
// onclick="selectModel('openai','${id}')" 这种内联属性上下文。入口白名单 + 渲染处 escapeHtml 双保险。
const SAFE_MODEL_ID = /^[A-Za-z0-9][A-Za-z0-9._:\/-]{0,119}$/;

// 模型 id 过白名单，非法直接丢弃（返回 null）
// ⚠️ 阶段二（计划 步骤 8-15，计划书 843-846 行）里同名函数已在此提前落地，届时请勿重复插入。
function sanitizeModelId(id) {
    const s = String(id || '').trim();
    return SAFE_MODEL_ID.test(s) ? s : null;
}

// Gemini：generateContent 不等于「能聊天」—— 图像生成 / TTS / live 也声明它，必须再按 id 做「白名单 + 黑名单」双重过滤。
// 白名单：只收 gemini-<版本数字>-... 和官方 -latest 别名（gemini-flash-latest / gemini-pro-latest /
//        gemini-flash-lite-latest）；这一条已经把 gemma-* / imagen-* / veo-* / lyria-* / learnlm-* /
//        embedding-* 等非 gemini 前缀家族全部挡在外面，不必再单独列。
// 黑名单：在白名单基础上，命中下列关键词的连字符分段一律排除（image/imagen/tts/audio/live/…），
//        涵盖 nano banana 图像家族、TTS、live/realtime、embedding、robotics、computer-use 等。
//        (?:^|-)...(?:-|$) 是分段匹配，避免误伤未来某个合法模型名里恰好包含这些词根的子串。
const GEMINI_TEXT_ALLOW = /^gemini-\d/;
const GEMINI_TEXT_ALLOW_ALIAS = /^gemini-(?:pro|flash)(?:-lite)?-latest$/;
const GEMINI_NON_TEXT_DENY = /(?:^|-)(?:image|imagen|tts|audio|speech|voice|live|realtime|bidi|dialog|embedding|embed|gecko|robotics|robot|omni|veo|video|vision|computer|cua|lyria|music|rerank|ranker|guard|safety|aqa)(?:-|$)/i;

// Gemini 专用：id 是否是「纯文本对话」模型。fetchGeminiModelList（实时拉取）和 loadOnlineCatalog
// （localStorage 缓存回放）必须共用同一个判定，否则旧缓存里的图像模型 id 会在刷新前一直显示。
function isGeminiTextChatModelId(id) {
    const s = String(id || '');
    if (!(GEMINI_TEXT_ALLOW.test(s) || GEMINI_TEXT_ALLOW_ALIAS.test(s))) return false;
    return !GEMINI_NON_TEXT_DENY.test(s);
}

// deep-research：o3-deep-research / o4-mini-deep-research 只走 Responses API 且强制要求
//                web_search 等工具，打 chat/completions 会 400（GEMINI_NON_TEXT_DENY 已经排过同类）。

const OPENAI_ALLOW = /^(gpt-[0-9]|chatgpt-|o[1-9]($|[-.]))/i;
const OPENAI_DATED_SNAPSHOT = /-\d{4}-\d{2}-\d{2}$/;

// 前缀继承的**尾巴白名单**。规则：宁可少显示一个价，也绝不能显示一个错价。
// 只有「同价变体」后缀才允许继承母模型价格 —— preview/exp/latest/thinking 这类标记、
// 以及纯日期快照（-2026-09-01 / -09-2026 / -001）。其余一律视为不同档位，返回 null。
// 反例（必须拦住）：gemini-3.7-flash-lite 不能继承 gemini-3.7-flash —— Google 每代 flash 都会
// 补一个 -lite，而 lite 价常只有 flash 的 1/3~1/6（3.5-flash $1.50/$9.00 vs 3.5-flash-lite $0.30/$2.50）。
const PRICE_KEY_TAIL_OK = /^(?:-(?:preview|exp|latest|thinking|customtools|\d{4}-\d{2}-\d{2}|\d{2}-\d{4}|\d{3}))+$/;

// 促销价求值：promoUntil 当天结束前用促销价，之后自动切到 after 的恢复价。
// 无 promoUntil 的条目原样返回。note 由这里合成，保证 UI 文案与实际取用的数字永远一致。
function resolvePromoPrice(price) {
    if (!price || !price.promoUntil || !price.after) return price;
    const expired = Date.now() > new Date(price.promoUntil + 'T23:59:59').getTime();
    const base = expired ? price.after : price;
    const promoNote = expired
        ? `限时价已于 ${price.promoUntil} 到期，此处显示的是恢复后的正常价`
        : `限时价，${price.promoUntil} 之后恢复为 输入 ${formatPriceUsd(price.after.in)} / 输出 ${formatPriceUsd(price.after.out)}`;
    return Object.assign({}, price, {
        in: base.in,
        out: base.out,
        promoExpired: expired,
        note: price.note ? `${promoNote}；${price.note}` : promoNote
    });
}

// 按 id 找价格，最长前缀匹配 + 尾巴白名单校验：id 必须以某个表内 key 开头，多个匹配取最长的那个，
// 且 key 之后剩下的那一段必须命中 PRICE_KEY_TAIL_OK（或完全相等）才认。
// 找不到 / 尾巴不合法都返回 null —— 调用方必须把 null 当成「未知」处理，绝不能编造价格。
function getModelPrice(id) {
    const s = String(id || '');
    let best = null; // { provider, key, price }
    MODEL_PROVIDERS.forEach(function (p) {
        const bucket = MODEL_PRICING[p];
        if (!bucket) return;
        Object.keys(bucket).forEach(function (key) {
            if (s.indexOf(key) !== 0) return;   // s 必须以 key 开头
            const tail = s.slice(key.length);
            if (tail !== '' && !PRICE_KEY_TAIL_OK.test(tail)) return;
            if (!best || key.length > best.key.length) best = { provider: p, key: key, price: bucket[key] };
        });
    });
    if (!best) return null;
    return resolvePromoPrice(Object.assign({ id: best.key, provider: best.provider }, best.price));
}

// 统一价格数字的显示形式：固定两位小数（$0.1 → $0.10），JS 数字字面量会吞掉末尾 0
function formatPriceUsd(n) {
    return `$${Number(n).toFixed(2)}`;
}

// 顶栏下拉 / 设置勾选框共用的紧凑价格文案，如 "入$0.10 出$0.40 /1M"。
// 单位与口径必须写在**可见文字**里：title 属性在手机 / 平板上根本不触发，只靠悬停会让用户
// 把 "$0.10/$0.40" 误读成「每次请求」或「每 1K tokens」，量级差 1000 倍。
// 结尾的 * 表示这是限时促销价（含义写在下拉图例和设置区脚注里）。
function formatPriceCompact(price) {
    if (!price) return '价格未知';
    const promo = (price.promoUntil && !price.promoExpired) ? '*' : '';
    return `入${formatPriceUsd(price.in)} 出${formatPriceUsd(price.out)} /1M${promo}`;
}

// 悬浮提示用的完整价格说明，含长上下文分档、备注、数据口径
function formatPriceTitle(price) {
    if (!price) return '价格未知（不在内置价格表中，多为 OpenAI/Claude 或尚未收录的新模型）';
    let s = `美元 / 每 1,000,000 tokens：输入 ${formatPriceUsd(price.in)} / 输出 ${formatPriceUsd(price.out)}（付费层标准档，非 Batch/Flex/Priority）`;
    if (price.longContext) {
        s += `；prompt 超过 ${price.longContext.over / 1000}k tokens 时：输入 ${formatPriceUsd(price.longContext.in)} / 输出 ${formatPriceUsd(price.longContext.out)}（整个 prompt 按高档计价，非仅超出部分）`;
    }
    if (price.note) s += `；${price.note}`;
    s += `。价格为内置表（非 API 实时返回），截至 ${MODEL_PRICING_AS_OF}；推理/思考 token 按输出价计费，实际成本可能高于可见译文估算。`;
    return s;
}

// 把任意数字夹到合法范围内；越界或非数字一律回退到默认宽度，避免脏 localStorage 值
// 把弹窗渲染成 5px 宽或 90000px 宽。视口过窄时由渲染时的 CSS min(...vw) 兜底，这里不依赖 window。
function clampSettingsModalWidth(w) {
    const n = Math.round(Number(w));
    if (!Number.isFinite(n)) return SETTINGS_MODAL_DEFAULT_WIDTH;
    return Math.max(SETTINGS_MODAL_MIN_WIDTH, Math.min(SETTINGS_MODAL_MAX_WIDTH, n));
}

function normalizeSettingsTab(tab) {

        if (SETTINGS_TABS[i].id === tab) return tab;

}

// ============= 句对行距（TASK 3）=============
// 改前实测：两栏内容盒各挂 space-y-2（行间 8px）+ 每行自己 mb-2（8px）= 行距恒 16px，
// 用户反馈「左右句子之间的间隔都有些大」。默认改成 8px（比原来紧一半），可一路调到 0。
// 上限 32px 留给「屏幕大、想要松散阅读」的场景。
const ROW_GAP_DEFAULT = 8;
const ROW_GAP_MIN = 0;
const ROW_GAP_MAX = 32;
// 脏 localStorage 值（NaN / -999 / 9999）不能把行距渲染成负数或几千像素
function clampRowGap(v) {
    const n = Math.round(Number(v));
    if (!Number.isFinite(n)) return ROW_GAP_DEFAULT;
    return Math.max(ROW_GAP_MIN, Math.min(ROW_GAP_MAX, n));
}
// 行距只经由 :root 上的 CSS 变量生效 —— 不写进任何模板字符串。
// 好处：renderApp() 重建 root.innerHTML 时它压根不参与，重渲染丢不掉；
// 拖动滑块时也不需要 setState，一次 setProperty 就是全部工作量（无布局抖动）。
function applyRowGapToDom(px) {
    try {
        document.documentElement.style.setProperty('--pair-gap', clampRowGap(px) + 'px');
    } catch (e) {
        console.warn('[rowgap] 写入 CSS 变量失败：', e && e.message);
    }
}

    settingsModalWidth: SETTINGS_MODAL_DEFAULT_WIDTH, // Settings 弹窗宽度（px），拖拽手柄调整后持久化
    modelGroupExpanded: { gemini: false, openai: false, claude: false }, // Settings 弹窗里「展开了哪几家」；刻意不落 localStorage，每次开弹窗都回到折叠
    settingsTab: SETTINGS_TABS[0].id, // Settings 弹窗当前页签（持久化到 localStorage['settingsTab']，关弹窗/刷新都记得）
    rowGap: ROW_GAP_DEFAULT,          // 句对行距（px），左右两栏共用；持久化到 localStorage['rowGap']

    // 哨兵传输协议总开关（详见 translateViaSentinel 上方的大段注释）。
    // 持久化到 localStorage['sentinelTransport']；关掉 = 逐字回到旧的 JSON 协议。
    // 只对 local / gemini 两条**已实测**链路生效，OpenAI / Claude 永远走旧协议。
    sentinelTransport: true,
    // 上一次翻译里有几段落进了失败标记。>0 时 handleTranslate / handleRegenerateAll
    // 会弹一次 toast 明确告知；本字段留着给排查用（失败的那几行自己也带可见标记）。
    // 刻意**不**进渲染模板：渲染路径没有 try/catch，能不碰就不碰。
    lastTransportFailures: 0,
    // 上一次翻译里有几处公式环境在译文里凭空消失（A7 审计的结果）。同样**不进渲染模板**，
    // 只留给排查用；用户看到的是那一条 toast。
    lastEquationLoss: 0,

    // ---- 跨栏对应高亮（选中一侧，另一侧同时高亮出对应片段）----
    crossHighlightEnabled: true,      // 总开关，「显示」页可关；持久化到 localStorage['crossHighlightEnabled']
    // 本次跨栏高亮的结果。形状永远固定，渲染路径只读不写。
    //   status: 'idle' 无 | 'pending' 请求在飞 | 'ok' 有可画的片段 | 'none' 查过了但一个都没逐字命中
    //   fragments: **已经逐字校验过、且在目标侧只出现一次**的片段；除此之外一律不进这里
    crossHighlight: { seq: 0, idx: null, fromSide: null, toSide: null, fragments: [], status: 'idle', via: '' },

    // 模型可见性设置（键 = 模型 id，值 = 是否显示；键不存在时按 `!== false` 视为可见）
    // 初值由 DEFAULT_MODEL_CATALOG 派生，与原来手写的 9 个 true 完全等价
    modelVisibility: Object.fromEntries(DEFAULT_MODEL_CATALOG.map(m => [m.id, true])),

    // B2：每个本地模型各自的推理档位（键 = 模型 id，值 = UI 词表里的 off/on/low/medium/xhigh）。
    // 缺键 = 'off' —— 翻译场景默认关，理由见 XPORT_PARAM_SPECS 里 reasoning 那条的实测数字。
    // 持久化到 localStorage['reasoningByModel']，在首次 renderApp 之前恢复。
    reasoningByModel: {},
    
    // AI Toolbar 设置弹窗状态
    activeSettingsPopup: null, // 'grammar' | 'simplify' | null
    activeSettingsIndex: null,
    activeSettingsSide: null,

    // 控制标志
    isRestoringHistory: false,
    lastTranslatedText: "",
    // 本次翻译之后，用户有没有在**原文栏**逐句改过稿。只有它为真时，切进 Edit 视图才会
    // 用 pairs 重建大输入框（见 syncInputFromPairs）—— 没改过就一个字都不动用户粘进来的原文。
    srcEditedSinceTranslate: false,
    // 「当前屏幕上这份文档」的代号。从历史恢复 / 清空 各加一次。handleTranslate 在发请求
    // 之前记下它、在结果落地之前核对：对不上就把结果丢掉。
    // 【为什么不能只靠 abort】恢复历史时把在途请求 abort 掉是必要的，但不充分：响应已经
    // 回来、正卡在 await 与 setState 之间的那一刻，abort 什么也拦不住，那份**别的文档**的
    // 译文照样会盖到刚恢复出来的文档上（实测：恢复 A 之后屏幕变成 B 的 8 行，
    // 而 sessionId / inputText 还是 A 的）。代号比对是那一刻唯一拦得住的东西。
    docGeneration: 0,

    // Abort Controllers
    mainAbortController: null,
    rowAbortControllers: new Map(),
    regenerateAbortControllers: new Map(),
    regenerateAllAbortController: null,

    // 重新生成状态
    isRegeneratingAll: false,

    // Timers
    debounceTimer: null,
    autoSaveTimer: null
};

// 获取API配置对象
function getApiConfig() {
    return {
        provider: AppState.apiProvider,
        model: AppState.selectedModel,
        localBaseUrl: AppState.localBaseUrl,
        geminiApiKey: AppState.geminiApiKey,
        openaiApiKey: AppState.openaiApiKey,
        claudeApiKey: AppState.claudeApiKey,
        claudeProxyUrl: AppState.claudeProxyUrl
    };
}

// 状态更新并触发UI重渲染
// options: { skipRender: bool, preserveScroll: bool (default true) }
function setState(updates, options = {}) {
    // 兼容旧的 skipRender 布尔参数
    if (typeof options === 'boolean') {
        options = { skipRender: options };
    }
    const { skipRender = false, preserveScroll = true } = options;

    Object.assign(AppState, updates);
    if (!skipRender && typeof renderApp === 'function') {
        // renderApp 现在内置滚动保护，传递 preserveScroll 参数
        renderApp(preserveScroll);
    }
}

// 更新翻译对
function updateTranslationPair(index, updates) {
    const pairs = [...AppState.translationPairs];
    pairs[index] = { ...pairs[index], ...updates };
    setState({ translationPairs: pairs });
}

// ============= 选词弹窗的三种模式（替换 / 简化 / 语法修正）=============
// 三者在任何地方都是平级的：模式切换条、historyByMode、pageIndexByMode、默认模式设置、localStorage。
const SYNONYM_MODES = ['replace', 'simplify', 'grammar'];
const SYNONYM_MODE_LABEL = { replace: '替换', simplify: '简化', grammar: '语法修正' };
// 悬停提示文案（选词弹窗的模式条 + 设置里的「默认功能」都用同一份，改一处两处同步）
const SYNONYM_MODE_TIP = {
    replace: '给选中的词换一批学术同义词，点一个就替换掉选中部分。',
    simplify: '把选中的这段话改写得更直白简短，意思不变。',
    // 这条提示原来写「检查选中处所在的『整句』语法：没问题会直接说『语法正确』」。
    // 两判定契约上线后两句都不成立了：整句仍然会被读，但**判定的是选中的那一段**，
    // 而屏幕上的字也已经改成「所选部分语法正确」。提示是 UI 文案，同样不许说假话。
    grammar: '连同整句一起校对，但判定的是你选中的这一段：选中处本身没问题就说「所选部分语法正确」，整句别处的毛病放在下面一行、点了才生效；选中处有问题就给出改写。整句级改写会用琥珀色高亮出将被替换的范围。'
};

// 脏值一律回落 'replace'。所有读 mode 的地方都必须过这个函数，渲染路径才不会碰到未知键。
function normalizeSynonymMode(mode) {
    return SYNONYM_MODES.indexOf(mode) !== -1 ? mode : 'replace';
}

function emptySynonymHistory() {
    return { replace: [], simplify: [], grammar: [] };
}

function emptySynonymPageIndex() {
    return { replace: 0, simplify: 0, grammar: 0 };
}

// 从 state 里安全取出「某模式的分页历史」，任何脏值都返回空数组，绝不抛错
function getSynonymHistory(state, mode) {
    const hb = (state && state.historyByMode && typeof state.historyByMode === 'object') ? state.historyByMode : {};
    return Array.isArray(hb[mode]) ? hb[mode] : [];
}

function getSynonymPageIndex(state, mode) {
    const pb = (state && state.pageIndexByMode && typeof state.pageIndexByMode === 'object') ? state.pageIndexByMode : {};
    const n = pb[mode];
    return (typeof n === 'number' && isFinite(n) && n >= 0) ? Math.floor(n) : 0;
}

// 语法模式下某一页的判定结果，永远返回一个形状固定的对象。
// 渲染路径**只**从这里读 note，所以每一个新键都必须在这里补上防御性默认值 ——
// renderApp/renderSynonymPopupOnly 都没有 try/catch，读到 undefined 就是整页永久冻结。
function getGrammarNote(state, pageIndex) {
    const notes = (state && Array.isArray(state.grammarNotes)) ? state.grammarNotes : [];
    const note = notes[pageIndex];
    if (!note || typeof note !== 'object') {
        return { status: '', issue: '', scope: 'selection', code: '', sentenceIssue: '', sentenceOffer: [] };
    }
    return {
        status: typeof note.status === 'string' ? note.status : '',
        issue: typeof note.issue === 'string' ? note.issue : '',
        // 作用域只认 'sentence' 这一个特殊值，其它一切（含缺失、脏值）都当词级
        scope: note.scope === 'sentence' ? 'sentence' : 'selection',
        // 失败码（XPORT_FAIL_TEXT 的键）。未知码在弹窗里渲染成空串，绝不能是 undefined。
        code: typeof note.code === 'string' ? note.code : '',
        // 附带提议：整句别处的问题 + 整句改写候选。用户点了「看整句改写」才生效。
        sentenceIssue: typeof note.sentenceIssue === 'string' ? note.sentenceIssue : '',
        sentenceOffer: Array.isArray(note.sentenceOffer) ? note.sentenceOffer.filter(v => typeof v === 'string' && v) : []
    };
}

// 当前这一页的建议是不是「整句改写」。
// 只有同时满足：语法模式 + 该页判定为 sentence + 该页确实有选项 + sentenceRange 可用，才算数。
// 任何一条不成立都退回词级 —— 高亮范围和替换范围必须永远出自同一个判断。
function isSentenceScopedPage(state, mode, pageIndex) {
    try {
        if (normalizeSynonymMode(mode) !== 'grammar') return false;
        if (getGrammarNote(state, pageIndex).scope !== 'sentence') return false;
        const page = getSynonymHistory(state, 'grammar')[pageIndex];
        if (!Array.isArray(page) || page.length === 0) return false;
        return getValidSentenceRange(state) !== null;
    } catch (e) {
        return false;
    }
}

// 取出可用的整句范围；任何一处对不上就返回 null（调用方一律退回选区范围）
function getValidSentenceRange(state) {
    try {
        const sr = state && state.sentenceRange;
        if (!sr || typeof sr !== 'object') return null;
        const start = Math.floor(Number(sr.start));
        const end = Math.floor(Number(sr.end));
        const text = sr.text;
        if (!isFinite(start) || !isFinite(end) || start < 0 || end <= start) return null;
        if (typeof text !== 'string' || text.length !== end - start) return null;
        return { start, end, text };
    } catch (e) {
        return null;
    }
}

// 更新同义词状态
function updateSynonymState(updates) {
    Object.assign(AppState.synonymState, updates);
    // 只更新同义词弹窗，不重新渲染整个页面
    renderSynonymPopupOnly();
}

// 只渲染同义词弹窗（不影响其他 DOM）
function renderSynonymPopupOnly() {
    // 移除旧的弹窗
    const oldPopup = document.getElementById('synonymPopup');
    if (oldPopup) oldPopup.remove();

    // 选中高亮层跟弹窗同生共死：弹窗关掉时这里会把 <mark> 一起清掉。
    // 放在最前面且自带兜底，保证下面任何一步提前 return 都不会漏同步。
    syncSelectionHighlightLayers();

    // 如果不需要显示，直接返回
    if (!AppState.synonymState.show) return;

    // 创建新的弹窗元素（所有新增状态读取都做防御性兜底：渲染函数绝不能抛错）
    const s = AppState.synonymState;
    const mode = normalizeSynonymMode(s.mode);
    const history = getSynonymHistory(s, mode);
    const pageIndex = getSynonymPageIndex(s, mode);
    const currentSynonyms = Array.isArray(history[pageIndex]) ? history[pageIndex] : [];
    const pos = (s.position && typeof s.position === 'object') ? s.position : { x: 0, y: 0 };
    const errorMessage = typeof s.errorMessage === 'string' ? s.errorMessage : '';

    // 语法修正模式的响应形状跟另外两个模式不同：要么「语法正确」，要么「N 条改写」。
    const isGrammar = mode === 'grammar';
    const note = isGrammar ? getGrammarNote(s, pageIndex)
                           : { status: '', issue: '', scope: 'selection', code: '', sentenceIssue: '', sentenceOffer: [] };
    const grammarChecked = isGrammar && note.status !== '';
    // 判定为「语法正确」且只有这一页时，翻页条没有意义，直接不渲染
    const showPager = (currentSynonyms.length > 0 || history.length > 0)
        && !(isGrammar && note.status === 'correct' && history.length <= 1);
    // 这一页的建议是整句改写吗（决定：整句徽标 + 整句高亮 + 应用时的替换范围 + 弹窗限宽）
    const sentenceScoped = isSentenceScopedPage(s, mode, pageIndex);

    // 【为什么不再 flex-1】flex-1 让每个页签的宽度 = 弹窗宽度 ÷ 3，于是**弹窗一变宽页签就横着跑**：
    // 实测同一次选中，加载态弹窗 209px 宽、结果回来 240px 宽，三个页签的中心从
    // 716/736/766 跳到 740/811/882 —— 最右那个横移了 116px。用户在模型思考的那一两秒里
    // 瞄准「语法修正」点下去，落点已经不是它了。三个标签是固定的中文词（替换/简化/语法修正），
    // 按内容定宽之后页签只依赖弹窗的**左边缘**，而左边缘在下面被钉死了 —— 瞄哪儿就是哪儿。
    const modeButtonsHtml = SYNONYM_MODES.map(m => `
                <button onclick="handleSynonymModeSwitch('${m}')" class="px-2 py-1 rounded-md text-[10px] font-bold transition-all whitespace-nowrap ${mode === m ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}" data-tip="${escapeAttr(SYNONYM_MODE_TIP[m] || '')}" data-tip-pos="bottom">${SYNONYM_MODE_LABEL[m]}</button>
    `).join('');

    // 附带提议行（「整句别处还有问题」）。**永远是可选的第二行**，用户不点就什么都不发生。
    // 新 prompt 把「选区对不对」和「句子别处对不对」拆成两个独立判定，这一行就是后者的出口：
    // 改动前后者会直接顶掉前者，选一个干净的词也能换来一整句改写（实测 22/24 = 91.7%）。
    // 没有可用整句范围时不渲染 —— 点了也应用不了，给个按钮只是骗人。
    const offerable = isGrammar && note.scope !== 'sentence'
        && Array.isArray(note.sentenceOffer) && note.sentenceOffer.length > 0
        && getValidSentenceRange(s) !== null;
    const offerHtml = offerable ? `
                    <div class="mt-1.5 pt-1.5 border-t border-slate-100 flex items-start gap-1.5">
                        <div class="text-[10px] text-slate-400 leading-snug flex-1 min-w-0">
                            整句还有问题：${escapeHtml(note.sentenceIssue || '（模型未说明）')}
                        </div>
                        <button onclick="handleGrammarOfferAccept(${pageIndex})" class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 hover:bg-amber-100 transition-colors" data-tip="${escapeAttr('把这一页换成整句改写候选（' + note.sentenceOffer.length + ' 条）')}" data-tip-pos="top-end">看整句改写</button>
                    </div>` : '';

    // 结果区：三个模式共用一段分支，任何一支都必须能渲染出可见文案，绝不留空
    let bodyHtml;
    if (s.loading) {
        bodyHtml = `
                    <div class="flex items-center gap-2 text-xs text-slate-400 py-2 justify-center">
                        <span class="text-indigo-500">${Icons.LoaderSmall}</span> ${history.length > 0 ? 'Finding new options...' : (isGrammar ? 'Checking grammar...' : 'Finding context matches...')}
                    </div>`;
    } else if (errorMessage) {
        bodyHtml = `
                    <div class="text-xs text-rose-500 text-center py-2 leading-relaxed">${escapeHtml(errorMessage)}</div>`;
    } else if (isGrammar && note.status === 'correct') {
        // 【文案必须说清楚判的是哪一段】改动前这里写的是光秃秃的「语法正确」。
        // 那句话在旧 prompt 下是真的（旧 prompt 判的就是整句：「If the whole Sentence is already
        // grammatically correct, answer correct: true」）；新 prompt 把判定收窄成**只判选区**
        // （focus_correct），这四个字就成了一句代码根本没有核实过的断言 —— 而且它经常紧挨着
        // 下面那行「整句还有问题：…」，两行说的是同一段字，实测 24 条 class-ib 里 22 条如此。
        // 加两个字把作用域写明白，代价为零，说的正好是 note.status==='correct' 真正代表的东西。
        bodyHtml = `
                    <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-600 py-2 justify-center">
                        ${Icons.CheckCheck} 所选部分语法正确
                    </div>${offerHtml}`;
    } else if (currentSynonyms.length > 0) {
        // 语法模式：这一页是整句改写还是词级替换，直接写在弹窗里，
        // 和 textarea 背后那层高亮（整句 = 琥珀色）说的是同一件事。
        bodyHtml = `
                    ${isGrammar && note.issue ? `<div class="text-[10px] text-amber-600 bg-amber-50 border border-amber-100 rounded px-2 py-1 mb-1 leading-snug overflow-y-auto custom-scrollbar" style="max-height:56px;">${escapeHtml(note.issue)}</div>` : ''}
                    ${sentenceScoped ? `<div class="text-[10px] font-bold text-amber-700 flex items-center gap-1 mb-1">${Icons.SparklesSmall} 整句改写 · 将替换高亮的整句</div>` : ''}
                    <div class="flex flex-col gap-1 overflow-y-auto custom-scrollbar" style="max-height:min(320px, 45vh);">
                        ${currentSynonyms.map((syn, i) => isGrammar ? `
                            <button onclick="applySynonymOption(${pageIndex}, ${i})" class="text-left px-2 py-1.5 rounded hover:bg-indigo-50 text-slate-700 text-xs font-medium hover:text-indigo-700 transition-colors flex items-start gap-2 group">
                                <span class="opacity-0 group-hover:opacity-50 text-indigo-400 shrink-0 mt-0.5">${Icons.ArrowRightLeftSmall}</span> <span class="leading-snug">${escapeHtml(syn)}</span>
                            </button>
                        ` : `
                            <button onclick="applySynonym('${escapeHtml(syn).replace(/'/g, "\\'")}')" class="text-left px-2 py-1.5 rounded hover:bg-indigo-50 text-slate-700 text-xs font-medium hover:text-indigo-700 transition-colors flex items-center gap-2 group">
                                <span class="opacity-0 group-hover:opacity-50 text-indigo-400">${Icons.ArrowRightLeftSmall}</span> ${escapeHtml(syn)}
                            </button>
                        `).join('')}
                    </div>${offerHtml}`;
    } else if (isGrammar) {
        // 【改动前这里对六个失败码说同一句话】「模型未返回可用结果（响应为空或 JSON 解析失败）」，
        // 而 status:'empty' 那两种情况根本不是解析失败 —— 模型答了，是客户端把候选全过滤了。
        // 现在：把 A4 分出来的真码和它自己的补救办法摆出来，再给一颗「重试」
        //（实测同一句话在两次请求上一次成功一次失败，c23/c25 的 LaTeX 密度完全一样、结果相反）。
        // 未知码必须渲染成空串，绝不能是 undefined —— 这是 renderApp 没有 try/catch 的直接后果。
        const failCode = typeof note.code === 'string' ? note.code : '';
        const failRemedy = (failCode && XPORT_FAIL_TEXT[failCode]) ? XPORT_FAIL_TEXT[failCode] : '';
        const isEmptyAnswer = note.status === 'empty';
        bodyHtml = `
                    ${note.issue ? `<div class="text-[10px] text-amber-600 bg-amber-50 border border-amber-100 rounded px-2 py-1 mb-1 leading-snug overflow-y-auto custom-scrollbar" style="max-height:56px;">${escapeHtml(note.issue)}</div>` : ''}
                    <div class="text-xs text-slate-400 text-center py-2 leading-relaxed">
                        ${isEmptyAnswer ? (offerable ? '模型没有给出可用的选区替换。' : '模型这次没有提出任何改动。') : (grammarChecked ? '未能获得语法建议。' : '暂无语法结果。')}
                        ${isEmptyAnswer && !offerable ? `<span class="block text-[10px] text-slate-300 mt-0.5">模型有回应，但给出的候选都和原文一样，已全部过滤。</span>` : ''}
                        ${failRemedy ? `<span class="block text-[10px] text-slate-400 mt-1 text-left leading-snug">${escapeHtml(failRemedy)}</span>` : ''}
                        ${failCode ? `<span class="block text-[9px] font-mono text-slate-300 mt-0.5">${escapeHtml(failCode)}</span>` : ''}
                    </div>
                    <div class="flex justify-center">
                        <button onclick="handleSynonymRetry()" class="px-2.5 py-1 rounded-md text-[10px] font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 hover:bg-indigo-100 transition-colors" data-tip="${escapeAttr('重新问一次（不带 avoid 列表；这类失败是随机的）')}" data-tip-pos="top">重试</button>
                    </div>${offerHtml}`;
    } else {
        bodyHtml = `
                    <div class="text-xs text-slate-400 text-center py-2 italic">No context-aware alternatives found.
                        <span class="block not-italic text-[10px] text-slate-300 mt-0.5">模型未返回可用结果（响应为空或 JSON 解析失败）</span>
                    </div>`;
    }

    const popupHtml = `
        <div id="synonymPopup" style="position:fixed;left:0px;top:0px;visibility:hidden;${sentenceScoped ? 'max-width:min(460px, 92vw);' : ''}" class="z-[100] bg-white border border-slate-200 rounded-xl shadow-2xl p-3 min-w-[240px] flex flex-col gap-2">
            <div class="flex items-center bg-slate-100 rounded-lg p-0.5 gap-0.5">${modeButtonsHtml}
            </div>
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                    ${Icons.SparklesSmall} ${isGrammar ? 'Grammar' : 'Options'} for "${escapeHtml(s.originalText)}"
                </div>
                <button onclick="updateSynonymState({show:false})" class="text-slate-300 hover:text-slate-500">${Icons.XSmall}</button>
            </div>
            <!-- 等结果的时候先把位置**占住**：见下方定位代码里那段「弹窗不许从光标底下跑掉」。
                 加载态只有一行 spinner（整窗 152px），结果回来是 4~5 条候选（263px）——
                 这 111px 的落差就是让弹窗翻到锚点上方、整体上跳 293px 的直接原因。
                 先按结果的大致高度留白，第一次落点算的就是最终形态该待的地方。 -->
            <div class="${s.loading ? '' : 'min-h-[60px] '}flex flex-col justify-center"${s.loading ? ' style="min-height:180px;"' : ''}>
                ${bodyHtml}
            </div>
            ${focusPopupRowHtml()}
            ${showPager ? `
                <div class="flex items-center justify-between border-t border-slate-100 mt-2 pt-2">
                    <button onclick="handleSynonymPageChange(-1)" ${pageIndex === 0 || s.loading ? 'disabled' : ''} class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-lg disabled:opacity-30 transition-all">${Icons.ChevronLeft}</button>
                    <span class="text-[9px] font-mono text-slate-300 select-none">Page ${pageIndex + 1}</span>
                    <button onclick="handleSynonymPageChange(1)" ${s.loading ? 'disabled' : ''} class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-lg disabled:opacity-30 transition-all">${Icons.ChevronRight}</button>
                </div>
            ` : ''}
        </div>
    `;

    // 插入到 body
    document.body.insertAdjacentHTML('beforeend', popupHtml);

    // ============= 定位：一次选中只决定一次落点，之后左上角钉死 =============
    // 【改动前是怎么坑人的 —— 实测，本轮实跑 qwen3.6-35b-a3b】
    // 每次重渲染都按**当时的高度**重算一遍落点。加载态整窗 152px，放得进点击点下方；
    // 1.5 秒后候选回来撑到 263px，下方放不下 → 翻到锚点上方：
    //     loading  rect (627|691, 1038, 240×152)   模式条 y=1064
    //     loaded   rect (627|691,  745, 240×263)   模式条 y= 771     ← Δy = −293px
    // 用户看着加载中的弹窗、把鼠标移到「简化」页签上、在模型思考的这一两秒里点下去 ——
    // 页签已经跑到 293px 以外，这一下落在弹窗自己的边框上或者页面上。这正是
    // 「点弹窗自己的壳子」那条故障最主要的**触发方式**（对方是两次误触才找到确定复现路径）。
    //
    // 【修法】落点只在**锚点变了**（= 换了一次选中）的时候算一次，算完记进 s.placement；
    // 同一次弹窗后面的所有重渲染（loading→结果、翻页、模式切换）一律沿用那个左上角。
    // 模式条在弹窗顶部，钉住左上角就等于钉住了所有页签 —— 用户瞄准哪儿，点下去就是哪儿。
    // 内容再长也不许溢出屏幕：给弹窗一个高度上限，超出部分在弹窗内部滚动（而不是整体位移）。
    //
    // 【margin 用 12 不是 8】renderApp 末尾的 adjustAllPopups() 会在 rAF 里再看一眼，
    // 一旦发现 bottom/right 越过 viewport−10 就用 `bottom:100%` / transform 把弹窗挪走 ——
    // 那正好会把这里刚钉住的位置再弹一次。留 12px 的余量，它对 #synonymPopup 恒为空操作。
    const popupEl = document.getElementById('synonymPopup');
    if (popupEl) {
        const margin = 12;
        const w = popupEl.offsetWidth;
        const h = popupEl.offsetHeight;
        const clickX = Number(pos.x) || 0;
        const clickY = Number(pos.y) || 0;
        const kept = (s.placement && typeof s.placement === 'object') ? s.placement : null;
        // 窗口被缩小到旧落点已经不合理时（y 已经贴到底了）重新算一次，宁可跳一下也不能跑出屏幕。
        const reusable = kept && kept.ax === clickX && kept.ay === clickY
            && isFinite(kept.x) && isFinite(kept.y)
            && kept.y >= margin && kept.y <= window.innerHeight - 120;
        let x, y;
        if (reusable) {
            x = kept.x; y = kept.y;
        } else {
            x = clickX;
            y = clickY + 20;                                        // 优先显示在点击点下方
            if (y + h > window.innerHeight - margin) {
                y = clickY - h - 10;                                // 下方放不下 → 放上方
                if (y < margin) {
                    y = Math.max(margin, window.innerHeight - h - margin);  // 上方也放不下 → 贴底夹紧
                }
            }
            s.placement = { ax: clickX, ay: clickY, x: x, y: y };
        }
        // 横向宽度会随内容变，每次都重新夹一次：夹紧只防出屏，不会让页签上下乱跑。
        x = Math.max(margin, Math.min(x, window.innerWidth - w - margin));
        const room = window.innerHeight - y - margin;
        popupEl.style.maxHeight = (room > 140 ? room : 140) + 'px';
        popupEl.style.overflowY = 'auto';
        popupEl.style.left = x + 'px';
        popupEl.style.top = y + 'px';
        popupEl.style.visibility = 'visible';
    }
}

// ============= 选中高亮（状态驱动，抗全量重渲染）=============
// 背景：renderApp() 用 root.innerHTML 整块重建，编辑用的 <textarea> 会被换成新节点，
// 浏览器原生 Selection 随之消失（已实测：全量渲染后 selectionStart/End 双双归零、焦点掉到 body），
// 于是用户看到「弹窗还在、选中的蓝底没了」。恢复原生 selection 不可靠（会和下一次渲染打架，
// 而且失焦时浏览器本来就会把选中画成灰色），所以改成：把选区位置记在 synonymState 里，
// 由行渲染器在 textarea 背后生成一层镜像文本，用 <mark> 包住选中片段。
// 这样每次渲染都会重新生成高亮，弹窗关闭 / 应用替换时再一起清掉。

// 生成镜像层的内部 HTML。渲染路径专用 —— 整体 try/catch，任何脏状态都只返回空串，绝不抛错。
//
// 【这里现在要同时安置四套高亮】选区、整句改写范围、跨栏对应、额外关注。
// 前三套是「弹窗开着才存在」的瞬时状态，第四套属于文档、弹窗关了也还在，
// 所以不能再像原来那样「哪一套命中就直接返回哪一套的 HTML」——
// 改成先把四套各自的区间收进一个扁平列表，再由 focusPaintFlat 按写死的优先级
// **一次性**铺出互不嵌套的 <mark>。原来三套各自的判定条件一个字节都没改，
// 只是把「立刻拼 HTML」换成了「push 一个区间」。
function buildSelectionHighlightInner(side, idx) {
    try {
        // 这一层只画在编辑行上（renderPairRow 也只在编辑分支里插它）。
        if (AppState.activeIndex !== idx) return '';
        const values = (AppState.editValues && typeof AppState.editValues === 'object') ? AppState.editValues : {};
        const text = typeof values[side] === 'string' ? values[side] : '';

        const spans = [];
        const s = AppState.synonymState;
        // 弹窗开着、而且开在这一行 —— 原来那三条守卫，逐字保留。
        if (s && s.show && !(typeof s.index === 'number' && s.index !== idx)) {
            if (s.field === side) {
                // 高亮范围 = 即将被替换的范围。语法模式给出整句改写时，高亮整句；其余一律高亮选区。
                // 这样用户在点下去之前就能看到替换范围，不会「以为只换一个词、结果整句被换掉」。
                const mode = normalizeSynonymMode(s.mode);
                const sentenceScoped = isSentenceScopedPage(s, mode, getSynonymPageIndex(s, mode));
                const range = sentenceScoped
                    ? getValidSentenceRange(s)
                    : ((s.selectionRange && typeof s.selectionRange === 'object') ? s.selectionRange : null);
                if (range) {
                    const st = Math.floor(Number(range.start));
                    const en = Math.floor(Number(range.end));
                    if (isFinite(st) && isFinite(en)) {
                        spans.push({ start: st, end: en, kind: sentenceScoped ? 'sent' : 'sel' });
                    }
                }
            } else {
                // 这一侧不是「用户选中的那一侧」= 它是**对侧**，画跨栏对应高亮。
                const rs = crossLiveRanges(side, idx);
                for (let i = 0; i < rs.length; i++) spans.push({ start: rs[i].start, end: rs[i].end, kind: 'cross' });
            }
        }

        // 第四套：额外关注。**和弹窗无关** —— 弹窗关着它照样在，这就是它属于文档而不属于对话的意思。
        const fr = focusLiveRanges(idx, side, text);
        for (let i = 0; i < fr.length; i++) spans.push({ start: fr[i].start, end: fr[i].end, kind: 'focus' });

        // 一个区间都没有 ⇒ 返回空串，和改造前完全一致（镜像层是一个空 div）。
        if (!spans.length) return '';
        return focusPaintFlat(text, spans);
    } catch (e) {
        return '';
    }
}

// 行渲染器调用：产出整层（内容为空时就是一层不可见的空 div，不影响布局）
function renderSelectionHighlightLayer(side, idx) {
    return `<div class="sel-highlight-layer absolute inset-0 overflow-hidden whitespace-pre-wrap break-words leading-relaxed pointer-events-none select-none" aria-hidden="true" data-side="${side}" data-idx="${idx}">${buildSelectionHighlightInner(side, idx)}</div>`;
}

// 局部更新用（updateSynonymState 不走全量渲染，这里把已经在 DOM 里的镜像层刷新一遍）
// 它同时是**整个高亮系统唯一的收口**：renderApp 和 updateSynonymState 都必经此处，
// 所以「弹窗一关，跨栏高亮和在飞的请求一起收掉」只需要写在这一个地方，
// 不必去补 updateSynonymState({show:false}) 那七八个调用点。
function syncSelectionHighlightLayers() {
    try {
        // 选中作废（弹窗关了）→ 跨栏状态清零 + 取消在飞请求。必须在重建镜像层之前做，
        // 否则这一轮还会照着已作废的 fragments 再画一次。
        const ss = AppState.synonymState;
        if (!ss || !ss.show) resetCrossHighlight();

        // 渲染中途失败时 #root 还停在上一帧的 DOM 上，而 AppState 已经是新文档了。
        // 上面这行只清 AppState 里的跨栏状态（对不对得上当前 DOM 不重要），
        // 下面开始的每一步都要在真实 DOM 里找节点、往里画高亮 —— 拿新状态去配旧 DOM
        // 会画错地方。这个函数有三个非渲染路径调用点（focusAfterChange /
        // commitCrossHighlight / setCrossHighlightEnabled），renderApp 自身的调用点
        // 不受影响（那里只在 wrote=true 之后才会走到这一句）。
        if (!RENDER_BOUNDARY.wrote) return;

        // 关注标记先整体拆回纯文本。必须在跨栏那一趟**之前**做：跨栏的文本节点游走器
        // 会走进关注 span 里（它只拒绝 .katex 和 .cross-hl-span），上一轮的残留还在的话，
        // 它就可能把自己的 span 套进关注 span 里 —— 两套系统互相嵌套正是要避免的事。
        clearRenderedFocusHighlights();

        const layers = document.querySelectorAll('.sel-highlight-layer');
        for (let i = 0; i < layers.length; i++) {
            const layer = layers[i];
            const side = layer.getAttribute('data-side');
            const idx = Number(layer.getAttribute('data-idx'));
            layer.innerHTML = buildSelectionHighlightInner(side, idx);
        }

        // 非编辑行（已渲染的 marked/KaTeX 正文）走 DOM 文本节点包裹那条路，镜像层管不到
        applyCrossHighlightToRendered();
        // 关注标记最后画。顺序即优先级：和镜像层里 focusPaintFlat 的排序一致 ——
        // 跨栏对应赢过额外关注，所以关注这一趟遇到已经被跨栏包住的文本节点会整段跳过，
        // 绝不往里再套一层。
        focusPaintRendered();
        focusSyncCheckboxes();
    } catch (e) {
        // 高亮是纯装饰，坏了也绝不能污染渲染路径
    }
}

// ============= 跨栏对应高亮 =============
// 选中左边的一个词 / 短语 / 句子，右边把「意思对应的那一段」也一起高亮出来，反向同理。
//
// 这是校对工具，**一个自信的错高亮比不高亮糟糕得多**，所以整条链路只有一条铁律：
//   只画在对侧**逐字**找得到、而且**只出现一次**的片段。
// 模型给的答案不是拿来直接画的，是拿来当「候选串」去对侧做 indexOf 的；
// 对不上就什么都不画。没有模糊匹配、没有近似、没有编辑距离，永远不会有。
// 「只出现一次」这条比「找得到」更严：出现两次就无从判断是哪一次，宁可不画。
//
// ⚠️ 但这条铁律只保证「画上去的是对侧真实存在的文字」，它**保证不了**那段文字就是
//    对应内容。模型从不凭空捏字 —— 译文漏译时它会挑一段看起来最像的真文字交上来，
//    逐字闸门当然照单放行。实测（qwen3.6-35b-a3b，译文真实漏译的句对）：
//    选中 "Willie Fusion Unit"（中文里根本没译）→ 稳定回 "@@联盟层面的量"，3/3 次都画错。
//    漏译恰恰是校对最想抓的东西，功能却拿一片自信的绿色把它盖住 —— 这是最坏的失效方式。
//    所以另外加了两道闸门，它们和逐字闸门是**并联**的，谁否决都不画：
//      · prompt 里把「先判断有没有被译出来、漏了就 @@NONE」提到任务最前面
//        （measured：漏译探针的错画率 6/9 → 0/27）；
//      · crossPlausibleLength 的体量闸门（选一个词回一整句、选一整句回两个字，一律丢）。
//
// 两级：
//   1) 确定性锚点（免费、即时、零模型调用）：行内公式、\cite/\ref、数字、全大写缩写
//      —— 这些东西翻译过去是原样保留的，直接 indexOf 即可。
//   2) 模型（仅在锚点一个都没命中时才发）：**绝不用 JSON 承载**。
//      两侧正文里都有反斜杠，JSON 字符串转义正是这个 app 别处把 \ref 变成回车的元凶。
//      改用纯分隔符协议：每行 `@@` 开头一段，自己切自己解析，反斜杠一路原样。

const CROSS_HL_DEBOUNCE_MS = 180;   // 连续改选区时只发最后一次
const CROSS_HL_CACHE_MAX = 240;     // 同一句里反复选同几个词，第二次起零延迟
const CROSS_HL_MIN_LEN = 1;
// 「逐字找得到 + 只出现一次」这道闸门只保证画上去的是**对侧真实存在的文字**，
// 它保证不了那段文字**就是对应内容** —— 模型从不凭空捏字，它是挑一段看起来最像的真文字交上来，
// 于是照单全收。补一道纯本地的体量闸门：对应片段的总长度必须和选区在同一个量级。
// 中英互译的实测区间（178 次判对的模型调用，见下面注释）：英→中 0.17–0.35，中→英 1.5–4.7。
// 取 [0.12, 5] 把两头都留足余量 —— 在那 178 次里**一次误杀都没有**，
// 同时能挡住「选 28 字符、只回 2 个字」和「选一个词、把整句都回过来」这两类明显不成比例的答案。
const CROSS_HL_LEN_RATIO_MIN = 0.12;
const CROSS_HL_LEN_RATIO_MAX = 5;
// 选区极短时比例上限没有意义（选 1 个汉字，对应的英文短语本来就有二三十个字符），
// 给一个绝对下限兜住。
const CROSS_HL_LEN_ABS_MAX = 32;
const crossHighlightCache = new Map();
let crossHighlightTimer = null;
let crossHighlightAbort = null;
let crossHighlightSeq = 0;          // 单调递增；响应回来时对不上就是陈旧响应，直接丢弃

function otherSide(side) {
    return side === 'src' ? 'tgt' : 'src';
}

// 对侧这一行现在有没有地方可以画高亮？两条路各认一种载体：
//   编辑态 → 镜像层 .sel-highlight-layer；非编辑态 → 已渲染的正文容器。
// 两者都没有就是画不出来，调用方据此提前放弃，省掉一次没有意义的模型调用。
function crossCanPaint(idx, side) {
    try {
        if (document.querySelector(`.sel-highlight-layer[data-side="${side}"][data-idx="${idx}"]`)) return true;
        return findRenderedRowBody(idx, side) !== null;
    } catch (e) {
        return false;
    }
}

// 把状态恢复成「什么都没有」，并掐掉在飞的请求和排队中的防抖。
// 纯状态操作 + 全程 try/catch：渲染路径会调它。
function resetCrossHighlight() {
    try {
        crossHighlightSeq++;                      // 让任何在途响应立刻变成陈旧响应
        if (crossHighlightTimer) { clearTimeout(crossHighlightTimer); crossHighlightTimer = null; }
        if (crossHighlightAbort) { try { crossHighlightAbort.abort(); } catch (e) {} crossHighlightAbort = null; }
        AppState.crossHighlight = { seq: crossHighlightSeq, idx: null, fromSide: null, toSide: null, fragments: [], status: 'idle', via: '' };
    } catch (e) {}
}

// 某一侧「当前显示出来的文本」。跨栏高亮的逐字校验和最终定位**必须共用这一个字符串**，
// 否则会出现「在 A 串里找到了、画到 B 串上」的错位。
//   编辑中的行 = textarea 里的值（镜像层也是照这个值铺的）
//   非编辑行   = 交给 DOM 那条路自己收集文本节点，这里返回 null
function getCrossCorpus(idx, side) {
    try {
        if (AppState.activeIndex !== idx) return null;
        const values = (AppState.editValues && typeof AppState.editValues === 'object') ? AppState.editValues : {};
        return typeof values[side] === 'string' ? values[side] : null;
    } catch (e) {
        return null;
    }
}

// 片段在语料里出现的全部位置。带词边界体检：
// 片段以字母/数字开头（结尾）时，命中处的前（后）一个字符不许还是字母/数字 ——
// 否则选中 "2" 会命中 "1024" 里的那个 2，选中 "route" 会命中 "router"。
// 中文没有词边界概念，首尾不是 ASCII 字母数字时这条检查自动不生效。
function crossFindOccurrences(corpus, frag) {
    const out = [];
    try {
        if (typeof corpus !== 'string' || typeof frag !== 'string' || !frag) return out;
        const headStrict = /[A-Za-z0-9]/.test(frag.charAt(0));
        const tailStrict = /[A-Za-z0-9]/.test(frag.charAt(frag.length - 1));
        let i = corpus.indexOf(frag);
        while (i !== -1) {
            const beforeOk = !headStrict || i === 0 || !/[A-Za-z0-9]/.test(corpus.charAt(i - 1));
            const afterOk = !tailStrict || (i + frag.length >= corpus.length) || !/[A-Za-z0-9]/.test(corpus.charAt(i + frag.length));
            if (beforeOk && afterOk) out.push(i);
            if (out.length > 4) break;   // 出现这么多次早就判定为「有歧义、不画」，不必数完
            i = corpus.indexOf(frag, i + 1);
        }
    } catch (e) {}
    return out;
}

// 候选片段 → 可以放心画的区间。只保留「唯一出现」的，并且丢掉互相重叠的。
// 纯函数、无 IO、全程 try/catch —— 渲染路径直接调它。
function crossResolveRanges(corpus, fragments) {
    const ranges = [];
    try {
        if (typeof corpus !== 'string' || !corpus || !Array.isArray(fragments)) return ranges;
        for (let i = 0; i < fragments.length; i++) {
            const frag = fragments[i];
            if (typeof frag !== 'string' || frag.length < CROSS_HL_MIN_LEN) continue;
            const hits = crossFindOccurrences(corpus, frag);
            if (hits.length !== 1) continue;      // 0 次 = 没逐字命中；>1 次 = 有歧义。两种都不画。
            ranges.push({ start: hits[0], end: hits[0] + frag.length });
        }
        ranges.sort((a, b) => a.start - b.start || b.end - a.end);
        const out = [];
        for (let i = 0; i < ranges.length; i++) {
            if (out.length && ranges[i].start < out[out.length - 1].end) continue;   // 与前一段重叠，丢弃
            out.push(ranges[i]);
        }
        return out;
    } catch (e) {
        return [];
    }
}

// 体量闸门：模型交上来的对应片段，总长度必须和选区长度同一个量级。
// 整组一起判、要么全收要么全弃 —— 这条链路的立场一贯是「拿不准就什么都不画」。
// 纯函数、无 IO、全程 try/catch。
function crossPlausibleLength(selected, fragments) {
    try {
        const sel = String(selected == null ? '' : selected).trim();
        if (!sel || !Array.isArray(fragments) || !fragments.length) return false;
        let total = 0;
        for (let i = 0; i < fragments.length; i++) total += String(fragments[i] || '').length;
        if (total < sel.length * CROSS_HL_LEN_RATIO_MIN) return false;
        if (total > Math.max(sel.length * CROSS_HL_LEN_RATIO_MAX, CROSS_HL_LEN_ABS_MAX)) return false;
        return true;
    } catch (e) {
        return false;
    }
}

// 锚点够不够格「短路掉模型」？
// 只有当选区**基本上就是这些锚点本身**时才够格 —— 把锚点从选区里抠掉，
// 剩下的只有标点和空白，说明用户选的就是那个公式 / 那条 \cite / 那个缩写。
// 反例（原先会中招的）：选中 125 个字符的一整个从句、末尾带一条 \cite，
// 旧代码只要有一个锚点命中就当场收工，结果整句话只有那条 \cite 被点亮，
// 模型压根没被问过 —— 偏偏是「选得越长越需要模型」的场景被跳过了。
function crossAnchorsCoverSelection(selected, hits) {
    try {
        let rest = String(selected == null ? '' : selected).trim();
        if (!rest || !Array.isArray(hits) || !hits.length) return false;
        for (let i = 0; i < hits.length; i++) {
            const h = String(hits[i] || '');
            if (h) rest = rest.split(h).join('');
        }
        return !/[A-Za-z0-9一-鿿]/.test(rest);
    } catch (e) {
        return false;
    }
}

// prompt 里那两个语言标签必须**从这一对文本自己身上算出来**。
// 反面教材（原先的写法）：直接读 AppState.sourceLang / targetLang。那两个字段
//   · 默认值恒为 'zh'，而且从不持久化；
//   · restoreGlobalHistory 恢复 translationPairs 时压根不恢复它们；
//   · 顶栏 ZH / EN 那两个按钮随时能把它们调反，而且不清空已有句对。
// 一旦调反，prompt 就会指着英文那一栏说「【中文】」，命中率实测从 4/4 掉到 1/4，
// 全程无报错、无提示 —— 用户只会觉得这功能「忽然就不灵了」。
// 改成数汉字：这一对文本里汉字多的那一侧就是中文。自洽（两个标签必然不同）、
// 与任何全局状态无关，也就永远不会被别处的开关带歪。
function crossLangLabels(fromText, toText) {
    try {
        const cjk = (t) => (String(t == null ? '' : t).match(/[一-鿿]/g) || []).length;
        const fromIsZh = cjk(fromText) > cjk(toText);
        return { fromLabel: fromIsZh ? '中文' : '英文', toLabel: fromIsZh ? '英文' : '中文' };
    } catch (e) {
        return { fromLabel: '甲', toLabel: '乙' };
    }
}

// 这一侧当前该画哪些片段（对侧才有；本侧走原来的选区高亮）
function getCrossFragmentsFor(idx, side) {
    try {
        if (!AppState.crossHighlightEnabled) return null;
        const ch = AppState.crossHighlight;
        if (!ch || ch.status !== 'ok') return null;
        if (ch.idx !== idx || ch.toSide !== side) return null;
        return Array.isArray(ch.fragments) && ch.fragments.length ? ch.fragments : null;
    } catch (e) {
        return null;
    }
}

// 对侧镜像层要画的跨栏区间。渲染路径专用，绝不抛错。
// （原来这里是 buildCrossHighlightInner，直接拼 <mark class="cross-hl"> 的 HTML。
//   现在镜像层要同时安置四套高亮、而且**不许嵌套**，所以统一改成「只交区间、由
//   focusPaintFlat 一次铺完」。判定条件逐字不变：仍然只画 crossResolveRanges 认可的那些，
//   即「在对侧逐字命中且只出现一次」的片段。）
function crossLiveRanges(side, idx) {
    try {
        const fragments = getCrossFragmentsFor(idx, side);
        if (!fragments) return [];
        const text = getCrossCorpus(idx, side);
        if (typeof text !== 'string' || !text) return [];
        const ranges = crossResolveRanges(text, fragments);
        const out = [];
        for (let i = 0; i < ranges.length; i++) {
            const r = ranges[i];
            if (r.start < 0 || r.end > text.length || r.end <= r.start) continue;   // 语料变过了，这一段就不画
            out.push({ start: r.start, end: r.end });
        }
        return out;
    } catch (e) {
        return [];
    }
}

// ============= 跨栏高亮：非编辑行（已渲染正文）=============
// 非编辑行里是 marked + KaTeX 产出的 DOM，没有镜像层可用，只能走文本节点游走 + 包 <span>。
// 三条纪律：
//   1) 只包 <span class="cross-hl-span">，样式里只有背景色 —— 不改变任何盒模型尺寸，
//      双栏逐行对齐不变量不受影响。
//   2) 整个 .katex 子树跳过。KaTeX 的 DOM 里同一段公式有 HTML + MathML 两份文本，
//      收进来会让扁平文本凭空翻倍、偏移全错；往里插节点还会直接毁掉公式排版。
//      代价是公式片段在非编辑行画不出来 —— 那就不画，这正是本功能的默认立场。
//   3) 每次都先把上一轮的 span 拆回纯文本再重画，绝不叠加。

function clearRenderedCrossHighlights() {
    try {
        const spans = document.querySelectorAll('span[data-cross-hl]');
        for (let i = 0; i < spans.length; i++) {
            const span = spans[i];
            const parent = span.parentNode;
            if (!parent) continue;
            parent.replaceChild(document.createTextNode(span.textContent || ''), span);
            parent.normalize();   // 把拆开的相邻文本节点合回去，下一轮偏移才算得准
        }
    } catch (e) {}
}

// 找到某一行「非编辑态」的正文容器；那一行正在编辑（是 textarea）时返回 null
function findRenderedRowBody(idx, side) {
    try {
        const pane = document.querySelector(`[data-align-content="${side}"]`);
        if (!pane) return null;
        const row = pane.querySelector(`[data-idx="${idx}"][data-side="${side}"]`);
        if (!row) return null;
        if (row.querySelector('textarea')) return null;   // 编辑态，归镜像层管
        return row.querySelector('.prose') || row;
    } catch (e) {
        return null;
    }
}

// 收集容器里可以安全高亮的文本节点，同时拼出扁平文本。返回 { text, nodes:[{node, start, end}] }
//
// opts.reject：要整棵跳过的 class 列表。**不传就是原来的行为**（跳过 .katex 和 .cross-hl-span），
// 跨栏高亮那条路一个字节都没变。额外关注那条路传 ['katex']：它必须能**看见**跨栏 span 里的字，
// 否则扁平文本会凭空少掉一截、后面所有偏移全错；「不许嵌套」由 wrapCrossIntervals 那一侧的
// 祖先检查负责，不能靠在这里把节点丢掉来实现。
function collectCrossTextNodes(host, opts) {
    const nodes = [];
    let text = '';
    const reject = (opts && Array.isArray(opts.reject)) ? opts.reject : ['katex', 'cross-hl-span'];
    try {
        const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
                let p = node.parentNode;
                while (p && p !== host) {
                    const tag = p.nodeName;
                    if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
                    if (p.classList) {
                        for (let r = 0; r < reject.length; r++) {
                            if (p.classList.contains(reject[r])) return NodeFilter.FILTER_REJECT;
                        }
                    }
                    p = p.parentNode;
                }
                return node.nodeValue ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
            }
        });
        let node;
        while ((node = walker.nextNode())) {
            const v = node.nodeValue || '';
            nodes.push({ node, start: text.length, end: text.length + v.length });
            text += v;
        }
    } catch (e) {}
    return { text, nodes };
}

// 把一个文本节点按若干局部区间拆开重组（区间必须已按升序、互不重叠）
// opts.className / opts.attr：不传就是跨栏高亮原来的那一对，逐字不变；
// 额外关注复用这同一台机器，只换标记（C5：不许另起一套 DOM 方言）。
function wrapCrossIntervals(node, intervals, opts) {
    try {
        const cls = (opts && opts.className) || 'cross-hl-span';
        const attr = (opts && opts.attr) || 'data-cross-hl';
        const text = node.nodeValue || '';
        const parent = node.parentNode;
        if (!parent) return;
        const frag = document.createDocumentFragment();
        let cursor = 0;
        for (let i = 0; i < intervals.length; i++) {
            const iv = intervals[i];
            if (iv.s < cursor || iv.e > text.length || iv.e <= iv.s) continue;
            if (iv.s > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, iv.s)));
