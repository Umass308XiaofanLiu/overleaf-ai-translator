// ============= B2：每模型一个推理档位，持久化 =============
const XPORT_REASONING_LS_KEY = 'reasoningByModel';
const XPORT_REASONING_DEFAULT = 'off';   // 翻译默认关：见 XPORT_PARAM_SPECS.reasoning.desc 的实测数字

// 用户存的原始 UI 值（脏值一律回落 'off'）。
function xportReasoningRaw(model) {
    try {
        const box = AppState.reasoningByModel;
        const v = (box && typeof box === 'object') ? box[String(model)] : null;
        return (typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v))
            ? v : XPORT_REASONING_DEFAULT;
    } catch (e) { return XPORT_REASONING_DEFAULT; }
}

// 夹到这个模型**真正支持**的档位上。发现数据拿不到就原样返回（默认 'off' 与省略等价，安全）。
// 【为什么把 raw 提成参数】翻译和对话各有一套「每模型档位」（AppState.reasoningByModel /
// ChatState.reasoningByModel），但「这个模型到底支持哪些档位」只有一份事实。
// 两边共用这一个夹取器，就不可能出现「对话那条路允许了一个模型其实不支持的档位」。
function xportClampReasoning(baseUrl, model, raw) {
    // 400 闩已经合上：这个 origin 不认 reasoning_effort，callLocalLLM 之后一个字节都不再发。
    // 而实测「省略 = 不推理」，所以这个模型的**实际**档位就是「关」。这里必须跟着收敛到
    // 'off'，否则设置行会一直亮着「开」而线上什么都没带 —— 屏幕上写的和实际发生的不是
    // 一回事，正是这次要根除的那一类问题。显示、线值、探针都读这个函数，改这一处就够了。
    try { if (xportEffortUnsupported.has(xportCapsOrigin(baseUrl))) return 'off'; } catch (e) {}
    try {
        const caps = xportCapsPeek(baseUrl, model);
        if (!caps || !caps.reasoning) return raw;
        const ctl = xportReasoningControl(caps.reasoning.allowed);
        if (ctl.kind === 'toggle') return raw === 'off' ? 'off' : 'on';
        if (ctl.kind === 'select') {
            if (raw === 'off') return 'off';
            if (ctl.levels.indexOf(raw) !== -1) return raw;
            return ctl.levels.indexOf('medium') !== -1 ? 'medium' : ctl.levels[0];
        }
        return 'off';
    } catch (e) { return raw; }
}

// 翻译链路的档位：读 AppState.reasoningByModel，再走同一个夹取器。
function xportReasoningValue(baseUrl, model) {
    return xportClampReasoning(baseUrl, model, xportReasoningRaw(model));
}

// 真正写进请求体的值。永远返回一个合法字符串，永远不抛。
function xportWireEffort(baseUrl, model) {
    try {
        const ui = xportReasoningValue(baseUrl, model);
        return XPORT_EFFORT_WIRE[ui] || 'none';
    } catch (e) { return 'none'; }
}

// 某些第三方 OpenAI 兼容端可能压根不认 reasoning_effort。callLocalLLM 只要吃到一次
// 「400 且错误信息里点名 reasoning_effort」，就把这个 origin 记进来，之后不再发这个字段。
// 一次性闩，只在会话内有效；宁可少一个可选参数，也不能让整条翻译链路挂掉。
const xportEffortUnsupported = new Set();

// ============= A3：推理模式的探测与告知 =============
// 【先读这一段，否则会写出错的修法】客户端**没有**关掉推理的开关。实测：enable_thinking、
// chat_template_kwargs.{enable_thinking,thinking}、`/think`、`/no_think` 在这版 LM Studio 上
// 一律被静默忽略（reasoning_tokens 恒为 0，6 组对照请求与基准字节一致）；唯一起作用的
// 是 reasoning_effort。所以这里能做、也只能做的是：**察觉它开着，并把关掉它的办法说出来**。
//
// 【为什么值得做 —— 实测根因，且它不是 <think> 标签】推理开着时，Qwen 会先在**推理里**
// 把 JSON 草稿写成 LaTeX 散文（单反斜杠），再把那份草稿原样抄进正文。同模型同提示词，
// 用 `<think>\n` 预填做对照：关闭时输出 `\\ref{fig:arch}` / `32\\%`（能解析，175 token），
// 开启时输出 `\ref{fig:arch}` / `32\%`（Bad escaped character）。48 次响应里
// 「出现非法转义」与「硬失败」6/6 完全相关（6/6 失败、42/42 通过）。
// qwen3.6-35b 的 JSON 硬失败率因此从 16.7% 涨到 33.3%，翻译耗时是 6–9 倍。
//
// 【补救办法写两条，不是啰嗦】UI 上的 Enable Thinking 开关与 reasoning_effort 是否等价，
// 这一轮**没有实测过**（探针 P1）。两条都写，在任一结论下都是对的，代价只有一个从句。
const xportThinkState = { model: '', on: false, at: 0, dismissed: {} };
function xportThinkingMessage(model) {
    return '检测到「' + String(model || '当前模型') + '」开启了推理模式。该模式会让模型把 LaTeX 反斜杠'
        + '写成单反斜杠，导致「无法解析 JSON 响应」，并使翻译耗时变成关闭时的 6–10 倍'
        + '（三次独立实测：配对墙钟 6.05 倍、12 段合计 9.2 倍、本哨兵链路 8000 字符 10.6 倍）。'
        + '请到「设置 → 模型」把该模型的「推理」设为「关」；如果那里已经是关，'
        + '说明是 LM Studio 端把它打开的，请在 LM Studio 里关闭该模型的 Enable Thinking。';
}
// 记一次观测。on=true 且这个模型还没被用户关掉横幅时，把横幅弹出来。
// 【绝不进渲染路径】renderApp 没有 try/catch，一次抛异常就把页面永久冻在旧帧上。
// 所以横幅是挂在 document.body 上的独立节点，renderApp 一行都不碰它。
function xportNoteThinking(model, on, requested) {
    try {
        const id = String(model || '');
        xportThinkState.model = id;
        xportThinkState.at = Date.now();
        xportThinkState.on = !!on;
        // B2：用户自己在「设置 → 模型」里给这个模型开了推理，那推理开着就是**预期行为**，
        // 再弹一个「快去关掉它」的警告就是在对用户撒谎。只有「没人要求它却在推理」才是异常。
        // 拿不到设置（例如测试沙箱里没有这个函数）时按 false 处理，行为与本行加入前逐字一致。
        // requested（可选）= 「这一次请求到底有没有要求推理」。对话窗有自己一套档位
        //（ChatState.reasoningByModel），它开着推理时翻译那边可能仍然是「关」——
        // 那时去读翻译的设置会得出 selfEnabled=false，于是弹一条「没人要求它却在推理」的
        // 假警报。所以调用方能给出这一次的实际值时一律以它为准；不给才回落读设置
        //（翻译链路给的值恒等于 xportWireEffort，行为逐字不变）。
        let selfEnabled = false;
        if (typeof requested === 'boolean') selfEnabled = requested;
        else try { selfEnabled = xportWireEffort(AppState.localBaseUrl, id) !== 'none'; } catch (e2) { selfEnabled = false; }
        xportThinkState.selfEnabled = selfEnabled;
        if (on && !selfEnabled) xportThinkingBanner(id); else xportThinkingBannerHide();
    } catch (e) {}
}
function xportThinkingBannerHide() {
    try {
        if (typeof document === 'undefined') return;
        const el = document.getElementById('xport-thinking-banner');
        if (el && el.parentNode) el.parentNode.removeChild(el);
    } catch (e) {}
}
function dismissThinkingBanner() {
    try { xportThinkState.dismissed[xportThinkState.model] = true; } catch (e) {}
    xportThinkingBannerHide();
}
function xportThinkingBanner(model) {
    try {
        if (typeof document === 'undefined' || !document.body) return;
        // 【必须先摘掉旧横幅再 return】这一行原来是裸 return：为模型 A 关掉横幅之后，
        // 屏幕上那块仍然写着**模型 B** 的名字的横幅就被原样留下了 —— 而横幅正文是一条
        // 点名道姓的操作指令（「把该模型的推理设为关」），指错了模型就是在骗用户。
        // 请求是异步的，飞行中的请求带着发起时的 config，所以「横幅上的模型 ≠ 当前选中的
        // 模型」不需要任何控制台操作就能发生。
        if (xportThinkState.dismissed[String(model || '')]) { xportThinkingBannerHide(); return; }
        let el = document.getElementById('xport-thinking-banner');
        if (!el) {
            el = document.createElement('div');
            el.id = 'xport-thinking-banner';
            el.setAttribute('style', 'position:fixed;left:50%;top:14px;transform:translateX(-50%);'
                + 'z-index:99999;max-width:min(760px,92vw);padding:12px 40px 12px 14px;border-radius:14px;'
                + 'background:#fff7ed;color:#7c2d12;border:1px solid #fdba74;'
                + 'box-shadow:0 14px 34px -14px rgba(15,23,42,.5);'
                + "font-family:'Inter',sans-serif;font-size:12px;line-height:1.65;");
            document.body.appendChild(el);
        }
        el.innerHTML = '<span style="font-weight:700;">⚠️ 推理模式已开启</span><br>'
            + escapeHtml(xportThinkingMessage(model))
            + '<button onclick="dismissThinkingBanner()" title="知道了"'
            + ' style="position:absolute;top:8px;right:10px;border:none;background:transparent;'
            + 'color:#9a3412;font-size:16px;line-height:1;cursor:pointer;padding:2px 4px;">×</button>';
    } catch (e) {}
}
// 显式探针：一次 24-token 的 "hi"，问「这个模型在**我们实际发送的档位下**推理吗」。
// 缓存纪律与 xportLocalContext 完全一致（60 秒）。任何失败都当「不知道」处理，绝不报错。
//
// 【B2 改了什么，为什么必须改】原来这个探针刻意**不带** reasoning_effort。B2 落地后
// 真实请求每次都显式带档位，而实测「省略 = 关闭」—— 探针再省略，量的就是一个本应用
// 根本不会使用的配置，结论恒为「不推理」，等于把探针变成一句空话。现在探针发的档位与
// 真实请求逐字相同：设为「关」时它验证的是「显式 none 之后是否仍在推理」（那才是真异常），
// 设为其它档位时它验证的是这个档位是否真的生效。缓存键因此必须带上档位，否则改完设置
// 会读到 60 秒前另一个档位的结论。
const xportThinkProbeCache = new Map();
async function xportProbeThinking(baseUrl, model) {
    let effort = 'none';
    try { effort = xportWireEffort(baseUrl, model); } catch (e) { effort = 'none'; }
    const key = String(baseUrl) + '|' + String(model) + '|' + effort;
    const hit = xportThinkProbeCache.get(key);
    if (hit && Date.now() - hit.at < 60000) return hit.on;
    let on = false;
    try {
        const url = String(baseUrl).replace(/\/$/, '') + '/v1/chat/completions';
        const probeBody = { model: model, messages: [{ role: 'user', content: 'hi' }], max_tokens: 24, temperature: 0 };
        if (effort && !xportEffortUnsupported.has(xportCapsOrigin(baseUrl))) probeBody.reasoning_effort = effort;
        const resp = await fetchWithTimeout(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(probeBody)
        }, 15000);
        if (resp.ok) {
            const data = await resp.json();
            on = readLocalChoice(data).thinking;
        }
    } catch (e) { on = false; }
    xportThinkProbeCache.set(key, { on: on, at: Date.now() });
    xportNoteThinking(model, on);
    return on;
}

// ============= A7：公式存活审计 =============
// 【为什么需要它】两份研究里最坏的一次事故是**完全静默**的：qwen3.6 把一整块 635 字符的
// `\begin{equation}\begin{aligned}` 奖励函数定义整个跳过了，返回的 JSON 合法、15 段结构
// 完整、没有任何报错、原文回显覆盖率 0.82。xportBlockOk 看不见它 —— 那一段一个占位符
// 都没有，所有完整性检查都**平凡通过**。合计：3.6 在旧路径上丢了 2/14 个公式（14.3%），
// 3.8 是 0/14。数量对比是唯一能抓住这一类「JSON 合法、分段完整、内容却没了」的手段。
// 契约：**只报警，绝不让翻译失败** —— 「只要有一段成功就绝不抛异常」的约定必须守住。
const XPORT_AUDIT_ENVS = ['equation', 'align', 'aligned', 'gather', 'multline',
    'eqnarray', 'flalign', 'alignat', 'IEEEeqnarray', 'split', 'cases', 'dcases'];
function xportCountEnvs(text) {
    const s = String(text == null ? '' : text);
    let n = 0;
    try {
        const re = new RegExp('\\\\begin\\{(?:' + XPORT_AUDIT_ENVS.join('|') + ')\\*?\\}', 'g');
        let guard = 0;
        while (re.exec(s) && ++guard < 20000) n++;
    } catch (e) { return 0; }
    return n;
}
// 返回 { envIn, envOut, lost, rows }。rows = 该行源文里的公式环境比译文多（0 基下标）。
function xportEquationAudit(srcText, translations) {
    const res = { envIn: 0, envOut: 0, lost: 0, rows: [] };
    try {
        const list = Array.isArray(translations) ? translations : [];
        res.envIn = xportCountEnvs(srcText);
        for (let i = 0; i < list.length; i++) {
            const pair = list[i] || {};
            const a = xportCountEnvs(typeof pair.src === 'string' ? pair.src : '');
            const b = xportCountEnvs(typeof pair.tgt === 'string' ? pair.tgt : '');
            res.envOut += b;
            if (a > b) res.rows.push(i);
        }
        // 【为什么不是单纯的进出差额】差额是**全文级**的，会被互相抵消：一行把 equation
        // 抄了两遍、另一行把 align 整块吞掉时 envIn=envOut=2、差额 0，而 rows 早就知道
        // 第 2 行丢了东西 —— 旧写法在这里一声不吭。逐行丢失才是用户要点 ↻ 重试的单位，
        // 所以取两者的较大值：一行丢两个时差额更大，抵消发生时行数更大，都不会漏报。
        res.lost = Math.max(res.envIn - res.envOut, res.rows.length, 0);
    } catch (e) { return { envIn: 0, envOut: 0, lost: 0, rows: [] }; }
    return res;
}
// 翻译落地后的统一告警口：把「N 段失败」和「N 处公式消失」合并成**一条** toast。
// 分成两次 showToast 会让第二条把第一条顶掉（showToast 走 setState 全量重渲染）。
// 返回 audit 结果，方便调用方记账。
function xportReportAfterTranslate(srcText, translations, failedCount) {
    const audit = xportEquationAudit(srcText, translations);
    try {
        const notes = [];
        if (Number(failedCount) > 0) notes.push(failedCount + ' 段未能翻译，已在对应行标出，可单独点 ↻ 重试');
        if (audit.lost > 0) {
            const where = audit.rows.length
                ? '（第 ' + audit.rows.slice(0, 8).map(function (i) { return i + 1; }).join('、') + ' 行）'
                : '';
            notes.push('有 ' + audit.lost + ' 处公式环境在译文里消失' + where + '，请点 ↻ 单独重试这几行');
            console.warn('xportEquationAudit: equations in=' + audit.envIn + ' out=' + audit.envOut + ' rows=' + JSON.stringify(audit.rows));
        }
        if (notes.length) showToast(notes.join('；'), 'warning');
    } catch (e) {}
    return audit;
}

// 标定常数（tests/transport/calibrate.js 实测，两个模型各 4 个真实批次）：
// 掩码后 1 个源字符的**往返** token 成本（prompt 里它自己 + completion 里它的译文）
//   35B：0.526–0.559，均值 0.541 tok/char
//   1.7b：0.524–0.562，均值 0.538 tok/char
// 取 0.8 ≈ 最差实测值的 1.4 倍余量。**不要**再用「按 max_tokens 算余量」那套
// —— 上下文是加载期参数，LM Studio 一重启就回落 4096，必须按现问到的值算。
const XPORT_TOK_PER_CHAR_ROUNDTRIP = 0.8;
const XPORT_CTX_USE = 0.35;       // 只用加载期上下文的 35%：批次之外还有系统提示与安全垫
// 每批 8 段：tests/transport/sweep.js 在 qwen3-1.7b 上实测 4/8/12 段三档的首次通过率
// 分别是 96.4% / 100% / 96.4%，总耗时几乎相同（13.7s / 13.0s / 13.1s）；35B 三档全 100%。
// 8 是唯一两个模型都不掉块的档位，且请求数只有 4 段档的一半。
const XPORT_SEGS_PER_BATCH = 8;
async function xportLimits(config) {
    if (config.provider !== 'local') {
        // 在线模型上下文远大于任何一批，真正的约束是「一次让模型编号多少段还不出错」
        return { chars: 5000, segs: XPORT_SEGS_PER_BATCH, ph: 60, recovery: 4 };
    }
    let ctx = 0;
    try { ctx = await xportLocalContext(config.localBaseUrl, config.model); } catch (e) { ctx = 0; }
    // 问不到就按「LM Studio 刚重启、上下文 4096」这个最坏情况算
    if (!ctx) ctx = 4096;
    const base = Math.min(8000, Math.floor(ctx * XPORT_CTX_USE / XPORT_TOK_PER_CHAR_ROUNDTRIP));
    // B2：推理开着时字符预算减半。XPORT_TOK_PER_CHAR_ROUNDTRIP = 0.8 是在**不推理**的
    // 前提下标定的；开着推理时 completion token 有约 92% 花在推理上（实测 qwen3.6），
    // 再按原预算装批就是在主动制造截断。关着时 mul = 1，逐字等于原来的算式。
    let mul = 1;
    try { mul = (xportWireEffort(config.localBaseUrl, config.model) === 'none') ? 1 : 0.5; } catch (e) { mul = 1; }
    const chars = Math.max(600, Math.floor(base * mul));
    return { chars: chars, segs: XPORT_SEGS_PER_BATCH, ph: 40, recovery: 8 };
}

// 装批：字符预算、段数、占位符数三条同时约束。任何一条超了就开新批。
function xportPack(masked, limits) {
    const batches = [];
    let cur = [], chars = 0, ph = 0;
    for (let i = 0; i < masked.length; i++) {
        const len = masked[i].text.length;
        const cnt = masked[i].map.length;
        if (cur.length > 0 && (chars + len > limits.chars || cur.length >= limits.segs || ph + cnt > limits.ph)) {
            batches.push(cur); cur = []; chars = 0; ph = 0;
        }
        cur.push(i); chars += len; ph += cnt;
    }
    if (cur.length > 0) batches.push(cur);
    return batches;
}

// outMeta（可选，末位）：调用方想看 finish_reason / thinking / 推理 token 数时传一个空对象进来。
// 不传的调用方逐字不受影响 —— 这是为了让恢复阶梯能判断「这次失败是不是推理导致的」，
// 而不必再开第二套「上一次响应」的全局状态（见 spec §6.5）。
async function xportRequest(items, srcName, tgtName, config, signal, outMeta) {
    const user = items.map((it, i) => '@@' + (i + 1) + '@@\n' + it.text).join('\n\n');
    const sys = xportSystemPrompt(srcName, tgtName, config.provider);
    // 出参：finish_reason === 'length' / 'MAX_TOKENS' 时 meta.truncated = true
    const meta = (outMeta && typeof outMeta === 'object') ? outMeta : {};
    let raw;
    if (config.provider === 'local') {
        raw = await callLocalLLM(config.localBaseUrl, config.model,
            [{ role: 'system', content: sys }, { role: 'user', content: user }], false, signal, meta);
    } else {
        raw = await callGeminiAPI(config.model, user,
            { systemInstruction: sys, temperature: 0.3 }, config.geminiApiKey, signal, meta);
    }
    return xportParseBlocks(raw, items.length, meta.truncated === true);
}

// 阶梯最后一级：退回**现行 JSON 协议**翻这一段。结果最差也就等于今天的已知行为，
// 不可能更糟；而只要哨兵协议成功，这一级根本不会被触发。
async function xportLegacyOne(seg, srcName, tgtName, config, signal) {
    const systemPrompt = `You are a professional academic translator.
1. Split input into logical sentences/segments.
2. Translate ${srcName} to ${tgtName}.
3. Keep LaTeX math/citations intact.
4. You MUST return ONLY valid JSON: {"translations": [{"src": "Original 1", "tgt": "Translated 1"}]}
5. Do NOT include any text before or after the JSON.`;
    let data;
    if (config.provider === 'local') {
        // 阶梯的最后一级正是「模型已经在乱来」的时候才会跑到 —— A4 的分类必须落在这里，
        // 否则最后一根横杆保留着原来那条什么都不说的报错（见 spec §6.3）。
        const meta = {};
        const r = await callLocalLLM(config.localBaseUrl, config.model,
            [{ role: 'system', content: systemPrompt }, { role: 'user', content: seg }], false, signal, meta);
        data = parseLocalJson(r, meta);
    } else {
        const r = await callGeminiAPI(config.model, seg, {
            systemInstruction: systemPrompt,
            responseMimeType: 'application/json',
            responseSchema: {
                type: "OBJECT",
                properties: {
                    translations: {
                        type: "ARRAY",
                        items: { type: "OBJECT", properties: { src: { type: "STRING" }, tgt: { type: "STRING" } }, required: ["src", "tgt"] }
                    }
                },
                required: ["translations"]
            }
        }, config.geminiApiKey, signal);
        data = JSON.parse(r || '{}');
    }
    const arr = (data && Array.isArray(data.translations)) ? data.translations : [];
    const parts = [];
    for (let i = 0; i < arr.length; i++) {
        const t = arr[i] && arr[i].tgt;
        if (typeof t === 'string' && t.trim()) parts.push(t.trim());
    }
    return parts.length ? parts.join(' ') : null;
}

// 单段恢复阶梯。每一级都**改变了请求内容**——实测占位符丢失是确定性的，
// 重发同样的请求 6/6 次丢同样的 token，所以「原样重试」被刻意排除在外。
async function xportRecoverSegment(mm, rawSeg, wasBatched, srcName, tgtName, config, signal, spend) {
    // 级 1：从批次里单独拎出来重发（只有原来确实同批时才算「变了」）
    if (wasBatched && spend()) {
        try {
            const blocks = await xportRequest([mm], srcName, tgtName, config, signal);
            const body = blocks[1];
            if (body != null && xportBlockOk(body, mm.map)) return { tgt: xportUnmask(body, mm.map), via: 'isolate' };
        } catch (err) { if (err && err.name === 'AbortError') throw err; }
    }
    // 级 2：把这一段再切开，降低单次请求的占位符密度、换掉边界
    const parts = xportSplitSegment(rawSeg);
    if (parts.length > 1 && spend()) {
        try {
            const pm = parts.map(xportMask);
            const blocks = await xportRequest(pm, srcName, tgtName, config, signal);
            const pieces = [];
            let ok = true;
            for (let i = 0; i < pm.length; i++) {
                const body = blocks[i + 1];
                if (body != null && xportBlockOk(body, pm[i].map)) pieces.push(xportUnmask(body, pm[i].map));
                else { ok = false; break; }
            }
            if (ok) return { tgt: pieces.join(' '), via: 'split' };
        } catch (err) { if (err && err.name === 'AbortError') throw err; }
    }
    // 级 3：退回旧协议
    if (spend()) {
        try {
            const legacy = await xportLegacyOne(rawSeg, srcName, tgtName, config, signal);
            if (legacy) return { tgt: legacy, via: 'legacy' };
        } catch (err) { if (err && err.name === 'AbortError') throw err; }
    }
    return null;
}

// 哨兵协议只对**本次实测过**的两条链路生效：本地 LM Studio 与 Gemini。
// OpenAI / Claude 保持今天一模一样的行为 —— 上一版正是因为「代码写了但没测」被否，
// 这里不重复那个错误。开关关掉则全部回到现行协议。
function xportActive(config) {
    try {
        if (!AppState.sentinelTransport) return false;
        return config.provider === 'local' || config.provider === 'gemini';
    } catch (e) { return false; }
}

// 返回值与 translateBulk 完全同形（{translations:[{src,tgt}]}），外加统计字段。
// 契约：**只要有一段成功就绝不抛异常** —— 已交付的内容永远不会因为后面某一段失败而消失。
async function translateViaSentinel(text, srcLang, tgtLang, config, signal) {
    const srcName = srcLang === 'zh' ? 'Chinese' : 'English';
    const tgtName = tgtLang === 'zh' ? 'Chinese' : 'English';
    const segs = xportSegments(text);
    // 切不出任何一段 = 输入是空白/纯注释。**抛**而不是返回空数组：调用方拿到
    // { translations: [] } 会当成一次成功的翻译，把屏幕上现有的译文整份换成 0 行。
    if (segs.length === 0) throw new Error('没有可翻译的内容（输入为空或只有空白）');

    const masked = segs.map(xportMask);
    const limits = await xportLimits(config);
    const batches = xportPack(masked, limits);
    const tgts = new Array(segs.length).fill(null);
    const via = new Array(segs.length).fill('');
    let firstErr = null;
    let budget = limits.recovery;
    const spend = function () { if (budget <= 0) return false; budget--; return true; };

    for (let b = 0; b < batches.length; b++) {
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const batch = batches[b];
        let blocks = null;
        const bmeta = {};
        try {
            blocks = await xportRequest(batch.map(i => masked[i]), srcName, tgtName, config, signal, bmeta);
        } catch (err) {
            if (err && err.name === 'AbortError') throw err;
            firstErr = firstErr || err;
        }
        const failed = [];
        for (let j = 0; j < batch.length; j++) {
            const si = batch[j];
            const body = blocks ? blocks[j + 1] : null;
            if (body != null && xportBlockOk(body, masked[si].map)) {
                tgts[si] = xportUnmask(body, masked[si].map);
                via[si] = 'batch';
            } else {
                failed.push(si);
            }
        }
        // ---- A3：推理模式下把横幅弹出来，并把它记成**候选报错** ----
        // 【上一版在这里 throw，那是个可测的回归，别再写回去】条件是「这一批整批失败 +
        // 模型在推理 + 到现在一段都没成」，但它**没有**要求后面的批次也会失败。离线对照
        // （HEAD vs 上一版，同一输入同一桩、只有第 1 批不可解析）：HEAD 交付 27/27，
        // 上一版只发了 1 个请求就整轮抛异常、交付 0 —— 本来能翻的整篇文档被扔掉了。
        // 即使悲观情形（每批都不可解析）HEAD 也还能靠阶梯捞回 5 段 + 22 个可见重试标记。
        // 所以这里**不中止**：横幅立刻弹（十秒就能解决问题的那条信息，用户马上看得到），
        // 阶梯照跑，交付照旧。只有当整轮**一段都没成功**时，下面那个 tgts.every(null)
        // 分支才会把这条推理报错抛出去 —— 那时「模型在推理」才是唯一还站得住的线索。
        if (bmeta.thinking === true && failed.length === batch.length) {
            try { xportNoteThinking(config.model, true); } catch (e) {}
            firstErr = firstErr || new Error(xportThinkingMessage(config.model));
        }
        for (let f = 0; f < failed.length; f++) {
            if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
            if (budget <= 0) break;
            const si = failed[f];
            const r = await xportRecoverSegment(masked[si], segs[si], batch.length > 1,
                srcName, tgtName, config, signal, spend);
            if (r) { tgts[si] = r.tgt; via[si] = r.via; }
        }
    }

    if (tgts.every(t => t === null)) {
        // 一段都没成 = 配置 / 连接 / 模型级问题，把原始报错原样上抛（调用方保留旧译文）
        if (firstErr) throw firstErr;
        throw new Error('翻译失败：模型没有返回任何可解析的分段（请检查本地服务器与模型设置）');
    }

    let failedCount = 0;
    const viaCount = {};
    const translations = [];
    for (let i = 0; i < segs.length; i++) {
        const key = via[i] || 'failed';
        viaCount[key] = (viaCount[key] || 0) + 1;
        if (tgts[i] === null) failedCount++;
        translations.push({ src: segs[i], tgt: tgts[i] === null ? XPORT_FAIL_MARK : tgts[i] });
    }
    return { translations: translations, transport: 'sentinel', failedCount: failedCount, viaCount: viaCount, viaRows: via };
}

// ============= 批量翻译 =============
async function translateBulk(text, srcLang, tgtLang, config, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    // 传输期剥离颜色宏（不改动用户原文，仅改动本次发送给模型的副本）
    text = stripTextColorForModel(text);

    // 哨兵传输协议（详见上方大段注释）。开关关掉、或 provider 不在实测范围内时，
    // 下面一行之后的代码与改动前逐字一致。
    if (xportActive(config)) {
        return await translateViaSentinel(text, srcLang, tgtLang, config, signal);
    }

    const srcName = srcLang === 'zh' ? 'Chinese' : 'English';
    const tgtName = tgtLang === 'zh' ? 'Chinese' : 'English';

    const systemPrompt = `You are a professional academic translator. 
1. Split input into logical sentences/segments.
2. Translate ${srcName} to ${tgtName}.
3. Keep LaTeX math/citations intact.
4. You MUST return ONLY valid JSON: {"translations": [{"src": "Original 1", "tgt": "Translated 1"}]}
5. Do NOT include any text before or after the JSON.`;

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            false, // 不使用json_mode，让模型自由返回
            signal,
            meta
        );
        return parseLocalJson(response, meta);
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { jsonMode: true },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            translations: {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        src: { type: "STRING" },
                        tgt: { type: "STRING" }
                    },
                    required: ["src", "tgt"]
                }
            }
        },
        required: ["translations"]
    };

    const response = await callGeminiAPI(config.model, text, {
        systemInstruction: systemPrompt,
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey, signal);

    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    return JSON.parse(response || "{}");
}

// ============= 句子精炼 =============
async function refineSentence(text, lang, type, config, instruction = null, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    let prompt = "";

    if (type === "grammar") {
        const baseInst = instruction || `${DEFAULT_GRAMMAR_PROMPT} (Language: ${lang === 'zh' ? 'Chinese' : 'English'})`;
        prompt = `${baseInst}

IMPORTANT RULES:
1. If there are grammar errors, return ONLY the corrected sentence.
2. If the text is already grammatically correct, return exactly: [NO_CHANGES]
3. Do NOT explain or describe what you did. Return ONLY the corrected text or [NO_CHANGES].

Text: "${text}"`;
    } else if (type === "simplify") {
        const baseInst = instruction || `${DEFAULT_SIMPLIFY_PROMPT} (Language: ${lang === 'zh' ? 'Chinese' : 'English'})
CRITICAL RULES:
1. Use common vocabulary.
2. STRICTLY PRESERVE all LaTeX math (e.g., $x_i$, \\xi_k), citations (e.g., [1]), and serial numbers (e.g., 1., (a)) exactly as they are.`;
        prompt = `${baseInst}\n3. Return ONLY the rewritten sentence.\nOriginal Text: "${text}"`;
    } else if (type === "custom") {
        prompt = `Rewrite the following ${lang === 'zh' ? 'Chinese' : 'English'} sentence based on this instruction: "${instruction}". Return ONLY the rewritten sentence.\n\nText: "${text}"`;
    }

    if (config.provider === 'local') {
        return await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false,
            signal
        );
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return response?.trim() || text;
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return response?.trim() || text;
    }

    // Gemini Path
    const response = await callGeminiAPI(config.model, prompt, { temperature: 0.3 }, config.geminiApiKey, signal);
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    return response?.trim() || text;
}

// ============= 智能更新 =============
async function getSmartUpdate(prompt, config, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    const systemPrompt = "You update translations intelligently. Return valid JSON only.";

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt + "\n\nRETURN JSON: {\"text\": \"...\"}" }
            ],
            false, // 不使用json_mode
            signal,
            meta
        );
        // 这条链路按既有行为**吞掉**失败（返回空串 = 不改动用户的译文），所以 A4 的分类
        // 只落到 console：把「推理吃光预算」和「真的没输出」在排查时分开，UI 行为一字不变。
        try {
            const data = parseLocalJson(response, meta);
            return data.text || "";
        } catch (e) { console.warn('getSmartUpdate: ' + (e && e.code ? e.code : '') + ' ' + (e && e.message)); return ""; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt + "\n\nRETURN JSON: {\"text\": \"...\"}" }
            ],
            { jsonMode: true },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        try {
            const data = parseJsonResponse(response);
            return data.text || "";
        } catch (e) { return ""; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt + "\n\nRETURN JSON: {\"text\": \"...\"}" }
            ],
            { temperature: 0.3 },
            config.claudeApiKey,
            signal,
            config.claudeProxyUrl
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        try {
            const data = parseJsonResponse(response);
            return data.text || "";
        } catch (e) { return ""; }
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            text: { type: "STRING" }
        },
        required: ["text"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey, signal);

    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
    const data = JSON.parse(response || "{}");
    return data.text || "";
}

// ============= 获取同义词 =============
// mode: 'replace'（学术同义替换，默认）| 'simplify'（简化：更常用、更直白的说法）
// signal: 可选的 AbortSignal，只走本地链路的第 5 个位置参数（callLocalLLM 的既有形参）。
// 在线三家的签名一个字节都没动。
async function getSynonyms(sentence, selectedText, lang, config, avoidList = [], mode = 'replace', signal = null) {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT include any of the following words/phrases in your output: ${JSON.stringify(avoidList)}. Find DIFFERENT alternatives.`
        : "";

    const prompt = mode === 'simplify' ? `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 SIMPLER, more common, and more direct alternatives for the "Selected Text".
1. If "Selected Text" is a single word, replace rare, obscure, or overly formal words with common, everyday equivalents.
2. If "Selected Text" is a phrase, clause, or full sentence, rewrite it in plainer, more direct, and more concise language that conveys the SAME meaning.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by simplicity and commonness (most common and most direct first).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }` : `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 distinct, academic-style alternatives for the "Selected Text".
1. If "Selected Text" is a single word, provide synonyms.
2. If "Selected Text" is a phrase, clause, or full sentence, provide rephrased versions that convey the SAME meaning and function within the context.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by Semantic Proximity (closest meaning first, then slightly more varied).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }`;

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false, // 不使用json_mode
            signal,
            meta
        );
        // 同 getSmartUpdate：吞掉失败是既有行为（弹窗显示「没有候选」），
        // A4 的分类只进 console —— 这条链路上 UI 一字不变。
        try {
            const data = parseLocalJson(response, meta, { arrayKey: 'alternatives' });
            return data.alternatives || [];
        } catch (e) { console.warn('getSynonyms: ' + (e && e.code ? e.code : '') + ' ' + (e && e.message)); return []; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            const data = parseJsonResponse(response, { arrayKey: 'alternatives' });
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            const data = parseJsonResponse(response, { arrayKey: 'alternatives' });
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey);

    const data = JSON.parse(response || "{}");
    return data.alternatives || [];
}

// ============= 语法修正（选词弹窗第三个模式）=============
// 与 getSynonyms 是平级的兄弟函数。之所以单独开一个而不是塞进 getSynonyms：
// 语法模式的响应形状本质不同（要么「正确」，要么「N 条改写 + 原因」），
// 硬塞回 string[] 只能靠哨兵值伪装，反而更容易在渲染路径上炸。
// 返回值形状固定：
//   { status: 'correct'|'issues'|'empty'|'parse', issue: string, scope: 'selection'|'sentence', alternatives: string[] }
// —— 这里绝不 throw 解析错误，调用方拿到 status 就能给出可见文案。
// scope 决定这批 alternatives 该替换掉哪一段：'selection' = 只换选中的词，'sentence' = 换掉整句。
// 它必须跟着建议一起走，绝不能在应用时再猜一次。

// 两段文本在语法意义上算不算「同一句话」。
// 只归一化空白：大小写、标点在语法里是有意义的，不能抹平。
function isSameGrammarText(a, b) {
    const na = (typeof a === 'string' ? a : '').trim().replace(/\s+/g, ' ');
    const nb = (typeof b === 'string' ? b : '').trim().replace(/\s+/g, ' ');
    return na === nb;
}

// 只归一化空白。tier-1 判据（选区外逐字未变）用它。
function collapseWs(s) {
    return (typeof s === 'string' ? s : '').trim().replace(/\s+/g, ' ');
}
// 只保留「承载语法的词序列」：LaTeX 命令名、{}$~\、全部标点、引号/破折号变体、
// 大小写、空白一律抹平；词的替换/增删会保留下来 —— 那才是「错在选区外」的样子。
// 三个非 ASCII 字符集刻意写成 \u 转义（同 CHAT_MD_TILDE 的理由：裸字符肉眼查不出来）：
//   ‐-― = 连字符/各种破折号，‘’ʼ = 弯撇号，“” = 弯双引号。
function grammarKey(s) {
    return String(s == null ? '' : s)
        .replace(/\\textcolor\s*\{[^{}]*\}/g, ' ')   // \textcolor{blue}{X} → X（颜色参数不是语法）
        .replace(/\\[a-zA-Z]+\s*(\[[^\]]*\])?/g, ' ')
        .replace(/[{}$~\\]/g, ' ')
        .toLowerCase()
        .replace(/[\u2010-\u2015]/g, '-')
        .replace(/[\u2018\u2019\u02BC]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[^a-z0-9'\-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}
// derived 是从 corrected_sentence 里裁出来的。模型自己的修正稿偶尔会把选区开头
// 重复一遍（实测 c25 / p15L：选区 "Willie rewards, $R^{J}$" → derived
// "Willie rewards, Willie rewards, $R^{W}$"），排在第一位就是把一条看得见的
// 坏选项推到用户鼻子底下。这种情况**不删只降权**，让模型自己的候选先上。
// 实测：散文语料 146 条 tier-1 行 0 次误伤；数学语料 12 条里命中 3 条。
function grammarDerivedLooksDuplicated(sel, der) {
    const a = collapseWs(sel), b = collapseWs(der);
    if (!a || !b || b.length <= a.length) return false;
    for (let L = Math.min(a.length, 12); L >= 6; L--) {
        const p = a.slice(0, L);
        if (b.indexOf(p) === 0 && b.indexOf(p, 1) > 0) return true;
    }
    return false;
}

// 去空、去重、压成字符串数组
function normalizeGrammarList(raw) {
    const arr = Array.isArray(raw) ? raw : [];
    const seen = {};
    const out = [];
    for (let i = 0; i < arr.length; i++) {
        const v = arr[i];
        const str = (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
        if (!str) continue;
        if (seen[str]) continue; // 弱模型（如 qwen3-1.7b）实测会把同一条重复三遍
        seen[str] = true;
        out.push(str);
    }
    return out;
}

// 把模型返回的任意脏数据压成固定形状
// baseline: { selectedText, sentenceText, head, tail }
//   sentenceText 为空串 = 本次没有可用的整句范围 → 整句改写一律丢弃，只允许词级替换。
//   （没有范围却应用整句改写，就会把一整句塞进一个词的位置。）
//   head/tail = 整句里选区前后的两截；两者都在时用来判定「模型的修正稿动没动到选区之外」。
//
// 返回形状固定为 { status, issue, scope, alternatives, sentenceIssue, sentenceOffer }。
// 后两个是**附带提议**通道（「整句别处还有问题」），只有新 prompt 的两判定契约会填，
// 而且永远是二等公民 —— 它绝不会顶掉用户真正问的那段选区的答案。
function normalizeGrammarPayload(data, baseline) {
    const d = (data && typeof data === 'object') ? data : {};
    const base = (baseline && typeof baseline === 'object') ? baseline : {};
    const selectedText = typeof base.selectedText === 'string' ? base.selectedText : '';
    const sentenceText = typeof base.sentenceText === 'string' ? base.sentenceText : '';
    const head = typeof base.head === 'string' ? base.head : null;
    const tail = typeof base.tail === 'string' ? base.tail : null;

    // 「换了等于没换」的选项一律丢掉：实测模型会把原词原样列进候选里（results → results）
    const spanAlternatives = normalizeGrammarList(d.alternatives)
        .filter(v => !isSameGrammarText(v, selectedText));

    const corrected = typeof d.corrected_sentence === 'string' ? d.corrected_sentence.trim() : '';

    // 两判定契约（buildGrammarPrompt 现在要的形状）：focus_correct 只回答「**选区**对不对」，
    // sentence_issue / sentence_alternatives 说的是句子别处的毛病，改走附带提议通道。
    // **只有模型真的回了 focus_correct 才启用**：老形状（只有 correct）逐字走下面同一条阶梯，
    // 这样 1286 份历史响应的离线重放数字仍然可比，Gemini/旧缓存也不会走进没量过的分支。
    let focusCorrect = null;
    if (typeof d.focus_correct === 'boolean') focusCorrect = d.focus_correct;
    else if (typeof d.focus_correct === 'string' && d.focus_correct.trim()) {
        focusCorrect = /^(true|yes|correct)$/i.test(d.focus_correct.trim());
    }
    const twoVerdict = focusCorrect !== null;

    const rawSentenceList = normalizeGrammarList(
        d.sentence_alternatives != null ? d.sentence_alternatives : d.sentenceAlternatives);

    // 附带提议只在两判定契约下存在，而且必须真有整句范围才谈得上「整句改写」
    const offerList = (twoVerdict && sentenceText)
        ? rawSentenceList.filter(v => !isSameGrammarText(v, sentenceText))
        : [];
    const sentenceIssue = (twoVerdict && typeof d.sentence_issue === 'string') ? d.sentence_issue.trim() : '';

    // 主答案能用的整句池。两判定契约下 sentence_alternatives 已经改走提议通道了，
    // 主答案只认模型自己的 corrected_sentence。
    const sentenceAlternatives = sentenceText
        ? normalizeGrammarList((twoVerdict ? [] : rawSentenceList).concat(corrected ? [corrected] : []))
            .filter(v => !isSameGrammarText(v, sentenceText))
        : [];

    let issue = '';
    if (typeof d.issue === 'string') issue = d.issue.trim();
    else if (typeof d.reason === 'string') issue = d.reason.trim();

    // 所有出口共用一个收口：主答案已经是整句改写时，附带提议不再挂上去
    //（同一件事说两遍只会互相打架，而且 applySynonym 的范围只有一个）。
    const fin = function (status, scope, alternatives) {
        const sentScope = scope === 'sentence';
        return {
            status: status,
            issue: status === 'correct' ? '' : issue,
            scope: sentScope ? 'sentence' : 'selection',
            alternatives: alternatives,
            sentenceIssue: sentScope ? '' : sentenceIssue,
            sentenceOffer: sentScope ? [] : offerList
        };
    };

    // 「语法正确」必须有模型的明确表态才敢下结论。
    // 响应是 null / 数组 / 缺字段时一律算 'empty'——绝不能把一次失败的请求显示成「语法正确」。
    let correct = false;
    if (typeof d.correct === 'boolean') correct = d.correct;
    else if (typeof d.correct === 'string') correct = /^(true|yes|correct)$/i.test(d.correct.trim());
    if (twoVerdict) correct = focusCorrect;      // 新契约下由 focus_correct 说了算

    if (correct) return fin('correct', 'selection', []);

    // 交叉核对（放宽版）：问题不是「词级候选能不能逐字复现模型的整句修正稿」，
    // 而是「模型自己的修正稿有没有动到选区**以外**、且是语法意义上的改动」。
    //   动了 → 这个错必须出选区才能修，整句改写是应得的；
    //   没动 → 模型的修正稿本身就是一个词级修复，那就留在选区，并且把真正的
    //          替换串**从 corrected_sentence 里取出来**（实测：模型给的 alternatives
    //          经常只替换多词选区里的一部分，"these decision" → ["decisions"]，
    //          把 "these" 悄悄吞掉；corrected_sentence 里的那一段才是完整的）。
    // 改动前那条严格判据（head + alt + tail === corrected_sentence，逐字比整句）
    // 实测把 76.5% 的完美词级答案判死（17 条手工构造的载荷里 13 条），
    // 而且 74.5% 的整句改写就是它逼出来的。
    let tier = 0, derived = null;
    if (corrected && head !== null && tail !== null) {
        const c = collapseWs(corrected), h = collapseWs(head), t = collapseWs(tail);
        if ((h === '' || c.indexOf(h) === 0) && (t === '' || c.lastIndexOf(t) === c.length - t.length)
            && c.length >= h.length + t.length) {
            tier = 1;                                   // 选区外逐字未变
            derived = collapseWs(c.slice(h.length, c.length - t.length));
        } else {
            const kc = grammarKey(corrected), kh = grammarKey(head), kt = grammarKey(tail);
            // tier 2：抹掉 LaTeX 命令名/标点/大小写之后仍然一致 = 选区外没有**语法**改动。
            // tier 3：选区外真的换了词 —— 这才是 e3a4a7a 当初要抓的那种（c33 「These works」
            //         的 corrected_sentence 把选区外的 demonstrates 改成了 demonstrate）。
            tier = ((kh === '' || kc.indexOf(kh) === 0)
                 && (kt === '' || kc.lastIndexOf(kt) === kc.length - kt.length)
                 && kc.length >= kh.length + kt.length) ? 2 : 3;
        }
    }

    const scopeHint = typeof d.scope === 'string' ? d.scope.trim().toLowerCase() : '';

    // 两判定契约下「我要改整句」必须先说得出理由：outside_fix 得是选区**之外**真实存在的一段。
    // 说得出 → 直接升级，附带提议就是主答案；说不出 → 一路往下，最后落回选区。
    // 有歧义时默认永远是选区，这是整条阶梯的默认方向。
    const wantsSentence = twoVerdict && scopeHint === 'sentence';
    const reason = wantsSentence && typeof d.outside_fix === 'string' ? d.outside_fix.trim() : '';
    const reasonValid = !!reason
        && ((head === null ? '' : head) + ' ' + (tail === null ? '' : tail)).indexOf(reason) !== -1;
    if (wantsSentence && reasonValid && offerList.length > 0) return fin('issues', 'sentence', offerList);

    if (tier === 1) {
        const out = [];
        const push = function (v) {
            if (v && !isSameGrammarText(v, selectedText)
                && !out.some(x => isSameGrammarText(x, v))) out.push(v);
        };
        // derived 默认排第一（实测：把还原出正确答案的选项放进第 1 格，44/45 → 40/45 对
        // 27/30 → 20/30，差 22 个百分点）；只有它看起来是「选区开头被重复了一遍」时才降到末位。
        const demote = !!derived && grammarDerivedLooksDuplicated(selectedText, derived);
        if (derived && !demote) push(derived);
        for (let i = 0; i < spanAlternatives.length; i++) push(spanAlternatives[i]);
        if (derived && demote) push(derived);
        if (out.length > 0) return fin('issues', 'selection', out);
    }
    if (tier === 2 && spanAlternatives.length > 0) return fin('issues', 'selection', spanAlternatives);
    // 说不出理由的整句请求，到这里就被驳回：有词级候选就用词级候选。
    if (wantsSentence && !reasonValid && spanAlternatives.length > 0) return fin('issues', 'selection', spanAlternatives);
    if (scopeHint === 'sentence' && sentenceAlternatives.length > 0) return fin('issues', 'sentence', sentenceAlternatives);
    if (tier === 3 && sentenceAlternatives.length > 0) return fin('issues', 'sentence', sentenceAlternatives);
    // tier 0（模型压根没给 corrected_sentence）**必须**能走到这条选区出口。
    // 抢救上线后 48/86 的载荷都是这个形状；把这一条「简化」掉就等于把它们全推去整句改写。
    if (spanAlternatives.length > 0) return fin('issues', 'selection', spanAlternatives);
    if (sentenceAlternatives.length > 0) return fin('issues', 'sentence', sentenceAlternatives);
    return fin('empty', 'selection', []);
}

// spanOnly = true：没有可用的整句范围，只能要词级替换（模型不许提整句改写）
//
// 【为什么整个 prompt 重写了】改动前第一句是
// 「Check the grammar of the WHOLE "Sentence", paying special attention to the "Focus"」——
// 于是用户选中一个本身没毛病的词、而错在句子别处时，模型**完全按吩咐办事**，回一份整句改写。
// 实测这一类 22/24 = 91.7% 被升级成整句，其中 82% 是模型自己选的 scope:"sentence"，
// 客户端再怎么放宽判据都碰不到它。用户抱怨的就是这一条。
//
// 现在的形状（两判定契约）：
//   focus_correct           —— 整句全部校对之后，只回答「用户选的这段是不是其中一个错、
//                              或者是某个错的另一半」；这是主答案。**判定的作用域是选区，
//                              阅读的范围仍然是整句**——这两件事不能一起收窄，见下面第 1 条的实测。
//   scope / alternatives    —— 选区错了怎么修；默认 selection，sentence 必须「挣来」。
//   outside_fix             —— 要 sentence 就必须点名选区**之外**那段要改的字，
//                              说不出来就退回 selection（normalizeGrammarPayload 会核对）。
//   sentence_issue / sentence_alternatives —— 句子别处的毛病，**附带提议**，
//                              永远不顶掉 focus 的判定（客户端把它放进第二行，用户点了才生效）。
// 另外明确列出「什么算语法错误」，把 partial adaptive / adapt its monitor decisions 这类
// 词形错误钉死为语法问题 —— 少了这一条模型会把它读成用词偏好，直接答「语法正确」。
//
// 【第 1 条改过两轮，两轮都是量出来的，别再凭手感动它】
// 第一版写的是「First judge the FOCUS ONLY … EVEN IF some other part of the Sentence is wrong」。
// 实测代价：模型干脆不去读句子别处了，于是**选区是错误的另一半**时它照答 focus_correct=true，
// 屏幕上就是一颗绿勾。24 条 LaTeX 语料 x 2 次 x 自己那一版的构建
//（node .claude/tmp/combined/verify-prompt-fix.js，原始数据同名 .jsonl / .log）：
//   假「语法正确」(class ii+iii)     HEAD 0/36    第一版 9/36 (25.0%)   现在 2/36 (5.6%)
//   不必要的整句升级 (class i+ii)    HEAD 13/32   第一版 2/32           现在 2/32
//   class-ii 首选项就能修好          HEAD 5/20    第一版 18/20          现在 17/20
//   class-iii 修复稿就是主答案       HEAD 7/16    第一版 6/16           现在 10/16
// 两处改动分别对应两个实测出来的洞：
//   (a) 第 1 条现在**先整句校对、再判选区**（HEAD 的顺序），因为 HEAD 从没漏过错；
//       只把「判定的作用域」收窄到选区，不把「阅读的范围」也收窄。
//   (b) 第 4 条的 sentence 分支原来只要 outside_fix，**没说改写稿放哪** ——
//       而客户端读的是 sentence_alternatives。少这一句，升级上去的那一页拿到的
//       是第 5 条那个「与选区无关的别处问题」的改写稿，修的往往不是用户问的那个错。
// 【仍然没修好、且不是客户端能修的】两个错的句子（"The results shows … outperform …"，
// 选中 "results"）：主答案 0/4 次是完整修复，HEAD 是 3/4。这是两判定契约的**设计后果**
// 而不是 bug —— 用户问的是 "results"，主答案就只修 "results" 那一处，另一处走
// 「整句还有问题」那一行（4 次里 2 次可点开拿到完整修复）。要让主答案永远修全句，
// 就得退回 HEAD 那套「问一个词、改一整句」，而那正是本轮 91.7% 过度升级的来源。
function buildGrammarPrompt(sentence, selectedText, lang, avoidInstruction, spanOnly) {
    const scopeRules = spanOnly
        ? `4. Only the "selection" scope exists here. If the Focus is wrong, set "scope": "selection" and put 3-5 DISTINCT replacements for the WHOLE Focus string in "alternatives". Leave "sentence_alternatives" and "outside_fix" empty.`
        : `4. If the Focus is wrong, pick the scope. The DEFAULT is "selection"; "sentence" must be earned.
   - "scope": "selection" - the error can be repaired by rewriting the Focus alone. Put 3-5 DISTINCT replacements in "alternatives". Each alternative replaces the ENTIRE Focus string, so COPY THROUGH the parts of the Focus that are already correct and change only what is wrong; never return a replacement for a word that is not inside the Focus. Set "corrected_sentence" to the Sentence with alternatives[0] substituted for the Focus and EVERY OTHER CHARACTER copied verbatim. Leave "outside_fix" empty.
   - "scope": "sentence" - the Focus is PART OF an error that cannot be repaired inside the Focus (for example the Focus is the subject and the verb outside it disagrees). You MUST set "outside_fix" to the exact substring, taken from OUTSIDE the Focus, that has to change, AND put 3-5 DISTINCT fully corrected versions of the ENTIRE Sentence in "sentence_alternatives"; each version must repair EVERY error in the Sentence, not only the one nearest the Focus. If you cannot name an outside_fix, use "selection" instead.`;

    return `Sentence: "${sentence}"
Focus (the exact substring the user selected, inside the Sentence): "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Act as a strict academic proofreader. The user is asking about the "Focus". The rest of the "Sentence" is CONTEXT.
1. FIRST proofread the WHOLE Sentence and find every grammar error in it - do this even when the Focus looks fine, because the error is often outside the Focus. THEN judge the FOCUS against that list: set "focus_correct": false if the Focus is itself one of those errors, OR is one half of one (a subject whose verb outside the Focus does not agree with it, a verb whose subject does not agree, a noun whose article or number does not match). Set "focus_correct": true ONLY when every error you found lies in a part of the Sentence that the Focus has no grammatical relationship with.
2. If "focus_correct" is true, set "scope": "none", an empty "issue", an empty "alternatives" and an empty "corrected_sentence". Do NOT invent stylistic rewrites of a correct Focus.
3. If "focus_correct" is false, give a SHORT "issue" (one clause naming the error in or around the Focus).
${scopeRules}
5. SEPARATELY, and ONLY when "scope" is not "sentence": if some OTHER part of the Sentence - a part the Focus is not involved in - has a grammar error, describe it in one clause in "sentence_issue" and put 2-3 fully corrected versions of the ENTIRE Sentence in "sentence_alternatives". If the rest of the Sentence is clean, leave both empty. This is an aside for the user to accept or ignore; it never replaces the Focus verdict.
6. What counts as a grammar error: subject-verb agreement, number, tense, verb form, article, MISSING OR WRONG WORD FORM (an adjective where an adverb is required - "partial adaptive"; a bare noun where a gerund or participle is required - "adapt its monitor decisions"; a base verb after a modal that needs a participle), and malformed construction. A wrong word FORM is a grammar error even when the intended word is obvious. What does NOT count: stylistic tone, synonym preference, hyphenation preference, pronoun gender, terminology choice and formatting.
7. NEVER output an option identical to the text it would replace. Keep the original meaning and academic tone. Reproduce LaTeX commands, math and citations exactly as given.
8. ${avoidInstruction}

Return JSON: { "focus_correct": true, "issue": "", "scope": "none", "alternatives": [], "corrected_sentence": "", "sentence_issue": "", "sentence_alternatives": [], "outside_fix": "" }`;
}

// 解析失败的统一出口。**必须把 code 带出去**：改动前六个失败码在弹窗里塌成同一句
// 「模型未返回可用结果（响应为空或 JSON 解析失败）」，补救办法一个字都没有；
// BAD_ESCAPE 和 THINKING_ATE_BUDGET 的做法完全不同，混在一起等于什么都没说。
function grammarParseFailure(e) {
    const code = (e && typeof e.code === 'string') ? e.code : 'UNPARSEABLE';
    console.warn('getGrammarSuggestions: ' + code + ' ' + (e && e.message));
    return { status: 'parse', code: code, issue: '', scope: 'selection',
             alternatives: [], sentenceIssue: '', sentenceOffer: [] };
}

// sentence: 拿去分析的那一句（有整句范围时 = 整句；没有时 = 原来的整行上下文，并强制 spanOnly）
// splice: { head, tail } = 整句里选区前后的两截，用于交叉核对；缺省则不做核对
// signal: 同 getSynonyms —— 只透传给本地链路 callLocalLLM 的第 5 个位置参数。
async function getGrammarSuggestions(sentence, selectedText, lang, config, avoidList = [], spanOnly = false, splice = null, signal = null) {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT repeat any of the following corrections: ${JSON.stringify(avoidList)}. Propose DIFFERENT wordings of the fix.`
        : "";

    const prompt = buildGrammarPrompt(sentence, selectedText, lang, avoidInstruction, spanOnly);
    // 判重基准：spanOnly 时没有整句范围，sentenceText 必须留空，整句候选会被全部丢弃
    const sp = (!spanOnly && splice && typeof splice === 'object') ? splice : {};
    const baseline = {
        selectedText: selectedText,
        sentenceText: spanOnly ? '' : sentence,
        head: typeof sp.head === 'string' ? sp.head : null,
        tail: typeof sp.tail === 'string' ? sp.tail : null
    };

    if (config.provider === 'local') {
        const meta = {};
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false, // 不使用json_mode（与 getSynonyms 保持一致）
            signal,
            meta
        );
        // A4 分出来的码现在跟着返回值一起走到弹窗（grammarParseFailure），不再只进 console。
        try {
            return normalizeGrammarPayload(parseLocalJson(response, meta, { arrayKey: 'alternatives' }), baseline);
        } catch (e) {
            return grammarParseFailure(e);
        }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response, { arrayKey: 'alternatives' }), baseline);
        } catch (e) { return grammarParseFailure(e); }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response, { arrayKey: 'alternatives' }), baseline);
        } catch (e) { return grammarParseFailure(e); }
    }

    // Gemini Path
    // ⚠️ 未经实测：本环境没有 Gemini API Key，下面的 schema 只做过代码审查，没有真跑过一次请求。
    // schema 必须跟着 prompt 一起换成两判定形状（focus_correct / outside_fix / sentence_issue），
    // 否则 responseSchema 会强制模型回一个 prompt 里根本没提的 `correct` 字段。
    // 即使 schema 被 Gemini 拒绝或字段缺失，normalizeGrammarPayload 也只会退回
    // 'empty' / 词级替换（focus_correct 不在场时它逐字走老阶梯），不会拿不存在的范围去替换文本。
    const responseSchema = {
        type: "OBJECT",
        properties: {
            focus_correct: { type: "BOOLEAN" },
            issue: { type: "STRING" },
            scope: { type: "STRING" },
            corrected_sentence: { type: "STRING" },
            outside_fix: { type: "STRING" },
            sentence_issue: { type: "STRING" },
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            },
            sentence_alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["focus_correct", "issue", "scope", "corrected_sentence", "outside_fix", "sentence_issue", "alternatives", "sentence_alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey);

    try {
        return normalizeGrammarPayload(JSON.parse(response || "{}"), baseline);
    } catch (e) { return grammarParseFailure(e); }
}

// 选词弹窗统一取数入口：三个模式共用一个返回形状
// { alternatives: string[], note: {status,issue,scope,code,sentenceIssue,sentenceOffer}|null }。
// note 只有语法模式才有；另外两个模式保持原样走 getSynonyms（返回值契约一个字节都没动）。
// grammarScope: getGrammarScopeContext() 的产物 { sentence, head, tail }；
//   传 null 或 sentence 为空 = 没算出可靠的句子范围，语法模式退化成词级分析（等同改动前的行为）。
// signal: 可选的 AbortSignal（三个取数入口各自持有一个，见 AppState.synonymAbort）。
async function fetchSynonymOptions(mode, sentence, selectedText, lang, config, avoidList, grammarScope, signal) {
    const m = normalizeSynonymMode(mode);
    const avoid = Array.isArray(avoidList) ? avoidList : [];
    const sig = signal || null;

    if (m === 'grammar') {
        const gs = (grammarScope && typeof grammarScope === 'object') ? grammarScope : {};
        const useSentence = (typeof gs.sentence === 'string' && gs.sentence.trim()) ? gs.sentence : null;
        const result = await getGrammarSuggestions(
            useSentence || sentence, selectedText, lang, config, avoid, !useSentence,
            { head: gs.head, tail: gs.tail }, sig
        );
        // status:'empty' 改动前**连一行 console 都没有** —— 模型明明答了，是客户端把候选
        // 全过滤掉了（全部与原文相同），而屏幕上写的却是「响应为空或 JSON 解析失败」。
        // 这里补一行诊断；屏幕上的文案见 renderSynonymPopupOnly。
        if (result.status === 'empty') {
            console.warn('getGrammarSuggestions: EMPTY_AFTER_FILTER 模型有回应，但所有候选都与原文相同（选区='
                + JSON.stringify(selectedText) + '）');
        }
        return {
            alternatives: Array.isArray(result.alternatives) ? result.alternatives : [],
            // 这个投影是唯一的收口：多一个键都要在这里加，不然弹窗永远看不到。
            note: {
                status: result.status,
                issue: result.issue,
                scope: result.scope === 'sentence' ? 'sentence' : 'selection',
                code: typeof result.code === 'string' ? result.code : '',
                sentenceIssue: typeof result.sentenceIssue === 'string' ? result.sentenceIssue : '',
                sentenceOffer: Array.isArray(result.sentenceOffer) ? result.sentenceOffer : []
            }
        };
    }

    const alternatives = await getSynonyms(sentence, selectedText, lang, config, avoid, m, sig);
    return { alternatives: Array.isArray(alternatives) ? alternatives : [], note: null };
}

// ============= 文本摘要 =============
// ⚠️ 唯一的调用者 handleSummary 已随 Insight 功能一起删除，这个函数现在没有人调。
// 之所以**没有**跟着删：它的第三个分支里有 5 行属于 Claude 调用路径
// （`// Claude Path` / `if (config.provider === 'claude') {` / `await callClaudeAPI(` /
//  `config.claudeApiKey,` / `config.claudeProxyUrl`），而本仓库对 Claude 路径的硬约束是
// 「相对上一次提交零删除、零修改，只允许新增」。删掉它会让这几行的出现次数各少一次，
// 直接踩线。等 Claude 路径的约束解除、或由维护者显式确认后再删。
// 新代码请一律用 callModelPlainText（它是这套分支形状的更好版本：全程传 signal 可取消）。
async function summarizeText(text, config) {
    const prompt = `总结:\n${text}`;

    if (config.provider === 'local') {
        return await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }]
        );
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            {},
            config.openaiApiKey
        );
        return response || "";
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            {},
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        return response || "";
    }

    // Gemini Path
    const response = await callGeminiAPI(config.model, prompt, {}, config.geminiApiKey);
    return response || "";
}
