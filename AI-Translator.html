// ============= 辅助函数 =============
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 属性上下文专用。escapeHtml() 走 textContent→innerHTML，**不转义引号**，
// 所以 attr="${escapeHtml(x)}" 里只要 x 含一个 " 就能闭合属性并注入 onmouseover= 之类。
// 受影响的是「非白名单」变量：芯片 title 里的 errMsg（来自厂商 API 的 error.message，远端可控）
// 和搜索框 value（用户输入，且 setSettingsModelQuery 渲染后会主动 focus）。
function escapeAttr(value) {
    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============= 在线模型目录派生层 =============
// 全 UI（Settings 勾选框、模型下拉、顶栏标签、页脚状态）都只消费这里，不再有第二份 id 列表。
// 合并规则：DEFAULT_MODEL_CATALOG 打底 → API 结果按 id upsert（保留种子的 sub/tier/short）
//          → 种子里有但 API 没返回的打 retired 标记（**只打标不删**：可能只是这个 project key
//            没启用该模型，或列表接口有滞后）→ 最后钉住当前选中项，保证下拉永不丢失正在用的模型。
const MODEL_ICON_CLASS = {
    gemini: { lite: 'text-emerald-500', fast: 'text-orange-500', pro: 'text-indigo-600' },
    openai: { lite: 'text-teal-500',    fast: 'text-green-500',  pro: 'text-sky-600'   },
    claude: { lite: 'text-amber-500',   fast: 'text-orange-600', pro: 'text-rose-600'  }
};

// 给 API 拉回来的陌生模型猜一个档位（只影响图标和配色）
function classifyModelTier(id) {
    const s = String(id).toLowerCase();
    if (/nano|lite|haiku/.test(s)) return 'lite';
    if (/mini|flash|sonnet/.test(s)) return 'fast';
    return 'pro';
}

function decorateModel(entry) {
    const tier = entry.tier || classifyModelTier(entry.id);
    const palette = MODEL_ICON_CLASS[entry.provider] || MODEL_ICON_CLASS.gemini;
    return {
        ...entry,
        tier,
        sub: entry.sub || (entry.group === 'other' ? '未验证是否支持对话' : '来自 API'),
        icon: tier === 'lite' ? Icons.Rocket : (tier === 'fast' ? Icons.Zap : Icons.Cpu),
        iconClass: palette[tier] || 'text-slate-500',
        price: getModelPrice(entry.id)   // null = 不在内置价格表里，两处渲染点都要按「价格未知」兜底
    };
}

// 某个 provider 的完整目录
function getModelCatalog(provider) {
    const map = new Map();
    DEFAULT_MODEL_CATALOG
        .filter(m => m.provider === provider)
        .forEach(m => map.set(m.id, { ...m, builtin: true, retired: false, group: 'chat' }));

    const fetched = (AppState.fetchedModels && AppState.fetchedModels[provider]) || [];
    if (fetched.length > 0) {
        const fetchedIds = new Set(fetched.map(m => m.id));
        // 种子里有、这次 API 没返回的 → 标 retired，但保留（可能只是没权限/接口滞后）
        Array.from(map.keys()).forEach(k => {
            if (!fetchedIds.has(k)) map.set(k, { ...map.get(k), retired: true });
        });
        fetched.forEach(m => {
            const old = map.get(m.id);
            map.set(m.id, {
                id: m.id,
                name: m.name || (old && old.name) || m.id,
                sub: (old && old.sub) || '',
                short: (old && old.short) || '',
                tier: (old && old.tier) || '',
                provider: provider,
                group: m.group || 'chat',
                created: m.created || '',
                builtin: !!(old && old.builtin),
                retired: false
            });
        });
    }

    // 钉住：用户当前正在用的模型永远不会从下拉里消失。
    // 刻意**不自动切换** selectedModel —— /v1/models 不是权威（project key 的模型白名单会过滤输出、
    // 新模型有收录延迟、Gemini 的 Model schema 里根本没有 deprecated 字段）。
    if (AppState.apiProvider === provider && AppState.selectedModel && !map.has(AppState.selectedModel)) {
        const pinnedId = sanitizeModelId(AppState.selectedModel);
        if (pinnedId) {
            map.set(pinnedId, {
                id: pinnedId, name: pinnedId, sub: '未在列表中（仍可用）', short: '',
                provider: provider, group: 'chat', builtin: false, retired: true, pinned: true
            });
        }
    }

    return Array.from(map.values()).map(decorateModel);
}

// 「正在使用的模型永不从下拉里消失」。getModelCatalog 的 pinned 只在选中模型**不在** map 里
// 时才成立，而最常见的情况恰恰是它还在目录里（只是被标了 retired）—— 那时 pinned 为 false，
// 「隐藏所有未在 API 列表中的模型」/「全不选」会把它一起隐藏，用户再也切不回来。
// 所以钉住判定必须在这一层做，而不是只依赖 pinned。
function isPinnedModel(provider, m) {
    return !!m.pinned || (provider === AppState.apiProvider && m.id === AppState.selectedModel);
}

function getVisibleModels(provider) {
    return getModelCatalog(provider)
        .filter(m => isPinnedModel(provider, m) || AppState.modelVisibility[m.id] !== false);
}

function getModelMeta(id) {
    for (let i = 0; i < MODEL_PROVIDERS.length; i++) {
        const hit = getModelCatalog(MODEL_PROVIDERS[i]).find(m => m.id === id);
        if (hit) return hit;
    }
    const local = (AppState.localModels || []).find(lm => lm.id === id);
    return local
        ? { id: local.id, name: local.id, sub: '', tier: '', provider: 'local', icon: Icons.Server, iconClass: 'text-indigo-600' }
        : null;
}

// 顶栏按钮的短标签。内置模型直接用目录里的 short（保证与重构前逐字一致），
// API 新模型退化为「去掉厂商前缀 + 超 15 字截断」。
function getModelShortLabel(id) {
    const meta = getModelMeta(id);
    if (meta && meta.short) return meta.short;
    const fallback = String(id || '');
    let label = (meta && meta.name) || fallback;
    label = label.replace(/^(Google\s+)?(Gemini|ChatGPT|GPT|Claude)[\s-]*/i, '').trim() || fallback;
    return label.length > 15 ? label.slice(0, 15) + '...' : label;
}

// 相对时间：刚刚 / N 分钟前 / N 小时前 / M/D HH:mm
function formatModelRefreshTime(ts) {
    if (!ts) return '从未更新';
    const diff = Date.now() - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return `${Math.floor(diff / 60000)} 分钟前`;
    if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / 3600000)} 小时前`;
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 缓存是否超过 TTL —— 只用来改文案，绝不清空数据
function isModelCatalogStale(provider) {
    const st = AppState.modelRefresh[provider];
    return !!(st && st.at && (Date.now() - st.at) > MODEL_CATALOG_TTL);
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
}

// 弹窗位置自动调整函数
function adjustPopupPosition(popupId, padding = 10) {
    requestAnimationFrame(() => {
        const popup = document.getElementById(popupId);
        if (!popup) return;

        const rect = popup.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // 检查右边是否超出
        if (rect.right > viewportWidth - padding) {
            const overflow = rect.right - viewportWidth + padding;
            popup.style.transform = `translateX(-${overflow}px)`;
        }

        // 检查左边是否超出
        if (rect.left < padding) {
            popup.style.left = `${padding}px`;
            popup.style.right = 'auto';
        }

        // 检查底部是否超出
        if (rect.bottom > viewportHeight - padding) {
            // 如果底部超出，尝试显示在上方
            popup.style.top = 'auto';
            popup.style.bottom = '100%';
            popup.style.marginTop = '0';
            popup.style.marginBottom = '8px';
        }
    });
}

// 渲染后调整所有弹窗位置
function adjustAllPopups() {
    ['modelMenuPopup', 'historyMenuPopup', 'saveMenuPopup', 'synonymPopup'].forEach(id => {
        adjustPopupPosition(id);
    });
}

// ============= 主渲染函数 =============
function renderApp(preserveScroll = true) {
    // 保存滚动位置
    let savedSourceScroll = 0, savedTargetScroll = 0;
    if (preserveScroll) {
        const sourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
        const targetContainer = document.querySelector('section:last-of-type .overflow-y-auto');
        savedSourceScroll = sourceContainer ? sourceContainer.scrollTop : 0;
        savedTargetScroll = targetContainer ? targetContainer.scrollTop : 0;
    }

    const root = document.getElementById('root');
    root.innerHTML = `
        <div class="min-h-screen bg-slate-50 flex flex-col p-4 md:p-6 max-w-[1600px] mx-auto w-full">
            ${renderErrorBanner()}
            ${renderSettingsModal()}
            ${renderLocalSettingsModal()}
            ${renderSynonymPopup()}
            ${renderToast()}
            ${renderHeader()}
            ${renderMainWorkspace()}
            ${renderFooter()}
        </div>
    `;
    attachEventListeners();

    // 同义词弹窗独立渲染到 body（避免被 root 内容替换影响）
    renderSynonymPopupOnly();

    // 同步恢复滚动位置（不使用 requestAnimationFrame，避免多次渲染时的竞态条件）
    if (preserveScroll) {
        const newSourceContainer = document.querySelector('section:first-of-type .overflow-y-auto');
        const newTargetContainer = document.querySelector('section:last-of-type .overflow-y-auto');
        if (newSourceContainer) newSourceContainer.scrollTop = savedSourceScroll;
        if (newTargetContainer) newTargetContainer.scrollTop = savedTargetScroll;
    }

    // 渲染后调整弹窗位置
    adjustAllPopups();
}

// ============= 错误横幅 =============
function renderErrorBanner() {
    if (!AppState.error) return '';
    return `
        <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-4 max-w-lg">
            ${Icons.AlertCircle}
            <span class="text-xs font-medium">${escapeHtml(AppState.error)}</span>
            <button onclick="setState({error:null})" class="ml-2 hover:bg-rose-100 p-1 rounded-full">${Icons.XSmall}</button>
        </div>
    `;
}

// ============= Toast 提示框 =============
function renderToast() {
    if (!AppState.toast) return '';

    const bgColor = {
        'success': 'bg-emerald-50 border-emerald-200 text-emerald-700',
        'warning': 'bg-amber-50 border-amber-200 text-amber-700',
        'info': 'bg-blue-50 border-blue-200 text-blue-700'
    }[AppState.toast.type] || 'bg-slate-50 border-slate-200 text-slate-700';

    return `
        <div class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] ${bgColor} border px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 backdrop-blur-sm bg-opacity-95 transition-all duration-300" onclick="setState({toast:null})">
            <span class="text-sm font-medium">${escapeHtml(AppState.toast.message)}</span>
        </div>
    `;
}

// ============= 在线模型区块的渲染辅助 =============
// 单个 provider 的状态芯片（含独立 ⟳ 只重试这一家）
function renderModelRefreshChip(group) {
    const st = group.state || {};
    const stale = isModelCatalogStale(group.provider);
    let dotClass = 'bg-slate-300';
    let text = '使用内置列表';
    let title = '';
    if (st.status === 'loading') {
        dotClass = 'bg-violet-500 animate-pulse';
        text = '正在获取...';
    } else if (st.status === 'error') {
        const soft = (st.errCode === 'NO_KEY' || st.errCode === 'EMPTY');
        dotClass = soft ? 'bg-amber-400' : 'bg-rose-500';
        text = MODEL_ERROR_TEXT[st.errCode] || '更新失败';
        title = st.errMsg || '';
    } else if (st.status === 'ok') {
        dotClass = stale ? 'bg-amber-400' : 'bg-emerald-500';
        text = `${st.count} 个 · ${formatModelRefreshTime(st.at)}`
             + (st.source === 'cache' ? ' · 缓存' : '')
             + (stale ? ' · 已过期' : '');
        title = stale ? '距上次更新已超过 7 天，建议重新更新' : '';
    }
    return `
        <span class="inline-flex items-center gap-1.5 px-2 py-1 bg-slate-50 border border-slate-200 rounded-lg text-[10px] text-slate-500" title="${escapeAttr(title)}">
            <span class="w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}"></span>
            <span class="font-semibold text-slate-600">${group.label}</span>
            <span class="truncate max-w-[150px]">${escapeHtml(text)}</span>
            <button onclick="refreshOnlineModelsClick('${group.provider}')" ${st.status === 'loading' ? 'disabled' : ''} class="text-slate-400 hover:text-violet-600 disabled:opacity-40" title="只更新这一家">${Icons.RefreshCw}</button>
        </span>
    `;
}

// 单个在线模型的勾选行
function renderOnlineModelCheckbox(m) {
    const locked = isPinnedModel(m.provider, m);   // 正在使用的模型不允许隐藏
    const visible = locked || AppState.modelVisibility[m.id] !== false;
    const bg = visible
        ? (m.provider === 'claude' ? 'bg-orange-50' : (m.provider === 'openai' ? 'bg-sky-50' : 'bg-indigo-50'))
        : '';
    let badge = '';
    if (locked) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-amber-100 text-amber-700 font-bold shrink-0" title="${escapeAttr(m.pinned ? '正在使用，未在 API 列表中但仍可调用' : '正在使用中，不可隐藏')}">使用中</span>`;
    } else if (m.retired) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-100 text-slate-500 font-bold shrink-0" title="上次更新时 API 没有返回这个模型（可能已下线，也可能是该 Key/项目没有权限）">未在列表</span>`;
    } else if (m.group === 'other') {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-100 text-slate-500 font-bold shrink-0" title="新家族，未验证是否支持对话">?</span>`;
    } else if ((AppState.newlyFoundIds || []).indexOf(m.id) >= 0) {
        badge = `<span class="text-[8px] px-1 py-0.5 rounded bg-violet-100 text-violet-700 font-bold shrink-0">NEW</span>`;
    }
    // 价格挪到名字下面单独一行；同一行里再放模型的原始 id（等宽小字，超长时省略号 + title 兜底），
    // 这样「用户实际调用时要认的 id」和「价格」都可见，不用再靠悬停才能读到完整模型名。
    const priceLine = `<span class="text-[9px] text-slate-400 font-mono shrink-0" title="${escapeAttr(formatPriceTitle(m.price))}">${escapeHtml(formatPriceCompact(m.price))}</span>`;
    const idLine = `<span class="text-[9px] text-slate-400 font-mono truncate min-w-0 flex-1" title="${escapeAttr(m.id)}">${escapeHtml(m.id)}</span>`;
    return `
        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-all ${bg}" title="${escapeHtml(m.id)}">
            <input type="checkbox" ${visible ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="toggleModelVisibility('${escapeHtml(m.id)}')" class="w-4 h-4 mt-0.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 shrink-0">
            <span class="flex flex-col min-w-0 flex-1 gap-0.5">
                <span class="flex items-start gap-1 min-w-0">
                    <span class="text-xs font-medium ${m.iconClass} break-words leading-snug min-w-0 flex-1">${escapeHtml(m.name)}</span>
                    ${badge}
                </span>
                <span class="flex items-center gap-1.5 min-w-0">
                    ${idLine}
                    ${priceLine}
                </span>
            </span>
        </label>
    `;
}

// ============= 设置模态框 =============
function renderSettingsModal() {
    if (!AppState.showSettings) return '';

    // 在线模型全部来自 getModelCatalog()（种子 + API + 钉住当前选中项），不再有硬编码数组
    const modelQuery = (AppState.settingsModelQuery || '').trim().toLowerCase();
    const anyRefreshing = MODEL_PROVIDERS.some(p => AppState.modelRefresh[p].status === 'loading');
    const onlineGroups = MODEL_PROVIDERS.map(p => ({
        provider: p,
        label: MODEL_PROVIDER_LABEL[p],
        state: AppState.modelRefresh[p],
        models: getModelCatalog(p).filter(m => !modelQuery
            || m.id.toLowerCase().includes(modelQuery)
            || String(m.name || '').toLowerCase().includes(modelQuery))
    }));
    const totalOnline = onlineGroups.reduce((n, g) => n + g.models.length, 0);
    // modelGroupExpanded 理论上恒为 {gemini,openai,claude} 形状的对象（见 openSettings/openLocalSettings），
    // 但防御性兜底：万一它是 null/undefined/非对象，下面按 g.provider 取值会直接抛错，而 renderApp()
    // 是先把整段 innerHTML 拼完才赋值的，拼接期间抛错会让页面冻结在上一帧、之后每次点击都再抛一次，
    // 不刷新页面救不回来。所以这里兜底成 {}，配合 toggleModelGroup 里的写兜底一起生效。
    const gexp = (AppState.modelGroupExpanded && typeof AppState.modelGroupExpanded === 'object') ? AppState.modelGroupExpanded : {};

    // 拖拽中优先用「正在进行时」的宽度（避免拖拽途中被 toast/刷新等异步 setState 弹回上次已提交的值），
    // 否则用 AppState 里持久化的宽度；两者都经过夹紧，且渲染时再叠一层 CSS min(...,95vw) 防止在
    // 小窗口/加载了过大的历史 localStorage 值时把弹窗撑出视口。
    const settingsModalWidthPx = settingsModalDragWidth != null
        ? clampSettingsModalWidth(settingsModalDragWidth)
        : clampSettingsModalWidth(AppState.settingsModalWidth);

    return `
        <div class="fixed inset-0 z-[100] bg-black/20 backdrop-blur-sm flex items-center justify-center p-4">
            <div id="settingsModalPanel" class="relative bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-h-[90vh] overflow-hidden flex flex-col" style="max-width:min(${settingsModalWidthPx}px, 95vw);">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 shrink-0">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        ${Icons.SettingsGear} Settings
                    </h3>
                    <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600">${Icons.X}</button>
                </div>
                <!-- mr-2.5 = 拖拽手柄的 w-2.5：把整个滚动容器（连同它右内缘那条 6px 的 custom-scrollbar）
                     整体左移 10px 让开手柄，否则手柄会把滚动条整条盖住、鼠标拖不动滚动条。
                     右内边距用 pr-4 而非 p-6 的 pr-6，把让出去的 10px 视觉上补回来。 -->
                <div class="pt-6 pb-6 pl-6 pr-4 mr-2.5 space-y-6 overflow-y-auto custom-scrollbar flex-1 min-h-0">
                    <!-- Online Model Visibility Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-white">
                                    ${Icons.Globe}
                                </div>
                                <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Online Models Visibility</span>
                            </div>
                            <button onclick="refreshOnlineModelsClick('all')" ${anyRefreshing ? 'disabled' : ''} class="flex items-center gap-1.5 px-3 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-bold text-[10px] shadow-md shadow-violet-200 active:scale-95 transition-all disabled:opacity-50 shrink-0">
                                ${anyRefreshing ? Icons.LoaderSmall : Icons.RefreshCw}
                                ${anyRefreshing ? '更新中...' : '更新 / Refresh'}
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mb-3">从各家 API 拉取最新模型列表，勾选哪些出现在模型选择器里。当前共 ${totalOnline} 个。</p>

                        <!-- 三家状态芯片：每家独立结算，可单独重试 -->
                        <div class="flex flex-wrap gap-1.5 mb-3">
                            ${onlineGroups.map(g => renderModelRefreshChip(g)).join('')}
                        </div>

                        <!-- 搜索 + 日期快照开关 -->
                        <div class="flex items-center gap-2 mb-3">
                            <div class="flex-grow flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus-within:ring-2 focus-within:ring-violet-100 transition-all">
                                <input type="text" id="modelSearchInput" oninput="setSettingsModelQuery(this.value)" value="${escapeAttr(AppState.settingsModelQuery)}" placeholder="搜索模型 id / 名称..." class="flex-grow bg-transparent border-none text-xs focus:ring-0 p-0 text-slate-700 outline-none">
                                ${AppState.settingsModelQuery ? `<button onclick="setSettingsModelQuery('')" class="text-slate-400 hover:text-slate-600 ml-2">${Icons.XSmall}</button>` : ''}
                            </div>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-500 cursor-pointer whitespace-nowrap" title="OpenAI 的 gpt-x-2026-03-17 这类固定快照，勾上后下次更新才会拉进来">
                                <input type="checkbox" ${AppState.showDatedSnapshots ? 'checked' : ''} onchange="toggleDatedSnapshots()" class="w-3.5 h-3.5 rounded border-slate-300 text-violet-600 focus:ring-violet-500">
                                日期快照
                            </label>
                        </div>

                        ${AppState.newlyFoundIds.length > 0 ? `
                            <div class="flex items-center justify-between gap-2 mb-3 px-3 py-2 bg-violet-50 border border-violet-100 rounded-xl">
                                <span class="text-[10px] text-violet-700 font-semibold">本次新发现 ${AppState.newlyFoundIds.length} 个模型（默认隐藏）</span>
                                <button onclick="showAllNewlyFoundModels()" class="text-[10px] font-bold text-violet-600 hover:text-violet-800 underline shrink-0">全部显示</button>
                            </div>
                        ` : ''}

                        ${onlineGroups.map(g => {
                            // 折叠规则：折叠时只渲染「已勾选 / 钉住中 / 当前有搜索词」的行；
                            // 展开时渲染全部。onlineGroups.models 本身已经按搜索词过滤过了（2862-2864），
                            // 所以有搜索词时这里的 hasQuery 分支会让整组直接等于 g.models —— 折叠形同虚设，
                            // 这正是「搜索必须能找到被折叠隐藏的模型」这条要求本身的自然结果。
                            const expanded = !!gexp[g.provider];
                            const hasQuery = !!modelQuery;
                            // 必须和下面 rows 的行渲染判据保持同一个谓词（pinned OR 搜索命中 OR 展开 OR 已勾选），
                            // 否则折叠态下 header 的 (checked/total) 分数会和屏幕上实际渲染的行数对不上——
                            // 比如一个「当前选中但用户取消勾选」的钉住模型，行里会渲染成勾选+disabled，
                            // 但旧写法不算它进 checkedCount，就会出现「header 写 0/44，下面却有一行勾选着」。
                            const checkedCount = g.models.filter(m => isPinnedModel(g.provider, m) || AppState.modelVisibility[m.id] !== false).length;
                            const rows = g.models.filter(m =>
                                isPinnedModel(g.provider, m)
                                || hasQuery
                                || expanded
                                || AppState.modelVisibility[m.id] !== false
                            );
                            const hiddenCount = g.models.length - rows.length; // hasQuery 时恒为 0
                            // 因为搜索而多出现的「未勾选」行数，用来在搜索态下提示「这些是折叠状态下平时看不到的」
                            const searchRevealedCount = hasQuery && !expanded
                                ? rows.filter(m => !isPinnedModel(g.provider, m) && AppState.modelVisibility[m.id] === false).length
                                : 0;
                            // 有搜索词时折叠被短路（全部匹配项都显示），此时 chevron 若还去翻
                            // modelGroupExpanded 会是「点了没反应、清空搜索后却莫名变展开」的陷阱。
                            // 所以搜索态下把它改成「退出搜索」——和它此刻显示的 180° 朝向语义一致。
                            const chevronAction = hasQuery
                                ? `setSettingsModelQuery('')`
                                : `toggleModelGroup('${g.provider}')`;
                            const chevronTitle = hasQuery
                                ? (expanded ? '搜索模式：点击退出搜索' : '搜索模式：点击退出搜索，回到折叠视图')
                                : (expanded ? '收起，仅显示已勾选的模型' : (hiddenCount > 0 ? `展开查看全部 ${g.models.length} 个模型` : '展开 / 收起'));
                            return `
                            <div class="mb-3">
                                <div class="flex items-center justify-between px-1 mb-1.5">
                                    <span class="flex items-center gap-1.5 min-w-0">
                                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wide">${g.label} ${hasQuery ? `（搜索命中 ${g.models.length}）` : `(${checkedCount}/${g.models.length})`}</span>
                                        ${g.models.length > 0 ? `
                                        <button onclick="${chevronAction}" class="flex items-center gap-1 text-slate-400 hover:text-violet-600 transition-colors shrink-0" title="${escapeAttr(chevronTitle)}">
                                            <span class="inline-flex transition-transform duration-200 ${(expanded || hasQuery) ? 'rotate-180' : ''}">${Icons.ChevronDown}</span>
                                            ${!hasQuery && !expanded && hiddenCount > 0 ? `<span class="text-[9px] font-semibold text-slate-400">还有 ${hiddenCount} 个</span>` : ''}
                                        </button>
                                        ` : ''}
                                    </span>
                                    <span class="flex items-center gap-2 shrink-0">
                                        <button onclick="setModelVisibilityBulk('${g.provider}', true)" class="text-[10px] text-slate-400 hover:text-violet-600">全选</button>
                                        <button onclick="setModelVisibilityBulk('${g.provider}', false)" class="text-[10px] text-slate-400 hover:text-violet-600">全不选</button>
                                    </span>
                                </div>
                                ${g.models.length === 0 ? `
                                    <p class="text-[10px] text-slate-400 italic px-1">${modelQuery ? '没有匹配的模型。' : '暂无模型。'}</p>
                                ` : rows.length === 0 ? `
                                    <p class="text-[10px] text-slate-400 italic px-1 cursor-pointer hover:text-violet-600" onclick="toggleModelGroup('${g.provider}')">未勾选任何模型 · 点击展开选择</p>
                                ` : `
                                    ${searchRevealedCount > 0 ? `<p class="text-[9px] text-violet-500 italic px-1 mb-1">搜索已临时显示 ${searchRevealedCount} 个折叠中的模型</p>` : ''}
                                    <div class="grid grid-cols-2 gap-2 ${rows.length > 8 ? 'max-h-80 overflow-y-auto custom-scrollbar pr-1' : ''}">
                                        ${rows.map(m => renderOnlineModelCheckbox(m)).join('')}
                                    </div>
                                `}
                            </div>
                        `; }).join('')}

                        <button onclick="hideRetiredModels()" class="w-full mt-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl font-bold text-[10px] transition-all">
                            隐藏所有「未在 API 列表中」的模型
                        </button>

                        <p class="text-[9px] text-slate-400 mt-2 leading-relaxed">
                            价格口径：<b>美元（USD）／每 1,000,000 tokens</b>，付费层<b>标准档</b>（非 Batch / Flex / Priority）；「入」= 输入价，「出」= 输出价；
                            带 <b>*</b> 的是厂商限时促销价（到期后本表会自动改显恢复价）。多数模型另有速率受限的<b>免费额度</b>，显示价并不等于一定会产生账单。
                            价格为内置表（非 API 实时返回），截至 ${escapeHtml(MODEL_PRICING_AS_OF)}，目前仅收录 Gemini（OpenAI / Claude 待补）。
                            推理/思考 token 按输出价计费、部分模型 prompt 超过 200k tokens 会跳到更高档位——悬停价格可看完整说明。
                        </p>
                    </div>

                    <!-- Local Model Visibility Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-6 h-6 bg-gradient-to-br from-purple-500 to-violet-600 rounded-lg flex items-center justify-center text-white">
                                ${Icons.Server}
                            </div>
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Local Models Visibility</span>
                        </div>
                        ${AppState.localModels.length > 0 ? `
                            <p class="text-[10px] text-slate-400 mb-3">Select which local models to show in the model selector.</p>
                            <div class="space-y-1 max-h-40 overflow-y-auto custom-scrollbar">
                                ${AppState.localModels.map(lm => `
                                    <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-all ${AppState.modelVisibility[lm.id] !== false ? 'bg-purple-50' : ''}" title="${escapeHtml(lm.id)}">
                                        <input type="checkbox" ${AppState.modelVisibility[lm.id] !== false ? 'checked' : ''} onchange="toggleModelVisibility('${escapeHtml(lm.id)}')" class="w-4 h-4 mt-0.5 rounded border-slate-300 text-purple-600 focus:ring-purple-500 shrink-0">
                                        <span class="text-xs font-medium text-purple-600 break-words leading-snug min-w-0 flex-1">${escapeHtml(lm.id)}</span>
                                    </label>
                                `).join('')}
                            </div>
                        ` : `
                            <p class="text-[10px] text-slate-400 italic">No local models available. Connect to LM Studio first.</p>
                        `}
                    </div>

                    <!-- Gemini API Key Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center">
                                <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Google Gemini API</span>
                        </div>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                            <input type="password" id="geminiApiKeyInput" class="flex-grow bg-transparent border-none text-xs focus:ring-0 p-0 ml-2 text-slate-700 outline-none font-mono" value="${escapeHtml(AppState.geminiApiKey)}" placeholder="AIzaSy...">
                            <button onclick="toggleApiKeyVisibility('geminiApiKeyInput')" class="text-slate-400 hover:text-slate-600 ml-2" title="Toggle visibility">
                                ${Icons.Eye}
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-2 px-1">
                            Get your API key from <a href="https://aistudio.google.com/apikey" target="_blank" class="text-indigo-500 hover:underline">Google AI Studio</a>
                        </p>
                        <button onclick="saveGeminiApiKey()" class="w-full mt-3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-2">
                            ${Icons.Save} Save API Key
                        </button>
                    </div>

                    <!-- OpenAI API Key Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-6 h-6 bg-gradient-to-br from-teal-500 to-green-600 rounded-lg flex items-center justify-center">
                                <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.8956zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>
                            </div>
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">OpenAI API</span>
                        </div>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus-within:ring-2 focus-within:ring-teal-100 transition-all">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                            <input type="password" id="openaiApiKeyInput" class="flex-grow bg-transparent border-none text-xs focus:ring-0 p-0 ml-2 text-slate-700 outline-none font-mono" value="${escapeHtml(AppState.openaiApiKey)}" placeholder="sk-...">
                            <button onclick="toggleApiKeyVisibility('openaiApiKeyInput')" class="text-slate-400 hover:text-slate-600 ml-2" title="Toggle visibility">
                                ${Icons.Eye}
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-2 px-1">
                            Get your API key from <a href="https://platform.openai.com/api-keys" target="_blank" class="text-teal-500 hover:underline">OpenAI Platform</a>
                        </p>
                        <button onclick="saveOpenaiApiKey()" class="w-full mt-3 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-teal-200 active:scale-95 transition-all flex items-center justify-center gap-2">
                            ${Icons.Save} Save API Key
                        </button>
                    </div>

                    <!-- Claude API Key Section -->
                    <div class="pb-5 border-b border-slate-100">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-6 h-6 bg-gradient-to-br from-orange-500 to-rose-600 rounded-lg flex items-center justify-center">
                                <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            </div>
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Anthropic Claude API</span>
                        </div>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus-within:ring-2 focus-within:ring-orange-100 transition-all">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                            <input type="password" id="claudeApiKeyInput" class="flex-grow bg-transparent border-none text-xs focus:ring-0 p-0 ml-2 text-slate-700 outline-none font-mono" value="${escapeHtml(AppState.claudeApiKey)}" placeholder="sk-ant-...">
                            <button onclick="toggleApiKeyVisibility('claudeApiKeyInput')" class="text-slate-400 hover:text-slate-600 ml-2" title="Toggle visibility">
                                ${Icons.Eye}
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-2 px-1">

// ============= 事件绑定 =============
function attachEventListeners() {
    // 主输入框
    const mainInput = document.getElementById('mainInput');
    if (mainInput) {
        mainInput.addEventListener('input', (e) => handleInputChange(e.target.value));
    }

    // 编辑文本框
    AppState.translationPairs.forEach((pair, idx) => {
        ['src', 'tgt'].forEach(side => {
            const textarea = document.getElementById(`editTextarea_${side}_${idx}`);
            if (textarea) {
                textarea.addEventListener('input', (e) => {
                    // 只更新状态值，不触发重新渲染
                    AppState.editValues[side] = e.target.value;
                    
                    // 关闭同义词弹窗但不重新渲染整个页面
                    if (AppState.synonymState.show) {
                        AppState.synonymState.show = false;
                        const popup = document.getElementById('synonymPopup');
                        if (popup) popup.remove();
                    }
                    
                    autoResizeTextarea(textarea);
                });
                textarea.addEventListener('mouseup', (e) => handleTextSelect(e, side, idx));
                autoResizeTextarea(textarea);
            }

            const refineInput = document.getElementById(`refineInput_${side}_${idx}`);
            if (refineInput) {
                refineInput.addEventListener('input', (e) => {
                    // 只更新状态，不触发渲染
                    AppState.refinePrompt = e.target.value;
                });
                refineInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        triggerCustomRefine(idx, side);
                    }
                });
            }
        });
    });

    // 全局点击（关闭菜单）
    document.removeEventListener('mousedown', globalClickHandler);
    document.addEventListener('mousedown', globalClickHandler);
}

function globalClickHandler(event) {
    const target = event.target;
    
    // 关闭同义词弹窗
    const synonymPopup = document.getElementById('synonymPopup');
    if (synonymPopup && !synonymPopup.contains(target)) {
        updateSynonymState({ show: false });
    }
    
    // 关闭设置弹窗（如果点击在弹窗外部）
    if (AppState.activeSettingsPopup !== null) {
        const popover = target.closest('.absolute.top-full');
        const settingsButton = target.closest('[onclick*="toggleSettingsPopup"]');
        if (!popover && !settingsButton) {
            closeSettingsPopup();
        }
    }
    
    // 关闭各种菜单
    if (AppState.showModelMenu && !target.closest('[onclick*="toggleModelMenu"]') && !target.closest('.absolute')) {
        AppState.showModelMenu = false;
        renderApp();
    }
    if (AppState.showHistoryMenu && !target.closest('[onclick*="toggleHistoryMenu"]') && !target.closest('.absolute')) {
        AppState.showHistoryMenu = false;
        renderApp();
    }
    if (AppState.showSaveMenu && !target.closest('[onclick*="toggleSaveMenu"]') && !target.closest('.absolute')) {
        AppState.showSaveMenu = false;
        renderApp();
    }
}

function autoResizeTextarea(textarea) {
    if (!textarea) return;
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
}

// Settings 弹窗右边缘拖拽调宽。刻意不走 setState/renderApp——renderSettingsModal() 整段走
// root.innerHTML 重建，拖拽中每次 mousemove 都 setState 会和重渲染打架、肉眼可见地弹回起点。
// 做法：mousedown 记录起点，mousemove 直接把新宽度写进 DOM（每次都用 id 重新查一遍元素，
// 因为拖拽过程中可能被别的异步 setState —— 比如 toast 3 秒后自动消失 —— 整体重渲染一次，
// 之前 mousedown 时拿到的节点引用会变成一个脱离文档树的旧节点，继续写它的 style 不会有任何
// 视觉效果），mouseup 才落盘进 AppState + localStorage。
function startSettingsModalResize(e) {
    e.preventDefault();
    const panel = document.getElementById('settingsModalPanel');
    if (!panel) return;
    const startX = e.clientX;
    const startWidth = panel.getBoundingClientRect().width;
    let finished = false;                       // onUp 幂等哨兵：blur / buttons===0 兜底可能和真 mouseup 重复触发
    document.body.classList.add('is-resizing-settings-modal');

    function onMove(ev) {
        // 兜底 1：鼠标已经松开却还在收 mousemove（在浏览器窗口外松手、右键系统菜单吞掉 mouseup、
        // 拖拽中 Alt-Tab 切窗口）。ev.buttons === 0 是「mouseup 丢了」的确定信号，立刻收尾自愈，
        // 否则 document 上的监听不会解绑，body 的 is-resizing 类会粘死（全局 ew-resize + 禁选中），
        // 并且之后光是移动鼠标就会「幽灵拖拽」改宽度。
        if (ev.buttons === 0) { onUp(); return; }
        const live = document.getElementById('settingsModalPanel');
        if (!live) return;
        const dx = ev.clientX - startX;
        const viewportCap = Math.max(SETTINGS_MODAL_MIN_WIDTH, Math.round(window.innerWidth * 0.95));
        const maxAllowed = Math.min(SETTINGS_MODAL_MAX_WIDTH, viewportCap);
        // 弹窗被 overlay 的 justify-center 水平居中：宽度每增加 2px，右边缘才右移 1px。
        // 所以要让手柄贴住光标，宽度增量必须取 dx * 2，否则手柄会从光标下面「逃走」。
        const newWidth = Math.max(SETTINGS_MODAL_MIN_WIDTH, Math.min(maxAllowed, startWidth + dx * 2));
        live.style.maxWidth = `min(${newWidth}px, 95vw)`;
        settingsModalDragWidth = newWidth;
    }
    function onUp() {
        if (finished) return;
        finished = true;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        window.removeEventListener('blur', onUp);   // 兜底 2 的对称解绑
        document.body.classList.remove('is-resizing-settings-modal');
        if (settingsModalDragWidth != null) {
            const finalWidth = clampSettingsModalWidth(settingsModalDragWidth);
            settingsModalDragWidth = null;
            AppState.settingsModalWidth = finalWidth;
            try {
                localStorage.setItem('settingsModalWidth', String(finalWidth));
            } catch (e) {}
            // 宽度已经通过 AppState 落盘；不需要再 renderApp()——DOM 上的宽度已经是最终值了，
            // 下次任何原因触发的重渲染会自然带上这个持久化后的宽度（见 renderSettingsModal 里
            // 对 settingsModalDragWidth / AppState.settingsModalWidth 的读取）。
        }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    // 兜底 2：拖到窗口外松手 / Alt-Tab 切走时浏览器只给 blur，不给 mouseup。
    window.addEventListener('blur', onUp);
}

// 双击拖拽手柄：恢复默认宽度（同样直接改 DOM + 落盘，不整段重渲染）
function resetSettingsModalWidth() {

    AppState.settingsModalWidth = SETTINGS_MODAL_DEFAULT_WIDTH;

// ============= 初始化 =============
document.addEventListener('DOMContentLoaded', function() {
    // 加载保存的设置
    loadSavedSettings();

    // 初始渲染不需要保留滚动位置
    renderApp(false);

    // 全局点击事件 - 点击空白区域退出编辑模式
    document.addEventListener('click', handleGlobalClick);

    // 自动保存定时器
    setInterval(function() {
        if (AppState.autoSaveInterval > 0 && AppState.translationPairs.length > 0) {
            addToGlobalHistory(AppState.translationPairs, AppState.sessionId);
        }
    }, AppState.autoSaveInterval);

    // 自动翻译防抖（在handleInputChange中处理）
});

// 加载所有保存的设置
function loadSavedSettings() {
    try {
        // 加载 Gemini API Key
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) {
            AppState.geminiApiKey = savedKey;
        }

        // 加载 OpenAI API Key
        const savedOpenaiKey = localStorage.getItem('openaiApiKey');
        if (savedOpenaiKey) {
            AppState.openaiApiKey = savedOpenaiKey;
        }

        // 加载 Claude API Key
        const savedClaudeKey = localStorage.getItem('claudeApiKey');
        if (savedClaudeKey) {
            AppState.claudeApiKey = savedClaudeKey;
        }

        // 加载 Claude Proxy URL
        const savedClaudeProxyUrl = localStorage.getItem('claudeProxyUrl');
        if (savedClaudeProxyUrl) {
            AppState.claudeProxyUrl = savedClaudeProxyUrl;
        }

        // 加载 Local Base URL
        const savedLocalUrl = localStorage.getItem('localBaseUrl');
        if (savedLocalUrl) {
            AppState.localBaseUrl = savedLocalUrl;
        }
        
        // 加载 History Limit
        const savedHistoryLimit = localStorage.getItem('historyLimit');
        if (savedHistoryLimit) {
            AppState.historyLimit = parseInt(savedHistoryLimit) || 5;
        }
        
        // 加载 Auto-Save Interval
        const savedAutoSaveInterval = localStorage.getItem('autoSaveInterval');
        if (savedAutoSaveInterval) {
            AppState.autoSaveInterval = parseInt(savedAutoSaveInterval) || 5 * 60 * 1000;
        }
        
        // 加载 Custom Prompts
        const savedCustomPrompts = localStorage.getItem('customPrompts');
        if (savedCustomPrompts) {
            try {
                const parsed = JSON.parse(savedCustomPrompts);
                AppState.customPrompts = { ...AppState.customPrompts, ...parsed };
            } catch (e) {}
        }
        
        // 加载上次使用的 API Provider 和模型
        const savedApiProvider = localStorage.getItem('apiProvider');
        const savedSelectedModel = localStorage.getItem('selectedModel');
        if (savedApiProvider) {
            AppState.apiProvider = savedApiProvider;
        }
        if (savedSelectedModel) {
            // localStorage 里的 selectedModel 是过滤器的一条绕过旁路：修复前点过 nano-banana 图像模型
            // （gemini-2.5-flash-image-preview 等）的用户，刷新后该 id 会被原样恢复，再被 getModelCatalog
            // 的「钉住」分支塞回 Gemini 下拉，callGeminiAPI 继续拿它去翻译。这里补上同一套判定。
            // 只校验 gemini（openai/claude/local 走各自逻辑，不在本次范围内）。
            const okId = sanitizeModelId(savedSelectedModel)
                && (AppState.apiProvider !== 'gemini' || isGeminiTextChatModelId(savedSelectedModel));
            AppState.selectedModel = okId ? savedSelectedModel : DEFAULT_MODEL_CATALOG[0].id;
        }

        // 加载 Model Visibility 设置
        const savedModelVisibility = localStorage.getItem('modelVisibility');
        if (savedModelVisibility) {
            try {
                const parsed = JSON.parse(savedModelVisibility);
                AppState.modelVisibility = { ...AppState.modelVisibility, ...parsed };
            } catch (e) {}
        }

        // 加载「显示 OpenAI 日期快照」开关
        const savedShowSnapshots = localStorage.getItem('showDatedSnapshots');
        if (savedShowSnapshots === '1') {
            AppState.showDatedSnapshots = true;
        }

        // 加载 Settings 弹窗宽度（拖拽调整后持久化）；clamp 一下防止脏值把弹窗渲染成极端宽/窄
        const savedSettingsModalWidth = localStorage.getItem('settingsModalWidth');
        if (savedSettingsModalWidth) {
            AppState.settingsModalWidth = clampSettingsModalWidth(parseInt(savedSettingsModalWidth, 10));
        }

        // 加载上次从各家 API 拉到的在线模型目录（纯读缓存，不发任何网络请求）
        // 刻意不做启动自动刷新：/v1/models 有限流，且首屏不该依赖网络
        loadOnlineCatalog();

        // 只要有保存的本地地址，就自动尝试连接（获取模型列表）
        if (savedLocalUrl) {
            autoConnectLocal();
        }
    } catch (e) {
        console.warn('Failed to load saved settings:', e);
    }
}

// 自动连接本地 LM Studio（获取模型列表，失败时显示错误提示）
async function autoConnectLocal() {
    try {
        const models = await fetchLocalModels(AppState.localBaseUrl);
        AppState.localModels = models;
        
        // 如果上次使用的是本地模型，检查是否仍然可用
        if (AppState.apiProvider === 'local') {
            const savedModel = localStorage.getItem('selectedModel');
            if (savedModel && models.some(m => m.id === savedModel)) {
                AppState.selectedModel = savedModel;
            } else if (models.length > 0) {
                AppState.selectedModel = models[0].id;
            }
        }
        
        console.log('Auto-connected to local LM Studio:', AppState.localBaseUrl, 'Models:', models.length);
        renderApp();
    } catch (e) {
        // 显示错误提示
        console.warn('Auto-connect to local LM Studio failed:', e.message);
        AppState.localModels = [];
        
        // 如果上次使用的是本地模型但现在连接失败，回退到目录里的第一个在线模型
        if (AppState.apiProvider === 'local') {
            AppState.apiProvider = DEFAULT_MODEL_CATALOG[0].provider;
            AppState.selectedModel = DEFAULT_MODEL_CATALOG[0].id;
        }
        
        // 显示顶部错误提示
        setState({ error: `无法连接到本地服务器 ${AppState.localBaseUrl}。请确保 LM Studio 正在运行。` });
    }
}
