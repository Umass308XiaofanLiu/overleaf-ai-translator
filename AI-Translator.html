            : '（你还没在这里选过，所以暂时跟着翻译模型走；只要选一次，之后就固定下来。）');

    let html = '<div class="aichat-prow">'
        + '<span class="aichat-pgroup" data-tip="' + escapeAttr(modelTip) + '" data-tip-pos="top-start">'
        + '<span class="aichat-plabel">模型</span>'
        + '<select class="aichat-psel" id="aiChatModelSel">' + optHtml + '</select></span>'
        + chatReasoningBarHtml(choice)
        + '<span class="aichat-pspacer"></span>'
        + '<button type="button" class="aichat-pmore' + (ChatState.paramsOpen ? ' is-on' : '') + '" id="aiChatMoreBtn" data-tip="'
        + escapeAttr('展开其余可按请求设置的参数（温度、生成上限、流式、是否回传上一轮思考），'
            + '以及分割线以下「只读」的模型信息。只读那部分是这条参数条最重要的诚实之处：'
            + '上下文长度、preserve_thinking 之类按请求根本设不了，所以它们不会以「可调控件」的样子出现。')
        + '" data-tip-pos="top-end">' + Icons.MoreVertical + '</button>'
        + '</div>';
    if (ChatState.paramsOpen) html += chatMoreBoxHtml(choice);
    return html;
}

function chatRenderParamBar() {
    try {
        const box = document.getElementById('aiChatParams');
        if (!box) return;
        box.innerHTML = chatParamBarHtml();
        chatBindParamBar(box);
    } catch (e) {
        console.error('[chat] param bar render failed', e);
    }
}

function chatBindParamBar(box) {
    const on = function (id, ev, fn) {
        try {
            const el = box.querySelector('#' + id);
            if (el) el.addEventListener(ev, fn);
        } catch (e) {}
    };
    on('aiChatModelSel', 'change', function () { chatSetModel(this.value); });
    on('aiChatThinkOff', 'click', function () { chatSetReasoning('off'); });
    on('aiChatThinkOn', 'click', function () { chatReasoningTurnOn(); });
    on('aiChatLevelSel', 'change', function () { chatSetReasoning(this.value); });
    on('aiChatGemSel', 'change', function () { chatSetGeminiThinking(this.value); });
    on('aiChatMoreBtn', 'click', function () { chatToggleParams(); });
    on('aiChatTempSel', 'change', function () { chatSetTemperature(this.value); });
    on('aiChatMaxSel', 'change', function () { chatSetMaxTokens(this.value); });
    on('aiChatStreamOff', 'click', function () { chatSetStream(false); });
    on('aiChatStreamOn', 'click', function () { chatSetStream(true); });
    on('aiChatKeepOff', 'click', function () { chatSetKeepReasoning(false); });
    on('aiChatKeepOn', 'click', function () { chatSetKeepReasoning(true); });
}

// ============================================================================
// C5 —— 流式（**只**对本地生效）
// ============================================================================
//
// 实测的 SSE 形状（qwen3.6，stream_options:{include_usage:true}）：
//   data: {... "delta":{"role":"assistant","reasoning_content":"Here"} ...}
//   data: {... "delta":{"reasoning_content":"'s"} ...}          ← 思考先流完
//   data: {... "delta":{"content":"OK"} ...}                    ← 然后才是答案，**另一个字段**
//   data: {... "delta":{}, "finish_reason":"stop"|"length" ...}
//   data: {... "choices":[], "usage":{...completion_tokens_details.reasoning_tokens...} ...}
//   data: [DONE]
// 两个通道天生分开 ⇒ 思考区和答案气泡各自流各自的，**零解析启发式**。
//
// 【铁律】==EDIT== 只在收全之后解析一次。半截的修改块绝不允许长出「应用」按钮 ——
// 中止一次流就能写坏用户论文的话，这个功能就成了数据丢失缺陷。
// 中止也不是错误：把已经收到的字留下来，标一句「已停止」，再走**同一个** chatRenderAssistant。
async function chatStreamLocal(config, messages, signal, meta, req, sink) {
    const endpoint = String(config.localBaseUrl || '').replace(/\/$/, '') + '/v1/chat/completions';
    const body = {
        model: config.model || 'local-model',
        messages: messages,
        temperature: (typeof req.temperature === 'number' && isFinite(req.temperature)) ? req.temperature : 0.3,
        max_tokens: req.maxTokens,
        stream: true,
        stream_options: { include_usage: true }
    };
    // 和非流式那条路一样：**永远显式发**（省略 ≡ 关闭推理）。400 闩合上过就一个字节都不发。
    let effortSent = '';
    try {
        if (!xportEffortUnsupported.has(xportCapsOrigin(config.localBaseUrl))
            && XPORT_WIRE_EFFORTS.indexOf(req.reasoningEffort) !== -1) {
            effortSent = req.reasoningEffort;
            body.reasoning_effort = effortSent;
        }
    } catch (e) { effortSent = ''; }

    let text = '', reasoning = '', finish = '', rtok = 0, aborted = false;
    const finishUp = function () {
        if (meta) {
            meta.text = text;
            meta.reasoning = reasoning;
            meta.finish = finish;
            meta.truncated = finish === 'length';
            meta.thinking = reasoning.trim() !== '' || rtok > 0;
            meta.reasoningTokens = rtok;
            meta.reasoningEffortSent = effortSent;
            meta.streamed = true;
            meta.aborted = aborted;
        }
        // 被动探测，和 callLocalLLM 里那一次同样的语义：第三个参数说明「这一次到底要没要推理」，
        // 免得对话开着推理、翻译关着推理时弹出一条「没人要求它却在推理」的假警报。
        try { xportNoteThinking(config.model, (reasoning.trim() !== '' || rtok > 0), effortSent ? (effortSent !== 'none') : undefined); } catch (e) {}
        return text;
    };

    try {
        const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: signal
        });
        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error('API Error: ' + resp.status + ' - ' + errText);
        }
        if (!resp.body || typeof resp.body.getReader !== 'function') {
            throw new Error('这个浏览器/环境不支持读取流式响应。到参数条的 ⋮ 里把「流式」关掉即可。');
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        let done = false;
        for (;;) {
            const r = await reader.read();
            if (r.done) break;
            buf = (buf + dec.decode(r.value, { stream: true })).replace(/\r\n/g, '\n');
            let idx;
            while ((idx = buf.indexOf('\n\n')) !== -1) {
                const frame = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                const lines = frame.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.indexOf('data:') !== 0) continue;          // 注释行 / 事件名一律无视
                    const payload = line.slice(5).trim();
                    if (!payload) continue;
                    if (payload === '[DONE]') { done = true; continue; }
                    let j = null;
                    try { j = JSON.parse(payload); } catch (e) { continue; }  // 半截 JSON：丢掉这一帧，绝不猜
                    const ch = (j && Array.isArray(j.choices) && j.choices[0]) || null;
                    if (ch) {
                        const d = ch.delta || {};
                        if (typeof d.reasoning_content === 'string' && d.reasoning_content) {
                            reasoning += d.reasoning_content;
                            if (sink && sink.reasoning) sink.reasoning(reasoning);
                        }
                        if (typeof d.content === 'string' && d.content) {
                            text += d.content;
                            if (sink && sink.text) sink.text(text);
                        }
                        if (ch.finish_reason) finish = String(ch.finish_reason);
                    }
                    const det = (j && j.usage && j.usage.completion_tokens_details) || null;
                    if (det && typeof det.reasoning_tokens === 'number') rtok = det.reasoning_tokens;
                }
            }
            if (done) break;
        }
        return finishUp();
    } catch (e) {
        // 中止是预期路径，不是错误：把已经收到的字交回去，由 chatSend 正常渲染 + 标一句「已停止」。
        if (e && e.name === 'AbortError') { aborted = true; return finishUp(); }
        throw e;
    }
}

// 流式时那一行「活的」助手气泡。整场只 mutate **一个文本节点**（思考区再一个），
// 绝不重建节点、绝不碰 renderApp。
function chatLiveSink() {
    const st = { row: null, node: null, thinkBody: null };
    const ensureRow = function () {
        if (st.row) return;
        st.row = chatAppendRow('assistant', '');
        const b = chatBubbleOf(st.row);
        st.node = document.createTextNode('');
        if (b) b.appendChild(st.node);
    };
    return {
        state: st,
        reasoning: function (full) {
            try {
                ensureRow();
                if (!st.thinkBody) {
                    const b = chatBubbleOf(st.row);
                    if (!b) return;
                    const det = document.createElement('details');
                    det.className = 'aichat-think';
                    det.open = true;                      // 流的时候默认展开：正在动的东西看得见才有意义
                    const sum = document.createElement('summary');
                    sum.textContent = '思考中（模型的推理过程，不是答案）';
                    st.thinkBody = document.createElement('div');
                    st.thinkBody.className = 'aichat-think-body';
                    det.appendChild(sum);
                    det.appendChild(st.thinkBody);
                    b.insertBefore(det, st.node);         // 思考永远排在答案上面
                }
                st.thinkBody.textContent = String(full == null ? '' : full);
                chatScrollToBottom();
            } catch (e) {}
        },
        text: function (full) {
            try {
                ensureRow();
                if (!st.node) return;
                // 显示层只做两件事：去掉信封头、把 ==EDIT== 之后的内容换成一句提示。
                // **解析**（以及「要不要长出应用按钮」）一律等收全之后由 chatParseEnvelope 做一次。
                let s = String(full == null ? '' : full).replace(/^[ \t]*==CHAT==[ \t]*\r?\n?/, '');
                const cut = s.search(/^[ \t]*==EDIT\b/m);
                if (cut !== -1) s = s.slice(0, cut) + '\n（正在生成修改内容…收全之后才会给出前后对照和「应用」按钮）';
                st.node.nodeValue = s;
                chatScrollToBottom();
            } catch (e) {}
        },
        destroy: function () {
            try { if (st.row && st.row.parentNode) st.row.parentNode.removeChild(st.row); } catch (e) {}
            st.row = null; st.node = null; st.thinkBody = null;
        }
    };
}

// ============================================================================
// C3 —— 附加选段 → 提案 → 应用
// ============================================================================
//
// 这一段会**写进用户的论文**，所以它的默认答案永远是「不写」。
//
// 【捕获时机】在点「附到对话」的那一刻把 target 整个抄下来，之后绝不再读实时选区。
//   实测：行内 textarea 的选区能扛住焦点跑到聊天输入框（{start:7,end:22}、sameNode:true），
//   但任何一次整页重渲染都会把它清零（{start:0,end:0}、sameNode:false），
//   而重渲染是定时器驱动的 —— 用户什么都不做，1~5 分钟也会来一次。
//
// 【应用前四道闸门，全部必过，一道都不能省】
//   1. 目标行还在，且行号仍然指向同一行；
//   2. 这一行自捕获以来没被改过（逐字比 rowSrcAtCapture / rowTgtAtCapture）；
//   3. 捕获下来的那段文字仍然在原位置逐字对得上；对不上就尝试**唯一**重定位，
//      不唯一（0 处或 ≥2 处）就中止 —— **有歧义就是中止**；
//   4. 模型确实给了 ==EDIT== 块。没有 EDIT 块就没有「应用」按钮，绝不从白话里凑一个出来。
//   任何一道不过：中止 + 在对话里留一条可见的玫瑰色说明 + **一个字节都不写**。
//   这套纪律是照抄 applySynonym 的（它也是逐字复核 + 可见中止），不另起一套方言。

function chatFindProposal(id) {
    if (id == null) return null;
    const list = ChatState.proposals;
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
}

// 这一行、这一侧此刻的**真值**：正在编辑就是 editValues（textarea 缓冲区），否则是 pair 本身。
// 读错一个，就是把修改应用到过时的文本上。
function chatLiveBase(rowIndex, side) {
    const editing = (AppState.activeIndex === rowIndex);
    const v = editing ? AppState.editValues[side] : ((AppState.translationPairs[rowIndex] || {})[side]);
    return (typeof v === 'string') ? v : '';
}

function chatCountOccurrences(hay, needle) {
    if (!needle) return 0;
    let n = 0, i = 0;
    for (;;) {
        const k = hay.indexOf(needle, i);
        if (k === -1) break;
        n++;
        i = k + 1;                    // +1 而不是 +len：重叠出现也要算进去，宁可判成「有歧义」
        if (n > 1) break;
    }
    return n;
}

function chatTargetSummary(t) {
    const s = String(t.text || '').replace(/\s+/g, ' ').trim();
    return s.length > CHAT_CHIP_CHARS ? s.slice(0, CHAT_CHIP_CHARS) + '…' : s;
}

function chatRenderTargetChip() {
    try {
        const slot = document.getElementById('aiChatTargetSlot');
        if (!slot) return;
        slot.textContent = '';
        const t = ChatState.target;
        if (!t) return;
        const box = document.createElement('div');
        box.className = 'aichat-target';
        const label = document.createElement('span');
        label.className = 'aichat-target-label';
        label.textContent = (t.side === 'src' ? '原文' : '译文') + ' · 第 ' + (t.rowIndex + 1) + ' 行'
            + (t.whole ? ' · 整行' : ' · 选中段') + '：';
        const txt = document.createElement('span');
        txt.className = 'aichat-target-text';
        txt.textContent = chatTargetSummary(t);      // textContent：选段里可能有 LaTeX 和 '<'
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'aichat-target-x';
        x.textContent = '×';
        x.setAttribute('data-tip', '取消附加。取消之后模型不会再收到这段文字，也不会再给出「应用」按钮。');
        x.setAttribute('data-tip-pos', 'top-end');
        x.addEventListener('click', function () { chatDetach(); });
        box.appendChild(label);
        box.appendChild(txt);
        box.appendChild(x);
        slot.appendChild(box);
    } catch (e) {
        console.error('[chat] target chip failed', e);
    }
}

function chatDetach() {
    try {
        ChatState.target = null;
        chatRenderTargetChip();
        chatAppendRow('system', '已取消附加选段。');
    } catch (e) {
        console.error('[chat] detach failed', e);
    }
}

// 捕获。useSelection=true 时优先用该侧 textarea 里此刻的选区（点按钮的这一刻就是捕获时刻），
// 没有选区 / 不在编辑态就退回整行。
function chatCaptureTarget(rowIndex, side, useSelection) {
    const pairs = AppState.translationPairs;
    if (!Array.isArray(pairs)) return null;
    if (typeof rowIndex !== 'number' || rowIndex < 0 || rowIndex >= pairs.length) return null;
    if (side !== 'src' && side !== 'tgt') return null;
    const row = pairs[rowIndex];
    if (!row || typeof row !== 'object') return null;

    const base = chatLiveBase(rowIndex, side);
    let start = 0, end = base.length, whole = true;
    if (useSelection && AppState.activeIndex === rowIndex) {
        const ta = document.getElementById('editTextarea_' + side + '_' + rowIndex);
        if (ta && ta.value === base
            && typeof ta.selectionStart === 'number' && typeof ta.selectionEnd === 'number'
            && ta.selectionEnd > ta.selectionStart) {
            start = ta.selectionStart;
            end = ta.selectionEnd;
            whole = (start === 0 && end === base.length);
        }
    }
    return {
        rowIndex: rowIndex,
        side: side,
        start: start,
        end: end,
        text: base.substring(start, end),
        baseAtCapture: base,                                    // 该侧缓冲区在捕获那一刻的全文
        rowSrcAtCapture: String(row.src == null ? '' : row.src), // 已提交值，用于闸门 2
        rowTgtAtCapture: String(row.tgt == null ? '' : row.tgt),
        whole: whole,
        capturedAt: Date.now()
    };
}

function chatAttach(rowIndex, side, useSelection) {
    try {
        const t = chatCaptureTarget(rowIndex, side, useSelection);
        if (!t) {
            chatOpen();
            chatAppendRow('error', '附加失败：这一行已经不在了。');
            return;
        }
        if (!t.text) {
            chatOpen();
            chatAppendRow('error', '附加失败：这一段是空的，没有可改的内容。');
            return;
        }
        ChatState.target = t;
        chatOpen();
        chatRenderTargetChip();
        chatAppendRow('system', '已附加：' + (side === 'src' ? '原文' : '译文') + ' 第 ' + (rowIndex + 1) + ' 行'
            + (t.whole ? '（整行）' : '（第 ' + t.start + '–' + t.end + ' 个字符）')
            + '，共 ' + t.text.length + ' 字。现在可以让我改写它。');
        // <think> 在部分模型上会被**静默删除**（实测：qwen3.8 把 <think>hello</think>DONE
        // 变成 helloDONE，qwen3-1.7b 连内容一起删，而且删掉的东西哪都没去）。
        // 这是模型侧的行为，闸门拦不住「改写结果里少了这对标记」，只能事先说明白。
        if (/<\/?\s*think\s*>/i.test(t.text)) {
            chatAppendRow('system', '⚠ 这段文字里有 <think> 标记。实测部分本地模型会在输出里**静默删掉**它，'
                + '应用之前请务必看清下面的前后对照。');
        }
        const ta = document.getElementById('aiChatInput');
        if (ta && ta.focus) { try { ta.focus(); } catch (e) {} }
    } catch (e) {
        console.error('[chat] attach failed', e);
        try { chatErrorRow('附加选段', e); } catch (e2) {}
    }
}

// 行内工具栏上那颗按钮：有选区就附选区，没有就附整行。
function chatAttachSel(rowIndex, side) { chatAttach(rowIndex, side, true); }
// 非编辑态那颗悬停按钮：整行。
function chatAttachRow(rowIndex, side) { chatAttach(rowIndex, side, false); }

// —— 提案 ——
// 提案文本**绝不**内联进 onclick 字符串（\cite{...}、$x_i$、引号会被 JS 字符串字面量吃掉）：
// 存进 ChatState.proposals，卡片上的按钮用闭包按 id 回查。
function chatMakeProposal(edit) {
    try {
        const t = ChatState.target;
        if (!t) {
            chatAppendRow('system', '模型给出了一处修改，但你这一轮没有附加任何选段，所以它被丢弃了。'
                + '（要改文档，请先在某一行点「附到对话」。）');
            return null;
        }
        // side/row 只是**建议性**的。真正说了算的是客户端捕获的 target。
        // 模型说的和捕获的对不上，就把这个修改块整个丢掉 —— 绝不让模型来挑
        // 用户的哪一句会被覆盖。
        if (edit.side && edit.side !== t.side) {
            chatAppendRow('error', '模型把修改标成了 side=' + edit.side + '，但你附加的是「'
                + (t.side === 'src' ? '原文' : '译文') + '」。这处修改已被丢弃，没有「应用」按钮。');
            return null;
        }
        if (edit.row != null && edit.row !== t.rowIndex + 1) {
            chatAppendRow('error', '模型把修改标成了 row=' + edit.row + '，但你附加的是第 '
                + (t.rowIndex + 1) + ' 行。这处修改已被丢弃，没有「应用」按钮。');
            return null;
        }
        const replacement = String(edit.body == null ? '' : edit.body);
        // 会把这一段清空的替换：拒绝。用户要清空有别的路，模型不该有这条路。
        if (!replacement.trim() && t.text.trim()) {
            chatAppendRow('error', '模型给出的替换内容是空的（应用下去会把这一段清空）。已拒绝，没有「应用」按钮。');
            return null;
        }
        if (replacement === t.text) {
            chatAppendRow('system', '模型给出的替换文本和原文逐字一样，没有可应用的改动。');
            return null;
        }
        const p = {
            id: ++ChatState.proposalSeq,
            rowIndex: t.rowIndex,
            side: t.side,
            start: t.start,
            end: t.end,
            text: t.text,
            baseAtCapture: t.baseAtCapture,
            rowSrcAtCapture: t.rowSrcAtCapture,
            rowTgtAtCapture: t.rowTgtAtCapture,
            replacement: replacement,
            applied: false,
            card: null
        };
        ChatState.proposals.push(p);
        chatRenderProposalCard(p);
        return p;
    } catch (e) {
        console.error('[chat] makeProposal failed', e);
        try { chatErrorRow('生成提案', e); } catch (e2) {}
        return null;
    }
}

function chatRenderProposalCard(p) {
    const row = document.createElement('div');
    row.className = 'aichat-row aichat-row-assistant';
    const card = document.createElement('div');
    card.className = 'aichat-card';

    const head = document.createElement('div');
    head.className = 'aichat-card-head';
    head.textContent = '建议修改 · ' + (p.side === 'src' ? '原文' : '译文') + ' · 第 ' + (p.rowIndex + 1) + ' 行';
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'aichat-card-body';

    // 前后两栏。逐字对照，一律 textContent + white-space:pre-wrap。
    // （逐词 diff 更好看，但那是可切掉的装饰；「应用前必须看清会变成什么」这条要求
    //   前后对照已经满足。）
    const lab1 = document.createElement('div');
    lab1.className = 'aichat-pane-label';
    lab1.textContent = '现在（将被替换的这一段）';
    const pane1 = document.createElement('div');
    pane1.className = 'aichat-pane aichat-pane-old';
    pane1.textContent = p.text;

    const lab2 = document.createElement('div');
    lab2.className = 'aichat-pane-label';
    lab2.textContent = '改为';
    const pane2 = document.createElement('div');
    pane2.className = 'aichat-pane aichat-pane-new';
    pane2.textContent = p.replacement;

    body.appendChild(lab1); body.appendChild(pane1);
    body.appendChild(lab2); body.appendChild(pane2);

    // —— 只附了一段时，上面两栏说的是「那一段」，不是「这一行」——
    // 实测一次就吃掉了用户的段落：58 字的选区，qwen3.6 把**整行 244 字**当成替换文本还了回来，
    // 四道闸门全部通过（它们只比对捕获的那一段，替换文本本身不受任何约束），应用之后
    // 行里多出一句重复的从句，而卡片上一点都看不出来 —— 因为它从头到尾没显示过这一行。
    // 所以整行预览必须画出来，而且用的是和 chatApplyProposal 里逐字一样的那个拼接表达式。
    const baseCap = String(p.baseAtCapture == null ? '' : p.baseAtCapture);
    const partial = !(p.start === 0 && p.end === baseCap.length);
    if (partial) {
        const headKeep = baseCap.slice(0, p.start);
        const tailKeep = baseCap.slice(p.end);
        const lab3 = document.createElement('div');
        lab3.className = 'aichat-pane-label';
        lab3.textContent = '这一行应用后（整行预览）';
        const pane3 = document.createElement('div');
        pane3.className = 'aichat-pane aichat-pane-new';
        pane3.textContent = headKeep + p.replacement + tailKeep;
        body.appendChild(lab3); body.appendChild(pane3);

        // 「模型把整行还了回来」有一个很干净的指纹：选区**之外**的那截文字又出现在替换文本里。
        // 命中就直说，不拦 —— 拦不拦由用户看着上面那栏决定，和 LaTeX 体检一个规矩。
        const echoed = function (s) {
            const x = s.trim();
            return x.length >= 16 && p.replacement.indexOf(x.slice(0, 32)) !== -1;
        };
        if (echoed(headKeep) || echoed(tailKeep)) {
            const warn2 = document.createElement('div');
            warn2.className = 'aichat-card-warn';
            warn2.textContent = '⚠ 替换文本里含有这一行选区之外的文字（模型很可能把整行还了回来，'
                + '而你只选了其中一段）。照这样应用会让那部分重复一遍 —— 请先看上面的「整行预览」。';
            body.appendChild(warn2);
        }
    }

    // LaTeX 存活体检：源段里出现过的宏，替换文本里少了哪些，直说。不阻止应用，只提示。
    const lost = chatLatexLost(p.text, p.replacement);
    if (lost.length) {
        const warn = document.createElement('div');
        warn.className = 'aichat-card-warn';
        warn.textContent = '⚠ 原文里有、替换文本里没有的记号：' + lost.join('、') + '。应用前请确认这是你要的。';
        body.appendChild(warn);
    }

    const actions = document.createElement('div');
    actions.className = 'aichat-card-actions';
    const applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'aichat-btn aichat-btn-primary';
    applyBtn.textContent = '应用';
    // 这段文案必须和 chatApplyProposal 里的闸门逐条对得上。原来的版本写的是
    // 「这一行被改过 … 都会当场中止并且一个字节都不写」，那是假的：闸门 2 比的是**已提交值**，
    // 用户在行内打了字还没提交时它不会拦，闸门 3 会按唯一匹配重定位并照样写进缓冲区。
    // 行为本身是对的（用户自己打的字一个都没丢），假的是这句话，所以改的是这句话。
    applyBtn.setAttribute('data-tip', '把上面「改为」那段写回文档。写之前会再逐字核对一遍：'
        + '行号变了、这一行**已提交**的内容在你提问之后被改过、有一次会覆盖这一行的模型请求正在跑'
        + '（智能更新 / 重新生成 / 整篇翻译）、或者那段文字在行内已经找不到 / 出现了不止一处 —— '
        + '任何一条命中都当场中止，一个字节都不写。'
        + '有一种情况不中止：你正在这一行里打字（还没提交），而那段文字只是挪了位置、在缓冲区里仍然唯一存在；'
        + '那会按新位置写进你正在编辑的缓冲区（你自己打的字一个都不动），并在下面留一行说明。');
    applyBtn.setAttribute('data-tip-pos', 'top-start');
    applyBtn.addEventListener('click', function () { chatApplyProposal(p.id); });

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'aichat-btn';
    copyBtn.textContent = '复制';
    copyBtn.setAttribute('data-tip', '只把「改为」那段复制到剪贴板，不动文档。');
    copyBtn.setAttribute('data-tip-pos', 'top');
    copyBtn.addEventListener('click', function () {
        try { copyToClipboard(p.replacement); } catch (e) {}
    });

    const dropBtn = document.createElement('button');
    dropBtn.type = 'button';
    dropBtn.className = 'aichat-btn';
    dropBtn.textContent = '忽略';
    dropBtn.setAttribute('data-tip', '收起这张卡片，不做任何修改。');
    dropBtn.setAttribute('data-tip-pos', 'top-end');
    dropBtn.addEventListener('click', function () {
        try {
            actions.textContent = '';
            const done = document.createElement('span');
            done.className = 'aichat-card-done';
            done.textContent = '已忽略';
            done.style.color = '#94a3b8';
            actions.appendChild(done);
        } catch (e) {}
    });

    actions.appendChild(applyBtn);
    actions.appendChild(copyBtn);
    actions.appendChild(dropBtn);
    body.appendChild(actions);
    card.appendChild(body);
    row.appendChild(card);

    const log = document.getElementById('aiChatLog');
    if (log) log.appendChild(row);
    p.card = { row: row, actions: actions };
    chatScrollToBottom();
}

// 源段里出现、替换文本里消失了的记号。纯提示，不做任何拦截 —— 拦不拦由用户看了对照决定。
// 除了 LaTeX 宏，**必须**也盯着 <think> / </think>：实测 qwen3.8 会把它们静默删掉、
// qwen3-1.7b 连里面的内容一起删，而且删掉的东西 reasoning_content 里也没有。
// 那种情况下四道闸门全都会通过（闸门比的是**捕获时的原文**，模型只影响替换文本），
// 所以只能在这里明说，而不能指望闸门。
function chatLatexLost(oldText, newText) {
    const out = [];
    try {
        const seen = Object.create(null);
        const check = function (tok) {
            if (!tok || seen[tok]) return;
            seen[tok] = true;
            const inOld = oldText.split(tok).length - 1;
            const inNew = newText.split(tok).length - 1;
            if (inNew < inOld) out.push(tok + (inOld > 1 ? '（' + inNew + '/' + inOld + '）' : ''));
        };
        ['<think>', '</think>'].forEach(check);
        const re = /\\[A-Za-z]+\*?(?:\{[^{}]*\})?/g;
        let m;
        while ((m = re.exec(oldText)) !== null) {
            check(m[0]);
            if (out.length >= 6) break;
        }
    } catch (e) {}
    return out.slice(0, 6);
}

// 中止：可见的一行 + **一个字节都不写**。措辞刻意和 applySynonym 那句对齐。
function chatAbortApply(msg) {
    chatAppendRow('error', msg);
    chatScrollToBottom();
    return false;
}

function chatApplyProposal(id) {
    try {
        const p = chatFindProposal(id);
        if (!p || p.applied) return;

        const pairs = AppState.translationPairs;
        // ---- 闸门 1：目标行还在吗 ----
        if (!Array.isArray(pairs) || p.rowIndex >= pairs.length || !pairs[p.rowIndex]) {
            return chatAbortApply('目标行已不存在（行数变了），未做任何修改。');
        }
        const row = pairs[p.rowIndex];

        // ---- 闸门 1.5：有没有一次「会覆盖这一行」的模型请求正在飞 ----
        // 文件里有四处同一个形状：**发请求那一刻把文本抓走 → await → 用抓走的那份覆盖回去**。
        //   · saveRowUpdate      抓 currentSrc/currentTgt → addHistory(index, finalSrc, finalTgt)
        //   · handleRegenerateTranslation  抓 pair.src → addHistory(index, srcText, newTgt)
        //   · handleRegenerateAll / handleTranslate  整个 translationPairs 数组换新
        // addHistory 还会在 activeIndex 命中时把 AppState.editValues 一起重置回那份快照，
        // 所以在这个窗口里写下去的东西几秒后会被**静默**抹掉，而卡片上还挂着「已应用 ✓」。
        // 实测（qwen3.6，两组时间线）：apply 在 t=0.04s 生效，t=12.7s 请求落地，译文回到手改前的样子，
        // 聊天流里一行提示都没有。
        // 覆盖本身是那四处的既有行为（手打的编辑在同一窗口里也一样会丢），不在这次的修复范围；
        // 这里要堵的是「聊天窗口宣称写成功了，而那次写正在被销毁」。
        // 所以**拒绝**，不去抢救 —— 拒绝是这条路上唯一不撒谎的动作。一个布尔表达式盖住全部四处。
        const busy = row.isUpdating ? '这一行的智能更新'
            : row.isRegenerating ? '这一行的重新生成'
            : AppState.isRegeneratingAll ? '全文重新生成'
            : AppState.isLoading ? '整篇翻译'
            : '';
        if (busy) {
            return chatAbortApply('「' + busy + '」正在进行中，未做任何修改。'
                + '它落地时会用发起那一刻抓到的文本覆盖这一行，现在写下去几秒后就会被静默抹掉。'
                + '等它结束（或点那颗按钮取消它）之后再点「应用」。');
        }

        // ---- 闸门 2：这一行自捕获以来被改过没有 ----
        // 比的是**已提交值**。行内还没提交的编辑缓冲区不在比较范围里 —— 所以「用户正在这一行
        // 里打字但还没提交」的时候这道闸门照样通过，闸门 3 会在那份缓冲区上重新定位。
        // （按钮的提示文案必须和这一点一致，见 chatRenderProposalCard 里那段 data-tip。）
        if (String(row.src == null ? '' : row.src) !== p.rowSrcAtCapture
            || String(row.tgt == null ? '' : row.tgt) !== p.rowTgtAtCapture) {
            return chatAbortApply('这一行在你提问之后被改过了，未做任何修改。请重新选中后再试。');
        }

        // ---- 闸门 3：那段文字还在原位置吗；不在就只接受**唯一**重定位 ----
        const base = chatLiveBase(p.rowIndex, p.side);
        if (typeof base !== 'string') {
            return chatAbortApply('选中范围已失效（正文被改动过），未做任何替换。');
        }
        let start = p.start, end = p.end;
        const exact = (base === p.baseAtCapture) && (end <= base.length)
            && (base.substring(start, end) === p.text);
        let relocated = false;
        if (!exact) {
            const n = chatCountOccurrences(base, p.text);
            if (n !== 1) {
                // 0 处 = 没了；≥2 处 = 有歧义。两种都中止 —— 有歧义就是中止。
                return chatAbortApply('选中范围已失效（正文被改动过），未做任何替换。');
            }
            start = base.indexOf(p.text);
            end = start + p.text.length;
            relocated = true;
        }

        // ---- 闸门 4 已经在生成提案时把过了：没有 ==EDIT== 块就根本没有这颗按钮 ----
        const next = base.slice(0, start) + p.replacement + base.slice(end);

        if (AppState.activeIndex === p.rowIndex) {
            // —— 情形 A：这一行正在编辑 ——
            // 照抄 applySynonym：直接写缓冲区和 textarea，**不** setState、**不**记历史。
            // 它会在用户按 Update / 点走这一行时和手打的修改一样地提交，
            // 所以逐行撤销、自动存档、归档全都零改动地照常工作。
            AppState.editValues[p.side] = next;
            const ta = document.getElementById('editTextarea_' + p.side + '_' + p.rowIndex);
            if (ta) {
                ta.value = next;
                const caret = start + p.replacement.length;
                try { ta.setSelectionRange(caret, caret); } catch (e) {}
                // autoResizeTextarea 里带 scheduleAlignSync：行高变了，左右两栏当场重新对齐。
                // （applySynonym 没有这一步，那是它自己的一个既有缺陷，不在这次范围内。）
                autoResizeTextarea(ta);
                try { ta.focus(); } catch (e) {}
            } else {
                // 编辑态但 textarea 找不到（视图模式被切走了）：缓冲区已经改了，补一次对齐即可
                scheduleAlignSync();
            }
            chatAppendRow('system', '已应用到「' + (p.side === 'src' ? '原文' : '译文') + ' 第 '
                + (p.rowIndex + 1) + ' 行」的编辑框。它还没提交 —— 按这一行的 Update（或点到别处）'
                + '才会写进历史，和你手打的修改完全一样。');
        } else {
            // —— 情形 B：这一行不在编辑态 ——
            // 走 addHistory：追加一条历史、historyIndex 指到最新，逐行的 ↺ n/m 立刻可撤销。
            // **绝不**走 saveRowUpdate —— 它会把「只有一侧变了」理解成「另一侧要重译」
            // 并发一次模型请求，那正是「静默改写用户另一栏」的那种失败。
            const newSrc = p.side === 'src' ? next : String(row.src == null ? '' : row.src);
            const newTgt = p.side === 'tgt' ? next : String(row.tgt == null ? '' : row.tgt);
            addHistory(p.rowIndex, newSrc, newTgt);      // 内含 setState → 一次整页重渲染（用户主动动作，可接受）
            scheduleAlignSync();
            chatAppendRow('system', '已应用到「' + (p.side === 'src' ? '原文' : '译文') + ' 第 '
                + (p.rowIndex + 1) + ' 行」，并记入这一行的历史（用行首的 ↺ 可以撤回）。');
        }

        if (relocated) {
            chatAppendRow('system', '（这一行有过改动，但那段文字在行内唯一存在，已按新位置应用。）');
        }

        p.applied = true;
        if (p.card && p.card.actions) {
            p.card.actions.textContent = '';
            const done = document.createElement('span');
            done.className = 'aichat-card-done';
            done.textContent = '已应用 ✓';
            p.card.actions.appendChild(done);
        }

        // 附加的选段还指着同一处的话，把它挪到替换后的新文本上，用户可以接着说「再短一点」。
        // 挪不动就干脆取消附加，绝不留一个已经失效的 target。
        const t = ChatState.target;
        if (t && t.rowIndex === p.rowIndex && t.side === p.side) {
            const after = chatCaptureTarget(p.rowIndex, p.side, false);
            const liveNow = chatLiveBase(p.rowIndex, p.side);
            const ns = start, ne = start + p.replacement.length;
            if (after && liveNow.substring(ns, ne) === p.replacement) {
                after.start = ns;
                after.end = ne;
                after.text = p.replacement;
                after.whole = (ns === 0 && ne === liveNow.length);
                ChatState.target = after;
            } else {
                ChatState.target = null;
            }
            chatRenderTargetChip();
        }
        chatScrollToBottom();
    } catch (e) {
        console.error('[chat] apply failed', e);
        try { chatErrorRow('应用修改', e); } catch (e2) {}
    }
}

// —— 挂载 ——
// 幂等：已经建过就直接返回那个节点，绝不重建（重建 = 用户没发出去的草稿和滚动位置全没）。
// 整个函数不允许把异常抛出去：它在 DOMContentLoaded 里被调，抛出去会顺手废掉后面的初始化。
function ensureChatRoot() {
    try {
        let rootEl = document.getElementById('aiChatRoot');
        if (rootEl) return rootEl;
        if (!document.body) return null;

        rootEl = document.createElement('div');
        rootEl.id = 'aiChatRoot';
        rootEl.innerHTML = chatShellHtml();
        // ★ 关键的一行：body，不是 #root。文件里已有先例 —— renderSynonymPopupOnly 也是插到 body。
        document.body.appendChild(rootEl);
        chatBindShell(rootEl);
        ChatState.mounted = true;

        // 恢复几何：存过就按严格档拉回视口内，没存过就按当前视口自动排一份。
        const stored = chatLoadGeom();
        ChatState.geom = stored ? chatClampGeomForRestore(stored) : chatClampGeom(chatAutoGeom());
        chatApplyGeom();
        chatRenderParamBar();

        chatAppendRow('system', '对话窗已就绪。拖标题栏移动，拖左边/上边/左上角改大小，位置和大小会记住。'
            + '想让我改某一段：在左栏或右栏那一行点「附到对话」（编辑态下先选中一段就只附那一段），'
            + '我会给出前后对照，改动只有你点「应用」才会写进文档。');
        return rootEl;
    } catch (e) {
        console.error('[chat] ensureChatRoot failed', e);
        return null;
    }
}

// 顶栏那颗开关按钮的「开着」状态：直接改 DOM，不走 setState。
// renderHeader 里也读 chatIsOpen()，所以下一次任何原因触发的重渲染会自然带上正确状态。
function chatSyncToggleButton() {
    try {
        const btn = document.getElementById('chatToggleBtn');
        if (!btn) return;
        btn.setAttribute('aria-pressed', ChatState.open ? 'true' : 'false');
        if (ChatState.open) btn.classList.add('is-chat-open');
        else btn.classList.remove('is-chat-open');
    } catch (e) {}
}

function chatOpen() {
    try {
        const rootEl = ensureChatRoot();
        if (!rootEl) return;
        if (!ChatState.open) {
            // 记住是谁把窗口打开的，关的时候把焦点还回去。不还 = 键盘用户被丢在 <body> 上。
            const active = document.activeElement;
            ChatState.lastFocus = (active && active !== document.body) ? active : null;
        }
        ChatState.open = true;
        // 用户还没碰过尺寸/位置（mode 'auto'）时，每次打开都按当前视口重新自动排一次；
        // 碰过了就尊重存下来的几何，只把它拉回视口内。
        ChatState.geom = (ChatState.geom.mode === 'free')
            ? chatClampGeomForRestore(ChatState.geom)
            : chatClampGeom(chatAutoGeom());
        chatApplyGeom();
        rootEl.classList.add('is-open');
        chatSaveOpen(true);
        chatSyncToggleButton();
        chatRenderTargetChip();
        chatRenderParamBar();
        // 参数条要显示这个模型支持哪些推理档位，而那份数据是异步发现来的。
        // 打开窗口时补一次（60 秒缓存内不会真的再发请求），回来后只重画参数条。
        if (chatModelChoice().provider === 'local') chatCapsWarmForBar();
        chatUpdateBar();
        chatAutoGrowInput();
        chatScrollToBottom();
        const ta = document.getElementById('aiChatInput');
        if (ta && ta.focus) { try { ta.focus(); } catch (e) {} }
    } catch (e) {
        console.error('[chat] open failed', e);
    }
}

function chatClose() {
    try {
        ChatState.open = false;
        const rootEl = document.getElementById('aiChatRoot');
        if (rootEl) rootEl.classList.remove('is-open');
        chatSaveOpen(false);
        chatSyncToggleButton();
        // 焦点交还：优先还给当初打开它的那个元素（renderApp 之后那个节点可能已经不在文档里，
        // 所以要 contains 一下），否则给顶栏开关按钮。绝不留在一个已经 display:none 的节点上。
        const prev = ChatState.lastFocus;
        ChatState.lastFocus = null;
        let back = (prev && document.contains && document.contains(prev)) ? prev : null;
        if (!back) back = document.getElementById('chatToggleBtn');
        if (back && back.focus) { try { back.focus(); } catch (e) {} }
    } catch (e) {
        console.error('[chat] close failed', e);
    }
}

function chatToggle() {
    try {
        if (ChatState.open) chatClose();
        else chatOpen();
    } catch (e) {
        console.error('[chat] toggle failed', e);
    }
}

// 启动：把节点建出来（隐藏态），并按上次关页面时的状态决定要不要直接打开。
function chatBoot() {
    try {
        // 参数（对话模型 / 推理档位 / 温度 …）必须在建节点**之前**恢复，
        // 否则参数条会先画一遍默认值再跳成用户设定值 —— 而且那一瞬间显示的档位是错的。
        chatParamsLoad();
        if (!ensureChatRoot()) return;
        if (chatLoadOpen()) chatOpen();
        else chatSyncToggleButton();
    } catch (e) {
        console.error('[chat] boot failed', e);
    }
}

// ============= 初始化 =============
document.addEventListener('DOMContentLoaded', function() {
    // 加载保存的设置
    loadSavedSettings();

    // 初始渲染不需要保留滚动位置
    renderApp(false);

    // 全局点击事件 - 点击空白区域退出编辑模式
    document.addEventListener('click', handleGlobalClick);

    // 窗口尺寸变化会让文本重新折行，行高全变 —— 必须重测，不能只在启动时对一次
    window.addEventListener('resize', scheduleAlignSync);

    // 自动保存定时器
    setInterval(function() {
        if (AppState.autoSaveInterval > 0 && AppState.translationPairs.length > 0) {
            // { auto: true }：定时存档不许用带缺口的版本覆盖归档里完好的那份
            addToGlobalHistory(AppState.translationPairs, AppState.sessionId, { auto: true });
        }
    }, AppState.autoSaveInterval);

    // 浮动 AI 对话窗：把窗口挂到 <body> 上（默认隐藏），并按上次关页面时的开关状态决定是否打开。
    // 刻意放在整段初始化的**最后**，而且自带 try/catch —— 走到这里时初始渲染、全局点击、
    // 窗口 resize、自动存档定时器都已经装好了，这一段无论怎么炸都带不走它们。
    // renderApp 本身一行都没动，这是这个功能的全部要点。
    try { chatBoot(); } catch (e) { console.error('[chat] boot threw', e); }

    // 自动翻译防抖（在handleInputChange中处理）
});

// 加载所有保存的设置
function loadSavedSettings() {
    try {
        // 加载 Gemini API Key
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) {
            AppState.geminiApiKey = savedKey;
        }

        // 加载 OpenAI API Key
        const savedOpenaiKey = localStorage.getItem('openaiApiKey');
        if (savedOpenaiKey) {
            AppState.openaiApiKey = savedOpenaiKey;
        }

        // 加载 Claude API Key
        const savedClaudeKey = localStorage.getItem('claudeApiKey');
        if (savedClaudeKey) {
            AppState.claudeApiKey = savedClaudeKey;
        }

        // 加载 Claude Proxy URL
        const savedClaudeProxyUrl = localStorage.getItem('claudeProxyUrl');
        if (savedClaudeProxyUrl) {
            AppState.claudeProxyUrl = savedClaudeProxyUrl;
        }

        // 加载 Local Base URL
        const savedLocalUrl = localStorage.getItem('localBaseUrl');
        if (savedLocalUrl) {
            AppState.localBaseUrl = savedLocalUrl;
        }
        
        // 加载 History Limit
        const savedHistoryLimit = localStorage.getItem('historyLimit');
        if (savedHistoryLimit) {
            AppState.historyLimit = parseInt(savedHistoryLimit) || 5;
        }
        
        // 加载 Auto-Save Interval
        const savedAutoSaveInterval = localStorage.getItem('autoSaveInterval');
        if (savedAutoSaveInterval) {
            AppState.autoSaveInterval = parseInt(savedAutoSaveInterval) || 5 * 60 * 1000;
        }
        
        // 加载 Custom Prompts
        const savedCustomPrompts = localStorage.getItem('customPrompts');
        if (savedCustomPrompts) {
            try {
                const parsed = JSON.parse(savedCustomPrompts);
                AppState.customPrompts = { ...AppState.customPrompts, ...parsed };
            } catch (e) {}
        }
        
        // 加载上次使用的 API Provider 和模型
        const savedApiProvider = localStorage.getItem('apiProvider');
        const savedSelectedModel = localStorage.getItem('selectedModel');
        if (savedApiProvider) {
            AppState.apiProvider = savedApiProvider;
        }
        if (savedSelectedModel) {
            // localStorage 里的 selectedModel 是过滤器的一条绕过旁路：修复前点过 nano-banana 图像模型
            // （gemini-2.5-flash-image-preview 等）的用户，刷新后该 id 会被原样恢复，再被 getModelCatalog
            // 的「钉住」分支塞回 Gemini 下拉，callGeminiAPI 继续拿它去翻译。这里补上同一套判定。
            // 只校验 gemini（openai/claude/local 走各自逻辑，不在本次范围内）。
            const okId = sanitizeModelId(savedSelectedModel)
                && (AppState.apiProvider !== 'gemini' || isGeminiTextChatModelId(savedSelectedModel));
            AppState.selectedModel = okId ? savedSelectedModel : DEFAULT_MODEL_CATALOG[0].id;
        }

        // 加载 Model Visibility 设置
        const savedModelVisibility = localStorage.getItem('modelVisibility');
        if (savedModelVisibility) {
            try {
                const parsed = JSON.parse(savedModelVisibility);
                AppState.modelVisibility = { ...AppState.modelVisibility, ...parsed };
            } catch (e) {}
        }

        // B2：加载每模型的推理档位。**必须在首次 renderApp 之前**恢复，否则设置面板会先
        // 画一遍「关」再跳成用户设定值；更糟的是首次翻译可能用错档位发出去。
        // 逐键校验：只认 XPORT_EFFORT_WIRE 里存在的 UI 值，脏值直接丢弃（不是回落，是不收）。
        const savedReasoning = localStorage.getItem(XPORT_REASONING_LS_KEY);
        if (savedReasoning) {
            try {
                const parsed = JSON.parse(savedReasoning);
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                    const clean = {};
                    Object.keys(parsed).forEach(function (k) {
                        const id = sanitizeModelId(k);
                        const v = parsed[k];
                        if (id && typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v)) {
                            clean[id] = v;
                        }
                    });
                    AppState.reasoningByModel = clean;
                }
            } catch (e) {}
        }

        // 加载「显示 OpenAI 日期快照」开关
        const savedShowSnapshots = localStorage.getItem('showDatedSnapshots');
        if (savedShowSnapshots === '1') {
            AppState.showDatedSnapshots = true;
        }

        // 加载选词弹窗默认功能（'replace' | 'simplify' | 'grammar'，脏值一律回退默认 'replace'）
        const savedSynonymDefaultMode = localStorage.getItem('synonymDefaultMode');
        if (SYNONYM_MODES.indexOf(savedSynonymDefaultMode) !== -1) {
            AppState.synonymDefaultMode = savedSynonymDefaultMode;
        }

        // 加载 Settings 弹窗宽度（拖拽调整后持久化）；clamp 一下防止脏值把弹窗渲染成极端宽/窄
        const savedSettingsModalWidth = localStorage.getItem('settingsModalWidth');
        if (savedSettingsModalWidth) {
            AppState.settingsModalWidth = clampSettingsModalWidth(parseInt(savedSettingsModalWidth, 10));
        }

        // 加载 Settings 弹窗上次停在哪一页（脏值/老版本残留一律回落第一页）
        const savedSettingsTab = localStorage.getItem('settingsTab');
        if (savedSettingsTab) {
            AppState.settingsTab = normalizeSettingsTab(savedSettingsTab);
        }

        // 加载句对行距。⚠️ 必须**在首次 renderApp 之前**把 CSS 变量写进 :root，
        // 否则首屏会先用默认 8px 排一次版、行高对齐也按 8px 算完，再跳成用户设定值 —— 肉眼可见地闪一下。
        const savedRowGap = localStorage.getItem('rowGap');
        if (savedRowGap !== null) {
            AppState.rowGap = clampRowGap(savedRowGap);
        }
        applyRowGapToDom(AppState.rowGap);

        // 加载跨栏对应高亮开关。默认开（缺键 = 从没动过 = 开），只有显式存过 '0' 才算关。
        const savedCrossHl = localStorage.getItem('crossHighlightEnabled');
        if (savedCrossHl !== null) {
            AppState.crossHighlightEnabled = savedCrossHl !== '0';
        }

        // 加载哨兵传输协议开关。默认开；只有显式存过 'false' 才回到旧的 JSON 协议。
        const savedXport = localStorage.getItem('sentinelTransport');
        if (savedXport !== null) {
            AppState.sentinelTransport = savedXport !== 'false';
        }

        // 加载上次从各家 API 拉到的在线模型目录（纯读缓存，不发任何网络请求）
        // 刻意不做启动自动刷新：/v1/models 有限流，且首屏不该依赖网络
        loadOnlineCatalog();

        // 只要有保存的本地地址，就自动尝试连接（获取模型列表）
        if (savedLocalUrl) {
            autoConnectLocal();
        }
    } catch (e) {
        console.warn('Failed to load saved settings:', e);
    }
}

// 自动连接本地 LM Studio（获取模型列表，失败时显示错误提示）
async function autoConnectLocal() {
    try {
        const models = await fetchLocalModels(AppState.localBaseUrl);
        AppState.localModels = models;
        
        // 如果上次使用的是本地模型，检查是否仍然可用
        if (AppState.apiProvider === 'local') {
            const savedModel = localStorage.getItem('selectedModel');
            if (savedModel && models.some(m => m.id === savedModel)) {
                AppState.selectedModel = savedModel;
            } else if (models.length > 0) {
                AppState.selectedModel = models[0].id;
            }
        }
        
        console.log('Auto-connected to local LM Studio:', AppState.localBaseUrl, 'Models:', models.length);
        renderApp();
        // B1：连上了就顺手预热能力表（60 秒缓存，不会和 openSettings 的那次重复发请求）
        xportCapsWarm();
    } catch (e) {
        // 显示错误提示
        console.warn('Auto-connect to local LM Studio failed:', e.message);
        AppState.localModels = [];
        
        // 如果上次使用的是本地模型但现在连接失败，回退到目录里的第一个在线模型
        if (AppState.apiProvider === 'local') {
            AppState.apiProvider = DEFAULT_MODEL_CATALOG[0].provider;
            AppState.selectedModel = DEFAULT_MODEL_CATALOG[0].id;
        }
        
        // 显示顶部错误提示
        setState({ error: `无法连接到本地服务器 ${AppState.localBaseUrl}。请确保 LM Studio 正在运行。` });
    }
}

</script>
