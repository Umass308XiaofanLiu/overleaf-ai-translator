// Gemini API端点
const GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta/models";

// OpenAI API端点
const OPENAI_API_BASE = "https://api.openai.com/v1/chat/completions";

// Claude API端点
const CLAUDE_API_BASE = "https://api.anthropic.com/v1/messages";

// ============= 本地LLM调用（OpenAI兼容）=============
async function callLocalLLM(baseUrl, model, messages, jsonMode = false, signal = null) {
    const body = {
        model: model || "local-model",
        messages: messages,
        temperature: 0.3,
        max_tokens: 16384
    };

    // LM Studio的JSON模式
    if (jsonMode) {
        body.response_format = { type: "json_object" };
    }

    // 构建endpoint - 直接使用/v1/chat/completions
    const endpoint = `${baseUrl.replace(/\/$/, "")}/v1/chat/completions`;

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal
        });

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`API Error: ${response.status} - ${errText}`);
        }

        const data = await response.json();
        return data.choices?.[0]?.message?.content || "";
    } catch (error) {
        if (error.name === 'AbortError') throw error;
        throw error;
    }
}

// 获取本地模型列表
async function fetchLocalModels(baseUrl) {
    // 直接使用/v1/models端点，不设置Content-Type（GET请求不需要）
    const endpoint = `${baseUrl.replace(/\/$/, "")}/v1/models`;

    try {
        const response = await fetch(endpoint);

        if (!response.ok) {
            throw new Error(`Failed to fetch models: ${response.status}`);
        }

        const data = await response.json();
        return data.data || [];
    } catch (error) {
        console.error("Fetch models error:", error);
        throw new Error(`无法连接到 ${baseUrl}。请确保 LM Studio 服务器正在运行。`);
    }
}

// ============= 在线模型列表拉取（三家各自的 /models 端点）=============
// 三家都实测可以从浏览器直连（含 file:// 打开，Origin: null），不需要任何代理。
// 三条铁律，改代码时不要违反：
//   1) Gemini 这个 GET 不许加任何自定义头 —— 该域 Access-Control-Allow-Headers 只放行
//      x-goog-api-key，多加 Content-Type / Api-Revision 会 preflight 403 且不带 ACAO。
//   2) 三家都不许设 credentials:'include' —— 服务端回 ACAO:*，规范禁止该组合，浏览器会硬失败，
//      报错长得和「服务挂了」一模一样。
//   3) Claude 必须带 anthropic-dangerous-direct-browser-access: true —— 这个头就是 CORS 开关本身：
//      带它响应有 ACAO:*，不带它响应完全没有 ACAO，浏览器只抛无状态码的 TypeError。
//      它没写进 Anthropic REST 官方参考（只通过官方 TS SDK 的 dangerouslyAllowBrowser 间接暴露），
//      自 2024-08 稳定至今。**别当脏代码删掉。**

const OPENAI_MODELS_API = "https://api.openai.com/v1/models";
const CLAUDE_MODELS_API = "https://api.anthropic.com/v1/models";
const MODEL_FETCH_TIMEOUT = 15000;

// 带 15 秒超时的 fetch（三家共用）
// ⚠️ 刻意**不**在响应头到达时 clearTimeout：fetch 的 promise 在拿到响应头那一刻就 settle，
// 若那时清掉计时器，后面 `await response.json()` 读 body 就完全裸奔 —— 服务端回了 200 头
// 却挂住 body（代理超时 / Worker 半死 / 网络挂起）时 json() 永不 resolve，
// Promise.allSettled 永不 settle，三家状态会永远停在 loading、刷新按钮永久 disabled。
// 保留计时器让 abort 覆盖「发请求 + 读 body」整个窗口：超时会中断 body 流，json() 抛
// AbortError → classifyModelFetchError 归类成 TIMEOUT。请求已完成后再 abort() 是无害的空操作。
function fetchWithTimeout(url, options = {}, ms = MODEL_FETCH_TIMEOUT) {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return fetch(url, { ...options, signal: controller.signal });
}

// 带错误码的 Error（错误码 → MODEL_ERROR_TEXT 里的中文人话）
function modelFetchError(errCode, errMsg) {
    const e = new Error(errMsg);
    e.code = errCode;
    return e;
}

// 注：sanitizeModelId(id) 已在文件靠前处定义（SAFE_MODEL_ID 之后），此处复用，不重复定义。

// OpenAI 的 /v1/models 不返回 display_name，只能从 id 合成人类可读名字。
// 规则刻意保守：只做首段大写 + 后续连字符转空格，其余原样保留。
function prettifyModelId(id) {
    const raw = String(id);
    const parts = raw.split('-');
    let head = parts.shift() || raw;
    if (/^gpt$/i.test(head)) head = 'GPT';
    else if (/^chatgpt$/i.test(head)) head = 'ChatGPT';
    else if (/^o\d+$/i.test(head)) head = head.toLowerCase();
    else head = head.charAt(0).toUpperCase() + head.slice(1);
    if (parts.length === 0) return head;
    const rest = parts.map(p => /^[a-z]+$/.test(p) ? p.charAt(0).toUpperCase() + p.slice(1) : p);
    return head + '-' + rest.join(' ');
}

// HTTP 响应 → 错误码 + 中文短语（json 已解析成对象或 null）
function classifyModelHttpError(status, json) {
    // 截断：厂商/代理可能回一整页 HTML 错误页，原文会被塞进芯片的 title 属性
    const apiMsg = String((json && ((json.error && (json.error.message || json.error.type)) || json.message)) || '').slice(0, 200);
    if (status === 401 || status === 403) {
        return { errCode: 'AUTH', errMsg: apiMsg || 'API Key 无效或无权限' };
    }
    if (status === 429) {
        return { errCode: 'RATE', errMsg: apiMsg || '触发限流或额度不足，请稍后重试' };
    }
    if (status === 400 && /API_KEY_INVALID|API key not valid/i.test(apiMsg)) {
        return { errCode: 'AUTH', errMsg: apiMsg };
    }
    // 极简 Cloudflare Worker 常把 GET 改写成 POST /v1/messages，Anthropic 就会回这个 400。
    // 不识别它的话，用户会把「代理形状不对」误诊成「我的 Key 有问题」。
    if (status === 400 && /messages/i.test(apiMsg) && /required/i.test(apiMsg)) {
        return { errCode: 'PROXY_SHAPE', errMsg: '你的 Worker 只转发 POST /v1/messages，无法用于获取模型列表' };
    }
    return { errCode: 'HTTP', errMsg: apiMsg ? `HTTP ${status} - ${apiMsg}` : `HTTP ${status}` };
}

// 各种异常 → 统一错误码 + 中文人话
function classifyModelFetchError(err) {
    if (err && err.code) return { errCode: err.code, errMsg: err.message || '' };
    if (err && err.name === 'AbortError') return { errCode: 'TIMEOUT', errMsg: '请求超时（15 秒）' };
    const raw = String((err && err.message) || err || '');
    if (err instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(raw)) {
        return { errCode: 'CORS', errMsg: '浏览器被拦截（CORS 或断网），未拿到任何响应' };
    }
    return { errCode: 'HTTP', errMsg: raw || '未知错误' };
}

// —— Google Gemini ——
// GET ${GEMINI_API_BASE}?key=...&pageSize=1000
// 必须显式传 pageSize：默认只有 50 条，而当前目录超过 50 条，不传会**静默截断**、漏掉最新模型。
// 纯 GET + query 参数 = simple request，零 preflight。
async function fetchGeminiModelList(apiKey) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 Gemini API Key');

    const raw = [];
    let pageToken = '';
    for (let page = 0; page < 5; page++) {   // 上限 5 页，防跑飞
        const url = `${GEMINI_API_BASE}?key=${encodeURIComponent(apiKey)}&pageSize=1000`
                  + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
        const response = await fetchWithTimeout(url);   // 不加任何自定义头
        if (!response.ok) {
            const errJson = await response.json().catch(() => null);
            const info = classifyModelHttpError(response.status, errJson);
            throw modelFetchError(info.errCode, info.errMsg);
        }
        const data = await response.json();
        raw.push(...(data.models || []));
        pageToken = data.nextPageToken || '';
        if (!pageToken) break;
    }

    return raw
        // 线上字段名是 supportedGenerationMethods；supportedActions 只存在于 SDK 对象里，
        // 读错会导致全部被过滤掉、列表为空，所以两个都兜一手
        .filter(m => (m.supportedGenerationMethods || m.supportedActions || []).includes('generateContent'))
        .map(m => {
            // 不剥 "models/" 前缀会拼出 /v1beta/models/models/xxx:generateContent → 404
            const id = sanitizeModelId(String(m.name || '').replace(/^models\//, ''));
            if (!id) return null;
            return { id, name: m.displayName || id, provider: 'gemini', group: 'chat', created: '' };
        })
        // 图像生成 / TTS / live 也声明 generateContent，只靠上面那级会让用户选到图像模型来翻译
        .filter(m => m && isGeminiTextChatModelId(m.id))
        .sort((a, b) => a.id.localeCompare(b.id));
}

// —— OpenAI ——
// GET https://api.openai.com/v1/models，唯一必需头 Authorization: Bearer。
// 无分页（listModels 在 OpenAPI 规格里零参数，响应体只有 {object,data}），一次拿全。
async function fetchOpenaiModelList(apiKey, hideSnapshots) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 OpenAI API Key');

    const response = await fetchWithTimeout(OPENAI_MODELS_API, {
        method: "GET",
        headers: { "Authorization": `Bearer ${apiKey}` }
        // 不要加 credentials:'include'，服务端回 ACAO:* 会硬失败
    });
    if (!response.ok) {
        const errJson = await response.json().catch(() => null);
        const info = classifyModelHttpError(response.status, errJson);
        throw modelFetchError(info.errCode, info.errMsg);
    }

    const json = await response.json();
    const all = Array.isArray(json.data) ? json.data : [];

    return all
        .filter(m => m && typeof m.id === 'string')
        .filter(m => !OPENAI_DENY.test(m.id))
        .filter(m => !(hideSnapshots && OPENAI_DATED_SNAPSHOT.test(m.id)))
        .map(m => {
            const id = sanitizeModelId(m.id);
            if (!id) return null;
            return {
                id,
                name: prettifyModelId(id),
                provider: 'openai',
                created: m.created || 0,
                // 过了硬拒但没过 ALLOW 的新家族（如 daybreak-*）进隔离区：渲染但默认不勾选。
                // 这是抗陈旧的逃生口 —— 纯白名单对每个新发布家族都是零日盲区。
                group: OPENAI_ALLOW.test(id) ? 'chat' : 'other'
            };
        })
        .filter(Boolean)
        .sort((a, b) => (b.created || 0) - (a.created || 0));
}

// —— Anthropic Claude ——
// 主路直连 GET https://api.anthropic.com/v1/models?limit=1000
// limit 默认 20 而目录就在 15-25 条这个量级，必须传 1000 并跟 has_more/last_id。
// 直连失败且用户配了 proxyUrl 时才降级走代理 —— 极简 Worker 通常硬编码 POST /v1/messages，
// 大概率失败，所以只作二选路，且对非 JSON 响应容错。
async function fetchClaudeModelList(apiKey, proxyUrl) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 Claude API Key');

    const collected = [];
    let afterId = '';
    try {
        for (let page = 0; page < 10; page++) {
            const url = `${CLAUDE_MODELS_API}?limit=1000` + (afterId ? `&after_id=${encodeURIComponent(afterId)}` : '');
            const response = await fetchWithTimeout(url, {
                method: "GET",
                headers: {
                    "x-api-key": apiKey,
                    "anthropic-version": "2023-06-01",
                    // ↓ 这个头就是 CORS 开关本身，删掉它浏览器会直接抛无状态码的 Failed to fetch
                    "anthropic-dangerous-direct-browser-access": "true"
                }
            });
            if (!response.ok) {
                const errJson = await response.json().catch(() => null);
                const info = classifyModelHttpError(response.status, errJson);
                throw modelFetchError(info.errCode, info.errMsg);
            }
            const json = await response.json();
            collected.push(...(json.data || []));
            if (!json.has_more || !json.last_id) break;
            afterId = json.last_id;
        }
    } catch (directErr) {
        const direct = classifyModelFetchError(directErr);
        // Key 本身不对，或者根本没配代理 —— 没必要再试代理
        if (direct.errCode === 'AUTH' || direct.errCode === 'NO_KEY' || !proxyUrl) throw directErr;

        const base = String(proxyUrl).replace(/\/+$/, "").replace(/\/v1\/messages$/, "");
        let proxyJson = null;
        try {
            const res = await fetchWithTimeout(`${base}/v1/models?limit=1000`, {
                method: "GET",
                headers: { "x-api-key": apiKey, "anthropic-version": "2023-06-01" }
            });
            proxyJson = await res.json().catch(() => null);   // Worker 可能返回 HTML 错误页
            if (!res.ok) {
                const info = classifyModelHttpError(res.status, proxyJson);
                throw modelFetchError(info.errCode === 'HTTP' ? 'PROXY_SHAPE' : info.errCode, info.errMsg);
            }
        } catch (proxyErr) {
            if (proxyErr && proxyErr.code) throw proxyErr;
            throw modelFetchError('PROXY_SHAPE', '代理不支持模型列表请求（它可能只转发 POST /v1/messages），建议直连');
        }
        if (!proxyJson || !Array.isArray(proxyJson.data)) {
            throw modelFetchError('PROXY_SHAPE', '代理返回的不是模型列表格式，建议直连');
        }
        collected.push(...proxyJson.data);
    }

    return collected
        // Anthropic 公开 API 没有 embedding/TTS/图像/审核模型，只做形状校验。
        // 绝不按 capabilities 过滤 —— 它在 schema 里可为 null，老模型会被误杀。
        .filter(m => m && m.type === 'model' && typeof m.id === 'string')
        .map(m => {
            const id = sanitizeModelId(m.id);
            if (!id) return null;
            return { id, name: m.display_name || id, provider: 'claude', group: 'chat', created: m.created_at || '' };
        })
        .filter(Boolean);
}

// 解析JSON响应（处理可能的markdown包裹）
function parseJsonResponse(text) {
    // 检查空响应
    if (!text || text.trim() === '') {
        console.error('parseJsonResponse: Empty response received');
        throw new Error('无法解析 JSON 响应: 收到空响应');
    }

    let clean = text.trim();

    // 移除 markdown 代码块
    if (clean.startsWith('```json')) clean = clean.slice(7);
    else if (clean.startsWith('```')) clean = clean.slice(3);
    if (clean.endsWith('```')) clean = clean.slice(0, -3);
    clean = clean.trim();

    try {
        return JSON.parse(clean);
    } catch (e) {
        // 尝试提取JSON对象
        const match = clean.match(/\{[\s\S]*\}/);
        if (match) {
            try { return JSON.parse(match[0]); } catch (e2) {}
        }
        // 尝试提取JSON数组
        const arrayMatch = clean.match(/\[[\s\S]*\]/);
        if (arrayMatch) {
            try {
                const arr = JSON.parse(arrayMatch[0]);
                return { translations: arr };
            } catch (e3) {}
        }
        console.error('parseJsonResponse failed. Raw response:', text.substring(0, 500));
        throw new Error('无法解析 JSON 响应');
    }
}

// ============= Gemini API调用 =============
async function callGeminiAPI(model, contents, config = {}, apiKey = null, signal = null) {
    if (!apiKey) {
        throw new Error("Gemini API Key not configured. Please add your API key in Settings.");
    }

    const url = `${GEMINI_API_BASE}/${model}:generateContent?key=${apiKey}`;

    const body = {
        contents: [{ parts: [{ text: contents }] }],
        generationConfig: {
            temperature: config.temperature || 0.3
        }
    };

    if (config.systemInstruction) {
        body.systemInstruction = { parts: [{ text: config.systemInstruction }] };
    }

    if (config.responseMimeType) {
        body.generationConfig.responseMimeType = config.responseMimeType;
    }

    if (config.responseSchema) {
        body.generationConfig.responseSchema = config.responseSchema;
    }

    const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Gemini API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

// ============= OpenAI API调用 =============
// 需要特殊参数处理的新模型（不支持自定义 temperature，且用 max_completion_tokens 而非 max_tokens）
// 原数组降级为补充白名单，主判定改成规则匹配 —— 否则「更新」按钮拉回来的任何新模型
// （gpt-5.4 / gpt-6 / o5 …）都会走旧分支被塞 temperature + max_tokens 而 400。
const OPENAI_NEW_MODELS = ['gpt-5-nano', 'gpt-5-mini', 'gpt-5.2', 'o1', 'o1-mini', 'o1-preview', 'o3', 'o3-mini'];
const OPENAI_NEW_MODEL_PATTERN = /^(gpt-[5-9]|gpt-\d{2}|o[1-9])/i;

function isNewOpenAIModel(model) {
    const id = String(model || '');
    return OPENAI_NEW_MODEL_PATTERN.test(id) || OPENAI_NEW_MODELS.some(m => id.startsWith(m));
}

// 根据模型获取合适的 max tokens 限制
function getMaxTokensForModel(model, configMax) {
    if (configMax) return configMax;
    const id = String(model || '');
    // Nano 模型使用较小的 token 限制
    if (id.includes('nano')) return 2048;
    // Mini 模型使用中等限制
    if (id.includes('mini')) return 4096;
    // 其他模型使用默认值
    return 4096;
}

async function callOpenAIAPI(model, messages, config = {}, apiKey = null, signal = null) {
    if (!apiKey) {
        throw new Error("OpenAI API Key not configured. Please add your API key in Settings.");
    }

    const body = {
        model: model,
        messages: messages
    };

    // 新模型不支持自定义 temperature，只支持默认值 1
    if (!isNewOpenAIModel(model)) {
        body.temperature = config.temperature || 0.3;
    }

    // 新模型使用 max_completion_tokens，旧模型使用 max_tokens
    const maxTokens = getMaxTokensForModel(model, config.max_tokens);
    if (isNewOpenAIModel(model)) {
        body.max_completion_tokens = maxTokens;
    } else {
        body.max_tokens = maxTokens;
    }

    // 如果需要JSON响应（新模型不支持 response_format，通过 prompt 指示返回 JSON）
    if (config.jsonMode && !isNewOpenAIModel(model)) {
        body.response_format = { type: "json_object" };
    }

    const response = await fetch(OPENAI_API_BASE, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`OpenAI API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    return data.choices?.[0]?.message?.content || "";
}

// ============= Claude API调用 =============
// Claude 模型 token 限制
function getMaxTokensForClaudeModel(model, configMax) {
    if (configMax) return configMax;
    // Haiku 模型使用较小的 token 限制
    if (model.includes('haiku')) return 4096;
    // Sonnet 和 Opus 使用较大限制
    return 8192;
}

async function callClaudeAPI(model, messages, config = {}, apiKey = null, signal = null, proxyUrl = null) {
    if (!apiKey) {
        throw new Error("Claude API Key not configured. Please add your API key in Settings.");
    }

    if (!proxyUrl) {
        throw new Error("Claude Proxy URL not configured. Please add your Cloudflare Worker proxy URL in Settings.");
    }

    // 提取 system message（Claude 使用单独的 system 参数）
    let systemPrompt = null;
    const userMessages = [];

    for (const msg of messages) {
        if (msg.role === 'system') {
            systemPrompt = msg.content;
        } else {
            userMessages.push({
                role: msg.role,
                content: msg.content
            });
        }
    }

    const body = {
        model: model,
        max_tokens: getMaxTokensForClaudeModel(model, config.max_tokens),
        messages: userMessages
    };

    // 添加 system prompt（如果有）
    if (systemPrompt) {
        body.system = systemPrompt;
    }

    // Claude 支持 temperature 参数
    if (config.temperature !== undefined) {
        body.temperature = config.temperature;
    } else {
        body.temperature = 0.3;
    }

    // 使用代理 URL 而不是直接调用 Claude API
    const endpoint = proxyUrl.replace(/\/$/, "");

    const response = await fetch(endpoint, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Claude API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    // Claude 返回格式: { content: [{ type: "text", text: "..." }] }
    return data.content?.[0]?.text || "";
}

// ============= 传输期 \textcolor 剥离 =============
// \textcolor{color}{content} -> content，仅作用于"发给模型的文本"。
// 原因：\textcolor 以 \t 开头，混在模型返回的 JSON 字符串字面量里会被 JSON.parse 解析成 TAB+"extcolor"。
// 宏不进 JSON 就不可能被破坏。绝不修改 AppState.inputText / originalInputText 等用户原文。
// 约束：单遍扫描、括号配平、可嵌套、有工作量上限、任何异常都返回原文（renderApp 无 try/catch，禁止抛出）。
//
// ⚠️ 截断是常态，不是边角情况（v01.00.01 修）
//   用户是按手选区间一段一段翻译的，右括号落在选区外再正常不过。旧版一遇括号不配平
//   就「保守地」原样返回，宏于是整条漏给模型，模型再原样回显 —— 译文里就出现
//   \textcolor{purple}{...}。真实复现：745 字符、2 个 '{' 对 1 个 '}'，旧实现零改动。
//   现在按「宏语法 vs 用户正文」分开处理：
//     内容组被截断 -> 丢宏头，后面的正文一个字都不能少
//     颜色组被截断 -> 丢掉这截宏语法（'{pur' 不是用户的话）
//     压根没有内容组 -> 只丢宏头
//     选区起点落在颜色组内部（多出无主的 '}'）-> 清掉那些无主右括号
//   回归测试：tests/latex/textcolor-suite.js（直接从本文件抽函数跑，不是副本），
//   pre-commit 钩子会在 AI-Translator.html 进暂存区时强制跑一遍。
function stripTextColorOnce(input) {
    const n = input.length;
    let budget = n * 8 + 100000; // 硬性工作量上限，病态输入也不会长时间同步阻塞
    let blown = false;           // 预算耗尽 ≠ 括号截断，两者绝不能混为一谈
    const isSpace = (ch) => ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r';
    const isAlpha = (ch) => (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z');
    // 返回与 input[open] 处 '{' 配对的 '}' 下标；不配平返回 -1（预算耗尽时另置 blown）
    const matchBrace = (open) => {
        let depth = 0;
        for (let p = open; p < n; p++) {
            if (--budget < 0) { blown = true; return -1; }
            const ch = input[p];
            if (ch === '\\') { p++; continue; }
            if (ch === '{') depth++;
            else if (ch === '}') { depth--; if (depth === 0) return p; }
        }
        return -1;
    };
    let out = '';
    let i = 0;
    const drop = []; // 待吞掉的 '}' 下标（内容组右括号），栈顶总是最近的一个
    while (i < n) {
        if (--budget < 0) return input;
        const ch = input[i];
        if (ch === '\\') {
            // \textcolorbox 之类同前缀的别的宏必须原样放过：后面紧跟字母就不是 \textcolor
            if (input.startsWith('\\textcolor', i) && !isAlpha(input[i + 10])) {
                let j = i + 10;
                let headEnd = j; // 已确认属于「宏语法」的部分结束在哪；空白不算，留给正文
                while (j < n && isSpace(input[j])) j++;
                if (input[j] === '[') { // \textcolor[rgb]{1,0,0}{...}
                    const rb = input.indexOf(']', j);
                    if (rb === -1) return out; // 可选参数被截断：后面全是宏语法残骸，不是正文
                    j = rb + 1;
                    headEnd = j;
                    while (j < n && isSpace(input[j])) j++;
                }
                if (input[j] === '{') {
                    const colorEnd = matchBrace(j);
                    if (colorEnd === -1) {
                        if (blown) return input;
                        return out; // 颜色组被截断：'{pur' 是宏语法的残骸，不是用户的话
                    }
                    let k = colorEnd + 1;
                    while (k < n && isSpace(input[k])) k++;
                    if (input[k] === '{') {
                        const contentEnd = matchBrace(k);
                        if (blown) return input;
                        // 内容组配平就顺手记下要吞掉的右括号；被截断（-1）就只丢宏头，
                        // 后面的正文一个字都不能少 —— 用户是按选区分段翻译的，
                        // 右括号落在选区外是常态，不是边角情况。
                        if (contentEnd !== -1) drop.push(contentEnd);
                        i = k + 1;
                        continue;
                    }
                    i = colorEnd + 1; // 没有内容组：只丢 \textcolor{color}，其余（含空白）原样保留
                    continue;
                }
                i = headEnd; // 连 '{' 都没有：丢掉宏名（和已吃掉的 [rgb]），其余原样保留
                continue;
            }
            // 其他反斜杠序列原样保留（连带下一个字符），避免 \{ \} 干扰括号配对
            out += ch;
            if (i + 1 < n) { out += input[i + 1]; i += 2; } else { i += 1; }
            continue;
        }
        if (ch === '}' && drop.length && drop[drop.length - 1] === i) { drop.pop(); i += 1; continue; }
        out += ch;
        i += 1;
    }
    return out;
}

function stripTextColorForModel(input) {
    try {
        if (typeof input !== 'string') return input;
        let text = input;
        if (text.indexOf('\\textcolor') !== -1) {
            for (let pass = 0; pass < 5; pass++) { // 迭代到不动点，硬上限防死循环
                if (text.indexOf('\\textcolor') === -1) break;
                const next = stripTextColorOnce(text);
                if (next === text) break;
                text = next;
            }
        }
        // 选区起点落在颜色组内部时，会剩下无主的 '}'。它是宏语法的残骸，不是正文；
        // 留着模型会当成 LaTeX 回显。一次扫完所有无主右括号（只清一个的话不幂等）。
        if (text.indexOf('}') !== -1) {
            let depth = 0, stray = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '\\') { i++; continue; }
                if (c === '{') depth++;
                else if (c === '}') { if (depth === 0) { stray = true; break; } depth--; }
            }
            if (stray) {
                let out = '';
                depth = 0;
                for (let i = 0; i < text.length; i++) {
                    const c = text[i];
                    if (c === '\\') { out += c; if (i + 1 < text.length) out += text[i + 1]; i++; continue; }
                    if (c === '{') depth++;
                    else if (c === '}') { if (depth === 0) continue; depth--; }
                    out += c;
                }
                text = out;
            }
        }
        return text;
    } catch (e) {
        return input; // 绝不抛出
    }
}

// ============= 批量翻译 =============
async function translateBulk(text, srcLang, tgtLang, config, signal = null) {
    if (signal?.aborted) throw new DOMException("Aborted", "AbortError");

    // 传输期剥离颜色宏（不改动用户原文，仅改动本次发送给模型的副本）
    text = stripTextColorForModel(text);

    const srcName = srcLang === 'zh' ? 'Chinese' : 'English';
    const tgtName = tgtLang === 'zh' ? 'Chinese' : 'English';

    const systemPrompt = `You are a professional academic translator. 
1. Split input into logical sentences/segments.
2. Translate ${srcName} to ${tgtName}.
3. Keep LaTeX math/citations intact.
4. You MUST return ONLY valid JSON: {"translations": [{"src": "Original 1", "tgt": "Translated 1"}]}
5. Do NOT include any text before or after the JSON.`;

    if (config.provider === 'local') {
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            false, // 不使用json_mode，让模型自由返回
            signal
        );
        return parseJsonResponse(response);
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [
                { role: "system", content: systemPrompt },
                { role: "user", content: text }
            ],
            { jsonMode: true },
            config.openaiApiKey,
            signal
        );
        if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
        return parseJsonResponse(response);
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [

    // Gemini Path

// mode: 'replace'（学术同义替换，默认）| 'simplify'（简化：更常用、更直白的说法）
async function getSynonyms(sentence, selectedText, lang, config, avoidList = [], mode = 'replace') {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT include any of the following words/phrases in your output: ${JSON.stringify(avoidList)}. Find DIFFERENT alternatives.`
        : "";

    const prompt = mode === 'simplify' ? `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 SIMPLER, more common, and more direct alternatives for the "Selected Text".
1. If "Selected Text" is a single word, replace rare, obscure, or overly formal words with common, everyday equivalents.
2. If "Selected Text" is a phrase, clause, or full sentence, rewrite it in plainer, more direct, and more concise language that conveys the SAME meaning.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by simplicity and commonness (most common and most direct first).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }` : `Context Sentence: "${sentence}"
Selected Text: "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Provide 4-5 distinct, academic-style alternatives for the "Selected Text".
1. If "Selected Text" is a single word, provide synonyms.
2. If "Selected Text" is a phrase, clause, or full sentence, provide rephrased versions that convey the SAME meaning and function within the context.
3. The alternatives must fit grammatically into the "Context Sentence" if substituted.
4. SORT your result list by Semantic Proximity (closest meaning first, then slightly more varied).
5. ${avoidInstruction}

Return JSON: { "alternatives": ["option1", "option2", "option3", "option4"] }`;

    if (config.provider === 'local') {
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false // 不使用json_mode
        );
        try {
            const data = parseJsonResponse(response);
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            const data = parseJsonResponse(response);
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            const data = parseJsonResponse(response);
            return data.alternatives || [];
        } catch (e) { return []; }
    }

    // Gemini Path
    const responseSchema = {
        type: "OBJECT",
        properties: {
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey);

    const data = JSON.parse(response || "{}");
    return data.alternatives || [];
}

// ============= 语法修正（选词弹窗第三个模式）=============
// 与 getSynonyms 是平级的兄弟函数。之所以单独开一个而不是塞进 getSynonyms：
// 语法模式的响应形状本质不同（要么「正确」，要么「N 条改写 + 原因」），
// 硬塞回 string[] 只能靠哨兵值伪装，反而更容易在渲染路径上炸。
// 返回值形状固定：
//   { status: 'correct'|'issues'|'empty'|'parse', issue: string, scope: 'selection'|'sentence', alternatives: string[] }
// —— 这里绝不 throw 解析错误，调用方拿到 status 就能给出可见文案。
// scope 决定这批 alternatives 该替换掉哪一段：'selection' = 只换选中的词，'sentence' = 换掉整句。
// 它必须跟着建议一起走，绝不能在应用时再猜一次。

// 两段文本在语法意义上算不算「同一句话」。
// 只归一化空白：大小写、标点在语法里是有意义的，不能抹平。
function isSameGrammarText(a, b) {
    const na = (typeof a === 'string' ? a : '').trim().replace(/\s+/g, ' ');
    const nb = (typeof b === 'string' ? b : '').trim().replace(/\s+/g, ' ');
    return na === nb;
}

// 去空、去重、压成字符串数组
function normalizeGrammarList(raw) {
    const arr = Array.isArray(raw) ? raw : [];
    const seen = {};
    const out = [];
    for (let i = 0; i < arr.length; i++) {
        const v = arr[i];
        const str = (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
        if (!str) continue;
        if (seen[str]) continue; // 弱模型（如 qwen3-1.7b）实测会把同一条重复三遍
        seen[str] = true;
        out.push(str);
    }
    return out;
}

// 把模型返回的任意脏数据压成固定形状
// baseline: { selectedText, sentenceText, head, tail }
//   sentenceText 为空串 = 本次没有可用的整句范围 → 整句改写一律丢弃，只允许词级替换。
//   （没有范围却应用整句改写，就会把一整句塞进一个词的位置。）
//   head/tail = 整句里选区前后的两截；两者都在时会对词级候选做交叉核对。
function normalizeGrammarPayload(data, baseline) {
    const d = (data && typeof data === 'object') ? data : {};
    const base = (baseline && typeof baseline === 'object') ? baseline : {};
    const selectedText = typeof base.selectedText === 'string' ? base.selectedText : '';
    const sentenceText = typeof base.sentenceText === 'string' ? base.sentenceText : '';
    const head = typeof base.head === 'string' ? base.head : null;
    const tail = typeof base.tail === 'string' ? base.tail : null;

    // 「换了等于没换」的选项一律丢掉：实测模型会把原词原样列进候选里（results → results）
    const spanAlternatives = normalizeGrammarList(d.alternatives)
        .filter(v => !isSameGrammarText(v, selectedText));

    const corrected = typeof d.corrected_sentence === 'string' ? d.corrected_sentence.trim() : '';
    const sentenceAlternatives = sentenceText
        ? normalizeGrammarList(
            normalizeGrammarList(d.sentence_alternatives != null ? d.sentence_alternatives : d.sentenceAlternatives)
                .concat(corrected ? [corrected] : [])
          ).filter(v => !isSameGrammarText(v, sentenceText))
        : [];

    // 交叉核对：把词级候选塞回选区位置，至少有一条要能还原出模型自己写的整句修正稿。
    // 一条都对不上 = 这批「词级替换」换的其实是别处的词（实测出现过：焦点是 results，候选却是 show），
    // 点下去只会把句子改坏 —— 这种情况直接不给词级选项，改用整句改写。
    // 模型没给 corrected_sentence（弱模型 / 老响应）就无从核对，此时一律放行，行为与核对前一致。
    let spanVerified = true;
    if (spanAlternatives.length > 0 && corrected && head !== null && tail !== null) {
        spanVerified = spanAlternatives.some(alt => isSameGrammarText(head + alt + tail, corrected));
    }

    let issue = '';
    if (typeof d.issue === 'string') issue = d.issue.trim();
    else if (typeof d.reason === 'string') issue = d.reason.trim();

    // 「语法正确」必须有模型的明确表态才敢下结论。
    // 响应是 null / 数组 / 缺字段时一律算 'empty'——绝不能把一次失败的请求显示成「语法正确」。
    let correct = false;
    if (typeof d.correct === 'boolean') correct = d.correct;
    else if (typeof d.correct === 'string') correct = /^(true|yes|correct)$/i.test(d.correct.trim());

    if (correct) return { status: 'correct', issue: '', scope: 'selection', alternatives: [] };

    // 作用域：优先听模型的判断，但必须真有对应的候选才作数；否则退到另一种作用域。
    const scopeHint = typeof d.scope === 'string' ? d.scope.trim().toLowerCase() : '';
    if (scopeHint === 'sentence' && sentenceAlternatives.length > 0) {
        return { status: 'issues', issue: issue, scope: 'sentence', alternatives: sentenceAlternatives };
    }
    if (spanAlternatives.length > 0 && spanVerified) {
        return { status: 'issues', issue: issue, scope: 'selection', alternatives: spanAlternatives };
    }
    if (sentenceAlternatives.length > 0) {
        return { status: 'issues', issue: issue, scope: 'sentence', alternatives: sentenceAlternatives };
    }
    return { status: 'empty', issue: issue, scope: 'selection', alternatives: [] };
}

// spanOnly = true：没有可用的整句范围，只能要词级替换（模型不许提整句改写）
function buildGrammarPrompt(sentence, selectedText, lang, avoidInstruction, spanOnly) {
    const scopeRules = spanOnly
        ? `3. Only the "selection" scope is available here: set "scope": "selection" and put 3-5 DISTINCT drop-in replacements for the "Focus" in "alternatives". Each one is substituted for the Focus characters and NOTHING else: the words before and after the Focus stay exactly as they are. Leave "sentence_alternatives" EMPTY - it will be discarded.`
        : `3. Then pick the SMALLEST scope that can FULLY repair the sentence:
   - Use "scope": "selection" ONLY IF every error can be repaired by replacing the "Focus" substring alone. Put 3-5 DISTINCT drop-in replacements for the "Focus" in "alternatives". Each one is substituted for the Focus characters and NOTHING else: the words before and after the Focus stay exactly as they are. Also fill "corrected_sentence" with the whole Sentence as it reads after substituting alternatives[0] for the Focus - it must be identical to the Sentence except for the Focus part.
   - Otherwise use "scope": "sentence" and put 3-5 DISTINCT fully corrected versions of the ENTIRE "Sentence" in "sentence_alternatives". Leave "alternatives" empty.`;

    return `Sentence: "${sentence}"
Focus (the part the user selected, inside the Sentence): "${selectedText}"
Language: ${lang === 'zh' ? 'Chinese' : 'English'}

Task: Act as a strict academic proofreader. Check the grammar of the WHOLE "Sentence", paying special attention to the "Focus".
1. If the whole "Sentence" is already grammatically correct, answer "correct": true, "scope": "none", an empty "issue", an empty "alternatives" and an empty "sentence_alternatives". Do NOT invent stylistic rewrites.
2. Otherwise answer "correct": false and a SHORT "issue" (one clause naming the error).
${scopeRules}
4. NEVER output an option that is identical to the text it would replace. Keep each option a plain replacement: do not append or drop surrounding punctuation.
5. Fix grammar only; keep the original meaning and the academic tone. Reproduce LaTeX commands, math and citations exactly as given.
6. ${avoidInstruction}

Return JSON: { "correct": false, "issue": "...", "scope": "sentence", "alternatives": [], "corrected_sentence": "", "sentence_alternatives": ["option1", "option2"] }`;
}

// sentence: 拿去分析的那一句（有整句范围时 = 整句；没有时 = 原来的整行上下文，并强制 spanOnly）
// splice: { head, tail } = 整句里选区前后的两截，用于交叉核对；缺省则不做核对
async function getGrammarSuggestions(sentence, selectedText, lang, config, avoidList = [], spanOnly = false, splice = null) {
    const avoidInstruction = avoidList.length > 0
        ? `IMPORTANT: Do NOT repeat any of the following corrections: ${JSON.stringify(avoidList)}. Propose DIFFERENT wordings of the fix.`
        : "";

    const prompt = buildGrammarPrompt(sentence, selectedText, lang, avoidInstruction, spanOnly);
    // 判重基准：spanOnly 时没有整句范围，sentenceText 必须留空，整句候选会被全部丢弃
    const sp = (!spanOnly && splice && typeof splice === 'object') ? splice : {};
    const baseline = {
        selectedText: selectedText,
        sentenceText: spanOnly ? '' : sentence,
        head: typeof sp.head === 'string' ? sp.head : null,
        tail: typeof sp.tail === 'string' ? sp.tail : null
    };

    if (config.provider === 'local') {
        const response = await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }],
            false // 不使用json_mode（与 getSynonyms 保持一致）
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response), baseline);
        } catch (e) { return { status: 'parse', issue: '', scope: 'selection', alternatives: [] }; }
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { jsonMode: true },
            config.openaiApiKey
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response), baseline);
        } catch (e) { return { status: 'parse', issue: '', scope: 'selection', alternatives: [] }; }
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            { temperature: 0.3 },
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        try {
            return normalizeGrammarPayload(parseJsonResponse(response), baseline);
        } catch (e) { return { status: 'parse', issue: '', scope: 'selection', alternatives: [] }; }
    }

    // Gemini Path
    // ⚠️ 未经实测：本环境没有 Gemini API Key，下面的 schema 变更（新增 scope /
    // corrected_sentence / sentence_alternatives 三个字段）只做过代码审查，没有真跑过一次请求。
    // 即使 schema 被 Gemini 拒绝或字段缺失，normalizeGrammarPayload 也只会退回
    // 'empty' / 词级替换，不会拿不存在的范围去替换文本。
    const responseSchema = {
        type: "OBJECT",
        properties: {
            correct: { type: "BOOLEAN" },
            issue: { type: "STRING" },
            scope: { type: "STRING" },
            corrected_sentence: { type: "STRING" },
            alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            },
            sentence_alternatives: {
                type: "ARRAY",
                items: { type: "STRING" }
            }
        },
        required: ["correct", "issue", "scope", "corrected_sentence", "alternatives", "sentence_alternatives"]
    };

    const response = await callGeminiAPI(config.model, prompt, {
        responseMimeType: "application/json",
        responseSchema: responseSchema
    }, config.geminiApiKey);

    try {
        return normalizeGrammarPayload(JSON.parse(response || "{}"), baseline);
    } catch (e) { return { status: 'parse', issue: '', scope: 'selection', alternatives: [] }; }
}

// 选词弹窗统一取数入口：三个模式共用一个返回形状 { alternatives: string[], note: {status,issue,scope}|null }。
// note 只有语法模式才有；另外两个模式保持原样走 getSynonyms（返回值契约一个字节都没动）。
// grammarScope: getGrammarScopeContext() 的产物 { sentence, head, tail }；
//   传 null 或 sentence 为空 = 没算出可靠的句子范围，语法模式退化成词级分析（等同改动前的行为）。
async function fetchSynonymOptions(mode, sentence, selectedText, lang, config, avoidList, grammarScope) {
    const m = normalizeSynonymMode(mode);
    const avoid = Array.isArray(avoidList) ? avoidList : [];

    if (m === 'grammar') {
        const gs = (grammarScope && typeof grammarScope === 'object') ? grammarScope : {};
        const useSentence = (typeof gs.sentence === 'string' && gs.sentence.trim()) ? gs.sentence : null;
        const result = await getGrammarSuggestions(
            useSentence || sentence, selectedText, lang, config, avoid, !useSentence,
            { head: gs.head, tail: gs.tail }
        );
        return {
            alternatives: Array.isArray(result.alternatives) ? result.alternatives : [],
            note: { status: result.status, issue: result.issue, scope: result.scope === 'sentence' ? 'sentence' : 'selection' }
        };
    }

    const alternatives = await getSynonyms(sentence, selectedText, lang, config, avoid, m);
    return { alternatives: Array.isArray(alternatives) ? alternatives : [], note: null };
}

// ============= 文本摘要 =============
async function summarizeText(text, config) {
    const prompt = `总结:\n${text}`;

    if (config.provider === 'local') {
        return await callLocalLLM(
            config.localBaseUrl,
            config.model,
            [{ role: "user", content: prompt }]
        );
    }

    // OpenAI Path
    if (config.provider === 'openai') {
        const response = await callOpenAIAPI(
            config.model,
            [{ role: "user", content: prompt }],
            {},
            config.openaiApiKey
        );
        return response || "";
    }

    // Claude Path
    if (config.provider === 'claude') {
        const response = await callClaudeAPI(
            config.model,
            [{ role: "user", content: prompt }],
            {},
            config.claudeApiKey,
            null,
            config.claudeProxyUrl
        );
        return response || "";
    }

    // Gemini Path
    const response = await callGeminiAPI(config.model, prompt, {}, config.geminiApiKey);
    return response || "";
}

// ============= 翻译相关函数 =============

// 执行翻译
async function handleTranslate() {
    // 停止功能
    if (AppState.isLoading && AppState.mainAbortController) {
        AppState.mainAbortController.abort();
        setState({ isLoading: false });
        return;
    }

    if (!AppState.inputText.trim()) return;

    // 检查输入是否变化：如果已有翻译结果且输入未改变，则不执行翻译
    // 用户应使用重新生成按钮来重新翻译
    if (AppState.translationPairs.length > 0 && AppState.inputText === AppState.lastTranslatedText) {
        return;
    }

    // 保存原始输入内容（每次翻译都刷新；否则重新生成/原文视图会停留在第一段旧文本）
    AppState.originalInputText = AppState.inputText;

    let srcLang, tgtLang;
    if (AppState.isAutoDetect) {
        const detected = detectLanguage(AppState.inputText);
        srcLang = detected.src;
        tgtLang = detected.tgt;
        setState({ sourceLang: srcLang, targetLang: tgtLang }, true);
    } else {
        srcLang = AppState.sourceLang;
        tgtLang = AppState.targetLang;
    }

    setState({ isLoading: true, error: null, aiInsight: null });

    // 初始化AbortController
    const controller = new AbortController();
    AppState.mainAbortController = controller;

    try {
        const config = getApiConfig();
        const result = await translateBulk(AppState.inputText, srcLang, tgtLang, config, controller.signal);

        if (result?.translations) {
            const pairs = result.translations.map(t => ({
                src: t.src,
                tgt: t.tgt,
                history: [{ src: t.src, tgt: t.tgt }],
                historyIndex: 0,
                isUpdating: false,
                isRegenerating: false
            }));
            setState({ translationPairs: pairs, isEditingMode: false, viewMode: 'preview', isLoading: false });
            // 仅在成功后同步基线：失败时保持旧基线，TRANSLATE 才能重试
            AppState.lastTranslatedText = AppState.inputText;
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            setState({ error: err.message || "AI Translation failed. Please try again." });
            console.error(err);
        }
    } finally {
        // 确保 isLoading 状态被正确设置并触发重新渲染
        AppState.mainAbortController = null;
        if (AppState.isLoading) {
            setState({ isLoading: false });
        }
    }
}

// 保存行更新
async function saveRowUpdate(index, manualValues = null) {
    const original = AppState.translationPairs[index];
    const currentSrc = manualValues ? manualValues.src : AppState.editValues.src;
    const currentTgt = manualValues ? manualValues.tgt : AppState.editValues.tgt;

    // 检查是否需要取消现有更新
    if (original.isUpdating) {
        const controller = AppState.rowAbortControllers.get(index);
        if (controller) {
            controller.abort();
            AppState.rowAbortControllers.delete(index);
            updateTranslationPair(index, { isUpdating: false });
            return;
        }
    }

    // 严格检查：如果完全没有变化，立即退出
    if (currentSrc === original.src && currentTgt === original.tgt) {
        return;
    }

    const srcChanged = currentSrc !== original.src;
    const tgtChanged = currentTgt !== original.tgt;
    const needsAiUpdate = (srcChanged && !tgtChanged) || (tgtChanged && !srcChanged);

    updateTranslationPair(index, {
        src: currentSrc,
        tgt: currentTgt,
        isUpdating: needsAiUpdate
    });

    let prompt = "";
    let updateField = null;

    if (srcChanged && !tgtChanged) {
        prompt = `You are updating a translation. Original Source: "${original.src}". Current Translation: "${original.tgt}". New Source: "${currentSrc}". Task: Translate the "New Source" to ${AppState.targetLang === 'zh' ? 'Chinese' : 'English'}. Constraint: Keep the style and vocabulary of the "Current Translation" where possible. Return JSON: {"text": "..."}`;
        updateField = "tgt";
    } else if (tgtChanged && !srcChanged) {
        prompt = `You are aligning a source text to match a modified translation. Original Source: "${original.src}". Original Translation: "${original.tgt}". New Translation: "${currentTgt}". Task: Update the "Original Source" in ${AppState.sourceLang === 'zh' ? 'Chinese' : 'English'} so that it matches the meaning AND TONE of the "New Translation". Return JSON: {"text": "..."}`;
        updateField = "src";
    }

    if (!updateField) {
        addHistory(index, currentSrc, currentTgt);
        return;
    }

    // AI更新（支持中止）
    const controller = new AbortController();
    AppState.rowAbortControllers.set(index, controller);

    try {
        const config = getApiConfig();
        const resultText = (await getSmartUpdate(prompt, config, controller.signal)) || (updateField === 'src' ? currentSrc : currentTgt);
        const finalSrc = updateField === 'src' ? resultText : currentSrc;
        const finalTgt = updateField === 'tgt' ? resultText : currentTgt;
        addHistory(index, finalSrc, finalTgt);
        // editValues 已在 addHistory 中同步更新
    } catch (e) {
        if (e.name !== 'AbortError') {
            console.error("Smart update failed", e);
            addHistory(index, currentSrc, currentTgt);
            setState({ error: e.message || "Smart update failed" });
        }
    } finally {
        AppState.rowAbortControllers.delete(index);
    }
}

// 添加历史记录
function addHistory(index, s, t) {
    const pairs = [...AppState.translationPairs];
    const newHistory = [...pairs[index].history, { src: s, tgt: t }];
    pairs[index] = {
        ...pairs[index],
        src: s,
        tgt: t,
        history: newHistory,
        historyIndex: newHistory.length - 1,
        isUpdating: false
    };
    
    // 同时更新 editValues 以保持同步，避免状态不一致
    if (AppState.activeIndex === index) {
        AppState.editValues = { src: s, tgt: t };
    }
    
    setState({ translationPairs: pairs });
}

// 历史导航
function handleHistoryNav(index, delta) {
    const item = AppState.translationPairs[index];
    const newIdx = item.historyIndex + delta;
    if (newIdx >= 0 && newIdx < item.history.length) {
        const historic = item.history[newIdx];
        const pairs = [...AppState.translationPairs];
        pairs[index] = { ...item, src: historic.src, tgt: historic.tgt, historyIndex: newIdx };
        
        // 同时更新 editValues 以保持同步
        if (AppState.activeIndex === index) {
            AppState.editValues = { src: historic.src, tgt: historic.tgt };
        }
        
        setState({ translationPairs: pairs });
    }
}

// AI精炼
async function handleAiRefine(index, field, type) {
    if (AppState.isRefining) return;
    setState({ isRefining: true });

    const text = field === 'src' ? AppState.editValues.src : AppState.editValues.tgt;
    const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;

    let instruction = undefined;
    if (type === 'grammar') instruction = AppState.customPrompts.grammar;
    if (type === 'simplify') instruction = AppState.customPrompts.simplify;

    try {
        const config = getApiConfig();
        const customInst = type === 'custom' ? AppState.refinePrompt : instruction;
        const refined = await refineSentence(text, lang, type, config, customInst);

        if (refined) {
            // 检测 AI 返回的 "无需修改" 标记或常见的无修改响应
            const noChangePatterns = [
                '[NO_CHANGES]',
                'already grammatically correct',
                'no grammar errors',
                'no changes needed',
                'text is correct',
                '没有语法错误',
                '语法正确',
                '无需修改'
            ];

            const isNoChange = noChangePatterns.some(pattern =>
                refined.toLowerCase().includes(pattern.toLowerCase())
            ) || refined.trim() === text.trim();

            if (isNoChange) {
                // 显示提示框而不是替换文本
                showToast(type === 'grammar' ? '✓ No grammar errors found' : '✓ Text is already simple enough', 'success');
            } else {
                const newVals = { ...AppState.editValues, [field]: refined };
                setState({ editValues: newVals }, true);
                await saveRowUpdate(index, newVals);
            }
        }
    } catch (e) {
        setState({ error: e.message || "Refinement failed" });
    } finally {
        setState({ isRefining: false });
        if (type === 'custom') setState({ refinePrompt: "" }, true);
    }
}

// 显示 Toast 提示

}

// 处理文本选择（同义词）
async function handleTextSelect(event, field, index) {
    const target = event.target;
    let start = target.selectionStart;
    let end = target.selectionEnd;

    if (start === end) return;

    const text = target.value;
    let selectedText = text.substring(start, end);

    // 去除尾随空格（浏览器双击选词常常会包含尾随空格）
    const trimmedEnd = selectedText.replace(/\s+$/, '');
    if (trimmedEnd.length < selectedText.length) {
        end = start + trimmedEnd.length;
        selectedText = trimmedEnd;
        // 更新浏览器的选中范围
        target.setSelectionRange(start, end);
    }
    
    // 去除前导空格
    const trimmedStart = selectedText.replace(/^\s+/, '');
    if (trimmedStart.length < selectedText.length) {
        start = end - trimmedStart.length;
        selectedText = trimmedStart;
        target.setSelectionRange(start, end);
    }

    if (!selectedText || selectedText.length < 1 || /^\s*$/.test(selectedText)) return;

    // 每次全新选择都按设置里的默认模式打开，并重置三个模式的缓存
    const defaultMode = normalizeSynonymMode(AppState.synonymDefaultMode);

    // 选区所在的整句：语法模式的分析范围和整句替换范围都来自这里；算不准就是 null
    const sentenceRange = findSentenceRange(text, start, end);

    updateSynonymState({
        show: true,
        loading: true,
        originalText: selectedText,
        mode: defaultMode,
        historyByMode: emptySynonymHistory(),
        pageIndexByMode: emptySynonymPageIndex(),
        grammarNotes: [],
        errorMessage: "",
        position: { x: event.clientX, y: event.clientY },
        selectionRange: { start, end },
        sentenceRange,
        field,
        index,
        contextSentence: text
    });

    // 跨栏对应高亮：在另一侧把「意思对应的那一段」也高亮出来。
    // 完全异步、完全独立 —— 它失败也好、被关掉也好，同义词弹窗这条主链路一个字节都不受影响。
    scheduleCrossHighlight(field, index, selectedText);

    try {
        const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;
        const config = getApiConfig();
        const result = await fetchSynonymOptions(
            defaultMode, text, selectedText, lang, config, [],
            getGrammarScopeContext(AppState.synonymState)
        );

        const cur = AppState.synonymState;
        const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
        curHb[defaultMode] = [result.alternatives];
        updateSynonymState({
            historyByMode: curHb,
            ...(result.note ? { grammarNotes: [result.note] } : {}),
            // 请求返回时用户可能已切到另一个模式：只有当前模式就是本次请求的模式才收起 loading
            ...(cur.mode === defaultMode ? { loading: false } : {})
        });
    } catch (err) {
        console.error(err);
        // 不再直接关掉弹窗：把失败原因显示出来，用户还能切模式重试
        if (AppState.synonymState.show) {
            updateSynonymState({ loading: false, errorMessage: describeSynonymError(err) });
        }
    }
}

// 把异常压成一句可直接显示的中文（渲染路径只吃字符串，绝不吃 Error 对象）
function describeSynonymError(err) {
    let detail = '';
    try {
        detail = (err && typeof err.message === 'string') ? err.message : String(err || '');
    } catch (e) { detail = ''; }
    detail = detail.trim();
    if (detail.length > 120) detail = detail.slice(0, 120) + '…';
    return detail ? `请求失败：${detail}` : '请求失败，请稍后重试。';
}

// 同义词弹窗模式切换（替换 / 简化 / 语法修正）
async function handleSynonymModeSwitch(mode) {
    const s = AppState.synonymState || {};
    const newMode = normalizeSynonymMode(mode);
    if (normalizeSynonymMode(s.mode) === newMode) return; // 点击当前激活模式 = no-op

    const cached = getSynonymHistory(s, newMode);

    if (cached.length > 0) {
        // 该模式已有缓存：立即展示，不重新请求（锚点不变，renderSynonymPopupOnly 会按新高度重新夹紧）
        updateSynonymState({ mode: newMode, loading: false, errorMessage: "" });
        return;
    }

    // 该模式还没请求过：切换并拉取第 1 页
    updateSynonymState({ mode: newMode, loading: true, errorMessage: "" });

    if (!s.field) {
        updateSynonymState({ loading: false });
        return;
    }

    try {
        const lang = s.field === 'src' ? AppState.sourceLang : AppState.targetLang;
        const config = getApiConfig();
        const result = await fetchSynonymOptions(
            newMode, s.contextSentence, s.originalText, lang, config, [],
            getGrammarScopeContext(s)
        );

        const cur = AppState.synonymState;
        const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
        curHb[newMode] = [result.alternatives];
        updateSynonymState({
            historyByMode: curHb,
            ...(result.note ? { grammarNotes: [result.note] } : {}),
            ...(normalizeSynonymMode(cur.mode) === newMode ? { loading: false } : {})
        });
    } catch (e) {
        console.error(e);
        if (normalizeSynonymMode(AppState.synonymState.mode) === newMode) {
            updateSynonymState({ loading: false, errorMessage: describeSynonymError(e) });
        }
    }
}

// 同义词翻页（按当前模式独立分页；avoid 列表也按模式隔离）
async function handleSynonymPageChange(direction) {
    const s = AppState.synonymState || {};
    const mode = normalizeSynonymMode(s.mode);
    const history = getSynonymHistory(s, mode);
    const pb = (s.pageIndexByMode && typeof s.pageIndexByMode === 'object') ? s.pageIndexByMode : emptySynonymPageIndex();
    const pageIndex = getSynonymPageIndex(s, mode);
    const { contextSentence, originalText, field } = s;

    if (direction === -1) {
        if (pageIndex > 0) {
            pb[mode] = pageIndex - 1;
            updateSynonymState({ pageIndexByMode: pb, errorMessage: "" });
        }
    } else {
        if (pageIndex < history.length - 1) {
            pb[mode] = pageIndex + 1;
            updateSynonymState({ pageIndexByMode: pb, errorMessage: "" });
        } else {
            if (!field) return;
            const lang = field === 'src' ? AppState.sourceLang : AppState.targetLang;

            updateSynonymState({ loading: true, errorMessage: "" });

            try {
                const avoidList = history.flat();
                const config = getApiConfig();
                const result = await fetchSynonymOptions(
                    mode, contextSentence, originalText, lang, config, avoidList,
                    getGrammarScopeContext(s)
                );

                const cur = AppState.synonymState;
                const curHb = (cur.historyByMode && typeof cur.historyByMode === 'object') ? cur.historyByMode : emptySynonymHistory();
                curHb[mode] = [...history, result.alternatives];
                const curPb = (cur.pageIndexByMode && typeof cur.pageIndexByMode === 'object') ? cur.pageIndexByMode : emptySynonymPageIndex();
                curPb[mode] = pageIndex + 1;
                // 语法模式的逐页判定结果要和 historyByMode.grammar 的下标对齐
                const curNotes = Array.isArray(cur.grammarNotes) ? cur.grammarNotes.slice(0, history.length) : [];
                if (result.note) curNotes[pageIndex + 1] = result.note;
                updateSynonymState({
                    historyByMode: curHb,
                    pageIndexByMode: curPb,
                    ...(result.note ? { grammarNotes: curNotes } : {}),
                    ...(normalizeSynonymMode(cur.mode) === mode ? { loading: false } : {})
                });
            } catch (e) {
                console.error(e);
                updateSynonymState({ loading: false, errorMessage: describeSynonymError(e) });
            }
        }
    }
}

// 应用同义词
// scope: 'selection'（默认；替换 / 简化 / 词级语法都走这条，行为一个字节都没变）
//        'sentence'（语法模式的整句改写：替换范围必须是 sentenceRange）
// 作用域是跟着建议一起传进来的，不在这里重新猜。范围核对不上就中止 ——
// 把一整句改写塞进一个词的位置会直接搅烂正文，宁可什么都不做。
function applySynonym(synonym, scope) {
    if (!AppState.synonymState.field || AppState.activeIndex === null) return;

    const field = AppState.synonymState.field;
    const currentText = AppState.editValues[field];
    let start, end;

    if (scope === 'sentence') {
        const sr = getValidSentenceRange(AppState.synonymState);
        // 逐字核对：当前正文在该范围上必须仍然等于当初记下来的那一句
        if (!sr || typeof currentText !== 'string'
            || sr.end > currentText.length
            || currentText.substring(sr.start, sr.end) !== sr.text) {
            updateSynonymState({
                loading: false,
                errorMessage: '整句范围已失效（正文被改动过），未做任何替换。请重新选中后再试。'
            });
            return;
        }
        start = sr.start;
        end = sr.end;
    } else {
        const range = AppState.synonymState.selectionRange;
        start = range.start;
        end = range.end;
    }

    const newText = currentText.substring(0, start) + synonym + currentText.substring(end);

    // 更新状态
    AppState.editValues[field] = newText;
    
    // 直接更新 textarea 的值（避免重新渲染）
    const textarea = document.getElementById(`editTextarea_${field}_${AppState.activeIndex}`);
    if (textarea) {
        textarea.value = newText;
        // 设置光标位置到替换文本末尾
        const newCursorPos = start + synonym.length;
        textarea.setSelectionRange(newCursorPos, newCursorPos);
        textarea.focus();
    }

    // 关闭弹窗
    updateSynonymState({ show: false });
}

// 语法模式的选项按「页码 + 下标」回查，不把文本内联进 onclick 字符串。
// 原因有二：
//   1) 整句改写里会出现 \cite{...}、$x_i$、引号，内联进 JS 字符串字面量会被吃掉反斜杠；
//   2) 作用域必须和这一页的判定结果绑死，不能在应用时再猜一次。
function applySynonymOption(pageIndex, optionIndex) {
    try {
        const s = AppState.synonymState;
        const mode = normalizeSynonymMode(s.mode);
        const page = getSynonymHistory(s, mode)[pageIndex];
        if (!Array.isArray(page)) return;
        const text = page[optionIndex];
        if (typeof text !== 'string' || !text) return;
        const scope = isSentenceScopedPage(s, mode, pageIndex) ? 'sentence' : 'selection';
        applySynonym(text, scope);
    } catch (e) {
        console.error(e);
    }
}

// ============= 在线模型列表刷新（只由用户显式点击触发）=============
// 刻意不做启动自动刷新 / 打开 Settings 自动刷新：/v1/models 有限流，且首屏不该依赖网络。
// 【不变量，改代码时请守住】任何失败路径只写 AppState.modelRefresh，绝不写 fetchedModels、
// 绝不触碰 DEFAULT_MODEL_CATALOG —— 可用列表永远只增不减，不会出现「点了更新，模型没了」。

// 把 Settings 里还没点保存的输入框内容同步进 AppState 再落盘。
// 必须先做：setState(L167) 会通过 root.innerHTML 全量重渲染，不同步的话刚粘贴的 Key 会被冲掉，
// 而且刷新会拿旧 Key 去请求、误报 NO_KEY。沿用 handleConnectLocalClick(L2951) 的既有模式。
function syncSettingsInputsToState() {
    [
        ['geminiApiKeyInput', 'geminiApiKey'],
        ['openaiApiKeyInput', 'openaiApiKey'],
        ['claudeApiKeyInput', 'claudeApiKey'],
