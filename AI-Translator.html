            const span = document.createElement('span');
            span.className = cls;
            span.setAttribute(attr, '1');
            span.appendChild(document.createTextNode(text.slice(iv.s, iv.e)));
            frag.appendChild(span);
            cursor = iv.e;
        }
        if (cursor === 0) return;                                     // 一段都没落进来，原节点不动
        if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
        parent.replaceChild(frag, node);
    } catch (e) {}
}

function applyCrossHighlightToRendered() {
    try {
        clearRenderedCrossHighlights();
        const ss = AppState.synonymState;
        if (!ss || !ss.show) return;
        const ch = AppState.crossHighlight;
        if (!ch || typeof ch.idx !== 'number') return;
        const fragments = getCrossFragmentsFor(ch.idx, ch.toSide);
        if (!fragments) return;

        const host = findRenderedRowBody(ch.idx, ch.toSide);
        if (!host) return;                                            // 那一行是 textarea，镜像层已经画过了
        const flat = collectCrossTextNodes(host);
        if (!flat.text) return;
        const ranges = crossResolveRanges(flat.text, fragments);
        if (!ranges.length) return;

        // 区间 → 每个文本节点上的局部区间
        for (let n = 0; n < flat.nodes.length; n++) {
            const entry = flat.nodes[n];
            const intervals = [];
            for (let r = 0; r < ranges.length; r++) {
                const s = Math.max(ranges[r].start, entry.start);
                const e = Math.min(ranges[r].end, entry.end);
                if (e > s) intervals.push({ s: s - entry.start, e: e - entry.start });
            }
            if (intervals.length) wrapCrossIntervals(entry.node, intervals);
        }
    } catch (e) {
        // 装饰性功能：坏了就当没这个功能，绝不能把异常带回渲染路径
    }
}

// ============================================================================
// 额外关注（focus）—— 「请多留意这几处」
// ============================================================================
//
// 【三个概念，不许再混为一谈】这一段代码存在的全部理由就是把它们钉开：
//
//   上下文  = 整篇文档，每一轮都发过去。没有闸门 —— 读不可能毁掉用户的稿子。
//   关注    = 「这几处请多留意」。没有闸门 —— 它只是加在提示里的一句话。
//   编辑目标 = 「应用」按钮真正会写进去的那一行。四道闸门一道不少：
//             行号在范围内 + 引文逐字存在且唯一 + 这一行自快照以来没被改过 + 模型确实给了 ==EDIT== 块。
//
// **被关注 ≠ 被授权修改。** 这个文件里没有任何一条从 FocusState 通向 chatApplyProposal 的捷径：
// 提案照旧只能由 ==EDIT== 块产生，闸门照旧逐字复核。加这一段功能没有放松任何一道闸门。
//
// 【为什么状态不放 AppState】和浮动对话窗同一条纪律：勾一个复选框不该触发整页重渲染
//（setState → renderApp → root.innerHTML，外面没有 try/catch）。所以关注集自成一个对象，
// 勾选只做定点 DOM 更新；而 renderApp 真的跑了的时候，行渲染器会**读**这里把复选框画成勾上的样子、
// syncSelectionHighlightLayers 会把黄色标记重新铺一遍 —— 于是「扛得住整页重渲染」是结构上的，
// 不是靠谁记得同步。
//
// 【关注属于文档，不属于对话】所以它活过「清理」（chatResetConversation 一个字都不碰它），
// 也活过刷新（落 localStorage）。它只会被两件事清掉：用户自己取消 / 重新锚定失败（见 focusResolve）。

const FOCUS_LS_KEY = 'focusEntries';
const FOCUS_MAX = 40;               // 上限。再多列表就看不过来了，而且提示里会喧宾夺主
const FOCUS_QUOTE_MAX = 600;        // 片段引文的字符上限（整行条目不受此限，它带的就是整行）

// 四套高亮的优先级。**写死在这里**，不是「谁后画谁赢」那种涌现出来的顺序。
// 数字越小越优先，同一批字符只会被优先级最高的那一套包住，绝不套两层 mark。
//   sent  整句改写范围 —— 它说的是「点下去这一整片会被替换掉」，后果最重，必须永远看得见
//   sel   当前选区     —— 用户此刻正指着的东西
//   cross 跨栏对应     —— 对当前选区的瞬时回答
//   focus 额外关注     —— 长期存在的环境信息，最不急，让位给上面三个
const FOCUS_MARK_PRI = { sent: 0, sel: 1, cross: 2, focus: 3 };
const FOCUS_KIND_BY_PRI = ['sent', 'sel', 'cross', 'focus'];
const FOCUS_MARK_CLASS = { sent: 'sent-scope', sel: '', cross: 'cross-hl', focus: 'focus-hl' };

const FocusState = {
    entries: [],        // 见 focusMakeEntry
    seq: 0,             // 每次增删改 +1。只用于「上下文身份」和调试，不参与任何判定
    pending: false,     // 已经排了一次异步复核（防抖，见 focusPaintRendered）
    booted: false
};

// 一条关注。整行条目和片段条目共用这个形状，靠 whole 区分。
// quote 对**两种**条目都是判定依据：行被改到 quote 找不到 / 找到多处，这条就作废。
//   whole=true  ：判定用 quote，但发出去和画出来的**范围**是此刻的整行（见 focusResolve 末尾），
//                 而且每次复核成功都把 quote 重新盖成当前整行 —— 于是一行被追加/微调之后
//                 标记跟着走，而**换一份文档**时第 11 行的引文对不上，标记会当场可见地作废。
//                 （早先 whole 不比对 quote，结果是「行号一样就算同一行」：换文档之后标记
//                  静默指向另一段完全不相干的话，还照样发给模型。）
//   whole=false ：判定同上，范围就是那一段引文本身。
function focusMakeEntry(o) {
    return {
        id: 'k' + (++FocusState.seq) + '-' + Date.now().toString(36),
        rowIndex: o.rowIndex,
        side: o.side,
        whole: !!o.whole,
        quote: String(o.quote == null ? '' : o.quote),
        offset: Math.max(0, Math.floor(Number(o.offset) || 0)),
        // 片段条目专用的上下文（决策 4：一个光秃秃的 token 对模型毫无用处）
        sentence: o.sentence == null ? '' : String(o.sentence),
        sentOffset: Math.max(0, Math.floor(Number(o.sentOffset) || 0)),   // 片段在所在句里的偏移
        sentFallback: !!o.sentFallback,                                   // findSentenceRange 拿不准 → 退回整行
        at: Date.now()
    };
}

function focusCount() {
    try { return FocusState.entries.length; } catch (e) { return 0; }
}

// 这一行、这一侧此刻的真值。正在编辑就读 textarea 缓冲区，否则读已提交的 pair。
// 和 chatLiveBase 是同一个语义，这里单独包一层只为了「渲染路径调用它绝不可能抛」。
function focusLiveBase(rowIndex, side) {
    try {
        const editing = (AppState.activeIndex === rowIndex);
        const v = editing
            ? (AppState.editValues || {})[side]
            : ((AppState.translationPairs || [])[rowIndex] || {})[side];
        return (typeof v === 'string') ? v : '';
    } catch (e) { return ''; }
}

// —— 重新锚定（C3）——
// 一条关注存下来的 (offset, quote) 会被**任何一次**对这一行的编辑打乱，包括从对话里点「应用」。
// 所以每次要用它之前都重新解一次，解不出来就作废。三种结局，没有第四种：
//   ① 原位还是那段字        → 留在原位（最强证据：那一处逐字就是用户当初标的东西）
//   ② 全行里只有一处是那段字 → 挪过去
//   ③ 一处都没有 / 有好几处   → **作废**。「有歧义就是中止」是这个文件里到处都在用的规矩，
//                              一个指错地方的关注比没有关注糟糕得多。
function focusResolve(e) {
    const out = { ok: false, start: 0, end: 0, text: '', why: '' };
    try {
        const pairs = AppState.translationPairs;
        if (!Array.isArray(pairs) || !pairs.length) { out.why = '当前没有已翻译的内容'; return out; }
        if (typeof e.rowIndex !== 'number' || e.rowIndex < 0 || e.rowIndex >= pairs.length) {
            out.why = '这一行已经不在了'; return out;
        }
        const base = focusLiveBase(e.rowIndex, e.side);
        const q = String(e.quote || '');
        if (!q) { out.why = '标记的文字是空的'; return out; }
        if (base.slice(e.offset, e.offset + q.length) === q) {
            out.ok = true; out.start = e.offset; out.end = e.offset + q.length; out.text = q;
        } else {
            const first = base.indexOf(q);
            if (first === -1) {
                out.why = e.whole ? '这一行已经不是你标记时的那一段了（换了文档，或者整行被改写）'
                                  : '这段文字已经不在这一行里了';
                return out;
            }
            if (base.indexOf(q, first + 1) !== -1) {
                out.why = '这段文字现在在这一行里出现了不止一次，无法确定你标的是哪一处'; return out;
            }
            out.ok = true; out.start = first; out.end = first + q.length; out.text = q;
        }
        // 整行条目：**判定**照旧走上面那三条（引文还在且唯一），但**范围**永远是此刻的整行 ——
        // 用户标的是「这一行」，不是当时那几个字符，所以行被追加/删减之后标记跟着走。
        // 早先这里对 whole 直接 return ok，等于「行号一样就算同一行」；换一份文档之后
        // 第 11 行是另一段完全不相干的话，标记却静默地指了过去（复核也就永远判不出问题）。
        if (e.whole) { out.start = 0; out.end = base.length; out.text = base; }
        return out;
    } catch (err) {
        out.why = '复核时出错'; return out;
    }
}

function focusLabel(e) {
    try {
        return (e.side === 'src' ? '原文' : '译文') + ' 第 ' + (e.rowIndex + 1) + ' 行 · '
            + (e.whole ? '整行' : ('「' + focusEllipsis(e.quote, 18) + '」'));
    } catch (err) { return '一条关注'; }
}

function focusEllipsis(s, n) {
    const t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
}

// —— 查找 / 增删 ——
function focusIndexOfWhole(rowIndex, side) {
    for (let i = 0; i < FocusState.entries.length; i++) {
        const e = FocusState.entries[i];
        if (e.whole && e.rowIndex === rowIndex && e.side === side) return i;
    }
    return -1;
}

// 片段条目的「就是这一条」：同一行同一侧、引文逐字相同、而且此刻解出来的位置就是这个位置。
// 用解出来的位置而不是存下来的 offset —— 否则行被改过之后，弹窗里的复选框会显示成没勾。
function focusIndexOfSpan(rowIndex, side, quote, start) {
    for (let i = 0; i < FocusState.entries.length; i++) {
        const e = FocusState.entries[i];
        if (e.whole || e.rowIndex !== rowIndex || e.side !== side || e.quote !== quote) continue;
        const r = focusResolve(e);
        if (r.ok && r.start === start) return i;
        if (!r.ok && e.offset === start) return i;
    }
    return -1;
}

function focusHasWholeRow(rowIndex, side) {
    try { return focusIndexOfWhole(rowIndex, side) !== -1; } catch (e) { return false; }
}

// 关注集变了之后统一收口：落盘 + 重画高亮 + 刷新复选框 + 刷新对话窗里的清单。
// **绝不调用 setState** —— 勾一个复选框不该重渲染整页（那正是行内编辑被静默提交的那条老路）。
function focusAfterChange() {
    try { focusSave(); } catch (e) {}
    try { syncSelectionHighlightLayers(); } catch (e) {}
    try { focusRenderChip(); } catch (e) {}
    try { if (typeof chatUpdateBar === 'function' && ChatState && ChatState.open) chatUpdateBar(); } catch (e) {}
}

function focusAdd(entry) {
    if (FocusState.entries.length >= FOCUS_MAX) {
        try {
            showToast('最多同时关注 ' + FOCUS_MAX + ' 处，先取消几处再加。', 'warning');
        } catch (e) {}
        return false;
    }
    FocusState.entries.push(entry);
    return true;
}

function focusRemoveAt(i) {
    if (i >= 0 && i < FocusState.entries.length) FocusState.entries.splice(i, 1);
}

function focusRemoveById(id) {
    try {
        for (let i = 0; i < FocusState.entries.length; i++) {
            if (FocusState.entries[i].id === id) { FocusState.entries.splice(i, 1); break; }
        }
        FocusState.seq++;
        focusAfterChange();
    } catch (e) { console.error('[focus] remove failed', e); }
}

function focusClearAll() {
    try {
        const n = FocusState.entries.length;
        FocusState.entries = [];
        FocusState.seq++;
        focusAfterChange();
        if (n) {
            try { chatAppendRow('system', '已清空全部 ' + n + ' 处「额外关注」。文档上下文不受影响，下一轮照样带整篇。'); } catch (e) {}
        }
    } catch (e) { console.error('[focus] clearAll failed', e); }
}

// 行上那颗复选框：整行关注。el 是那个 <input>，它的 checked 已经被浏览器翻好了。
// C7（对话上下文收窄）：只有左栏（原文/src）能被关注——右栏译文不再进上下文，勾了也没有
// 意义。界面上右栏那颗复选框已经不渲染（focusCheckboxHtml 直接返回空字符串），这里再守一道，
// 防止有别的调用点误传 side='tgt' 悄悄创建一条发不出去、也用不上的关注。
function focusToggleRow(rowIndex, side, el) {
    try {
        if (side !== 'src') { if (el) el.checked = false; return; }
        const want = el ? !!el.checked : !focusHasWholeRow(rowIndex, side);
        const at = focusIndexOfWhole(rowIndex, side);
        if (want && at === -1) {
            const base = focusLiveBase(rowIndex, side);
            if (!base) {
                if (el) el.checked = false;
                try { showToast('这一行是空的，没有可关注的内容。', 'warning'); } catch (e) {}
                return;
            }
            if (!focusAdd(focusMakeEntry({ rowIndex: rowIndex, side: side, whole: true, quote: base, offset: 0 }))) {
                if (el) el.checked = false;
                return;
            }
        } else if (!want && at !== -1) {
            focusRemoveAt(at);
        }
        FocusState.seq++;
        focusAfterChange();
    } catch (e) {
        console.error('[focus] toggleRow failed', e);
    }
}

// 选词弹窗里那颗复选框：把**当前选区**登记成一条片段关注。
// C4：它是状态开关不是动作 —— 不关闭弹窗、不发请求、立刻显示状态；
// 而且弹窗关掉也不会把刚勾上的关注取消（关注在 FocusState 里，和弹窗没有生命周期关系）。
function focusTogglePopupSpan(el) {
    try {
        const s = AppState.synonymState;
        // C7：field 只接受 'src'——右栏（译文）选词不再提供「额外关注这一段」入口。
        if (!s || !s.show || typeof s.index !== 'number' || s.field !== 'src') {
            if (el) el.checked = false;
            return;
        }
        const rowIndex = s.index;
        const side = s.field;
        const range = (s.selectionRange && typeof s.selectionRange === 'object') ? s.selectionRange : null;
        if (!range) { if (el) el.checked = false; return; }
        const base = focusLiveBase(rowIndex, side);
        let start = Math.max(0, Math.min(base.length, Math.floor(Number(range.start) || 0)));
        let end = Math.max(0, Math.min(base.length, Math.floor(Number(range.end) || 0)));
        if (end <= start) { if (el) el.checked = false; return; }
        const quote = base.slice(start, end);
        if (!quote || quote.length > FOCUS_QUOTE_MAX) {
            if (el) el.checked = false;
            try { showToast('这一段太长了，直接用整行的「关注」更合适。', 'warning'); } catch (e) {}
            return;
        }

        const at = focusIndexOfSpan(rowIndex, side, quote, start);
        const want = el ? !!el.checked : (at === -1);
        if (want && at === -1) {
            // 决策 4：片段必须带着上下文一起发。所在句由**已经上线的** findSentenceRange 算 ——
            // 它已经把 $..$、\cmd[..]{..} 和缩写点都遮住了，而且**拿不准时返回 null**。
            // null 的时候退回整行，绝不自己猜一个句子边界（猜错 = 给模型一个错误的语境）。
            const sr = findSentenceRange(base, start, end);
            const sentence = sr ? sr.text : base;
            const sentOffset = sr ? (start - sr.start) : start;
            if (!focusAdd(focusMakeEntry({
                rowIndex: rowIndex, side: side, whole: false,
                quote: quote, offset: start,
                sentence: sentence, sentOffset: sentOffset, sentFallback: !sr
            }))) {
                if (el) el.checked = false;
                return;
            }
        } else if (!want && at !== -1) {
            focusRemoveAt(at);
        }
        FocusState.seq++;
        focusAfterChange();
    } catch (e) {
        console.error('[focus] togglePopupSpan failed', e);
    }
}

// 弹窗里那颗复选框此刻该不该是勾上的
function focusPopupChecked() {
    try {
        const s = AppState.synonymState;
        if (!s || !s.show || typeof s.index !== 'number') return false;
        if (s.field !== 'src') return false;   // C7：只有左栏能关注
        const range = (s.selectionRange && typeof s.selectionRange === 'object') ? s.selectionRange : null;
        if (!range) return false;
        const base = focusLiveBase(s.index, s.field);
        const start = Math.max(0, Math.min(base.length, Math.floor(Number(range.start) || 0)));
        const end = Math.max(0, Math.min(base.length, Math.floor(Number(range.end) || 0)));
        if (end <= start) return false;
        return focusIndexOfSpan(s.index, s.field, base.slice(start, end), start) !== -1;
    } catch (e) { return false; }
}

// 把页面上所有关注复选框的勾选态和外观刷成和 FocusState 一致。
// 定点更新，**不重渲染**：行正在编辑时勾一下复选框，那一行的 textarea 一个字都不会动。
function focusSyncCheckboxes() {
    try {
        const boxes = document.querySelectorAll('[data-focus-cb]');
        for (let i = 0; i < boxes.length; i++) {
            const wrap = boxes[i];
            const key = wrap.getAttribute('data-focus-key') || '';
            let on = false;
            if (key === 'pop') {
                on = focusPopupChecked();
            } else {
                const parts = key.split('|');
                on = focusHasWholeRow(Number(parts[0]), parts[1]);
            }
            const input = wrap.querySelector('input[type="checkbox"]');
            if (input && input.checked !== on) input.checked = on;
            if (on) wrap.classList.add('is-on');
            else wrap.classList.remove('is-on');
        }
    } catch (e) {}
}

// —— 画：编辑行（镜像层）——
// 返回这一行这一侧的关注区间，坐标是**原始文本**的坐标（镜像层铺的就是原始文本）。
function focusLiveRanges(rowIndex, side, text) {
    const out = [];
    try {
        const n = (typeof text === 'string') ? text.length : 0;
        if (!n) return out;
        for (let i = 0; i < FocusState.entries.length; i++) {
            const e = FocusState.entries[i];
            if (e.rowIndex !== rowIndex || e.side !== side) continue;
            if (e.whole) { out.push({ start: 0, end: n }); continue; }
            const q = String(e.quote || '');
            if (!q) continue;
            // 编辑态下用户可能正打到一半，所以这里只解位置、**不作废**任何条目：
            // 解不出来就这一帧不画。作废是 focusRevalidate 的事，而它只在用户真的做完一件事之后跑。
            let start = -1;
            if (text.slice(e.offset, e.offset + q.length) === q) start = e.offset;
            else {
                const first = text.indexOf(q);
                if (first !== -1 && text.indexOf(q, first + 1) === -1) start = first;
            }
            if (start === -1) continue;
            out.push({ start: start, end: start + q.length });
        }
    } catch (err) {}
    return out;
}

// 把若干区间铺成互不嵌套的 <mark>。区间可以任意重叠、任意顺序。
// 做法：先按字符算出「这个字归哪一套管」，再把连续同归属的字合成一段。
// 于是 (a) 永远不会出现 <mark> 套 <mark>；(b) 优先级是查表查出来的，不是画的顺序碰巧决定的。
function focusPaintFlat(text, spans) {
    try {
        const n = (typeof text === 'string') ? text.length : 0;
        if (!n) return '';
        if (!Array.isArray(spans) || !spans.length) return '';
        const NONE = FOCUS_KIND_BY_PRI.length;      // 4 = 没有任何一套盖到
        const win = new Array(n);
        const fo = new Array(n);
        for (let i = 0; i < n; i++) { win[i] = NONE; fo[i] = false; }
        for (let k = 0; k < spans.length; k++) {
            const sp = spans[k];
            const pri = FOCUS_MARK_PRI[sp && sp.kind];
            if (pri === undefined) continue;
            let a = Math.floor(Number(sp.start));
            let b = Math.floor(Number(sp.end));
            if (!isFinite(a) || !isFinite(b)) continue;
            a = Math.max(0, Math.min(n, a));
            b = Math.max(0, Math.min(n, b));
            for (let i = a; i < b; i++) {
                if (pri < win[i]) win[i] = pri;
                if (sp.kind === 'focus') fo[i] = true;
            }
        }
        let html = '', i = 0;
        while (i < n) {
            const p = win[i], f = fo[i];
            let j = i + 1;
            while (j < n && win[j] === p && fo[j] === f) j++;
            const chunk = escapeHtml(text.slice(i, j));
            if (p === NONE) {
                html += chunk;
            } else {
                const kind = FOCUS_KIND_BY_PRI[p];
                let cls = FOCUS_MARK_CLASS[kind] || '';
                if (f && kind !== 'focus') cls = (cls ? cls + ' ' : '') + 'also-focus';
                html += cls ? ('<mark class="' + cls + '">' + chunk + '</mark>')
                            : ('<mark>' + chunk + '</mark>');
            }
            i = j;
        }
        return html;
    } catch (e) {
        return '';
    }
}

// —— 画：非编辑行（已渲染的 marked / KaTeX 正文）——
function clearRenderedFocusHighlights() {
    try {
        const spans = document.querySelectorAll('span[data-focus-hl]');
        for (let i = 0; i < spans.length; i++) {
            const span = spans[i];
            const parent = span.parentNode;
            if (!parent) continue;
            parent.replaceChild(document.createTextNode(span.textContent || ''), span);
            parent.normalize();   // 拆开的相邻文本节点合回去，下一轮偏移才算得准
        }
    } catch (e) {}
}

// 这个文本节点是不是已经被跨栏高亮包住了。是的话这一趟整段跳过 ——
// 优先级表里 cross 赢 focus，而且两套 span 互相嵌套会让各自的清理逻辑失准。
function focusInsideCross(node, host) {
    try {
        let p = node.parentNode;
        while (p && p !== host) {
            if (p.nodeType === 1 && p.hasAttribute && p.hasAttribute('data-cross-hl')) return true;
            p = p.parentNode;
        }
    } catch (e) {}
    return false;
}

function focusPaintRendered() {
    let unresolved = 0;
    try {
        const entries = FocusState.entries;
        if (!entries.length) return;

        // 按 (行, 侧) 归组：一个容器只走一次文本节点
        const groups = {};
        for (let i = 0; i < entries.length; i++) {
            const e = entries[i];
            if (AppState.activeIndex === e.rowIndex) continue;      // 编辑行归镜像层管
            const k = e.rowIndex + '|' + e.side;
            (groups[k] || (groups[k] = [])).push(e);
        }

        const keys = Object.keys(groups);
        for (let g = 0; g < keys.length; g++) {
            const list = groups[keys[g]];
            const parts = keys[g].split('|');
            const idx = Number(parts[0]);
            const side = parts[1];
            const host = findRenderedRowBody(idx, side);
            if (!host) continue;

            // ⚠️ C5：复用跨栏高亮那台游走器，**不另起一套方言**。它整棵跳过 .katex 子树 ——
            //    KaTeX 的 DOM 里同一段公式有 HTML + MathML 两份文本，收进来会让扁平文本凭空翻倍；
            //    往里插节点更是直接毁掉公式排版。代价是**公式里的片段一个字都画不出来**，
            //    这正是「要么整条公式、要么什么都不画」里的「什么都不画」那一支：
            //    宁可少画一个标记，也绝不去拆 KaTeX 的文本节点。
            const flat = collectCrossTextNodes(host, { reject: ['katex'] });
            if (!flat.text) continue;

            const ranges = [];
            let whole = false;
            for (let i = 0; i < list.length; i++) {
                const e = list[i];
                // 整行条目也要先解一次：解不出来（换了文档 / 整行被改写）就**一笔都不画**，
                // 否则从这一帧到异步复核落地之间，整行黄底会盖在用户从没标过的一段话上。
                if (e.whole) { if (focusResolve(e).ok) whole = true; else unresolved++; continue; }
                // 已渲染正文的扁平文本 ≠ 这一行的原始文本（markdown 记号没了、公式被跳过了），
                // 所以这里**不用**存下来的 offset，改成逐字找 + 只认唯一命中。
                // 这条纪律和跨栏高亮完全一致：宁可不画，绝不画错。
                const q = String(e.quote || '');
                if (!q) continue;
                const first = flat.text.indexOf(q);
                if (first === -1 || flat.text.indexOf(q, first + 1) !== -1) {
                    // 【「这里画不出来」和「这条标记已经失效」是两回事，绝不能混】
                    // 渲染后的扁平文本里没有这段字，最常见的原因是它根本不该在这里出现：
                    // `27.3\%` 渲染成 `27.3%`、`**粗**` 的星号被 marked 吃掉、公式整段被跳过。
                    // 这些条目对着**行的原始文本**是好好的，照样会发给模型 —— 只是这一帧画不出来。
                    // 所以只有连原始文本都对不上，才值得排一次复核；否则每一次 renderApp
                    // 都会白排一次，而且把一条完全正常的标记算进「疑似失效」里。
                    if (!focusResolve(e).ok) unresolved++;
                    continue;
                }
                ranges.push({ start: first, end: first + q.length });
            }
            let merged;
            if (whole) {
                merged = [{ start: 0, end: flat.text.length }];
            } else {
                ranges.sort(function (a, b) { return a.start - b.start || b.end - a.end; });
                merged = [];
                for (let i = 0; i < ranges.length; i++) {
                    const last = merged[merged.length - 1];
                    if (last && ranges[i].start <= last.end) { last.end = Math.max(last.end, ranges[i].end); continue; }
                    merged.push({ start: ranges[i].start, end: ranges[i].end });
                }
            }
            if (!merged.length) continue;

            for (let n = 0; n < flat.nodes.length; n++) {
                const entry = flat.nodes[n];
                if (focusInsideCross(entry.node, host)) continue;
                const intervals = [];
                for (let r = 0; r < merged.length; r++) {
                    const s = Math.max(merged[r].start, entry.start);
                    const e2 = Math.min(merged[r].end, entry.end);
                    if (e2 > s) intervals.push({ s: s - entry.start, e: e2 - entry.start });
                }
                if (intervals.length) {
                    wrapCrossIntervals(entry.node, intervals, { className: 'focus-hl-span', attr: 'data-focus-hl' });
                }
            }
        }
    } catch (e) {
        // 装饰性功能：坏了就当没这个功能，绝不能把异常带回渲染路径
    }
    // 有条目在「不在编辑态的行」上解不出来 ⇒ 排一次异步复核。
    // **异步**是关键：这个函数是渲染路径的一部分，而复核会写状态、发提示、可能弹 toast，
    // 那些东西一件都不许在 root.innerHTML 刚铺完的那一帧里做。
    if (unresolved) focusScheduleRevalidate();
}

function focusScheduleRevalidate() {
    try {
        if (FocusState.pending) return;
        FocusState.pending = true;
        setTimeout(function () {
            FocusState.pending = false;
            try { focusRevalidate('文档变了'); } catch (e) {}
        }, 0);
    } catch (e) { FocusState.pending = false; }
}

// —— 文档变了：一个地方通知所有人（C3 + chat-auto-context.md 决策 1 的收口）——
//
// 【为什么挂在 renderApp 的末尾，而不是挂在 handleTranslate / saveRowUpdate 上】
// 文档的每一条改动路径最后都必经 renderApp：翻译完成、行编辑、智能更新、应用模型提案、
// 撤销/重做、从历史恢复、清空、重新生成全部，连 handleInputChange 里那条
// 「直接改数组再自己调 renderApp」的旁路也不例外。挂在这里 = 一处覆盖全部；
// 挂在各个调用点上 = 每加一条新路径都要有人记得补一次 —— 而「聊天窗底部读数在重译之后
// 一直报着上一份文档的行数和一个实线的实测值」正是没人补上的那一次。
//
// 【为什么整段是 setTimeout】这个函数跑在 root.innerHTML 刚铺完的那一帧里。复核会弹 toast、
// 会往对话窗写系统消息，重画状态条要读 DOM —— 一件都不许在这一帧里做。
// 而且它**绝不调用 setState**：对话窗和关注集都在 #root 外面自己定点重绘。
let __focusDocSig = null;

function focusDocSig() {
    try {
        const pairs = AppState.translationPairs;
        if (!Array.isArray(pairs)) return '';
        let s = '';
        for (let i = 0; i < pairs.length; i++) {
            const p = pairs[i] || {};
            // 分隔符写成转义 —— 源码里放裸控制字符肉眼查不出来。它们保证「src 结尾接 tgt 开头」
            // 不会和「src 里本来就写着那几个字」撞成同一个指纹。
            s += '\u0000' + String(p.src == null ? '' : p.src)
               + '\u0001' + String(p.tgt == null ? '' : p.tgt);
        }
        return pairs.length + ':' + chatRowHash(s);
    } catch (e) { return ''; }
}

function focusNoteDocumentChanged() {
    try {
        const sig = focusDocSig();
        if (sig === __focusDocSig) return;
        __focusDocSig = sig;
        setTimeout(function () {
            try { focusRevalidate('文档变了'); } catch (e) {}
            // 状态条上那句「文档 1–18/18 行」和那个环，说的都是「下一轮会发出去什么」。
            // 文档换了却不重画，它就在拿一份已经不存在的载荷冒充当前值。
            try { if (ChatState && ChatState.open) chatUpdateBar(); } catch (e) {}
        }, 0);
    } catch (e) {}
}

// —— 复核 + 作废（C3 的收口）——
// 触发点只有三个，都是「一件事已经做完了」的时刻：按发送（chatSend）、
// 渲染后发现有标记解不出来（focusPaintRendered）、以及文档指纹变了（focusNoteDocumentChanged，
// 挂在 renderApp 末尾，覆盖翻译/编辑/应用/撤销/恢复历史/清空这全部路径）。
// 作废是可见的：对话窗里一条系统消息 + 一条 toast，绝不悄悄少掉一个黄色标记。
// 返回被作废的条目数组。
function focusRevalidate(reason) {
    const dropped = [];
    try {
        if (!FocusState.entries.length) return dropped;
        // 一份文档都没有的时候什么都不作废：刚刷新完页面、还没恢复历史，
        // 此刻「解不出来」说明的是文档没加载，不是用户的标记失效了。
        const pairs = AppState.translationPairs;
        if (!Array.isArray(pairs) || !pairs.length) return dropped;

        const keep = [];
        for (let i = 0; i < FocusState.entries.length; i++) {
            const e = FocusState.entries[i];
            // 这一行正在编辑：用户可能正打到一半，此刻判「找不到」并不代表标记失效。
            // 提交之后 renderApp 会再来一遍，那时候才结算。
            if (AppState.activeIndex === e.rowIndex) { keep.push(e); continue; }
            const r = focusResolve(e);
            if (r.ok) {
                if (!e.whole) e.offset = r.start;      // 重新锚定
                // 整行条目：解出来了 ⇒ 引文重新盖成此刻的整行。于是「这一行被追加/微调」
                // 的标记跟着走，而「换了一份文档」下一次就解不出来（引文对不上）当场作废。
                else e.quote = r.text;
                keep.push(e);
            } else {
                dropped.push({ e: e, why: r.why });
            }
        }
        if (!dropped.length) return dropped;

        FocusState.entries = keep;
        FocusState.seq++;
        focusAfterChange();

        const lines = dropped.map(function (d) { return '· ' + focusLabel(d.e) + ' —— ' + d.why; });
        try {
            chatAppendRow('system', '有 ' + dropped.length + ' 处「额外关注」失效了（' + (reason || '文档变了') + '），已经取消：\n'
                + lines.join('\n')
                + '\n其余关注不受影响。绝不会把一个已经指错地方的标记发给模型。');
        } catch (e) {}
        try {
            showToast('有 ' + dropped.length + ' 处「额外关注」因为原文改动已失效并被取消。', 'warning');
        } catch (e) {}
    } catch (err) {
        console.error('[focus] revalidate failed', err);
    }
    return dropped;
}

// —— 落盘 ——
// 关注属于文档，所以它要活过刷新。**不**和 sessionId 绑死：绑死的话，刷新之后
// AppState.sessionId 是新生成的，一次刷新就把用户的标记全丢了。
// 换了一份文档会怎么样？文档指纹一变，focusNoteDocumentChanged（挂在 renderApp 末尾）
// 就排一次复核，那些标记逐条解不出来（引文对不上新那一行）然后**可见地**被取消 ——
// 这正是 C3 想要的行为，不需要再加一套会话判定。
function focusSave() {
    try {
        localStorage.setItem(FOCUS_LS_KEY, JSON.stringify({
            v: 1,
            sessionId: String(AppState.sessionId || ''),
            entries: FocusState.entries
        }));
    } catch (e) {}
}

function focusLoad() {
    try {
        const raw = localStorage.getItem(FOCUS_LS_KEY);
        if (!raw) return;
        const j = JSON.parse(raw);
        if (!j || typeof j !== 'object' || !Array.isArray(j.entries)) return;
        const out = [];
        for (let i = 0; i < j.entries.length && out.length < FOCUS_MAX; i++) {
            const e = j.entries[i];
            // 逐键校验，脏值一律**不收**（和 chatParamsLoad 同一条纪律）
            if (!e || typeof e !== 'object') continue;
            if (typeof e.rowIndex !== 'number' || !isFinite(e.rowIndex) || e.rowIndex < 0) continue;
            // C7（对话上下文收窄）：只收左栏（原文/src）。旧版本允许在右栏（译文/tgt）打关注，
            // localStorage 里可能还留着那时候存下的条目——这里就是迁移点：不是 src 的一律
            // 不收，静默清理，绝不让一条指不到（右栏已经不进上下文）的悬空关注混进这一版。
            if (e.side !== 'src') continue;
            if (typeof e.quote !== 'string' || !e.quote) continue;
            if (!e.whole && e.quote.length > FOCUS_QUOTE_MAX) continue;
            out.push(focusMakeEntry({
                rowIndex: Math.floor(e.rowIndex),
                side: e.side,
                whole: !!e.whole,
                quote: e.quote,
                offset: e.offset,
                sentence: typeof e.sentence === 'string' ? e.sentence : '',
                sentOffset: e.sentOffset,
                sentFallback: !!e.sentFallback
            }));
        }
        FocusState.entries = out;
        FocusState.booted = true;
    } catch (e) {}
}

// —— 发给模型的那一段（决策 7）——
// 纯文本信封，和文档块同一套逃逸纪律：条目正文一律过 chatEscapeDelims。
//
// 【这层保护的确切边界 —— 别把它说大了】chatEscapeDelims 的正则是**整行锚定**的
// （`^[ \t]*==(CHAT|EDIT|END|DOC|FOCUS)[^\n]*==[ \t]*$`，8c4de49 就是这个形状）。
// 所以它挡得住的是「稿子里单独一行写着 ==FOCUSEND==」——那是真正会被误读成帧尾的写法；
// 挡不住的是「正常文字。==FOCUSEND==」这种**行中**出现，因为这里的条目正文是接在
// `  文本：` 后面的，那一行的行首不是 `==`。文档块的 `[3] 原文：…` 完全同理。
// 也就是说：这一帧撑得住行首的分帧符，撑不住行中的 —— 后者只会让模型看到一段
// 长得像帧尾的文字，不会让它拿到「应用」按钮（那要过四道闸门，见 chatRowProposalBase）。
// 要真堵住行中那一支，得改 chatEscapeDelims 的锚定，那是文档块和关注块共用的东西，
// 不在这一版的验收范围里；所以这里把话说准，而不是写一句「撑不破这一帧」了事。
//
// **不做任何解析后的动作**：这一段只是提示词的一部分，模型读完之后照旧要走四道闸门才能改字。
function focusWireBlock() {
    try {
        const entries = FocusState.entries;
        if (!entries.length) return '';
        const pairs = Array.isArray(AppState.translationPairs) ? AppState.translationPairs : [];
        if (!pairs.length) return '';

        const items = [];
        for (let i = 0; i < entries.length; i++) {
            const e = entries[i];
            const r = focusResolve(e);
            if (!r.ok) continue;                       // 解不出来的一律不发（陈旧的东西一个字节都不许出门）
            // C7（对话上下文收窄）：走到这里的条目 side 只可能是 'src'（焦点入口已经收窄，
            // focusLoad 也会把旧版本留下的 tgt 条目滤掉）——所以不再需要「对侧（译文）」那一段：
            // 那一段本来就是把右栏内容塞进上下文，和「只关联左边输入内容」直接冲突。
            const n = items.length + 1;
            if (e.whole) {
                items.push('[关注 ' + n + ']  整行 · 原文 · 第 ' + (e.rowIndex + 1) + ' 行\n'
                    + '  文本：' + chatEscapeDelims(r.text));
            } else {
                // 决策 4：片段必须带上「所在句 + 句内偏移」，否则模型收到的是一个光秃秃的
                // token，只能自信地猜；C7 之后不再附「对侧同一行」（那是译文，已经出上下文）。
                const sentence = String(e.sentence || r.text);
                items.push('[关注 ' + n + ']  片段 · 原文 · 第 ' + (e.rowIndex + 1) + ' 行'
                    + ' · 该片段从所在句的第 ' + e.sentOffset + ' 个字符开始\n'
                    + '  片段：' + chatEscapeDelims(r.text) + '\n'
                    + '  所在句：' + chatEscapeDelims(sentence)
                    + (e.sentFallback ? '\n  （注：这一行的句子边界判不准，「所在句」退回了整行）' : ''));
            }
        }
        if (!items.length) return '';
        return '==FOCUS n=' + items.length + '==\n'
            + '用户额外标出了以下 ' + items.length + ' 处，请在回答时重点留意它们。\n'
            + '⚠ 这是**关注**，不是修改授权：没有被明确要求改动之前，一个字都不要改，也不要因为'
            + '它们被标出来就输出 ==EDIT== 块。\n'
            + items.join('\n')
            + '\n==FOCUSEND==';
    } catch (e) {
        console.error('[focus] wireBlock failed', e);
        return '';
    }
}

// 上下文身份的一部分：关注集一变，用量环上那个「实测」数字就该退回估算。
function focusSig() {
    try { return FocusState.entries.length + ':' + FocusState.seq; } catch (e) { return '0:0'; }
}

// —— 对话窗里的清单（计数 + 全部清除）——
// 【为什么非要有这个】十分钟前标的一处关注，会一直悄悄地跟着每一轮问话走。
// 不把它摆在眼前，用户就会拿一个自己都忘了的重点去问一个不相干的问题，
// 然后觉得模型「答得莫名其妙」。
function focusRenderChip() {
    try {
        const slot = document.getElementById('aiChatFocusSlot');
        if (!slot) return;
        slot.textContent = '';
        const entries = FocusState.entries;
        if (!entries.length) return;

        const box = document.createElement('div');
        box.className = 'aichat-focus';

        // 【计数说的必须是「这一轮真会发出去几处」】否则会出现「芯片写着 1 处、
        // focusWireBlock() 返回空字符串」这种对不上的读数（最容易撞见的场合：刚刷新完页面
        // 或刚点了 CLEAR，一份文档都没有，此时复核按设计不作废任何条目）。
        // 数字用的是和 focusWireBlock 同一个判定 focusResolve，不是另算一套。
        let live = 0;
        const okById = {};
        for (let i = 0; i < entries.length; i++) {
            const good = focusResolve(entries[i]).ok;
            okById[entries[i].id] = good;
            if (good) live++;
        }
        // 【算出「这一轮只发得出 k < n 处」= 此刻就已经知道有标记指不到地方了】
        // 只把这句话印在 chip 上、等下一次渲染顺带复核，等于让一条已经失效的标记在界面上
        // 继续摆着 —— 而渲染路径上那条备份复核（focusPaintRendered）只在 renderApp 里排，
        // 一旦这一帧的渲染中途炸了，它可能一次都没排上。这里主动补一次：复核是异步的
        // （setTimeout(0)）而且自带 pending 防抖，排一次既不会拖慢这一帧，也不会叠起来。
        // 复核本身对「文档还没加载」「这一行正在编辑」都有守卫，绝不会误杀。
        if (live < entries.length) { try { focusScheduleRevalidate(); } catch (eS) {} }

        const head = document.createElement('div');
        head.className = 'aichat-focus-h';
        const label = document.createElement('span');
        label.className = 'aichat-focus-label';
        label.textContent = (live === entries.length)
            ? ('额外关注 · ' + entries.length + ' 处')
            : ('额外关注 · ' + entries.length + ' 处（这一轮只发得出 ' + live + ' 处）');
        label.setAttribute('data-tip', '这些是你在句对上或选词弹窗里勾出来的重点，每一轮都会随问题一起发过去，'
            + '让模型多留意它们。它**不是**修改授权：要改字照旧得由模型给出 ==EDIT== 块，'
            + '再过行号 / 逐字引文 / 快照未变这三关。'
            + '原文改到某一条对不上了（换了文档、整行被改写、片段找不到或出现了多处），'
            + '那一条会被自动取消并在这里告诉你 —— 整行条目和片段条目一视同仁。'
            + '暂时解不出来又还没到复核时机的（比如刚刷新、文档还没加载），会在括号里如实报「只发得出几处」。');
        label.setAttribute('data-tip-pos', 'top-start');
        const spacer = document.createElement('span');
        spacer.className = 'aichat-focus-spacer';
        const clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'aichat-focus-clear';
        clear.textContent = '全部清除';
        clear.setAttribute('data-tip', '取消全部关注。文档上下文不受影响 —— 下一轮照样带整篇译文。');
        clear.setAttribute('data-tip-pos', 'top-end');
        clear.addEventListener('click', function () { focusClearAll(); });
        head.appendChild(label);
        head.appendChild(spacer);
        head.appendChild(clear);
        box.appendChild(head);

        for (let i = 0; i < entries.length; i++) {
            const e = entries[i];
            const row = document.createElement('div');
            row.className = 'aichat-focus-item';
            const kind = document.createElement('span');
            kind.className = 'aichat-focus-kind' + (e.whole ? ' is-row' : '');
            kind.textContent = e.whole ? '整行' : '片段';
            const txt = document.createElement('span');
            txt.className = 'aichat-focus-text';
            // textContent：标出来的可能是 LaTeX，可能含 '<'
            txt.textContent = (e.side === 'src' ? '原文' : '译文') + ' 第 ' + (e.rowIndex + 1) + ' 行'
                + (e.whole ? '' : '：' + focusEllipsis(e.quote, 24))
                + (okById[e.id] ? '' : ' · 现在解不出来，这一轮不发');
            const x = document.createElement('button');
            x.type = 'button';
            x.className = 'aichat-focus-x';
            x.textContent = '×';
            x.setAttribute('data-tip', '取消这一处关注。');
            x.setAttribute('data-tip-pos', 'top-end');
            (function (id) { x.addEventListener('click', function () { focusRemoveById(id); }); })(e.id);
            row.appendChild(kind);
            row.appendChild(txt);
            row.appendChild(x);
            box.appendChild(row);
        }
        slot.appendChild(box);
    } catch (e) {
        console.error('[focus] renderChip failed', e);
    }
}

// 行上那颗复选框的 HTML。渲染路径专用 —— 只读 FocusState，绝不抛错。
//   variant 'row'    ：非编辑行右上角那颗（绝对定位，脱离文档流 ⇒ 对行高零影响）
//   variant 'toolbar'：编辑行 AI 工具栏里那颗
function focusCheckboxHtml(idx, side, variant) {
    try {
        // C7（对话上下文收窄）：只有左栏（原文/src）能被关注——右栏译文不再进对话上下文，
        // 那颗复选框勾了也不起作用，所以右栏干脆不渲染它，而不是渲染一个点了没反应的控件。
        if (side !== 'src') return '';
        const on = focusHasWholeRow(idx, side);
        const tip = '勾上 = 让对话窗的模型**额外留意**这一整行原文。'
            + '可以同时勾好几行，被勾中的文字会显示成黄色底。'
            + '这只是「请多看一眼」，不会授权模型改动它 —— 改字照旧要模型给出修改块并逐字复核。'
            + '想只关注一个词或短语，就在编辑框里选中它，弹窗里也有同一颗复选框。';
        const cls = 'focus-chip' + (variant === 'row' ? ' focus-row-chip' : '') + (on ? ' is-on' : '');
        return '<label data-focus-cb data-focus-key="' + idx + '|' + side + '" class="' + cls + '"'
            + ' onclick="event.stopPropagation();"'
            + ' data-tip="' + escapeAttr(tip) + '" data-tip-pos="' + (variant === 'row' ? 'left' : 'bottom-start') + '">'
            + '<input type="checkbox"' + (on ? ' checked' : '')
            + ' onclick="event.stopPropagation();focusToggleRow(' + idx + ',\'' + side + '\',this);">'
            + '<span class="focus-chip-t">关注</span>'
            + '</label>';
    } catch (e) {
        return '';
    }
}

// 选词弹窗里那一行「额外关注这一段」。
//
// 【C4：状态开关不该混进一排动作里】替换 / 简化 / 语法修正三颗按钮是**动作** ——
// 点下去发一次请求、然后把弹窗关掉。关注是**状态** —— 点下去什么都不发生在网络上，
// 只是记下一个标记，而且弹窗必须留在原地（用户多半还要接着看那几条候选）。
// 两者长得一样、行为不一样，是最容易让人点错的那种界面。所以：
//   · 单独一行，上面一条分隔线，摆在候选列表**下面**，不进那一排按钮；
//   · 复选框的外形（而不是按钮），一眼就知道它有「开/关」两态；
//   · 旁边一句小字，把「不会关闭面板」和「关掉面板也不会取消关注」写死在界面上。
function focusPopupRowHtml() {
    try {
        const s = AppState.synonymState;
        // C7（对话上下文收窄）：只有左栏（原文/src）能被关注。
        if (!s || typeof s.index !== 'number' || s.field !== 'src') return '';
        const on = focusPopupChecked();
        const tip = '把选中的这一段登记成「额外关注」，之后每一轮问话都会连同它的**所在句、'
            + '它在句中的位置**一起发给对话窗的模型，让它知道你在指什么（只发原文，不发译文）。'
            + '这只是「请多留意」，不是修改授权。'
            + '勾选**不会**关闭这个面板，关掉面板也**不会**取消已经勾上的关注。';
        return `
            <div class="border-t border-slate-100 mt-1 pt-2 flex flex-col gap-1">
                <label data-focus-cb data-focus-key="pop" class="focus-chip${on ? ' is-on' : ''} self-start" onclick="event.stopPropagation();" data-tip="${escapeAttr(tip)}" data-tip-pos="top">
                    <input type="checkbox"${on ? ' checked' : ''} onclick="event.stopPropagation();focusTogglePopupSpan(this);">
                    <span class="focus-chip-t">额外关注这一段</span>
                </label>
                <span class="text-[9px] text-slate-400 leading-snug">状态开关：不会关闭这个面板，关掉面板也不会取消关注。被关注的文字显示为黄色底。</span>
            </div>`;
    } catch (e) {
        return '';
    }
}

// ============= 跨栏高亮：第一级 —— 确定性锚点（零延迟、零模型调用）=============
// 这几类东西翻译过去是**原样保留**的，根本不需要问模型：
//   行内公式 $..$ / \(..\)、\cite{}/\ref{}/\eqref{}/\label{}、数字、全大写缩写。
// 抽出来直接拿去对侧 indexOf 即可。命中就收工，一个 token 都不花。
function extractCrossAnchors(selected) {
    const out = [];
    try {
        if (typeof selected !== 'string' || !selected) return out;
        const push = (raw) => {
            const s = String(raw == null ? '' : raw).trim();
            if (s.length < 2) return;                       // 单字符锚点噪声太大，一律不要
            if (out.indexOf(s) === -1) out.push(s);
        };
        const grab = (re) => { const m = selected.match(re); if (m) for (let i = 0; i < m.length; i++) push(m[i]); };

        grab(/\$[^$\n]+\$/g);                               // 行内公式 $..$
        grab(/\\\([\s\S]*?\\\)/g);                          // 行内公式 \(..\)
        grab(/\\(?:cite[a-zA-Z]*|ref|eqref|autoref|label)\s*\{[^{}]*\}/g);   // 引用类宏
        grab(/\b\d+(?:\.\d+)?\\?%/g);                       // 百分比（含 LaTeX 的 \%）先抓，比裸数字更具体
        grab(/\b\d+(?:\.\d+)+\b/g);                         // 小数 / 版本号
        grab(/\b[A-Z0-9][A-Z0-9-]{1,15}[A-Z0-9]\b/g);       // 全大写缩写：LEO、SNR、U-CPSRI、6G、BAJOR
        // 纯整数放最后，且只要 >= 2 位：单个 "2" 这种在对侧几乎必然多处出现，
        // crossFindOccurrences 的唯一性检查也会把它挡掉，抓进来只是浪费。
        grab(/\b\d{2,}\b/g);

        // 全大写那条会把纯数字也捞进来（"2026"），去掉不含字母的项，交给数字那几条负责
        const kept = out.filter(s => !(/^[0-9]+$/.test(s)) || /^\d{2,}$/.test(s));

        // 去掉「已经被更长的锚点包住」的碎片：$27.3\%$ 会顺带抽出 27.3\% / 27.3 / 27，
        // \cite{10488681,10333430} 会顺带抽出两个纯编号。它们指向的是同一处，
        // 留着只是给唯一性检查添乱，还可能有个碎片碰巧在别处独立出现。长的优先。
        kept.sort((a, b) => b.length - a.length);
        const out2 = [];
        for (let i = 0; i < kept.length; i++) {
            let covered = false;
            for (let j = 0; j < out2.length; j++) {
                if (out2[j].indexOf(kept[i]) !== -1) { covered = true; break; }
            }
            if (!covered) out2.push(kept[i]);
        }
        return out2;
    } catch (e) {
        return out;
    }
}

// ============= 跨栏高亮：第二级 —— 模型 =============
// **刻意不用 JSON**。两侧正文里都有反斜杠（\cite、\epsilon、\%），
// 一旦经过 JSON 字符串转义，\r \n \t \u 这些序列就会被解析成控制字符 ——
// 这个 app 别处把 \ref 变成回车正是同一个坑。
// 改用纯行分隔协议：一行一个片段、`@@` 开头，自己 split 自己解析，反斜杠全程原样。
function buildCrossPrompt(fromLabel, toLabel, fromText, toText, selected) {
    return `下面是一对互为翻译的句子。

【${fromLabel}】
${fromText}

【${toLabel}】
${toText}

用户在【${fromLabel}】里选中了这一小段：
<<<SEL
${selected}
SEL>>>

先判断一件事：这一小段的意思，在【${toLabel}】里到底有没有被译出来？
机器翻译经常整句整段漏译。漏了就是漏了 —— 这时【${toLabel}】里那些"位置差不多"、
"话题相关"、"看起来像术语"的文字**都不是**它的对应内容。没译出来就输出 @@NONE。

硬性规则：
1. 只能从【${toLabel}】里逐字复制，一个字都不许改、不许翻译、不许增删标点。
2. 对应内容若被别的词隔开（不连续），拆成几段分别输出，不要用省略号连接。
3. 每段单独一行，行首必须是 @@ 紧接内容（@@ 后面不加空格）。
4. 只输出这些行，不要解释、不要编号、不要引号、不要 markdown。
5. 只摘意思真正对应的最小片段，不要把整句都摘出来。
6. 下面任何一种情况都只输出一行 @@NONE，不许输出别的：
   - 【${toLabel}】漏掉了这一小段的意思；
   - 只找得到话题相关、但意思对不上的文字；
   - 拿不准。`;
}

// 解析分隔符协议。任何脏输出都只会变成「片段更少」，绝不会抛错。
function parseCrossFragments(raw) {
    const out = [];
    try {
        let text = String(raw == null ? '' : raw);
        // 推理模型的思考段。**不能**用成对正则 /<think>[\s\S]*?<\/think>/ ——
        // 开标签被 Qwen3 模板预填进提示词里，真实泄漏只有闭合标签，成对匹配是空操作
        // （实测一条 815 字符的泄漏只删掉 20 个字符）。走全文件唯一那条规则。
        text = xportThinkCut(text, XPORT_CROSS_ANCHOR).text;
        text = text.replace(/```[a-zA-Z]*\n?/g, '');             // 偶发的 markdown 代码围栏
        const lines = text.split(/\r?\n/);
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.slice(0, 2) !== '@@') continue;
            const frag = line.slice(2).trim();
            if (!frag || frag === 'NONE') continue;
            if (frag.length > 400) continue;                     // 明显跑飞了
            if (out.indexOf(frag) === -1) out.push(frag);
            if (out.length >= 8) break;
        }
    } catch (e) {}
    return out;
}

// 按当前 provider 发一次「纯文本进、纯文本出」的请求。
// 分支形状照抄 summarizeText，只是把 prompt 换成我们自己的，且全程传 signal 以便取消。
async function callModelPlainText(prompt, config, signal) {
    if (config.provider === 'local') {
        return await callLocalLLM(config.localBaseUrl, config.model, [{ role: 'user', content: prompt }], false, signal);
    }
    if (config.provider === 'openai') {
        return await callOpenAIAPI(config.model, [{ role: 'user', content: prompt }], {}, config.openaiApiKey, signal) || '';
    }
    if (config.provider === 'claude') {
        return await callClaudeAPI(config.model, [{ role: 'user', content: prompt }], {}, config.claudeApiKey, signal, config.claudeProxyUrl) || '';
    }
    return await callGeminiAPI(config.model, prompt, {}, config.geminiApiKey, signal) || '';
}

// ============= 跨栏高亮：调度 =============
// UI 永远不等这个请求。防抖 → 锚点（同步命中就当场画）→ 缓存 → 模型（异步，回来再画）。
// 每次调度都 ++seq；响应回来时 seq 对不上就是陈旧响应，直接丢弃，绝不覆盖新选区的结果。
function scheduleCrossHighlight(fromSide, idx, selectedText) {
    try {
        resetCrossHighlight();                                   // 内部会 ++seq，掐掉上一次
        if (!AppState.crossHighlightEnabled) return;
        if (typeof idx !== 'number' || (fromSide !== 'src' && fromSide !== 'tgt')) return;
        if (typeof selectedText !== 'string' || !selectedText.trim()) return;

        const toSide = otherSide(fromSide);
        const fromText = getCrossCorpus(idx, fromSide);
        const toText = getCrossCorpus(idx, toSide);
        if (!fromText || !toText) return;
        // 对侧此刻根本没有可画的地方就别花这一次调用。
        // 真实场景：viewMode 切到 'edit'/'original' 时左栏是一个大 textarea、压根没有逐行元素，
        // 这时在右栏选词，查出来的对应片段无处可画。
        if (!crossCanPaint(idx, toSide)) return;

        const mySeq = crossHighlightSeq;

        // --- 第一级：锚点。同步、免费 ---
        // 但**只有锚点几乎就是整个选区**时才敢就此收工。选中一整句话、里面碰巧夹着一条
        // \cite / 一个缩写 / 一个两位数时，只画那个 token 等于指着 3 个字符告诉用户
        // 「对应的就是这里」—— 比不画糟糕得多。这种情况一律放行到模型那一级。
        const anchors = extractCrossAnchors(selectedText);
        if (anchors.length) {
            const hits = anchors.filter(a => crossFindOccurrences(toText, a).length === 1);
            if (crossAnchorsCoverSelection(selectedText, hits)) {
                commitCrossHighlight(mySeq, idx, fromSide, toSide, hits, 'anchor');
                return;
            }
        }

        // --- 缓存：同一行、同一侧、同一段选中文本，第二次起零延迟零调用 ---
        const key = idx + '|' + fromSide + '|' + selectedText;
        if (crossHighlightCache.has(key)) {
            commitCrossHighlight(mySeq, idx, fromSide, toSide, crossHighlightCache.get(key), 'cache');
            return;
        }

        // --- 第二级：模型。防抖后异步发，UI 不等 ---
        AppState.crossHighlight = { seq: mySeq, idx, fromSide, toSide, fragments: [], status: 'pending', via: 'model' };
        crossHighlightTimer = setTimeout(() => {
            crossHighlightTimer = null;
            runCrossHighlight(mySeq, idx, fromSide, toSide, fromText, toText, selectedText, key);
        }, CROSS_HL_DEBOUNCE_MS);
    } catch (e) {
        // 调度失败 = 这次没有跨栏高亮，其它一切照旧
    }
}

async function runCrossHighlight(mySeq, idx, fromSide, toSide, fromText, toText, selectedText, key) {
    let controller = null;
    try {
        if (mySeq !== crossHighlightSeq) return;
        const config = getApiConfig();
        // 标签从这一对文本自己算，不碰 AppState.sourceLang / targetLang（理由见 crossLangLabels）
        const labels = crossLangLabels(fromText, toText);
        const prompt = buildCrossPrompt(labels.fromLabel, labels.toLabel, fromText, toText, selectedText);

        controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        crossHighlightAbort = controller;
        const raw = await callModelPlainText(prompt, config, controller ? controller.signal : null);
        if (mySeq !== crossHighlightSeq) return;                 // 选区早就换了，这是陈旧响应

        // 闸门一：逐字校验。模型说什么不算数，能在对侧原样找到且只出现一次才算数。
        const candidates = parseCrossFragments(raw);
        let verified = candidates.filter(f => crossFindOccurrences(toText, f).length === 1);
        // 闸门二：体量。逐字校验只管「是不是对侧的真文字」，管不了「是不是**对应的**那段文字」；
        // 明显不成比例的答案（选一个词回一整句、选一整句回两个字）一律整组丢掉。
        if (!crossPlausibleLength(selectedText, verified)) verified = [];

        if (crossHighlightCache.size >= CROSS_HL_CACHE_MAX) {
            const firstKey = crossHighlightCache.keys().next().value;
            if (firstKey !== undefined) crossHighlightCache.delete(firstKey);
        }
        crossHighlightCache.set(key, verified);
        commitCrossHighlight(mySeq, idx, fromSide, toSide, verified, 'model');
    } catch (e) {
        if (mySeq !== crossHighlightSeq) return;
        // 取消是预期路径，不算错误；其它错误也只是「这次没高亮」
        if (!(e && e.name === 'AbortError')) console.warn('[cross-hl] 对应查找失败：', e && e.message);
        commitCrossHighlight(mySeq, idx, fromSide, toSide, [], 'model');
    } finally {
        if (crossHighlightAbort === controller) crossHighlightAbort = null;
    }
}

// 落状态 + 重画。刻意不走 setState —— 全量重渲染会把 textarea 换掉、焦点和原生选区一起丢，
// 而这里只是加一层装饰性背景，用局部同步就够了。
function commitCrossHighlight(mySeq, idx, fromSide, toSide, fragments, via) {
    try {
        if (mySeq !== crossHighlightSeq) return;
        const list = Array.isArray(fragments) ? fragments : [];
        AppState.crossHighlight = {
            seq: mySeq, idx, fromSide, toSide,
            fragments: list,
            status: list.length ? 'ok' : 'none',
            via: via || ''
        };
        syncSelectionHighlightLayers();
    } catch (e) {}
}

// ============= 句子边界（语法修正模式的分析范围）=============
// 语法错误经常落在选区外面：选中 "results"，真正错的是后面的 "shows"。
// 只看选区就只能给出「result / results / findings」这种改了等于没改的选项，
// 所以语法模式要拿整句去问模型。
//
// 但范围一旦算错就是灾难：把一整句改写塞回一个词的位置，正文会被搅烂。
// 因此这里的唯一原则是 —— 没把握就不给。返回 null，调用方老老实实退回选区范围。

// 后面跟着 '.' 也不算句末的缩写（全小写，不含最后那个点）
const SENTENCE_ABBREVIATIONS = [
    'e.g', 'i.e', 'et al', 'al', 'etc', 'cf', 'vs', 'viz', 'resp', 'approx', 'ca', 'ibid',
    'fig', 'figs', 'eq', 'eqs', 'sec', 'secs', 'ref', 'refs', 'tab', 'tabs', 'alg', 'thm',
    'ch', 'chap', 'app', 'no', 'nos', 'vol', 'vols', 'pp', 'p', 'ed', 'eds', 'est',
    'dr', 'prof', 'mr', 'mrs', 'ms', 'st', 'jr', 'sr', 'inc', 'ltd', 'dept', 'univ',
    'w.r.t', 'a.k.a', 'ph.d', 'm.s', 'b.s', 'u.s', 'u.k', 'min', 'max', 'std', 'avg', 'var'
];

// LaTeX 数学与宏参数区：这些区域里的 '.' 不是句号（$x_i \cdot y$、\cite{smith2020} 等）。
// 任何一处没闭合就干脆不保护它 —— 宁可少保护，也不能把后面整篇正文都吞掉。
function buildProtectedMask(text) {
    const n = text.length;
    const mask = new Array(n);
    for (let i = 0; i < n; i++) mask[i] = false;
    const fill = (a, b) => {
        const from = Math.max(0, a), to = Math.min(n, b);
        for (let i = from; i < to; i++) mask[i] = true;
    };

    let i = 0;
    while (i < n) {
        const ch = text[i];

        if (ch === '\\') {
            // 行间公式 \[ ... \]
            if (text[i + 1] === '[') {
                const close = text.indexOf('\\]', i + 2);
                if (close !== -1) { fill(i, close + 2); i = close + 2; continue; }
                i += 2; continue;
            }
            // \命令[可选参数]{必选参数}：大括号配平，最多往前找 500 字符
            const m = /^\\[a-zA-Z@]+\*?/.exec(text.slice(i, i + 40));
            if (!m) { i += 2; continue; }
            let j = i + m[0].length;
            while (j < n && (text[j] === ' ' || text[j] === '\t')) j++;
            if (text[j] === '[') {
                const rb = text.indexOf(']', j);
                if (rb !== -1 && rb - j < 200) {
                    j = rb + 1;
                    while (j < n && (text[j] === ' ' || text[j] === '\t')) j++;
                }
            }
            if (text[j] === '{') {
                let depth = 0, k = j, closed = false;
                for (; k < n && k - j < 500; k++) {
                    if (text[k] === '\\') { k++; continue; }
                    if (text[k] === '{') depth++;
                    else if (text[k] === '}') { depth--; if (depth === 0) { k++; closed = true; break; } }
                }
                if (closed) { fill(i, k); i = k; continue; }
            }
            i += m[0].length;
            continue;
        }

        if (ch === '$') {
            const marker = (text[i + 1] === '$') ? '$$' : '$';
            const close = text.indexOf(marker, i + marker.length);
            if (close !== -1 && close - i < 1000) { fill(i, close + marker.length); i = close + marker.length; continue; }
            i += marker.length;
            continue;
        }

        i++;
    }
    return mask;
}

// dotIndex 指向一个 '.'：往前抓一个词，判断它是不是「缩写 / 人名首字母」
function isAbbreviationDot(text, dotIndex) {
    let i = dotIndex - 1;
    while (i >= 0 && /[A-Za-z0-9.'’]/.test(text[i])) i--;
    const token = text.slice(i + 1, dotIndex);
    if (!token) return false;
    if (/^[A-Za-z]$/.test(token)) return true; // 人名首字母 "J."
    const low = token.toLowerCase().replace(/\.+$/, '');
    return SENTENCE_ABBREVIATIONS.indexOf(low) !== -1;
}

// 返回所有句末位置（下标 = 句子结束后的第一个字符）
function findSentenceBoundaries(text) {
    const n = text.length;
    const mask = buildProtectedMask(text);
    const CJK_END = '。！？';          // 。！？
    const ASCII_END = '.!?';
    const CLOSERS = '"\')]}»”’」』）】》';
    const ends = [];

    for (let i = 0; i < n; i++) {
        if (mask[i]) continue;
        const ch = text[i];
        if (CJK_END.indexOf(ch) === -1 && ASCII_END.indexOf(ch) === -1) continue;

        // 连续终止符算一组："?!"、"..."、"。。"
        let j = i;
        while (j + 1 < n && !mask[j + 1]
               && (CJK_END.indexOf(text[j + 1]) !== -1 || ASCII_END.indexOf(text[j + 1]) !== -1)) j++;

        // 单个 '.' 才需要防缩写（"Fig." / "et al." / "i.e."）
        if (j === i && text[i] === '.' && isAbbreviationDot(text, i)) continue;

        // 吸收紧跟其后的引号 / 右括号
        let k = j + 1;
        while (k < n && CLOSERS.indexOf(text[k]) !== -1) k++;

        if (ASCII_END.indexOf(text[j]) !== -1) {
            // 英文句末必须后接空白或文本结尾，否则多半是小数（0.95）、域名、版本号
            if (k < n && !/\s/.test(text[k])) { i = j; continue; }
            // 后面第一个非空白字符是小写字母 → 多半不是新句子的开头
            let p = k;
            while (p < n && /\s/.test(text[p])) p++;
            if (p < n && /[a-z]/.test(text[p])) { i = j; continue; }
        }

        ends.push(k);
        i = k - 1;
    }
    return ends;
}

// 选区所在的整句范围。拿不准一律返回 null。
// 选区横跨两句时，返回把两句都包住的范围（用户问的就是这一片）。
function findSentenceRange(text, selStart, selEnd) {
    try {
        if (typeof text !== 'string' || text.length === 0) return null;
        let s = Math.floor(Number(selStart));
        let e = Math.floor(Number(selEnd));
        if (!isFinite(s) || !isFinite(e)) return null;
        s = Math.max(0, Math.min(text.length, s));
        e = Math.max(0, Math.min(text.length, e));
        if (e <= s) return null;

        const ends = findSentenceBoundaries(text);
        let start = 0;
        let end = text.length;
        for (let i = 0; i < ends.length; i++) {
            if (ends[i] <= s) start = ends[i];
            else if (ends[i] >= e) { end = ends[i]; break; }
        }

        while (start < end && /\s/.test(text[start])) start++;
        while (end > start && /\s/.test(text[end - 1])) end--;

        if (end <= start) return null;
        if (start > s || end < e) return null;            // 必须完整包住选区，否则说明算错了
        const sentence = text.slice(start, end);
        if (!sentence.trim()) return null;
        if (sentence.length > 1200) return null;          // 超长块 = 大概率没有真正的句号，退回选区更安全
        return { start: start, end: end, text: sentence };
    } catch (err) {
        return null;
    }
}

// 语法模式要送进 prompt / 交叉核对的上下文：
//   sentence —— 拿去分析的那一句；null = 没算出可靠句子范围，退回词级模式
//   head/tail —— 这一句里、选区前后的两截文本。用来把「词级替换」塞回原位做交叉核对；
//                定位不了时为 null，表示放弃核对（只会宽容，不会误伤）。
function getGrammarScopeContext(state) {
    try {
        const sr = getValidSentenceRange(state);
        if (!sr || !sr.text.trim()) return null;
        const sel = (state && state.selectionRange && typeof state.selectionRange === 'object') ? state.selectionRange : null;
        const s = Math.floor(Number(sel && sel.start));
        const e = Math.floor(Number(sel && sel.end));
        if (!isFinite(s) || !isFinite(e) || e <= s || s < sr.start || e > sr.end) {
            return { sentence: sr.text, head: null, tail: null };
        }
        return { sentence: sr.text, head: sr.text.slice(0, s - sr.start), tail: sr.text.slice(e - sr.start) };
    } catch (err) {
        return null;
    }
}

// 默认Prompt常量
const DEFAULT_GRAMMAR_PROMPT = "Check the grammar of the following text and correct it if necessary. Keep the academic tone.";
const DEFAULT_SIMPLIFY_PROMPT = "Rewrite the following sentence to be MORE DIRECT, CONCISE, and SIMPLE to read. Keep the original meaning. STRICTLY PRESERVE all LaTeX math and citations.";

// 语言检测
function detectLanguage(text) {
    const zhMatch = text.match(/[\u4e00-\u9fa5]/g);
    const enMatch = text.match(/[a-zA-Z]/g);
    return (zhMatch?.length || 0) >= (enMatch?.length || 0)
        ? { src: 'zh', tgt: 'en' }
        : { src: 'en', tgt: 'zh' };
}

// LaTeX清理辅助函数
function stripCommand(str, cmd) {
    let result = str;
    while (true) {
        const pattern = new RegExp(`\\\\${cmd}(?:\\*)?\\s*\\{`);
        const match = pattern.exec(result);
        if (!match) break;
        const startIndex = match.index;
        const openBraceIndex = startIndex + match[0].length - 1;
        let depth = 1;
        let endIndex = -1;
        for (let i = openBraceIndex + 1; i < result.length; i++) {
            if (result[i] === '{') depth++;
            else if (result[i] === '}') depth--;
            if (depth === 0) { endIndex = i; break; }
        }
        if (endIndex !== -1) {
            result = result.substring(0, startIndex) + result.substring(endIndex + 1);
        } else { break; }
    }
    return result;
}

function cleanLatex(formula) {
    let clean = formula;
    clean = clean.replace(/(^|[^\\])%.*$/gm, '$1');
    clean = clean.replace(/\\\[\s*(\d+(?:\.\d+)?(?:pt|em|ex|cm|mm|in|pc|px))\s*\]/g, '\\\\[$1]');
    return clean;
}

// 渲染格式化文本（支持Markdown和LaTeX）
function renderFormattedText(text) {
    if (!text || !window.marked || !window.katex) return text || '';
    
    let content = String(text).replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, ' ');
    const placeholders = [];
    
    const pushPlaceholder = (regex, type, getFormula) => {
        content = content.replace(regex, (...args) => {
            const match = args[0];
            const id = `%%LATEX_${placeholders.length}%%`;
            let formula = getFormula(...args);
            formula = cleanLatex(formula);
            formula = stripCommand(formula, 'label');
            formula = stripCommand(formula, 'tag');
            try {
                const rendered = window.katex.renderToString(formula, {
                    displayMode: type === 'display',
                    throwOnError: false,
                    trust: true,
                    strict: false,
                    fleqn: false
                });
                placeholders.push({ id, html: rendered });
            } catch (e) {
                placeholders.push({ id, html: match });
            }
            return id;
        });
    };
    
    pushPlaceholder(/\\begin\{([\w\*]+)\}([\s\S]*?)\\end\{\1\}/g, 'display', (match, env, body) => {
        // 将带编号的环境转换为不带编号的版本
        const envMap = {
            'equation': 'equation*',
            'align': 'align*',
            'gather': 'gather*',
            'multline': 'multline*',
            'eqnarray': 'eqnarray*'
        };
        const noNumberEnv = envMap[env] || env;
        return `\\begin{${noNumberEnv}}${body}\\end{${noNumberEnv}}`;
    });
    pushPlaceholder(/\\\[([\s\S]*?)\\\]/g, 'display', (match, p1) => p1);
    pushPlaceholder(/\$\$([\s\S]*?)\$\$/g, 'display', (match, p1) => p1);
    pushPlaceholder(/\\\(([\s\S]*?)\\\)/g, 'inline', (match, p1) => p1);
    pushPlaceholder(/\$([^\$]+?)\$/g, 'inline', (match, p1) => p1);
    
    // 【波浪号必须先藏起来】marked 默认开着 GFM 的单波浪号删除线，而 LaTeX 里
    // `Section~\ref{sec:II}` / `不确定性~\cite{10143419}` 这种不换行空格几乎出现在每一处引用上。
    // 上面的 pushPlaceholder 只把 $…$ / \[…\] / \begin{…} 里的数学换成了占位符，
    // `~\ref` `~\cite` 这类**正文里的**波浪号一个都没动，于是
    // `Section~\ref{sec:II} presents … Section~` 会整段被画上 <del>，波浪号本身被吞掉。
    // 删除线在中文语境里恰好读作「把这段删掉」，正好是原文意思的反面。
    // 做法和 chatRenderProse 完全一样（连常量都共用一个）：解析前把 `~` 换成一个私用区码位、
    // 解析完再换回来，而不是去改全局 marked 配置 —— 聊天气泡和译文预览用的是同一个 marked。
    // 顺序也有讲究：还原必须排在 KaTeX 占位符回填**之前**，
    // 这样 katex.renderToString 吐出来的 HTML 不会被这两次 split/join 扫到。
    // 两个被实测否掉的更"简单"的写法见 CHAT_MD_TILDE 上方的注释（HTML 实体、控制字符），别再试。
    const mdSource = content.split(CHAT_MD_TILDE).join('').split('~').join(CHAT_MD_TILDE);
    let html = window.marked.parse(mdSource)
        .split(CHAT_MD_TILDE).join('~')
        .split(encodeURI(CHAT_MD_TILDE)).join('~');
    placeholders.forEach(p => { html = html.replace(p.id, p.html); });
    return html;
}


// ==================== API.JS ====================
// ========================================
// api.js - API服务（Gemini、OpenAI、Claude和本地LLM）
// ========================================

// Gemini API端点
const GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta/models";

// OpenAI API端点
const OPENAI_API_BASE = "https://api.openai.com/v1/chat/completions";

// Claude API端点
const CLAUDE_API_BASE = "https://api.anthropic.com/v1/messages";

// ============= 本地LLM调用（OpenAI兼容）=============
// ============= 模型响应的唯一读取口（A2）=============
// 「模型到底说了什么」只在这里判定一次，全文件不许有第二处。
//
// 【硬规则 1】`message.content` 是答案通道，**永远、且只有它**。content 为空时
// 绝不回落到 reasoning_content —— 那是**关于**答案的自言自语，不是答案。把它当答案
// 写进用户文档，正是 xportParseBlocks 那个洞（见 xportThinkCut 上方注释）干的事。
//
// 【硬规则 2】判「模型是否在推理」只看 `usage.completion_tokens_details.reasoning_tokens`
// 和 reasoning_content 的**内容**，**绝不看 key 是否存在**。实测（n=54 与 n=20+，三个
// 模型）：无论开没开思考，message 的键永远是 [content, reasoning_content, role, tool_calls]，
// 没用到时值是 ""。曾经有一份报告据「key 存在」判定 qwen3.8 在 enable_thinking:false 下
// 仍然推理，那是 schema 假象，已被两轮独立测量推翻。
//
// 【硬规则 3】finish_reason 对**每一次**调用都读出来。它是 TRUNCATED 与 EMPTY 之间
// 唯一的分辨依据（见 classifyLocalFailure）。
function readLocalChoice(data) {
    const ch = (data && data.choices && data.choices[0]) || {};
    const msg = ch.message || {};
    const content = typeof msg.content === 'string' ? msg.content : '';
    const reasoning = (typeof msg.reasoning_content === 'string' && msg.reasoning_content)
        || (typeof msg.reasoning === 'string' && msg.reasoning) || '';
    const finish = ch.finish_reason || '';
    const usage = (data && data.usage) || {};
    const det = usage.completion_tokens_details || {};
    const rtok = Number(det.reasoning_tokens) || 0;
    return {
        text: content,                  // 答案通道。永远。且只有它。
        reasoning: reasoning,           // 只用于诊断/横幅，绝不当答案
        finish: finish,
        truncated: finish === 'length',
        thinking: reasoning.trim() !== '' || rtok > 0,
        reasoningTokens: rtok
    };
}

// opts（第 7 个参数，**可选、纯追加**）：只有对话窗会传。翻译链路一个调用点都不传，
// 所以三个字段全部缺省时这个函数逐字回到原来的行为（temperature 0.3 / max_tokens 16384 /
// 推理档位读 AppState.reasoningByModel）。
//   · temperature / maxTokens：脏值一律无视，回落原默认值，绝不把 NaN 写进请求体。
//   · reasoningEffort：**必须已经是线上词表的值**（none/low/medium/xhigh）。这里再白名单一次，
//     因为发 'off' 是 400、'high' 会静默回落、'minimal' 服务端 WARN 着映射成 'low' ——
//     一个越过映射层的调用点就足以让「界面显示的」和「实际发生的」再次分家。
const XPORT_WIRE_EFFORTS = ['none', 'low', 'medium', 'xhigh'];
async function callLocalLLM(baseUrl, model, messages, jsonMode = false, signal = null, meta = null, opts = null) {
    const o = (opts && typeof opts === 'object') ? opts : null;
    const oTemp = (o && typeof o.temperature === 'number' && isFinite(o.temperature)) ? o.temperature : null;
    const oMax = (o && typeof o.maxTokens === 'number' && isFinite(o.maxTokens) && o.maxTokens > 0)
        ? Math.round(o.maxTokens) : null;
    const body = {
        model: model || "local-model",
        messages: messages,
        temperature: oTemp === null ? 0.3 : oTemp,
        max_tokens: oMax === null ? 16384 : oMax
    };

    // LM Studio的JSON模式
    if (jsonMode) {
        body.response_format = { type: "json_object" };
    }

    // B2：推理档位。**必须显式发，不能靠省略**——实测省略 reasoning_effort 等于关闭推理，
    // 哪怕 /api/v1/models 里 capabilities.reasoning.default 写着 "xhigh"。所以「关」也要
    // 老老实实发 "none"（发 "off" 是 400）。映射与禁发值见 XPORT_EFFORT_WIRE 上方注释。
    // 值从每模型持久化设置来，默认 'off'；xportWireEffort 自带兜底，任何异常都退回 'none'。
    // opts.reasoningEffort 只在对话窗那条路径上出现（对话有自己一套每模型档位，见 ChatState.reasoningByModel）。
    let effortSent = '';
    try {
        if (!xportEffortUnsupported.has(xportCapsOrigin(baseUrl))) {
            const override = (o && typeof o.reasoningEffort === 'string'
                && XPORT_WIRE_EFFORTS.indexOf(o.reasoningEffort) !== -1) ? o.reasoningEffort : '';
            effortSent = override || xportWireEffort(baseUrl, model);
            if (effortSent) body.reasoning_effort = effortSent;
        }
    } catch (e) { effortSent = ''; }

    // 构建endpoint - 直接使用/v1/chat/completions
    const endpoint = `${baseUrl.replace(/\/$/, "")}/v1/chat/completions`;

    try {
        let response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal
        });

        // 兼容闸：只有当对端**明确点名** reasoning_effort 地 400 时，才摘掉这个字段重试一次，
        // 并把这个 origin 记进 xportEffortUnsupported，之后不再发。三个实测模型都不会走到这里；
        // 它存在只是为了保证「多一个可选参数」永远不可能把整条翻译链路弄挂。
        if (response && !response.ok && response.status === 400 && body.reasoning_effort) {
            const firstErr = await response.text();
            if (/reasoning_effort/i.test(firstErr)) {
                xportEffortUnsupported.add(xportCapsOrigin(baseUrl));
                delete body.reasoning_effort;
                response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                    signal
                });
            } else {
                throw new Error(`API Error: ${response.status} - ${firstErr}`);
            }
        }

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`API Error: ${response.status} - ${errText}`);
        }

        const data = await response.json();
        // 出参：**整份** readLocalChoice 结果，不只是 truncated。A4 的错误分类要靠
        // truncated / thinking / text 三个字段一起判，任何一个缺了都会把
        // 「推理吃光了预算」误报成「收到空响应」。不传 meta 的调用方逐字不受影响。
        const choice = readLocalChoice(data);
        if (meta) {
            meta.truncated = choice.truncated;
            meta.text = choice.text;
            meta.reasoning = choice.reasoning;
            meta.finish = choice.finish;
            meta.thinking = choice.thinking;
            meta.reasoningTokens = choice.reasoningTokens;
            // B2：这次到底发出去的是哪个档位（''=没发）。留给排查与验收用，
            // 「UI 说的」和「线上发的」对不上时，这里是唯一能一眼看穿的地方。
            meta.reasoningEffortSent = body.reasoning_effort || '';
            // C6：**实测**的输入 token。对话窗的用量环只认这个数，绝不拿自己的估算冒充实测。
            // 刻意就地取值、不新开一个 helper：callLocalLLM 被 phaseB 的抽取器加载，
            // 加一个它调用的新函数就得同时改那份加载清单（漏过两次，phaseB 当场炸）。
            meta.promptTokens = Number(data && data.usage && data.usage.prompt_tokens) || 0;
            // C8：同一份 usage 对象里的输出侧两个数，同样就地取值、同样实测（2026-08-20，
            // jump LM Studio，qwen3.6-35b-a3b 关思考 / qwen3.8-27b 开思考各抓过一次真实响应体，
            // 两次 usage 都带 completion_tokens 和 total_tokens）。上下文圆环只认这两个字段，
            // 拿不到就退回估算，不拿字符数估一个冒充实测。
            meta.completionTokens = Number(data && data.usage && data.usage.completion_tokens) || 0;
            meta.totalTokens = Number(data && data.usage && data.usage.total_tokens) || 0;
        }
        // A3：被动探测。每一次真实响应都顺手判一次「这个模型在推理吗」，
        // 不额外花任何一次调用。判到了就把横幅弹出来（见 xportNoteThinking）。
        try { xportNoteThinking(model, choice.thinking, effortSent ? (effortSent !== 'none') : undefined); } catch (e) {}
        return choice.text;
    } catch (error) {
        if (error.name === 'AbortError') throw error;
        throw error;
    }
}

// 获取本地模型列表
async function fetchLocalModels(baseUrl) {
    // 直接使用/v1/models端点，不设置Content-Type（GET请求不需要）
    const endpoint = `${baseUrl.replace(/\/$/, "")}/v1/models`;

    try {
        const response = await fetch(endpoint);

        if (!response.ok) {
            throw new Error(`Failed to fetch models: ${response.status}`);
        }

        const data = await response.json();
        return data.data || [];
    } catch (error) {
        console.error("Fetch models error:", error);
        throw new Error(`无法连接到 ${baseUrl}。请确保 LM Studio 服务器正在运行。`);
    }
}

// ============= 在线模型列表拉取（三家各自的 /models 端点）=============
// 三家都实测可以从浏览器直连（含 file:// 打开，Origin: null），不需要任何代理。
// 三条铁律，改代码时不要违反：
//   1) Gemini 这个 GET 不许加任何自定义头 —— 该域 Access-Control-Allow-Headers 只放行
//      x-goog-api-key，多加 Content-Type / Api-Revision 会 preflight 403 且不带 ACAO。
//   2) 三家都不许设 credentials:'include' —— 服务端回 ACAO:*，规范禁止该组合，浏览器会硬失败，
//      报错长得和「服务挂了」一模一样。
//   3) Claude 必须带 anthropic-dangerous-direct-browser-access: true —— 这个头就是 CORS 开关本身：
//      带它响应有 ACAO:*，不带它响应完全没有 ACAO，浏览器只抛无状态码的 TypeError。
//      它没写进 Anthropic REST 官方参考（只通过官方 TS SDK 的 dangerouslyAllowBrowser 间接暴露），
//      自 2024-08 稳定至今。**别当脏代码删掉。**

const OPENAI_MODELS_API = "https://api.openai.com/v1/models";
const CLAUDE_MODELS_API = "https://api.anthropic.com/v1/models";
const MODEL_FETCH_TIMEOUT = 15000;

// 带 15 秒超时的 fetch（三家共用）
// ⚠️ 刻意**不**在响应头到达时 clearTimeout：fetch 的 promise 在拿到响应头那一刻就 settle，
// 若那时清掉计时器，后面 `await response.json()` 读 body 就完全裸奔 —— 服务端回了 200 头
// 却挂住 body（代理超时 / Worker 半死 / 网络挂起）时 json() 永不 resolve，
// Promise.allSettled 永不 settle，三家状态会永远停在 loading、刷新按钮永久 disabled。
// 保留计时器让 abort 覆盖「发请求 + 读 body」整个窗口：超时会中断 body 流，json() 抛
// AbortError → classifyModelFetchError 归类成 TIMEOUT。请求已完成后再 abort() 是无害的空操作。
function fetchWithTimeout(url, options = {}, ms = MODEL_FETCH_TIMEOUT) {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return fetch(url, { ...options, signal: controller.signal });
}

// 带错误码的 Error（错误码 → MODEL_ERROR_TEXT 里的中文人话）
function modelFetchError(errCode, errMsg) {
    const e = new Error(errMsg);
    e.code = errCode;
    return e;
}

// 注：sanitizeModelId(id) 已在文件靠前处定义（SAFE_MODEL_ID 之后），此处复用，不重复定义。

// OpenAI 的 /v1/models 不返回 display_name，只能从 id 合成人类可读名字。
// 规则刻意保守：只做首段大写 + 后续连字符转空格，其余原样保留。
function prettifyModelId(id) {
    const raw = String(id);
    const parts = raw.split('-');
    let head = parts.shift() || raw;
    if (/^gpt$/i.test(head)) head = 'GPT';
    else if (/^chatgpt$/i.test(head)) head = 'ChatGPT';
    else if (/^o\d+$/i.test(head)) head = head.toLowerCase();
    else head = head.charAt(0).toUpperCase() + head.slice(1);
    if (parts.length === 0) return head;
    const rest = parts.map(p => /^[a-z]+$/.test(p) ? p.charAt(0).toUpperCase() + p.slice(1) : p);
    return head + '-' + rest.join(' ');
}

// HTTP 响应 → 错误码 + 中文短语（json 已解析成对象或 null）
function classifyModelHttpError(status, json) {
    // 截断：厂商/代理可能回一整页 HTML 错误页，原文会被塞进芯片的 title 属性
    const apiMsg = String((json && ((json.error && (json.error.message || json.error.type)) || json.message)) || '').slice(0, 200);
    if (status === 401 || status === 403) {
        return { errCode: 'AUTH', errMsg: apiMsg || 'API Key 无效或无权限' };
    }
    if (status === 429) {
        return { errCode: 'RATE', errMsg: apiMsg || '触发限流或额度不足，请稍后重试' };
    }
    if (status === 400 && /API_KEY_INVALID|API key not valid/i.test(apiMsg)) {
        return { errCode: 'AUTH', errMsg: apiMsg };
    }
    // 极简 Cloudflare Worker 常把 GET 改写成 POST /v1/messages，Anthropic 就会回这个 400。
    // 不识别它的话，用户会把「代理形状不对」误诊成「我的 Key 有问题」。
    if (status === 400 && /messages/i.test(apiMsg) && /required/i.test(apiMsg)) {
        return { errCode: 'PROXY_SHAPE', errMsg: '你的 Worker 只转发 POST /v1/messages，无法用于获取模型列表' };
    }
    return { errCode: 'HTTP', errMsg: apiMsg ? `HTTP ${status} - ${apiMsg}` : `HTTP ${status}` };
}

// 各种异常 → 统一错误码 + 中文人话
function classifyModelFetchError(err) {
    if (err && err.code) return { errCode: err.code, errMsg: err.message || '' };
    if (err && err.name === 'AbortError') return { errCode: 'TIMEOUT', errMsg: '请求超时（15 秒）' };
    const raw = String((err && err.message) || err || '');
    if (err instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(raw)) {
        return { errCode: 'CORS', errMsg: '浏览器被拦截（CORS 或断网），未拿到任何响应' };
    }
    return { errCode: 'HTTP', errMsg: raw || '未知错误' };
}

// —— Google Gemini ——
// GET ${GEMINI_API_BASE}?key=...&pageSize=1000
// 必须显式传 pageSize：默认只有 50 条，而当前目录超过 50 条，不传会**静默截断**、漏掉最新模型。
// 纯 GET + query 参数 = simple request，零 preflight。
async function fetchGeminiModelList(apiKey) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 Gemini API Key');

    const raw = [];
    let pageToken = '';
    for (let page = 0; page < 5; page++) {   // 上限 5 页，防跑飞
        const url = `${GEMINI_API_BASE}?key=${encodeURIComponent(apiKey)}&pageSize=1000`
                  + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
        const response = await fetchWithTimeout(url);   // 不加任何自定义头
        if (!response.ok) {
            const errJson = await response.json().catch(() => null);
            const info = classifyModelHttpError(response.status, errJson);
            throw modelFetchError(info.errCode, info.errMsg);
        }
        const data = await response.json();
        raw.push(...(data.models || []));
        pageToken = data.nextPageToken || '';
        if (!pageToken) break;
    }

    return raw
        // 线上字段名是 supportedGenerationMethods；supportedActions 只存在于 SDK 对象里，
        // 读错会导致全部被过滤掉、列表为空，所以两个都兜一手
        .filter(m => (m.supportedGenerationMethods || m.supportedActions || []).includes('generateContent'))
        .map(m => {
            // 不剥 "models/" 前缀会拼出 /v1beta/models/models/xxx:generateContent → 404
            const id = sanitizeModelId(String(m.name || '').replace(/^models\//, ''));
            if (!id) return null;
            return { id, name: m.displayName || id, provider: 'gemini', group: 'chat', created: '' };
        })
        // 图像生成 / TTS / live 也声明 generateContent，只靠上面那级会让用户选到图像模型来翻译
        .filter(m => m && isGeminiTextChatModelId(m.id))
        .sort((a, b) => a.id.localeCompare(b.id));
}

// —— OpenAI ——
// GET https://api.openai.com/v1/models，唯一必需头 Authorization: Bearer。
// 无分页（listModels 在 OpenAPI 规格里零参数，响应体只有 {object,data}），一次拿全。
async function fetchOpenaiModelList(apiKey, hideSnapshots) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 OpenAI API Key');

    const response = await fetchWithTimeout(OPENAI_MODELS_API, {
        method: "GET",
        headers: { "Authorization": `Bearer ${apiKey}` }
        // 不要加 credentials:'include'，服务端回 ACAO:* 会硬失败
    });
    if (!response.ok) {
        const errJson = await response.json().catch(() => null);
        const info = classifyModelHttpError(response.status, errJson);
        throw modelFetchError(info.errCode, info.errMsg);
    }

    const json = await response.json();
    const all = Array.isArray(json.data) ? json.data : [];

    return all
        .filter(m => m && typeof m.id === 'string')
        .filter(m => !OPENAI_DENY.test(m.id))
        .filter(m => !(hideSnapshots && OPENAI_DATED_SNAPSHOT.test(m.id)))
        .map(m => {
            const id = sanitizeModelId(m.id);
            if (!id) return null;
            return {
                id,
                name: prettifyModelId(id),
                provider: 'openai',
                created: m.created || 0,
                // 过了硬拒但没过 ALLOW 的新家族（如 daybreak-*）进隔离区：渲染但默认不勾选。
                // 这是抗陈旧的逃生口 —— 纯白名单对每个新发布家族都是零日盲区。
                group: OPENAI_ALLOW.test(id) ? 'chat' : 'other'
            };
        })
        .filter(Boolean)
        .sort((a, b) => (b.created || 0) - (a.created || 0));
}

// —— Anthropic Claude ——
// 主路直连 GET https://api.anthropic.com/v1/models?limit=1000
// limit 默认 20 而目录就在 15-25 条这个量级，必须传 1000 并跟 has_more/last_id。
// 直连失败且用户配了 proxyUrl 时才降级走代理 —— 极简 Worker 通常硬编码 POST /v1/messages，
// 大概率失败，所以只作二选路，且对非 JSON 响应容错。
async function fetchClaudeModelList(apiKey, proxyUrl) {
    if (!apiKey) throw modelFetchError('NO_KEY', '未填写 Claude API Key');

    const collected = [];
    let afterId = '';
    try {
        for (let page = 0; page < 10; page++) {
            const url = `${CLAUDE_MODELS_API}?limit=1000` + (afterId ? `&after_id=${encodeURIComponent(afterId)}` : '');
            const response = await fetchWithTimeout(url, {
                method: "GET",
                headers: {
                    "x-api-key": apiKey,
                    "anthropic-version": "2023-06-01",
                    // ↓ 这个头就是 CORS 开关本身，删掉它浏览器会直接抛无状态码的 Failed to fetch
                    "anthropic-dangerous-direct-browser-access": "true"
                }
            });
            if (!response.ok) {
                const errJson = await response.json().catch(() => null);
                const info = classifyModelHttpError(response.status, errJson);
                throw modelFetchError(info.errCode, info.errMsg);
            }
            const json = await response.json();
            collected.push(...(json.data || []));
            if (!json.has_more || !json.last_id) break;
            afterId = json.last_id;
        }
    } catch (directErr) {
        const direct = classifyModelFetchError(directErr);
        // Key 本身不对，或者根本没配代理 —— 没必要再试代理
        if (direct.errCode === 'AUTH' || direct.errCode === 'NO_KEY' || !proxyUrl) throw directErr;

        const base = String(proxyUrl).replace(/\/+$/, "").replace(/\/v1\/messages$/, "");
        let proxyJson = null;
        try {
            const res = await fetchWithTimeout(`${base}/v1/models?limit=1000`, {
                method: "GET",
                headers: { "x-api-key": apiKey, "anthropic-version": "2023-06-01" }
            });
            proxyJson = await res.json().catch(() => null);   // Worker 可能返回 HTML 错误页
            if (!res.ok) {
                const info = classifyModelHttpError(res.status, proxyJson);
                throw modelFetchError(info.errCode === 'HTTP' ? 'PROXY_SHAPE' : info.errCode, info.errMsg);
            }
        } catch (proxyErr) {
            if (proxyErr && proxyErr.code) throw proxyErr;
            throw modelFetchError('PROXY_SHAPE', '代理不支持模型列表请求（它可能只转发 POST /v1/messages），建议直连');
        }
        if (!proxyJson || !Array.isArray(proxyJson.data)) {
            throw modelFetchError('PROXY_SHAPE', '代理返回的不是模型列表格式，建议直连');
        }
        collected.push(...proxyJson.data);
    }

    return collected
        // Anthropic 公开 API 没有 embedding/TTS/图像/审核模型，只做形状校验。
        // 绝不按 capabilities 过滤 —— 它在 schema 里可为 null，老模型会被误杀。
        .filter(m => m && m.type === 'model' && typeof m.id === 'string')
        .map(m => {
            const id = sanitizeModelId(m.id);
            if (!id) return null;
            return { id, name: m.display_name || id, provider: 'claude', group: 'chat', created: m.created_at || '' };
        })
        .filter(Boolean);
}

// ============= A5：平衡花括号候选扫描 =============
// 取代原来的贪婪 `/\{[\s\S]*\}/`（从**第一个** { 一路吃到**最后一个** }）。两个实测理由：
//   1. 推理开着时，content 里常常先有一份**完整的 pretty-printed JSON 草稿**，再跟一份
//      答案。贪婪匹配把草稿和答案跨着一起吃掉，于是这段输出**永远**解析不出来 ——
//      明明答案本身是合法 JSON。
//   2. LaTeX 满篇花括号（`\ref{x}` / `\textcolor{red}{y}`），贪婪匹配天然容易切错边界。
// 扫描器是**字符串感知 + 转义感知**的：JSON 字符串里的 { } " 一律不计入配平，
// 否则 `{"a":"}"}` 这种输入会让朴素计数器选错跨度。
function xportJsonCandidates(s) {
    const src = String(s == null ? '' : s);
    const n = src.length;
    const out = [];
    let i = 0, guard = 0;
    while (i < n && ++guard < 200000) {
        if (src[i] !== '{') { i++; continue; }
        let depth = 0, inStr = false, esc = false, closed = -1;
        for (let j = i; j < n; j++) {
            const c = src[j];
            if (inStr) {
                if (esc) { esc = false; continue; }
                if (c === '\\') { esc = true; continue; }
                if (c === '"') inStr = false;
                continue;
            }
            if (c === '"') { inStr = true; continue; }
            if (c === '{') depth++;
            else if (c === '}') { depth--; if (depth === 0) { closed = j; break; } }
        }
        if (closed === -1) { i++; continue; }     // 这个 { 配不平：从下一个字符继续找
        out.push(src.slice(i, closed + 1));
        i = closed + 1;
        if (out.length >= 32) break;              // 32 份草稿已经足够诊断，再多是模型跑飞了
    }
    return out;
}

// 候选择优用的「期望键」。命中其一 = 这份候选是某条链路真正的应答形状，
// 而不是模型在推理里写的草稿或半成品。规则：**取最后一个**命中的 ——
// 实测模型的真答案永远跟在它自己的草稿后面。
const XPORT_JSON_KEYS = ['translations', 'alternatives', 'sentence_alternatives',
    'corrected_sentence', 'correct', 'issue', 'text'];

// ============= A6：非法转义抢救 =============
// 把不是合法 JSON 转义的反斜杠补成两个。**补不动就返回 null**（见下面的歧义判据）。
// 【为什么需要它】实测本机默认模型 qwen/qwen3.6-35b-a3b：语法弹窗 86 次调用里
// 14 次（16.3%）用户看得见的失败，其中 **12 次**是把 LaTeX 反斜杠原样写进 JSON 字符串
// （\mathcal \eqref \cite \% \pm，JSON.parse 硬失败、措辞全是 "Bad escaped character"），
// 另外 2 次是 status:'empty' —— 模型答了，是客户端把候选全过滤了，跟转义没关系。
// 驱动因素是**被发出去的整句里的 LaTeX**，不是用户选中的那几个字：按 LaTeX token 数分层
// 0 个 0/17=0%、1-3 个 9.4%、4-8 个 21.4%、>=9 个 34.8%。同一句话时好时坏（随机）。
// 推理不是原因：86/86 次请求 reasoning_effort 都发的 "none"，reasoning_tokens 全 0。
// 光改 prompt 也没用（实测 20% → 15%，还新添了 2 例空结果）；抢救是 20% → 0%。
//
// 【\b \f \n \r \t 有歧义，绝不能一律补】它们既是合法 JSON 转义，又是 LaTeX 命令的开头
// （\begin \frac \nu \rho \times \theta \text \rightarrow …）。两个方向猜错都是**静默改坏正文**：
// 当成 LaTeX 补 → 真换行变成正文里两个字符 `\n`（LaTeX 里是未定义控制序列）；
// 不补 → `\nu` 变成换行加一个 u。唯一经得起实测的判据是「LaTeX 命令名必然是字母」：
// 后面紧跟字母才敢当 LaTeX；后面不是字母（`\n\` `\n=` `\n}`）说明这份响应里真有控制字符，
// 两种写法混在同一份里，谁也分不清 —— 这时候**整份放弃**，让它照常报错。
