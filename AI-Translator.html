// 宁可让用户看见「未能获得语法建议」按一下重试，也不能把 \cite{} 悄悄改坏了写进论文。
// 实测（1830 份历史响应）：没有这条判据时救回 130 份、**改坏 1 份**
// （thinking-json-evidence/main-exp.jsonl #42：同一份 translations 里，第一对是裸 LaTeX、
// 第二对是 \\begin{equation} 配真换行，整段被改成字面量 \n，LaTeX 编译不过，
// 而 xportEquationAudit 一个字都查不出来 —— 环境名还在，只是行没了）。
// 加上之后：救回 129 份、改坏 0 份，唯一少救的就是那一份。
function xportRepairEscapes(s0) {
    const s = String(s0);
    let out = '';
    for (let i = 0; i < s.length; i++) {
        if (s[i] !== '\\') { out += s[i]; continue; }
        const c = s[i + 1];
        if (c === '\\') { out += '\\\\'; i++; continue; }
        if (c === '"' || c === '/') { out += '\\' + c; i++; continue; }
        if (c === 'u' && /^[0-9a-fA-F]{4}$/.test(s.slice(i + 2, i + 6))) { out += s.slice(i, i + 6); i += 5; continue; }
        if ((c === 'b' || c === 'f' || c === 'n' || c === 'r' || c === 't')
            && !/[A-Za-z]/.test(s[i + 2] || '')) return null;      // 歧义：整份放弃，不猜
        out += '\\\\';
    }
    return out;
}
// 从右往左找最后一个花括号配平的 {...}。**故意不认字符串**：
// 坏掉的响应恰恰是引号奇偶被打乱，而那正是 xportJsonCandidates（字符串感知）失效的原因 ——
// 两者是互补的，不是重复的。
function xportLastBalancedObject(s) {
    for (let end = s.length - 1; end >= 0; end--) {
        if (s[end] !== '}') continue;
        let depth = 0;
        for (let i = end; i >= 0; i--) {
            if (s[i] === '}') depth++;
            else if (s[i] === '{') { depth--; if (depth === 0) return s.slice(i, end + 1); }
        }
    }
    return null;
}

// 解析JSON响应（处理可能的markdown包裹）
// opts.arrayKey：**顶层裸数组**（全字符串）该记到哪个键下。缺省 'translations'，
// 于是所有既有调用方逐字不变；选词/语法弹窗传 'alternatives'，因为它们读的是那个键。
function parseJsonResponse(text, opts) {
    const arrayKey = (opts && typeof opts.arrayKey === 'string') ? opts.arrayKey : 'translations';
    // 检查空响应
    if (!text || text.trim() === '') {
        console.error('parseJsonResponse: Empty response received');
        throw new Error('无法解析 JSON 响应: 收到空响应');
    }

    let clean = text.trim();

    // 移除 markdown 代码块
    if (clean.startsWith('```json')) clean = clean.slice(7);
    else if (clean.startsWith('```')) clean = clean.slice(3);
    if (clean.endsWith('```')) clean = clean.slice(0, -3);
    clean = clean.trim();

    try {
        return JSON.parse(clean);
    } catch (e) {
        // 提取 JSON 对象：平衡花括号扫描（见 xportJsonCandidates 上方注释）。
        // 顺序：带期望键的最后一份 → 任意能解析的最后一份 → 数组兜底 → 失败。
        // 前两级是新增的；第三级与改动前逐字相同，所以旧行为只增不减。
        const cands = xportJsonCandidates(clean);
        let keyed = null, anyObj = null;
        for (let ci = 0; ci < cands.length; ci++) {
            let val;
            try { val = JSON.parse(cands[ci]); } catch (e2) { continue; }
            anyObj = val;
            if (val && typeof val === 'object') {
                for (let ki = 0; ki < XPORT_JSON_KEYS.length; ki++) {
                    if (Object.prototype.hasOwnProperty.call(val, XPORT_JSON_KEYS[ki])) { keyed = val; break; }
                }
            }
        }
        if (keyed !== null) return keyed;
        if (anyObj !== null) return anyObj;

        // A6 抢救：模型已经把答案写出来了，只是转义写错了。改动前这一整份直接丢掉。
        // 【位置是有讲究的，不能挪】必须在候选扫描**之后**、数组兜底**之前**，而且必须
        // 长在 parseJsonResponse 自己的 catch 里，**不能**做成"包一层、抛错时再救"的外壳：
        // 下面那条数组兜底在坏响应上**不抛错**，它会返回一份伪造的成功（见那里的注释），
        // 外壳永远看不到这些行。实测差别：外壳式实现让智能更新只从 18/20 修到 3/20，
        // 就地实现是 18/20 → 0/20。
        // 实测 1286 份历史响应：救回 45 份，0 份变坏。96% 的响应在第一次 JSON.parse 就过了，
        // 根本走不到这里。
        const tryObj = function (s) {
            if (typeof s !== 'string') return null;      // xportRepairEscapes 判定有歧义时返回 null
            try { const v = JSON.parse(s); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : null; }
            catch (e4) { return null; }
        };
        let salvaged = tryObj(xportRepairEscapes(clean));
        if (salvaged) return salvaged;
        const lastObj = xportLastBalancedObject(clean);
        if (lastObj) {
            salvaged = tryObj(lastObj);                     if (salvaged) return salvaged;
            salvaged = tryObj(xportRepairEscapes(lastObj)); if (salvaged) return salvaged;
        }

        // 尝试提取JSON数组 —— 只认两种**形状**。
        // 【为什么必须按形状收口】改动前任何能解析出来的数组都会被当成 translations。
        // 实测：智能更新的译文里有个区间 `\rightarrow[0,1]$`，这条贪婪正则匹配到的是**数学式**，
        // 于是 parseJsonResponse **不抛错**地返回 { translations: [0,1] }，被上层当成一次成功；
        // data.text 是 undefined → "" → `||` 静默把原文填回去 → 转圈结束、什么都没发生，
        // 而且因为没抛错，classifyLocalFailure 一次都没跑，console 里连一行都没有。
        // 数学密集的行上实测 3/20 = 15%。不删这条兜底（旧翻译链路的形状没人量过），只按形状放行。
        const arrayMatch = clean.match(/\[[\s\S]*\]/);
        if (arrayMatch) {
            try {
                const arr = JSON.parse(arrayMatch[0]);
                if (Array.isArray(arr) && arr.length > 0) {
                    const allPair = arr.every(x => x && typeof x === 'object'
                        && typeof x.src === 'string' && typeof x.tgt === 'string');
                    if (allPair) return { translations: arr };
                    if (arr.every(x => typeof x === 'string')) { const r = {}; r[arrayKey] = arr; return r; }
                }
            } catch (e3) {}
        }
        console.error('parseJsonResponse failed. Raw response:', text.substring(0, 500));
        // 【必须把原始 SyntaxError 带出去】classifyLocalFailure 判 BAD_ESCAPE 靠的是
        // 解析器的**措辞**（"Bad escaped character…"）。改动前这里把 e 丢了，只抛一句
        // 「无法解析 JSON 响应」，于是 BAD_ESCAPE 在生产链路上**永远不可能触发** ——
        // 而它恰恰是推理模式下最常见的那一种失败（48 次实测里与硬失败 6/6 相关），
        // 用户看到的却是没有补救办法的「模型输出不是合法 JSON」。
        const wrapped = new Error('无法解析 JSON 响应');
        wrapped.cause = e;
        throw wrapped;
    }
}

// ============= A4：错误分类 =============
// 【为什么必须分类】改动前整条 JSON 链路只有两条字符串，而
// `THINKING_ATE_BUDGET` 和 `EMPTY` **共用**其中一条（「无法解析 JSON 响应: 收到空响应」）
// —— 两者的补救办法却毫无共同之处。实测：max_tokens=128 且推理开着时，推理吃掉
// 100% 的补全预算、content 为空，用户看到的是「收到空响应」，于是去查网络和模型加载，
// 而真正要做的是去 LM Studio 把 Enable Thinking 关掉或把 max_tokens 调高。
//
// 顺序 = 先到先得。与 spec §3.6 的表相比只挪动了一处，并且是**有意**的：
// BAD_ESCAPE 提到了 TRUNCATED/EMPTY 之前。理由是这条判据来自 parseErr 的**文本签名**，
// 而它在 48 次实测里与「解析硬失败」6/6 完全相关，是全表信息量最大的一条；
// 何况「解析器报了转义错」本身就证明正文非空，与 EMPTY 互斥。
//
// 【补救办法必须先说本应用里那个**真的管用**的开关】实测（11 次请求、三个模型）：
// 请求里的 reasoning_effort 完全决定推理是否发生，LM Studio 每模型的界面默认值根本不参与
// —— qwen3.8-27b 元数据默认 "xhigh"，省略该参数得到 reasoning_tokens 0，发 'medium' 得到 220。
// 所以只要本应用还在发 'medium'，用户在 LM Studio 里怎么点都关不掉。真正能解决问题的是
// 「设置 → 模型 → 推理 → 关」。LM Studio 那条留作次选（本应用设成「关」之后仍在推理，
// 才轮到它）。TRUNCATED 里原来的「请缩小批次」也删掉了：批次由 xportLimits 自动算，
// 用户没有任何入口能改它，写出来只是让人白找一遍。
const XPORT_FAIL_TEXT = {
    THINKING_ATE_BUDGET: '模型把全部 token 预算用在了推理上，正文为空。请到「设置 → 模型」把该模型的「推理」设为「关」；若那里已是「关」仍然如此，说明是 LM Studio 端开的，请在 LM Studio 里关闭该模型的 Enable Thinking。',
    // 【这条文案原来说反了】改动前它断言「这是推理模式最典型的症状」，并让用户去关推理。
    // 实测把它证伪：语法弹窗的 86 次调用全程 reasoning_effort="none"、reasoning_tokens=0，
    // 照样有 16.3% 撞上这个错。「推理」两个字仍然留在文案里，但说的是**它不是原因**；
    // 开着推理会更糟这一点由 classifyLocalFailure 按 meta.reasoningEffortSent 动态补一句，
    // 不写死在这里。
    // 【为什么不再推荐换模型】那条建议一度写成「换用 qwen3.8-27b，失败率 2.3% vs 16.3%」。
    // 两个数都不属于渲染这句话的这一版：16.3% 是 HEAD 的失败率，本次抢救已经把它消掉；
    // 换模型的收益是 0。同一批 86 个输入跑完整链路（node .claude/tmp/_adv_uservisible.js）：
    //   qwen3.6-35b-a3b  HEAD 14/86 = 16.3%   本版 2/86 = 2.3%
    //   qwen3.8-27b      HEAD  2/86 =  2.3%   本版 2/86 = 2.3%
    // 而代价是真的：27b 把 86 句里的 68 句判成「语法正确」，qwen3.6 只判 27 句 ——
    // 在用户最需要答案的那一刻，把他推去一个少报 41 处真问题的模型。
    BAD_ESCAPE: '模型把 LaTeX 反斜杠写成了单反斜杠，JSON 转义非法。这与「推理」开关无关 —— 实测 86 次调用推理全程为关仍然发生。含 $…$ / \\cite / \\ref 的句子最容易触发。同一句话时好时坏，请点「重试」。（换模型帮不上忙：本版抢救之后 qwen3.8-27b 与 qwen3.6-35b-a3b 在同一批输入上都是 2.3%，而 27b 会把其中 68 句判成「语法正确」，比 qwen3.6 少报 41 处真问题。）',
    TRUNCATED: '模型输出被 token 上限截断（finish_reason=length），返回的是半截内容。多半是推理占掉了预算：请到「设置 → 模型」把该模型的「推理」设为「关」，或在 LM Studio 里给该模型加载更大的上下文。',
    EMPTY: '模型返回了空正文。',
    THINKING_LEAK: '模型的推理内容混进了正文。请到「设置 → 模型」把该模型的「推理」设为「关」；若那里已是「关」，请在 LM Studio 里关闭该模型的 Enable Thinking。',
    UNPARSEABLE: '模型输出不是合法 JSON。'
};
// 各浏览器对同一类非法转义的措辞不同：V8 是 "Bad escaped character in JSON at position N"
// （旧版是 "Unexpected token r in JSON..."），SpiderMonkey 是 "JSON.parse: bad escaped character"。
// 只收这三种**明确指向转义/控制字符**的措辞，绝不用泛化的 "Unexpected token" ——
// 那会把真正的 UNPARSEABLE 一起吞进来。
const XPORT_BAD_ESCAPE_RE = /bad escaped character|invalid \\escape|bad control character/i;
function classifyLocalFailure(res, parseErr) {
    const r = res || {};
    const text = typeof r.text === 'string' ? r.text : '';
    const thinking = !!r.thinking;
    const truncated = !!r.truncated;
    const em = parseErr ? String((parseErr && parseErr.message) || parseErr) : '';
    let code;
    if (truncated && !text.trim() && thinking) code = 'THINKING_ATE_BUDGET';
    else if (em && XPORT_BAD_ESCAPE_RE.test(em)) code = 'BAD_ESCAPE';
    else if (truncated) code = 'TRUNCATED';
    else if (!text.trim()) code = 'EMPTY';
    else if (thinking || /<\/?\s*think\s*>/i.test(text)) code = 'THINKING_LEAK';
    else code = 'UNPARSEABLE';
    let remedy = XPORT_FAIL_TEXT[code];
    // BAD_ESCAPE 的文案说的是「推理不是原因」。但**开着**推理确实会让它更糟
    // （实测 qwen3.6 打开推理，JSON 硬失败 16.7% → 33.3%），所以只在这次请求真的带了
    // 非 none 的 reasoning_effort 时才补这句 —— 不猜、不写死，照着发出去的值说。
    const effort = typeof r.reasoningEffortSent === 'string' ? r.reasoningEffortSent : '';
    if (code === 'BAD_ESCAPE' && effort && effort !== 'none') {
        remedy += '（本次请求带着 reasoning_effort=' + effort + '；把它设为「关」可以把失败率减半。）';
    }
    return { code: code, message: '无法解析 JSON 响应（' + code + '）：' + remedy };
}

// 本地链路专用的解析入口：解析失败时把 meta 里的 finish_reason / thinking / 正文
// 一起交给分类器，抛出**带补救办法**的错误。meta 为空时退化成「只看正文」，
// 与改动前的报错等价，不会更糟。
// opts 原样转交 parseJsonResponse（见那里的 arrayKey 注释）。不传 = 与改动前逐字等价。
function parseLocalJson(text, meta, opts) {
    try {
        return parseJsonResponse(text, opts);
    } catch (e) {
        const m = meta || {};
        const res = {
            text: (typeof m.text === 'string') ? m.text : String(text == null ? '' : text),
            thinking: !!m.thinking,
            truncated: !!m.truncated,
            // 这次请求实际发出去的 reasoning_effort（callLocalLLM 写进 meta）。
            // BAD_ESCAPE 的补救文案要靠它才能说人话，见 classifyLocalFailure。
            reasoningEffortSent: (typeof m.reasoningEffortSent === 'string') ? m.reasoningEffortSent : ''
        };
        // parseJsonResponse 把原始 SyntaxError 挂在 .cause 上（见那里的注释）：分类必须
        // 看原始措辞，看包装后的那句固定文案永远只能得到 UNPARSEABLE。
        const c = classifyLocalFailure(res, (e && e.cause) || e);
        const err = new Error(c.message);
        err.code = c.code;
        err.cause = e;
        throw err;
    }
}

// ============= Gemini API调用 =============
async function callGeminiAPI(model, contents, config = {}, apiKey = null, signal = null, meta = null) {
    if (!apiKey) {
        throw new Error("Gemini API Key not configured. Please add your API key in Settings.");
    }

    const url = `${GEMINI_API_BASE}/${model}:generateContent?key=${apiKey}`;

    const body = {
        contents: [{ parts: [{ text: contents }] }],
        generationConfig: {
            temperature: config.temperature || 0.3
        }
    };

    if (config.systemInstruction) {
        body.systemInstruction = { parts: [{ text: config.systemInstruction }] };
    }

    if (config.responseMimeType) {
        body.generationConfig.responseMimeType = config.responseMimeType;
    }

    if (config.responseSchema) {
        body.generationConfig.responseSchema = config.responseSchema;
    }

    const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Gemini API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    // ---- A2 / §3.3：绝不再读 parts[0] ----
    // 【实测，用户的真实 Key，gemini-2.5-flash-lite】开了 thinkingConfig.includeThoughts 之后
    // parts[0] 就是**思维链**（[THOUGHT:2296, text:369]），旧代码会把
    // 「**My Translation Strategy**\n\nOkay, here's my plan…」交给 JSON.parse 然后抛错；
    // 而 thinkingBudget:8 时 parts 干脆是**空数组**，旧代码返回 ""，调用方的
    // `JSON.parse(response || "{}")` 把它变成 {} —— **零条译文、零个报错**，
    // 屏幕上现有的整份译文被一份空文档换掉。这是本文件里最安静的一类数据丢失。
    // 今天没人设 thinkingConfig，所以它是**潜伏**而不是活跃缺陷；B2/C4 一加推理开关就会活。
    const cand = (data && data.candidates && data.candidates[0]) || {};
    const parts = (cand.content && Array.isArray(cand.content.parts)) ? cand.content.parts : [];
    const finish = cand.finishReason || '';
    const partText = function (p) { return (p && typeof p.text === 'string') ? p.text : ''; };
    if (meta) {
        // 同 callLocalLLM：MAX_TOKENS = 输出被上限截断，正文是半截的。
        meta.truncated = (finish === 'MAX_TOKENS');
        meta.finish = finish;
        meta.thoughts = parts.filter(function (p) { return p && p.thought === true; }).map(partText).join('');
        meta.thinking = meta.thoughts.trim() !== '';
    }
    if (!parts.length) throw new Error('Gemini 返回了空内容（可能是 thinking 预算耗尽或被安全策略拦截）');
    const answer = parts.filter(function (p) { return !p || p.thought !== true; }).map(partText).join('');
    if (meta) meta.text = answer;
    return answer;
}

// ============= OpenAI API调用 =============
// 需要特殊参数处理的新模型（不支持自定义 temperature，且用 max_completion_tokens 而非 max_tokens）
// 原数组降级为补充白名单，主判定改成规则匹配 —— 否则「更新」按钮拉回来的任何新模型
// （gpt-5.4 / gpt-6 / o5 …）都会走旧分支被塞 temperature + max_tokens 而 400。
const OPENAI_NEW_MODELS = ['gpt-5-nano', 'gpt-5-mini', 'gpt-5.2', 'o1', 'o1-mini', 'o1-preview', 'o3', 'o3-mini'];
const OPENAI_NEW_MODEL_PATTERN = /^(gpt-[5-9]|gpt-\d{2}|o[1-9])/i;

function isNewOpenAIModel(model) {
    const id = String(model || '');
    return OPENAI_NEW_MODEL_PATTERN.test(id) || OPENAI_NEW_MODELS.some(m => id.startsWith(m));
}

// 根据模型获取合适的 max tokens 限制
function getMaxTokensForModel(model, configMax) {
    if (configMax) return configMax;
    const id = String(model || '');
    // Nano 模型使用较小的 token 限制
    if (id.includes('nano')) return 2048;
    // Mini 模型使用中等限制
    if (id.includes('mini')) return 4096;
    // 其他模型使用默认值
    return 4096;
}

async function callOpenAIAPI(model, messages, config = {}, apiKey = null, signal = null) {
    if (!apiKey) {
        throw new Error("OpenAI API Key not configured. Please add your API key in Settings.");
    }

    const body = {
        model: model,
        messages: messages
    };

    // 新模型不支持自定义 temperature，只支持默认值 1
    if (!isNewOpenAIModel(model)) {
        body.temperature = config.temperature || 0.3;
    }

    // 新模型使用 max_completion_tokens，旧模型使用 max_tokens
    const maxTokens = getMaxTokensForModel(model, config.max_tokens);
    if (isNewOpenAIModel(model)) {
        body.max_completion_tokens = maxTokens;
    } else {
        body.max_tokens = maxTokens;
    }

    // 如果需要JSON响应（新模型不支持 response_format，通过 prompt 指示返回 JSON）
    if (config.jsonMode && !isNewOpenAIModel(model)) {
        body.response_format = { type: "json_object" };
    }

    const response = await fetch(OPENAI_API_BASE, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`OpenAI API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    // OpenAI 的响应形状与 LM Studio 的 OpenAI 兼容层同形，所以复用同一个读取口
    // （A2：「模型说了什么」全文件只判定一次）。取值与改动前逐字等价：
    // content 不是字符串时两边都得到 ""。
    return readLocalChoice(data).text;
}

// ============= Claude API调用 =============
// Claude 模型 token 限制
function getMaxTokensForClaudeModel(model, configMax) {
    if (configMax) return configMax;
    // Haiku 模型使用较小的 token 限制
    if (model.includes('haiku')) return 4096;
    // Sonnet 和 Opus 使用较大限制
    return 8192;
}

async function callClaudeAPI(model, messages, config = {}, apiKey = null, signal = null, proxyUrl = null) {
    if (!apiKey) {
        throw new Error("Claude API Key not configured. Please add your API key in Settings.");
    }

    if (!proxyUrl) {
        throw new Error("Claude Proxy URL not configured. Please add your Cloudflare Worker proxy URL in Settings.");
    }

    // 提取 system message（Claude 使用单独的 system 参数）
    let systemPrompt = null;
    const userMessages = [];

    for (const msg of messages) {
        if (msg.role === 'system') {
            systemPrompt = msg.content;
        } else {
            userMessages.push({
                role: msg.role,
                content: msg.content
            });
        }
    }

    const body = {
        model: model,
        max_tokens: getMaxTokensForClaudeModel(model, config.max_tokens),
        messages: userMessages
    };

    // 添加 system prompt（如果有）
    if (systemPrompt) {
        body.system = systemPrompt;
    }

    // Claude 支持 temperature 参数
    if (config.temperature !== undefined) {
        body.temperature = config.temperature;
    } else {
        body.temperature = 0.3;
    }

    // 使用代理 URL 而不是直接调用 Claude API
    const endpoint = proxyUrl.replace(/\/$/, "");

    const response = await fetch(endpoint, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify(body),
        signal
    });

    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Claude API Error: ${response.status} - ${errText}`);
    }

    const data = await response.json();
    // Claude 返回格式: { content: [{ type: "text", text: "..." }] }
    return data.content?.[0]?.text || "";
}

// ============= 传输期 \textcolor 剥离 =============
// \textcolor{color}{content} -> content，仅作用于"发给模型的文本"。
// 原因：\textcolor 以 \t 开头，混在模型返回的 JSON 字符串字面量里会被 JSON.parse 解析成 TAB+"extcolor"。
// 宏不进 JSON 就不可能被破坏。绝不修改 AppState.inputText / originalInputText 等用户原文。
// 约束：单遍扫描、括号配平、可嵌套、有工作量上限、任何异常都返回原文（renderApp 无 try/catch，禁止抛出）。
//
// ⚠️ 截断是常态，不是边角情况（v01.00.01 修）
//   用户是按手选区间一段一段翻译的，右括号落在选区外再正常不过。旧版一遇括号不配平
//   就「保守地」原样返回，宏于是整条漏给模型，模型再原样回显 —— 译文里就出现
//   \textcolor{purple}{...}。真实复现：745 字符、2 个 '{' 对 1 个 '}'，旧实现零改动。
//   现在按「宏语法 vs 用户正文」分开处理：
//     内容组被截断 -> 丢宏头，后面的正文一个字都不能少
//     颜色组被截断 -> 丢掉这截宏语法（'{pur' 不是用户的话）
//     压根没有内容组 -> 只丢宏头
//     选区起点落在颜色组内部（多出无主的 '}'）-> 清掉那些无主右括号
//   回归测试：tests/latex/textcolor-suite.js（直接从本文件抽函数跑，不是副本），
//   pre-commit 钩子会在 AI-Translator.html 进暂存区时强制跑一遍。
//   病态输入的专项测量与回归：tools/measure-textcolor.js、tests/latex/pathological-suite.js。
//
// ⚠️ v01.05.01 修：预算耗尽是**真会发生**的，而且发生得非常早（实测，不是估算）
//   旧实现每遇到一个 \textcolor 就用 matchBrace() 往前找内容组的右括号，找到之后
//   却只把 i 前进到组内**第一个字符** —— 刚扫过的那一整段马上被外层循环重扫一遍。
//   于是代价是 O(n²)，而 n*8+100000 的预算在下面这两种输入上直接见底：
//     · 未闭合的内容组：第 **106** 个就爆（旧代码，本机 node v24 实测）
//     · 良构的嵌套层数：第 **121** 层就爆
//   ——都远低于「五万个组 / 五十层」这种量级的传闻值，也远低于用户真会粘贴的规模。
//   爆掉之后 stripTextColorOnce 返回 **原样输入**，stripTextColorForModel 原样往下传，
//   全程没有一个字的提示：那 106 个 \textcolor 一字不落地发给模型，再被模型回显进译文。
//   这正是本项目一直在打的那类 bug —— 只不过这次是「整条漏」而不是「漏碎片」。
//
// 【怎么改的】把内容组的 matchBrace 整个删掉，换成一个**显式层号栈**：
//   看到内容组的 '{' 只记下「它开在第几层」，右括号交给外层循环自然走到时按层号认领。
//   于是每个字符只被外层看一次；颜色参数组虽然仍要整体跳读，但 i 会直接跨到组尾之后，
//   所有颜色组的扫描区间两两不相交。总代价从 O(n²) 降到 O(n)。
//   实测（同机同 node）：未闭合组从 106 → 200 万个仍然剥干净；嵌套从 121 → 20 万层仍然剥干净；
//   4.4MB / 20 万个未闭合组耗时 162.8ms → 34.5ms，且结果由「原样漏光」变成「全部剥净」。
//
// 【预算为什么还留着】证明和保证不是一回事。单遍扫描下每个字符最多被看 3 次
//   （外层一次、宏头空白窥视一次、颜色组尾空白窥视一次），实测峰值恒 < 3n，
//   n*8+100000 从此是一条够不到的兜底线。真要是将来改出了逻辑洞，宁可退化成
//   一次**看得见的放弃**，也不要变成浏览器同步卡死 —— 渲染错误边界能救回抛出的异常，
//   救不回一个转不完的 while。
//   而「放弃」这件事本身现在必须说出来：见 stripTextColorForModel 末尾的自检与上报。
function stripTextColorOnce(input, report) {
    const n = input.length;
    let budget = n * 8 + 100000; // 够不到的兜底线；见上方说明
    let blown = false;           // 预算耗尽 ≠ 括号截断，两者绝不能混为一谈
    const rep = (report && typeof report === 'object') ? report : null;
    const isSpace = (ch) => ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r';
    const isAlpha = (ch) => (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z');
    // 只服务于**颜色参数组**：它一定会被整体跳过（i 直接跨到组尾之后），
    // 所以所有颜色组的扫描区间两两不相交，累计代价 O(n)。
    // 内容组绝不许用它 —— 那正是旧实现 O(n²) 的唯一来源。
    const scanGroup = (open) => {
        let depth = 0;
        for (let p = open; p < n; p++) {
            if (--budget < 0) { blown = true; return -1; }
            const ch = input[p];
            if (ch === '\\') { p++; continue; }
            if (ch === '{') depth++;
            else if (ch === '}') { depth--; if (depth === 0) return p; }
        }
        return -1;
    };
    let out = '';
    let i = 0;
    let depth = 0;        // 外层循环走过的 '{' 层数（颜色组被整体跳过，且必然配平，净贡献 0）
    const dropDepth = []; // 内容组开括号所在的层号；栈顶永远是最里面那一层
    while (i < n) {
        if (--budget < 0) { blown = true; break; }
        const ch = input[i];
        if (ch === '\\') {
            // \textcolorbox 之类同前缀的别的宏必须原样放过：后面紧跟字母就不是 \textcolor
            if (input.startsWith('\\textcolor', i) && !isAlpha(input[i + 10])) {
                let j = i + 10;
                let headEnd = j; // 已确认属于「宏语法」的部分结束在哪；空白不算，留给正文
                while (j < n && isSpace(input[j])) { if (--budget < 0) { blown = true; break; } j++; }
                if (blown) break;
                if (input[j] === '[') { // \textcolor[rgb]{1,0,0}{...}
                    const rb = input.indexOf(']', j);
                    if (rb === -1) return out; // 可选参数被截断：后面全是宏语法残骸，不是正文
                    budget -= (rb - j);        // 这一段一定会被跨过，记账后总量仍是 O(n)
                    if (budget < 0) { blown = true; break; }
                    j = rb + 1;
                    headEnd = j;
                    while (j < n && isSpace(input[j])) { if (--budget < 0) { blown = true; break; } j++; }
                    if (blown) break;
                }
                if (input[j] === '{') {
                    const colorEnd = scanGroup(j);
                    if (colorEnd === -1) {
                        if (blown) break;
                        return out; // 颜色组被截断：'{pur' 是宏语法的残骸，不是用户的话
                    }
                    let k = colorEnd + 1;
                    while (k < n && isSpace(input[k])) { if (--budget < 0) { blown = true; break; } k++; }
                    if (blown) break;
                    if (input[k] === '{') {
                        // ⚠️ 本次修复的核心：**不去找**内容组的右括号。
                        // 只记下它开在第几层；右括号由下面 '}' 分支按层号认领。
                        // 内容组被截断（右括号落在选区外）时这个层号永远等不到人来认领 ——
                        // 结果恰好就是旧实现要的「只丢宏头，正文一个字不少」，不需要额外分支。
                        depth++;
                        dropDepth.push(depth);
                        i = k + 1;
                        continue;
                    }
                    i = colorEnd + 1; // 没有内容组：只丢 \textcolor{color}，其余（含空白）原样保留
                    continue;
                }
                i = headEnd; // 连 '{' 都没有：丢掉宏名（和已吃掉的 [rgb]），其余原样保留
                continue;
            }
            // 其他反斜杠序列原样保留（连带下一个字符），避免 \{ \} 干扰括号配对
            out += ch;
            if (i + 1 < n) { out += input[i + 1]; i += 2; } else { i += 1; }
            continue;
        }
        if (ch === '{') { depth++; out += ch; i += 1; continue; }
        if (ch === '}') {
            if (depth > 0) {
                if (dropDepth.length && dropDepth[dropDepth.length - 1] === depth) {
                    dropDepth.pop(); depth--; i += 1; continue; // 内容组的右括号：吞掉
                }
                depth--;
            }
            // depth === 0 的 '}' 是无主右括号（选区起点落在组内），原样留着，
            // 由 stripTextColorForModel 末尾那一遍统一清理 —— 那里才知道全局配平情况。
            out += ch; i += 1; continue;
        }
        out += ch;
        i += 1;
    }
    if (blown) {
        // 绝不返回半成品：半剥离的文本会把 \textcolor 的碎片留在用户文档里，
        // 比整条漏出去更难被发现。原样退回 + 置位，由调用方负责说出来。
        if (rep) rep.blown = true;
        return input;
    }
    return out;
}

function stripTextColorForModel(input) {
    // 出口只有两个：剥干净的文本，或者「原样退回 + 已经明确告知用户」。
    // 绝不存在第三种「安静地交出半成品」。
    const giveUp = (why, detail) => {
        try {
            console.error('[textcolor] 剥离放弃（' + why + '）：本次发给模型的是**未经剥离的原文**，'
                + '\\textcolor 会原样出现在译文里。', detail || '');
        } catch (e) {}
        try {
            // 边界面板是全应用唯一的「出事了」告知口；它挂在 <body> 上，不受渲染重建影响。
            // 用 typeof 守卫是必须的：回归测试把这两个函数单独抽进 vm 沙箱跑，那里没有边界。
            if (typeof rbReportStripGiveUp === 'function') rbReportStripGiveUp(why, input, detail);
        } catch (e) {}
    };
    // 「还有没有活的 \textcolor」——判定规则必须和扫描器逐字一致，否则会误报：
    //   · 后面紧跟字母的不算（\textcolorbox 是另一个宏，本来就该留着）；
    //   · 反斜杠本身被转义的不算（\\textcolor 在 LaTeX 里是「反斜杠 + 文字 textcolor」）。
    // 刻意写成局部函数：回归测试只按名字抽 stripTextColorOnce / stripTextColorForModel 两个，
    // 提到外面就会让沙箱里的调用变成 ReferenceError，把整套 EXACT 用例一起打挂。
    const hasLiveTextColor = (s) => {
        if (typeof s !== 'string') return false;
        let at = s.indexOf('\\textcolor');
        while (at !== -1) {
            const nxt = s[at + 10];
            const alpha = nxt !== undefined && ((nxt >= 'a' && nxt <= 'z') || (nxt >= 'A' && nxt <= 'Z'));
            if (!alpha) {
                let back = 0, p = at - 1;
                while (p >= 0 && s[p] === '\\') { back++; p--; }
                if (back % 2 === 0) return true; // 这个反斜杠是活的
            }
            at = s.indexOf('\\textcolor', at + 1);
        }
        return false;
    };
    try {
        if (typeof input !== 'string') return input;
        let text = input;
        const report = { blown: false };
        if (text.indexOf('\\textcolor') !== -1) {
            for (let pass = 0; pass < 5; pass++) { // 迭代到不动点，硬上限防死循环
                if (text.indexOf('\\textcolor') === -1) break;
                const next = stripTextColorOnce(text, report);
                if (report.blown) {
                    giveUp('工作量预算耗尽', '输入 ' + input.length + ' 字符，第 ' + (pass + 1) + ' 遍');
                    return input;
                }
                if (next === text) break;
                text = next;
            }
        }
        // 选区起点落在颜色组内部时，会剩下无主的 '}'。它是宏语法的残骸，不是正文；
        // 留着模型会当成 LaTeX 回显。一次扫完所有无主右括号（只清一个的话不幂等）。
        if (text.indexOf('}') !== -1) {
            let depth = 0, stray = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '\\') { i++; continue; }
                if (c === '{') depth++;
                else if (c === '}') { if (depth === 0) { stray = true; break; } depth--; }
            }
            if (stray) {
                let out = '';
                depth = 0;
                for (let i = 0; i < text.length; i++) {
                    const c = text[i];
                    if (c === '\\') { out += c; if (i + 1 < text.length) out += text[i + 1]; i++; continue; }
                    if (c === '{') depth++;
                    else if (c === '}') { if (depth === 0) continue; depth--; }
                    out += c;
                }
                text = out;
            }
        }
        // 出门自检。走到这里还剩下活的 \textcolor，说明上面某条分支没干完活；
        // 安静地把它交出去 = 用户的译文里长出 \textcolor —— 正是这个模块存在的理由。
        // 宁可原样退回（至少是一段完整、可辨认的原文）并且大声说出来。
        if (hasLiveTextColor(text)) {
            giveUp('五遍之后仍有残留', '输入 ' + input.length + ' 字符');
            return input;
        }
        return text;
    } catch (e) {
        // 绝不抛出（调用点在 translateBulk 的最前面），但也绝不装作没事发生。
        giveUp('剥离过程抛异常', (e && e.message) ? String(e.message) : String(e));
        return input;
    }
}

// ==========================================================================
// ============= 哨兵传输协议（把原文从 JSON 字符串字面量里搬出来）=============
// ==========================================================================
//
// 【为什么非改不可】现行协议要求模型把原文和译文都塞进一个 JSON 字符串里回来。
// 反斜杠在 JSON 字符串里必须转义，而模型在**同一个字符串内部**都做不到一致。实测
// （261 条真实服务器日志 + 应用内对照）出现两种后果：
//   · 静默损坏（最危险）：\textcolor → TAB + "extcolor"、\ref → CR + "ef"、
//     \nu/\neq/\begin/\beta/\frac 同理。它们都是**合法**的 JSON 转义，JSON.parse
//     一声不吭，界面上不报错，用户只能靠肉眼发现自己的公式没了。
//   · 硬失败：非法转义 → "Bad escaped character in JSON" → 报错横幅 + 零产出。
// 分模型剖面：qwen3-1.7b 硬失败 37.7%、已解析结果里 12.6% 静默损坏；
// qwen3.6-35b 硬失败 0；gemini-2.5-flash-lite 硬失败 0 但**照样静默吃掉 \ref/\cite**
// —— 它是本应用的默认模型，也是最危险的那个，因为它永远不报错。
// 语法约束解码（Gemini responseSchema）只能消掉「硬失败」，静默损坏原样保留。
// 提示词也治不了：模型在一个字符串里就自相矛盾。
//
// 【怎么改】客户端自己分段 → 每段前加一行 @@n@@ 哨兵 → 数学/引用/交叉引用换成
// [[k]] 占位符 → 按下标配对 → **不要求模型回显原文**。载荷全程是纯文本，
// 一个 JSON 字符串字面量都不经过，转义问题从根上不存在。副产品：输出 token 减半，
// 实测 35B 上数学段落中位耗时 11009ms → 4524ms，7862 字大输入 48.8s → 13.2s。
//
// 【上一版被否掉的九条，这里逐条堵住】
//   ①从陈旧基线分叉 → 本版直接长在 HEAD 上，只增不改；
//   ②整段全有或全无 → 逐段失败阶梯 + 逐段失败标记，绝不因为一段拖垮整批；
//   ③失败还改写输入框 → 本路径一个字都不碰 AppState.inputText；
//   ④遮罩漏跨行行内数学 → 改用字符级扫描器（不是正则），并按 main.tex 全量标定；
//   ⑤哨兵/占位符语法带内未转义 → 原文里出现的 [[k]] / @@n@@ 一律**也**当受保护
//     token 收进 map，模型永远看不到裸语法，还原时逐字回填；
//   ⑥后批失败销毁前批好译文 → 结果数组一次性交付，任何失败都只影响它自己那一段；
//   ⑦历史恢复后重新生成覆盖归档 → 见 handleRegenerateAll 的一致性确认；
//   ⑧粒度从句退化到段 → 复用 HEAD 的 findSentenceBoundaries，**按句**切分；
//   ⑨Gemini 分支没测 → 本版 Gemini 已实测（见 tests/transport/）。
//
// 【实测推翻的两条旧结论，别再写回去】
//   · 批次大小必须按 /api/v0/models 报的 loaded_context_length 现算，不能按配置上限。
//     上下文是**加载期**参数，LM Studio 重启就回落 4096。
//   · 占位符丢失不是独立随机事件，是**确定性**的：qwen3-1.7b 在同一段 equation 上
//     6/6 孤立试验 + 3/3 应用内运行丢的都是同一批 token。所以重试阶梯的每一级都必须
//     **改变请求内容**（孤立 → 拆段 → 退回旧协议），重发同样的请求不可能收敛。
//
// 全套函数只在事件处理链上跑，不在渲染路径上；且除了 network 调用之外不抛异常。

// 单段失败时写进译文栏的可见标记。绝不留空、绝不静默塞回原文 —— 用户必须一眼看见。
const XPORT_FAIL_MARK = '⚠️ 本段翻译失败——请点击本行的 ↻ 单独重试';

// 这些环境整体不可拆：内部出现空行会让 amsmath 编译报错，所以段落切分切不开它们。
const XPORT_MATH_ENVS = ['equation', 'align', 'alignat', 'flalign', 'eqnarray', 'gather',
    'multline', 'IEEEeqnarray', 'cases', 'dcases', 'split', 'array', 'smallmatrix',
    'matrix', 'pmatrix', 'bmatrix', 'Bmatrix', 'vmatrix', 'Vmatrix', 'subequations',
    'displaymath', 'math'];

// 「不透明」命令：花括号里装的不是正文，翻译它等于破坏它。其余命令（\textbf/\emph/\caption…）
// 刻意**不**进这个表 —— 它们的花括号里是人话，遮起来会让那段话永远不被翻译。
const XPORT_OPAQUE_RE = /^\\(?:[a-zA-Z]*[Cc]ite[a-zA-Z]*|ref|eqref|autoref|cref|Cref|cpageref|pageref|vref|nameref|url|nolinkurl|path|href|label|includegraphics|input|include|bibliography|bibliographystyle|usepackage|documentclass|begin|end|hspace|vspace|hphantom|vphantom|phantom|setlength|linespread|newcommand|renewcommand|def)\*?(?![a-zA-Z@])/;

const XPORT_MATH_MAX = 4000;      // 一个数学 token 的字符上限，防止一个孤立 $ 把整段吞掉
const XPORT_SEG_SOFT_MAX = 6000;  // 超过就按换行再切，避免单段撑爆上下文

// 与 text[open]（必须是 '{'）配对的 '}' 的**后一位**下标；不配平返回 -1
function xportMatchBrace(text, open, limit) {
    let depth = 0;
    const end = Math.min(text.length, open + (limit || 2000));
    for (let p = open; p < end; p++) {
        const c = text[p];
        if (c === '\\') { p++; continue; }
        if (c === '{') depth++;
        else if (c === '}') { depth--; if (depth === 0) return p + 1; }
    }
    return -1;
}

// text[i] 起是不是一个「受保护 token」？是就返回它的字符长度，不是返回 0。
// 纯函数、不抛、只读；上限全部有界，病态输入不会长时间阻塞。
function xportProtectedSpan(text, i) {
    const n = text.length;
    const ch = text[i];
    if (ch === undefined) return 0;

    // (1) 协议自身的语法出现在原文里 —— 也当受保护 token 收走。
    //     这就是「带内注入」的根治法：模型永远看不到裸的 [[k]] / @@n@@，
    //     用户原文里的 [[3]] 会被原样还原，再也不会被截断或吃掉。
    if (ch === '[' && text[i + 1] === '[') {
        const m = /^\[\[\s*\d+\s*\]\]/.exec(text.slice(i, i + 20));
        if (m) return m[0].length;
    }
    if (ch === '@' && text[i + 1] === '@') {
        const m = /^@@\s*\d+\s*@@/.exec(text.slice(i, i + 20));
        if (m) return m[0].length;
    }

    // (2) $…$ / $$…$$：**逐字符**扫，允许跨行（上一版用正则的 [^$\n]+ 漏掉了
    //     main.tex 352 段里的 34 段），遇到 \ 直接跳两格，所以 \$ 不会被当成定界符。
    if (ch === '$') {
        const marker = (text[i + 1] === '$') ? '$$' : '$';
        let p = i + marker.length;
        while (p < n && p - i <= XPORT_MATH_MAX) {
            if (text[p] === '\\') { p += 2; continue; }
            if (text.startsWith(marker, p)) return p + marker.length - i;
            p++;
        }
        return 0;   // 不配对：当普通字符放过，绝不吞掉半段正文
    }

    // (2c) LaTeX 注释：未转义的 `%` 起、**到行末为止，连那个换行一起**收成一个 token。
    // 【为什么必须有 —— 实测，两个模型 4/4】原文 #417 是一句被作者用 `%` 注释掉一半的话：
    //     Subsequently, both players
    //     %employ Temporal Graph Neural Networks (TGNNs) to
    //     predict the opponent's strategy and refine their beliefs.
    // LaTeX 只排 `%` 之外的部分。改动前 `%` 和换行都是**裸的普通字符**送给模型，模型顺手
    // 把它们抹平，交回来的是「随后，两名玩家均利用时序图神经网络（TGNNs）预测……」——
    // 作者**故意注释掉、不打算发表**的技术论断，被提升成了中文正文里的一句断言。
    // 而 xportBlockOk 只查占位符/哨兵/控制字符、xportEquationAudit 只数 \begin{env}，
    // 两个都看不见 `%`：`failedCount=0`、没有 toast、没有失败标记。全篇 1390 段里约 10% 有暴露面。
    //
    // 【为什么是「占位符」而不是「先删掉、译完再塞回去」】译文的语序和原文不一样，
    // 删掉之后没有任何可靠的锚点能把注释放回它原来的位置；而占位符这条路直接复用了
    // 传输层**已经验证过**的那套保证：xportBlockOk 逐个点名 [[k]]，注释被删/被复制/被改号
    // 一律当场判失败并进恢复阶梯 —— 六类损坏检查里本来就有它的位置。删除法一点校验都没有。
    //
    // 【为什么换行必须收进 token 里】这是这条规则的关键细节：还原是逐字splice 的，
    // 模型把 [[k]] 放到句中时，还原出来的是 `……译文%注释\n后半句`，`%` 只吃到自己那个换行为止，
    // 后半句安然无恙（LaTeX 里行尾 `%` 正好就是「吃掉换行」的惯用法，两行会被接成一行，
    // 与原文的排版结果一致）。若不收换行，`%` 会把它后面的整行译文一起注释掉 ——
    // 那等于换一种方式毁掉用户的正文。
    //
    // 【`\%` 不会走到这里】xportMask / xportProtectedRanges 在扫到 `\` 时整体跳过转义序列
    // （`/^\\[a-zA-Z@]+\*?/` 匹配不上 `\%`，走 `i += 2` 那一支），所以本函数拿到的 `%`
    // 一定是**未转义**的注释符。语料里 `32\%` 这类字面百分号原样不动。
    // 数学环境 / $…$ / \url{…} 内部的 `%` 更早就被 (2)(3)(4) 整体收走了，同样不受影响。
    if (ch === '%') {
        const nl = text.indexOf('\n', i);
        return (nl === -1 ? n : nl + 1) - i;
    }

    if (ch !== '\\') return 0;

    // 【`\%` 为什么**不**在这里被遮起来 —— 上一版遮过，量出来更糟，已撤回】
    // 曾经有一条规则 (2a) `if (text[i + 1] === '%') return 2;`，把字面百分号整体换成 [[k]]。
    // 它确实治好了「模型吃掉反斜杠」这一类；但同一套 A/B 量下来，它造出了一类更糟的：
    //     同样 3 句 × 2 个模型 × 4 轮 = 24 次
    //     · 遮起来：反斜杠被吃 0/24，**数值含义被改 14/24**
    //       （「隐蔽吞吐量提升了32\%倍」= 32 倍；「仅有4\%条候选路线」）
    //     · 不遮  ：反斜杠被吃 10/24，数值含义被改 0/24
    // 模型看见 `32[[1]]` 时不知道那是百分号，会顺手补一个量词，把论文的主结论数字改掉，
    // 而 xportBlockOk 看占位符是完好的、failedCount=0 —— 比丢反斜杠更隐蔽、更频繁。
    // 所以 `\%` 原样送给模型（`%` 前有 `\`，xportMask/xportProtectedRanges 扫到 `\` 一律
    // 跳两格，所以它也不会被下面 (2c) 的注释规则误吞）。
    // 「反斜杠被吃」那一类改由 xportBlockOk 的裸 `%` 检查兜住 —— 掩码后的正文里裸 `%`
    // 恒为 0，模型交回来出现一个就一定是损坏，当场判失败进恢复阶梯，绝不静默交付。

    // (2b) LaTeX 强制换行 \\ / \\* / \\[1pt]。main.tex 里 \\[1pt] 是唯一一处
    //      「掩码之后仍然裸露在正文里的 LaTeX 语法」，收进来正好把覆盖率补满。
    if (text[i + 1] === '\\') {
        const br = /^\\\\\*?(?:[ \t]*\[[^\]\n]{0,24}\])?/.exec(text.slice(i, i + 40));
        if (br) return br[0].length;
    }

    // (3) \[ … \] 与 \( … \)
    if (text[i + 1] === '[') {
        const c = text.indexOf('\\]', i + 2);
        if (c !== -1 && c - i <= XPORT_MATH_MAX) return c + 2 - i;
        return 0;
    }
    if (text[i + 1] === '(') {
        const c = text.indexOf('\\)', i + 2);
        if (c !== -1 && c - i <= XPORT_MATH_MAX) return c + 2 - i;
        return 0;
    }

    const m = XPORT_OPAQUE_RE.exec(text.slice(i, i + 40));
    if (!m) return 0;
    let j = i + m[0].length;

    // (4) \begin{数学环境} … \end{同名}：整体一个 token
    if (m[0] === '\\begin' && text[j] === '{') {
        const close = xportMatchBrace(text, j, 200);
        if (close !== -1) {
            const env = text.slice(j + 1, close - 1);
            if (XPORT_MATH_ENVS.indexOf(env.replace(/\*$/, '')) !== -1) {
                const endTok = '\\end{' + env + '}';
                const e = text.indexOf(endTok, close);
                if (e !== -1) return e + endTok.length - i;
            }
        }
    }

    // (5) 吃掉紧随其后的 [可选] / {必选} 参数组（同一行内，绝不跨行乱吞）
    for (let guard = 0; guard < 6; guard++) {
        let k = j;
        while (k < n && (text[k] === ' ' || text[k] === '\t')) k++;
        if (text[k] === '{') {
            const c = xportMatchBrace(text, k, 2000);
            if (c === -1) break;
            j = c; continue;
        }
        if (text[k] === '[') {
            const rb = text.indexOf(']', k);
            if (rb === -1 || rb - k > 200) break;
            j = rb + 1; continue;
        }
        break;
    }
    return j - i;
}

// 把一段原文变成 { text: 掩码后送给模型的文本, map: [被换走的原文片段…] }
// 相邻 token（含仅隔一个 ~ 的）会合并成一个占位符：既保住了 ~，又直接降低占位符密度
// —— 实测「占位符丢失是确定性的、且发生在密集处」，降密度是唯一有效的结构性缓解。
function xportMask(seg) {
    const text = String(seg == null ? '' : seg);
    const n = text.length;
    const map = [];
    let out = '';
    let i = 0;
    let budget = n * 6 + 20000;   // 硬性工作量上限：任何输入都不可能死循环
    while (i < n) {
        if (--budget < 0) { out += text.slice(i); break; }
        let len = xportProtectedSpan(text, i);
        let start = i;
        if (len === 0 && text[i] === '~') {
            const t = xportProtectedSpan(text, i + 1);
            if (t > 0) len = 1 + t;
        }
        if (len > 0) {
            let end = start + len;
            for (let guard = 0; guard < 500; guard++) {
                let p = end;
                if (text[p] === '~') p++;
                const more = (p < n) ? xportProtectedSpan(text, p) : 0;
                if (more <= 0) break;
                end = p + more;
            }
            map.push(text.slice(start, end));
            out += '[[' + map.length + ']]';
            i = end;
            continue;
        }
        if (text[i] === '\\') {
            // 不在不透明表里的命令：命令名原样送给模型抄，参数里的正文照常翻译
            const cm = /^\\[a-zA-Z@]+\*?/.exec(text.slice(i, i + 40));
            if (cm) { out += cm[0]; i += cm[0].length; continue; }
            out += text.slice(i, i + 2); i += 2; continue;   // \% \$ \& \_ \\ 等转义序列
        }
        out += text[i]; i++;
    }
    return { text: out, map: map };
}

// 还原：**一次扫描**完成，绝不迭代替换 —— 否则还原出来的内容里如果本身含 [[2]]
// （用户原文就写了这个），下一轮会把它当占位符再替换一次，正是第 5 条要堵的洞。
function xportUnmask(body, map) {
    return String(body).replace(/\[\[\s*(\d+)\s*\]\]/g, function (whole, d) {
        const k = parseInt(d, 10);
        return (k >= 1 && k <= map.length) ? map[k - 1] : whole;
    });
}

// ============= A1：全文件唯一的 <think> 规则 =============
// 【为什么必须只有一条】改动前文件里有两处各自为政的剥离，两处都是错的：
//   · parseCrossFragments 用 /<think>[\s\S]*?<\/think>/ 匹配**成对**标签。而 Qwen3 的
//     聊天模板把 `<think>\n` 预填进**提示词**里，所以真实泄漏只有**闭合**标签，
//     成对正则是空操作 —— 实测一条 815 字符的泄漏只被删掉 20 个字符，
//     整段思维链原样留在结果里。
//   · xportParseBlocks 用 lastIndexOf('</think>') 硬切：译文里正当出现 `</think>`
//     （讲解推理模型的段落天天出现）就会把前半句整个吃掉；配不到闭合标签时再退一步用
//     indexOf('<think>') 保留**尾巴**，等于把推理正文当译文写进用户文档 ——
//     而那一段若没有占位符，xportBlockOk 平凡通过，**没有标记、没有报错**。
//
// 【第三个实测事实，决定了标签不可当锚点】源文里出现的 `<think>` 是**按模型删的**：
// qwen3.6 原样透传，qwen3.8 删标签，qwen3-1.7b 连标签带内容一起删（被删的东西
// 哪儿都没去，reasoning_content 是空的）。所以 `<think>` 根本不能往返，
// 拿它当结构锚点在任何一个模型上都不成立。
//
// 【第四个实测事实，它决定了下面两条规则的形状】`</think>` 在**译文正文里**是家常便饭：
// 用户翻的就是论文，凡是讲推理模型的段落都会原样出现这个标签（本仓库自己的文档也有）。
// 实测：`推理模型…且答案仅在闭合的</think>标记之后才开始。`（116 字符）经过旧规则只剩
// 7 个字符入库，没有标记、没有 toast、没有报错 —— 而 renderFormattedText 是按 HTML 插的，
// 浏览器把 `<think>` 直接吃掉，用户连「句子为什么变短了」都看不见。
// 所以这一刀的默认答案必须是**不切**；要切，得拿出证据。
//
// 规则，按优先级：
//   1. 输出**以** `<think>` 开头 = 唯一"确凿"的推理区标志（第三方 OpenAI 兼容端把思维链
//      内联进 content 时就是这个形状）。此时第一个 `</think>` 就是推理与答案的分界：
//      切它。一个闭合标签都没有 = 整段都是推理，返回空让恢复阶梯去跑。**绝不**返回
//      「尽力而为」的半截正文：那正是把思维链写进用户文档的那条路。
//   2. 不以 `<think>` 开头时（Qwen3 模板把开标签预填进提示词，真实泄漏可能只有闭合标签），
//      「泄漏」与「译文里正当出现 </think>」在文本上**完全同形**，唯一能区分的证据是
//      协议锚点。两条都成立才许切：
//        (a) 切完之后**紧接着**就是协议锚点（中间只许有空白）—— 真泄漏的答案总是从
//            锚点开始，而译文里的 </think> 后面跟的是句子的后半截；
//        (b) 被切掉的那一段里出现过的每一个锚点，切完之后**依然在** —— 否则这一刀
//            切掉的是正文（模型把 @@1@@ 写在草稿里再抄一遍时两者都成立，那才是真泄漏）。
//      拿不出这两条证据就**原样保留**：没有锚点可依（单段恢复请求、跨栏纯散文）时
//      宁可漏掉一次假设中的泄漏，也绝不再静默删掉用户句子的前半截。
//   3. 绝不静默：返回值带 cut / allReasoning，调用方可以据此报错。
// anchorSrc = 该链路协议锚点的正则**源串**（不带 g 标志）；null = 这条链路没有协议锚点。
const XPORT_THINK_ANCHOR = '@@\\s*\\d+\\s*@@';         // 哨兵传输协议
const XPORT_CROSS_ANCHOR = '(?:^|\\n)[ \\t]*@@';       // 跨栏高亮的片段协议
function xportThinkCut(raw, anchorSrc) {
    const t = String(raw == null ? '' : raw);
    // 这条链路上所有协议锚点的**字面量**（去掉空白后归一），顺序无关，只用来比对存活。
    const anchorsOf = function (s) {
        const out = [];
        if (!anchorSrc) return out;
        try {
            const re = new RegExp(anchorSrc, 'g');
            let m, guard = 0;
            while ((m = re.exec(s)) && ++guard < 20000) {
                out.push(String(m[0]).replace(/\s+/g, ''));
                if (re.lastIndex === m.index) re.lastIndex++;   // 零宽匹配防死循环
            }
        } catch (e) { return []; }
        return out;
    };
    const firstAnchorAt = function (s) {
        if (!anchorSrc) return -1;
        try { return s.search(new RegExp(anchorSrc)); } catch (e) { return -1; }
    };
    // 规则 1
    if (/^[\s\uFEFF]*<think>/i.test(t)) {   // U+FEFF = BOM，某些端会在正文前带一个
        const ci = t.indexOf('</think>');
        if (ci === -1) return { text: '', cut: true, allReasoning: true };
        return { text: t.slice(ci + 8), cut: true, allReasoning: false };
    }
    // 规则 2
    const closeIdx = t.indexOf('</think>');
    if (closeIdx !== -1) {
        const after = t.slice(closeIdx + 8);
        const at = firstAnchorAt(after);
        if (at !== -1 && after.slice(0, at).trim() === '') {          // (a)
            const dropped = anchorsOf(t.slice(0, closeIdx));
            const kept = anchorsOf(after);
            let safe = true;
            for (let i = 0; i < dropped.length && safe; i++) {        // (b)
                if (kept.indexOf(dropped[i]) === -1) safe = false;
            }
            if (safe) return { text: after, cut: true, allReasoning: false };
        }
    }
    return { text: t, cut: false, allReasoning: false };
}

// 没有被 `\` 转义的 `%` 有几个。LaTeX 里这样一个 `%` 会把它到行末的内容全部吞掉，
// 编译**不报错**，只是排出来的 PDF 里少了一段 —— 全部损坏类型里最安静的一个。
function xportBareComments(s) {
    const t = String(s == null ? '' : s);
    let n = 0;
    for (let i = 0; i < t.length; i++) {
        if (t[i] === '\\') { i++; continue; }
        if (t[i] === '%') n++;
    }
    return n;
}

// 「丢、多、改号、写坏、串段、控制字符、裸注释符」七类损坏一次判掉。
// 不通过 = 进重试阶梯，绝不静默入库 —— 这是整个改动的安全底线。
function xportBlockOk(body, map) {
    if (typeof body !== 'string') return false;
    const t = body.trim();
    if (t === '') return false;
    if (/@@\s*\d+\s*@@/.test(t)) return false;                              // 哨兵漏进正文 = 段落串了
    // 裸控制字符 = 反斜杠命令被吃掉。**必须包含 TAB(0x09) 与 CR(0x0D)** —— 改动前的
    // 字符类恰恰把这两个漏了，而它们正是 JSON 转义缺陷产出的那两个字节：
    // `\textcolor` → TAB + "extcolor"，`\ref` → CR + "ef"。LF(0x0A) 仍然合法（多行块是常态）。
    // 误判的代价是多走一次恢复阶梯；漏判的代价是把控制字符写进用户文档。
    if (/[\x00-\x09\x0B-\x1F\x7F]/.test(t)) return false;
    // 裸 `%` = 反斜杠被吃掉（`32\%` → `32%`），或者模型自己编了个注释符。
    // 【为什么这条检查不可能误杀】送给模型的**掩码后**正文里裸 `%` 恒为 0：注释被
    // xportProtectedSpan (2c) 整体收成占位符，字面百分号一律以 `\%` 的形式出现。
    // 所以交回来的正文里只要有一个裸 `%`，它就一定不是原文里的东西 —— 与
    // 「占位符少了一个」同一个性质，判失败进阶梯重问，绝不写进用户的 .tex。
    if (xportBareComments(t) > 0) return false;
    const seen = [];
    for (let i = 0; i < map.length; i++) seen.push(0);
    const re = /\[\[\s*(\d+)\s*\]\]/g;
    let m, total = 0;
    while ((m = re.exec(t))) {
        total++;
        const k = parseInt(m[1], 10);
        if (!(k >= 1 && k <= map.length)) return false;
        seen[k - 1]++;
    }
    if (total !== map.length) return false;
    for (let i = 0; i < map.length; i++) if (seen[i] !== 1) return false;
    return true;
}

// ============= 「一个哨兵都没有的整段回复」的守门员 =============
// 【它守的是哪条路】xportParseBlocks 里那条 `expectedCount === 1 且没有哨兵 → 整段当译文`
// 的宽容规则。它存在的理由是好的（模型忘了写 @@1@@ 不该让整段作废），但它**一点校验都没有**：
// 回复是什么就原样入库。而这条路正是逐行「重新生成这一句」按钮和恢复阶梯第 1 级走的路。
//
// 【实测（本轮离线复现，stub 模型）】三种回复原封不动地成了用户文档里的正文，
// failedCount=0、无 toast、无失败标记：
//   · "Sure! Here's the Chinese translation …:\n\n所提出的方案…\n\nLet me know if you'd like…"
//     → 连英文闲聊一起写进译文栏
//   · "I'm sorry, but I can't help with that request."  → 这句话本身成了译文
//   · "As an AI language model, I am unable to translate that text."  → 同上
// 占位符为 0 的段（纯散文，语料里最常见的一种）xportBlockOk 平凡通过，什么也拦不住。
//
// 【为什么是「否决」而不是「把闲聊剪掉」】多段批次那条路本来就是整批否决闲聊的
// （实测 expectedCount=2 时同样的回复返回 {} —— 单段路是唯一的缺口）。否决之后这一段
// 进恢复阶梯重问一次，比猜「哪几行才是译文」可靠得多；猜错就是把错的内容写进用户论文，
// 正是这次要根除的那一类。
//
// 【四条规则，每条都单独求高精度 —— 宁可漏判也不能误杀一句真译文】
//   R  拒绝语：只认**开头**的固定说法（I'm sorry / I can't / As an AI / 抱歉 / 作为语言模型…）。
//      句中出现 sorry 的正常句子（"The authors are sorry to report…"）不受影响。
//   L1 招呼语开场：Sure! / Certainly, … 学术句子不会这样开头。
//   L2 「这是……的翻译：」那一行：同一行里同时有 here is/below is 和 translat*，且后面还有正文。
//   T  收尾兜售：Let me know… / Hope this helps… / Feel free to… 作为**最后一行**。
// 单独用「首行以冒号结尾」之类的宽规则会误杀 "We consider two regimes:" 这种真句子，
// 所以四条规则都带了额外的锚点。
//
// 【本轮删掉的三条 —— 它们误杀的是真句子，代价是整篇翻译当场抛异常】
//   · `unfortunately\s*[,，]`：学术写作里 "Unfortunately, this bound is not tight." 是常见句式，
//     不是拒绝语。误杀之后单段文档三级阶梯全部否决同一个字符串，translateViaSentinel 抛
//     「请检查本地服务器与模型设置」—— 模型明明答对了，却把锅甩给用户的服务器，
//     而且是确定性的、重试多少次都一样。
//   · `of\s+course`：zh→en 方向译文合法地以 "Of course, the receiver…" 开头。
//   · 收尾兜售里的 `anything\s+else`：正文最后一行完全可能是
//     "…outperforms anything else reported to date."
// 判据从来只有一条：宁可漏判一句闲聊，也绝不误杀一句真译文 —— 漏判是脏一行，
// 误杀是整篇翻不出来。
// 四条规则写在函数体里（而不是模块级 const）是刻意的：测试用的抽取器只会按名字
// 把**函数**整体搬进沙箱，模块级正则常量得再单独列一遍、而它的 const 扫描器认不出
// 这几条正则字面量。放在体内，谁加载 xportSoloOk 就一定拿到完整的它。
function xportSoloOk(text) {
    const t = String(text == null ? '' : text).trim();
    if (t === '') return false;
    const refuse = /^\s*(?:i\s*(?:'|’)?\s*m\s+sorry|i\s+am\s+sorry|sorry\s*[,，.!]|i\s+apolog|i\s+(?:can(?:no|(?:'|’)?)t|cannot|won(?:'|’)?t|am\s+unable\s+to|am\s+not\s+able\s+to|must\s+decline)\b|as\s+an\s+ai\b|as\s+a\s+(?:large\s+)?language\s+model\b|抱歉|很抱歉|对不起|我(?:无法|不能)\s*(?:翻译|提供|帮|协助|完成|处理|回答|执行|满足|继续|生成|输出|给出|回应|参与)|作为(?:一个|一名)?\s*(?:ai|人工智能|语言模型))/i;
    const leadin = /^\s*(?:(?:sure|absolutely|okay|ok|alright|got\s+it|no\s+problem|great|understood)\b\s*[!,.:：—-]|certainly\b\s*[!:：])/i;
    const hereis = /^[^\n]*\b(?:here\s*(?:'|’)?s|here\s+is|here\s+are|below\s+is|below\s+are)\b[^\n]*\btranslat/i;
    const tail = /\n[^\n]*\b(?:let\s+me\s+know|hope\s+(?:this|that)\s+helps|feel\s+free\s+to|if\s+you\s*(?:'|’)?\s*(?:d|would)\s+like|would\s+you\s+like\s+me\s+to)\b[^\n]*$/i;
    if (refuse.test(t)) return false;
    if (leadin.test(t)) return false;
    // 「这是译文：」只有在**后面还有别的行**时才是前导废话；整段就这一行时它自己就是内容。
    if (t.indexOf('\n') !== -1 && hereis.test(t)) return false;
    if (tail.test(t)) return false;
    return true;
}

// 容忍：<think>（含未闭合）、markdown 围栏、首个哨兵之前的任何前导废话、重复编号（先到先得）。
// expectedCount === 1 且一个哨兵都没有时，把整段正文当作第 1 块 —— 这条专门堵
// 「模型忘了写 @@1@@ 就让整段作废」的旧行为（第 2 条）；xportSoloOk 是它唯一的守门员。
// truncated = 本次响应的 finish_reason 是 'length' / 'MAX_TOKENS'，即输出被 token 上限
// 砍断。它有两个用处：① 最后一块必然是半截的，直接作废让它走阶梯（否则「砍在最后一个
// [[k]] 之后」的半句话能通过全部完整性检查，被当成完整译文入库）；② 它是「块数少于段数」
// 的**证据**，有它就说明少的那几块在尾巴上，没有它就得整批否决（见下）。
function xportParseBlocks(raw, expectedCount, truncated) {
    // <think> 一律走全文件唯一那条规则（见 xportThinkCut）。整段都是推理时返回 {}，
    // 让恢复阶梯去跑 —— 绝不像改动前那样保留 <think> 之后的尾巴当译文。
    const thinkCut = xportThinkCut(raw, XPORT_THINK_ANCHOR);
    if (thinkCut.allReasoning) return {};
    let t = thinkCut.text;
    t = t.replace(/```[a-zA-Z]*[ \t]*\n?/g, '').replace(/```/g, '');
    const marks = [];
    const re = /@@\s*(\d+)\s*@@/g;
    let m;
    while ((m = re.exec(t))) marks.push({ n: parseInt(m[1], 10), start: m.index, end: re.lastIndex });
    const blocks = {};
    for (let i = 0; i < marks.length; i++) {
        const body = t.slice(marks[i].end, i + 1 < marks.length ? marks[i + 1].start : t.length).trim();
        if (!(marks[i].n in blocks)) blocks[marks[i].n] = body;
    }
    if (marks.length === 0 && expectedCount === 1 && t.trim() !== '' && xportSoloOk(t)) blocks[1] = t.trim();

    // ---- 编号归一 / 整批否决 ----
    // 【为什么必须有这一段】故障注入实测：模型把编号整体 +1（从 @@2@@ 开始）时，
    // 「按编号取 blocks[j+1]」会把**第 j 段的译文配到第 j+1 段**上。两段占位符个数
    // 恰好相同（最常见的情况是都为 0）时，完整性检查一个字都察觉不到 —— 这正是
    // 「静默损坏」，也是整个改动要根除的那一类。
    // 规则：
    //   · 恰好是 1..n            → 直接用（正常路径）
    //   · 是连续区间但不从 1 开始 → 整体平移归一（块与段仍然一一对应）
    //   · 编号有**明显缺口**（1,2,4,5…）→ 直接用（缺的那几段自己走阶梯）
    //   · 1..k 前缀且 k<n         → 歧义：可能是「尾部漏了」，也可能是「中间漏了一段之后
    //     整体重排号」。后者会让第 d 段之后的译文整体错位一行，而相邻两段占位符个数相同
    //     （最常见是都为 0）时 xportBlockOk 一个字都察觉不到 = 静默损坏。
    //     只有 truncated 能证明是前者；否则 **整批否决**。
    //   · 其余（超出 n / 乱码）→ **整批否决**，宁可全走阶梯也绝不按位置猜
    let result = blocks;
    const nums = Object.keys(blocks).map(Number).filter(x => isFinite(x)).sort((a, b) => a - b);
    if (nums.length > 0 && expectedCount > 0) {
        const exact = nums.length === expectedCount && nums[0] === 1 && nums[nums.length - 1] === expectedCount;
        if (!exact) {
            let consecutive = nums.length === expectedCount;
            for (let i = 1; consecutive && i < nums.length; i++) if (nums[i] !== nums[i - 1] + 1) consecutive = false;
            if (consecutive) {
                const shifted = {};
                for (let i = 0; i < nums.length; i++) shifted[i + 1] = blocks[nums[i]];
                result = shifted;
            } else if (nums[0] < 1 || nums[nums.length - 1] > expectedCount) return {};
            else if (!truncated && nums[nums.length - 1] === nums.length) return {};
        }
    }
    // 被截断时，编号最大的那一块是**半截**的：作废它，让那一段走恢复阶梯。
    if (truncated) {
        const ks = Object.keys(result).map(Number).filter(x => isFinite(x));
        if (ks.length) {
            let mx = ks[0];
            for (let i = 1; i < ks.length; i++) if (ks[i] > mx) mx = ks[i];
            delete result[mx];
        }
    }
    return result;
}

// 一段文本里所有「受保护区间」的 [start, end) 对，平铺成一个数组。
// 扫描规则与 xportMask 逐字一致（含「不透明表外的命令按命令名跳过」那条），
// 所以这里算出来的区间就是 xportMask 稍后一定会整体收走的那些片段。
// 【为什么必须有】xportSegments 先按句切、xportMask 后遮罩。equation 体里的一个句号
// （`\right].` 这类）会把 \begin{equation} 和 \end{equation} 切到两段去，
// xportProtectedSpan 第 (4) 条再也匹配不上，整个公式体就**裸着**送给模型 ——
// 而那一段一个占位符都没有，xportBlockOk 便什么都查不出来。这是「静默损坏」的
// 最后一个入口，堵法是：句末落在受保护区间内部时不许切。
function xportProtectedRanges(text) {
    const s = String(text == null ? '' : text);
    const n = s.length;
    const out = [];
    let budget = n * 6 + 20000;   // 与 xportMask 同样的硬性工作量上限
    let i = 0;
    while (i < n) {
        if (--budget < 0) break;
        const len = xportProtectedSpan(s, i);
        if (len > 0) { out.push(i, i + len); i += len; continue; }
        if (s[i] === '\\') {
            const cm = /^\\[a-zA-Z@]+\*?/.exec(s.slice(i, i + 40));
            i += cm ? cm[0].length : 2;   // 与 xportMask 一致：\$ \% 这类转义整体跳过
            continue;
        }
        i++;
    }
    return out;
}

// 位置 pos 落在任何一个受保护区间**内部**（两端不算）就不能在这里下刀
function xportCutAllowed(ranges, pos) {
    for (let r = 0; r < ranges.length; r += 2) {
        if (pos > ranges[r] && pos < ranges[r + 1]) return false;
    }
    return true;
}

// 文档级：\begin{数学环境} … \end{同名} 占的区间（配对方式与 xportProtectedSpan 第 (4)
// 条逐字一致，所以「切不开的地方」和「掩码要整体收走的地方」永远是同一批）。
// 【为什么段落切分也要它】amsmath 环境内部出现空行本来就是编译错误，所以环境里的空行
// 绝不是作者的分段意图。而现实里它天天出现：main.tex 里 `\textcolor{blue}{` 独占一行，
// 传输期剥离颜色宏之后**那一行就变成了空行**，equation 于是被空行切成两半，
// \begin 和 \end 落到不同段，掩码再也匹配不上，整段公式体裸着送给模型 —— 而它一个
// 占位符都没有，xportBlockOk 什么都查不出来。
function xportEnvRanges(text) {
    const s = String(text == null ? '' : text);
    const out = [];
    const re = /\\begin\{([A-Za-z]+\*?)\}/g;
    let m, guard = 0;
    while ((m = re.exec(s)) && ++guard < 20000) {
        if (XPORT_MATH_ENVS.indexOf(m[1].replace(/\*$/, '')) === -1) continue;
        const endTok = '\\end{' + m[1] + '}';
        const e = s.indexOf(endTok, re.lastIndex);
        if (e === -1) continue;                 // 没配对：当普通正文放过，绝不吞掉后面整篇
        out.push(m.index, e + endTok.length);
        re.lastIndex = e + endTok.length;       // 跳过内层环境，顺带把扫描成本压成线性
    }
    return out;
}

// 分段：段落（空行）→ 句子（复用 HEAD 那套受保护掩码 + 缩写词表的句末识别）。
// **按句**而不是按段，是第 8 条要求：逐句编辑 / 逐句重生成 / 同义词弹窗 / 跨栏高亮
// 的精度全部建立在「一行 = 一句」上，退化到段会把它们一起拖下水。
function xportSegments(text) {
    return xportSegmentsEx(text).segs;
}

// 与 xportSegments 同一次切分，外加**段落结构**：breaks[i] === true 表示第 i 段是它所在
// 那个 LaTeX 段落的最后一句，也就是它和第 i+1 句之间原文里隔着一个空行。
//
// 【为什么必须把这个信息带出来】复制按钮和「回到大输入框」都要把逐句的行重新拼成一整篇。
// 用单个 '\n' 拼，LaTeX 里所有分段全部消失：整节正文被并成一大坨连续散文。LaTeX 不报错，
// 只有编出 PDF 才看得见 —— 实测 main.tex 370 个空行拼回来只剩 4 个（那 4 个还是数学环境
// 内部的）。段落结构不需要猜：切分本来就是「先按空行分段、再按句号分句」，
// 谁是某一段的最后一句在切分当场就知道，这里只是把它记下来传出去。
function xportSegmentsEx(text) {
    const src = String(text == null ? '' : text);
    const out = [];
    const breaks = [];
    // 段落 = 空行分隔，但**落在数学环境内部的空行不算**（见 xportEnvRanges）。
    // envs 为空时这段逐字等价于原来的 src.split(/\n[ \t]*\n+/)。
    const envs = xportEnvRanges(src);
    const paras = [];
    const psplit = /\n[ \t]*\n+/g;
    let pLast = 0, pm;
    while ((pm = psplit.exec(src))) {
        if (!xportCutAllowed(envs, pm.index)) continue;
        paras.push(src.slice(pLast, pm.index));
        pLast = psplit.lastIndex;
    }
    paras.push(src.slice(pLast));
    for (let p = 0; p < paras.length; p++) {
        const para = paras[p];
        if (!para.trim()) continue;
        const madeBefore = out.length;
        let ends;
        try { ends = findSentenceBoundaries(para); } catch (e) { ends = []; }
        const ranges = xportProtectedRanges(para);
        if (ranges.length) ends = ends.filter(e => xportCutAllowed(ranges, e));
        let from = 0;
        for (let k = 0; k <= ends.length; k++) {
            const to = (k < ends.length) ? ends[k] : para.length;
            if (to <= from) continue;
            const piece = para.slice(from, to).trim();
            from = to;
            if (!piece) continue;
            if (piece.length <= XPORT_SEG_SOFT_MAX) { out.push(piece); continue; }
            // 单句就超长（整块 equation / 没有句号的表格）：按空行以外的换行再兜一刀。
            // 这一刀同样不许落进受保护区间里面 —— 否则超长公式又会被从中间劈开。
            const pranges = xportProtectedRanges(piece);
            const lines = piece.split('\n');
            let buf = '';
            let off = 0;                       // buf 在 piece 里的起点
            for (let li = 0; li < lines.length; li++) {
                const cand = buf ? (buf + '\n' + lines[li]) : lines[li];
                const cut = off + buf.length;  // 这一刀落在 piece 的哪个下标
                if (cand.length > XPORT_SEG_SOFT_MAX && buf && xportCutAllowed(pranges, cut)) {
                    out.push(buf); off = cut + 1; buf = lines[li];
                }
                else buf = cand;
            }
            if (buf.trim()) out.push(buf);
        }
        // 这一段确实产出了句子：它的**最后一句**后面原文里隔着一个空行。
        if (out.length > madeBefore) breaks[out.length - 1] = true;
    }
    for (let i = 0; i < out.length; i++) if (breaks[i] !== true) breaks[i] = false;
    // 最后一句后面没有「下一段」，标不标都一样；置 false 免得调用方在末尾多拼一个空行。
    if (out.length > 0) breaks[out.length - 1] = false;
    return { segs: out, breaks: breaks };
}

// 失败段的「再切一刀」：先按句，句只有一条就按换行，再不行按空格找中点。
// 目的**不是**切得漂亮，而是让下一次请求的占位符密度和边界都与失败那次不同。
function xportSplitSegment(seg) {
    const s = String(seg == null ? '' : seg);
    let parts = xportSegments(s);
    if (parts.length > 1) return parts;
    // 兜底的「硬切一刀」：刀口一律不许落进受保护区间。从中间切开一条 equation 等于把
    // 整段数学裸着送出去，而切出来的两半一个占位符都没有，xportBlockOk 看不见任何异常。
    // 找不到合法刀口就干脆不切，让阶梯直接走到第 3 级（旧协议），最差也只是回到改动前。
    const ranges = xportProtectedRanges(s);
    const nls = [];
    for (let i = s.indexOf('\n'); i !== -1; i = s.indexOf('\n', i + 1)) if (xportCutAllowed(ranges, i)) nls.push(i);
    if (nls.length > 0) {
        const at = nls[Math.floor(nls.length / 2)];
        const a = s.slice(0, at).trim(), b = s.slice(at + 1).trim();
        if (a && b) return [a, b];
    }
    const half = Math.floor(s.length / 2);
    let cut = s.indexOf(' ', half);
    if (cut === -1 || cut >= s.length - 1) cut = s.lastIndexOf(' ', half);
    if (cut > 0 && cut < s.length - 1 && xportCutAllowed(ranges, cut)) return [s.slice(0, cut).trim(), s.slice(cut + 1).trim()];
    return [s];
}

// provider 保留在签名里（调用方都在传），但已经不再影响提示词内容 —— 见下方注释。
function xportSystemPrompt(srcName, tgtName, provider) {
    // 【删掉了什么，为什么】这里曾经给 local 加过 `/no_think\n` 前缀。**实测是空操作**：
    // enable_thinking、chat_template_kwargs.{enable_thinking,thinking}、/think、/no_think
    // 在这版 LM Studio 上全部被静默忽略（6 组对照请求字节一致，reasoning_tokens 恒为 0）；
    // 唯一真正起作用的参数是 reasoning_effort。留着它除了白花 3–4 个提示词 token，
    // 更糟的是让人以为有一层根本不存在的保护 —— 这个文件里的**虚假安全感本身就是缺陷**。
    // 真正的办法是察觉推理开着并告诉用户，见 xportNoteThinking / xportThinkingBanner。
    return `You are a professional academic translator. Translate ${srcName} into ${tgtName}.

The user message contains numbered segments. Each segment starts with a line @@n@@.
Tokens like [[1]] and [[2]] are protected placeholders standing for formulas,
citations and cross-references.

Rules:
1. Reply with the SAME numbered blocks: a line @@n@@, then the ${tgtName} translation
   of that segment. Nothing else.
2. Do NOT repeat the source text.
3. Keep every [[k]] token exactly as it is, in the place it belongs in the sentence.
   Never delete, translate, renumber, zero-pad or duplicate a placeholder.
4. Copy any remaining LaTeX command verbatim.
5. Do not merge, split, reorder or skip segments. No commentary, no code fences.`;
}

// LM Studio 报的**加载期**上下文（不是配置上限）。拿不到就返回 0，调用方回落默认值。
// 上下文是运行期参数、LM Studio 重启会回落 4096 —— 所以必须现问，不能写死。
const xportCtxCache = new Map();
async function xportLocalContext(baseUrl, model) {
    const key = String(baseUrl) + '|' + String(model);
    const hit = xportCtxCache.get(key);
    if (hit && Date.now() - hit.at < 60000) return hit.ctx;
    let ctx = 0;
    try {
        const url = String(baseUrl).replace(/\/$/, '') + '/api/v0/models';
        const resp = await fetchWithTimeout(url, {}, 4000);
        if (resp.ok) {
            const data = await resp.json();
            const list = (data && Array.isArray(data.data)) ? data.data : [];
            for (let i = 0; i < list.length; i++) {
                if (list[i] && list[i].id === model) {
                    ctx = Number(list[i].loaded_context_length) || 0;
                    break;
                }
            }
        }
    } catch (e) { ctx = 0; }
    xportCtxCache.set(key, { ctx: ctx, at: Date.now() });
    return ctx;
}

// ============= B1：按模型发现「这个模型能调什么」 =============
// 【先读完这一段再动手，否则会写出一个会撒谎的 UI】
//
// 结论一句话：**发现可行，行为探测不可行**。
//
// 1) 唯一有用的路由是 `GET <origin>/api/v1/models`（注意是 v1，**不是** v0）。
//    它按模型给出 capabilities.reasoning.{allowed_options, default}，而且 GET 响应自带
//    `Access-Control-Allow-Origin: *`，浏览器直接 fetch 就行，不需要任何代理。
//    同命名空间下另外 12 个候选路由（/api/v1、/api/v1/models/{id}、/api/v1/capabilities…）
//    全部 404；/api/v0/models 只有 loaded_context_length，没有任何调参元数据。
//    实测三个模型：3.8-27b → ["off","low","medium","xhigh","on"] 默认 "xhigh"；
//    3.6-35b-a3b 与 3-1.7b → ["off","on"] 默认 "on"。
//
// 2) **行为探测是死路**。LM Studio 对未知参数一律 HTTP 200 静默丢弃（6 个不同的假参数
//    与基准响应字节一致），所以「发过去看它报不报错」什么也问不出来。
//
// 3) 唯一被校验的参数 `reasoning_effort` 是按**固定全局枚举**校验的，不看模型：
//    `"off"` 在 allowed_options 里含 off 的 3.8 上照样 400；反过来 low/medium/high/xhigh
//    在只支持 on/off 的 3.6 上全部 200 且输出字节一致（服务端日志逐字写着
//    「Reasoning setting 'low' is not supported by model 'qwen/qwen3.6-35b-a3b'.
//     Supported settings: 'on', 'off'. Falling back to reasoning setting 'on'.」）。
//    ⇒ **HTTP 的拒绝面携带零per-model信息**，/api/v1/models 是唯一事实源。
//
// 【形状陷阱，三个，全部实测】顶层键是 `models`（不是 data）；模型 id 键是 `key`（不是 id）；
// 非 LLM 条目（embedding）**整个 capabilities 键都不存在**。任何一处写错都会静默半工作。
//
// 【什么**不该**有控件 —— 这是对用户提问的诚实回答的一半】
//   · Preserve Thinking：实测**按请求不可设**（preserve_thinking 与
//     chat_template_kwargs.preserve_thinking 都被静默忽略，多轮对照 prompt_tokens 完全相同），
//     它只存在于磁盘上的 model.yaml。画一个假装能设它的开关就是撒谎。
//   · Context length：实测**只在加载期生效**（发 context_length/num_ctx/n_ctx 返回 200 但
//     /api/v0/models 与 lms ps 的值纹丝不动）。所以这里只**只读展示**，不给滑块。
//     loaded_instances[].config 里的其余项（flash_attention/parallel/speculative_*…）同理。
const XPORT_CAPS_TTL = 60000;           // 与 xportLocalContext 的 60 秒缓存纪律完全一致
const xportCapsCache = new Map();       // origin -> { at, ok, byKey }
const xportCapsInFlight = new Map();    // origin -> Promise（同一 origin 并发只发一次）

// baseUrl 一律先归一成 **ORIGIN**。用户在「API」页把地址写成 http://host:1235/v1 是常见写法，
// 直接拼就变成 /v1/api/v1/models —— 404，而且错得像「这台机器没这个端点」。
function xportCapsOrigin(baseUrl) {
    return String(baseUrl == null ? '' : baseUrl).trim().replace(/\/+$/, '').replace(/\/v1$/, '');
}

// 把 /api/v1/models 的一条记录压成本文件内部的规范形状。逐字段防御，绝不抛。
function xportNormalizeCaps(m) {
    const src = (m && typeof m === 'object') ? m : {};
    const c = (src.capabilities && typeof src.capabilities === 'object') ? src.capabilities : null;
    const r = (c && c.reasoning && typeof c.reasoning === 'object') ? c.reasoning : null;
    const inst = Array.isArray(src.loaded_instances) ? src.loaded_instances : [];
    const cfg = (inst[0] && inst[0].config && typeof inst[0].config === 'object') ? inst[0].config : null;
    return {
        key: String(src.key == null ? '' : src.key),
        displayName: String(src.display_name || src.key || ''),
        type: String(src.type || ''),
        arch: String(src.architecture || ''),
        quant: String((src.quantization && src.quantization.name) || ''),
        params: String(src.params_string || ''),
        vision: !!(c && c.vision),
        tools: !!(c && c.trained_for_tool_use),
        ctx: Number(cfg && cfg.context_length) || 0,
        maxCtx: Number(src.max_context_length) || 0,
        loaded: inst.length > 0,
        // capabilities 缺失 ⇒ reasoning 恒为 null ⇒ 上层**隐藏控件**，绝不猜。
        // （embedding 条目就是这个形状；一个没加载的 LLM 是否也这样没实测过 —— 见 spec P5，
        //   刻意不去卸载别人正在用的模型来验证，而是把「不知道」设计成一个安全状态。）
        reasoning: r ? {
            allowed: (Array.isArray(r.allowed_options) ? r.allowed_options : []).map(String),
            uiDefault: r.default == null ? '' : String(r.default)
        } : null
    };
}

// 整份表按 origin 缓存 60 秒：一次 GET 就够所有本地模型用，开两次设置弹窗也只发一个请求。
async function xportFetchCaps(baseUrl) {
    const origin = xportCapsOrigin(baseUrl);
    const hit = xportCapsCache.get(origin);
    if (hit && Date.now() - hit.at < XPORT_CAPS_TTL) return hit.byKey;
    const flying = xportCapsInFlight.get(origin);
    if (flying) return flying;
    const p = (async function () {
        const byKey = {};
        let ok = false;
        try {
            const resp = await fetchWithTimeout(origin + '/api/v1/models', {}, 4000);
            if (resp && resp.ok) {
                const data = await resp.json();
                const list = (data && Array.isArray(data.models)) ? data.models : [];
                for (let i = 0; i < list.length; i++) {
                    const one = xportNormalizeCaps(list[i]);
                    if (one.key) byKey[one.key] = one;
                }
                ok = true;
            }
        } catch (e) { ok = false; }
        xportCapsCache.set(origin, { at: Date.now(), ok: ok, byKey: byKey });
        xportCapsInFlight.delete(origin);
        return byKey;
    })();
    xportCapsInFlight.set(origin, p);
    return p;
}

// 异步问一个模型的能力。拿不到一律返回 null —— **不猜**。
async function xportModelCaps(baseUrl, model) {
    try {
        const byKey = await xportFetchCaps(baseUrl);
        return (byKey && byKey[String(model)]) || null;
    } catch (e) { return null; }
}

// 渲染路径专用的**同步**读法：只看缓存，绝不发请求、绝不抛。
//   undefined = 还没问过（该画「读取中」）
//   null      = 问过了但这个 id 不在表里（该隐藏控件）
function xportCapsPeek(baseUrl, model) {
    try {
        const hit = xportCapsCache.get(xportCapsOrigin(baseUrl));
        if (!hit) return undefined;
        return hit.byKey[String(model)] || null;
    } catch (e) { return undefined; }
}
// 那一次整份 GET 成功了吗？undefined = 还没问过。用来把「服务器不可达」和
// 「服务器答了但没这个模型」两种 null 分开说 —— 它们的补救办法完全不同。
function xportCapsOk(baseUrl) {
    try {
        const hit = xportCapsCache.get(xportCapsOrigin(baseUrl));
        return hit ? !!hit.ok : undefined;
    } catch (e) { return undefined; }
}

// ============= B1/B2：UI 词表 → 线上词表。**这层映射是强制的** =============
// 发现词表 ≠ 请求词表，这不是风格问题，是实测：
//   · 'off' 直接发出去是 **HTTP 400**（两个模型上都是），必须发 'none'；
//   · 二值模型上任何非 'none' 的值都塌缩成「开」，所以 'on' 发 'medium' 即可；
//   · **永远不要发 'high'**（连 3.8 都不支持，会回落 'on' 然后整个字段被跳过）；
//   · **永远不要发 'minimal'**（服务端会 WARN 着把它映射成 'low'）；
//   · **永远显式发**：省略 reasoning_effort **等于关闭推理**，哪怕
//     capabilities.reasoning.default 写着 "xhigh"（3.8 实测：省略 = 0 推理 token，
//     与显式 "none" 逐字相同）。所以 default 是 **model.yaml 的界面默认值，不是 API 默认值**，
//     照它显示却不发出去，UI 就在撒谎。
//   · allowed_options 里出现映射表里没有的值 ⇒ **从下拉里丢掉**，绝不发出去。
const XPORT_EFFORT_WIRE = {
    off:    'none',
    on:     'medium',
    low:    'low',
    medium: 'medium',
    xhigh:  'xhigh'
};
const XPORT_EFFORT_LABEL = { off: '关', on: '开', low: '低', medium: '中', xhigh: '极高' };

// 控件形态只能从 allowed_options **反推** —— model.yaml 里的 type（boolean/select）
// 在 HTTP 投影里丢失了，这是端点的信息损失，不是这里偷懒。
function xportReasoningControl(allowed) {
    if (!allowed || !allowed.length) return { kind: 'none' };
    const levels = [];
    let canOff = false;
    for (let i = 0; i < allowed.length; i++) {
        const v = String(allowed[i]);
        if (v === 'off') { canOff = true; continue; }
        if (v === 'on') continue;
        if (!Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v)) continue; // 映射不了的一律丢弃
        if (levels.indexOf(v) === -1) levels.push(v);
    }
    if (!levels.length) return { kind: 'toggle', canOff: canOff };   // 3.6 / 1.7b
    return { kind: 'select', levels: levels, canOff: canOff };       // 3.8 → low/medium/xhigh
}

// ============= 规范化的参数模型（给以后的 Gemini/OpenAI/Claude 留座位）=============
// 发现负责「有哪些选项」，这张表负责「叫什么、怎么发、发给谁」—— HTTP 投影把
// displayName/description/option label/type 全丢了，只能由这里补。表刻意很小：
// **2 个概念，不是每模型一份**，因为真正能按请求设的东西就这么多。
// scope='load-time' 的项**只读渲染、永不发送**。
const XPORT_PARAM_SPECS = [
    {
        id: 'reasoning',
        label: '推理',
        // 【这段文案改过一次，别再写回原样】原文是「慢 6.05 倍（每段中位 104s vs 12.6s）」。
        // 三处都站不住：① 104.1/12.6 = 8.26，和 6.05 对不上 —— 两个数来自**两次不同的实验**
        // （中位耗时来自 thinking-json §4.4，6.05 倍是 benchmark §6.2 的配对墙钟比），拼在
        // 一句话里就成了假的；② 那两个绝对值所在的表自己写着「全部被另一路工作负载的
        // ~7.7 req/min 抬高了，只有**比值**有意义」，UI 却把它们当「实测每段中位」发布；
        // ③ 用现在这条哨兵链路复测（qwen3.6，main.tex 8000 字符，29 段），比值是 10.6 倍，
        // 绝对值差了近 20 倍。所以这里只保留三次独立测量都支持的**比值区间**，绝对值一律删掉。
        desc: '让模型先想再答。翻译场景三次独立实测都指向同一个结论：qwen3.6 开启后整体耗时是关闭时的 6–10 倍、每源字符的往返 token 约 5.8 倍、旧 JSON 链路的硬失败率从 16.7% 涨到 33.3%，而盲评 6 段里有 5 段看不出质量差别。默认关。',
        kind: 'select|toggle',            // 由 xportReasoningControl(allowed) 按模型现算
        scope: 'per-request',
        providers: ['local'],             // 已接线的 provider
        wire: {
            local: { param: 'reasoning_effort', map: XPORT_EFFORT_WIRE }
        },
        discover: { local: 'capabilities.reasoning.allowed_options' },
        optionLabels: XPORT_EFFORT_LABEL,
        default: 'off',
        // ↓ 未接线，仅记录已实测/已查证的形状，以后接进来不用重写这套结构：
        //   gemini: generationConfig.thinkingConfig.thinkingBudget
        //           ∈ {0=关, -1=动态} ∪ [512, 24576]（实测；1–511 全部 400），
        //           能力位来自 models.get 的 `thinking: true`，flash-lite 默认**关**；
        //           推理以 parts[] 里 thought:true 的条目返回（A2 已过滤，勿读 parts[0]）。
        //   claude: GET /v1/models/{id} 返回真正的 capabilities 树，
        //           档位在 output_config.effort。**本轮只记录，不调用、不碰 Claude 链路。**
        futureProviders: ['gemini', 'claude']
    },
    {
        id: 'contextLength',
        label: '上下文',
        desc: '在 LM Studio 加载模型时设定，HTTP 改不了（实测发 context_length/num_ctx/n_ctx 返回 200 但实际值不变）。这里只读展示。',
        kind: 'readonly',
        scope: 'load-time',
        providers: ['local'],
        wire: {},
        discover: { local: 'loaded_instances[0].config.context_length' },
        default: 0
    }
];

// ============= B2：每模型一个推理档位，持久化 =============
const XPORT_REASONING_LS_KEY = 'reasoningByModel';
const XPORT_REASONING_DEFAULT = 'off';   // 翻译默认关：见 XPORT_PARAM_SPECS.reasoning.desc 的实测数字

// 用户存的原始 UI 值（脏值一律回落 'off'）。
function xportReasoningRaw(model) {
    try {
        const box = AppState.reasoningByModel;
        const v = (box && typeof box === 'object') ? box[String(model)] : null;
        return (typeof v === 'string' && Object.prototype.hasOwnProperty.call(XPORT_EFFORT_WIRE, v))
            ? v : XPORT_REASONING_DEFAULT;
    } catch (e) { return XPORT_REASONING_DEFAULT; }
}

// 夹到这个模型**真正支持**的档位上。发现数据拿不到就原样返回（默认 'off' 与省略等价，安全）。
// 【为什么把 raw 提成参数】翻译和对话各有一套「每模型档位」（AppState.reasoningByModel /
// ChatState.reasoningByModel），但「这个模型到底支持哪些档位」只有一份事实。
// 两边共用这一个夹取器，就不可能出现「对话那条路允许了一个模型其实不支持的档位」。
function xportClampReasoning(baseUrl, model, raw) {
    // 400 闩已经合上：这个 origin 不认 reasoning_effort，callLocalLLM 之后一个字节都不再发。
    // 而实测「省略 = 不推理」，所以这个模型的**实际**档位就是「关」。这里必须跟着收敛到
    // 'off'，否则设置行会一直亮着「开」而线上什么都没带 —— 屏幕上写的和实际发生的不是
    // 一回事，正是这次要根除的那一类问题。显示、线值、探针都读这个函数，改这一处就够了。
    try { if (xportEffortUnsupported.has(xportCapsOrigin(baseUrl))) return 'off'; } catch (e) {}
    try {
        const caps = xportCapsPeek(baseUrl, model);
        if (!caps || !caps.reasoning) return raw;
        const ctl = xportReasoningControl(caps.reasoning.allowed);
        if (ctl.kind === 'toggle') return raw === 'off' ? 'off' : 'on';
        if (ctl.kind === 'select') {
            if (raw === 'off') return 'off';
            if (ctl.levels.indexOf(raw) !== -1) return raw;
            return ctl.levels.indexOf('medium') !== -1 ? 'medium' : ctl.levels[0];
        }
        return 'off';
    } catch (e) { return raw; }
}

// 翻译链路的档位：读 AppState.reasoningByModel，再走同一个夹取器。
function xportReasoningValue(baseUrl, model) {
    return xportClampReasoning(baseUrl, model, xportReasoningRaw(model));
}

// 真正写进请求体的值。永远返回一个合法字符串，永远不抛。
function xportWireEffort(baseUrl, model) {
    try {
        const ui = xportReasoningValue(baseUrl, model);
        return XPORT_EFFORT_WIRE[ui] || 'none';
    } catch (e) { return 'none'; }
}

// 某些第三方 OpenAI 兼容端可能压根不认 reasoning_effort。callLocalLLM 只要吃到一次
// 「400 且错误信息里点名 reasoning_effort」，就把这个 origin 记进来，之后不再发这个字段。
// 一次性闩，只在会话内有效；宁可少一个可选参数，也不能让整条翻译链路挂掉。
const xportEffortUnsupported = new Set();

// ============= A3：推理模式的探测与告知 =============
// 【先读这一段，否则会写出错的修法】客户端**没有**关掉推理的开关。实测：enable_thinking、
// chat_template_kwargs.{enable_thinking,thinking}、`/think`、`/no_think` 在这版 LM Studio 上
// 一律被静默忽略（reasoning_tokens 恒为 0，6 组对照请求与基准字节一致）；唯一起作用的
// 是 reasoning_effort。所以这里能做、也只能做的是：**察觉它开着，并把关掉它的办法说出来**。
//
// 【为什么值得做 —— 实测根因，且它不是 <think> 标签】推理开着时，Qwen 会先在**推理里**
// 把 JSON 草稿写成 LaTeX 散文（单反斜杠），再把那份草稿原样抄进正文。同模型同提示词，
// 用 `<think>\n` 预填做对照：关闭时输出 `\\ref{fig:arch}` / `32\\%`（能解析，175 token），
// 开启时输出 `\ref{fig:arch}` / `32\%`（Bad escaped character）。48 次响应里
// 「出现非法转义」与「硬失败」6/6 完全相关（6/6 失败、42/42 通过）。
// qwen3.6-35b 的 JSON 硬失败率因此从 16.7% 涨到 33.3%，翻译耗时是 6–9 倍。
//
// 【补救办法写两条，不是啰嗦】UI 上的 Enable Thinking 开关与 reasoning_effort 是否等价，
// 这一轮**没有实测过**（探针 P1）。两条都写，在任一结论下都是对的，代价只有一个从句。
const xportThinkState = { model: '', on: false, at: 0, dismissed: {} };
function xportThinkingMessage(model) {
    return '检测到「' + String(model || '当前模型') + '」开启了推理模式。该模式会让模型把 LaTeX 反斜杠'
        + '写成单反斜杠，导致「无法解析 JSON 响应」，并使翻译耗时变成关闭时的 6–10 倍'
        + '（三次独立实测：配对墙钟 6.05 倍、12 段合计 9.2 倍、本哨兵链路 8000 字符 10.6 倍）。'
        + '请到「设置 → 模型」把该模型的「推理」设为「关」；如果那里已经是关，'
        + '说明是 LM Studio 端把它打开的，请在 LM Studio 里关闭该模型的 Enable Thinking。';
}
// 记一次观测。on=true 且这个模型还没被用户关掉横幅时，把横幅弹出来。
// 【绝不进渲染路径】renderApp 没有 try/catch，一次抛异常就把页面永久冻在旧帧上。
// 所以横幅是挂在 document.body 上的独立节点，renderApp 一行都不碰它。
function xportNoteThinking(model, on, requested) {
    try {
        const id = String(model || '');
        xportThinkState.model = id;
        xportThinkState.at = Date.now();
        xportThinkState.on = !!on;
        // B2：用户自己在「设置 → 模型」里给这个模型开了推理，那推理开着就是**预期行为**，
        // 再弹一个「快去关掉它」的警告就是在对用户撒谎。只有「没人要求它却在推理」才是异常。
        // 拿不到设置（例如测试沙箱里没有这个函数）时按 false 处理，行为与本行加入前逐字一致。
        // requested（可选）= 「这一次请求到底有没有要求推理」。对话窗有自己一套档位
        //（ChatState.reasoningByModel），它开着推理时翻译那边可能仍然是「关」——
        // 那时去读翻译的设置会得出 selfEnabled=false，于是弹一条「没人要求它却在推理」的
        // 假警报。所以调用方能给出这一次的实际值时一律以它为准；不给才回落读设置
        //（翻译链路给的值恒等于 xportWireEffort，行为逐字不变）。
        let selfEnabled = false;
        if (typeof requested === 'boolean') selfEnabled = requested;
        else try { selfEnabled = xportWireEffort(AppState.localBaseUrl, id) !== 'none'; } catch (e2) { selfEnabled = false; }
        xportThinkState.selfEnabled = selfEnabled;
        if (on && !selfEnabled) xportThinkingBanner(id); else xportThinkingBannerHide();
    } catch (e) {}
}
function xportThinkingBannerHide() {
    try {
        if (typeof document === 'undefined') return;
        const el = document.getElementById('xport-thinking-banner');
        if (el && el.parentNode) el.parentNode.removeChild(el);
    } catch (e) {}
}
function dismissThinkingBanner() {
    try { xportThinkState.dismissed[xportThinkState.model] = true; } catch (e) {}
    xportThinkingBannerHide();
}
function xportThinkingBanner(model) {
    try {
        if (typeof document === 'undefined' || !document.body) return;
        // 【必须先摘掉旧横幅再 return】这一行原来是裸 return：为模型 A 关掉横幅之后，
        // 屏幕上那块仍然写着**模型 B** 的名字的横幅就被原样留下了 —— 而横幅正文是一条
        // 点名道姓的操作指令（「把该模型的推理设为关」），指错了模型就是在骗用户。
        // 请求是异步的，飞行中的请求带着发起时的 config，所以「横幅上的模型 ≠ 当前选中的
        // 模型」不需要任何控制台操作就能发生。
        if (xportThinkState.dismissed[String(model || '')]) { xportThinkingBannerHide(); return; }
        let el = document.getElementById('xport-thinking-banner');
        if (!el) {
            el = document.createElement('div');
            el.id = 'xport-thinking-banner';
            el.setAttribute('style', 'position:fixed;left:50%;top:14px;transform:translateX(-50%);'
                + 'z-index:99999;max-width:min(760px,92vw);padding:12px 40px 12px 14px;border-radius:14px;'
                + 'background:#fff7ed;color:#7c2d12;border:1px solid #fdba74;'
                + 'box-shadow:0 14px 34px -14px rgba(15,23,42,.5);'
                + "font-family:'Inter',sans-serif;font-size:12px;line-height:1.65;");
            document.body.appendChild(el);
        }
        el.innerHTML = '<span style="font-weight:700;">⚠️ 推理模式已开启</span><br>'
            + escapeHtml(xportThinkingMessage(model))
            + '<button onclick="dismissThinkingBanner()" title="知道了"'
            + ' style="position:absolute;top:8px;right:10px;border:none;background:transparent;'
            + 'color:#9a3412;font-size:16px;line-height:1;cursor:pointer;padding:2px 4px;">×</button>';
    } catch (e) {}
}
// 显式探针：一次 24-token 的 "hi"，问「这个模型在**我们实际发送的档位下**推理吗」。
// 缓存纪律与 xportLocalContext 完全一致（60 秒）。任何失败都当「不知道」处理，绝不报错。
//
// 【B2 改了什么，为什么必须改】原来这个探针刻意**不带** reasoning_effort。B2 落地后
// 真实请求每次都显式带档位，而实测「省略 = 关闭」—— 探针再省略，量的就是一个本应用
// 根本不会使用的配置，结论恒为「不推理」，等于把探针变成一句空话。现在探针发的档位与
// 真实请求逐字相同：设为「关」时它验证的是「显式 none 之后是否仍在推理」（那才是真异常），
// 设为其它档位时它验证的是这个档位是否真的生效。缓存键因此必须带上档位，否则改完设置
// 会读到 60 秒前另一个档位的结论。
const xportThinkProbeCache = new Map();
async function xportProbeThinking(baseUrl, model) {
    let effort = 'none';
    try { effort = xportWireEffort(baseUrl, model); } catch (e) { effort = 'none'; }
    const key = String(baseUrl) + '|' + String(model) + '|' + effort;
    const hit = xportThinkProbeCache.get(key);
    if (hit && Date.now() - hit.at < 60000) return hit.on;
    let on = false;
    try {
        const url = String(baseUrl).replace(/\/$/, '') + '/v1/chat/completions';
        const probeBody = { model: model, messages: [{ role: 'user', content: 'hi' }], max_tokens: 24, temperature: 0 };
        if (effort && !xportEffortUnsupported.has(xportCapsOrigin(baseUrl))) probeBody.reasoning_effort = effort;
        const resp = await fetchWithTimeout(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(probeBody)
        }, 15000);
        if (resp.ok) {
            const data = await resp.json();
            on = readLocalChoice(data).thinking;
        }
    } catch (e) { on = false; }
    xportThinkProbeCache.set(key, { on: on, at: Date.now() });
    xportNoteThinking(model, on);
    return on;
}

// ============= A7：公式存活审计 =============
// 【为什么需要它】两份研究里最坏的一次事故是**完全静默**的：qwen3.6 把一整块 635 字符的
// `\begin{equation}\begin{aligned}` 奖励函数定义整个跳过了，返回的 JSON 合法、15 段结构
// 完整、没有任何报错、原文回显覆盖率 0.82。xportBlockOk 看不见它 —— 那一段一个占位符
// 都没有，所有完整性检查都**平凡通过**。合计：3.6 在旧路径上丢了 2/14 个公式（14.3%），
// 3.8 是 0/14。数量对比是唯一能抓住这一类「JSON 合法、分段完整、内容却没了」的手段。
// 契约：**只报警，绝不让翻译失败** —— 「只要有一段成功就绝不抛异常」的约定必须守住。
const XPORT_AUDIT_ENVS = ['equation', 'align', 'aligned', 'gather', 'multline',
    'eqnarray', 'flalign', 'alignat', 'IEEEeqnarray', 'split', 'cases', 'dcases'];
function xportCountEnvs(text) {
    const s = String(text == null ? '' : text);
    let n = 0;
    try {
        const re = new RegExp('\\\\begin\\{(?:' + XPORT_AUDIT_ENVS.join('|') + ')\\*?\\}', 'g');
        let guard = 0;
        while (re.exec(s) && ++guard < 20000) n++;
    } catch (e) { return 0; }
    return n;
}
// 返回 { envIn, envOut, lost, rows }。rows = 该行源文里的公式环境比译文多（0 基下标）。
function xportEquationAudit(srcText, translations) {
    const res = { envIn: 0, envOut: 0, lost: 0, rows: [] };
    try {
        const list = Array.isArray(translations) ? translations : [];
        res.envIn = xportCountEnvs(srcText);
        for (let i = 0; i < list.length; i++) {
            const pair = list[i] || {};
            const a = xportCountEnvs(typeof pair.src === 'string' ? pair.src : '');
            const b = xportCountEnvs(typeof pair.tgt === 'string' ? pair.tgt : '');
            res.envOut += b;
            if (a > b) res.rows.push(i);
        }
        // 【为什么不是单纯的进出差额】差额是**全文级**的，会被互相抵消：一行把 equation
        // 抄了两遍、另一行把 align 整块吞掉时 envIn=envOut=2、差额 0，而 rows 早就知道
        // 第 2 行丢了东西 —— 旧写法在这里一声不吭。逐行丢失才是用户要点 ↻ 重试的单位，
        // 所以取两者的较大值：一行丢两个时差额更大，抵消发生时行数更大，都不会漏报。
        res.lost = Math.max(res.envIn - res.envOut, res.rows.length, 0);
    } catch (e) { return { envIn: 0, envOut: 0, lost: 0, rows: [] }; }
    return res;
}
// 翻译落地后的统一告警口：把「N 段失败」和「N 处公式消失」合并成**一条** toast。
// 分成两次 showToast 会让第二条把第一条顶掉（showToast 走 setState 全量重渲染）。
// 返回 audit 结果，方便调用方记账。
function xportReportAfterTranslate(srcText, translations, failedCount) {
    const audit = xportEquationAudit(srcText, translations);
    try {
        const notes = [];
        if (Number(failedCount) > 0) notes.push(failedCount + ' 段未能翻译，已在对应行标出，可单独点 ↻ 重试');
        if (audit.lost > 0) {
            const where = audit.rows.length
                ? '（第 ' + audit.rows.slice(0, 8).map(function (i) { return i + 1; }).join('、') + ' 行）'
                : '';
            notes.push('有 ' + audit.lost + ' 处公式环境在译文里消失' + where + '，请点 ↻ 单独重试这几行');
            console.warn('xportEquationAudit: equations in=' + audit.envIn + ' out=' + audit.envOut + ' rows=' + JSON.stringify(audit.rows));
        }
        if (notes.length) showToast(notes.join('；'), 'warning');
    } catch (e) {}
    return audit;
}

// 标定常数（tests/transport/calibrate.js 实测，两个模型各 4 个真实批次）：
// 掩码后 1 个源字符的**往返** token 成本（prompt 里它自己 + completion 里它的译文）
//   35B：0.526–0.559，均值 0.541 tok/char
//   1.7b：0.524–0.562，均值 0.538 tok/char
// 取 0.8 ≈ 最差实测值的 1.4 倍余量。**不要**再用「按 max_tokens 算余量」那套
// —— 上下文是加载期参数，LM Studio 一重启就回落 4096，必须按现问到的值算。
const XPORT_TOK_PER_CHAR_ROUNDTRIP = 0.8;
const XPORT_CTX_USE = 0.35;       // 只用加载期上下文的 35%：批次之外还有系统提示与安全垫
// 每批 8 段：tests/transport/sweep.js 在 qwen3-1.7b 上实测 4/8/12 段三档的首次通过率
// 分别是 96.4% / 100% / 96.4%，总耗时几乎相同（13.7s / 13.0s / 13.1s）；35B 三档全 100%。
// 8 是唯一两个模型都不掉块的档位，且请求数只有 4 段档的一半。
const XPORT_SEGS_PER_BATCH = 8;
async function xportLimits(config) {
    if (config.provider !== 'local') {
        // 在线模型上下文远大于任何一批，真正的约束是「一次让模型编号多少段还不出错」
        return { chars: 5000, segs: XPORT_SEGS_PER_BATCH, ph: 60, recovery: 4 };
    }
    let ctx = 0;
    try { ctx = await xportLocalContext(config.localBaseUrl, config.model); } catch (e) { ctx = 0; }
    // 问不到就按「LM Studio 刚重启、上下文 4096」这个最坏情况算
    if (!ctx) ctx = 4096;
    const base = Math.min(8000, Math.floor(ctx * XPORT_CTX_USE / XPORT_TOK_PER_CHAR_ROUNDTRIP));
    // B2：推理开着时字符预算减半。XPORT_TOK_PER_CHAR_ROUNDTRIP = 0.8 是在**不推理**的
    // 前提下标定的；开着推理时 completion token 有约 92% 花在推理上（实测 qwen3.6），
    // 再按原预算装批就是在主动制造截断。关着时 mul = 1，逐字等于原来的算式。
    let mul = 1;
    try { mul = (xportWireEffort(config.localBaseUrl, config.model) === 'none') ? 1 : 0.5; } catch (e) { mul = 1; }
    const chars = Math.max(600, Math.floor(base * mul));
    return { chars: chars, segs: XPORT_SEGS_PER_BATCH, ph: 40, recovery: 8 };
}

// 装批：字符预算、段数、占位符数三条同时约束。任何一条超了就开新批。
function xportPack(masked, limits) {
    const batches = [];
    let cur = [], chars = 0, ph = 0;
    for (let i = 0; i < masked.length; i++) {
        const len = masked[i].text.length;
        const cnt = masked[i].map.length;
