//   data: {... "delta":{"content":"OK"} ...}                    ← 然后才是答案，**另一个字段**
//   data: {... "delta":{}, "finish_reason":"stop"|"length" ...}
//   data: {... "choices":[], "usage":{"prompt_tokens":N,"completion_tokens":N,"total_tokens":N,
//          "completion_tokens_details":{"reasoning_tokens":N}} ...}   ← C8 也从这一帧取这四个数
//   data: [DONE]
// 两个通道天生分开 ⇒ 思考区和答案气泡各自流各自的，**零解析启发式**。
//
// 【铁律】==EDIT== 只在收全之后解析一次。半截的修改块绝不允许长出「应用」按钮 ——
// 中止一次流就能写坏用户论文的话，这个功能就成了数据丢失缺陷。
// 中止也不是错误：把已经收到的字留下来，标一句「已停止」，再走**同一个** chatRenderAssistant。
async function chatStreamLocal(config, messages, signal, meta, req, sink) {
    const endpoint = String(config.localBaseUrl || '').replace(/\/$/, '') + '/v1/chat/completions';
    const body = {
        model: config.model || 'local-model',
        messages: messages,
        temperature: (typeof req.temperature === 'number' && isFinite(req.temperature)) ? req.temperature : 0.3,
        max_tokens: req.maxTokens,
        stream: true,
        stream_options: { include_usage: true }
    };
    // 和非流式那条路一样：**永远显式发**（省略 ≡ 关闭推理）。400 闩合上过就一个字节都不发。
    let effortSent = '';
    try {
        if (!xportEffortUnsupported.has(xportCapsOrigin(config.localBaseUrl))
            && XPORT_WIRE_EFFORTS.indexOf(req.reasoningEffort) !== -1) {
            effortSent = req.reasoningEffort;
            body.reasoning_effort = effortSent;
        }
    } catch (e) { effortSent = ''; }

    let text = '', reasoning = '', finish = '', rtok = 0, ptok = 0, ctok = 0, ttok = 0, aborted = false;
    const finishUp = function () {
        if (meta) {
            meta.text = text;
            meta.reasoning = reasoning;
            meta.finish = finish;
            meta.truncated = finish === 'length';
            meta.thinking = reasoning.trim() !== '' || rtok > 0;
            meta.reasoningTokens = rtok;
            meta.reasoningEffortSent = effortSent;
            meta.streamed = true;
            meta.aborted = aborted;
            // C6：实测输入 token。流式下它在**最后一帧**（choices:[] + usage）才到，
            // 所以中止时通常是 0 —— 0 就当作「这一轮没量到」，环退回估算，不许拿 0 当实测。
            meta.promptTokens = ptok;
            // C8：同一最后一帧里的输出侧两个数，同样只在收全时才非零——中止时通常也是 0，
            // 上下文圆环那边遇到 0 就退回估算，不许拿 0 当实测。
            meta.completionTokens = ctok;
            meta.totalTokens = ttok;
        }
        // 被动探测，和 callLocalLLM 里那一次同样的语义：第三个参数说明「这一次到底要没要推理」，
        // 免得对话开着推理、翻译关着推理时弹出一条「没人要求它却在推理」的假警报。
        try { xportNoteThinking(config.model, (reasoning.trim() !== '' || rtok > 0), effortSent ? (effortSent !== 'none') : undefined); } catch (e) {}
        return text;
    };

    try {
        const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: signal
        });
        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error('API Error: ' + resp.status + ' - ' + errText);
        }
        if (!resp.body || typeof resp.body.getReader !== 'function') {
            throw new Error('这个浏览器/环境不支持读取流式响应。到参数条的 ⋮ 里把「流式」关掉即可。');
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        let done = false;
        for (;;) {
            const r = await reader.read();
            if (r.done) break;
            buf = (buf + dec.decode(r.value, { stream: true })).replace(/\r\n/g, '\n');
            let idx;
            while ((idx = buf.indexOf('\n\n')) !== -1) {
                const frame = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                const lines = frame.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.indexOf('data:') !== 0) continue;          // 注释行 / 事件名一律无视
                    const payload = line.slice(5).trim();
                    if (!payload) continue;
                    if (payload === '[DONE]') { done = true; continue; }
                    let j = null;
                    try { j = JSON.parse(payload); } catch (e) { continue; }  // 半截 JSON：丢掉这一帧，绝不猜
                    const ch = (j && Array.isArray(j.choices) && j.choices[0]) || null;
                    if (ch) {
                        const d = ch.delta || {};
                        if (typeof d.reasoning_content === 'string' && d.reasoning_content) {
                            reasoning += d.reasoning_content;
                            if (sink && sink.reasoning) sink.reasoning(reasoning);
                        }
                        if (typeof d.content === 'string' && d.content) {
                            text += d.content;
                            if (sink && sink.text) sink.text(text);
                        }
                        if (ch.finish_reason) finish = String(ch.finish_reason);
                    }
                    const det = (j && j.usage && j.usage.completion_tokens_details) || null;
                    if (det && typeof det.reasoning_tokens === 'number') rtok = det.reasoning_tokens;
                    if (j && j.usage && typeof j.usage.prompt_tokens === 'number') ptok = j.usage.prompt_tokens;
                    if (j && j.usage && typeof j.usage.completion_tokens === 'number') ctok = j.usage.completion_tokens;
                    if (j && j.usage && typeof j.usage.total_tokens === 'number') ttok = j.usage.total_tokens;
                }
            }
            if (done) break;
        }
        return finishUp();
    } catch (e) {
        // 中止是预期路径，不是错误：把已经收到的字交回去，由 chatSend 正常渲染 + 标一句「已停止」。
        if (e && e.name === 'AbortError') { aborted = true; return finishUp(); }
        throw e;
    }
}

// 流式时那一行「活的」助手气泡。整场只 mutate **一个文本节点**（思考区再一个），
// 绝不重建节点、绝不碰 renderApp。
function chatLiveSink() {
    const st = { row: null, node: null, thinkBody: null };
    const ensureRow = function () {
        if (st.row) return;
        // skipUnread：这只是流式占位行，还没收全。真正代表「一条完整回复」的未读计数
        // 由 chatRenderAssistant 收全之后建最终行时记一次，见 chatAppendRow 里的注释。
        st.row = chatAppendRow('assistant', '', { skipUnread: true });
        const b = chatBubbleOf(st.row);
        st.node = document.createTextNode('');
        if (b) b.appendChild(st.node);
    };
    return {
        state: st,
        reasoning: function (full) {
            try {
                // 「显示思考过程」关着时流式也不画。**只影响显示**：delta.reasoning_content 照旧
                // 被 chatStreamLocal 收进 meta.reasoning（对账、诊断、回传思考都还要用它）。
                if (!ChatState.showThinking) return;
                ensureRow();
                if (!st.thinkBody) {
                    const b = chatBubbleOf(st.row);
                    if (!b) return;
                    const det = document.createElement('details');
                    det.className = 'aichat-think';
                    det.open = true;                      // 流的时候默认展开：正在动的东西看得见才有意义
                    const sum = document.createElement('summary');
                    sum.textContent = '思考中（模型的推理过程，不是答案）';
                    st.thinkBody = document.createElement('div');
                    st.thinkBody.className = 'aichat-think-body';
                    det.appendChild(sum);
                    det.appendChild(st.thinkBody);
                    b.insertBefore(det, st.node);         // 思考永远排在答案上面
                }
                st.thinkBody.textContent = String(full == null ? '' : full);
                chatScrollToBottom();
            } catch (e) {}
        },
        text: function (full) {
            try {
                ensureRow();
                if (!st.node) return;
                // 显示层只做两件事：去掉信封头、把 ==EDIT== 之后的内容换成一句提示。
                // **解析**（以及「要不要长出应用按钮」）一律等收全之后由 chatParseEnvelope 做一次。
                let s = String(full == null ? '' : full).replace(/^[ \t]*==CHAT==[ \t]*\r?\n?/, '');
                const cut = s.search(/^[ \t]*==EDIT\b/m);
                if (cut !== -1) s = s.slice(0, cut) + '\n（正在生成修改内容…收全之后才会给出前后对照和「应用」按钮）';
                st.node.nodeValue = s;
                chatScrollToBottom();
            } catch (e) {}
        },
        destroy: function () {
            try { if (st.row && st.row.parentNode) st.row.parentNode.removeChild(st.row); } catch (e) {}
            st.row = null; st.node = null; st.thinkBody = null;
        }
    };
}

// ============================================================================
// C3 —— 附加选段 → 提案 → 应用
// ============================================================================
//
// 这一段会**写进用户的论文**，所以它的默认答案永远是「不写」。
//
// 【捕获时机】在点「附到对话」的那一刻把 target 整个抄下来，之后绝不再读实时选区。
//   实测：行内 textarea 的选区能扛住焦点跑到聊天输入框（{start:7,end:22}、sameNode:true），
//   但任何一次整页重渲染都会把它清零（{start:0,end:0}、sameNode:false），
//   而重渲染是定时器驱动的 —— 用户什么都不做，1~5 分钟也会来一次。
//
// 【应用前四道闸门，全部必过，一道都不能省】
//   1. 目标行还在，且行号仍然指向同一行；
//   2. 这一行自捕获以来没被改过（逐字比 rowSrcAtCapture / rowTgtAtCapture）；
//   3. 捕获下来的那段文字仍然在原位置逐字对得上；对不上就尝试**唯一**重定位，
//      不唯一（0 处或 ≥2 处）就中止 —— **有歧义就是中止**；
//   4. 模型确实给了 ==EDIT== 块。没有 EDIT 块就没有「应用」按钮，绝不从白话里凑一个出来。
//   任何一道不过：中止 + 在对话里留一条可见的玫瑰色说明 + **一个字节都不写**。
//   这套纪律是照抄 applySynonym 的（它也是逐字复核 + 可见中止），不另起一套方言。

function chatFindProposal(id) {
    if (id == null) return null;
    const list = ChatState.proposals;
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
}

// 这一行、这一侧此刻的**真值**：正在编辑就是 editValues（textarea 缓冲区），否则是 pair 本身。
// 读错一个，就是把修改应用到过时的文本上。
function chatLiveBase(rowIndex, side) {
    const editing = (AppState.activeIndex === rowIndex);
    const v = editing ? AppState.editValues[side] : ((AppState.translationPairs[rowIndex] || {})[side]);
    return (typeof v === 'string') ? v : '';
}

function chatCountOccurrences(hay, needle) {
    if (!needle) return 0;
    let n = 0, i = 0;
    for (;;) {
        const k = hay.indexOf(needle, i);
        if (k === -1) break;
        n++;
        i = k + 1;                    // +1 而不是 +len：重叠出现也要算进去，宁可判成「有歧义」
        if (n > 1) break;
    }
    return n;
}

function chatTargetSummary(t) {
    const s = String(t.text || '').replace(/\s+/g, ' ').trim();
    return s.length > CHAT_CHIP_CHARS ? s.slice(0, CHAT_CHIP_CHARS) + '…' : s;
}

function chatRenderTargetChip() {
    try {
        const slot = document.getElementById('aiChatTargetSlot');
        if (!slot) return;
        slot.textContent = '';
        const t = ChatState.target;
        if (!t) return;
        const box = document.createElement('div');
        box.className = 'aichat-target';
        const label = document.createElement('span');
        label.className = 'aichat-target-label';
        label.textContent = (t.side === 'src' ? '原文' : '译文') + ' · 第 ' + (t.rowIndex + 1) + ' 行'
            + (t.whole ? ' · 整行' : ' · 选中段') + '：';
        const txt = document.createElement('span');
        txt.className = 'aichat-target-text';
        txt.textContent = chatTargetSummary(t);      // textContent：选段里可能有 LaTeX 和 '<'
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'aichat-target-x';
        x.textContent = '×';
        x.setAttribute('data-tip', '取消附加。取消之后模型不会再收到这段文字，也不会再给出「应用」按钮。');
        x.setAttribute('data-tip-pos', 'top-end');
        x.addEventListener('click', function () { chatDetach(); });
        box.appendChild(label);
        box.appendChild(txt);
        box.appendChild(x);
        slot.appendChild(box);
    } catch (e) {
        console.error('[chat] target chip failed', e);
    }
}

function chatDetach() {
    try {
        ChatState.target = null;
        chatRenderTargetChip();
        chatAppendRow('system', '已取消附加选段。');
        chatUpdateBar();
    } catch (e) {
        console.error('[chat] detach failed', e);
    }
}

// —— 批量通过：逐条应用之外的第二条路 ——
// 【定点重绘，同 chatRenderTargetChip】只在 ≥2 条待处理提案时露面 —— 只有 1 条时卡片自己的
// 「应用」按钮已经够用，摆一条一模一样的批量条只是重复。
// 「待处理」= !applied && !dismissed：已点过「应用」或「忽略」的卡片，这颗按钮不会再碰。
function chatRenderBatchBar() {
    try {
        const slot = document.getElementById('aiChatBatchSlot');
        if (!slot) return;
        slot.textContent = '';
        const list = Array.isArray(ChatState.proposals) ? ChatState.proposals : [];
        const pending = list.filter(function (p) { return p && !p.applied && !p.dismissed; });
        if (pending.length < 2) return;
        const box = document.createElement('div');
        box.className = 'aichat-batchbar';
        const label = document.createElement('span');
        label.className = 'aichat-batchbar-label';
        label.textContent = '有 ' + pending.length + ' 条修改建议还没处理';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'aichat-btn aichat-btn-primary';
        btn.textContent = '全部通过';
        btn.setAttribute('data-tip', '一次性应用上面这 ' + pending.length + ' 条待处理的修改建议。'
            + '每一条仍然逐条过 chatApplyProposal 的闸门（这一行还在不在、有没有被改过、'
            + '那段文字还在不在原位置、有没有别的请求正在覆盖这一行）—— 过不了的会被单独拦下并说明原因，'
            + '不连累其它条目、一个字节都不会因此多写。已经点过「应用」或「忽略」的不会被这颗按钮碰。');
        btn.setAttribute('data-tip-pos', 'top');
        btn.addEventListener('click', function () { chatBatchApprove(); });
        box.appendChild(label);
        box.appendChild(btn);
        slot.appendChild(box);
    } catch (e) {
        console.error('[chat] batch bar failed', e);
    }
}

function chatBatchApprove() {
    try {
        const list = Array.isArray(ChatState.proposals) ? ChatState.proposals : [];
        const pending = list.filter(function (p) { return p && !p.applied && !p.dismissed; });
        if (!pending.length) return;
        let ok = 0;
        // 按原有顺序逐条走 chatApplyProposal——和用户一张张手动点「应用」是完全同一条代码路径，
        // 这颗按钮不额外拿任何捷径。某一条闸门没过，chatApplyProposal 自己会打一行说明并中止，
        // 不会抛出、也不会打断这个循环里剩下的条目。
        pending.forEach(function (p) {
            chatApplyProposal(p.id);
            if (p.applied) ok++;
        });
        const fail = pending.length - ok;
        chatAppendRow('system', '全部通过：' + ok + ' 项已应用'
            + (fail ? '，' + fail + ' 项被拦下（各自原因见上面对应提示）' : '') + '。');
        chatRenderBatchBar();
    } catch (e) {
        console.error('[chat] batch approve failed', e);
        try { chatErrorRow('全部通过', e); } catch (e2) {}
    }
}

// 捕获。useSelection=true 时优先用该侧 textarea 里此刻的选区（点按钮的这一刻就是捕获时刻），
// 没有选区 / 不在编辑态就退回整行。
function chatCaptureTarget(rowIndex, side, useSelection) {
    const pairs = AppState.translationPairs;
    if (!Array.isArray(pairs)) return null;
    if (typeof rowIndex !== 'number' || rowIndex < 0 || rowIndex >= pairs.length) return null;
    if (side !== 'src' && side !== 'tgt') return null;
    const row = pairs[rowIndex];
    if (!row || typeof row !== 'object') return null;

    const base = chatLiveBase(rowIndex, side);
    let start = 0, end = base.length, whole = true;
    if (useSelection && AppState.activeIndex === rowIndex) {
        const ta = document.getElementById('editTextarea_' + side + '_' + rowIndex);
        if (ta && ta.value === base
            && typeof ta.selectionStart === 'number' && typeof ta.selectionEnd === 'number'
            && ta.selectionEnd > ta.selectionStart) {
            start = ta.selectionStart;
            end = ta.selectionEnd;
            whole = (start === 0 && end === base.length);
        }
    }
    return {
        rowIndex: rowIndex,
        side: side,
        start: start,
        end: end,
        text: base.substring(start, end),
        baseAtCapture: base,                                    // 该侧缓冲区在捕获那一刻的全文
        rowSrcAtCapture: String(row.src == null ? '' : row.src), // 已提交值，用于闸门 2
        rowTgtAtCapture: String(row.tgt == null ? '' : row.tgt),
        whole: whole,
        capturedAt: Date.now()
    };
}

function chatAttach(rowIndex, side, useSelection) {
    try {
        const t = chatCaptureTarget(rowIndex, side, useSelection);
        if (!t) {
            chatOpen();
            chatAppendRow('error', '附加失败：这一行已经不在了。');
            return;
        }
        if (!t.text) {
            chatOpen();
            chatAppendRow('error', '附加失败：这一段是空的，没有可改的内容。');
            return;
        }
        ChatState.target = t;
        chatOpen();
        chatRenderTargetChip();
        chatAppendRow('system', '已附加：' + (side === 'src' ? '原文' : '译文') + ' 第 ' + (rowIndex + 1) + ' 行'
            + (t.whole ? '（整行）' : '（第 ' + t.start + '–' + t.end + ' 个字符）')
            + '，共 ' + t.text.length + ' 字。现在可以让我改写它。');
        // <think> 在部分模型上会被**静默删除**（实测：qwen3.8 把 <think>hello</think>DONE
        // 变成 helloDONE，qwen3-1.7b 连内容一起删，而且删掉的东西哪都没去）。
        // 这是模型侧的行为，闸门拦不住「改写结果里少了这对标记」，只能事先说明白。
        if (/<\/?\s*think\s*>/i.test(t.text)) {
            chatAppendRow('system', '⚠ 这段文字里有 <think> 标记。实测部分本地模型会在输出里**静默删掉**它，'
                + '应用之前请务必看清下面的前后对照。');
        }
        chatUpdateBar();
        const ta = document.getElementById('aiChatInput');
        if (ta && ta.focus) { try { ta.focus(); } catch (e) {} }
    } catch (e) {
        console.error('[chat] attach failed', e);
        try { chatErrorRow('附加选段', e); } catch (e2) {}
    }
}

// 【附加已降级：界面上没有入口了】原来这两个函数各挂在一颗按钮上（行内工具栏的「附到对话」、
// 非编辑行右上角那颗悬停按钮）。那两颗按钮已经换成了「关注」复选框 ——
// 附加当初的用途是「让模型看得见这一句」，而文档现在每一轮整篇发过去，那个用途不存在了。
//
// 但**整条附加链路一行都没删**，理由不是舍不得：
//   · chatCaptureTarget 的「捕获即定格」、chatApplyProposal 的四道闸门、
//     应用之后把 target 重新锚定到新文本 —— 这三块是提案链路的共用地基，
//     关注功能的重新锚定逻辑就是照着它们写的（chat-focus-selection.md C7：移植，不要重写）；
//   · ChatState.target 仍被 chatSystemPrompt / chatBuildTargetTurn / chatCtxSig 读到，
//     一并摘掉等于顺手重构一遍还在服役的提案链路，而这一版没有任何验收要求那样做。
// 所以它们留在这里：没有 UI 入口，语义不变，随时可以再挂回一颗按钮上。
function chatAttachSel(rowIndex, side) { chatAttach(rowIndex, side, true); }
function chatAttachRow(rowIndex, side) { chatAttach(rowIndex, side, false); }

// —— 提案 ——
// 提案文本**绝不**内联进 onclick 字符串（\cite{...}、$x_i$、引号会被 JS 字符串字面量吃掉）：
// 存进 ChatState.proposals，卡片上的按钮用闭包按 id 回查。
// C6：没有附加选段、但这一轮带了编号文档时，模型可以用 row=<n> 指认整行。
// 四道闸门一条都不放松，只是换了参照物：
//   1 行号在这一轮发出去的范围内、行还存在  2 side 必须写全（猜一侧 = 替用户挑哪句被覆盖）
//   3 这一行自「我把上下文发出去」以来没被改过（比对每行指纹）  4 没有 ==EDIT== 就没有按钮
// 通过之后造出来的提案是一个 start=0 / end=整行长度 的**整行**提案，
// 于是 chatApplyProposal 一行都不用改：它原有的闸门 2/3 逐字就是这里要的语义。
function chatRowProposalBase(edit) {
    const snap = ChatState.docSnapshot;
    if (!snap || !snap.hashes) {
        chatAppendRow('system', '模型给出了一处修改，但你这一轮没有附加选段、也没有发送文档上下文，'
            + '没有任何可以指认的行。已丢弃，没有「应用」按钮。');
        return null;
    }
    const n = edit.row;
    if (typeof n !== 'number' || !isFinite(n)) {
        chatAppendRow('error', '模型给出的修改没有写 row=<行号>。没有行号就不知道该改哪一行 —— '
            + '已丢弃，没有「应用」按钮。');
        return null;
    }
    if (n < snap.from || n > snap.to) {
        // 【只说得出口的那一半】拒绝是对的：闸门 3 要比对「这一行自我发出上下文以来变没变」，
        // 而指纹只对 ==DOC== 块里的那些行存在，范围外的行没有指纹可比 —— 应用下去就是无据可依。
        // 但不能说「它在对没看过的内容发表意见」：用户自己勾的「额外关注」很可能刚把这一行
        // 逐字发了出去，模型确实看过。那句话会让用户以为模型在瞎编、或者关注根本没发出去。
        chatAppendRow('error', '模型把修改标成了第 ' + n + ' 行，但这一轮的 ==DOC== 文档块只有第 '
            + snap.from + '–' + snap.to + ' 行，范围外的行没有随文档发出去的指纹可以复核'
            + '（就算它因为「额外关注」被单独发过去，那一段也不带指纹）。'
            + '无据可依的改动一律不给「应用」按钮 —— 已丢弃。想改这一行，先让它进入文档窗口范围再问一次。');
        return null;
    }
    // C7（对话上下文收窄）：side 只接受 src。这个工具现在只能改左栏的原文；
    // 译文是翻译结果，不是用户在编辑的对象。side=tgt 和「没写 side」是两种不同的错，
    // 分开说清楚 —— 前者是模型明确想改译文（用户最容易被这条误伤，必须说明白为什么被拒），
    // 后者是模型没写全（老的那句提示照旧适用）。两种都不给「应用」按钮，卡片上都说明原因，
    // 不是静默丢弃。
    if (edit.side !== 'src') {
        if (edit.side === 'tgt') {
            chatAppendRow('error', '模型给出的修改标的是 side=tgt（译文），但这个工具现在只能改'
                + '左栏的原文——译文是原文重新翻译之后的结果，不接受直接改写。已丢弃，没有「应用」按钮。'
                + '想让译文变，请先把这一行原文改对，再重新翻译这一句。');
        } else {
            chatAppendRow('error', '模型没有写 side=src。替用户猜要不要改是不允许的 —— '
                + '已丢弃，没有「应用」按钮。');
        }
        return null;
    }
    const pairs = AppState.translationPairs;
    const idx = n - 1;
    if (!Array.isArray(pairs) || idx < 0 || idx >= pairs.length || !pairs[idx]) {
        chatAppendRow('error', '第 ' + n + ' 行已经不存在了（行数变了）。已丢弃，没有「应用」按钮。');
        return null;
    }
    const liveSrc = String(pairs[idx].src == null ? '' : pairs[idx].src);
    const liveTgt = String(pairs[idx].tgt == null ? '' : pairs[idx].tgt);
    const h = snap.hashes[n];
    if (!h || h.src !== chatRowHash(liveSrc) || h.tgt !== chatRowHash(liveTgt)) {
        chatAppendRow('error', '第 ' + n + ' 行在你提问之后被改过了，模型看到的是旧文本。'
            + '已丢弃，没有「应用」按钮 —— 请再问一次，下一轮会把改过之后的文档重新发过去。');
        return null;
    }
    const base = liveSrc;
    return {
        rowIndex: idx, side: edit.side, start: 0, end: base.length, text: base,
        baseAtCapture: base, rowSrcAtCapture: liveSrc, rowTgtAtCapture: liveTgt, wholeRow: true
    };
}

function chatMakeProposal(edit) {
    try {
        const t = ChatState.target;
        if (!t) {
            const b = chatRowProposalBase(edit);
            if (!b) return null;
            const rep = String(edit.body == null ? '' : edit.body);
            if (!rep.trim() && b.text.trim()) {
                chatAppendRow('error', '模型给出的替换内容是空的（应用下去会把这一行清空）。已拒绝，没有「应用」按钮。');
                return null;
            }
            if (rep === b.text) {
                chatAppendRow('system', '模型给出的替换文本和这一行逐字一样，没有可应用的改动。');
                return null;
            }
            const p2 = {
                id: ++ChatState.proposalSeq,
                rowIndex: b.rowIndex, side: b.side, start: b.start, end: b.end, text: b.text,
                baseAtCapture: b.baseAtCapture,
                rowSrcAtCapture: b.rowSrcAtCapture, rowTgtAtCapture: b.rowTgtAtCapture,
                replacement: rep, applied: false, dismissed: false, card: null, wholeRow: true
            };
            ChatState.proposals.push(p2);
            chatRenderProposalCard(p2);
            return p2;
        }
        // side/row 只是**建议性**的。真正说了算的是客户端捕获的 target。
        // 模型说的和捕获的对不上，就把这个修改块整个丢掉 —— 绝不让模型来挑
        // 用户的哪一句会被覆盖。
        if (edit.side && edit.side !== t.side) {
            chatAppendRow('error', '模型把修改标成了 side=' + edit.side + '，但你附加的是「'
                + (t.side === 'src' ? '原文' : '译文') + '」。这处修改已被丢弃，没有「应用」按钮。');
            return null;
        }
        if (edit.row != null && edit.row !== t.rowIndex + 1) {
            chatAppendRow('error', '模型把修改标成了 row=' + edit.row + '，但你附加的是第 '
                + (t.rowIndex + 1) + ' 行。这处修改已被丢弃，没有「应用」按钮。');
            return null;
        }
        const replacement = String(edit.body == null ? '' : edit.body);
        // 会把这一段清空的替换：拒绝。用户要清空有别的路，模型不该有这条路。
        if (!replacement.trim() && t.text.trim()) {
            chatAppendRow('error', '模型给出的替换内容是空的（应用下去会把这一段清空）。已拒绝，没有「应用」按钮。');
            return null;
        }
        if (replacement === t.text) {
            chatAppendRow('system', '模型给出的替换文本和原文逐字一样，没有可应用的改动。');
            return null;
        }
        const p = {
            id: ++ChatState.proposalSeq,
            rowIndex: t.rowIndex,
            side: t.side,
            start: t.start,
            end: t.end,
            text: t.text,
            baseAtCapture: t.baseAtCapture,
            rowSrcAtCapture: t.rowSrcAtCapture,
            rowTgtAtCapture: t.rowTgtAtCapture,
            replacement: replacement,
            applied: false,
            dismissed: false,
            card: null
        };
        ChatState.proposals.push(p);
        chatRenderProposalCard(p);
        return p;
    } catch (e) {
        console.error('[chat] makeProposal failed', e);
        try { chatErrorRow('生成提案', e); } catch (e2) {}
        return null;
    }
}

function chatRenderProposalCard(p) {
    const row = document.createElement('div');
    row.className = 'aichat-row aichat-row-assistant';
    const card = document.createElement('div');
    card.className = 'aichat-card';

    const head = document.createElement('div');
    head.className = 'aichat-card-head';
    head.textContent = '建议修改 · ' + (p.side === 'src' ? '原文' : '译文') + ' · 第 ' + (p.rowIndex + 1) + ' 行'
        + (p.wholeRow ? ' · 整行替换' : '');
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'aichat-card-body';

    // 前后两栏。逐字对照，一律 textContent + white-space:pre-wrap。
    // （逐词 diff 更好看，但那是可切掉的装饰；「应用前必须看清会变成什么」这条要求
    //   前后对照已经满足。）
    const lab1 = document.createElement('div');
    lab1.className = 'aichat-pane-label';
    lab1.textContent = '现在（将被替换的这一段）';
    const pane1 = document.createElement('div');
    pane1.className = 'aichat-pane aichat-pane-old';
    pane1.textContent = p.text;

    const lab2 = document.createElement('div');
    lab2.className = 'aichat-pane-label';
    lab2.textContent = '改为';
    const pane2 = document.createElement('div');
    pane2.className = 'aichat-pane aichat-pane-new';
    pane2.textContent = p.replacement;

    body.appendChild(lab1); body.appendChild(pane1);
    body.appendChild(lab2); body.appendChild(pane2);

    // —— 只附了一段时，上面两栏说的是「那一段」，不是「这一行」——
    // 实测一次就吃掉了用户的段落：58 字的选区，qwen3.6 把**整行 244 字**当成替换文本还了回来，
    // 四道闸门全部通过（它们只比对捕获的那一段，替换文本本身不受任何约束），应用之后
    // 行里多出一句重复的从句，而卡片上一点都看不出来 —— 因为它从头到尾没显示过这一行。
    // 所以整行预览必须画出来，而且用的是和 chatApplyProposal 里逐字一样的那个拼接表达式。
    const baseCap = String(p.baseAtCapture == null ? '' : p.baseAtCapture);
    const partial = !(p.start === 0 && p.end === baseCap.length);
    if (partial) {
        const headKeep = baseCap.slice(0, p.start);
        const tailKeep = baseCap.slice(p.end);
        const lab3 = document.createElement('div');
        lab3.className = 'aichat-pane-label';
        lab3.textContent = '这一行应用后（整行预览）';
        const pane3 = document.createElement('div');
        pane3.className = 'aichat-pane aichat-pane-new';
        pane3.textContent = headKeep + p.replacement + tailKeep;
        body.appendChild(lab3); body.appendChild(pane3);

        // 「模型把整行还了回来」有一个很干净的指纹：选区**之外**的那截文字又出现在替换文本里。
        // 命中就直说，不拦 —— 拦不拦由用户看着上面那栏决定，和 LaTeX 体检一个规矩。
        const echoed = function (s) {
            const x = s.trim();
            return x.length >= 16 && p.replacement.indexOf(x.slice(0, 32)) !== -1;
        };
        if (echoed(headKeep) || echoed(tailKeep)) {
            const warn2 = document.createElement('div');
            warn2.className = 'aichat-card-warn';
            warn2.textContent = '⚠ 替换文本里含有这一行选区之外的文字（模型很可能把整行还了回来，'
                + '而你只选了其中一段）。照这样应用会让那部分重复一遍 —— 请先看上面的「整行预览」。';
            body.appendChild(warn2);
        }
    }

    // LaTeX 存活体检：源段里出现过的宏，替换文本里少了哪些，直说。不阻止应用，只提示。
    const lost = chatLatexLost(p.text, p.replacement);
    if (lost.length) {
        const warn = document.createElement('div');
        warn.className = 'aichat-card-warn';
        warn.textContent = '⚠ 原文里有、替换文本里没有的记号：' + lost.join('、') + '。应用前请确认这是你要的。';
        body.appendChild(warn);
    }

    const actions = document.createElement('div');
    actions.className = 'aichat-card-actions';
    const applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'aichat-btn aichat-btn-primary';
    applyBtn.textContent = '应用';
    // 这段文案必须和 chatApplyProposal 里的闸门逐条对得上。原来的版本写的是
    // 「这一行被改过 … 都会当场中止并且一个字节都不写」，那是假的：闸门 2 比的是**已提交值**，
    // 用户在行内打了字还没提交时它不会拦，闸门 3 会按唯一匹配重定位并照样写进缓冲区。
    // 行为本身是对的（用户自己打的字一个都没丢），假的是这句话，所以改的是这句话。
    applyBtn.setAttribute('data-tip', '把上面「改为」那段写回文档。写之前会再逐字核对一遍：'
        + '行号变了、这一行**已提交**的内容在你提问之后被改过、有一次会覆盖这一行的模型请求正在跑'
        + '（智能更新 / 重新生成 / 整篇翻译）、或者那段文字在行内已经找不到 / 出现了不止一处 —— '
        + '任何一条命中都当场中止，一个字节都不写。'
        + '有一种情况不中止：你正在这一行里打字（还没提交），而那段文字只是挪了位置、在缓冲区里仍然唯一存在；'
        + '那会按新位置写进你正在编辑的缓冲区（你自己打的字一个都不动），并在下面留一行说明。');
    applyBtn.setAttribute('data-tip-pos', 'top-start');
    applyBtn.addEventListener('click', function () { chatApplyProposal(p.id); });

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'aichat-btn';
    copyBtn.textContent = '复制';
    copyBtn.setAttribute('data-tip', '只把「改为」那段复制到剪贴板，不动文档。');
    copyBtn.setAttribute('data-tip-pos', 'top');
    copyBtn.addEventListener('click', function () {
        try { copyToClipboard(p.replacement); } catch (e) {}
    });

    const dropBtn = document.createElement('button');
    dropBtn.type = 'button';
    dropBtn.className = 'aichat-btn';
    dropBtn.textContent = '忽略';
    dropBtn.setAttribute('data-tip', '收起这张卡片，不做任何修改。');
    dropBtn.setAttribute('data-tip-pos', 'top-end');
    dropBtn.addEventListener('click', function () {
        try {
            p.dismissed = true;          // 「全部通过」按 !applied && !dismissed 挑待处理项，忽略过的绝不会被它捡回去
            actions.textContent = '';
            const done = document.createElement('span');
            done.className = 'aichat-card-done';
            done.textContent = '已忽略';
            done.style.color = '#94a3b8';
            actions.appendChild(done);
            chatRenderBatchBar();
        } catch (e) {}
    });

    actions.appendChild(applyBtn);
    actions.appendChild(copyBtn);
    actions.appendChild(dropBtn);
    body.appendChild(actions);
    card.appendChild(body);
    row.appendChild(card);

    const log = document.getElementById('aiChatLog');
    if (log) log.appendChild(row);
    p.card = { row: row, actions: actions };
    chatScrollToBottom();

    // 「跳过审批」开着：卡片一画出来就自动点一次「应用」。chatApplyProposal 内部的四道闸门
    // 一条都不会因为这个开关而放松——这里只是替用户按了那颗按钮，不是绕过按钮背后的核对。
    if (ChatState.autoApprove) chatApplyProposal(p.id);
    try { chatRenderBatchBar(); } catch (e) {}
}

// 源段里出现、替换文本里消失了的记号。纯提示，不做任何拦截 —— 拦不拦由用户看了对照决定。
// 除了 LaTeX 宏，**必须**也盯着 <think> / </think>：实测 qwen3.8 会把它们静默删掉、
// qwen3-1.7b 连里面的内容一起删，而且删掉的东西 reasoning_content 里也没有。
// 那种情况下四道闸门全都会通过（闸门比的是**捕获时的原文**，模型只影响替换文本），
// 所以只能在这里明说，而不能指望闸门。
function chatLatexLost(oldText, newText) {
    const out = [];
    try {
        const seen = Object.create(null);
        const check = function (tok) {
            if (!tok || seen[tok]) return;
            seen[tok] = true;
            const inOld = oldText.split(tok).length - 1;
            const inNew = newText.split(tok).length - 1;
            if (inNew < inOld) out.push(tok + (inOld > 1 ? '（' + inNew + '/' + inOld + '）' : ''));
        };
        ['<think>', '</think>'].forEach(check);
        const re = /\\[A-Za-z]+\*?(?:\{[^{}]*\})?/g;
        let m;
        while ((m = re.exec(oldText)) !== null) {
            check(m[0]);
            if (out.length >= 6) break;
        }
    } catch (e) {}
    return out.slice(0, 6);
}

// 中止：可见的一行 + **一个字节都不写**。措辞刻意和 applySynonym 那句对齐。
function chatAbortApply(msg) {
    chatAppendRow('error', msg);
    chatScrollToBottom();
    return false;
}

function chatApplyProposal(id) {
    try {
        const p = chatFindProposal(id);
        if (!p || p.applied) return;

        const pairs = AppState.translationPairs;
        // ---- 闸门 1：目标行还在吗 ----
        if (!Array.isArray(pairs) || p.rowIndex >= pairs.length || !pairs[p.rowIndex]) {
            return chatAbortApply('目标行已不存在（行数变了），未做任何修改。');
        }
        const row = pairs[p.rowIndex];

        // ---- 闸门 1.5：有没有一次「会覆盖这一行」的模型请求正在飞 ----
        // 文件里有四处同一个形状：**发请求那一刻把文本抓走 → await → 用抓走的那份覆盖回去**。
        //   · saveRowUpdate      抓 currentSrc/currentTgt → addHistory(index, finalSrc, finalTgt)
        //   · handleRegenerateTranslation  抓 pair.src → addHistory(index, srcText, newTgt)
        //   · handleRegenerateAll / handleTranslate  整个 translationPairs 数组换新
        // addHistory 还会在 activeIndex 命中时把 AppState.editValues 一起重置回那份快照，
        // 所以在这个窗口里写下去的东西几秒后会被**静默**抹掉，而卡片上还挂着「已应用 ✓」。
        // 实测（qwen3.6，两组时间线）：apply 在 t=0.04s 生效，t=12.7s 请求落地，译文回到手改前的样子，
        // 聊天流里一行提示都没有。
        // 覆盖本身是那四处的既有行为（手打的编辑在同一窗口里也一样会丢），不在这次的修复范围；
        // 这里要堵的是「聊天窗口宣称写成功了，而那次写正在被销毁」。
        // 所以**拒绝**，不去抢救 —— 拒绝是这条路上唯一不撒谎的动作。一个布尔表达式盖住全部四处。
        const busy = row.isUpdating ? '这一行的智能更新'
            : row.isRegenerating ? '这一行的重新生成'
            : AppState.isRegeneratingAll ? '全文重新生成'
            : AppState.isLoading ? '整篇翻译'
            : '';
        if (busy) {
            return chatAbortApply('「' + busy + '」正在进行中，未做任何修改。'
                + '它落地时会用发起那一刻抓到的文本覆盖这一行，现在写下去几秒后就会被静默抹掉。'
                + '等它结束（或点那颗按钮取消它）之后再点「应用」。');
        }

        // ---- 闸门 2：这一行自捕获以来被改过没有 ----
        // 比的是**已提交值**。行内还没提交的编辑缓冲区不在比较范围里 —— 所以「用户正在这一行
        // 里打字但还没提交」的时候这道闸门照样通过，闸门 3 会在那份缓冲区上重新定位。
        // （按钮的提示文案必须和这一点一致，见 chatRenderProposalCard 里那段 data-tip。）
        if (String(row.src == null ? '' : row.src) !== p.rowSrcAtCapture
            || String(row.tgt == null ? '' : row.tgt) !== p.rowTgtAtCapture) {
            return chatAbortApply('这一行在你提问之后被改过了，未做任何修改。请重新选中后再试。');
        }

        // ---- 闸门 3：那段文字还在原位置吗；不在就只接受**唯一**重定位 ----
        const base = chatLiveBase(p.rowIndex, p.side);
        if (typeof base !== 'string') {
            return chatAbortApply('选中范围已失效（正文被改动过），未做任何替换。');
        }
        let start = p.start, end = p.end;
        const exact = (base === p.baseAtCapture) && (end <= base.length)
            && (base.substring(start, end) === p.text);
        let relocated = false;
        if (!exact) {
            const n = chatCountOccurrences(base, p.text);
            if (n !== 1) {
                // 0 处 = 没了；≥2 处 = 有歧义。两种都中止 —— 有歧义就是中止。
                return chatAbortApply('选中范围已失效（正文被改动过），未做任何替换。');
            }
            start = base.indexOf(p.text);
            end = start + p.text.length;
            relocated = true;
        }

        // ---- 闸门 4 已经在生成提案时把过了：没有 ==EDIT== 块就根本没有这颗按钮 ----
        const next = base.slice(0, start) + p.replacement + base.slice(end);

        if (AppState.activeIndex === p.rowIndex) {
            // —— 情形 A：这一行正在编辑 ——
            // 照抄 applySynonym：直接写缓冲区和 textarea，**不** setState、**不**记历史。
            // 它会在用户按 Update / 点走这一行时和手打的修改一样地提交，
            // 所以逐行撤销、自动存档、归档全都零改动地照常工作。
            AppState.editValues[p.side] = next;
            const ta = document.getElementById('editTextarea_' + p.side + '_' + p.rowIndex);
            if (ta) {
                ta.value = next;
                const caret = start + p.replacement.length;
                try { ta.setSelectionRange(caret, caret); } catch (e) {}
                // autoResizeTextarea 里带 scheduleAlignSync：行高变了，左右两栏当场重新对齐。
                // （applySynonym 没有这一步，那是它自己的一个既有缺陷，不在这次范围内。）
                autoResizeTextarea(ta);
                try { ta.focus(); } catch (e) {}
            } else {
                // 编辑态但 textarea 找不到（视图模式被切走了）：缓冲区已经改了，补一次对齐即可
                scheduleAlignSync();
            }
            chatAppendRow('system', '已应用到「' + (p.side === 'src' ? '原文' : '译文') + ' 第 '
                + (p.rowIndex + 1) + ' 行」的编辑框。它还没提交 —— 按这一行的 Update（或点到别处）'
                + '才会写进历史，和你手打的修改完全一样。');
        } else {
            // —— 情形 B：这一行不在编辑态 ——
            // 走 addHistory：追加一条历史、historyIndex 指到最新，逐行的 ↺ n/m 立刻可撤销。
            // **绝不**走 saveRowUpdate —— 它会把「只有一侧变了」理解成「另一侧要重译」
            // 并发一次模型请求，那正是「静默改写用户另一栏」的那种失败。
            const newSrc = p.side === 'src' ? next : String(row.src == null ? '' : row.src);
            const newTgt = p.side === 'tgt' ? next : String(row.tgt == null ? '' : row.tgt);
            // ============= 改到**原文栏**上，就必须打上「用户动过原文」这个标志 =============
            // 【实测的原始故障（真 Chrome + jump 上的 qwen/qwen3.6-35b-a3b）】这里原来直接
            // addHistory 就完了。addHistory 刻意**不**碰 srcEditedSinceTranslate（它那边的理由是
            // 「模型自己回写的 src 不算用户改稿」，见它上面那段注释），于是聊天窗口把一处修改
            // 应用进 pairs[i].src 之后：pairs 变了、inputText / originalInputText 一个字没动、
            // 标志还是 false。从此 syncInputFromPairs 第一行就 return，没有任何一条路会来对账 ——
            // 这正是 handleRegenerateAll 里那段注释宣称已经堵掉的 B6，只是入口换成了聊天窗口。
            // 逐字复现（3 行文档，两次实测）：
            //   · 第 1 行 src 应用 `CHATMARK77` → 进 Edit 视图：大输入框 hasMark=false，
            //     而原文栏 hasMark=true —— 分歧就摆在屏幕上，用户分不出哪一份才算数；
            //   · 第 3 行 src 应用 `CHATMARK88` → 点「重新生成所有翻译」→ 标记原地消失，
            //     confirms=[]、toasts=[]、error=null、failedCount=0，零通知。
            //     （一致性闸门只比第 0 行前 60 个非空白字符，改在第 3 行它一个字都察觉不到；
            //      改在第 1 行倒是会弹一次确认框，但那只是碰巧撞上了尺子。）
            // 这一处和 saveRowUpdate 里 `if (srcChanged) AppState.srcEditedSinceTranslate = true`
            // 是同一件事：**用户**点了「应用」，这就是他认可的原文改动。
            // ⚠️ 上一版这段注释的最后一句写的是「标志一打上，syncInputFromPairs /
            // handleRegenerateAll 就都会拿 pairs 当这份文档的准绳」—— 那句话当时**不成立**：
            // 对话窗挂在 <body> 上，用户可以在 **Edit 视图里**点「应用」，而
            // handleInputChange 的第一件事就是无条件把这面旗清掉。实测（真 handler）：
            // 应用 CHATMARK99 → 在大输入框敲一个词 → TRANSLATE/⟳/AUTO SYNC 三条路都让
            // CHATMARK99 原地消失，confirms=[]、toasts=[]、error=null，逐行 history 2→1，
            // recoverableAnywhere=false。现在这句话由下面那行 xportFoldPairsIntoLiveInput()
            // 兑现：大输入框正开着就当场把改动收进去，收不进去的那种情形由
            // handleInputChange 那条归档兜底（那两段各自写了闸门和它们挡不住什么）。
            if (p.side === 'src') AppState.srcEditedSinceTranslate = true;
            addHistory(p.rowIndex, newSrc, newTgt);      // 内含 setState → 一次整页重渲染（用户主动动作，可接受）
            if (p.side === 'src') xportFoldPairsIntoLiveInput();
            scheduleAlignSync();
            chatAppendRow('system', '已应用到「' + (p.side === 'src' ? '原文' : '译文') + ' 第 '
                + (p.rowIndex + 1) + ' 行」，并记入这一行的历史（用行首的 ↺ 可以撤回）。');
        }

        if (relocated) {
            chatAppendRow('system', '（这一行有过改动，但那段文字在行内唯一存在，已按新位置应用。）');
        }

        p.applied = true;
        if (p.card && p.card.actions) {
            p.card.actions.textContent = '';
            const done = document.createElement('span');
            done.className = 'aichat-card-done';
            done.textContent = '已应用 ✓';
            p.card.actions.appendChild(done);
        }
        try { chatRenderBatchBar(); } catch (e) {}

        // 附加的选段还指着同一处的话，把它挪到替换后的新文本上，用户可以接着说「再短一点」。
        // 挪不动就干脆取消附加，绝不留一个已经失效的 target。
        const t = ChatState.target;
        if (t && t.rowIndex === p.rowIndex && t.side === p.side) {
            const after = chatCaptureTarget(p.rowIndex, p.side, false);
            const liveNow = chatLiveBase(p.rowIndex, p.side);
            const ns = start, ne = start + p.replacement.length;
            if (after && liveNow.substring(ns, ne) === p.replacement) {
                after.start = ns;
                after.end = ne;
                after.text = p.replacement;
                after.whole = (ns === 0 && ne === liveNow.length);
                ChatState.target = after;
            } else {
                ChatState.target = null;
            }
            chatRenderTargetChip();
        }
        chatScrollToBottom();
    } catch (e) {
        console.error('[chat] apply failed', e);
        try { chatErrorRow('应用修改', e); } catch (e2) {}
    }
}

// ============================================================================
// C6 —— 自动文档上下文、用量环、压缩 / 清理、会话历史
// ============================================================================
//
// 【这一段唯一的架构决定，其余全是它的推论】
// 文档上下文**每一轮从 AppState.translationPairs 重新生成**，拼进那一轮最后一条 user 消息，
// 发出去就完了 —— 它**从不**写进 ChatState.messages。
//
// 为什么非要这样：三条验收（压缩后文档仍在 / 清理后第一轮就带全文 / 重译后带的是新文档）
// 可以用一条纪律「记得别压缩文档、记得重译后刷新」来满足，但那条纪律迟早会被后面某一次
// 编辑破坏，而破坏的表现是**模型对着一份过期的论文一本正经地回答**，用户看不出来。
// 把文档从「一条消息」变成「一个每轮现算的函数」之后，这三条不是「不太可能坏」，是**不可能坏**：
// 压缩和清理的手只够得着 ChatState.messages，而文档根本不在那里。
//
// 【尺寸：实测过，它装得下，所以不做花哨的窗口化】
// 用 usage.prompt_tokens 量过（qwen3.6-35b-a3b，中文按实测 0.55 字符比折算）：
//   1 段 750 英文字符 → 双语 517 tok（65536 的 0.8%）
//   3 段 2,087       → 1,197 tok（1.8%）
//   8 段 6,875       → 3,558 tok（5.4%，已经贴着本应用 8000 字符的分批上限）
// 要把 qwen3.8 的 200192 填满，需要一次粘贴约 18 万字符。所以**默认永远发整篇**。
// 降级窗口只作为「病态粘贴」的保险丝存在，触发时行号范围**同时**写进界面和载荷
// （模型才能说「这一轮没给我第 N 行」而不是编一个出来）。**拒绝**的方案是「把文档摘要一下塞进去」：
// 用户在做校对，摘要丢掉的正是他要核对的细节，而且「照着摘要答」和「照着原文答」看起来一模一样。

// —— token 估算 ——
// 【这不是实测值，界面上任何用到它的地方都必须显示成「估算」】
//
// 常数是在 qwen/qwen3.6-35b-a3b 上**用 usage.prompt_tokens 现量出来的**（2026-08-20，
// 每组都是「同一组消息、只加长一段已知字符」的差分，所以模板开销已经被差掉）：
//   · 空的 system+user 两条消息          → 17 tok
//   · 四条空消息                          → 27 tok   ⇒ 每条消息 ≈5 tok，模板固定头 ≈7 tok
//   · 中文 31 字符 ×1 / ×10               → +16 / +160  ⇒ **0.52 tok / CJK 字符**
//   · 英文散文 69 字符 ×1 / ×10           → +13 / +130  ⇒ **0.19 tok / 字符**
//   · LaTeX 69 字符 ×10（\cite{} $x$ 等） → +350        ⇒ **0.51 tok / 字符**
// 最后一行是这个估算器必须分三类的原因：LaTeX 的密度是英文散文的 2.7 倍，
// 用一个「非 CJK」常数盖住两者，在一篇满是 \ref{} 的论文上会低估一大截 ——
// 而低估会被面板算进「模板开销」那一行，让一个本来诚实的残差变成一句谎话。
const CHAT_TOK_CJK = 0.52;      // 中日韩字符
const CHAT_TOK_DENSE = 0.90;    // 反斜杠 / 花括号 / $ ^ _ & % # ~ [] 和数字：LaTeX 记号密度
const CHAT_TOK_OTHER = 0.19;    // 其余（英文散文、空白、普通标点）
const CHAT_TOK_MSG = 5;         // 每条消息的角色标记与分隔符
const CHAT_TOK_BASE = 7;        // chat template 本身的固定头
function chatEstTokens(s) {
    const str = String(s == null ? '' : s);
    let cjk = 0, dense = 0;
    for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        // CJK 统一表意文字 + 兼容表意 + 中日韩标点 + 全角形式。够用即可：它只是估算。
        if ((c >= 0x2E80 && c <= 0x9FFF) || (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFF00 && c <= 0xFF65)) { cjk++; continue; }
        if ((c >= 0x30 && c <= 0x39)                 // 0-9
            || c === 0x5C || c === 0x7B || c === 0x7D  // \ { }
            || c === 0x24 || c === 0x5F || c === 0x5E  // $ _ ^
            || c === 0x26 || c === 0x25 || c === 0x23  // & % #
            || c === 0x7E || c === 0x5B || c === 0x5D) { dense++; }  // ~ [ ]
    }
    return Math.round(cjk * CHAT_TOK_CJK + dense * CHAT_TOK_DENSE
        + (str.length - cjk - dense) * CHAT_TOK_OTHER);
}

// chat template 本身的固定开销（角色标记 + 分隔符）。上面那组差分量出来的：
// 2 条空消息 17 tok、4 条空消息 27 tok ⇒ 7 + 5×条数。这一项是**可以**独立测量的，
// 所以它有资格单独占一行；剩下的残差是估算器的偏差，必须和它分开写。
function chatEstOverhead(msgCount) {
    return CHAT_TOK_BASE + CHAT_TOK_MSG * Math.max(0, Number(msgCount) || 0);
}

// —— 自校准 ——
// 【为什么必须有这一层】上面那些常数是在一段普通中文句子上量的（0.52 tok/字符），
// 但同一个分词器在系统提示那种「中文 + Markdown 星号 + \cite{} 片段」混排的文本上是
// 0.58 tok/字符，在纯 LaTeX 上是 0.51 —— **BPE 的合并率跟着内容走**，一组常数盖不住。
// 实测（qwen3.6，本文件自己的系统提示与文档块）：估算 487 / 实测 695，低 30%。
// 所以每量到一次 usage.prompt_tokens，就按「实测 − 模板固定开销」÷「分项原始估算」
// 反解一个倍率，只用于**下一次的估算显示**，并在面板上明写「按上一轮实测校准 ×k」。
// 它绝不用来伪造分解：分项本身照旧是估算，残差照旧照实写。
const CHAT_CALIB_MIN = 0.5;
const CHAT_CALIB_MAX = 3.0;
function chatCalibFactor(model) {
    try {
        const c = ChatState.calib;
        if (c && c.model === model && isFinite(c.k) && c.k >= CHAT_CALIB_MIN && c.k <= CHAT_CALIB_MAX) return c.k;
    } catch (e) {}
    return 1;
}

// 每行指纹（FNV-1a 32 位）。用途只有一个：闸门「这一行自我发出上下文以来被改过没有」。
// 不是安全哈希，也不需要是 —— 它对抗的是「用户手改了这一行」，不是对抗攻击者。
function chatRowHash(s) {
    const str = String(s == null ? '' : s);
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ('0000000' + h.toString(16)).slice(-8);
}

function chatFmtNum(n) {
    const v = Math.round(Number(n) || 0);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// —— 文档块 ——
// C7（对话上下文收窄）：只给**原文**（左栏，被翻译的那一侧），**不给译文**。
// 用户的原话是「只关联左边的输入内容」——译文是翻译的结果，不是用户在编辑的东西，
// 混进上下文只会让「改这一句」这种指令有时候悄悄落到译文头上。
// 行号写成 [n]。用户说「第 3 行的 xxx 改成 yyy」，模型就能回一个 row=3 的修改块 ——
// 这就是「附加从此可选」的全部机制。
// 信封是纯文本，**不是 JSON**：原文里可能含反斜杠，而 JSON 字符串搬运正是这个项目里
// 把 \ref 变成 CR+ef、把 \textcolor 变成 TAB+extcolor 的那台绞肉机。
function chatDocBody(pairs, from, to) {
    const lines = [];
    for (let i = from; i <= to; i++) {
        const p = pairs[i - 1] || {};
        lines.push('[' + i + '] 原文：' + chatEscapeDelims(String(p.src == null ? '' : p.src)));
    }
    return lines.join('\n');
}

function chatDocFrame(body, from, to, total, windowed) {
    const head = '==DOC rows=' + from + '-' + to + ' total=' + total + '=='
        + '\n本轮上下文：第 ' + from + '–' + to + ' 行（共 ' + total + ' 行）。'
        + '这是**待翻译的原文**，只有原文，没有译文——你看不到、也不知道用户译成了什么。'
        + (windowed
            ? '⚠ 这一份是**截断过的窗口**，范围之外的行你没有看到，被问到时请直说没看到，不要推测。'
            : '这是整篇待翻译的原文，一行不缺。')
        + '\n';
    return head + body + '\n==DOCEND==';
}

// 分母 = 发现到的加载期上下文 − 为回复预留的额度。
// 【绝不写死】上下文是加载期参数，LM Studio 一重启就回落 4096；写死一个 65536 会让环
// 在最需要报警的那天显示 5%。发现不到就**说不知道**，只报绝对 token 数、不报百分比。
function chatCtxWindow() {
    const out = { provider: '', model: '', ctx: 0, reserve: 0, denom: 0, known: false, source: '' };
    try {
        const c = chatModelChoice();
        out.provider = c.provider;
        out.model = c.model;
        out.reserve = chatEffectiveMaxTokens(c.provider);
        if (c.provider === 'local') {
            const caps = xportCapsPeek(AppState.localBaseUrl, c.model);
            if (caps && Number(caps.ctx) > 0) {
                out.ctx = Number(caps.ctx);
                out.known = true;
                out.source = 'GET <origin>/api/v1/models → loaded_instances[0].config.context_length';
            } else {
                // 第二个来源：/api/v0/models 的 loaded_context_length（xportLocalContext 的 60 秒缓存）。
                const hit = xportCtxCache.get(String(AppState.localBaseUrl) + '|' + String(c.model));
                if (hit && Number(hit.ctx) > 0) {
                    out.ctx = Number(hit.ctx);
                    out.known = true;
                    out.source = 'GET <base>/api/v0/models → loaded_context_length';
                }
            }
        }
        out.denom = out.known ? Math.max(0, out.ctx - out.reserve) : 0;
    } catch (e) {}
    return out;
}

// 这一轮的文档上下文。**每次调用都重新读 AppState.translationPairs**。
function chatBuildDocContext() {
    const out = { on: false, text: '', from: 0, to: 0, total: 0, windowed: false,
                  tokens: 0, hashes: null, why: '' };
    try {
        const pairs = Array.isArray(AppState.translationPairs) ? AppState.translationPairs : [];
        out.total = pairs.length;
        if (!ChatState.autoContext) { out.why = '上下文开关是关的'; return out; }
        if (!pairs.length) { out.why = '还没有已翻译的内容'; return out; }

        let from = 1, to = pairs.length;
        let body = chatDocBody(pairs, from, to);

        // —— 保险丝：整篇真的塞不下时才收窄，围绕焦点行取一个**连续**区间 ——
        const w = chatCtxWindow();
        if (w.known && w.denom > 0) {
            // 留给系统提示 / 历史 / 草稿的额度：粗略按分母的四分之一。宁可保守。
            const budget = Math.max(256, Math.floor(w.denom * 0.75));
            // 【按**装好帧**的文本量，不是按裸正文量】帧头那句「本轮上下文：第 x–y 行…」
            // 加上 ==DOCEND== 有几十个 token。只量裸正文的话，窗口刚好卡在预算上时，
            // 真正发出去的那一份必然超预算 —— 第一版就超了 23 tok。
            const framed = function (lo, hi) {
                return chatEstTokens(chatDocFrame(chatDocBody(pairs, lo, hi), lo, hi, out.total, true));
            };
            if (framed(from, to) > budget) {
                const focus = (ChatState.target && ChatState.target.rowIndex >= 0)
                    ? ChatState.target.rowIndex + 1
                    : ((typeof AppState.activeIndex === 'number' && AppState.activeIndex >= 0)
                        ? AppState.activeIndex + 1 : pairs.length);
                let lo = Math.max(1, Math.min(focus, pairs.length));
                let hi = lo;
                for (;;) {
                    let grew = false;
                    if (hi < pairs.length && framed(lo, hi + 1) <= budget) { hi++; grew = true; }
                    if (lo > 1 && framed(lo - 1, hi) <= budget) { lo--; grew = true; }
                    if (!grew) break;
                }
                from = lo; to = hi; body = chatDocBody(pairs, lo, hi);
                out.windowed = true;
            }
        }

        out.on = true;
        out.from = from;
        out.to = to;
        out.text = chatDocFrame(body, from, to, out.total, out.windowed);
        out.tokens = chatEstTokens(out.text);
        // 每行两侧各一个指纹。应用模型提案时靠它判「这一行自我把上下文发出去以来有没有被改过」。
        const h = {};
        for (let i = from; i <= to; i++) {
            const p = pairs[i - 1] || {};
            h[i] = { src: chatRowHash(String(p.src == null ? '' : p.src)),
                     tgt: chatRowHash(String(p.tgt == null ? '' : p.tgt)) };
        }
        out.hashes = h;
    } catch (e) {
        console.error('[chat] buildDocContext failed', e);
        out.on = false; out.text = ''; out.tokens = 0; out.hashes = null;
        out.why = '生成文档上下文时出错：' + ((e && e.message) || e);
    }
    return out;
}

// 把一整轮要发出去的东西装配好。**这是文档唯一进入 wire 的地方**。
// pushed=true：调用方（chatSend）已经把这条 user 消息 push 进 ChatState.messages 了，
//              所以 wire 的最后一条就是它，换成带文档的完整版本。
// pushed=false：用于「下一轮会花多少」的估算，此时把这条假想的 user 消息**追加**上去。
//              （早先这里无条件替换最后一条，估算路径上会把助手那条回复顶掉，算出来偏小。）
// 返回 { wire, sys, doc, parts }，parts 是分项估算（给用量环的分解面板对账用）。
function chatAssembleTurn(draft, pushed) {
    const doc = chatBuildDocContext();
    // 关注块**每一轮也是现算的**，和文档块同一条纪律：它从不写进 ChatState.messages，
    // 所以压缩 / 清理都够不着它，而勾掉一处关注下一轮立刻就不带了。
    // 这里只**解析**关注（解不出来的自己跳过），作废是 focusRevalidate 的事 ——
    // 本函数也被「下一轮大约要花多少」的估算路径调用，估一次算一次绝不能顺手删用户的标记。
    //
    // ⚠️ **跟着上下文开关走**。关注条目带的是稿子里的原文逐字（整行条目就是一整段），
    // 所以它是不折不扣的文档正文。上下文关掉了还照发，等于开关上写着「不发文档」、
    // 实际发了 471 个字节的文档 —— chat-auto-context.md 验收 6 要的是「关掉之后抓包里
    // 没有一个字的文档正文」。关注是**在整篇上下文里加重点**，没有上下文也就无处可加。
    const focusBlock = ChatState.autoContext ? focusWireBlock() : '';
    const sys = chatSystemPrompt(!!ChatState.target, doc.on, !!focusBlock);
    const wire = chatWireHistory();
    // 关注块跟着「这一轮的提问」一起计入 draft 那一项 —— 它和附加选段一样，是最后一条 user 消息的一部分。
    const tail = (focusBlock ? focusBlock + '\n\n' : '') + chatBuildTargetTurn(draft, !doc.on);
    const full = (doc.on ? doc.text + '\n\n' : '') + tail;
    if (pushed && wire.length) wire[wire.length - 1] = { role: 'user', content: full };
    else wire.push({ role: 'user', content: full });
    let hist = 0;
    for (let i = 0; i < wire.length - 1; i++) hist += chatEstTokens(wire[i].content);
    // 【推理自成一项】开着「回传思考」时，chatWireContent 会把上一轮的推理原样塞回历史里，
    // 那些 token 是**真的**要进上下文的。把它埋在「对话历史」里，用户就看不出「回传思考」
    // 到底让他多花了多少 —— 而那正是这个开关唯一需要被看见的代价。
    // 所以这里把它单列一项，并从 history 里**减掉**，四项之和仍然等于原来的总量、对账不受影响。
    const reasoningBack = chatWireReasoningCost();
    return {
        wire: wire,
        sys: sys,
        doc: doc,
        parts: {
            system: chatEstTokens(sys),
            document: doc.on ? doc.tokens : 0,
            history: Math.max(0, hist - reasoningBack),
            reasoning: reasoningBack,
            draft: chatEstTokens(tail)
        }
    };
}

// 这一轮真正会被回传的「上一轮思考」值多少 token。
// 只在 keepReasoning 开着时非零，而且只统计**真正会发出去的那几条**（chatWireHistory 的窗口内），
// 否则报出来的是一个用户永远不会被收费的数字 —— 压缩预估上已经栽过一次同样的跟头。
function chatWireReasoningCost() {
    try {
        if (!ChatState.keepReasoning) return 0;
        const msgs = ChatState.messages;
        let start = Math.max(0, msgs.length - CHAT_HISTORY_MSGS);
        while (start < msgs.length && msgs[start].role !== 'user') start++;
        let t = 0;
        for (let i = start; i < msgs.length; i++) {
            const m = msgs[i];
            if (!m || m.role !== 'assistant') continue;
            const r = String(m.reasoning == null ? '' : m.reasoning);
            if (!r.trim()) continue;
            // 和 chatWireContent 里那段包装逐字对应（两个标签行也要算进去）。
            t += chatEstTokens('[上一轮的思考过程]\n' + chatEscapeDelims(r) + '\n[/上一轮的思考过程]\n');
        }
        return t;
    } catch (e) { return 0; }
}

// 分项求和。**一个地方定义**：估算路径和实测对账路径必须用同一条求和式，否则加了一项
// （比如「回传的思考」）却只改了一边，残差就会凭空多出/少掉那一项，而面板会显得像是估算变差了。
function chatPartsSum(p) {
    if (!p) return 0;
    return (Number(p.system) || 0) + (Number(p.document) || 0) + (Number(p.history) || 0)
         + (Number(p.reasoning) || 0) + (Number(p.draft) || 0);
}

// 当前上下文的「身份」。和上一次实测时的身份一致 ⇒ 环继续显示那个实测值；只要有一处变了
// （又打了字、又发了一条、文档被重译、换了模型、开关了上下文、附/取消了选段）⇒ 立刻退回估算。
// 刻意**不**把分项估算放进身份里：那样估算器的舍入会让身份莫名其妙地失配。
function chatCtxSig(docSig, draftLen) {
    const c = chatModelChoice();
    // keepReasoning 也在身份里：它一开一关，实际发出去的载荷就差了整整一份思考文本，
    // 那时候还把上一轮的实测值当作「现在的用量」显示，就是拿一个已经失效的测量在充数。
    return [ChatState.messages.length, docSig, draftLen, c.provider + ':' + c.model,
            ChatState.autoContext ? 1 : 0, ChatState.target ? 1 : 0,
            ChatState.keepReasoning ? 1 : 0, focusSig()].join('|');
}

// 环要显示什么。
//   measured=true  → 分子是上一轮服务器回报的 usage.prompt_tokens（实测，实线）
//   measured=false → 分子是「下一轮大约要花多少」的估算（虚线 + ≈）
// 这两个是**不同的量**，所以它们在界面上必须长得不一样，提示里也说清楚了。
function chatCtxReadout() {
    const ta = document.getElementById('aiChatInput');
    const draft = ta ? String(ta.value || '') : '';
    const a = chatAssembleTurn(draft, false);
    const docSig = chatRowHash(a.doc.text);
    const sig = chatCtxSig(docSig, draft.length);
    const sum = chatPartsSum(a.parts);
    const u = ChatState.usage;
    const c = chatModelChoice();
    const sameModel = !!(u && u.model === (c.provider + ':' + c.model));
    // 上一轮量到的模板开销可以继续用来改进估算（同一个模型 = 同一份 chat template）。
    // 量不到就写 0，并在面板里说明「尚未测量」—— 不许把它摊进别的分项里假装准。
    const modelKey = c.provider + ':' + c.model;
    const k = chatCalibFactor(modelKey);
    const templateOverhead = chatEstOverhead(a.wire.length + 1);   // +1 = system 那一条
    const calibAdj = Math.round((k - 1) * sum);                    // 「按上一轮实测校准」那一行
    const measured = !!(u && u.sig === sig && u.promptTokens > 0);
    return {
        assembled: a,
        parts: a.parts,           // 原始估算，**不带**校准 —— 校准单独占一行，不掺进分项里
        sum: sum,
        sig: sig,
        measured: measured,
        templateOverhead: templateOverhead,
        calibK: k,
        calibAdj: calibAdj,
        calibrated: sameModel && k !== 1,
        tokens: measured ? u.promptTokens : (sum + templateOverhead + calibAdj),
        window: chatCtxWindow()
    };
}

// —— 环 ——
// 典型占用是 0.8%~5.4%，环上就是一条细缝。**不许为了好看把它放大** —— 那条细缝正是
// 「你还有的是地方」这个有用信号。只是 0.8% 的弧在 8px 半径上不足半个像素，
// 所以给一个最小可见刻度，并在提示里说明「真实比例以数字为准」。
function chatArcPath(cx, cy, r, frac) {
    let f = Number(frac);
    if (!isFinite(f) || f <= 0) return '';
    if (f >= 1) f = 0.9999;
    const a = -Math.PI / 2 + f * 2 * Math.PI;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    const large = f > 0.5 ? 1 : 0;
    return 'M ' + cx + ' ' + (cy - r) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 '
        + x.toFixed(3) + ' ' + y.toFixed(3);
}

function chatRingHtml(ro) {
    const w = ro.window;
    const frac = (w.known && w.denom > 0) ? (ro.tokens / w.denom) : 0;
    const shown = (frac > 0 && frac < 0.02) ? 0.02 : frac;      // 最小可见刻度
    const d = chatArcPath(11, 11, 8, shown);
    const pct = (w.known && w.denom > 0) ? (frac * 100) : null;
    const label = (ro.measured ? '' : '≈') + chatFmtNum(ro.tokens)
        + (pct === null ? ' tok' : (' / ' + chatFmtNum(w.denom) + '  ' + pct.toFixed(pct < 10 ? 1 : 0) + '%'));
    const tip = (ro.measured
            ? '实线 = 实测值：这就是上一轮服务器回报的 usage.prompt_tokens，不是估算。'
            : '虚线 + ≈ = 估算值：这一轮还没发出去（或者内容自上次实测后变了），'
              + '所以这个数字是本工具按字符数算的，不是服务器量的。发出去之后它会变成实线的实测值。')
        + (w.known
            ? '分母 = 发现到的加载期上下文 ' + chatFmtNum(w.ctx) + ' − 为回复预留的 '
              + chatFmtNum(w.reserve) + ' = ' + chatFmtNum(w.denom) + '。'
              + '上下文长度是**现问出来的**（' + w.source + '），没有写死 —— LM Studio 一重启它就回落 4096。'
            : '这个提供方没有可发现的上下文长度，所以只报绝对 token 数、不报百分比（写死一个数字就是撒谎）。')
        + '低于 2% 时环上画的是一个最小可见刻度，真实比例以旁边的数字为准。点一下看分项。';
    return '<button type="button" class="aichat-ringchip' + (ro.measured ? '' : ' is-est') + '" id="aiChatRingBtn"'
        + ' data-tip="' + escapeAttr(tip) + '" data-tip-pos="top-start">'
        + '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">'
        + '<circle class="aichat-ring-track" cx="11" cy="11" r="8"></circle>'
        + (d ? '<path class="aichat-ring-arc" d="' + d + '"></path>' : '')
        + '</svg><span>' + escapeHtml(label) + '</span></button>';
}

// 底部状态条：环 + 上下文开关 + 会话 + 「历史怎么裁的」那句老话。
// 历史长了要花的是用户的钱（在线模型），不告诉他等于替他做决定。
function chatUpdateBar() {
    try {
        const bar = document.getElementById('aiChatBar');
        if (!bar) return;
        // 关注清单和状态条一起刷新：它就在输入框上方，用户永远看得见「这一轮会带哪几处重点」。
        try { focusRenderChip(); } catch (eF) {}
        const ro = chatCtxReadout();
        const doc = ro.assembled.doc;

        const ctxTip = ChatState.autoContext
            ? '开着：每一轮都把**左栏整篇原文**（只有原文，没有译文——模型看不到译文）按 [行号] '
              + '重新生成一遍发过去（不是存下来的旧副本）。'
              + '所以压缩之后原文还在、清理之后第一轮就带全文、重译之后带的是新原文。'
              + '关掉之后 ==DOC== 文档块和 ==FOCUS== 关注块都不再发；但**窗口里已有的对话轮次照旧会发**，'
              + '而模型早先的回答里可能引用过你的原文 —— 要连那些一起断掉得再点「清理」。'
            : '关着：这一轮既不发 ==DOC== 文档块，也不发 ==FOCUS== 关注块（关注条目带的就是稿子原文，'
              + '它跟着这个开关走）。注意它只管这两块：窗口里已有的对话轮次照旧会发，'
              + '而模型早先的回答里可能引用过你的原文。要连那些一起断掉，用「清理」开一段新对话。';
        // 【这颗按钮的字必须说的是「开关本身」，不是「这一轮碰巧有没有内容可发」】
        // 早先没内容时它写「文档 关（还没有已翻译的内容）」，而开关其实是**开**的、按钮还带着
        // is-on。用户照字面意思去点，反倒把上下文真的关掉了 —— 一个标签把用户推去做它警告的事。
        const docLabel = doc.on
            ? ('文档 ' + doc.from + '–' + doc.to + '/' + doc.total + ' 行' + (doc.windowed ? '（已截窗）' : ''))
            : (ChatState.autoContext
                ? ('文档 开' + (doc.why ? '（' + doc.why + '）' : ''))
                : '文档 关（点一下打开）');

        bar.innerHTML = '<div class="aichat-ctxrow">'
            + chatRingHtml(ro)
            + '<button type="button" class="aichat-minibtn' + (ChatState.autoContext ? ' is-on' : '') + '"'
            + ' id="aiChatCtxToggle" data-tip="' + escapeAttr(ctxTip) + '" data-tip-pos="top">'
            + escapeHtml(docLabel) + '</button>'
            + '<span class="aichat-pspacer"></span>'
            + '<button type="button" class="aichat-minibtn' + (ChatState.panel === 'history' ? ' is-on' : '') + '"'
            + ' id="aiChatHistBtn" data-tip="'
            + escapeAttr('会话历史。清理 / 压缩 / 换文档时，走掉的那份对话先存进这里再说，'
                + '删除是另一个要确认的动作。最多留 ' + CHAT_ARCHIVE_MAX + ' 份、共 '
                + Math.round(CHAT_ARCHIVE_BYTES / 1024) + ' KB，超了从最老的删，并且会告诉你删了哪几份。'
                + '这份存储和翻译历史各用各的 key —— 聊天再多也挤不掉你的文档。')
            + '" data-tip-pos="top-end">会话</button>'
            + '</div>';

        const n = ChatState.messages.length;
        if (n > 0) {
            const sent = Math.min(n, CHAT_HISTORY_MSGS);
            const div = document.createElement('div');
            div.className = 'aichat-status';
            div.textContent = n > CHAT_HISTORY_MSGS
                ? '共 ' + n + ' 条消息；每轮只把最近 ' + sent + ' 条发给模型（更早的不再发，但仍留在窗口里）。'
                : '共 ' + n + ' 条消息，全部会随下一轮发给模型。';
            bar.appendChild(div);
        }

        const ring = bar.querySelector('#aiChatRingBtn');
        if (ring) ring.addEventListener('click', function () { chatTogglePanel('ctx'); });
        const ctxBtn = bar.querySelector('#aiChatCtxToggle');
        if (ctxBtn) ctxBtn.addEventListener('click', function () { chatSetAutoContext(!ChatState.autoContext); });
        const histBtn = bar.querySelector('#aiChatHistBtn');
        if (histBtn) histBtn.addEventListener('click', function () { chatTogglePanel('history'); });

        chatRenderPanel(ro);
    } catch (e) {
        console.error('[chat] updateBar failed', e);
    }
}

// 打字时重画环（防抖）。**不**走 setState，只重画这一条 —— 和参数条同一条纪律。
function chatRingSoon() {
    try {
        if (ChatState.ringTimer) clearTimeout(ChatState.ringTimer);
        ChatState.ringTimer = setTimeout(function () {
            ChatState.ringTimer = null;
            try { chatUpdateBar(); } catch (e) {}
        }, 220);
    } catch (e) {}
}

function chatSetAutoContext(on) {
    try {
        ChatState.autoContext = !!on;
        chatParamsSave();
        chatUpdateBar();
        chatAppendRow('system', on
            ? '已打开文档上下文：从这一轮起，每次提问都会把左栏整篇原文（按 [行号] 编号，不含译文）一并发过去。'
            : '已关闭文档上下文：从这一轮起不再发送 ==DOC== 文档块，也不再发送 ==FOCUS== 关注块'
              + '（关注条目带的就是稿子原文，它跟着这个开关走）。'
              + '⚠ 但**已经在窗口里的对话轮次照旧会发**，而模型早先的回答里可能引用过你的原文'
              + '（实测：关掉开关之后，助手上一轮那句「时延满足 $\\alpha_i \\le \\beta$」仍然在历史里发了出去）。'
              + '要连这些一起断掉，请用「清理」开一段新对话 —— 开关关着 + 对话清空，才是一个字节的文档都不带。');
    } catch (e) { console.error('[chat] setAutoContext failed', e); }
}

function chatTogglePanel(name) {
    try {
        ChatState.panel = (ChatState.panel === name) ? '' : String(name || '');
        if (ChatState.panel !== 'ctx') ChatState.pendingCompact = null;
        chatUpdateBar();
    } catch (e) { console.error('[chat] togglePanel failed', e); }
}

// —— 推理在分解面板里的那两行 ——
// 【为什么是两行而不是一行】推理有两笔完全不同的账，混成一行必然误导：
//   · **输入侧**：开着「回传思考」时，上一轮的推理文本被我们塞回历史里重新发出去。
//     这一笔真的占用上下文，所以它进上面那组分项、参与四项求和与残差对账。
//   · **输出侧**：usage.completion_tokens_details.reasoning_tokens，是模型这一轮**生成**的推理量。
//     它属于 completion，不占 prompt。把它加进输入侧的合计，「四项 + 残差 = 实测 prompt_tokens」
//     这条恒等式当场就假了 —— 所以它单列，并且明写「不计入上面的输入对账」。
// 两笔都为 0 时一行都不画（推理关着的时候不该有任何空行占位）。
function chatReasoningSliceRows(kv, backTokens, outTokens) {
    try {
        const back = Number(backTokens) || 0;
        const out = Number(outTokens) || 0;
        if (back > 0) {
            const r = kv('思考回传（计入输入）', '≈' + chatFmtNum(back) + ' tok');
            r.setAttribute('data-tip', '「回传思考」开着，所以上一轮的推理正文被原样放回对话历史里重新发了出去。'
                + '这一笔是**真的**占上下文的，所以它就在上面那组分项里参与求和与对账（已从「对话历史」中扣出来单列，'
                + '免得它被埋在里面看不见 —— 那样这个开关的代价就成了隐形的）。关掉「回传思考」这一行就归零。');
            r.setAttribute('data-tip-pos', 'top');
        }
        if (out > 0) {
            const r2 = kv('上一轮思考产出（生成侧）', chatFmtNum(out) + ' tok');
            r2.setAttribute('data-tip', '实测 usage.completion_tokens_details.reasoning_tokens：'
                + '模型上一轮**生成**的推理量。它属于 completion，不占 prompt，'
                + '所以**不计入**上面的输入对账 —— 加进去会让「四项估算 + 残差 = 实测 prompt_tokens」变成假的。'
                + '列在这里是因为这些 token 照样是花掉的（在线模型上是真金白银），'
                + '而且开着「回传思考」时它下一轮就会变成上面那一行的输入成本。');
            r2.setAttribute('data-tip-pos', 'top');
        }
    } catch (e) {}
}

// —— 分解面板 ——
// 【开销那一项不是可选的】分项之和**不会**等于 usage.prompt_tokens：服务器的 chat template
// 还要加角色标记和分隔符。把这个残差悄悄摊进各项里，面板就在按百分之几撒谎。所以显示出来，
// 并和实测总数当场对账。
function chatCtxPanelNode(ro) {
    const box = document.createElement('div');
    box.className = 'aichat-panel';
    const w = ro.window;

    const h = document.createElement('div');
    h.className = 'aichat-panel-h';
    h.textContent = ro.measured ? '上下文用量（实测）' : '上下文用量（估算）';
    box.appendChild(h);

    const note = document.createElement('div');
    note.className = 'aichat-panel-note';
    note.textContent = w.known
        ? ('分母 ' + chatFmtNum(w.denom) + ' = 加载期上下文 ' + chatFmtNum(w.ctx)
           + ' − 回复预留 ' + chatFmtNum(w.reserve) + '（= 本轮真正发出去的 max_tokens）。'
           + '上下文长度来自发现：' + w.source + '，没有写死。')
        : '这个提供方没有可发现的上下文长度，所以不报百分比 —— 写死一个数字就是撒谎。';
    box.appendChild(note);

    const kv = function (k, v, cls) {
        const d = document.createElement('div');
        d.className = 'aichat-kv' + (cls ? ' ' + cls : '');
        const a = document.createElement('span'); a.textContent = k;
        const b = document.createElement('span'); b.textContent = v;
        d.appendChild(a); d.appendChild(b);
        box.appendChild(d);
        return d;
    };

    const u = ChatState.usage;
    if (ro.measured && u) {
        // 【这一栏的诚实边界】总数是实测的，分项**不是** —— 服务器不按组成部分报账。
        // 所以四个分项写成「≈」，残差那一行的名字必须同时点出它包含估算偏差，
        // 而不能只写「模板开销」假装它是纯粹的模板成本。
        kv('系统提示（估算）', '≈' + chatFmtNum(u.parts.system) + ' tok');
        kv('文档上下文（估算）', '≈' + chatFmtNum(u.parts.document) + ' tok');
        kv('对话历史（估算）', '≈' + chatFmtNum(u.parts.history) + ' tok');
        chatReasoningSliceRows(kv, u.parts.reasoning, u.reasoningTokens);
        kv('本轮提问（估算）', '≈' + chatFmtNum(u.parts.draft) + ' tok');
        const resRow = kv('模板开销 + 估算偏差（实测残差）', chatFmtNum(u.overhead) + ' tok');
        resRow.setAttribute('data-tip', '这一行是「实测总数 − 上面各项估算之和」。它含两样东西：'
            + '服务器 chat template 加的角色标记与分隔符（可独立测量，见下一行），'
            + '以及本工具字符估算器自身的偏差。**不把它摊进上面各项**，是这个面板不撒谎的唯一办法。');
        resRow.setAttribute('data-tip-pos', 'top');
        kv('其中 · 模板固定开销（实测标定 7+5×条）', '≈' + chatFmtNum(u.templateOverhead || 0) + ' tok');
        kv('各项估算 + 残差', chatFmtNum(u.sum + u.overhead) + ' tok', 'is-sum');
        const okRow = kv('实测 usage.prompt_tokens', chatFmtNum(u.promptTokens) + ' tok',
                         (u.sum + u.overhead === u.promptTokens) ? 'is-ok' : 'is-bad');
        okRow.setAttribute('data-tip', '对账行。两者相等说明残差记账没漏；它**不**说明分项估得准。');
        okRow.setAttribute('data-tip-pos', 'top');
        const acc = document.createElement('div');
        acc.className = 'aichat-panel-note';
        const est = u.sum;
        const err = u.promptTokens > 0 ? ((est - u.promptTokens) / u.promptTokens * 100) : 0;
        acc.textContent = '上一轮：各项估算合计 ' + chatFmtNum(est) + '，实测总数 ' + chatFmtNum(u.promptTokens)
            + '，差 ' + (err >= 0 ? '+' : '−') + Math.abs(err).toFixed(1) + '%。'
            + (err > 0
                ? '⚠ 估算比实测还高，残差被压到 0，两行对不上 —— 这种时候只有实测总数可信。'
                : '扣掉可独立测量的模板固定开销之后，剩下的就是字符估算器的偏差；'
                  + '它已经被折成一个倍率（×' + (u.calibK || 1).toFixed(2) + '），只用于下一次的**估算**显示。');
        box.appendChild(acc);
    } else {
        kv('系统提示', '≈' + chatFmtNum(ro.parts.system) + ' tok');
        kv('文档上下文', '≈' + chatFmtNum(ro.parts.document) + ' tok');
        kv('对话历史', '≈' + chatFmtNum(ro.parts.history) + ' tok');
        chatReasoningSliceRows(kv, ro.parts.reasoning,
                               (ChatState.usage && ChatState.usage.reasoningTokens) || 0);
        kv('当前草稿', '≈' + chatFmtNum(ro.parts.draft) + ' tok');
        kv('模板固定开销（实测标定 7+5×条）', '≈' + chatFmtNum(ro.templateOverhead) + ' tok');
        if (ro.calibrated) kv('按上一轮实测校准 ×' + ro.calibK.toFixed(2), (ro.calibAdj >= 0 ? '+' : '−')
            + chatFmtNum(Math.abs(ro.calibAdj)) + ' tok');
        kv('合计（估算）', '≈' + chatFmtNum(ro.tokens) + ' tok', 'is-sum');
        const n2 = document.createElement('div');
        n2.className = 'aichat-panel-note';
        n2.textContent = ro.calibrated
            ? '这一轮还没发出去，所以整栏都是估算。字符估算器的系统性偏差已按上一轮实测折成倍率单列一行，'
              + '没有掺进上面各项里。'
            : '这一轮还没发出去，这个模型也还没量过一次，所以没有校准倍率。'
              + '字符估算器在中文混排文本上实测会偏低约三成 —— 发一轮之后这里会自动校准。';
        box.appendChild(n2);
    }

    const doc = ro.assembled.doc;
    const dn = document.createElement('div');
    dn.className = 'aichat-panel-note';
    dn.textContent = doc.on
        ? ('文档上下文：第 ' + doc.from + '–' + doc.to + ' 行（共 ' + doc.total + ' 行）'
           + (doc.windowed ? '。⚠ 已按预算截窗，范围写在了载荷里，模型被问到范围外的行会说没看到。'
                           : '。整篇都在，每一轮重新生成，不是存下来的副本。'))
        : ('文档上下文：未发送（' + (doc.why || '已关闭') + '）。');
    box.appendChild(dn);

    // —— 压缩预估：先给数，再动手 ——
    if (ChatState.pendingCompact) {
        const pc = ChatState.pendingCompact;
        const warn = document.createElement('div');
        warn.className = 'aichat-panel-note';
        warn.textContent = '压缩会把最早的 ' + pc.foldCount + ' 条消息折成一条机械摘要，'
            + '保留最近 ' + pc.keepCount + ' 条原文。**真正发出去的**那部分对话历史（每轮只带最近 '
            + CHAT_HISTORY_MSGS + ' 条）预计从 ≈' + chatFmtNum(pc.before)
            + ' tok 降到 ≈' + chatFmtNum(pc.after) + ' tok，省 ≈' + chatFmtNum(pc.before - pc.after)
            + ' tok。文档上下文一个字节都不动。原始记录会先存进「会话」。';
        box.appendChild(warn);
    }

    const acts = document.createElement('div');
    acts.className = 'aichat-panel-actions';
    const mk = function (text, tip, danger, fn) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'aichat-minibtn' + (danger ? ' is-danger' : '');
        b.textContent = text;
        b.setAttribute('data-tip', tip);
        b.setAttribute('data-tip-pos', 'top-start');
        b.addEventListener('click', fn);
        acts.appendChild(b);
        return b;
    };
    if (ChatState.pendingCompact) {
        mk('确认压缩', '按上面那组数字执行。执行前先把当前完整记录存进「会话」，所以原始对话不会消失。',
           false, function () { chatCompactRun(); });
        mk('取消', '不压缩，什么都不动。', false, function () {
            ChatState.pendingCompact = null; chatUpdateBar();
        });
    } else {
        mk('压缩', '把较早的**对话轮次**折成一条摘要，**绝不**碰文档上下文（文档每轮现生成，'
                 + '压缩的手根本够不着它）。点了先看预估，再决定要不要执行。', false,
           function () { chatCompactStart(); });
        mk('清理', '归档当前对话并开一段新的。走掉的那份立刻能在「会话」里找回来 —— 删除是另一个动作。',
           false, function () { chatClearConversation(); });
    }
    box.appendChild(acts);
    return box;
}

function chatRenderPanel(ro) {
    try {
        const slot = document.getElementById('aiChatPanel');
        if (!slot) return;
        slot.textContent = '';
        if (ChatState.panel === 'ctx') {
            slot.appendChild(chatCtxPanelNode(ro || chatCtxReadout()));
        } else if (ChatState.panel === 'history') {
            slot.appendChild(chatHistoryPanelNode());
        }
    } catch (e) {
        console.error('[chat] renderPanel failed', e);
    }
}

// —— 压缩 ——
// 【这条区分是承重的】chat-auto-context 拒绝摘要**文档**，因为用户在做校对，摘要丢掉的
// 正是他要核对的细节。那个理由管的是译文行，**不管**聊天轮次。所以压缩只动 messages。
const CHAT_COMPACT_KEEP = 4;      // 最近这么多条保留原文
const CHAT_COMPACT_HEAD = 120;    // 折叠的每一条保留开头多少字

// 【压缩到底省了什么，必须按「真正会发出去的那几条」算】
// chatWireHistory 每轮只带最近 CHAT_HISTORY_MSGS 条，窗口里留着的更早的消息一个 token 都不花。
// 按「全部消息」算省了多少，报出来的是一个用户永远不会被收费的数字 —— 那是一句好听的假话。
// （第一版就是这么算的，实测projection 说「107 → 150，省 −43」：摘要那段固定说明比被折叠的
//   四条短消息还长，而 before 又把根本不会发的消息算了进去。两个错叠在一起。）
function chatWireCostOf(msgs) {
    let start = Math.max(0, msgs.length - CHAT_HISTORY_MSGS);
    while (start < msgs.length && msgs[start].role !== 'user') start++;
    let t = 0;
    for (let i = start; i < msgs.length; i++) t += chatEstTokens(chatWireContent(msgs[i]));
    return t;
}

function chatCompactDigest(msgs) {
    const lines = ['[系统] 以下是更早对话的**机械摘要**：由本工具按「每条截取开头」生成，'
        + '没有调用任何模型，因此不会编造，但也确实丢掉了被截掉的部分。'];
    for (let i = 0; i < msgs.length; i++) {
        const m = msgs[i] || {};
        const who = m.role === 'assistant' ? '助手' : '用户';
        const raw = String((m.role === 'assistant' ? (m.prose || m.content) : m.content) || '')
            .replace(/\s+/g, ' ').trim();
        const cut = raw.length > CHAT_COMPACT_HEAD ? raw.slice(0, CHAT_COMPACT_HEAD) + '…（已截断）' : raw;
        lines.push('· ' + who + '：' + cut);
    }
    return chatEscapeDelims(lines.join('\n'));
}

function chatCompactStart() {
    try {
        const msgs = ChatState.messages;
        const w = chatCtxWindow();
        const doc = chatBuildDocContext();
        // 文档本身就超窗时，压缩对话是白费力气 —— 直说，别装作做了点什么。
        if (w.known && w.denom > 0 && doc.on && doc.tokens > w.denom) {
            ChatState.pendingCompact = null;
            chatUpdateBar();
            chatAppendRow('error', '压缩帮不上忙：光是文档上下文就要 ≈' + chatFmtNum(doc.tokens)
                + ' tok，已经超过可用窗口 ' + chatFmtNum(w.denom)
                + ' tok。把对话压缩到零也装不下。请减少粘贴的段落，或者把「文档」开关关掉再问。');
            return;
        }
        if (msgs.length <= CHAT_COMPACT_KEEP + 1) {
            ChatState.pendingCompact = null;
            chatUpdateBar();
            chatAppendRow('system', '现在一共只有 ' + msgs.length + ' 条消息，没有可折叠的更早轮次。');
            return;
        }
        const foldCount = msgs.length - CHAT_COMPACT_KEEP;
        const fold = msgs.slice(0, foldCount);
        const keep = msgs.slice(foldCount);
        const before = chatWireCostOf(msgs);
        const after = chatWireCostOf([{ role: 'user', content: chatCompactDigest(fold), compacted: true }].concat(keep));
        // 省不出来就**不做**。压缩一次是不可逆的信息损失（原文只剩归档里那一份），
        // 拿它换一个负数或者零，是「做了点什么」而不是「有用」。
        if (after >= before) {
            ChatState.pendingCompact = null;
            chatUpdateBar();
            chatAppendRow('system', '这次压缩不划算，所以没做：每轮只把最近 ' + CHAT_HISTORY_MSGS
                + ' 条发给模型，更早的本来就不花 token；把最早的 ' + foldCount + ' 条折成摘要之后，'
                + '会发出去的部分是 ≈' + chatFmtNum(after) + ' tok，比现在的 ≈' + chatFmtNum(before)
                + ' tok 还多（摘要那段说明本身也要占字数）。等对话里出现几条长回复之后再压缩才有意义。');
            return;
        }
        ChatState.pendingCompact = { foldCount: foldCount, keepCount: keep.length, before: before, after: after };
        ChatState.panel = 'ctx';
        chatUpdateBar();
    } catch (e) {
        console.error('[chat] compactStart failed', e);
        try { chatErrorRow('压缩预估', e); } catch (e2) {}
    }
}

function chatCompactRun() {
    try {
        const pc = ChatState.pendingCompact;
        if (!pc) return;
        const msgs = ChatState.messages;
        if (msgs.length <= CHAT_COMPACT_KEEP + 1) { ChatState.pendingCompact = null; chatUpdateBar(); return; }

        // 先归档：压缩之前那份完整记录**永远不会被销毁**。
        // snapshot:true —— 这是一个时间点的备份，必须是独立的一条，绝不能去 upsert 当前这段对话
        // （那样它会被压缩之后的每一次归档反手覆盖掉，「原文可恢复」就成了空话）。
        const arch = chatArchivePush('压缩前的完整记录', { snapshot: true });
        const fold = msgs.slice(0, msgs.length - CHAT_COMPACT_KEEP);
        const keep = msgs.slice(msgs.length - CHAT_COMPACT_KEEP);
        const before = chatWireCostOf(msgs);

        const digest = { role: 'user', content: chatCompactDigest(fold), compacted: true };
        ChatState.messages = [digest].concat(keep);
        const after = chatWireCostOf(ChatState.messages);

        ChatState.pendingCompact = null;
        ChatState.usage = null;               // 上一次实测已经不对应现在的上下文了
        chatAppendRow('system', '已压缩：把最早的 ' + fold.length + ' 条折成一条机械摘要，保留最近 '
            + keep.length + ' 条原文。会发出去的对话历史 ≈' + chatFmtNum(before) + ' → ≈' + chatFmtNum(after)
            + ' tok（省 ≈' + chatFmtNum(before - after) + '）。'
            + '**文档上下文一个字节都没动** —— 它每一轮从文档现生成，压缩根本碰不到它。'
            + (arch && arch.ok ? '压缩前的完整记录已存进「会话」，随时可以取回。'
                               : '⚠ 压缩前的记录**没能存进「会话」**（' + ((arch && arch.why) || '存储写入失败')
                                 + '）—— 上面窗口里的内容仍在，但关掉页面就没了。'));
        chatUpdateBar();
        chatScrollToBottom();
    } catch (e) {
        console.error('[chat] compactRun failed', e);
        try { chatErrorRow('压缩', e); } catch (e2) {}
    }
}

// —— 清理 = 归档 + 开新的。删除是另一个要确认的动作（见会话面板）。——
// ⚠️ **绝不碰 FocusState**：额外关注属于用户的稿子，不属于这一段对话。
//    用户开一段新对话，是因为话题变了，不是因为他不再关心自己标出来的那几处。
//    （同理，文档上下文也不受影响 —— 它每轮现算，压根不在 messages 里。）
function chatResetConversation() {
    ChatState.messages = [];
    ChatState.proposals = [];
    ChatState.target = null;
    ChatState.usage = null;
    ChatState.lastSent = null;
    ChatState.docSnapshot = null;
    ChatState.pendingCompact = null;
    // 身份也一起清掉：接下来装进来的是**另一段**对话（新开的，或者从归档取回的那一段），
    // 留着上一段的 convId 会让下一次归档去覆盖上一段。取回归档的那条路会在装完之后自己认领 id。
    ChatState.convId = '';
    try {
        const log = document.getElementById('aiChatLog');
        if (log) log.textContent = '';
    } catch (e) {}
    try { chatRenderTargetChip(); } catch (e) {}
    try { chatRenderBatchBar(); } catch (e) {}
}

function chatClearConversation() {
    try {
        if (!ChatState.messages.length) {
            chatAppendRow('system', '当前对话是空的，没有需要归档的内容。');
            return;
        }
        const arch = chatArchivePush('清理');
        const n = ChatState.messages.length;
        // 【存不下就不清】清理的合约是「归档 + 开新的」，归档失败时照样清空，
        // 那这个动作就从「归档」变成了「销毁」—— 而它在界面上叫「清理」，用户点它时
        // 完全不认为自己在删东西。所以：写不进去就**原地不动**，把补救办法说清楚。
        // （换文档那条路不一样：文档已经换了，旧对话的行号对不上新文档，留着更误导，
        //   那边只能清并且如实报告归档失败。）
        if (!(arch && arch.ok)) {
            chatAppendRow('error', '没有清理，一条都没动。归档失败：'
                + ((arch && arch.why) || '存储写入失败') + '。'
                + '如果这时候照样清空窗口，这 ' + n + ' 条对话就**永久没了** —— 「清理」不该是「销毁」。'
                + '请先到「会话」里删掉几份用不上的旧对话腾出空间，再点一次清理。');
            return;
        }
        // 【在飞的那一轮必须在这里当场了结】归档已经成功、马上就要清空了。这时候如果上一轮
        // 请求还在路上，它回来时会往**用户刚刚亲手清空的新对话**里塞一条没有提问的孤儿助手
        // 消息，然后 chatSend 末尾的自动存档再把这条孤儿单独存成第二份归档 ——
        // 一问一答被劈成两份，两份都不完整（实测：点 SEND 后 200ms 点「+」，归档变成
        // ['自动存档' 只有 assistant, '清理' 只有 user]）。
        // 处理方式和 chatSend 开头对上一轮的处理逐字一致：先 abort，再 ++seq 让陈旧守卫
        // 认出它。差别只有一处 —— 那边紧接着有新的一轮把 busy 重新点亮，这里没有，
        // 而被 ++seq 判成陈旧的那一轮走不到自己 finally 里的收尾（`mySeq === ChatState.seq`
        // 不成立），所以 busy / abort 必须由这里自己收干净，否则 SEND 会永远卡在 STOP。
        // 放在归档成功之后：归档失败那条路的合约是「一条都没动」，不能顺手把请求掐了。
        const wasBusy = !!ChatState.busy;
        if (wasBusy) {
            chatStop();
            ChatState.seq = (Number(ChatState.seq) || 0) + 1;
            ChatState.abort = null;
            chatSetBusy(false);
        }
        chatResetConversation();
        ChatState.panel = '';
        // 新对话 ⇒ 采用「设置 → 模型 → 默认模型」里对话那一行。这正是那一行的定义。
        const adopted = chatAdoptDefaults();
        chatAppendRow('system', '已开始新对话（' + n + ' 条消息已归档）。'
            + '刚才那段在「会话」里，点进去就能取回；删除是另一个要确认的动作。'
            + '文档上下文不受影响：下一轮照样带整篇最新的译文。'
            + (wasBusy ? '⚠ 上一轮请求当时还在进行中，已经中止 —— 它的回答不会再落进这段新对话里，'
                       + '那一轮的提问原样留在刚归档的那段对话里。' : '')
            + (adopted ? '模型与推理档位已回到「设置 → 模型 → 默认模型」里对话那一行的默认值。' : ''));
        chatRenderParamBar();
        chatUpdateBar();
    } catch (e) {
        console.error('[chat] clear failed', e);
        try { chatErrorRow('清理', e); } catch (e2) {}
    }
}

// —— 会话历史 ——
// 【存储预算是硬约束，不是脚注】localStorage 一个源就几 MB，翻译历史已经住在里面。
// 所以：条数封顶、字节封顶、最老的先删、删了要说、**永远不许**一次聊天写入把翻译历史挤掉。
// 做法是各用各的 key，只删自己的；自己删光了还写不进去就**可见地失败**，绝不去动别人的 key。
const CHAT_ARCHIVE_LS_KEY = 'chatArchive';
const CHAT_ARCHIVE_MAX = 20;              // 最多留几份对话
const CHAT_ARCHIVE_BYTES = 262144;        // 这一份存储的总字节上限（256 KB）
const CHAT_ARCHIVE_ITEM_BYTES = 65536;    // 单份对话的字节上限（64 KB），超了从最老的消息裁

function chatArchiveLoad() {
    try {
        const raw = localStorage.getItem(CHAT_ARCHIVE_LS_KEY);
        if (!raw) return [];
        const j = JSON.parse(raw);
        const list = (j && Array.isArray(j.items)) ? j.items : [];
        return list.filter(function (it) { return it && typeof it === 'object' && Array.isArray(it.messages); });
    } catch (e) { return []; }
}

function chatArchiveWrite(list) {
    // 返回 { ok, evicted:[titles], why }。**只**写自己的 key，只删自己的条目。
    const evicted = [];
    let cur = list.slice(0, CHAT_ARCHIVE_MAX);
    for (let i = CHAT_ARCHIVE_MAX; i < list.length; i++) evicted.push(list[i]);
    for (;;) {
        let payload;
        try { payload = JSON.stringify({ v: 1, items: cur }); }
        catch (e) { return { ok: false, evicted: evicted, why: '序列化失败' }; }
        if (payload.length > CHAT_ARCHIVE_BYTES && cur.length > 1) {
            evicted.push(cur[cur.length - 1]);
            cur = cur.slice(0, cur.length - 1);          // 最老的在末尾
            continue;
        }
        try {
            localStorage.setItem(CHAT_ARCHIVE_LS_KEY, payload);
            return { ok: true, evicted: evicted, why: '' };
        } catch (e) {
            // 配额爆了。**只**丢自己最老的那一份再试；一份都不剩还写不进去就认输，
            // 绝不去碰 globalHistory —— 用户的文档比关于文档的闲聊值钱。
            if (cur.length > 1) { evicted.push(cur[cur.length - 1]); cur = cur.slice(0, cur.length - 1); continue; }
            return { ok: false, evicted: evicted, why: '浏览器存储配额已满（没有动翻译历史，一条都没删）' };
        }
    }
}

function chatArchiveTitle(msgs) {
    for (let i = 0; i < msgs.length; i++) {
        if (msgs[i] && msgs[i].role === 'user') {
            const s = String(msgs[i].content || '').replace(/\s+/g, ' ').trim();
            if (s) return s.length > 40 ? s.slice(0, 40) + '…' : s;
        }
    }
    return '（无标题对话）';
}

// 单份对话的字节封顶：从**最老的**消息开始丢，直到装得下。丢了要在标题里说清楚。
function chatArchiveTrim(item) {
    let msgs = item.messages.slice();
    let dropped = 0;
    for (;;) {
        let size;
        try { size = JSON.stringify(Object.assign({}, item, { messages: msgs })).length; }
        catch (e) { return { messages: msgs, dropped: dropped }; }
        if (size <= CHAT_ARCHIVE_ITEM_BYTES || msgs.length <= 2) return { messages: msgs, dropped: dropped };
        msgs = msgs.slice(1);
        dropped++;
    }
}

function chatNewConvId() {
    return 'c' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
}

// opts.snapshot=true ⇒ **永远新增一条**，不认领 ChatState.convId。
// 压缩前那份完整记录用的就是这条路：它是一个时间点的备份，不是「这段对话的当前状态」，
// 让它去 upsert 会把它自己随后的每一次归档覆盖掉，「原文永不销毁」当场失效。
function chatArchivePush(reason, opts) {
    try {
        const msgs = ChatState.messages;
        if (!msgs.length) return { ok: true, evicted: [], why: '', empty: true };
        const snapshot = !!(opts && opts.snapshot);
        // 【为什么要有稳定身份】没有它，「取回一份旧对话 → 换个文档 → 再换回来」每来回一次
        // 就在归档里多一份一模一样的副本，几轮就把 20 份的名额和 256 KB 全烧光，
        // 而且真正老的对话会被自己的副本挤掉。有了 convId，同一段对话反复归档就是 upsert。
        if (!snapshot && !ChatState.convId) ChatState.convId = chatNewConvId();
        const item = {
            id: snapshot ? chatNewConvId() : ChatState.convId,
            sessionId: String(ChatState.sessionId || AppState.sessionId || ''),
